l_russian:
 lam_rv.0001.t: "Ультиматум"
 lam_rv.0001.desc: "Все, кто разделяет наше дело, собрались. Пора предъявить наши требования. Ответ даст [lam_rv_lord.GetTitledFirstName].\n\nЕсли сюзерен согласится, требование будет исполнено. Если откажет — война. И тогда все, кто поставил под этим требованием своё имя, будут сражаться вместе."
 lam_rv.0001.send: "Отправить ультиматум"
 lam_rv.0001.wait: "Ещё не время"
 lam_rv.0001.wait_tt: "Можно сначала собрать больше людей, а потом отправить его через решение #high Отправить ультиматум#! в меню решений."
 lam_rv_send_tt: "Наши требования будут предъявлены сюзерену. При отказе все, кто поставил под ними своё имя, вместе пойдут на войну."
 lam_rv_ultimatum_decision: "Отправить ультиматум"
 lam_rv_ultimatum_decision_desc: "От имени собранной нами коалиции мы предъявляем требования сюзерену. Если их не примут — будет война."
 lam_rv_ultimatum_decision_tooltip: "Отправить ультиматум сюзерену"
 lam_rv_ultimatum_decision_confirm: "Отправить"
 lam_rv_stall_title: "Восстание одобрено голосованием, но выдвинуть требование не удалось"
 lam_rv_stall_desc: "[ROOT.Char.Custom('LamRvStall')]"
 lam_rv_stall_joined: "Вы уже поставили своё имя под другим требованием. Новое можно выдвинуть, только когда то дело завершится."
 lam_rv_stall_retry: "Требование уже выдвигалось в течение последнего года. Чтобы попробовать снова, нужно выждать."
 lam_rv_stall_nolaw: "Сейчас нечего потребовать: условия не позволяют требовать ни ограничения прав короны, ни независимости (авторитет короны, положение сюзерена, перемирие или союз с сюзереном и т. п.)."
 lam_rv_stall_other: "Сейчас выдвинуть требование нельзя (идёт война, ведутся другие переговоры или цель изменилась)."
 lam_rv_proxy_title: "Требование поведёт другой член фракции"
 lam_rv_mine: " #P (ваша)#!"
 lam_rv_op: "  #weak мнение [ROOT.Char.MakeScope.Var('lam_fac_loyal').GetValue|0]#!"
 lam_rv_is_held_tt: "Фракция, у которой есть позиция по этому вопросу, подняла восстание или вступила в войну. Пока нет итога, вопрос стоит на месте"
 lam_rv_cv_rise_text: "#high Вопрос: [ROOT.Char.Custom('LamPbCouncilDemand')]#!\nЕсли решение примут, поддержку будут собирать вокруг тех, кто голосовал «за». Голос «за» — это обещание вступить в войну, если требование отвергнут. Голоса «против» и воздержавшиеся согласием на войну не считаются. Если цель или условия изменятся, дело остановят.[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_legacy: "#high Вопрос: поднять ли оружие против правителя#!\nЕсли решение примут, выступление начнут по порядкам этого строя.[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_claimant: "\n\n#high Наш претендент в этом требовании:#! [ROOT.Char.MakeScope.Var('lam_wc_plan_candidate').Char.GetShortUIName]"
 NOT_lam_cv_call_retry_tt: "Этот вопрос недавно уже выносили. Снова его можно вынести через 6 месяцев"
 NOT_lam_cv_committed_tt: "Фракция связана войной или коалицией против сюзерена"
 NOT_lam_cv_no_seat_tt: "Некого провести в совет"
 NOT_lam_fac_back_heir_locked_tt: "Сделка с сюзереном связывает нас в поддержке наследника"
 NOT_lam_fac_head_posture_cd_tt: "С последней смены курса не прошло и полугода"
 NOT_lam_fac_rise_blocked_tt: "Запрет на создание фракций (после проигранной войны и т. п.) ещё не снят"
 NOT_lam_fac_rise_cause_tt: "Нет повода к восстанию: нужна обида фракции, немилость сюзерена (благосклонность -20 или ниже) или запрет на фракции"
 NOT_lam_fac_rise_cd_tt: "Восстание было недавно (после восстания 5 лет, а после отклонённого предложения о восстании 3 года подняться снова нельзя)"
 NOT_lam_pt_head_available_tt: "Глава сейчас не может действовать (несовершеннолетие или заключение, либо идёт собрание, прошение или переговоры)"
 lam_rv_tip_head: "#weak Фракция#! [ROOT.Char.Custom('LamFacName')] #weak глава#![ROOT.Char.Custom('LamUx2Mine')]\n"
 lam_rv_tip_member: "#weak Фракция#! [ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamFacName')][ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamUx2Mine')]\n"
 lam_rv_conf_recent_tt: "За последние 5 лет не должно быть голосования о доверии"
 lam_rv_conf_busy_tt: "Фракция не должна ни заседать, ни ждать ответа сюзерена"
 lam_rv_cp_lost_title: "[lam_rv_cp_lord.GetShortUIName]: власть при дворе захватила фракция. Мои нити перерезаны"
