 lam_is.0002.t: "Расклад сил при дворе"
 lam_is.0002.open: "Из-за чего сейчас схлестнулись фракции при дворе [lam_is_lord.GetShortUIName]:"
 lam_is.0002.a: "Понятно"
 lam_is.0002.beaten: "\n\n#N Наша фракция уступила в придворном вопросе, и её сила слабеет. Три года люди будут легко от нас уходить.#!"
 lam_is.0002.victor: "\n\n#P Наша фракция взяла верх в придворном вопросе, и к нам тянутся люди.#!"
 lam_is.0002.tip_head: "\n\n#high Ход, который стоит сделать сейчас#!\nЕсли мы поддержим одну из сторон в этом споре (раз в год), то заодно попробуем переманить к себе одного неприсоединившегося вассала."
 lam_is.0002.tip_member: "\n\n#high Ход, который стоит сделать сейчас#!\nЧлены фракции тоже могут поддержать сторону на карточке вопроса (раз в год)."
 lam_is.0002.tip_unaligned: "\n\n#high Ход, который стоит сделать сейчас#!\nЯ ни на чьей стороне, и моя сила может качнуть весы. Если на карточке вопроса встать на одну из сторон, моя сила будет лежать на её чаше до самого конца, а если она победит, я получу престиж и мнение обо мне вырастет."
 lam_is_dig_head: "\n\n#high Придворные вопросы#!"
