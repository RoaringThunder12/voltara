 lam_is.0001.crown.b: "Дела моего двора решаю я"
 lam_is_council_title: "#high Места в совете#!"
 lam_is_council_tt: "Спор о местах в совете.\n#high Сохранение нынешнего совета:#! фракции, чьи люди уже сидят в совете.\n#high Требование мест:#! фракции, метящие на должности, или сильные фракции, оставшиеся без места.\nЕсли побеждают требующие, их человек входит в совет.\nПовод: пустующее место в совете говорит в пользу требующих.\n\n#weak Привлечённые неприсоединившиеся вассалы добавляют стороне вес, равный своей силе. К фракциям победившей стороны 3 года стекаются люди, а у проигравших шатается сплочённость и люди уходят. Сюзерен может лишь помогать.#!"
