 lam_is.0001.crown: "Призывы урезать власть короны наконец захлестнули двор. Фракции в один голос требуют понизить авторитет короны на одну ступень.\n\nПримете требование — победители окрепнут, а проигравшие ослабнут. Отвергнете — требовавшие фракции утратят к вам расположение, а их обида станет глубже."
