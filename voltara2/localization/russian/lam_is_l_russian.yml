 lam_is.0001.council: "Фракции, требующие мест в совете, взяли верх при дворе. Они требуют посадить в совет своего человека.\n\nПримете требование — победители окрепнут, а проигравшие ослабнут. Отвергнете — требовавшие фракции утратят к вам расположение, а их обида станет глубже."
 lam_is.0001.council.a: "Посадить их человека в совет"
 lam_is.0001.council.p: "Пообещать им место в течение 1 года"
 lam_is.0001.council.b: "Дела моего двора решаю я"
 lam_is_faith_title: "#high Вера и культура#!"
 lam_is_faith_tt: "Спор о том, как относиться к иным верам и культурам.\n#high Правоверие:#! фракции, чья цель — защита веры, или набожные фракции. Фанатичный сюзерен тоже добавляет им вес.\n#high Терпимость:#! фракции, чья цель — терпимость, или фракции меньшинств по вере или культуре.\nЕсли побеждает терпимость, растёт терпимость культур к их культуре и улучшается мнение иноверцев. Если побеждает правоверие, растёт благочестие.\nПовод: чем больше вассалов иной веры или культуры, тем сильнее довод в пользу терпимости.\n\n#weak Привлечённые неприсоединившиеся вассалы добавляют стороне вес, равный своей силе. К фракциям победившей стороны 3 года стекаются люди, а у проигравших шатается сплочённость и люди уходят. Сюзерен может лишь помогать.#!"
 lam_is_faith_x: "Верность правоверию"
 lam_is_faith_y: "Терпимость"
