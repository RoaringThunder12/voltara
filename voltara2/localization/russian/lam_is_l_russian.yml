 lam_is.0001.faith: "При дворе взяли верх голоса тех, кто призывает великодушно относиться к иным верам и культурам. Фракции требуют терпимости.\n\nЕсли согласиться, победившая сторона усилится, а проигравшая ослабнет. Если отказать, фракции, выдвинувшие требование, охладеют к вам, а их обида станет глубже."
 lam_is.0001.faith.a: "Проявить терпимость"
 lam_is.0001.faith.p: "Пообещать в течение года взять в совет советника иной веры или культуры"
 lam_is.0001.faith.b: "Дела моего двора решаю я"
 lam_is_tax_title: "#high Налоги и ополчение#!"
 lam_is_tax_tt: "Спор о налогах и ополчении, которые причитаются с вассалов.\n#high Сохранение податей:#! фракции, чья цель — усилить авторитет короны, или верные сюзерену, а также вес самого сюзерена.\n#high Облегчение бремени:#! фракции, ищущие уступок или противостоящие сюзерену.\nЕсли победит облегчение, налоги и ополчение вассалов на 5 лет снизятся; если сохранение — на 3 года вырастут.\nПовод: война дольше 1 года и полная казна в мирное время — в пользу облегчения, пустая казна — в пользу сохранения податей.\n\n#weak Привлечённые неприсоединившиеся вассалы добавляют стороне вес, равный их силе. К фракциям победившей стороны 3 года тянутся люди, а у проигравших шатается сплочённость и люди уходят. Сюзерен может лишь помогать.#!"
