 lam_is.0001.heir: "Чаша весов при дворе наконец склонилась на сторону [lam_is_cb.GetShortUIName]. Фракции в один голос требуют: наследником должен стать [lam_is_cb.GetShortUIName], а не [lam_is_ca.GetShortUIName].\n\nПримете требование — победители окрепнут, а проигравшие ослабнут. Отвергнете — требовавшие фракции утратят к вам расположение, а их обида станет глубже."
 lam_is.0001.heir.a: "Пусть наследником станет [lam_is_cb.GetShortUIName]"
 lam_is.0001.heir.b: "Дела моего двора решаю я"
 lam_is_crown_title: "#high Авторитет короны#!"
 lam_is_crown_tt: "Спор фракций, желающих урезать авторитет короны, с теми, кто его защищает.\n#high Защита короны:#! фракции, чья цель — укрепить авторитет короны, или верные сюзерену, а также вес самой короны.\n#high Ограничение короны:#! фракции, чья цель — ослабить авторитет короны.\nЕсли побеждают сторонники ограничения, авторитет короны понижается на одну ступень.\nПовод: слабая корона или тирания сюзерена говорят в пользу ограничения.\n\n#weak Привлечённые неприсоединившиеся вассалы добавляют стороне вес, равный своей силе. К фракциям победившей стороны 3 года стекаются люди, а у проигравших шатается сплочённость и люди уходят. Сюзерен может лишь помогать.#!"
