 lam_is_war_evt_c: "Призывы взяться за меч заполнили двор. Фракции хотят, чтобы правитель выступил в поход."
 lam_is_war_evt_p: "Уставший от войны двор требует мира. Фракции в один голос призывают закончить войну с [Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]."
 lam_is_war_acc_c: "Пообещать поход в течение 2 лет"
 lam_is_war_acc_p: "Заключить белый мир"
 lam_is_war_title_c: "Обсуждение похода"
 lam_is_war_title_p: "Война с [Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]"
 lam_is_war_tt_c: "Спор о том, начинать ли войну.\n#high Поход:#! фракции, ищущие славы или воинственные, фракции, желающие вернуть утраченные земли, и фракции, главы которых храбры, честолюбивы или гневливы.\n#high Сохранить мир:#! фракции, берегущие нынешнюю силу или ждущие уступок, фракции, противостоящие правителю, и фракции, главы которых трусливы, довольны своим или ленивы. Недавняя война тоже добавляет вес этой стороне.\nЕсли победит сторона похода, правителю придётся пообещать поход в течение 2 лет."
 lam_is_war_tt_p: "Спор о том, продолжать ли эту войну.\n#high Сражаться дальше:#! фракции, ищущие славы или воинственные, фракции, желающие вернуть утраченные земли, и фракции, главы которых храбры, честолюбивы или гневливы. Если война идёт успешно, ход войны тоже добавляет вес этой стороне.\n#high Заключить мир:#! фракции, берегущие нынешнюю силу или ждущие уступок, фракции, противостоящие правителю, и фракции, главы которых трусливы, довольны своим или ленивы. Если война проигрывается или тянется дольше 3 лет, ход войны добавляет вес этой стороне.\nЕсли победит сторона мира, война закончится белым миром."
 lam_is_heir_title: "#high Вопрос наследования#!"
 lam_is_heir_tt: "Фракции хотят поставить наследником другого ребёнка вместо нынешнего.\n#high Сторона наследника:#! фракции, стоящие за нынешнего наследника, и вес короны.\n#high Сторона претендента:#! фракции, стоящие за этого ребёнка.\nЕсли победит сторона претендента, правитель решает, менять ли наследника. При отказе фракции, выдвигавшие ребёнка, сочтут, что ими пренебрегли.\nПравота: если нынешний наследник несовершеннолетний, недееспособный или бастард — она на стороне претендента; если претендент несовершеннолетний — на стороне наследника. Законное наследование само по себе тоже даёт правоту наследнику.\n\n#weak Переманенный неприсоединившийся вассал добавляет стороне вес своей силы. К победившим фракциям 3 года тянутся люди, а у проигравших слабеет сплочённость и люди уходят. Правитель может лишь помочь.#!"
