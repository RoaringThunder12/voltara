l_russian:
 lam_is_none: ""
 lam_is_even: "Силы равны"
 lam_is_push_tt: "Вложить свой вес в этот вопрос. Раз в год на все вопросы вместе.\nПравитель 8 (100 престижа) · глава 10 + 1/10 влияния (100 престижа) · член фракции 6 (50 престижа) · неприсоединившийся 8 (75 престижа)\nГлава также пытается переманить одного неприсоединившегося вассала (чем лучше тот обо мне думает, тем охотнее переходит).\nЕсли неприсоединившийся встанет на чью-то сторону, его сила будет на ней до конца, а при победе он получит престиж и расположение глав этой стороны.\nГлавы фракций противной стороны это запомнят."
 lam_is_push_cd_tt: "В этом году вы уже вкладывали вес в придворный вопрос"
