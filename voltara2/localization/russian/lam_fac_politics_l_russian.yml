l_russian:
 lam_pol_held_weak: "#N Опора власти шатается.#! Если нехватка политического веса, сплочённости или ключевых должностей продлится 6 месяцев и дольше, власть будет утрачена."
 lam_pol_held_yes: "#P Сейчас вы вершите делами державы из-за спины правителя.#! Нужно сохранить политическую опору и ключевые должности."
 lam_pol_take_invalid: "Не хватает опоры или срока удержания, нужных, чтобы взять дела державы в свои руки"
 lam_pol_office_grudge_title: "Недовольство фракции, оттеснённой от должностей"
 lam_pol_office_grudge_desc: "Фракция [lam_pol_aggrieved.GetShortUIName], несмотря на немалую политическую опору, уже год не получает места в совете, тогда как другая фракция занимает сразу несколько ключевых должностей. Благосклонность -5, сплочённость +2. Если распределить должности, отсчёт отстранения остановится."
 lam_pol_next_vote: "Определяет курс на собрании фракции"
 lam_pol_next_contract: "Ждёт исполнения принятой сделки"
 lam_pol_next_alliance: "Ждёт ответа другой фракции на предложение коалиции"
 lam_pol_next_rival: "Сдерживает возвышение фракции-соперницы, пользующейся покровительством"
 lam_pol_next_office: "Готовит почву, чтобы потребовать мест в совете по своему политическому весу"
 lam_pol_empty_peers: "Нет прямых вассалов, из которых сложилась бы политическая опора."
 lam_pol_empty_banned: "Действует запрет на фракции. Подпольные организации могут оставаться невидимыми, пока о них не добыты сведения."
 lam_pol_empty_cooldown: "Пока новая фракция укрепляется, естественное появление других фракций ненадолго откладывается."
 lam_pol_empty_preparing: "Те, кто хочет основать фракцию, собирают сочувствующих."
 lam_pol_empty_general: "Организованных фракций нет. При небольшом дворе или правлении без острых столкновений интересов вполне можно действовать и вне фракций. К объединению подталкивают передача власти, тирания, недовольство, отстранение от должностей и личное честолюбие."
 lam_pol_ready_yes: "#P Опора и срок удержания достаточны, чтобы попытаться взять дела державы в свои руки.#!"
 lam_pol_ready_wait: "Все условия нужно удерживать ещё около [Character.MakeScope.ScriptValue('lam_pol_hold_left_value')|0] мес."
 lam_pol_ready_no: "Сначала восполните недостающую опору — только тогда начнётся срок подготовки к захвату власти."
 lam_pol_check_Org_yes: "#P ✔#! Не менее 3 членов фракции · существует не менее [EmptyScope.ScriptValue('lam_tune_pol_min_age')|0] лет"
 lam_pol_check_Org_no: "#N ✘#! Не менее 3 членов фракции · существует не менее [EmptyScope.ScriptValue('lam_tune_pol_min_age')|0] лет"
 lam_pol_check_Base_yes: "#P ✔#! Военная доля от [EmptyScope.ScriptValue('lam_tune_seize_share')|0]% · политическая доля от [EmptyScope.ScriptValue('lam_tune_pol_own_share')|0]%"
 lam_pol_check_Base_no: "#N ✘#! Военная доля от [EmptyScope.ScriptValue('lam_tune_seize_share')|0]% · политическая доля от [EmptyScope.ScriptValue('lam_tune_pol_own_share')|0]%"
 lam_pol_check_Unity_yes: "#P ✔#! Сплочённость не ниже [EmptyScope.ScriptValue('lam_tune_seize_cohesion')|0]"
 lam_pol_check_Unity_no: "#N ✘#! Сплочённость не ниже [EmptyScope.ScriptValue('lam_tune_seize_cohesion')|0]"
 lam_pol_check_Office_yes: "#P ✔#! Не менее 2 мест в совете, среди них управляющий или тайный советник — либо регентство главы"
 lam_pol_check_Office_no: "#N ✘#! Не менее 2 мест в совете, среди них управляющий или тайный советник — либо регентство главы"
 lam_pol_check_Lever_yes: "#P ✔#! Одно из: слабый авторитет короны (не выше [EmptyScope.ScriptValue('lam_tune_pol_weak_crown')|0]) · сильный крючок на правителя · регентство"
 lam_pol_check_Lever_no: "#N ✘#! Одно из: слабый авторитет короны (не выше [EmptyScope.ScriptValue('lam_tune_pol_weak_crown')|0]) · сильный крючок на правителя · регентство"
 lam_pol_check_Rival_yes: "#P ✔#! Ни одна несоюзная фракция-соперница не превышает [EmptyScope.ScriptValue('lam_tune_seize_rival_share')|0]% военной и [EmptyScope.ScriptValue('lam_tune_pol_rival_share')|0]% политической доли"
 lam_pol_check_Rival_no: "#N ✘#! Ни одна несоюзная фракция-соперница не превышает [EmptyScope.ScriptValue('lam_tune_seize_rival_share')|0]% военной и [EmptyScope.ScriptValue('lam_tune_pol_rival_share')|0]% политической доли"
