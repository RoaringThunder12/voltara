 lam_ux_relief_legacy: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство из-за застарелой неприязни отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_relief_office: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство из-за отстранения от должностей отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_relief_policy: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство политикой правления отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_relief_promise: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство из-за невыполненных обещаний отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_relief_repression: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство, рождённое памятью о гонениях, отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_relief_succession: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство из-за спора о наследовании отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_relief_wealth: "\n\n#P Недавнее смягчение#!\n[Character.MakeScope.ScriptValue('lam_ux_relief_age_value')|0] мес. назад недовольство из-за наград и богатства отчасти утихло. Но это не значит, что прочие обиды забыты."
 lam_ux_report_exact: "\n\n#high Донесение изнутри · [Character.MakeScope.Var('lam_ux_report_year').GetValue|0] г., [Character.MakeScope.ScriptValue('lam_ux_report_age_value')|0] мес. назад#!\nПо сведениям, полученным от [Character.MakeScope.Var('lam_ux_report_source').Char.GetTitledFirstName], эта фракция [Character.Custom('LamUxObservedExact')].\n#weak Это донесение того времени. С тех пор намерения могли измениться; ни сроки, ни успех не гарантированы.#!"
 lam_ux_report_inside: "\n\n#weak О собраниях и предложениях своей фракции вам сообщают напрямую. Но тайных намерений других фракций это не открывает.#!"
 lam_ux_report_partial: "\n\n#high Внутренние движения · [Character.MakeScope.Var('lam_ux_report_year').GetValue|0] г., [Character.MakeScope.ScriptValue('lam_ux_report_age_value')|0] мес. назад#!\nПо сведениям, полученным от [Character.MakeScope.Var('lam_ux_report_source').Char.GetTitledFirstName], эта фракция [Character.Custom('LamUxObservedPartial')].\n#weak Это донесение того времени. С тех пор намерения могли измениться; ни сроки, ни успех не гарантированы.#!"
 lam_ux_report_rumor: "\n\n#high Слухи изнутри · [Character.MakeScope.Var('lam_ux_report_year').GetValue|0] г., [Character.MakeScope.ScriptValue('lam_ux_report_age_value')|0] мес. назад#!\nОт [Character.MakeScope.Var('lam_ux_report_source').Char.GetTitledFirstName] стало известно, что соратники что-то обсуждают. Какова их цель, выяснить не удалось."
 lam_ux_report_unknown: "\n\n#weak Новых донесений о готовящихся планах нет. Это не значит, что ничего не происходит. Нужны связи внутри и настоящий осведомитель: одними интригами тайных намерений не узнать.#!"
