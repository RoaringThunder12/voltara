 lam_pd_kind_council: "Должность «[ROOT.Char.Custom('LamPdOffice')]» для [ROOT.Char.MakeScope.Var('lam_lf_beneficiary').Char.GetTitledFirstName]"
 lam_pd_kind_taxes: "Облегчение налогового бремени"
 lam_pd_kind_release: "Освобождение соратников"
 lam_pd_kind_faith: "Совет единоверцев"
 lam_pd_kind_no_revoke: "Сдержанность в лишении титулов"
 lam_pd_kind_campaign: "Поход за возвращение земель"
 lam_pd_kind_none: "Закрытое требование"
 lam_pd_petition_title: "Прошение от имени фракции"
 lam_pd_petition_desc: "Фракция [lam_pd_head.GetTitledFirstName] требует: [lam_pd_head.Custom('LamPdRequest')].\n\nДенежные условия: [lam_pd_head.MakeScope.Var('lam_pd_gold').GetValue|0] золота. Если предложить денежную замену, фракция проголосует заново. Если изменится цель или стоимость, исполнить требование будет нельзя. Срок ответа — 60 дней."
 lam_pd_accept: "Я выполню это требование."
 lam_pd_counter: "Вместо этого предложу денежное возмещение."
 lam_pd_defer: "Вернёмся к этому через месяц."
 lam_pd_refuse: "Это требование я принять не могу."
 lam_pd_submit_desc: "Для серьёзных требований сначала нужно поручение фракции. Даже после одобрения требуется согласие правителя и само исполнение. О денежной помощи глава просит в пределах своих полномочий."
 lam_pd_ballot_desc: "Вопрос о прошении: [lam_cr_head.Custom('LamPdRequest')]. Одобрение даёт право передать требование. Будет ли оно исполнено, зависит от ответа правителя и нынешних условий."
 lam_pd_result_title: "Чем кончилось прошение"
 lam_pd_result_desc: "Прошение: [lam_pd_head.GetTitledFirstName]. Итог: [lam_pd_head.Custom('LamPdResult')]."
 lam_pd_kept: "Исполнено"
 lam_pd_refused: "Отказано"
 lam_pd_void: "Закрыто: условия изменились или срок истёк"
 lam_pd_old_request: "Время для этого прошения упущено. Фракция снова придёт к согласию и попросит в другой раз."
 lam_pd_recruit_title: "Стать ли новым соратником?"
 lam_pd_recruit_desc: "[lam_rc_head.GetTitledFirstName] предлагает [ROOT.Char.MakeScope.Var('lam_pd_recruit_price').GetValue|0] золота за переход. Если согласиться, золото будет выплачено, а принадлежность сменится. Придётся смириться и с тем, как это скажется на отношениях с прежними соратниками. Если не ответить в течение 100 дней с начала переговоров, всё закончится отказом."
 lam_pd_recruit_join: "Принять условия и присоединиться."
 lam_pd_recruit_decline: "Я останусь на нынешнем пути."
 lam_pd_retain_title: "Цена, чтобы удержать соратника"
 lam_pd_retain_desc: "К [lam_pd_recruit_person.GetTitledFirstName] обратилась с предложением другая фракция. Если выплатить [lam_pd_recruit_person.MakeScope.Var('lam_pd_recruit_price').GetValue|0] золота, нынешнее сотрудничество удастся сохранить на год. Это возможно, лишь пока предложение в силе."
 lam_pd_retain_pay: "Заплатить и удержать."
 lam_pd_retain_leave: "Пусть каждый решает за себя."
 lam_pd_recruit_success: "Новый соратник после переговоров"
 lam_pd_pact_title: "Коалиция с ясной целью"
 lam_pd_pact_desc: "Сотрудничество — только ради цели, к которой стремятся обе стороны: общий кандидат в наследники, раздел должностей, снижение авторитета короны или совместная защита от репрессий. Соглашение действует два года или до достижения цели. Соглашения о должностях, наследовании и законах не обязывают давать войска для восстания."
 lam_pd_pact_possible_tt: "Обеим сторонам нужны свободное место для коалиции и конкретная общая цель"
 lam_pd_information_tt: "Нужен настоящий секрет, неизвестный правителю, или свежие сведения с закрытого важного собрания, в котором вы участвуете"
 lam_pd_information_title: "Донесение с доказательствами"
 lam_pd_information_desc: "От осведомителя получены известный ему секрет или сведения о ещё действующем внутреннем курсе. Донос сам по себе не даёт ни крючка, ни права на наказание. За одно и то же собрание повторно не награждают."
 lam_pd_fabricate_interaction: "Сфабриковать политический слух"
 lam_pd_fabricate_interaction_desc: "Потратить 100 престижа и три месяца на сочинение слуха. Чтобы слух не проверили, ваша интрига должна превышать интригу цели не менее чем на 6. Даже при успехе останутся лишь полгода подозрений — ни улик преступления, ни крючка. При разоблачении — потеря 150 престижа и доверия."
 lam_pd_rumor_title: "Недоказанный слух"
 lam_pd_rumor_desc: "Об этой фракции ходят слухи, но подтверждённых доказательств нет. Переговоры могут на время осложниться, но основанием для наказания это быть не может."
 lam_pd_forgery_exposed: "Подлог раскрыт"
 lam_pd_false_report_opinion: "Ложное донесение раскрыто"
 lam_pd_wait: "Пока посмотрим, как всё обернётся."
 lam_pd_obstruct_title: "Против поданного прошения собираются противники"
 lam_pd_story_contact: "Разузнаем условия."
 lam_pd_story_contact_desc: "Появилась возможность связаться с новой фракцией. Решать о переходе стоит, когда станут ясны настоящие условия поддержки и то, как отнесётся нынешняя фракция."
 lam_pd_story_gold: "Подадим официальное прошение о поддержке."
 lam_pd_public_information: "За одно лишь открытое обсуждение сотрудничества судить нельзя."
 lam_pd_promised: "Обещание дано — ждёт исполнения"
 lam_pd_broken: "Срок исполнения истёк — обещание нарушено"
