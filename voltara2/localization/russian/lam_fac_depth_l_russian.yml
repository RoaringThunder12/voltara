 lam_st.0100.t: "Разлад под одним знаменем"
 lam_st.0100.desc: "Возражения со стороны [ROOT.Char.MakeScope.Var('lam_st_reconcile_member').Char.GetTitledFirstName] звучат раз за разом. До разрыва с нами пока не дошло, но и после собраний недовольство никто не скрывает.\n\nЕсли публично признать прежние заслуги, можно, немного поступившись собственным достоинством, ещё наладить отношения."
 lam_st.0100.a: "Ваши заслуги не забыты."
 lam_st.0100.a.tt: "Потратить 150 престижа, чтобы признать заслуги. Разлад с этим человеком немного утихнет, а его заслуги перед фракцией возрастут. Принятое решение остаётся в силе."
 lam_st.0100.b: "Решение принято."
 lam_st_public_turn: "Новые веяния при дворе"
 lam_st_public_rise: "Фракция [lam_cr_head.GetTitledFirstName] постановила поднять восстание против правителя."
 lam_st_public_loyal: "Фракция [lam_cr_head.GetTitledFirstName] единодушно решила поддержать престол."
 lam_st_public_withdraw: "Фракция [lam_cr_head.GetTitledFirstName] постановила выйти из придворной партии."
 lam_st_public_dissolve: "Фракция [lam_cr_head.GetTitledFirstName] постановила распуститься."
 lam_st_vote_passed: "На собрании фракции [lam_cr_head.GetTitledFirstName] вопрос принят.\nЗа [TopScope.GetValue('lam_cr_result_yes')|0] · Против [TopScope.GetValue('lam_cr_result_no')|0] · Всего [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_rejected: "На собрании фракции [lam_cr_head.GetTitledFirstName] вопрос отклонён.\nЗа [TopScope.GetValue('lam_cr_result_yes')|0] · Против [TopScope.GetValue('lam_cr_result_no')|0] · Всего [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_cancelled: "Собрание фракции [lam_cr_head.GetTitledFirstName] отменено: обстановка изменилась.\nЗа [TopScope.GetValue('lam_cr_result_yes')|0] · Против [TopScope.GetValue('lam_cr_result_no')|0] · Всего [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_lf.0100.a.tt: "В течение 2 лет их выдвижение на должность будет первоочередным, а угроза раскола отложится на 6 месяцев. Если назначение состоится, компромисс будет достигнут; если же срок истечёт, хотя назначение было возможно, разлад углубится. Назначение правителем не гарантируется."
 lam_lf.0100.a: "О следующей должности я буду просить для вас."
 lam_lf.0100.b.tt: "Потратить 150 престижа. Разлад у несогласных членов фракции смягчится на одну ступень, а сплочённость вырастет на 5. Принятое решение не изменится."
 lam_lf.0100.b: "Я публично воздам должное заслугам соратников."
 lam_lf.0100.c: "Уступок не будет."
 lam_lf.0100.desc: "Вокруг [ROOT.Char.MakeScope.Var('lam_lf_caucus_rep').Char.GetTitledFirstName] собрались недовольные соратники. Одной перебранкой дело не кончится. Раз за разом они выступали против по одному и тому же вопросу и теперь действуют заодно.\n\nПризнать их долю или отстоять свою власть?"
 lam_lf.0100.t: "Несогласие обретает единый голос"
 lam_lf.0300.a: "Я поддержу [lam_lf_succ_a.GetTitledFirstName]."
 lam_lf.0300.b: "Я поддержу [lam_lf_succ_b.GetTitledFirstName]."
 lam_lf.0300.c: "Пока я не встану ни на чью сторону."
 lam_lf.0300.desc: "Стоит соратникам заговорить о том, что будет после ухода главы, как звучат два имени: [lam_lf_succ_a.GetTitledFirstName] и [lam_lf_succ_b.GetTitledFirstName].\n\nВремя передавать руководство ещё не пришло, но поддержка, оказанная сейчас, может решить исход того дня."
 lam_lf.0300.t: "Кому достанется это знамя"
 lam_lf.0300.tt: "Если в ближайшие 3 года руководство перейдёт к новому главе, а этот человек останется среди последних кандидатов, ваше влияние во фракции будет засчитано в его поддержку. Если право будет утрачено из-за смерти, ухода и т. п., поддержка теряет силу."
 lam_lf_broken_word_opinion: "Нарушение политического обещания"
