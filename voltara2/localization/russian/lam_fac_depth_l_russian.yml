 lam_pt_action_lapsed: "Обстоятельства изменились"
 lam_pt_arms_ready_tt: "Вы должны быть главой фракции с возможностью действовать, а в ядре или среди сочувствующих должен найтись правитель, который может сейчас вступить в войну."
 lam_pt_arms_result: "Военная помощь фракции"
 lam_pt_arms_result_desc: "Откликнулись на призыв и вступили в войну: [TopScope.GetValue('lam_pt_arms_report_count')|0]. Соратники соглашались или отказывались, смотря по отношениям и сплочённости."
 lam_pt_demand_lapsed: "Прошение не удалось подать: изменились его адресат или условия. Нужно заново взглянуть, какие требования сейчас возможны. Срок ожидания не назначается."
 lam_pt_demand_ready_tt: "Вы должны возглавлять фракцию, достичь совершеннолетия и быть на свободе. Не должно идти собрание, прошение или переговоры, а срок ожидания прошения должен истечь."
 lam_pt_depart_digest_desc: "С прошлых известий [TopScope.GetValue('lam_pt_depart_report_count')|0] чел. передумали и покинули фракцию. Кто-то примкнул к другой фракции, кто-то остался неприсоединившимся."
 lam_pt_depart_digest_title: "Покинувшие фракцию"
 lam_pt_head_available_tt: "Вы должны возглавлять фракцию, достичь совершеннолетия и быть на свободе; при этом не должно идти собрание, прошение или переговоры."
 lam_pt_order_cooldown_tt: "Если провести меру или созвать собрание о наследнике, реорганизовать фракцию снова будет нельзя 1 год. Если просто закрыть окно, срока ожидания не будет."
 lam_pt_order_desc: "Ради будущего фракции пора навести порядок в людях и в курсе. Кого возвысить, а с кем расстаться? Если дело касается наследования, сперва нужно заручиться согласием соратников."
 lam_pt_order_heir_tt: "Созвать собрание фракции по вопросу поддержки кандидатуры [lam_ds_heir.GetShortUIName]. Кандидат фракции сменится, только если вопрос будет принят. Чтобы сменить настоящего наследника правителя, нужно отдельно подать прошение."
 lam_pt_order_lapsed: "Положение того, кого это касалось, или дела фракции изменились, и эту меру провести не удалось."
 lam_pt_order_ready_tt: "Вы должны возглавлять фракцию, достичь совершеннолетия и быть на свободе. Не должно идти собрание, прошение или переговоры, а срок ожидания реорганизации фракции должен истечь."
 lam_pt_rank_cd_tt: "После изменения положения этого человека во фракции должно пройти 6 месяцев."
 lam_pt_recruit_ready_tt: "Не должно быть текущей вербовки и срока ожидания после неё. Нужно иметь не менее 60 золота и правителя, к которому можно обратиться."
 lam_pt_recruit_started: "Вербовка начата"
 lam_pt_recruit_started_desc: "Посланец отправлен — его примет [lam_pd_recruit_person.GetShortUIName]. На встречу ушло 10 золота, ответ придёт через месяц-другой. Присоединение зависит от решения другой стороны и исхода переговоров."
 lam_wc_council_claimant: "\n\n#high Претендент по этому требованию:#! [lam_cr_head.MakeScope.Var('lam_wc_plan_candidate').Char.GetShortUIName]"
 lam_wc_crown_candidate: "Возвести на престол: [ROOT.Char.MakeScope.Var('lam_wc_candidate').Char.GetShortUIName]"
 lam_wc_defender: "Лагерь защитников правителя"
 lam_wc_defending: "Сражается за правителя"
 lam_wc_fighting: "Участвует в гражданской войне"
 lam_wc_front_card: "#weak Фактический фронт:#! [Character.Custom('LamWcObjective')]"
 lam_wc_front_tt: "#high Фактическое участие и требования#!\nПоказывает, какое требование на деле поддерживается в нынешней коалиции и гражданской войне.\n\n[Character.Custom('LamWcPeacetimeHeir')]\n[Character.Custom('LamWcSharedFront')]"
 lam_wc_independence: "Добиться независимости"
 lam_wc_liberty: "Ограничить власть правителя"
 lam_wc_other_preparation: "Сплотиться вокруг требований мятежников"
 lam_wc_other_revolt: "Добиться выполнения требований мятежников в нынешней гражданской войне"
