 lam_lf_contested_opinion: "Соперничество за руководство фракцией"
 lam_lf_exchange_interaction: "Переговоры: поддержка наследника за должность"
 lam_lf_exchange_interaction_desc: "Другая фракция помогает утвердить поддерживаемого вами наследника, а вы взамен обещаете в течение 2 лет после его назначения подать прошение о должности для её главы. Если при сохранении положения и права обещание будет нарушено, останется недоверие."
 lam_lf_exchange_notice: "Заключён уговор: поддержка наследника в обмен на выдвижение на должность. Наследник должен быть назначен в течение 3 лет, а обещанное назначение на должность — в течение следующих 2 лет. Выставлять войска на войну этот уговор не обязывает."
 lam_lf_kind_land: "Пожалование: [Character.MakeScope.Var('lam_lf_land_title').Title.GetName] для [Character.MakeScope.Var('lam_lf_beneficiary').Char.GetTitledFirstName]"
 lam_lf_land_petition_interaction: "Прошение о земле в награду за заслуги"
 lam_lf_land_petition_interaction_desc: "Получатель выбирается по заслугам во фракции и прежним наградам, после чего подаётся прошение об одном графстве, которое правитель может пожаловать. Кандидат и графство рассматриваются на собрании фракции; даже после одобрения голосованием нужно согласие правителя."
 lam_lf_memory_arrest: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName] — не забыто, как у [Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName] отняли свободу"
 lam_lf_memory_betrayal: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName] — не забыто, как у [Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName] отняли обещанное"
 lam_lf_memory_dismissal: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName] — не забыто, как у [Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName] отняли должность"
 lam_lf_memory_revocation: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName] — не забыто, как у [Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName] отняли земли"
 lam_lf_news_exchange_broken: "Фракция [lam_lf_news_head.GetTitledFirstName], получив поддержку для своего наследника, так и не выполнила обещание о выдвижении на должность. Между двумя фракциями осталось недоверие."
 lam_lf_news_government_falters: "С придворной партии [lam_lf_news_head.GetTitledFirstName] спрашивают за упадок в годы её власти."
 lam_lf_news_government_prospers: "Придворная партия [lam_lf_news_head.GetTitledFirstName] завоёвывает доверие: в годы её власти держава оправилась и добилась успехов."
 lam_lf_news_title: "Память двора"
 lam_lf_public_bad: "Держит ответ за промахи в годы своей власти"
 lam_lf_public_caucus: "Вокруг [Character.MakeScope.Var('lam_lf_caucus_rep').Char.GetTitledFirstName] собирается внутренняя оппозиция"
 lam_lf_public_exchange: "Заключён договор о поддержке наследника и должностях"
 lam_lf_public_good: "Завоёвывает доверие успехами в годы своей власти"
 lam_ux_ballot_confidence: "Вотум недоверия: добавляется половина заслуг перед фракцией."
 lam_ux_ballot_court: "Вступление в придворную партию или выход из неё: добавляется половина положения при дворе."
 lam_ux_ballot_detail: "\n\n#high Голос на текущем собрании: [Character.MakeScope.Var('lam_cr_weight').GetValue|1]#!\nВлияние при открытии [Character.MakeScope.Var('lam_ux_ballot_base').GetValue|1] + вес вопроса [Character.MakeScope.Var('lam_ux_ballot_bonus').GetValue|1]\n[Character.Custom('LamUxBallotReason')]\n#weak Значение закреплено при открытии собрания. Последующие перемены в навыках и должностях не меняют вес этого голоса. Склонность голосовать за или против здесь ни при чём.#!"
 lam_ux_ballot_heir: "Наследование и трон: добавляется половина знатности и славы."
 lam_ux_ballot_idle: "\n\nВ зависимости от вопроса меняется вес военной силы, положения при дворе, славы и заслуг. На собраниях своей фракции вы также видите вес голосов, закреплённый при открытии."
 lam_ux_ballot_legacy: "\n\nГолос на этом собрании: [Character.MakeScope.Var('lam_cr_weight').GetValue|1]\n#weak Значение закреплено при открытии. Разбивка по статьям для этого собрания не сохранилась.#!"
 lam_ux_ballot_normal: "Для этого вопроса берётся общее влияние на момент открытия."
 lam_ux_ballot_rise: "Восстание: добавляется половина военной силы и навык военного дела (не более 5)."
 lam_ux_basis1_court: "Положение при дворе"
 lam_ux_basis1_economy: "Богатство"
