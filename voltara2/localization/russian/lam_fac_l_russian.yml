 lam_faction.0400.t: "Двор после чистки"
 lam_faction.0400.desc: "В тот вечер, когда увели [lam_purged.GetTitledFirstName], при дворе было на удивление тихо. По коридорам ползли приглушённые голоса, и стоило взглядам встретиться, каждый первым опускал глаза."
 lam_faction.0400.desc.head: "\n\nУвели не кого-нибудь, а главу фракции [lam_purge_lead.GetFirstName]. Лишившись вожака, стая либо разбегается, либо скрежещет зубами — одно из двух."
 lam_faction.0400.desc.core: "\n\nУвели не кого-нибудь, а человека из ядра фракции [lam_purge_lead.GetFirstName]. [lam_purge_lead.GetFirstName] хранит молчание, и это молчание тяжелее любых слов."
 lam_faction.0400.a: "Успокоить остальных: вина лежит лишь на одном."
 lam_faction.0400.b: "Сделать из этого пример. Все наверняка видели."
 lam_faction.0400.c: "Распустить эту фракцию вовсе."
 lam_faction.0500.t: "Ночь раскола"
 lam_faction.0500.desc: "Посреди зала аудиенций [lam_fs_new.GetTitledFirstName] поворачивается спиной к [lam_fs_lead.GetTitledFirstName]. Те, кто долго стоял под одним знаменем, этой ночью раскалываются надвое. Сторонники один за другим встают за спину [lam_fs_new.GetFirstName].\n\nИ оба взгляда обращены на меня."
 lam_faction.0500.a: "Встать на сторону [lam_fs_lead.GetFirstName]."
 lam_faction.0500.b: "Встать на сторону [lam_fs_new.GetFirstName]."
 lam_faction.0500.c: "Не вставать ни на чью сторону."
 lam_fac_stage_8: "#P Верность#!"
