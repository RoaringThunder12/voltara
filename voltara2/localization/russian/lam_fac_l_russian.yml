 lam_faction.1020.g.bribe: "#P Отдаю:#! тайные деньги лично главе.\n"
 lam_faction.1020.a.oath: "#N Получаю:#! клятву верности на пять лет.\n"
 lam_faction.1020.a.heir: "#N Получаю:#! поддержку моего наследника (пять лет).\n"
 lam_faction.1020.a.disband: "#N Получаю:#! роспуск фракции.\n"
