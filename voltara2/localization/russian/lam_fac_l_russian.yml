 lam_fac_bar_favour: "Благосклонность"
 lam_fac_btn_favour: "Приблизить"
 lam_fac_btn_favour_tt: "Поддержать эту фракцию. Благосклонность +15, мнение главы +20. На два года она получает приоритетный доступ ко двору, а у прежней поддерживаемой фракции он отнимается. До двух соперничающих фракций ответят противодействием, союзом или новым сближением. Стоит 75 престижа, раз в год для каждой фракции. Станет ли она придворной партией, решает отдельное голосование."
 lam_fac_btn_slight: "Отдалить"
 lam_fac_btn_slight_tt: "Оттеснить эту фракцию. Благосклонность -15, мнение главы -20. На два года её положение при дворе слабеет, и она затаивает обиду. Благосклонность другой влиятельной фракции +5. Оттеснённая фракция ответит противодействием, союзом или новым сближением. Раз в год для каждой фракции."
 lam_fac_stance_loyalist: "Роялисты (люди правителя)"
 lam_fac_stance_dynastic: "Партия наследника (стоит за определённого наследника)"
 lam_fac_tier_1: "#high Ядро#!"
 lam_fac_tier_2: "Приближённый"
 lam_fac_tier_3: "#weak Сочувствующий#!"
