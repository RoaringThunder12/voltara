 lam_fac_buyout_decision: "Выкупить нити"
 lam_fac_buyout_decision_desc: "Золото вместо меча. Заплатить серому кардиналу и вернуть себе трон. Алчные, довольные своим и те, чья сила на исходе, соглашаются охотнее, а честолюбцы редко выпускают власть из рук."
 lam_fac_buyout_decision_tt: "Если согласятся, я плачу доход за три года (не меньше 150) и обретаю свободу: конец и регентству, и их крючку на мне. Если откажут, золото останется при мне, но я потеряю престиж. Ожидание (3 года) общее с дворцовым переворотом."
 lam_fac_buyout_decision_tooltip: "Выкупить нити"
 lam_fac_buyout_gold_tt: "Есть золото на сумму дохода за три года (не меньше 150)"
 lam_buyout_yes_title: "Нити выкуплены. Трон снова мой"
 lam_buyout_no_title: "Серый кардинал отказался от платы"
 lam_fac_defiance_mid_modifier: "Неповиновение вассалов (среднее)"
 lam_fac_defiance_mid_modifier_desc: "Фракция средней силы (15–35% силы вассалов) не подчиняется и недодаёт ополчение и налоги."
 lam_fac_defiance_minor_modifier: "Неповиновение вассалов (слабое)"
 lam_fac_defiance_minor_modifier_desc: "Небольшая фракция (меньше 15% силы вассалов) не подчиняется и немного недодаёт ополчение и налоги."
