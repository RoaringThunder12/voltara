 lam_fac_nf_betrayed: "нарушенное обещание"
 lam_fac_nf_wary: "настороженность к придворной партии"
 lam_fac_nf_heir: "поддержка другого наследника"
 lam_fac_nerve2_sep: " · [Character.Custom('LamFacNerve2')] +[Character.MakeScope.Var('lam_fac_nf2v').GetValue|0]"
 lam_faction.0800.tips_head: "\n\n#high Ходы, которые стоит сделать сейчас#!"
 lam_faction.0800.tip1: "\n· [ROOT.Char.Custom('LamFacTip1')]"
 lam_faction.0800.tip2: "\n· [ROOT.Char.Custom('LamFacTip2')]"
 lam_faction.0800.take_deal: "Сесть за стол переговоров с фракцией [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]"
 lam_faction.0800.take_favour: "Оказать благосклонность фракции [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]"
 lam_faction.0800.take_press: "Велеть придворной партии прижать другую фракцию"
 lam_fac_tip1_deal: "Фракция [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName] собирается (решимость [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]). Пока она не восстала, можно заключить с ней сделку («Сделка с фракцией») и получить клятву верности. #weak Цена: место в совете, графство, золото, брак или помилование#!"
 lam_fac_tip1_promise: "Обещание, данное фракции [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName], всё ещё в силе. Если сдержать его в срок, благосклонность сильно вырастет; если нарушить, 5 лет будет жить чувство предательства."
 lam_fac_tip1_strings: "Корона висит на нитях. Их можно перерезать: «Выкупить нити» (доход за 3 года) или «Дворцовый переворот» (интрига, военное дело, ужас)."
 lam_fac_tip1_amends: "Фракция [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName] помнит причинённую мной несправедливость. Если сделка с этой фракцией состоится, обида будет снята (обид на других государей это не касается). #weak Цена: одна уступка#!"
 lam_fac_tip1_make_cp: "Придворной партии нет. Покровительство фракции [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName] поможет укрепить опору. Чтобы стать придворной партией, нужно согласие собрания фракции. Престиж: 75."
 lam_fac_tip1_rally: "Корона пошатнулась. Фракция [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName] сплотилась вокруг неё; благосклонность придаст ей решимости. #weak Цена: 75 престижа#!"
 lam_fac_tip1_press: "Можно велеть придворной партии прижать фракцию [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]. Её благосклонность, сплочённость и участие пошатнутся. #weak Цена: тирания; раз в 2 года#!"
 lam_fac_tip1_ban: "Условия для запрета фракций выполнены. Однако за ним последуют неприязнь всех вассалов (−20 на 5 лет) и расходы на содержание, пока запрет в силе."
 lam_fac_tip2_deal: "Фракция [ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName] собирается (решимость [ROOT.Char.MakeScope.Var('lam_tip2_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]). Пока она не восстала, можно заключить с ней сделку («Сделка с фракцией») и получить клятву верности. #weak Цена: место в совете, графство, золото, брак или помилование#!"
 lam_fac_tip2_promise: "Обещание, данное фракции [ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName], всё ещё в силе. Если сдержать его в срок, благосклонность сильно вырастет; если нарушить, 5 лет будет жить чувство предательства."
 lam_fac_tip2_strings: "Корона висит на нитях. Их можно перерезать: «Выкупить нити» (доход за 3 года) или «Дворцовый переворот» (интрига, военное дело, ужас)."
