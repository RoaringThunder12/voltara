 rule_lam_faction_scope: "Living Factions: охват"
 rule_lam_faction_scope_desc: "Дворы, при которых действуют фракции вассалов. Двор игрока и дворы его сюзеренов включены всегда. Чем шире охват, тем выше нагрузка (дворы ИИ обновляются раз в год)."
 setting_lam_faction_scope_player_area: "Вокруг игрока"
 setting_lam_faction_scope_player_area_desc: "Двор игрока, его сюзерены и независимые правители, граничащие с верховной державой игрока."
 setting_lam_faction_scope_kings: "Все короли и императоры"
 setting_lam_faction_scope_kings_desc: "Все дворы уровня королевства и выше."
 setting_lam_faction_scope_dukes: "Все герцоги и выше"
 setting_lam_faction_scope_dukes_desc: "Все дворы уровня герцогства и выше."
 setting_lam_faction_scope_all: "Все дворы (по умолчанию)"
 setting_lam_faction_scope_all_desc: "Все дворы, где есть хотя бы один прямой вассал от графа и выше. При малом дворе (меньше четырёх вассалов) один недовольный феодал — уже фракция."
 setting_lam_faction_scope_off: "Выключено"
 setting_lam_faction_scope_off_desc: "Фракции вассалов не создаются (фракции домочадцев остаются)."
 rule_lam_fac_absorb: "Living Factions: единая политика знати"
 rule_lam_fac_absorb_desc: "При охваченных дворах требования независимости, свободы, возведения претендента и разделения решаются через собрания и коалиции «Живых фракций». Это действует и при дворах без постоянных фракций; неприсоединившиеся тоже могут участвовать. Войны и их исход обрабатываются средствами базовой игры, а соответствующие фракции знати не дублируются в отдельном списке фракций. Особая политика бюрократий, Японии и Китая, а также народные восстания сохраняют нынешний отдельный порядок."
 setting_lam_fac_absorb_on: "Единая (по умолчанию)"
 setting_lam_fac_absorb_on_desc: "Постоянные фракции и неприсоединившиеся объединяются вокруг конкретных требований, а действуют те, кто дал согласие."
 setting_lam_fac_absorb_off: "Как есть"
 setting_lam_fac_absorb_off_desc: "Ванильные фракции, как обычно, действуют отдельно."
 lam_fac_card_name_0: "#high Партия [Character.GetFirstNameNoTooltip]#! #weak ([Character.GetShortUIName])#!"
