 lam_rs_puppet: "Последняя ночь: потребовать стать нашей марионеткой"
 lam_rs_puppet_desc: "Если сюзерен согласится, власть за троном достанется без боя. Вероятность согласия: #high [actor.MakeScope.ScriptValue('lam_fac_ult_puppet_chance_value')|0]%#! (зависит от силы фракции, авторитета короны и нрава сюзерена). При отказе — восстание."
 lam_faction.2900.t: "Власть за троном"
 lam_faction.2900.desc: "[lam_sh_king.GetShortUIName] теперь правит лишь по имени. Эту державу двигаю я."
 lam_faction.2900.a: "Отныне эта держава моя"
 lam_faction.2900.a.tt: "В окне «Интриги», в списке марионеток, можно от имени правителя отзывать и жаловать титулы, назначать наследника, менять вассальные договоры, объявлять войны и заключать союзы, бросать в темницу, казнить и т. д. Правый щелчок по правителю позволяет заполнить его совет по своему усмотрению (в том числе собой), правый щелчок по своему портрету — занять сколько угодно придворных должностей. Правитель не смеет мне перечить (мнение +100), ничего не требует от моей фракции, а на самовольную войну должен получить моё одобрение. Если сила фракции упадёт ниже 35% двора, нити оборвутся."
 lam_faction.2910.t: "Война марионетки"
 lam_faction.2910.desc: "[lam_sw_king.GetShortUIName] объявляет войну без моего позволения."
 lam_faction.2910.a: "Пусть так и будет"
 lam_faction.2910.b: "Велеть немедленно отступиться (статус-кво)"
