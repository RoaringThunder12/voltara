 lam_faction.2200.t: "Предупреждение сюзерена"
 lam_faction.2200.desc: "[lam_cpw_lord.GetShortUIName] призывает меня к себе: ходят слухи, будто так называемая придворная партия отворачивается от сюзерена. Если ничего не изменится, в течение полугода положение придворной партии будет отнято."
 lam_faction.2200.a: "Заново присягнуть сюзерену"
 lam_faction.2200.a.tt: "Потратить престиж, чтобы вернуть благосклонность сюзерена (благосклонность +25). Если разлад вышел из-за чего-то другого, придётся уладить и это, чтобы сохранить положение."
 lam_faction.2200.b: "Пропустить мимо ушей"
 lam_faction.2200.b.tt: "Если через полгода разлад не уладится, положение придворной партии будет потеряно и не вернётся 5 лет."
 lam_fac_cp_revoked_title: "Положение придворной партии потеряно (5 лет его не вернуть)"
 lam_fac_strong_head_opinion: "Глава сильной фракции"
 lam_fac_strong_member_opinion: "Ядро сильной фракции"
 lam_fac_hm_task_interaction: "Поручить дело фракции"
 lam_fac_hm_task_interaction_desc: "Поручить члену фракции дело на её благо. Успех зависит от его способностей."
 lam_fac_hm_task_cd_tt: "Этому человеку в этом году уже давали поручение"
 lam_tk_lord: "Отправить донести нашу волю до сюзерена"
 lam_tk_lord_desc: "Чем выше дипломатия, тем лучше. Успех: благосклонность сюзерена +8 / неудача: −3"
 lam_tk_win: "Переманить человека из другой фракции"
 lam_tk_win_desc: "Чем выше дипломатия и интриги и чем ближе исполнитель к цели (тот же дом, дружба, симпатия), тем лучше. Сначала выбирают тех, кто близок исполнителю. Успех: этот человек становится нашим приближённым (прежняя фракция затаит обиду)"
 lam_tk_spy: "Шпионить за соперничающей фракцией"
 lam_tk_spy_desc: "Чем выше интриги, тем лучше. Успех: раскрыт один секрет её главы (если раскрывать нечего — ни с чем) / неудача: обычно проходит тихо, но в четырёх случаях из десяти всё раскрывается и отношения портятся"
 lam_tk_lord_tt: "Член фракции отправляется к сюзерену"
 lam_tk_win_tt: "Член фракции берётся переманивать людей"
 lam_tk_spy_tt: "Член фракции отправляется шпионить"
 lam_tk_lord_yes_title: "Сюзерен внял нашим словам (благосклонность +8)"
 lam_tk_lord_no_title: "Сюзерен недоволен (благосклонность −3)"
 lam_tk_win_yes_title: "Переманен новый приближённый"
 lam_tk_win_no_title: "Переманить не удалось"
 lam_tk_win_none_title: "Переманить было некого"
 lam_tk_spy_yes_title: "Раскрыт секрет главы соперничающей фракции"
 lam_tk_spy_no_title: "Слежка раскрыта"
 lam_ai_fac_core_member_reason: "Ядро фракции"
 lam_ai_lazy_reason: "Лень"
 lam_ai_diligent_reason: "Усердие"
 lam_ai_fac_long_reason: "Фракция по собственному выбору"
 lam_ai_fac_cohesive_reason: "Сплочённая фракция"
 lam_ai_fac_greedy_reason: "Алчность"
 lam_fac_hm_praise_interaction: "Отметить заслуги"
 lam_fac_hm_praise_interaction_desc: "Наградить члена фракции золотом за заслуги. Приближённый, который хорошо ко мне относится (мнение 30+), входит в ядро."
 lam_fac_hm_praise_cd_tt: "Награда уже была за последние 2 года"
 lam_fac_hm_praise_up_tt: "Входит в ядро"
 lam_fac_hm_raise_interaction: "Ввести в ядро"
 lam_fac_hm_raise_interaction_desc: "Сделать этого члена фракции частью ядра (на 5 лет)."
 lam_fac_hm_lower_interaction: "Понизить до приближённого"
 lam_fac_hm_lower_interaction_desc: "Вывести этого человека из ядра. Это его заденет."
 lam_fac_hm_expel_interaction: "Изгнать из фракции"
 lam_fac_hm_expel_interaction_desc: "Удалить этого человека из фракции. Он затаит обиду и 2 года не вступит ни в одну фракцию."
 lam_fac_hm_successor_interaction: "Назвать своим преемником"
 lam_fac_hm_successor_interaction_desc: "Если я уйду или умру, фракцию поведёт этот человек (если он владеет землёй при этом дворе и годится)."
 lam_fac_hm_successor_tt: "Назначается преемником главы фракции"
 lam_fac_mh_raise_interaction: "Попросить места в ядре"
 lam_fac_mh_raise_interaction_desc: "Попросить главу ввести меня в ядро фракции. Важны моя сила и мнение главы обо мне."
 lam_fac_mh_cd_tt: "Отказ уже был в течение последнего года"
 lam_fac_mh_raised_title: "Теперь я в ядре фракции"
 lam_fac_mh_aid_interaction: "Попросить помощи фракции"
 lam_fac_mh_aid_interaction_desc: "Попросить у главы золота или войск."
 lam_fac_mh_aid_cd_tt: "Помощи уже просили недавно"
 lam_ad_gold: "Попросить золота"
 lam_ad_gold_desc: "Глава выделяет немного золота."
 lam_ad_arms: "Попросить присоединиться к моей войне"
 lam_ad_arms_desc: "Глава вступает в мою войну, и около половины ядра — тоже."
 lam_ad_arms_tt: "Глава и часть ядра вступают в мою войну"
 lam_fac_mh_counsel_interaction: "Дать совет главе"
 lam_fac_mh_counsel_interaction_desc: "Высказать главе мнение о пути фракции."
 lam_fac_mh_counsel_cd_tt: "Совет уже давался в течение последнего года"
 lam_cs_close: "Сплотим ряды"
 lam_cs_close_desc: "Сплочённость фракции +5."
 lam_cs_close_tt: "Сплочённость фракции растёт"
 lam_cs_stir: "Выступим против сюзерена"
 lam_cs_stir_desc: "Фракция на 2 года обретает повод к выступлению (основание для восстания)."
 lam_cs_stir_tt: "Недовольство фракции растёт"
 lam_cs_calm: "Проявим сдержанность"
 lam_cs_calm_desc: "Унять недовольство фракции; благосклонность сюзерена +5."
 lam_cs_calm_tt: "Фракция сдерживается"
 lam_fac_mh_pledge_interaction: "Поклясться в верности"
 lam_fac_mh_pledge_interaction_desc: "Поклясться главе в верности. Мнение главы и сплочённость фракции растут, а моё место упрочивается."
 lam_fac_mh_pledge_cd_tt: "Клятва уже давалась за последние 3 года"
 lam_fac_favor_done_opinion: "Исполненная просьба"
 lam_fac_favor_refused_opinion: "Отказ в просьбе"
 lam_fac_expelled_opinion: "Изгнание из фракции"
 lam_fac_praised_opinion: "Заслуги отмечены"
 lam_fac_demoted_opinion: "Потеря места в ядре"
 lam_fac_sided_with_opinion: "На моей стороне"
 lam_fac_sided_against_opinion: "На чужой стороне"
 lam_fac_turned_coat_opinion: "Измена"
 lam_fac_reported_opinion: "Предупреждение"
 lam_fac_pledged_opinion: "Клятва верности"
 lam_fac_counselled_opinion: "Совет"
 lam_fac_blackmailed_opinion: "Шантаж"
 lam_fac_plot_reported_opinion: "Донос о заговоре"
 lam_fac_named_successor_opinion: "Назначение преемником"
 lam_fac_aid_given_opinion: "Оказанная помощь"
 lam_faction.2300.t: "Просьба главы"
 lam_faction.2300.desc: "[lam_st_head.GetShortUIName] тихо отзывает меня в сторону: на дела фракции срочно нужны деньги. И просит никому об этом не говорить."
 lam_faction.2300.a: "Дать золото"
 lam_faction.2300.a.tt: "Из приближённых — в ядро"
 lam_faction.2300.b: "Лично взяться за дело"
 lam_faction.2300.c: "Вежливо отказать"
 lam_faction.2310.t: "Другая фракция манит"
 lam_faction.2310.desc: "Ко мне пришёл человек от [lam_st_a.GetShortUIName] и протянул кошель с золотом: «Переходите к нам — в обиде не останетесь»."
 lam_faction.2310.a: "Взять и перейти"
 lam_faction.2310.b: "Рассказать главе, [lam_st_head.GetShortUIName]"
 lam_faction.2310.c: "Сделать вид, будто разговора не было"
 lam_faction.2320.t: "Разговоры за спиной"
 lam_faction.2320.desc: "До меня дошли слухи: [lam_st_b.GetShortUIName] порочит меня перед главой, [lam_st_head.GetShortUIName]."
 lam_faction.2320.a: "Ответить тем же (интриги)"
 lam_faction.2320.a_yes: "Глава теперь подозревает этого человека"
 lam_faction.2320.a_no: "Подозрение, напротив, пало на меня"
 lam_faction.2320.b: "Лично объясниться с главой"
 lam_faction.2320.c: "Оставить как есть"
 lam_faction.2400.t: "Ссора во фракции"
 lam_faction.2400.desc: "Ссора между [lam_st_a.GetShortUIName] и [lam_st_b.GetShortUIName] дошла до собрания фракции. Все смотрят на меня — главу."
 lam_faction.2400.a: "Поддержать [lam_st_a.GetShortUIName]"
 lam_faction.2400.b: "Поддержать [lam_st_b.GetShortUIName]"
 lam_faction.2400.c: "Помирить обоих (дипломатия)"
 lam_faction.2400.c_yes: "Они помирились (сплочённость +6)"
 lam_faction.2400.c_no: "Примирение не удалось (сплочённость −6)"
 lam_faction.2410.t: "Донос"
 lam_faction.2410.desc: "Ко мне тайком пришёл человек и шепнул: [lam_st_traitor.GetShortUIName] замышляет уйти от нас или продать нас."
 lam_faction.2410.a: "Изгнать из фракции"
 lam_faction.2410.b: "Вернуть расположение золотом (дипломатия)"
 lam_faction.2410.b_yes: "Удалось переубедить"
 lam_faction.2410.b_no: "Деньги потрачены впустую (сплочённость −5)"
 lam_faction.2410.c: "Пропустить мимо ушей"
 lam_faction.2420.t: "Тайный посланец сюзерена"
 lam_faction.2420.desc: "Тайный посланец от [lam_st_lord.GetShortUIName] принёс золото. Если фракция 3 года будет вести себя тихо, сюзерен этого не забудет."
 lam_faction.2420.a: "Принять (на 3 года связывает клятва)"
 lam_faction.2420.b: "Отослать обратно"
 lam_faction.2500.t: "Ухаживания с обеих сторон"
 lam_faction.2500.desc: "В один день ко мне пришли люди от [lam_st_a.GetShortUIName] и от [lam_st_b.GetShortUIName]. Каждый хочет заполучить меня."
 lam_faction.2500.a: "Выбрать [lam_st_a.GetShortUIName]"
 lam_faction.2500.b: "Выбрать [lam_st_b.GetShortUIName]"
 lam_faction.2500.c: "Водить за нос обоих и брать подарки (интриги)"
 lam_faction.2500.c_yes: "Подарки получены от обеих сторон"
 lam_faction.2500.c_no: "Обе стороны раскусили игру"
 lam_faction.2500.d: "Не вставать ни на чью сторону"
 lam_faction.2510.t: "Подслушанный заговор"
 lam_faction.2510.desc: "На моих глазах люди [lam_st_plot.GetShortUIName] тайно собрались и замышляли выступить против сюзерена."
 lam_faction.2510.a: "Сообщить сюзерену"
 lam_faction.2510.b: "Взять плату за молчание (интриги)"
 lam_faction.2510.c: "Закрыть на это глаза"
 activity_lam_faction_gathering: "Сход фракции"
 activity_lam_faction_gathering_desc: "Созвать членов фракции в мои владения. Около месяца провести вместе в беседах, а в конце как глава принять одно решение."
 activity_lam_faction_gathering_province_desc: "Место схода"
 activity_lam_faction_gathering_host_desc: "$BULLET_WITH_TAB$Мнение членов фракции растёт\n$BULLET_WITH_TAB$В конце принимается одно решение: сплотить ряды / замыслить выступление / требование к сюзерену / мой преемник"
 activity_lam_faction_gathering_guest_desc: "$BULLET_WITH_TAB$Мнение главы растёт\n$BULLET_WITH_TAB$Можно высказаться на сходе"
 activity_lam_faction_gathering_selection_tooltip: "Созвать членов фракции: [GetActivityType('activity_lam_faction_gathering').GetName]"
 activity_lam_faction_gathering_destination_selection: "Можно провести в моих владениях"
 activity_lam_faction_gathering_conclusion_desc: "[GetActivityType('activity_lam_faction_gathering').GetName] подходит к концу"
 activity_lam_faction_gathering_guest_help_text: "Ядро и приближённые фракции собираются на зов главы."
 activity_lam_faction_gathering_cooldown: "Сход фракции можно проводить раз в 2 года"
 activity_lam_faction_gathering_cost: "Подготовка к сходу"
 lam_gathering_phase_meet: "Сход"
 lam_gathering_phase_meet_desc: "Члены фракции собираются, поднимают чаши и обсуждают грядущее."
 lam_gathering_members_tt: "Нужно хотя бы два члена фракции, которых можно созвать"
 lam_gathering_client_reason: "Приближённый фракции"
 lam_fac_gathered_opinion: "Участие в сходе фракции"
 lam_faction.2600.t: "Сход начинается"
 lam_faction.2600.desc: "Люди фракции прибывают один за другим. В первую же ночь все взгляды обращены на меня — главу."
 lam_faction.2600.a: "Сплотить речью (дипломатия)"
 lam_faction.2600.a_yes: "Речь тронула сердца (сплочённость +5)"
 lam_faction.2600.a_no: "Речь вышла так себе"
 lam_faction.2600.b: "Не жалеть ни вина, ни яств"
 lam_faction.2600.c: "Сразу перейти к делу"
 lam_faction.2610.t: "Решение схода"
 lam_faction.2610.desc: "После месяца, проведённого вместе, пора сказать как глава, что мы решаем."
 lam_faction.2610.a: "Сплотить ряды"
 lam_faction.2610.a.tt: "Сплочённость фракции +15"
 lam_faction.2610.b: "Замыслить выступление против сюзерена"
 lam_faction.2610.b.tt: "На 3 года появляется повод к восстанию. Сплочённость +5. Если слух просочится, сюзерен узнает (чем выше интриги, тем реже)."
 lam_faction.2610.b_leak: "О заговоре прослышал сюзерен"
 lam_faction.2610.c: "Условиться о требовании к сюзерену"
 lam_faction.2610.c.tt: "Не нужно ждать для «Требования от имени фракции»; 1 год шанс, что требование примут, +15"
 lam_faction.2610.d: "Назначить сильнейшего своим преемником"
 lam_faction.2610.d.tt: "Назвать сильнейшего из прибывших на сход землевладельцев своим преемником"
 lam_faction.2620.t: "На сходе"
 lam_faction.2620.desc: "Последний день схода у [lam_ga_host.GetShortUIName]. Пора и мне что-то сказать."
 lam_faction.2620.a: "Поддержать слово главы"
 lam_faction.2620.b: "Высказать своё мнение"
 lam_faction.2620.b.tt: "При достаточной силе — вхожу в ядро"
 lam_faction.2620.c: "Тихо собрать своих людей (интриги)"
 lam_faction.2620.c_yes: "Прибывшие на сход стали относиться ко мне лучше"
 lam_faction.2620.c_no: "От главы это не укрылось"
 lam_fac_heard_opinion: "Внимание к моим словам"
 lam_fac_dismissed_opinion: "Пренебрежение моими словами"
 lam_fac_threatened_opinion: "Угрозы"
 lam_fac_rewarded_opinion: "Награда"
 lam_fac_dues_opinion: "Сбор взносов"
 lam_fac_conspirator_opinion: "Общий заговор"
 lam_fac_insulted_opinion: "Оскорбление"
 lam_fac_proved_loyal_opinion: "Доказанная верность"
 lam_fac_spurned_test_opinion: "Отказ от испытания"
 lam_fac_generous_head_opinion: "Щедрый глава"
 lam_faction.2330.t: "Промах главы"
 lam_faction.2330.desc: "[lam_st_head.GetShortUIName] теперь в немилости у сюзерена. Во фракции шепчутся, что главу пора сменить."
 lam_faction.2330.a: "Держаться главы"
 lam_faction.2330.b: "Объединиться с недовольными"
 lam_faction.2330.b.tt: "Через полгода придёт время решить, выступать ли против главы"
 lam_faction.2330.c: "Не вмешиваться"
 lam_faction.2340.t: "Взносы фракции"
 lam_faction.2340.desc: "[lam_st_head.GetShortUIName] говорит, что у фракции туго с деньгами, и просит каждого члена внести взнос."
 lam_faction.2340.a: "Дать немного"
 lam_faction.2340.b: "Дать щедро"
 lam_faction.2340.b.tt: "Из приближённых — в ядро"
 lam_faction.2340.c: "Отказаться"
 lam_faction.2350.t: "Свободное место"
 lam_faction.2350.desc: "Ходят слухи, что в ядре фракции освободилось место. [lam_st_head.GetShortUIName] раздумывает, кого на него посадить."
 lam_faction.2350.a: "Завоевать расположение подарками"
 lam_faction.2350.b: "Пусть говорят мои заслуги (дипломатия)"
 lam_faction.2350.c: "Не претендовать"
 lam_faction.2350.no: "Это место занял другой"
 lam_faction.2360.t: "Тайное предложение"
 lam_faction.2360.desc: "Оставшись со мной наедине, [lam_st_plot.GetShortUIName] шепчет: «[lam_st_head.GetShortUIName] не тот, кто может вести нас. Вы со мной?»"
 lam_faction.2360.a: "Я с вами"
 lam_faction.2360.b: "Сообщить главе"
 lam_faction.2360.c: "Сделать вид, будто разговора не было"
 lam_faction.2361.t: "День выступления"
 lam_faction.2361.desc: "Полгода ушло на то, чтобы собрать людей. Выступить ли теперь против главы?"
 lam_faction.2361.a: "Выступить, поставив вопрос о недоверии"
 lam_faction.2361.a.tt: "Созывается собрание о недоверии, где я веду противников главы. Большинство — и я становлюсь главой; поражение — и меня изгоняют из фракции, а глава становится моим врагом."
 lam_faction.2361.b: "Ещё не время"
 lam_faction.2430.t: "Пустая казна"
 lam_faction.2430.desc: "Казна фракции опустела. А чтобы двигать людей, нужны деньги."
 lam_faction.2430.a: "Собрать взносы с членов"
 lam_faction.2430.b: "Пополнить из своего кармана"
 lam_faction.2430.c: "Затянуть пояса"
 lam_faction.2440.t: "Испытание сюзерена"
 lam_faction.2440.desc: "[lam_st_lord.GetShortUIName] призывает меня и говорит: «Покажите, что ваша фракция и впрямь на моей стороне»."
 lam_faction.2440.a: "Доказать золотом"
 lam_faction.2440.b: "Поклясться в верности при всех (на 2 года связывает клятва)"
 lam_faction.2440.c: "Ответить, что фракция никому не принадлежит"
 lam_faction.2450.t: "Выпад соперничающей фракции"
 lam_faction.2450.desc: "[lam_st_rival.GetShortUIName] высмеивает нашу фракцию посреди двора."
 lam_faction.2450.a: "Ответить сталью (удаль)"
 lam_faction.2450.a_yes: "Поединок выигран"
 lam_faction.2450.a_no: "Поединок проигран"
 lam_faction.2450.b: "Настроить двор против них (интриги)"
 lam_faction.2450.b_yes: "Та фракция стала посмешищем"
 lam_faction.2450.b_no: "Посмешищем, напротив, стали мы"
 lam_faction.2450.c: "Стерпеть"
 lam_faction.2460.t: "Фракция шатается"
 lam_faction.2460.desc: "Среди членов не стихает ропот. Если так пойдёт и дальше, фракция развалится."
 lam_faction.2460.a: "Успокоить золотом"
 lam_faction.2460.b: "Укрепить их дух (дипломатия)"
 lam_faction.2460.b_yes: "Фракция вновь сплотилась"
 lam_faction.2460.b_no: "Слова не подействовали"
 lam_faction.2460.c: "Изгнать самого горластого в назидание прочим"
 lam_faction.2470.t: "Предложение дружбы"
 lam_faction.2470.desc: "Пришёл человек от [lam_st_rival.GetShortUIName]: довольно ссор, давайте заключим союз дружбы."
 lam_faction.2470.a: "Заключить союз дружбы"
 lam_faction.2470.b: "Донести сюзерену"
 lam_faction.2470.c: "Отказаться"
 lam_faction.2480.t: "Кто станет преемником?"
 lam_faction.2480.desc: "[lam_st_a.GetShortUIName] и [lam_st_b.GetShortUIName], оба из ядра, и каждый заявляет права на место моего преемника."
 lam_faction.2480.a: "Назначить преемником: [lam_st_a.GetShortUIName]"
 lam_faction.2480.b: "Назначить преемником: [lam_st_b.GetShortUIName]"
 lam_faction.2480.c: "Пока не решать"
 lam_faction.2700.t: "Аудиенция фракции"
 lam_faction.2700.desc: "[lam_lo_a.GetShortUIName] просит аудиенции от имени своей фракции. По лицу видно — сказать хочется многое."
 lam_faction.2700.a: "Выслушать до конца"
 lam_faction.2700.b: "Прервать разговор"
 lam_faction.2700.c: "Пригрозить и указать на место"
 lam_faction.2710.t: "Предложение придворной партии"
 lam_faction.2710.desc: "[lam_lo_cp.GetShortUIName] из придворной партии предлагает разобраться с людьми [lam_lo_plot.GetShortUIName]. Нужно лишь дать приказ."
 lam_faction.2710.a: "Поручить"
 lam_faction.2710.b: "В этом нет нужды"
 lam_faction.2720.t: "Донесение лазутчика"
 lam_faction.2720.desc: "Лазутчик доносит: фракция [lam_lo_plot.GetShortUIName] что-то тайно замышляет."
 lam_faction.2720.a: "Схватить и заточить главу"
 lam_faction.2720.b: "Купить молчание золотом (на 3 года связывает клятва)"
 lam_faction.2720.c: "Расколоть изнутри (интриги)"
 lam_faction.2720.c_yes: "Та фракция зашаталась"
 lam_faction.2720.c_no: "Происки раскрыты — и нажита лишь их обида"
 lam_faction.2720.d: "Наблюдать"
 lam_faction.2730.t: "Распря фракций"
 lam_faction.2730.desc: "Фракции [lam_lo_b.GetShortUIName] и [lam_lo_c.GetShortUIName] открыто сцепились при дворе. Все ждут моего решения."
 lam_faction.2730.a: "Поддержать [lam_lo_b.GetShortUIName]"
 lam_faction.2730.b: "Поддержать [lam_lo_c.GetShortUIName]"
 lam_faction.2730.c: "Примирить (дипломатия)"
 lam_faction.2730.c_yes: "Две фракции помирились"
 lam_faction.2730.c_no: "Примирение не удалось"
 lam_faction.2730.d: "Пусть измотают друг друга"
 lam_faction.2740.t: "Прошение верноподданных"
 lam_faction.2740.desc: "Фракция [lam_lo_loyal.GetShortUIName] просит вознаградить её за верную службу."
 lam_faction.2740.a: "Пожаловать золото"
 lam_faction.2740.b: "Публично воздать хвалу"
 lam_faction.2740.c: "Ответить, что верность — дело само собой разумеющееся"
 lam_faction.2750.t: "Слишком разросшаяся фракция"
 lam_faction.2750.desc: "Фракция [lam_lo_big.GetShortUIName] прибрала к рукам немалую часть моего двора. Можно ли оставить всё как есть?"
 lam_faction.2750.a: "Приблизить их к себе"
 lam_faction.2750.b: "Посеять раздор изнутри (интриги)"
 lam_faction.2750.b_yes: "Во фракции пошла трещина"
 lam_faction.2750.b_no: "Происки раскрыты"
 lam_faction.2750.c: "Оставить как есть"
 lam_nick_loyal_minister: "Опора трона"
 lam_nick_peerless_loyal: "Вечная опора трона"
 lam_cp_trusted_modifier: "Доверие сюзерена"
 lam_cp_trusted_modifier_desc: "Долгая верность снискала доверие сюзерена."
 lam_cp_paragon_modifier: "В числе верных слуг трона"
 lam_cp_paragon_modifier_desc: "Все признают в этом человеке верного слугу сюзерена."
 lam_cp_legend_modifier: "Верность на века"
 lam_cp_legend_modifier_desc: "Об этой верности будут рассказывать из поколения в поколение."
 lam_cp_counsel_opinion: "Добрый совет"
 lam_cp_counsel_bad_opinion: "Бесполезный совет"
 lam_cp_mission_opinion: "Поручение исполнено"
 lam_cp_envy_opinion: "Зависть к придворной партии"
 lam_cp_betrayed_opinion: "Предательство придворной партии"
 lam_cp_suspect_opinion: "Подозрение"
 lam_cp_loyal_servant_opinion: "Преданная служба"
 lam_secret_cp_treason: "Измена придворной партии"
 lam_secret_cp_treason_desc: "Глава придворной партии ждёт дня, чтобы обратить меч против сюзерена."
 lam_cp_counsel_interaction: "Дать совет сюзерену"
 lam_cp_counsel_interaction_desc: "Как глава придворной партии, докладывать сюзерену о делах державы. Чем выше способности, тем внимательнее он слушает. Копятся заслуги."
 lam_cp_counsel_cd_tt: "Можно докладывать раз в год"
 lam_cp_counsel_tt: "Успех: мнение сюзерена +10, благосклонность +5, заслуги +1 / неудача: мнение сюзерена −5"
 lam_cc_purse: "Доложить о казне державы (управление)"
 lam_cc_purse_desc: "Чем выше управление, тем лучше"
 lam_cc_arms: "Доложить о военных делах (военное дело)"
 lam_cc_arms_desc: "Чем выше военное дело, тем лучше"
 lam_cc_court: "Доложить о порядке при дворе (дипломатия)"
 lam_cc_court_desc: "Чем выше дипломатия, тем лучше"
 lam_cp_counsel_yes_title: "Сюзерен прислушался к совету (заслуги +1)"
 lam_cp_counsel_no_title: "Сюзерен недоволен"
 lam_cp_mission_interaction: "Испросить поручение сюзерена"
 lam_cp_mission_interaction_desc: "Спросить сюзерена, нет ли для меня поручения. Исполненное поручение приносит заслуги."
 lam_cp_mission_cd_tt: "Можно просить раз в 2 года"
 lam_cp_report_interaction: "Донести сюзерену"
 lam_cp_report_interaction_desc: "Донести на эту фракцию, отвернувшуюся от сюзерена. Её сплочённость −10, сюзерен проникается к ней неприязнью, мои заслуги +1. Они сочтут меня врагом."
 lam_cp_report_cd_tt: "Доносить можно раз в 2 года"
 lam_cp_hidden_blade_interaction: "Точить скрытый клинок"
 lam_cp_hidden_blade_interaction_desc: "Пользуясь доверием сюзерена, начать готовиться к дню, когда клинок будет обращён против него."
 lam_cp_blade_need_tt: "Требуется положение придворной партии"
 lam_cp_blade_years_tt: "Нужно пробыть придворной партией не менее 3 лет (пока сюзерен не ослабит бдительность)"
 lam_cp_hidden_blade_tt: "Появляется секрет об измене. Обнажить клинок можно через год. Каждый год лазутчики сюзерена могут его раскрыть (чем выше мои интриги, тем безопаснее)."
 lam_cp_draw_blade_interaction: "Обнажить клинок"
 lam_cp_draw_blade_interaction_desc: "Время пришло. Придворная партия отворачивается от сюзерена."
 lam_cp_draw_wait_tt: "С начала заговора должен пройти год"
 lam_db_rise: "Восстать"
 lam_db_rise_desc: "Фракция поднимается против сюзерена. Застигнутому врасплох сюзерену нелегко собрать роялистов (1 год)."
 lam_db_seize: "Захватить двор"
 lam_db_seize_desc: "Если в руках две пятых силы двора, можно без боя стать властью за троном."
 lam_db_seize_need_tt: "Нужно держать не менее 40% силы двора"
 lam_db_rise_tt: "Теряются положение придворной партии и честь верного слуги, а измена вносится в родословную. Проигравшего восстание назовут «Изменником»."
 lam_db_seize_tt: "Теряются положение придворной партии и честь верного слуги, а измена вносится в родословную. Зато власть — в моих руках."
 lam_faction.2800.t: "Доверие сюзерена"
 lam_faction.2800.desc: "[lam_cp_lord.GetShortUIName] при всех вызывает меня вперёд: «Нет человека надёжнее вас».\n\n#weak Летопись: лет во главе придворной партии — [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0], заслуг — [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0].#!"
 lam_faction.2800.a: "Склонить голову и принять"
 lam_faction.2810.t: "В числе верных слуг трона"
 lam_faction.2810.desc: "За долгие годы во главе придворной партии на службе сюзерену [lam_cp_lord.GetShortUIName] нарекает меня верным слугой трона. Это имя разносится по двору.\n\n#weak Летопись: лет во главе придворной партии — [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0], заслуг — [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0].#!"
 lam_faction.2810.a: "Честь всей жизни"
 lam_faction.2820.t: "Вечная опора трона"
 lam_faction.2820.desc: "Пятнадцать лет — как один день. [lam_cp_lord.GetShortUIName] говорит, что моё имя будут помнить вместе с моим домом во веки веков. Летописец берётся за перо.\n\n#weak Летопись: лет во главе придворной партии — [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0], заслуг — [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0].#!"
 lam_faction.2820.a: "Принять во имя своего дома"
 lam_faction.2830.t: "Поручение сюзерена"
 lam_faction.2830.desc: "[lam_cp_lord.GetShortUIName] называет несколько поручений. За какое взяться?"
 lam_faction.2830.a: "Взыскать налоги с упрямого вассала (военное дело, дипломатия)"
 lam_faction.2830.b: "Следить за фракцией, отвернувшейся от сюзерена (интриги)"
 lam_faction.2830.c: "Служить при наследнике сюзерена (образованность)"
 lam_faction.2830.yes: "Поручение исполнено (заслуги приумножены)"
 lam_faction.2830.no: "Поручение провалено"
 lam_faction.2840.t: "Скрытый клинок"
 lam_faction.2840.desc: "Прошёл ещё год. Неужели лазутчики сюзерена до сих пор ничего не знают?"
 lam_faction.2840.a: "Тихо ждать своего часа"
 lam_faction.2840.found: "Сюзерен раскрыл измену!"
 lam_faction.2840.safe: "Ещё год пройти незамеченным (тем опаснее, чем выше интриги сюзерена и ниже мои)"
 lam_faction.2840.b: "Затаиться ещё на год"
 lam_faction.2840.b.tt: "Обнажить клинок можно будет на год позже"
 lam_faction.2840.c: "Отказаться от заговора"
 lam_faction.2850.t: "Дар сюзерена"
 lam_faction.2850.desc: "[lam_cp_lord.GetShortUIName] хвалит труды придворной партии и спрашивает, чего бы мне хотелось."
 lam_faction.2850.a: "Взять золото"
 lam_faction.2850.b: "Попросить отдать награду людям фракции"
 lam_faction.2850.c: "Сказать, что довольно и самого внимания (заслуги +1)"
 lam_faction.2860.t: "Подозрения сюзерена"
 lam_faction.2860.desc: "[lam_cp_lord.GetShortUIName] смотрит на меня уже не так, как прежде. Похоже, сюзерен сомневается, вправду ли придворная партия на его стороне."
 lam_faction.2860.a: "Доказать верность золотом"
 lam_faction.2860.b: "Развеять сомнения словами (дипломатия)"
 lam_faction.2860.b_yes: "Сомнения развеяны"
 lam_faction.2860.b_no: "Сомнения лишь усилились"
 lam_faction.2860.c: "Стоять на своём: сомневаться не в чем"
 lam_faction.2870.t: "Зависть"
 lam_faction.2870.desc: "Фракция [lam_cp_envious.GetShortUIName] ворчит, что придворная партия присвоила себе всю благосклонность сюзерена."
 lam_faction.2870.a: "Задобрить подарками"
 lam_faction.2870.b: "Шепнуть сюзерену об их слабостях (интриги)"
 lam_faction.2870.b_yes: "Та фракция пошатнулась (заслуги +1)"
 lam_faction.2870.b_no: "Нажита лишь обида"
 lam_faction.2870.c: "Не обращать внимания"
 lam_gn_ev_loyal_honor: "Слава главы как верного слуги трона"
 lam_gn_ev_treason: "Придворная партия обратила меч против сюзерена"
 lam_cp_loyal_house_modifier: "Дом трёх поколений верности"
 lam_cp_loyal_house_modifier_desc: "Дом, три поколения верно служивший королевскому роду. Пока жив этот род, живёт и это имя."
 lam_cp_loyal_house_opinion: "Дом трёх поколений верности"
 lam_cp_house_seat_title: "Получено место в совете — по праву дома трёх поколений верности"
 lam_faction.2810.house_tt: "#weak Летопись дома: глав нашего дома, ставших верными слугами при одном королевском роде, — [ROOT.Char.MakeScope.Var('lam_cp_house_n').GetValue|0] / 3 (включая этот раз). Когда их станет трое, весь дом будет признан домом трёх поколений верности.#!"
 lam_faction.2890.t: "Дом трёх поколений верности"
 lam_faction.2890.desc: "Дед, отец, а теперь и я. Три поколения наш дом служит королевскому роду, из которого происходит [lam_cp_lord.GetShortUIName]. И королевский род решил воздать нам честь как дому верных слуг."
 lam_faction.2890.a: "Именем нашего дома — служить вечно"
 lam_faction.2890.a.tt: "Весь дом получает модификатор «Дом трёх поколений верности» (престиж, мнение, мнение сюзерена, дипломатия, управление). Признание династии +1000. Пока этот род занимает трон, король каждый год благоволит нам (мнение +25), держит одного из нашего дома в совете, а благосклонность к нашей фракции растёт. Если род прервётся, кончится и эта честь."
 lam_faction.2891.t: "Королевский род прервался"
 lam_faction.2891.desc: "Королевский род, которому наш дом служил три поколения, лишился трона. Имя дома верных слуг теперь лишь старое предание."
 lam_faction.2891.a: "Мир переменился"
 lam_gn_ev_loyal_house: "Дом главы признан домом трёх поколений верности"
 lam_faction.2895.t: "Утрата имени верного слуги"
 lam_faction.2895.desc: "Когда-то меня звали верным слугой трона. Теперь я иду против своего сюзерена, и двор зовёт меня иначе."
 lam_faction.2895.a: "Пути назад нет"
 lam_faction.2895.a.tt: "Все модификаторы и заслуги верного слуги теряются. Прозвища «Опора трона» и «Вечная опора трона» сменяются на «Клятвопреступник». Стать верным слугой снова уже не выйдет, а дом лишается и чести трёх поколений верности."
 lam_faction.2896.t: "Пятно на имени дома"
 lam_faction.2896.desc: "[lam_hs_culprit.GetShortUIName] поднимает оружие на королевский род, которому наш дом служил из поколения в поколение. Дома трёх поколений верности больше нет."
 lam_faction.2896.a: "Как смыть этот позор?"
 lam_faction.2896.a.tt: "Дом теряет модификатор «Дом трёх поколений верности» и все его блага. Вновь получить его нельзя 50 лет."
 lam_court_puppet: "Власть за троном"
 lam_court_puppet_desc: "Силой фракции правитель оказался у меня в руках. Жаловать и отнимать титулы, назначать наследника, решать о войне и союзах — всё это можно делать от имени правителя-марионетки. Если сила фракции упадёт ниже 35% двора, нити оборвутся."
 puppet_action_description_lam_pa_revoke_title: "Отзывать титулы от имени правителя-марионетки"
 puppet_action_description_lam_pa_grant_titles: "Жаловать титулы от имени правителя-марионетки"
 puppet_action_description_lam_pa_retract_vassal: "Возвращать вассалов правителя-марионетки в прямое подчинение"
 puppet_action_description_lam_pa_grant_vassal: "Передавать вассалов правителя-марионетки другим"
 puppet_action_description_lam_pa_designate_heir: "Назначать наследника правителя-марионетки"
 puppet_action_description_lam_pa_modify_contract: "Изменять вассальные договоры правителя-марионетки"
 puppet_action_description_lam_pa_modify_contract_admin: "Изменять вассальные договоры правителя-марионетки (бюрократия)"
 puppet_action_description_lam_pa_modify_contract_nomad: "Изменять вассальные договоры правителя-марионетки (кочевники)"
 puppet_action_description_lam_pa_grant_governorship: "Назначать губернаторов от имени правителя-марионетки"
 puppet_action_description_lam_pa_arrange_marriage: "Устраивать браки для правителя-марионетки"
 puppet_action_description_lam_pa_break_betrothal: "Расторгать помолвки правителя-марионетки"
 puppet_action_description_lam_pa_execute: "Казнить узников правителя-марионетки"
 puppet_action_description_lam_pa_offer_ward: "Отдавать детей правителя-марионетки на воспитание"
 puppet_action_description_lam_pa_call_dynasty_war: "Призывать династию правителя-марионетки на войну"
 puppet_action_description_lam_pa_gift_artifact: "Дарить артефакты правителя-марионетки"
 puppet_action_description_lam_pa_declare_war: "Объявлять войну от имени правителя-марионетки"
 puppet_action_description_lam_pa_imprison: "Заключать в темницу от имени правителя-марионетки"
 puppet_action_description_lam_pa_release: "Освобождать узников правителя-марионетки"
 puppet_action_description_lam_pa_pardon: "Миловать от имени правителя-марионетки"
 puppet_action_description_lam_pa_directive: "Давать указания вассалам правителя-марионетки"
 puppet_action_description_lam_pa_alliance: "Заключать союзы для правителя-марионетки"
 puppet_action_description_lam_pa_demand_payment: "Требовать денег от имени правителя-марионетки"
 puppet_action_description_lam_pa_claim_throne: "Заявлять права на трон от имени правителя-марионетки"
 puppet_action_description_lam_pa_fabricate_hook: "Фабриковать крючки от имени правителя-марионетки"
 puppet_action_description_lam_pa_grant_independence: "Даровать независимость вассалам правителя-марионетки"
