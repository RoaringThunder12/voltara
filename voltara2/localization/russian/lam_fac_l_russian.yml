 lam_fac_member_row: "[Character.GetShortUIName] · [Character.Custom('LamFacTier')] · [Character.Custom('LamAttitude')]\n\n#high Главные опоры: [Character.Custom('LamUxBasis1')][Character.Custom('LamUxBasis2')]#!\nВлияние во фракции сейчас: #high [Character.MakeScope.ScriptValue('lam_cr_influence_value')|1]/100#!\nБазовое значение 10\nВоенная сила [Character.MakeScope.ScriptValue('lam_cr_military_value')|1]/20 · Богатство [Character.MakeScope.ScriptValue('lam_cr_economy_value')|1]/15\nРанг и слава [Character.MakeScope.ScriptValue('lam_cr_standing_value')|1]/15 · Положение при дворе [Character.MakeScope.ScriptValue('lam_cr_court_value')|1]/15\nСвязи [Character.MakeScope.ScriptValue('lam_cr_network_value')|1]/10 · Заслуги перед фракцией [Character.MakeScope.ScriptValue('lam_cr_service_value')|1]/15\n\n#weak Чем больше военная сила и богатство, тем меньше даёт каждый новый прирост. Положение при дворе отражает должность в совете и доступ к правителю, связи — родство и отношения с главой, заслуги — срок во фракции и оказанные услуги.#![Character.Custom2('LamUxBallot', GetPlayer)]"
