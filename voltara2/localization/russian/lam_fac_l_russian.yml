 lam_faction.0800.news_head: "\n\n#high Вести из соседних держав#!"
 lam_faction.1700.t: "Последняя ночь"
 lam_faction.1700.desc: "Перевалило за полночь, когда за воротами вспыхнули факелы: там стояли вооружённые люди под началом [lam_ult_lead.GetTitledFirstName]. Гонец был немногословен: если до конца ночи ответа не будет, с рассветом поднимутся знамёна."
 lam_faction.1700.why: "\n\n#weak Что довело их до этого:#! [lam_ult_lead.Custom('LamFacNerve1')][lam_ult_lead.Custom('LamFacNerve2Sep')]"
 lam_faction.1700.past.wronged: "\n\n#italic Среди лиц в свете факелов есть братья тех, кого по моей воле бросили в темницу.#!"
 lam_faction.1700.past.spurned: "\n\n#italic Их кандидат так и не получил корону. Этой ночью они пришли взыскать долг.#!"
 lam_faction.1700.past.betrayed: "\n\n#italic Ни одного слова из нарушенного мной обещания они не забыли.#!"
 lam_faction.1700.ask: "\n\nКанцлер понизил голос: «Что прикажете?»"
 lam_faction.1700.a: "Уступить их требованиям"
 lam_faction.1700.a_tt: "Потеря престижа. Зато благосклонность этой фракции сильно вырастет, обида будет снята, а на 2 года её решимость снизится на 25."
 lam_faction.1700.b: "Купить их клятву золотом"
 lam_faction.1700.b_tt: "Крупная сумма золота за клятву верности на 5 лет (решимость −25 на 2 года). Жадный глава согласится охотно; честолюбивый или мстительный глава, а также фракция, пострадавшая от моей несправедливости, скорее откажутся. При отказе золото останется при мне, но с рассветом они восстанут."
 lam_faction.1700.c: "Схватить главу"
 lam_faction.1700.c_tt: "Схватить главу, пока не поднялись знамёна, и бросить в темницу. Легче, если высок ужас, если велика моя доблесть и если есть придворная партия; чем больше фракция, тем труднее. Даже при успехе растёт тирания, а фракция затаит обиду за чистку. При неудаче — потеря престижа, и они восстают немедленно."
 lam_faction.1700.d: "Пусть приходят"
 lam_faction.1700.d_tt: "Никаких уступок. Немного престижа; с рассветом они восстанут."
 lam_fac_ult_oath_yes: "Золото принято, и [lam_ult_lead.GetFirstName] приносит клятву. Один за другим гаснут факелы"
 lam_fac_ult_oath_no: "[lam_ult_lead.GetFirstName] швыряет золото наземь. С рассветом поднимутся знамёна"
 lam_fac_ult_arrest_yes: "[lam_ult_lead.GetFirstName] — в цепях. Факелы у ворот рассеялись"
 lam_fac_ult_arrest_no: "Схватить [lam_ult_lead.GetFirstName] не удалось. Они восстают"
 lam_fac_card_rep: "\"[Character.Custom('LamFacRep')]\""
 lam_fac_card_rep_tt: "#weak Что говорят об этой фракции при дворе. Зависит от её силы, курса, сплочённости, возраста и нынешнего положения дел.#!"
 lam_fac_rep_puppeteer: "истинный хозяин за троном"
 lam_fac_rep_armed: "мятежники с обнажёнными мечами"
 lam_fac_rep_underground: "подполье, укрывшееся от запрета"
 lam_fac_rep_core_empire: "ключевая фракция империи по праву и по сути"
 lam_fac_rep_core_kingdom: "ключевая фракция королевства по праву и по сути"
 lam_fac_rep_core_court: "ключевая сила двора по праву и по сути"
 lam_fac_rep_courtparty: "придворная партия, ставшая руками и ногами государя"
 lam_fac_rep_threat: "огромная сила, грозящая короне"
 lam_fac_rep_pillar: "опора, на которой держится корона"
 lam_fac_rep_mobilising: "недовольные, положившие руку на рукоять меча"
 lam_fac_rep_spurned: "те, кто считает, что у них отняли корону"
 lam_fac_rep_betrayed: "те, кого предал государь"
 lam_fac_rep_appeased: "те, кого едва удалось успокоить в последнюю ночь"
 lam_fac_rep_inlaw: "родня по браку, связанная кровью с королевским домом"
 lam_fac_rep_venerable: "именитая фракция, выстоявшая не одно десятилетие"
 lam_fac_rep_rabble: "сброд, готовый расколоться в любой день"
 lam_fac_rep_tight: "сплочённые люди, действующие как одно целое"
 lam_fac_rep_lone_defiant: "одинокий непокорный вассал"
 lam_fac_rep_lone: "сила, стоящая особняком"
 lam_fac_rep_voiced: "оппозиция, возвышающая голос при дворе"
 lam_fac_rep_rallying: "роялисты, сплотившиеся вокруг пошатнувшейся короны"
 lam_fac_rep_crowns_men: "приближённые, что стоят подле государя"
 lam_fac_rep_latent: "те, кто затаился и ждёт своего часа"
 lam_fac_rep_fledgling: "небольшая, только что возникшая группа"
 lam_fac_rep_plain: "одна из многих сил при дворе"
 lam_faction.0800.news1: "[ROOT.Char.Custom('LamFacNews1')]"
 lam_faction.0800.news2: "[ROOT.Char.Custom('LamFacNews2')]"
 lam_gn_books_label: "Летописи этого двора:"
 lam_gn_book_main: "Летопись нынешней державы"
 lam_gn_book_btn: "[Title.GetNameNoTier]"
 lam_gn_ev_migrated: "Продолжилась при новом государе"
 lam_fac_badge_holding: "#weak Присматривается к новому государю#!"
 lam_fac_badge_holding_tt: "С восшествия нового государя (или с того дня, как фракция оказалась при новом дворе) прошло меньше 6 месяцев. Пока что она лишь собирается, но не восстаёт и откладывает прошения. Исключение — фракция, чей кандидат упустил корону."
 lam_faction.1800.t: "Указ государя"
 lam_faction.1800.desc: "Зачитан указ [lam_ban_lord.GetTitledFirstName]: «Отныне собираться во фракции без дозволения государя — измена». Все взгляды обращены на меня. Фракция, которую я возглавляю, теперь тоже вне закона.\n\nМожно покориться указу и тихо распустить её — тогда её имя и наследие останутся в летописях и смогут дождаться дня, когда она вновь поднимется. А можно уйти во тьму. Трусливые уйдут, зато оставшиеся станут крепче прежнего. И запреты не вечны."
 lam_faction.1800.a: "Подчиниться указу и распустить фракцию"
 lam_faction.1800.a_tt: "Фракция распустится при следующем подсчёте. Её наследие (традиции, слава) сохранится, и тот, кто воссоздаст её, сможет его унаследовать. В родословной останется запись «Распущена по запрету». Сюзерен смотрит на меня благосклоннее (+15, 5 лет)."
 lam_faction.1800.b: "Уйти в подполье"
 lam_faction.1800.b_tt: "Фракция уходит в подполье. Сочувствующие и приближённые покидают её, остаётся только ядро. У меня и у ядра появляется преступный секрет «Запрещённая фракция». Сюзерен знает, что во главе фракции стою я, но не знает, кто остался. Мне достаётся «Подпольная сеть» (+10% к успеху происков против сюзерена). Если продержаться до отмены запрета, фракция вернётся как «Пережившая гонения» (сплочённость, престиж, слава, доверие членов фракции)."
 lam_faction.1810.t: "Фракции запрещены указом государя!"
 lam_faction.1810.desc: "При дворе оглашён указ [lam_ban_lord.GetTitledFirstName]: собираться во фракции без дозволения государя отныне — измена. Фракция [lam_ban_lead.GetShortUIName], в которой состою и я, — не исключение.\n\n"
 lam_faction.1810.obey: "Глава склоняется перед указом и распускает фракцию. Отныне у каждого из нас своя дорога."
 lam_faction.1810.stay: "Глава уводит фракцию в подполье. Трусливые ушли, но я остаюсь в ядре. Отныне я вне закона."
 lam_faction.1810.cut: "Глава уводит фракцию в подполье, но в этот узкий круг мне хода нет. Фракция ушла во тьму без меня, и 1 год мне нельзя вступать ни в одну фракцию."
 lam_faction.1810.wait: "Ответа от главы пока нет. Разойтись или скрыться?"
 lam_faction.1810.a: "Понимаю"
 lam_fac_ban_obeyed_title: "[lam_ban_lead.GetShortUIName] покоряется указу и распускает свою фракцию"
 lam_fac_ban_defied_title: "Фракция [lam_ban_lead.GetShortUIName] не распустилась и ушла в подполье"
 lam_fac_ban_obeyed_member_title: "Глава покоряется указу и распускает фракцию"
 lam_fac_ban_stay_member_title: "Глава уводит фракцию в подполье; я остаюсь в ядре"
 lam_fac_ban_cut_member_title: "Глава уводит фракцию в подполье; в узком кругу мне места нет"
 lam_fac_obeyed_opinion: "Роспуск фракции по указу"
 lam_fac_endured_opinion: "Фракция сохранена вопреки запрету"
 lam_fac_ug_born_title: "Фракция, основанная под запретом, с самого начала подпольная. Сюзерен даже не подозревает о её существовании"
 lam_fac_ug_born_founder_title: "Основанная мной фракция родилась в подполье. Сюзерен даже не подозревает о её существовании"
 lam_fac_surfaced_head_title: "Запрет снят. Наша фракция пережила гонения и вновь выходит на свет"
 lam_fac_surfaced_member_title: "Запрет снят. Пережившая гонения, наша фракция вновь выходит на свет"
 lam_fac_surfaced_lord_title: "Фракция, скрывавшаяся под запретом, вновь выходит на свет"
 lam_fac_tl_surfaced: "Пережила запрет и вновь вышла на свет"
 lam_fac_badge_endured: "#P Пережила гонения#!"
 lam_fac_badge_endured_tt: "Эта фракция продержалась в подполье, пока действовал запрет, и вернулась. По возвращении: сплочённость +15, престиж для главы, слава +5, а члены фракции больше доверяют главе (+15, 3 года). Отметка держится 5 лет."
 lam_fac_card_intel: "#weak Степень раскрытия:#! [Character.Custom('LamFacIntel')]"
 lam_fac_card_intel_tt: "Скрытая подпольная фракция видна другим лишь настолько, насколько её раскопали шпионы сюзерена. Если о ней ходят лишь слухи, видна карточка с вопросительными знаками; если раскрыт глава, её члены отображаются как «?». Раскрыто ядро — видно ядро; раскрыто всё — видны все. Фракция раскрывается сильнее, когда узнают чей-то секрет «Запрещённая фракция», когда кого-то разоблачают, когда кто-то доносит или является с повинной, или когда сюзерен копает глубже («Раскопать подполье»). Глава может откатить раскрытие на одну ступень («Замести следы»). Члены фракции всегда видят её целиком. Фракция, вышедшая из подполья и действующая открыто, показывает всех своих членов."
 lam_fac_intel_0: "#P Пока ничего не раскрыто#!"
 lam_fac_intel_1: "#P Лишь слухи#!"
 lam_fac_intel_2: "#high Раскрыт глава#!"
 lam_fac_intel_3: "#N Раскрыто ядро#!"
 lam_fac_intel_4: "#N Раскрыто всё#!"
 lam_fac_veil_title: "#N Неизвестная подпольная фракция#!"
 lam_fac_veil_lead: "#weak Глава#! ?"
 lam_fac_veil_members: "#weak Члены#! ?"
 lam_fac_veil_q: "?"
 lam_fac_veil_desc: "#weak Шпионы прознали, что где-то при дворе проходят запретные собрания. Кто ими руководит и кто туда ходит — пока неизвестно. Решение «Раскопать подполье» позволит копнуть глубже.#!"
 lam_fac_mrow_veiled: "#weak ? — участник, чья личность пока неизвестна#!"
 lam_fac_mrow_veiled_tt: "Известно лишь, что в этой фракции есть кто-то ещё. Кто именно — покажут только новые раскопки."
 lam_fac_ug_dig_decision: "Раскопать подполье"
 lam_fac_ug_dig_decision_tooltip: "Раскопать подполье"
 lam_fac_ug_dig_decision_desc: "Запрет не уничтожает фракции — лишь загоняет их во тьму. Сунуть шпионам денег, и пусть рыщут по ночному двору. Чем выше интрига тайного советника, тем больше они найдут. Найденное появится в окне фракций, а преступные секреты главы и ядра окажутся у меня в руках."
 lam_fac_ug_dig_decision_tt: "Одна подпольная фракция на выбор раскрывается ещё на ступень (шанс 35% + интрига тайного советника ×3, в пределах 20–90%; вдвое меньше, если фракция замела следы). Можно ничего не найти — и так и не узнать, то ли прятаться некому, то ли просто не нашли."
 lam_fac_ug_dig_cd_tt: "Не чаще раза в год"
 lam_fac_dig_named_title: "Шпионы раскопали подпольную фракцию [lam_dig_lead.GetShortUIName]"
 lam_fac_dig_rumour_title: "Шпионы прознали о подпольной фракции где-то при дворе"
 lam_fac_dig_none_title: "Шпионы ничего не нашли"
 lam_fac_dig_watched_title: "Шпионы сюзерена напали на след нашей фракции"
 lam_fac_ug_cover_decision: "Замести следы"
 lam_fac_ug_cover_decision_tooltip: "Замести следы"
 lam_fac_ug_cover_decision_desc: "Сменить место встреч, заплатить болтливым, сжечь письма. Оборвать нить, за которую ухватились шпионы сюзерена."
 lam_fac_ug_cover_decision_tt: "Осведомлённость сюзерена падает на одну ступень. На 2 года шпионы теряют нить: раскрытые секреты уже не повышают её, а «Раскопать подполье» удаётся вдвое реже."
 lam_fac_ug_cover_cd_tt: "Не чаще раза в 2 года"
 lam_fac_ug_cover_need_tt: "Сюзерену что-то известно о нашей фракции (когда раскрыто всё, заметать уже нечего)"
 lam_fac_ug_recruit_interaction: "Тайно завербовать"
 lam_fac_ug_recruit_interaction_desc: "Ночью навестить того, кто затаил злобу на сюзерена, и привлечь его в нашу подпольную фракцию. Согласившись, человек становится вне закона и присоединяется к нам; с каждым новичком риск разоблачения немного растёт. Если же отказавшийся предан сюзерену, он может тут же донести."
 lam_fac_ug_recruit_yes_tt: "Этот человек вступает в нашу подпольную фракцию (с вероятностью 10% мой секрет просочится к сюзерену)."
 lam_fac_ug_recruit_no_tt: "Если этот человек предан сюзерену, то с вероятностью один к двум донесёт. Тогда мой секрет раскроется, а сюзерен узнает о нашей фракции на ступень больше."
 lam_fac_ug_recruit_loyal_reason: "Верность сюзерену"
 lam_fac_ug_recruit_grudge_reason: "Злоба на сюзерена"
 lam_fac_ug_recruit_bold_reason: "Амбиции, мстительность, фанатизм"
 lam_fac_ug_recruit_craven_reason: "Малодушие"
 lam_fac_ug_told_title: "[recipient.GetShortUIName] отказывается — и доносит сюзерену"
 lam_fac_ug_silent_title: "[recipient.GetShortUIName] отказывается, но обещает молчать"
 lam_fac_ug_confess_interaction: "Явиться с повинной"
 lam_fac_ug_confess_interaction_desc: "Порвать с подпольной фракцией, предстать перед сюзереном и рассказать всё. Меня помилуют, но сюзерен узнает о нашей фракции всё вплоть до ядра (а если я из ядра — всё целиком). Глава сочтёт меня предателем, а мне придётся хранить секрет «Доносчик»."
 lam_fac_ug_confess_tt: "Я покидаю фракцию и больше не вне закона. Сюзерен узнаёт о нашей фракции всё вплоть до ядра (а если я из ядра — всё целиком). Глава считает меня предателем (−35). 3 года нельзя вступать ни в одну фракцию."
 lam_fac_ug_network_modifier: "Подпольная сеть"
 lam_fac_ug_network_modifier_desc: "Укрытия, гонцы с письмами, люди, которые чем-то обязаны. Глава подпольной фракции искуснее плетёт интриги против сюзерена."
 lam_gn_end_banned: "#N Распущена по запрету#!"
 lam_gn_ev_surfaced: "Пережила запрет, восстановлена в правах"
 lam_gn_lg_split: "откол"
 lam_gn_lg_revived: "преемство"
 lam_gn_lg_line: "общий корень"
 lam_fac_awe_line: "#P Мощь завоевателя#!"
 lam_fac_awe_line_tt: "Хозяин этого двора — завоеватель (черта «Завоеватель» или «Величайший из ханов», либо «Бич Божий»). Фракции не смеют идти против него и встают на сторону сюзерена. Отношение к сюзерену +50, решимость −40, восстаний нет."
 lam_fac_crushed_lord_title: "Подпольная фракция [lam_purged.GetShortUIName] разгромлена"
 lam_fac_crushed_member_title: "Главу схватили, и наша подпольная фракция разбита"
 lam_gn_end_crushed: "#N Разгромлена после ареста главы#!"
