 lam_fac_bar_favour_tt: "Благосклонность правителя может уживаться с недовольством, которое ещё осталось у фракции.\n[Character.Custom('LamUxCause1')][Character.Custom('LamUxCause2')][Character.Custom('LamUxCause3')][Character.Custom('LamUxRelief')]"
