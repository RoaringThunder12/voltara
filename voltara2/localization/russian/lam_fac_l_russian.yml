 rule_lam_fac_special_govs: "Living Factions: Япония и Китай"
 rule_lam_fac_special_govs_desc: "Японский императорский двор и сёгунат, а также китайские державы «Мандата» и меритократии в оригинальной игре ведут собственную придворную политику (церемониальные регенты, имперская политика, министры). По умолчанию («Сосуществование») фракции действуют и в этих державах, не закрывая собственных фракций оригинальной игры, а восставшая фракция поднимается через фракции самой державы (возвращение власти сюзерену, смена регента, имперская политика, распад). Серый кардинал не занимает место регента. Бюрократические державы (Византия и другие) устроены так же."
