 lam_sh_decree_interaction: "Издать королевский указ"
 lam_sh_decree_interaction_desc: "Издать королевский указ от имени марионеточного правителя: изменить авторитет короны, открыть королевскую казну, склонить вассалов на свою сторону, а если нужно — заставить короля отречься."
 lam_sd_up: "Усилить авторитет короны"
 lam_sd_down: "Ослабить авторитет короны"
 lam_sd_gold: "Открыть королевскую казну"
 lam_sd_favor: "Велеть вассалам следовать за мной"
 lam_sd_abdicate: "Заставить короля отречься"
 lam_sd_up_tt: "Авторитет короны в королевстве повышается на одну ступень."
 lam_sd_down_tt: "Авторитет короны в королевстве понижается на одну ступень."
 lam_sd_gold_tt: "Я забираю четверть королевской казны."
 lam_sd_favor_tt: "Все вассалы правителя на 5 лет лучше относятся ко мне (+25)."
 lam_sd_abdicate_tt: "Правитель отрекается, и на престол восходит наследник. Новый правитель тоже станет моей марионеткой (если наследник — я, трон мой). Престиж -500."
 lam_sd_law_cd_tt: "Авторитет короны можно менять лишь раз в год"
 lam_sd_gold_cd_tt: "Королевскую казну можно открывать лишь раз в год"
 lam_sd_favor_cd_tt: "Этот указ можно издавать лишь раз в 5 лет"
 lam_sd_abd_cd_tt: "Принудить к отречению можно лишь раз в 10 лет"
 lam_sd_heir_tt: "У правителя есть наследник"
 lam_fac_debug_seize_interaction: "(Отладка) Стать серым кардиналом при этом правителе"
 lam_fac_debug_seize_interaction_desc: "Только в режиме отладки: немедленно и без всяких условий сделать этого правителя своей марионеткой."
 lam_fac_debug_seize_decision: "(Отладка) Стать серым кардиналом при своём сюзерене"
 lam_fac_debug_seize_decision_desc: "Только в режиме отладки: немедленно и без всяких условий сделать своего сюзерена марионеткой (для проверки)."
 lam_fac_debug_seize_decision_tooltip: "Тестовая кнопка, только для режима отладки."
 lam_fac_debug_seize_tt: "Сразу стать властью за троном (сохраняется независимо от доли фракции)."
 lam_sh_inherit_title: "Король умер. Но и новый правитель в моих руках"
 lam_sh_heir_strings_title: "Нити предшественника перешли ко мне: этот правитель теперь моя марионетка"
 lam_sh_power_modifier: "Власть за троном"
 lam_sh_power_modifier_desc: "Все знают, где настоящая власть. Просьбы и подарки не иссякают, а политические интриги при дворе вершатся по моей воле."
 lam_shadow.0001.t: "Тайное письмо короля"
 lam_shadow.0001.desc: "Мои люди перехватили тайное письмо. Отправитель — [lam_sh_king.GetFirstName], получатель — старый друг при далёком дворе. Мольба ли это о спасении или просто жалоба — не узнать, не прочитав."
 lam_shadow.0001.a: "Предъявить письмо королю и потребовать ответа"
 lam_shadow.0001.b: "Притвориться, что ничего не знаю, и пропустить письмо"
 lam_shadow.0002.t: "Вереница просителей"
 lam_shadow.0002.desc: "С самого утра у ворот моего дома выстроилась очередь. Те, кому нужна королевская печать, идут не к королю, а ко мне. И у каждого в руках подарок."
 lam_shadow.0002.a: "Принять подарки"
 lam_shadow.0002.b: "Вежливо отослать их"
 lam_shadow.0002.c: "Отправить подарки в королевскую казну"
 lam_shadow.0003.t: "Подозрения королевской семьи"
 lam_shadow.0003.desc: "[lam_sh_rel.GetTitledFirstName] повсюду говорит обо мне в окружении короля: «Чей же вы король, ваше величество?» Пока это лишь шёпот, но шёпот расходится."
 lam_shadow.0003.a: "Посадить под домашний арест и заставить замолчать"
 lam_shadow.0003.b: "Сунуть золота и успокоить"
 lam_shadow.0003.c: "Оставить как есть"
 lam_shadow.0004.t: "Иноземный посланник"
 lam_shadow.0004.desc: "Во дворец прибыл посланник из далёкой страны. Но прежде чем предстать перед троном, он постучал в мою дверь. Видно, ему уже сказали, перед кем следует склонить голову."
 lam_shadow.0004.a: "Принять лично"
 lam_shadow.0004.b: "Отправить его к королю"
 lam_shadow.0005.t: "Воспитание наследника"
 lam_shadow.0005.desc: "Наследник короля, [lam_sh_heir.GetFirstName], ещё совсем ребёнок. Кто окажется рядом с ним сейчас, тот и решит, чьё слово этот ребёнок будет слушать потом."
 lam_shadow.0005.a: "Вырастить своим человеком"
 lam_shadow.0005.b: "Оставить это королю"
 lam_shadow.0006.t: "Вельможа подаёт голос"
 lam_shadow.0006.desc: "Перед лицом короля [lam_sh_critic.GetTitledFirstName] открыто обличает меня: «Тот, кто прячется за троном, губит эту державу». Все ждут моего ответа."
 lam_shadow.0006.a: "Бросить в подземелье в назидание другим"
 lam_shadow.0006.b: "Тихо послать золото"
 lam_shadow.0006.c: "Сделать вид, что не слышу"
 lam_shadow.0007.t: "Брешь в казне"
 lam_shadow.0007.desc: "В королевских счетах есть дыра. Каждый месяц через неё приходят и уходят деньги, о которых никто не знает. Чуть повернуть этот поток — дело нехитрое."
 lam_shadow.0007.a: "Прибрать к рукам"
 lam_shadow.0007.b: "Не трогать"
 lam_shadow.0008.t: "Похвала на пиру"
 lam_shadow.0008.desc: "На пиру [lam_sh_king.GetFirstName] поднимает кубок в мою честь. Голос дрожит, но слова звучат ясно. И все знают, чья это воля."
 lam_shadow.0008.a: "Принять рукоплескания"
 lam_shadow.0008.b: "Отдать заслугу королю"
 lam_shadow.0009.t: "Истинный король"
 lam_shadow.0009.desc: "По рынку ходит слух: настоящий король не тот, кто сидит на троне, а тот, кто стоит за ним. До короля этот слух наверняка тоже дошёл."
 lam_shadow.0009.a: "Раздувать слух"
 lam_shadow.0009.b: "Заглушить слух"
 lam_shadow.0009.c: "Обратить слух в своё влияние"
 lam_shadow.0010.t: "Искушение ядом"
 lam_shadow.0010.desc: "Каждую ночь кубок короля наполняет один и тот же слуга. Этот слуга — мой человек. Если король умрёт, нити перейдут к наследнику. А если повезёт — в руки, которыми легче управлять."
 lam_shadow.0010.a: "Подсыпать яд в кубок"
 lam_shadow.0010.b: "Ещё не время"
 lam_shadow.0011.t: "Предложение другой фракции"
 lam_shadow.0011.desc: "Поздней ночью явился посланец от [lam_sh_other.GetTitledFirstName] с предложением поделить место за троном. Откажу — станет одним врагом больше."
 lam_shadow.0011.a: "Объединиться"
 lam_shadow.0011.b: "Растоптать"
 lam_shadow.0012.t: "Строптивость короля"
 lam_shadow.0012.desc: "Сегодня в тронном зале [lam_sh_king.GetFirstName] впервые, на глазах у всех, открыто идёт против моего слова. Голос дрожит, но отступать никто не собирается. Уступлю раз — так будет и впредь."
 lam_shadow.0012.a: "Осадить короля на месте"
 lam_shadow.0012.b: "На этот раз дать королю сохранить лицо"
 lam_shadow.0013.t: "Чиновники выбирают сторону"
 lam_shadow.0013.desc: "У каждого ведомства выстроились очереди из чиновников. Те, кто жаждет повышения и должности, идут присягать на верность не королю, а мне."
 lam_shadow.0013.a: "Принять их верность"
 lam_shadow.0013.b: "Отказаться"
 lam_shadow.0014.t: "Король, утонувший в вине"
 lam_shadow.0014.desc: "В последнее время [lam_sh_king.GetFirstName] каждую ночь не выпускает кубка из рук. Пьяный король ничему не перечит."
 lam_shadow.0014.a: "Оставить всё как есть"
 lam_shadow.0014.b: "Помочь бросить пить"
 lam_shadow.0015.t: "Королевский совет"
 lam_shadow.0015.desc: "Сегодня вести королевский совет выпало мне. Король сидит на троне, но взгляды всех советников обращены ко мне."
 lam_shadow.0015.a: "Вести совет"
 lam_shadow.0015.b: "Уступить место королю"
 lam_shadow.0016.t: "Ответный удар короля"
 lam_shadow.0016.desc: "Что наша сила уже не та, что прежде, понимает и [lam_sh_king.GetFirstName]. За одну ночь люди короля заперли ворота дворца и увели нескольких моих приближённых. Впервые король обнажил меч."
 lam_shadow.0016.a: "Встретить удар лицом к лицу"
 lam_shadow.0016.b: "Отступить на шаг и перевести дух"
 lam_shadow.0016.c: "Подкупить приближённых короля"
 lam_shadow.0016.d: "Отпустить нити"
 lam_shadow.0010.a.tt: "Король умирает. Нити могут перейти к наследнику — или оборваться."
 lam_shadow.0016.win_tt: "Ответный удар короля сломлен. Король вновь склоняет голову."
 lam_shadow.0016.lose_tt: "При неудаче нити оборвутся: король обретёт свободу, а мне не избежать большого позора."
 lam_shadow.0016.yield_tt: "Нити удержатся, но 2 года нельзя будет издавать указы об авторитете короны и о королевской казне."
 lam_shadow.0016.go_tt: "Нити отпущены: король становится свободным правителем."
 lam_faction.3000.t: "Колеблющийся соратник"
 lam_faction.3000.desc_to: "В последнее время [lam_wv_who.GetTitledFirstName] редко появляется на наших встречах. Говорят, часто водится с людьми из лагеря [lam_wv_to.GetTitledFirstName]. Если не удержать сейчас, на следующей встрече будет сидеть уже по ту сторону."
 lam_faction.3000.desc_out: "[lam_wv_who.GetTitledFirstName] намекает, что хочет отойти от дел фракции. Усталость ли тому причина или иной расчёт — не понять. Если не удержать сейчас, тихо исчезнет."
 lam_faction.3000.a: "Встретиться лично и переубедить"
 lam_faction.3000.b: "Удержать золотом"
 lam_faction.3000.c: "Пустить в ход крючок, что у меня есть"
 lam_faction.3000.d: "Пообещать место в ядре"
 lam_faction.3000.e: "Отпустить"
 lam_faction.3000.ok_tt: "[lam_wv_who.GetFirstName] остаётся в нашей фракции на 2 года."
 lam_faction.3000.fail_tt: "Если уговоры не помогут, [lam_wv_who.GetFirstName] уйдёт."
 lam_faction.3000.hook_tt: "[lam_wv_who.GetFirstName] остаётся в нашей фракции на 3 года."
 lam_faction.3000.core_tt: "[lam_wv_who.GetFirstName] входит в ядро и остаётся на 2 года."
 lam_faction.3000.go_tt: "[lam_wv_who.GetFirstName] уходит, но помнит, что мы расстались по-доброму (10 лет охотнее откликнется, если я позову снова)."
 lam_fac_stage_shadow: "#high Правят из тени (власть за троном)#!"
 lam_fac_view_up: "Двор вышестоящего правителя"
 lam_fac_view_up_tt: "Показать сюзерена того двора, который вы сейчас смотрите, и фракции его двора. Каждое нажатие поднимает на ступень выше (вплоть до верховного правителя). Чтобы вернуться — «Посмотреть свой двор»."
 lam_faction.2940.t: "Удержатся ли нити?"
 lam_faction.2940.desc_king: "На троне новый хозяин. Будет ли [lam_sh_new.GetTitledFirstName] так же покорно слушать меня, как прежний король, — пока неизвестно. А приближённые уже присматриваются к настроению нового правителя."
 lam_faction.2940.desc_heir: "Нити, которые держал мой предшественник, перешли в мои руки. Но [lam_sh_new.GetTitledFirstName] хочет проверить, чего стоит новое лицо. Упущу сейчас — больше их не поймать."
 lam_faction.2940.a: "Действовать как прежде"
 lam_faction.2940.b: "Разбросать золото среди приближённых"
 lam_faction.2940.c: "Подавить страхом"
 lam_faction.2940.d: "Отпустить нити"
 lam_faction.2940.ok_tt: "Нити держатся: [lam_sh_new.GetFirstName] по-прежнему моя марионетка."
 lam_faction.2940.go_tt: "[lam_sh_new.GetFirstName] становится свободным правителем."
 lam_sh_snapped_title: "Нити оборвались: новый правитель больше не в моих руках"
 lam_sh_royal_interaction: "Взять члена королевской семьи в свой дом"
 lam_sh_royal_interaction_desc: "Властью, что стоит за троном, взять супруга или взрослого ребёнка марионеточного правителя себе в супруги или в наложницы. Если это супруг или супруга правителя, брак с правителем сначала расторгается. Двор шепчется, а правитель снова и снова переживает унижение."
 lam_tr_spouse: "Взять в супруги"
 lam_tr_concubine: "Взять в наложницы"
 lam_sh_royal_cd_tt: "Не чаще раза в год"
 lam_sh_royal_counter_tt: "Униженный правитель может набраться смелости для ответного удара (выжидание перед ответным ударом короля отменяется)."
 lam_fac_clash_spoils_tt: "Спор за места в совете: сторона, которую вы поддержали, забирает у проигравших одно место в совете (канцлер, маршал, управляющий или тайный советник), а один человек проигравших переходит к победителям."
 lam_fac_feud_title: "Теперь эти две фракции — заклятые враги. Ещё одно столкновение — и прольётся кровь"
 lam_fac_ally_rose_title: "Союзная фракция подняла восстание. Подниматься ли вместе с ней — решать мне"
 lam_faction.3010.t: "Кровная вражда"
 lam_faction.3010.desc: "Третье столкновение с фракцией [lam_bf_foe.GetTitledFirstName]. Это уже не придворная политика. Там, наверное, думают так же. Выживет тот, кто первым сделает ход."
 lam_faction.3010.a: "Ударить первым (замыслить убийство)"
 lam_faction.3010.b: "Прийти с золотом и просить мира"
 lam_faction.3010.c: "Выжидать"
 lam_faction.3010.b_tt: "Обида между двумя фракциями забыта (соперничество и вражда исчезают)."
 lam_faction.3010.c_tt: "Та сторона может сделать ход первой."
 lam_fac_card_inf: "#weak Казна влияния:#! [Character.MakeScope.Var('lam_fac_inf').GetValue|0]"
 lam_fac_card_inf_tt: "При бюрократическом дворе сюда копятся взносы членов фракции (ядро — 6, сторонники — 3 за сезон, если у них не меньше 50 влияния). Глава тратит их, чтобы выдвигать наших людей на императорский трон или в губернаторы фем либо снижать шансы кандидатов соперничающих фракций (30 приоритета претензий за 100 — в 1,5 раза больше, чем при трате в одиночку)."
 lam_fac_adm_back_interaction: "Поддержать кандидата из казны фракции"
 lam_fac_adm_back_interaction_desc: "Потратить 100 из казны влияния фракции, чтобы выдвинуть этого человека на императорский трон или в губернаторы родной фемы (приоритет претензий +30)."
 lam_fac_adm_harm_interaction: "Подорвать кандидата из казны фракции"
 lam_fac_adm_harm_interaction_desc: "Потратить 100 из казны влияния фракции, чтобы снизить приоритет претензий человека из соперничающей фракции на императорский трон или пост губернатора родной фемы (−30)."
 lam_fac_adm_chest_tt: "В казне влияния фракции не меньше 100"
 lam_adb_throne: "Кандидатом на трон"
 lam_adb_gov: "Кандидатом в губернаторы родной фемы"
 lam_adh_throne: "Среди кандидатов на трон"
 lam_adh_gov: "Среди кандидатов в губернаторы родной фемы"
 lam_fac_adm_back_tt: "Казна фракции −100. Приоритет претензий этого человека +30."
 lam_fac_adm_harm_tt: "Казна фракции −100. Приоритет претензий этого человека −30. Меня за это возненавидят."
 lam_facx.0001.t: "Застолье после собрания"
 lam_facx.0001.d1: "Собрание кончилось, и [lam_x_mate.GetFirstName] тянет меня за рукав: «Не жаль ли вот так расходиться?» В таверне ещё горит свет."
 lam_facx.0001.d2: "Едва чопорное собрание закончилось, кое-кто достал кубки. В самой гуще [lam_x_mate.GetFirstName], придержав для меня место, машет рукой."
 lam_facx.0001.d3: "Только я выхожу из зала собраний, следом выходит и [lam_x_mate.GetFirstName]: «В такой день грех не выпить». А за чаркой люди выкладывают всё, что на душе."
 lam_facx.0001.a: "Выпить вместе"
 lam_facx.0001.b: "Уйти пораньше"
 lam_facx.0001.c: "Прислушаться к пьяным речам"
 lam_facx.0002.t: "Просьба главы"
 lam_facx.0002.d1: "Меня тихо отзывает в сторону [lam_x_head.GetTitledFirstName]: на дела фракции срочно не хватает денег. Звучит это скорее как проверка, чем как просьба."
 lam_facx.0002.d2: "«На тебя-то можно положиться». С этими словами [lam_x_head.GetFirstName] обращается ко мне с небольшой просьбой. Исполню — мне будут обязаны; откажу — на мне останется пятно."
 lam_facx.0002.d3: "Пришло письмо от главы. Слог учтивый, но между строк сквозит ожидание: соратник в такой час должен протянуть руку помощи."
 lam_facx.0002.a: "Исполнить просьбу"
 lam_facx.0002.b: "Вежливо отказать"
 lam_facx.0003.t: "Зов другой фракции"
 lam_facx.0003.d1: "Поздно ночью явился человек от [lam_x_rival.GetTitledFirstName]: «И это всё, чем вас там жалуют? У нас и место было бы иное»."
 lam_facx.0003.d2: "На охоте [lam_x_rival.GetFirstName] будто невзначай заводит со мной разговор. Слова будто брошены мимоходом — но мимоходом такое не говорят."
 lam_facx.0003.d3: "Записка без печати: «Вас ждёт место получше». Почерк писаря, что служит у [lam_x_rival.GetFirstName]."
 lam_facx.0003.a: "Отказать и сообщить главе"
 lam_facx.0003.b: "Сказать лишь, что подумаю"
 lam_facx.0003.c: "Перейти к ним тут же"
 lam_facx.0004.t: "Фонд фракции"
 lam_facx.0004.d1: "Фракция собирает средства. Кто сколько дал, знают все. И все запоминают."
 lam_facx.0004.d2: "[lam_x_head.GetFirstName] открывает передо мной сундук. Он пуст. И без слов ясно, чего от меня ждут."
 lam_facx.0004.a: "Щедро внести свою долю"
 lam_facx.0004.b: "Отдать всё до последнего"
 lam_facx.0004.c: "Сослаться на тяжёлые времена"
 lam_facx.0005.t: "Соратник в беде"
 lam_facx.0005.d1: "Дошли вести, что казна у [lam_x_mate.GetTitledFirstName] опустела, а у дверей караулят заимодавцы. Тот, кого я называю соратником, загнан в угол."
 lam_facx.0005.d2: "[lam_x_mate.GetFirstName] уже не встаёт с постели. Гордость не позволит просить о помощи, но почерк в присланном письме дрожит."
 lam_facx.0005.d3: "В войне [lam_x_mate.GetFirstName] сдаёт позицию за позицией. Вся фракция смотрит, кто протянет руку помощи."
 lam_facx.0005.a: "Помочь (послать золото)"
 lam_facx.0005.b: "Сделать вид, что не знаю"
 lam_facx.0006.t: "Слухи о преемнике"
 lam_facx.0006.d1: "При дворе ходит слух: после [lam_x_head.GetFirstName] настанет мой черёд. А лицо самого главы застыло."
 lam_facx.0006.d2: "На пиру кто-то, наполняя мой кубок, назвал меня «будущим главой». Грянул смех — смеялись все, кроме [lam_x_head.GetFirstName]."
 lam_facx.0006.d3: "Молва о том, что я — следующее лицо фракции, дошла уже до рыночных площадей. Кто её пустил — не знаю, но мне это не претит."
 lam_facx.0006.a: "Наслаждаться слухами"
 lam_facx.0006.b: "Твёрдо опровергнуть перед главой"
 lam_facx.0101.t: "Новое лицо"
 lam_facx.0101.d1: "[lam_x_new.GetTitledFirstName] приходит с просьбой о вступлении в нашу фракцию. Этот человек пока не примкнул ни к одной стороне."
 lam_facx.0101.d2: "«Я хочу стоять под вашим знаменем», — [lam_x_new.GetFirstName] склоняет голову. Одним рвением фракцию не построить, но и без рвения она не устоит."
 lam_facx.0101.d3: "Прослышав о нас, приходит [lam_x_new.GetFirstName]. Примем — станет одним своим больше, а значит, и одним ртом больше."
 lam_facx.0101.a: "Принять в ядро"
 lam_facx.0101.b: "Принять сторонником"
 lam_facx.0101.c: "Отослать прочь"
 lam_facx.0102.t: "Обряд сплочения"
 lam_facx.0102.d1: "[lam_x_mate.GetFirstName] предлагает провести обряд клятвы: если пить из одной чаши и произносить одни и те же слова, то и сердца станут едины."
 lam_facx.0102.d2: "Поговаривают, что во фракции ослабли узы. Пора собрать всех вместе и обновить клятву."
 lam_facx.0102.d3: "Есть старый обычай: все члены фракции кладут руку на меч главы и приносят клятву. Сейчас так уже никто не делает — и потому это весит больше."
 lam_facx.0102.a: "Устроить пышный обряд"
 lam_facx.0102.b: "Связать сердца словом"
 lam_facx.0103.t: "Недовольство ядра"
 lam_facx.0103.d1: "На собрании [lam_x_mate.GetTitledFirstName] повышает голос: «Сколько мы пролили крови — столько должно быть и голоса!»"
 lam_facx.0103.d2: "[lam_x_mate.GetFirstName] приходит ко мне наедине и изливает недовольство: за всё, что отдано фракции, воздают из рук вон плохо."
 lam_facx.0103.d3: "У [lam_x_mate.GetFirstName], человека из ядра фракции, на лице написано недовольство. Не успокоить сейчас — другие последуют примеру."
 lam_facx.0103.a: "Дать больше голоса"
 lam_facx.0103.b: "Отчитать и велеть знать своё место"
 lam_facx.0103.c: "Заткнуть рот золотом"
 lam_facx.0104.t: "Шпион во фракции"
 lam_facx.0104.d1: "Видели, как [lam_x_mate.GetFirstName] тайно встречается с человеком из окружения [lam_x_rival.GetFirstName]. Всё, о чём мы говорили на собраниях, уходило на сторону."
 lam_facx.0104.d2: "Странно, но о наших решениях [lam_x_rival.GetFirstName] всегда узнаёт раньше всех. След привёл к [lam_x_mate.GetFirstName]."
 lam_facx.0104.d3: "Перехваченное письмо. Почерк выдаёт автора: [lam_x_mate.GetFirstName]. Адресат: [lam_x_rival.GetFirstName]."
 lam_facx.0104.a: "Изгнать"
 lam_facx.0104.b: "Сделать двойным агентом"
 lam_facx.0104.c: "Сделать вид, что ничего не было"
 lam_facx.0105.t: "Знамя и имя"
 lam_facx.0105.d1: "Члены фракции хотят собственное знамя. Всего лишь кусок ткани — но порой люди умирают и за кусок ткани."
 lam_facx.0105.d2: "У каждой другой фракции есть свой герб и девиз. Нашим людям тоже нужно что-то, чем можно гордиться."
 lam_facx.0105.a: "Позвать мастера и сшить знамя"
 lam_facx.0105.b: "Отказаться: пустая показуха"
 lam_facx.0106.t: "Совет старейшины"
 lam_facx.0106.d1: "Опираясь на посох, приходит старейшина фракции [lam_x_mate.GetFirstName]: «Молодой глава, выслушайте ворчание старого человека»."
 lam_facx.0106.d2: "[lam_x_mate.GetFirstName] при дворе ещё с тех времён, когда этой фракции и в помине не было. И вот, с тревогой на лице, просит выслушать."
 lam_facx.0106.d3: "Старейшина [lam_x_mate.GetFirstName] протягивает мне советы, написанные за ночь. В тесных строках — одна за другой старые неудачи."
 lam_facx.0106.a: "Внимательно выслушать"
 lam_facx.0106.b: "Сказать, что времена изменились"
 lam_facx.0201.t: "Два приглашения"
 lam_facx.0201.d1: "В один и тот же вечер пришли два приглашения: одно — от [lam_x_rival.GetTitledFirstName], другое — от [lam_x_rival2.GetTitledFirstName]. На оба не пойти."
 lam_facx.0201.d2: "[lam_x_rival.GetFirstName] и [lam_x_rival2.GetFirstName] устраивают пиры в один и тот же день. Это не может быть случайностью. За чей стол я сяду — то и будет ответом."
 lam_facx.0201.d3: "Обе фракции хотят заполучить меня. Весь двор будет следить, в каком зале я появлюсь этим вечером."
 lam_facx.0201.a: "Пойти на пир к [lam_x_rival.GetFirstName]"
 lam_facx.0201.b: "Пойти на пир к [lam_x_rival2.GetFirstName]"
 lam_facx.0201.c: "Вежливо отказать обоим"
 lam_facx.0202.t: "Цена нейтралитета"
 lam_facx.0202.d1: "Не вставать ни на чью сторону — тоже выбор. И этот выбор не по душе ни одной из сторон."
 lam_facx.0202.d2: "В последнее время ни [lam_x_rival.GetFirstName], ни [lam_x_rival2.GetFirstName] не смотрят на меня ласково. Нейтралитет, как оказалось, не даётся даром."
 lam_facx.0202.a: "Послать подарки обоим"
 lam_facx.0202.b: "Открыто объявить о нейтралитете"
 lam_facx.0203.t: "Просьба о посредничестве"
 lam_facx.0203.d1: "[lam_x_rival.GetFirstName] и [lam_x_rival2.GetFirstName] пришли ко мне вместе. Друг с другом не обмениваются ни словом, а мне хотят сказать многое."
 lam_facx.0203.d2: "Ссора двух фракций затянулась, и кто-то назвал моё имя: «Рассудить должен тот, кто ни на чьей стороне»."
 lam_facx.0203.d3: "Двор устал от вражды двух фракций. И все взгляды обратились к человеку вне фракций — ко мне."
 lam_facx.0203.a: "Взяться за посредничество"
 lam_facx.0203.b: "Отойти в сторону: не моё дело"
 lam_facx.0301.t: "Пир для глав"
 lam_facx.0301.d1: "Кто-то предложил усадить глав фракций за один стол. Говорят же в старину: кто делит хлеб, тот реже обнажает меч."
 lam_facx.0301.d2: "Главы фракций, и [lam_x_rival.GetTitledFirstName] в их числе, теперь даже не смотрят друг другу в глаза. Пора устроить пир и разрядить обстановку."
 lam_facx.0301.d3: "Камергер принёс замысел пира. В самом верху списка гостей — имена глав фракций."
 lam_facx.0301.a: "Устроить пир"
 lam_facx.0301.b: "Пустая трата"
 lam_facx.0302.t: "Анонимный донос"
 lam_facx.0302.d1: "К подножию трона подбросили донос без подписи. В нём сказано, что [lam_x_rival.GetTitledFirstName] замышляет измену."
 lam_facx.0302.d2: "«Остерегайтесь [lam_x_rival.GetFirstName]». Всего одна строка. Кто её написал и зачем — неизвестно."
 lam_facx.0302.d3: "Тайный советник передал мне записку — говорит, нашли у дворцового колодца. На ней снова и снова выведено имя [lam_x_rival.GetFirstName]."
 lam_facx.0302.a: "Тихо разузнать"
 lam_facx.0302.b: "Сжечь"
 lam_facx.0302.c: "Открыто потребовать ответа"
 lam_facx.0303.t: "Коллективное прошение"
 lam_facx.0303.d1: "Подано прошение, под которым бок о бок стоят подписи многих вассалов. Во главе списка — [lam_x_rival.GetFirstName]."
 lam_facx.0303.d2: "Подано прошение. Страшнее его содержания — плотные ряды подписей под ним."
 lam_facx.0303.a: "Выслушать прошение"
 lam_facx.0303.b: "Вернуть прошение"
 lam_facx.0304.t: "Вызов на поединок"
 lam_facx.0304.d1: "[lam_x_rival.GetFirstName] и [lam_x_rival2.GetFirstName] просят дозволения решить спор поединком."
 lam_facx.0304.d2: "Главы двух фракций бросили перчатки. Осталось лишь моё дозволение. А двор уже делает ставки."
 lam_facx.0304.d3: "«Ваше величество, позвольте покончить с этим клинком», — говорит [lam_x_rival.GetFirstName], и [lam_x_rival2.GetFirstName] согласно кивает."
 lam_facx.0304.a: "Разрешить поединок"
 lam_facx.0304.b: "Запретить поединок"
 lam_facx.0305.t: "Выбор стороны"
 lam_facx.0305.d1: "Придворные толпой идут во фракцию [lam_x_rival.GetFirstName], а у [lam_x_rival2.GetFirstName] пустеет. Равновесие рушится."
 lam_facx.0305.d2: "Весы, что слишком накренились, однажды опрокидываются. Пора ли поддержать малую фракцию — или довериться течению?"
 lam_facx.0305.a: "Поддержать слабую сторону"
 lam_facx.0305.b: "Довериться течению"
 lam_facx.0001.c_tt: "Можно поймать кого-нибудь на пьяной обмолвке (с вероятностью 35% — крючок)."
 lam_facx.0003.c_tt: "Я перехожу во фракцию [lam_x_rival.GetFirstName] и вхожу в ядро (на 2 года без права уйти)."
 lam_facx.0004.b_tt: "Я вхожу в ядро фракции."
 lam_facx.0101.a_tt: "[lam_x_new.GetFirstName] входит в ядро нашей фракции (на 2 года без права уйти)."
 lam_facx.0101.b_tt: "[lam_x_new.GetFirstName] становится сторонником нашей фракции (на 1 год без права уйти)."
 lam_facx.0104.a_tt: "[lam_x_mate.GetFirstName] изгоняется из фракции."
 lam_facx.0104.b_tt: "Шанс один из двух получить крючок на [lam_x_rival.GetFirstName]."
 lam_facx.0203.ok: "Главы нехотя пожали друг другу руки."
 lam_facx.0203.fail: "Посредничество провалилось, и теперь меня винят обе стороны."
 lam_facx.0302.found: "Донос оказался правдой."
 lam_facx.0302.nothing: "Ничего не нашлось. А [lam_x_rival.GetFirstName] знает о проверке."
 lam_facx.0304.a_win: "Побеждает [lam_x_rival.GetFirstName]."
 lam_facx.0304.b_win: "Побеждает [lam_x_rival2.GetFirstName]."
 lam_fac_clash_spoils_heir_tt: "Спор о наследнике: кандидат стороны, которую вы поддержали, набирает вес (ещё +10 к благосклонности сюзерена), а проигравшие колеблются (сплочённость −5)."
 lam_fac_clash_spoils_face_tt: "Спор о чести: сторона, которую вы поддержали, получает престиж, проигравшие его теряют, а один человек проигравших переходит к победителям."
 lam_faction.3010.why_heir: "\n\n#weak Началось всё с вопроса, кого прочить в следующие правители.#!"
 lam_faction.3010.why_council: "\n\n#weak Началось всё с одного места в совете.#!"
 lam_faction.3010.why_crown: "\n\n#weak Началось всё с того, как относиться к власти короны.#!"
 lam_faction.3010.why_old: "\n\n#weak С чего всё началось, теперь уже никто толком не помнит.#!"
 lam_faction.3000.why_head: "\n\n#weak Причина: отношения со мной испорчены. Переубедить будет трудно.#!"
 lam_faction.3000.why_other: "\n\n#weak Причина: другая сторона манит сильнее.#!"
 lam_faction.3000.why_tired: "\n\n#weak Причина: усталость от дел фракции. Нужно лишь поддержать дух.#!"
 lam_fac_pr_council: "Место в совете — выполнено, когда глава или член нашей фракции займёт место в совете сюзерена"
 lam_fac_pr_marriage: "Брак — выполнено, когда кто-то из наших вступит в брак с членом семьи сюзерена"
 lam_fac_pr_campaign: "Поход — выполнено, когда сюзерен начнёт наступательную войну"
 lam_fac_pr_faith: "Вера — выполнено, когда все советники иной веры покинут совет сюзерена"
 lam_fac_pr_no_revoke: "Без отъёма титулов — выполнено, если до срока не отнят ни один титул (один-единственный отъём сразу нарушает обещание)"
 lam_fac_badge_promise_tt: "Обещание от [Character.MakeScope.Var('lam_fac_promise_by').Char.GetShortUIName]: [Character.Custom('LamFacPromiseWhat')]\nОсталось: около #high [Character.MakeScope.ScriptValue('lam_fac_promise_left_value')|0] мес.#!\n\n#weak Если обещание выполнено в срок, благосклонность растёт; если нарушено — его запомнят как предательство. Если выполнить его стало невозможно (правление без совета, не осталось родни для брака, идёт оборонительная война), обещание теряет силу. У каждой фракции одновременно может быть лишь одно обещание.#!"
 lam_fac_promise_due_title: "До срока обещания, данного фракции [lam_pr_lead.GetShortUIName], осталось меньше трёх месяцев: [lam_pr_lead.Custom('LamFacPromiseWhat')]"
 lam_fac_succ_brief_title: "[lam_sb_new.GetShortUIName] — новый глава нашей фракции. Обещания и поддержка наследника остаются в силе"
 lam_faction.3020.t: "Фракция переходит ко мне"
 lam_faction.3020.desc: "После [lam_sb_old.GetShortUIName] эту фракцию теперь веду я. Вместе с ней ко мне перешли её имя, история и неисполненные обещания."
 lam_faction.3020.promise: "\n\n· Обещание сюзерена: [ROOT.Char.Custom('LamFacPromiseWhat')] (осталось около [ROOT.Char.MakeScope.ScriptValue('lam_fac_promise_left_value')|0] мес.)"
 lam_faction.3020.heir: "\n· Наследник, которого мы поддерживаем: [ROOT.Char.MakeScope.Var('lam_fac_heir').Char.GetShortUIName]"
 lam_faction.3020.oath: "\n· Клятва верности сюзерену всё ещё в силе"
 lam_faction.3020.grievance: "\n· Обида на сюзерена ещё не забыта"
 lam_faction.3020.a: "Держаться курса предшественника"
 lam_faction.3020.b: "Выбрать новый курс"
 lam_faction.3020.b_tt: "Заново выбрать, как фракция держится с сюзереном. Перемена может настроить против себя часть членов."
 lam_fac_why_awe: "Перед мощью завоевателя никто не смеет выступить"
 lam_fac_why_faith_hostile: "Вера сюзерена враждебна нашей"
 lam_fac_why_sacrilege: "Сюзерен держит наложниц вопреки нашей общей вере"
 lam_fac_why_zealot: "Мы — ревнители веры, а у сюзерена вера иная"
 lam_fac_why_parochial: "Мы — местники, а законы короны давят на провинции"
 lam_fac_why_kin: "Из одного дома с сюзереном"
 lam_fac_why_fear: "#N Недовольны, но молчат из страха#! (ничего не решено)"
 lam_fac_why_council: "Есть место в совете сюзерена"
 lam_fac_why_like: "Глава хорошо относится к сюзерену"
 lam_fac_why_dislike: "Глава не любит сюзерена"
 lam_fac_why_none: "Ничего не выделяется: многие обстоятельства весят примерно одинаково"
 lam_fac_card_next: "#weak Насущный вопрос:#! [Character.Custom('LamUxCauseShort')]"
 lam_fac_card_next_tt: "#high Что видно при дворе#!\n[Character.Custom2('LamUxNext', GetPlayer)]\n[Character.Custom('LamLfPublic')]\n\n#high Неулаженное недовольство#![Character.Custom('LamUxCause1')][Character.Custom('LamUxCause2')][Character.Custom('LamUxCause3')][Character.Custom('LamUxRelief')][Character.Custom2('LamUxIntel', GetPlayer)]"
 lam_fac_next_promise: "Ждёт исполнения обещания сюзерена ([Character.Custom('LamFacPromiseWhat')])"
 lam_fac_next_armed: "#N Подняли оружие#!"
 lam_fac_next_hiding: "Затаились и ждут своего часа"
 lam_fac_next_demand: "Собираются предъявить сюзерену требование"
 lam_fac_next_arming: "#N Готовятся взяться за оружие#!"
 lam_fac_next_court: "Как придворная партия — опора короны"
 lam_fac_next_none: "#weak Пока ничего не замышляют#!"
 lam_fac_vote_weight: "\n\nГолос складывается из военной и экономической силы, положения, веса при дворе, связей и заслуг."
 lam_tk_spy_none_title: "Слежка удалась, но ничего нового узнать не вышло"
 lam_tk_spy_quiet_title: "Слежка ничего не дала. К счастью, её не заметили"
 lam_fac_raise_merit_tt: "Заслуги перед фракцией есть, и все с этим согласны (сплочённость +2)."
 lam_fac_raise_passed_tt: "[lam_rz_passed.GetShortUIName] считает, что, несмотря на заслуги, предпочтение отдали другому."
 lam_faction.2610.e: "Назначить своим преемником того, у кого есть заслуги"
 lam_faction.2610.e.tt: "Назвать своим преемником правителя из пришедших на собрание, у кого есть заслуги перед фракцией, а если такого нет — самого опытного (дипломатия + управление)"
 lam_faction.2610.f: "Прилюдно воздать хвалу соратнику с заслугами"
 lam_faction.2610.f.tt: "Отметить одного из присутствующих с заслугами: уважение этого человека +20, сплочённость +3"
 lam_fac_cof_one: "\nСоратник-основатель: [Character.MakeScope.Var('lam_fac_cof1').Char.GetShortUIName] ([Character.MakeScope.Var('lam_fac_cof1').Char.Custom('LamFacCofWhy')])"
 lam_fac_cof_two: "\nСоратники-основатели: [Character.MakeScope.Var('lam_fac_cof1').Char.GetShortUIName] ([Character.MakeScope.Var('lam_fac_cof1').Char.Custom('LamFacCofWhy')]), [Character.MakeScope.Var('lam_fac_cof2').Char.GetShortUIName] ([Character.MakeScope.Var('lam_fac_cof2').Char.Custom('LamFacCofWhy')])"
 lam_fac_cofwhy_kin: "родство"
 lam_fac_cofwhy_friend: "дружба"
 lam_fac_cofwhy_liking: "единомыслие"
 lam_ai_inv_parted_reason: "Когда-то мы расстались по-доброму"
 lam_fac_gather_note_unity: "Решение собрания у [lam_ga_host.GetShortUIName]: сплотить ряды"
 lam_fac_gather_note_plot: "Решение встречи у [lam_ga_host.GetShortUIName]: тайно готовить выступление против сюзерена"
 lam_fac_gather_note_demand: "Решение встречи у [lam_ga_host.GetShortUIName]: определено требование, с которым идти к сюзерену"
 lam_fac_gather_note_heir: "Решение встречи у [lam_ga_host.GetShortUIName]: выбран преемник главы"
 lam_fac_gather_note_praise: "Решение встречи у [lam_ga_host.GetShortUIName]: при всех воздали хвалу отличившемуся соратнику"
 lam_fac_next_oath: "Соблюдает клятву верности (осталось около [Character.MakeScope.ScriptValue('lam_fac_oath_left_value')|0] мес.): до тех пор не выступает против короны"
 lam_fac_next_sulk: "Несогласные члены фракции целый год отказываются выполнять поручения главы"
 lam_sh_counter_warn_title: "Приближённые короля в последнее время часто собираются. Похоже, они заметили, что моя власть ослабла"
 lam_fac_backed_won_title: "Кандидат, которого мы поддержали казной фракции, — [lam_ad_won.GetShortUIName] — занял это место"
 lam_faction.0100.g: "Предложить золото вместо уступки"
 lam_faction.0100.g_tt: "Предложить главе фракции золото в обмен на отказ от требования. Требования, где затронут принцип (наследник, вера, запрет на отзыв титулов), так просто не уступают (базово 65%, −30 за дело принципа, +20 за алчность главы). Если глава согласится: благосклонность +8, и два года такого требования не будет. Старые обиды этим не снимаются."
 lam_faction.0100.g_no_tt: "Если глава откажется, это будет считаться отклонением требования."
 lam_fac_first_win_title: "Наша фракция впервые чего-то добилась от сюзерена"
 lam_fac_rally_thanks_title: "Я помню фракцию, что встала на сторону короны во время войны (благосклонность +10)"
 lam_faction.3030.t: "После восстания"
 lam_faction.3030.desc: "Восстание, поднятое фракцией [lam_rf_cur.GetShortUIName], провалилось. Сложив оружие, они ждут решения своей участи. Что станет с этой фракцией, теперь в моих руках."
 lam_faction.3030.a: "Бросить в темницу [lam_rf_rebel.GetShortUIName], предводителя восстания"
 lam_faction.3030.b: "Пока отложить наказание"
 lam_faction.3030.b_tt: "Благосклонность +10 и благодарность главы. Мятеж из записей не вычеркнуть."
 lam_faction.3030.c: "Сохранить фракцию, взяв клятву верности"
 lam_faction.3030.c_tt: "Фракция остаётся, но на пять лет связана клятвой верности и не может выступать против короны."
 lam_faction.3030.d: "Приказать распустить фракцию"
 lam_faction.3030.d_tt: "Фракция будет распущена. Глава затаит обиду, а тирания возрастёт."
 lam_fac_debug_seize_decision_confirm: "Стать серым кардиналом (отладка)"
 lam_fac_task_sulking_tt: "В знак несогласия с решением собрания этот персонаж отказывается выполнять поручения главы"
 lam_pv_rise_lose: "Ожидается против: [Character.MakeScope.Var('lam_pv_rise_pct').GetValue|0]% — окончательно решит голосование"
 lam_pv_court_lose: "Ожидается против: [Character.MakeScope.Var('lam_pv_court_pct').GetValue|0]% — окончательно решит голосование"
 lam_pv_h_lose: "Ожидается против: [Character.MakeScope.Var('lam_pv_h_pct').GetValue|0]% — окончательно решит голосование"
