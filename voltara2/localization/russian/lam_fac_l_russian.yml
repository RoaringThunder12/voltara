 lam_gn_end_collapsed: "#N Распалась: сплочённость рухнула#!"
 lam_gn_es_collapsed: "Сплочённость рухнула"
 lam_faction.1900.t: "Собрание фракции"
 lam_faction.1900.q_heir: "[lam_vt_head.GetShortUIName] желает сменить наследника, которого поддерживает наша фракция. Сторонники прежнего кандидата поднялись против, и было созвано собрание. "
 lam_faction.1900.q_crown: "Корона миновала нашего кандидата. Стоять за него до конца или примириться с новым правителем? Ради этого созвано собрание. "
 lam_faction.1900.q_rise: "[lam_vt_head.GetShortUIName] призывает поднять войска. Обнажать ли меч? Ради этого созвано собрание. "
 lam_faction.1900.q_deal: "[lam_vt_head.GetShortUIName] принимает предложение сюзерена. Из-за этого компромисса созвано собрание. "
 lam_faction.1900.split: "\n\nГолоса разделились почти поровну, и примирения так и не вышло. [lam_vt_lead.GetShortUIName] уводит несогласных из зала собрания и основывает новую фракцию. На чью сторону встать мне?"
 lam_faction.1900.held: "\n\nПротивников было немало, но в конце концов всё решилось по воле главы. Фракция остаётся единой. Подчинюсь ли я этому решению?"
 lam_faction.1900.stay: "Остаюсь с [lam_vt_head.GetShortUIName]"
 lam_faction.1900.follow: "Ухожу в новую фракцию [lam_vt_lead.GetShortUIName]"
 lam_faction.1900.accept: "Подчиняюсь решению"
 lam_faction.1900.leave: "С таким решением мне не смириться. Ухожу из фракции"
 lam_faction.1910.t: "Собрание фракции"
 lam_faction.1910.q_heir: "Стоило мне предложить, чтобы фракция поддержала другого наследника, как сторонники прежнего кандидата потребовали собрания. "
 lam_faction.1910.q_crown: "Когда корона миновала нашего кандидата, зазвучали голоса за примирение с новым правителем, и было созвано собрание. "
 lam_faction.1910.q_rise: "Стоило мне призвать к оружию, как созвали собрание: обнажать ли меч. "
 lam_faction.1910.q_deal: "Стоило мне принять предложение сюзерена, как из-за этого компромисса созвали собрание. "
 lam_faction.1910.split: "\n\nГолоса разделились почти поровну. [lam_vt_lead.GetShortUIName] уводит несогласных из зала собрания. Теперь у них своя фракция."
 lam_faction.1910.held: "\n\nНесогласные были, но всё решилось по-моему. Фракция осталась единой, лишь сплочённость немного пошатнулась."
 lam_faction.1910.letgo: "Кто уходит — пусть уходит"
 lam_faction.1910.brand: "Я запомню их как предателей"
 lam_faction.1910.ok: "Хорошо"
 lam_faction.1900.q_ban: "Вышел указ, а [lam_vt_head.GetShortUIName] решает уйти в подполье. Те, кто готов подчиниться воле короны, потребовали собрания. "
 lam_faction.1900.q_merge: "Пошли разговоры о том, чтобы влить нашу фракцию во фракцию [lam_vt_new.GetShortUIName]. Те, кто хочет сохранить самостоятельность, потребовали собрания. "
 lam_faction.1900.q_court: "Нашу фракцию назначили придворной партией сюзерена. Те, кто не желает примыкать к короне, потребовали собрания. "
 lam_faction.1900.q_confidence: "Всё громче звучали голоса, что руководству [lam_vt_head.GetShortUIName] больше нельзя доверять, и созвали собрание о недоверии. "
 lam_faction.1900.deposed: "\n\nЗа недоверие высказалось большинство. [lam_vt_head.GetShortUIName] уходит с поста главы, новым главой становится [lam_vt_lead.GetShortUIName]. Фракция остаётся единой."
 lam_faction.1910.q_ban: "Стоило мне заговорить об уходе в подполье наперекор указу, как те, кто готов подчиниться воле короны, потребовали собрания. "
 lam_faction.1910.q_merge: "Стоило мне решить влить нашу фракцию во фракцию [lam_vt_new.GetShortUIName], как те, кто хочет сохранить самостоятельность, потребовали собрания. "
 lam_faction.1910.q_court: "Когда нашу фракцию назначили придворной партией, те, кто не желает примыкать к короне, потребовали собрания. "
 lam_faction.1910.q_confidence: "Всё громче звучали голоса, что моему руководству больше нельзя доверять, и созвали собрание о недоверии. "
 lam_faction.1910.deposed: "\n\nЗа недоверие высказалось большинство. Я ухожу с поста главы, новым главой становится [lam_vt_lead.GetShortUIName]. Теперь я лишь рядовой член этой фракции."
 lam_faction.1910.stepdown: "Ухожу с поста"
