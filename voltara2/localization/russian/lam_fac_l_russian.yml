 lam_fac_card_nerve: "#weak Решимость выступить [Character.MakeScope.Var('lam_fac_bold').GetValue|0], причины:#! [Character.Custom('LamFacNerve1')] +[Character.MakeScope.Var('lam_fac_nf1v').GetValue|0][Character.Custom('LamFacNerve2Sep')]"
 lam_fac_card_nerve_tt: "#high Решимость [Character.MakeScope.Var('lam_fac_bold').GetValue|0]#! = слабость короны [Character.MakeScope.Var('lam_fac_nfc').GetValue|0] + сила фракции [Character.MakeScope.Var('lam_fac_nfs').GetValue|0] + нрав главы [Character.MakeScope.Var('lam_fac_nft').GetValue|0] + обиды, предательство, обойдённый кандидат, настороженность, другой наследник [Character.MakeScope.Var('lam_fac_nfg').GetValue|0] − то, что успокаивает (коронация их кандидата, страх после чистки, уступки в последнюю ночь) [Character.MakeScope.Var('lam_fac_nfx').GetValue|0]\n\n#weak Фракция противников короны при решимости 60 выступает открыто против, при 85 собирается, при 110 поднимает восстание. Но для восстания её собственная сила должна составлять не менее 10% силы всех вассалов, а в первые 6 месяцев после восшествия нового государя она только собирается (кроме фракции, чей кандидат не получил корону). На карточке видны только две причины, сильнее всего поднявшие решимость.#!"
 lam_fac_nf_crown: "слабость короны"
 lam_fac_nf_share: "большая сила"
 lam_fac_nf_temper: "смелость главы"
 lam_fac_nf_grievance: "накопленные обиды"
