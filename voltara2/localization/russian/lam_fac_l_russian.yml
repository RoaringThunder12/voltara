 lam_faction.1020.a.arms: "#N Получаю:#! участие в войне.\n"
 lam_faction.1020.a.law_support: "#N Получаю:#! молчаливое согласие на усиление короны (три года).\n"
 lam_faction.1020.chance: "\nВероятность согласия: #V [lam_deal_lead.MakeScope.Var('lam_deal_acc').GetValue|0]%#! (вес того, чем обмениваются, курс фракции, расположение и мнение обо мне)"
 lam_faction.1020.a: "Сделать предложение"
 lam_faction.1020.back: "Начать сначала"
 lam_faction.1020.x: "Оставим это"
 lam_faction.1030.t: "Кому"
 lam_faction.1030.desc: "Сделка заключена. Теперь пора решить, кому отдать землю. Вся фракция ждёт, чьё имя прозвучит."
 lam_faction.1030.lead: "Главе — [lam_deal_lead.GetFirstName]"
 lam_faction.1030.lead_tt: "Всё забирает глава, остальные обижены (сплочённость −10)."
 lam_faction.1030.r1: "Члену ядра — [lam_deal_r1.GetFirstName]"
 lam_faction.1030.r1_tt: "Достаётся опоре фракции (сплочённость +5)."
 lam_faction.1030.r2: "Тому, кто в ссоре с главой: [lam_deal_r2.GetFirstName]"
 lam_faction.1030.r2_tt: "Возвысить соперника главы. Во фракции пойдёт трещина, а глава затаит на меня обиду (сплочённость −20)."
 lam_deal_yes_title: "Заключена сделка с фракцией [lam_deal_lead.GetShortUIName]"
 lam_deal_no_title: "Фракция [lam_deal_lead.GetShortUIName] отвергает сделку"
 lam_secret_bribed: "Подкупленный глава"
 lam_secret_bribed_desc: "Деньги сюзерена ушли в собственный карман, а не фракции"
 lam_fac_bribed_opinion: "Получены тайные деньги"
 lam_fac_hoarded_opinion: "Присвоена доля фракции"
 lam_fac_fair_share_opinion: "Доля поделена честно"
 lam_fac_passed_over_opinion: "Без доли при дележе"
 lam_faction.0610.t: "Час восстания"
 lam_faction.0610.desc: "Решимость нашей фракции бьёт через край. Все ждут лишь моего слова. Подними я сейчас меч — найдутся те, кто пойдёт следом. Впрочем, можно ещё и потерпеть."
 lam_faction.0610.a: "Поднимаемся"
 lam_faction.0610.a_tt: "Наша фракция предъявит сюзерену требование, отвечающее её поводу (возвести претендента, независимость, ограничить власть короны; в Японии и Китае — на манер этих стран). Ядро и приближённые встанут рядом; если пути нет, это станет открытым неповиновением."
 lam_faction.0610.b: "Пока потерпеть"
 lam_faction.0610.b_tt: "На год решимость угасает."
 lam_fac_command_interaction: "Приказ придворной партии"
 lam_fac_command_interaction_desc: "Придворная партия — фракция лишь по названию, на деле это моя рука. Её можно призвать к оружию, велеть ей привлекать людей или натравить на другую фракцию."
 lam_fac_command_interaction_tt: "Выбрать, что поручить придворной партии."
 lam_faction.1100.t: "Приказ придворной партии"
 lam_faction.1100.desc: "[lam_cp_lead.GetTitledFirstName] ждёт приказа."
 lam_faction.1100.arms: "Беритесь за оружие (престиж)"
 lam_faction.1100.arms_tt: "Если я воюю, глава и ядро сразу вступают в войну на моей стороне; если нет — вступят в мои войны в течение двух лет. Раз в два года."
 lam_faction.1100.recruit: "Привлекайте людей (золото)"
 lam_faction.1100.recruit_tt: "На деньги казны принять в придворную партию до 3 неприсоединившихся, неравнодушных к политике. Раз в год."
 lam_faction.1100.press: "Прижмите другие фракции (тирания)"
 lam_faction.1100.press_tt: "Придворная партия давит на крупнейшую из других фракций. Та теряет благосклонность, затаивает обиду, а её сплочённость и вовлечённость расшатываются. Раз в два года."
 lam_faction.1100.x: "Сейчас не нужно"
 lam_fac_head_demand_interaction: "Потребовать от имени фракции"
 lam_fac_head_demand_interaction_desc: "Я — глава фракции. С её весом за спиной я встаю перед сюзереном."
 lam_fac_head_demand_interaction_tt: "Выбрать, что потребовать. Согласие зависит от нашей силы, благосклонности, мощи короны и нрава сюзерена. Отказ оставит обиду, и эта обида станет поводом для следующего хода."
 lam_fac_head_demand_cd_tt: "С последнего требования к сюзерену должен пройти год (осталось около #high [actor.MakeScope.ScriptValue('lam_fac_hd_cd_left_value')|0] мес.#!)"
 lam_faction.1200.t: "От имени фракции"
 lam_faction.1200.desc: "Я стою перед сюзереном. За моей спиной — наша фракция. Чего же потребовать?"
 lam_faction.1200.law: "Смягчите авторитет короны, прошу"
 lam_faction.1200.heir: "Нашего избранника — в наследники"
 lam_faction.1200.tolerance: "Терпимости к нашему языку и молитвам"
 lam_faction.1200.gold: "Нашу долю золотом"
 lam_faction.1200.amnesty: "Амнистии для нашей фракции"
 lam_faction.1200.x: "Оставим это"
 lam_faction.1210.desc: "Слова сказаны. Сюзерен прищуривается."
 lam_faction.1210.chance: "\n\nВероятность согласия: #V [ROOT.Char.MakeScope.Var('lam_hd_acc').GetValue|0]%#!"
 lam_faction.1210.a: "Настаивать"
 lam_faction.1210.x: "Отступить"
 lam_hd_yes_title: "Сюзерен удовлетворяет требование нашей фракции"
 lam_hd_no_title: "Сюзерен отвергает требование нашей фракции. Наши люди скрежещут зубами"
 lam_fac_head_arms_decision: "Созвать фракцию"
 lam_fac_head_arms_decision_desc: "Призвать ядро нашей фракции на мои войны. Придут не все, но узы с теми, кто придёт, станут крепче."
 lam_fac_head_arms_decision_tooltip: "Созвать фракцию"
 lam_fac_head_arms_decision_tt: "Просить помощи у правителей из ядра и сочувствующих, которые могут вступить в войну, что я веду. Сплочённость вырастет на 5, только если подкрепления действительно присоединятся. После просьбы повторить её нельзя 3 года."
 lam_fac_head_arms_cd_tt: "Фракция недавно созывалась (3 года)"
 lam_fac_head_order_decision: "Навести порядок во фракции"
 lam_fac_head_order_decision_desc: "Возвысить надёжного соратника или расстаться с несогласным. Чтобы сменить кандидата в наследники, нужно согласие собрания фракции."
 lam_fac_head_order_decision_tooltip: "Навести порядок во фракции"
 lam_fac_head_order_cd_tt: "Порядок недавно наводился (1 год)"
 lam_faction.1300.t: "Порядок во фракции"
 lam_faction.1300.desc: "Фракция — это в конце концов люди. А люди идут следом, лишь когда ими правят."
 lam_faction.1300.out: "Пусть [lam_ds_out.GetShortUIName] уходит."
 lam_faction.1300.out_tt: "Изгнать из фракции того, кто мной недоволен больше всех. Два года путь в любую фракцию будет закрыт. Сплочённость +5."
 lam_faction.1300.up: "Пусть [lam_ds_up.GetShortUIName] войдёт в ядро."
 lam_faction.1300.up_tt: "Возвысить выбранного сочувствующего до ядра. Пять лет положение и членство сохраняются, сплочённость фракции растёт на 3."
 lam_faction.1300.heir: "Вынести на собрание вопрос о поддержке: [lam_ds_heir.GetShortUIName]."
 lam_faction.1300.heir_tt: "Из детей сюзерена на пять лет сделать кандидатом нашей фракции того, кто лучше всех ко мне относится."
 lam_faction.1300.x: "Сейчас не нужно"
 lam_faction.1400.t: "Держава в наших руках"
 lam_faction.1400.desc: "Наша фракция взяла в руки военную опору и ключевые должности при дворе и даже обрела средства влиять на государя. Долго удерживая эту опору, мы дождались случая самим вершить дела державы. Но и в миг решительного шага опора должна оставаться прочной."
 lam_faction.1400.a: "Встать за троном"
 lam_faction.1400.a_tt: "Подтвердить нынешнюю опору и стать серым кардиналом. Если ключевые должности и политическая опора рухнут, власть можно потерять."
 lam_faction.1400.b: "Мне пока не нужно это место"
 lam_faction.1410.t: "Корона на ниточках"
 lam_faction.1410.desc: "И сегодня всё как прежде: первым говорит [lam_pm_lead.GetTitledFirstName], а совет лишь вторит. Я смотрю на это с трона. Печать в моей руке. Но что ею скреплять, решаю не я."
 lam_faction.1410.a: "...Когда-нибудь"
 lam_faction.1410.a_tt: "Держава в руках фракции [lam_pm_lead.GetShortUIName]. На меня есть крючок, часть доходов короны отнимают, а престиж и уважение вассалов тают. Свобода придёт, если сила этой фракции упадёт ниже половины силы вассалов. Можно и самому перерезать нити — решением «Дворцовый переворот»."
 lam_fac_coup_decision: "Дворцовый переворот"
 lam_fac_coup_decision_desc: "Перерезать нити. В случае успеха серый кардинал окажется в темнице, а трон вновь станет моим. В случае неудачи нити затянутся туже, и эта фракция возьмётся за оружие."
 lam_fac_coup_decision_tooltip: "Дворцовый переворот"
 lam_fac_coup_decision_tt: "Вероятность успеха зависит от моих интриг, личной доблести и страха. Чем сплочённее противная фракция, тем труднее преуспеть."
 lam_fac_coup_cd_tt: "Недавно была попытка переворота (3 года)"
 lam_coup_yes_title: "Переворот удался. [lam_cu_lead.GetShortUIName] в цепях"
 lam_coup_no_title: "Переворот провалился. Фракция [lam_cu_lead.GetShortUIName] берётся за оружие"
 lam_pm_freed_title: "Нити перерезаны. Трон снова мой"
 lam_fac_puppet_modifier: "Корона на ниточках"
 lam_fac_puppet_modifier_desc: "Державу держит в руках одна фракция. Трон говорит чужими устами."
 lam_fac_puppeteer_modifier: "Тень за троном"
 lam_fac_puppeteer_modifier_desc: "Державой движет не корона, а этот человек."
 lam_fac_btn_detail: "Подробнее"
 lam_fac_btn_detail_tt: "Посмотреть знамя этой фракции, её глав, членов, известность и наследие, отношения и историю."
 lam_fac_detail_title: "Фракция"
 lam_fac_detail_banner_tt: "Знаменем служит герб дома основателя: [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName]."
 lam_fac_detail_line1: "#high [Character.Custom('LamFacAgeTier')]#! · основана в [Character.MakeScope.Var('lam_fac_founded').GetValue|0] г. (лет: [Character.MakeScope.Var('lam_fac_age').GetValue|0]) · глава в [Character.MakeScope.Var('lam_fac_gen').GetValue|0]-м поколении"
 lam_fac_detail_line2: "[Character.Custom('LamFacStance')] · [Character.Custom('LamFacStage')] · Политика [Character.MakeScope.Var('lam_cr_share').GetValue|0]% · Ключевые места: [Character.MakeScope.ScriptValue('lam_pol_seats_value')|0]"
 lam_fac_detail_line3: "#weak Основатель:#! [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · #weak Членов:#! [Character.MakeScope.Var('lam_fac_count').GetValue|0]"
 lam_fac_detail_heads: "Главы фракции"
 lam_fac_detail_head_now: "#high Сейчас:#! [Character.GetShortUIName]"
 lam_fac_detail_head_past: "[Character.GetShortUIName]"
 lam_fac_detail_core: "Ядро"
 lam_fac_detail_clients: "Приближённые"
 lam_fac_detail_sym: "Сочувствующие"
 lam_fac_detail_renown: "Известность #V [Character.MakeScope.Var('lam_fac_renown').GetValue|0]#!"
 lam_fac_detail_renown_tt: "Каждый год копится по мере возраста и силы фракции и растёт от таких событий, как коронация её кандидата, восстание, сдержанное обещание, победа в столкновении, сделка. Это вес имени фракции. От неё же зависит, что уцелеет, если фракция падёт. Копится только у фракций, где не меньше 3 членов."
 lam_fac_leg_buy: "Получить"
 lam_fac_leg_org_line: "Организация [Character.MakeScope.Var('lam_fac_leg_org').GetValue|0]/3 #weak (история [Character.MakeScope.Var('lam_fac_tr_org').GetValue|0])#!"
 lam_fac_leg_org_tt: "Базовая сплочённость +5 за уровень.\n#weak Как получить: каждая смена главы — 1, каждая пережитая чистка — 2, каждое проигранное столкновение — 1.#!"
 lam_fac_leg_ties_line: "Связи [Character.MakeScope.Var('lam_fac_leg_ties').GetValue|0]/3 #weak (история [Character.MakeScope.Var('lam_fac_tr_ties').GetValue|0])#!"
 lam_fac_leg_ties_tt: "Притяжение для новых людей (очки вступления) +3 за уровень.\n#weak Как получить: каждая ступень возраста — 2, каждая коронация её кандидата — 2.#!"
 lam_fac_leg_purse_line: "Казна [Character.MakeScope.Var('lam_fac_leg_purse').GetValue|0]/3 #weak (история [Character.MakeScope.Var('lam_fac_tr_purse').GetValue|0])#!"
 lam_fac_leg_purse_tt: "Взносы членов каждый сезон растут. Больше золота можно предложить и неприсоединившимся. (Взносы идут в личную казну главы, и распоряжается ими глава.)\n#weak Как получить: каждая сделка с сюзереном — 1.#!"
 lam_fac_leg_arms_line: "Сила оружия [Character.MakeScope.Var('lam_fac_leg_arms').GetValue|0]/3 #weak (история [Character.MakeScope.Var('lam_fac_tr_arms').GetValue|0])#!"
 lam_fac_leg_arms_tt: "Шанс откликнуться на созыв или встать на защиту короны +10% за уровень.\n#weak Как получить: каждая победа в столкновении с другой фракцией — 2, каждое восстание — 1.#!"
 lam_fac_leg_cause_line: "Дело [Character.MakeScope.Var('lam_fac_leg_cause').GetValue|0]/3 #weak (история [Character.MakeScope.Var('lam_fac_tr_cause').GetValue|0])#!"
 lam_fac_leg_cause_tt: "Шанс, что требования фракции примут, растёт с каждым уровнем (+5%, для сюзерена под управлением ИИ +10).\n#weak Как получить: каждое сдержанное сюзереном обещание — 2, каждое предательство — 1.#!"
 lam_fac_leg_will_line: "Завет [Character.MakeScope.Var('lam_fac_leg_will').GetValue|0]/1"
 lam_fac_leg_will_tt: "Даже если фракция падёт (роспуск, смерть главы, гибель державы), её известность, традиции, год основания и число поколений один раз сохранит на 20 лет последний глава (или сильнейший член ядра). Если он сам, его дом, родня или друзья основают новую фракцию, она унаследует всё как есть. После этого «Завет» расходуется и в этой линии фракции больше не появляется. Без «Завета» на 10 лет остаётся лишь четверть известности.\n#weak Как получить: появляется сам, когда фракция становится «старой».#!"
 lam_fac_detail_relations: "Отношения с другими фракциями"
 lam_fac_detail_relations_tt: "Союз дружбы: главы заключили союз дружбы и друг с другом не сталкиваются. Заклятые враги: вражда, и к тому же главы — соперники или их дома в кровной вражде. Соперники: враждуют. Дружба: близки. Нейтралитет: ни то ни другое. В придворном вопросе фракции, стоящие на одной стороне, образуют одну коалицию."
 lam_fac_detail_rel_row: "Фракция [Character.GetShortUIName] · [GetPlayer.MakeScope.Var('lam_fac_detail').Char.Custom2('LamFacRel', Character.Self)]"
 lam_fac_rel_allied: "#P Союз дружбы#!"
 lam_fac_rel_nemesis: "#N Заклятые враги#!"
 lam_fac_rel_rival: "#N Соперники#!"
 lam_fac_rel_friendly: "#P Дружба#!"
 lam_fac_rel_neutral: "#weak Нейтралитет#!"
 lam_fac_detail_timeline: "История"
 lam_fac_detail_t1: "#weak [Character.MakeScope.Var('lam_fac_t1y').GetValue|0]#! [Character.Custom('LamFacT1')]"
 lam_fac_detail_t2: "#weak [Character.MakeScope.Var('lam_fac_t2y').GetValue|0]#! [Character.Custom('LamFacT2')]"
 lam_fac_detail_t3: "#weak [Character.MakeScope.Var('lam_fac_t3y').GetValue|0]#! [Character.Custom('LamFacT3')]"
 lam_fac_detail_t4: "#weak [Character.MakeScope.Var('lam_fac_t4y').GetValue|0]#! [Character.Custom('LamFacT4')]"
 lam_fac_detail_t5: "#weak [Character.MakeScope.Var('lam_fac_t5y').GetValue|0]#! [Character.Custom('LamFacT5')]"
 lam_fac_tl_founded: "Фракция основана"
 lam_fac_tl_succ: "Пришёл новый глава"
 lam_fac_tl_rise: "Подняла восстание"
 lam_fac_tl_purge: "Пережила чистку"
 lam_fac_tl_crown: "Её кандидат взошёл на трон"
 lam_fac_tl_betray: "Предана сюзереном"
 lam_fac_tl_kept: "Обещание сдержано"
 lam_fac_tl_won: "Победа в столкновении с другой фракцией"
 lam_fac_tl_lost: "Поражение в столкновении с другой фракцией"
 lam_fac_tl_deals: "Сделка с сюзереном"
 lam_fac_tl_underground: "Ушла в подполье из-за запрета"
 lam_fac_tl_pardoned: "Получила амнистию"
 lam_fac_tl_seized: "Взяла державу в свои руки"
 lam_fac_tl_disgraced: "Смещение главы, уличённого в подкупе"
 lam_fac_tl_legacy: "Появилась новая традиция"
 lam_fac_tl_revived: "Подхватила завет старой фракции"
 lam_fac_tl_migrated: "Продолжила жить при дворе нового правителя"
 lam_fac_tl_allied: "Заключила союз дружбы с другой фракцией"
 lam_fac_tl_challenge: "Главу свергли изнутри"
 lam_fac_ally_interaction: "Заключить союз дружбы"
 lam_fac_ally_interaction_desc: "Заключить союз дружбы с этой фракцией. Стороны не сталкиваются, а мнение глав друг о друге растёт (+10). Если в придворном вопросе они на одной стороне, согласиться легче, если на разных — труднее. Союз кончается, если одна из сторон его разорвёт, если они поссорятся или если сменится глава."
 lam_fac_ally_same_heart_reason: "Одинаковый настрой к короне"
 lam_fac_ally_foes_reason: "Враждуют друг с другом"
 lam_fac_ally_same_heir_reason: "Поддерживают одного наследника"
 lam_fac_break_ally_interaction: "Разорвать союз дружбы"
 lam_fac_break_ally_interaction_desc: "Разорвать союз дружбы. Та сторона запомнит это как предательство и затаит обиду. Наша фракция тоже немного пошатнётся."
 lam_fac_poach_interaction: "Переманить к нам"
 lam_fac_poach_interaction_desc: "За 10 золотых на первый подход начать переговоры с кандидатом. При согласии отдельная плата выплачивается на деле. Нынешний глава тоже может заплатить, чтобы удержать его."
 lam_fac_poach_loyal_reason: "Хорошо относится к нынешнему главе"
 lam_fac_poach_greedy_reason: "Жадность"
 lam_fac_poach_found_title: "Фракция [lam_po_old.GetShortUIName] заметила, что мы переманиваем её людей"
 lam_fac_smear_interaction: "Оклеветать"
 lam_fac_smear_interaction_desc: "Распустить дурные слухи о главе другой фракции. В случае успеха сюзерен станет хуже относиться к этому главе, а у его фракции упадут благосклонность и сплочённость. В случае неудачи упадёт благосклонность к нашей фракции, а с тем главой мы станем соперниками."
 lam_fac_smear_interaction_tt: "Вероятность успеха зависит от моих интриг и интриг противника."
 lam_fac_smear_cd_tt: "Недавно была клевета (3 года)"
 lam_fac_smear_yes_title: "Порочащие слухи разошлись: под ударом [recipient.GetShortUIName]"
 lam_fac_smear_no_title: "[recipient.GetShortUIName] узнаёт, кто распускал слухи"
 lam_fac_challenge_interaction: "Потребовать голосования о доверии"
 lam_fac_challenge_interaction_desc: "Спросить собрание фракции, доверяет ли оно по-прежнему главе. Если глава лишится доверия, место главы займу я; если сохранит — положение главы, напротив, окрепнет. Голосование о доверии можно проводить лишь раз в пять лет."
 lam_fac_challenge_interaction_tt: "Решает голосование собрания фракции. Если во фракции царит довольство, глава сохраняет доверие."
 lam_fac_challenge_weak_tt: "Положение главы шатко (сплочённость ниже 40, присвоение доли или разоблачение)"
 lam_fac_challenge_yes_title: "Ядро встало на мою сторону. Теперь эту фракцию возглавляю я"
 lam_fac_challenge_no_title: "Ядро сохранило верность: [lam_ch_old.GetShortUIName] остаётся главой. Меня изгоняют"
 lam_fac_inform_interaction: "Донести сюзерену"
 lam_fac_inform_interaction_desc: "Выдать сюзерену тайные замыслы нашей фракции. Сюзерен получит крючок на нашего главу, а я — золото и доверие сюзерена. Но появится секрет «Доносчик», и если он раскроется, меня изгонят из фракции."
 lam_fac_inform_interaction_tt: "Сообщить настоящий секрет или нынешний тайный курс. За одни и те же сведения повторной награды нет, и крючок сам собой не появляется."
 lam_fac_inform_cd_tt: "Недавно был донос (5 лет)"
 lam_secret_informer: "Доносчик"
 lam_secret_informer_desc: "Тайны собственной фракции переданы сюзерену"
 lam_fac_poached_opinion: "Переманивание наших людей"
 lam_fac_smeared_opinion: "Дурные слухи"
 lam_fac_informer_opinion: "Ценные сведения"
 lam_fac_mediated_opinion: "Посредничество"
 lam_fac_meddled_opinion: "Непрошеное вмешательство"
 lam_fac_bid_decision: "Позволить фракциям обхаживать себя"
 lam_fac_bid_decision_desc: "Я не принадлежу ни к одной фракции. Уже одно это имеет свою цену. Послушаем, что фракции предложат."
 lam_fac_bid_decision_tooltip: "Позволить фракциям обхаживать себя"
 lam_fac_bid_cd_tt: "Фракции недавно обхаживали (5 лет)"
 lam_faction.1500.t: "Обхаживание"
 lam_faction.1500.desc: "Едва пошёл слух, как ко мне потянулись гости. Все твердят одно и то же: присоединяйтесь к нам. И никто не пришёл с пустыми руками."
 lam_faction.1500.o1: "Вступить во фракцию [lam_bd_1.GetShortUIName] (золото: [lam_bd_1.MakeScope.Var('lam_bd_gold').GetValue|0])"
 lam_faction.1500.o2: "Вступить во фракцию [lam_bd_2.GetShortUIName] (золото: [lam_bd_2.MakeScope.Var('lam_bd_gold').GetValue|0])"
 lam_faction.1500.o3: "Вступить во фракцию [lam_bd_3.GetShortUIName] (золото: [lam_bd_3.MakeScope.Var('lam_bd_gold').GetValue|0])"
 lam_faction.1500.x: "Отослать всех — я никому не принадлежу"
 lam_fac_mediate_decision: "Стать посредником между фракциями"
 lam_fac_mediate_decision_desc: "Не принадлежа ни к одной стороне, я встаю между двумя фракциями, что рычат друг на друга. В случае успеха обе фракции и сюзерен станут лучше ко мне относиться, а я заслужу славу «нейтрального голоса». В случае неудачи обе стороны сочтут, что я лезу не в своё дело."
 lam_fac_mediate_decision_tooltip: "Стать посредником между фракциями"
 lam_fac_mediate_cd_tt: "Недавно было посредничество (3 года)"
 lam_faction.1600.t: "Меж двух фракций"
 lam_faction.1600.desc: "В одной комнате собрались люди обеих сторон: за одними стоит [lam_md_a.GetTitledFirstName], за другими — [lam_md_b.GetTitledFirstName]. Воздух здесь острый, как клинок. Заговорю я — и всё может перемениться, а может статься, что обе стороны обратятся против меня."
 lam_faction.1600.a: "Встать между ними"
 lam_faction.1600.a_tt: "Вероятность успеха: #V [ROOT.Char.MakeScope.Var('lam_md_chance').GetValue|0]%#! (моя дипломатия, слава посредника). В случае успеха распря двух фракций утихнет, а я получу престиж и лучшее мнение обеих сторон и сюзерена."
 lam_faction.1600.x: "Не вмешиваться"
 lam_fac_mediate_yes_title: "Посредничество удалось. Обе фракции вложили мечи в ножны"
 lam_fac_mediate_no_title: "Посредничество провалилось. Обе стороны смотрят на меня косо"
 lam_fac_head_rise_decision: "Поднять фракцию"
 lam_fac_head_rise_decision_desc: "Словами больше ничего не добиться. От имени нашей фракции мы выступаем против сюзерена: выдвигаем требование, отвечающее нашему поводу, а если такого пути нет — открыто отказываемся повиноваться."
 lam_fac_head_rise_decision_tooltip: "Поднять фракцию"
 lam_fac_head_rise_decision_tt: "Выдвигаем требование, отвечающее поводу: по умолчанию — возвести претендента, независимость или ограничение власти короны; в Японии и Китае — на манер этих стран: восстановление сюзерена во власти, смена регента, имперская политика, раскол державы. Склонные к отделению (меньшинство, местники, иная культура) прежде всего ищут независимости и раскола. Отказ может перерасти в войну. Если пути нет — открытое неповиновение (меньше налогов и ополчения). Ядро и приближённые встают рядом, остальные члены решают сами, присоединиться ли. После восстания подняться снова нельзя 5 лет."
 lam_fac_rise_cd_tt: "Восстания не было в последнее время (5 лет после восстания, 3 года после отклонения вопроса о восстании)"
 lam_fac_rise_cause_tt: "Есть повод: обида фракции, немилость сюзерена (благосклонность -20 и ниже) или запрет фракций"
 lam_fac_rise_blocked_tt: "Снят запрет на создание фракций, наложенный из-за поражения в войне и т. п."
 lam_fac_need_standing_tt: "Известность и наследие копят только фракции, где не меньше 3 членов"
 lam_fac_detail_traditions: "Традиции"
 lam_fac_detail_traditions_tt: "Традиции не покупают. Они вырастают из того, что фракции довелось пережить. Число в скобках — это её история; на 2, 4 и 7 традиция поднимается на ступень. Однажды возникшая традиция не исчезает и сохраняется при смене главы. Традиции растут только у фракций, где не меньше 3 членов."
 lam_fac_tl_void: "Сменился сюзерен — обещание утратило силу"
 lam_fac_tl_scheme: "Действовала в подполье"
 lam_faction.0800.void: "\n· Обещания, утратившие силу из-за смены давшего их сюзерена: [ROOT.Char.MakeScope.Var('lam_dig_void').GetValue|0] (последний случай: фракция [ROOT.Char.MakeScope.Var('lam_dig_void_who').Char.GetShortUIName]). Это не предательство, так что они могут попросить снова."
 lam_faction.0800.scheme: "\n· Козни подпольных фракций (подмётные письма, утаённое золото): [ROOT.Char.MakeScope.Var('lam_dig_scheme').GetValue|0] (последний случай: фракция [ROOT.Char.MakeScope.Var('lam_dig_scheme_who').Char.GetShortUIName])"
 lam_fac_ban_upkeep_modifier: "Цена запрета фракций"
 lam_fac_ban_upkeep_modifier_desc: "Деньги соглядатаям и двор, что прячет глаза. Это продлится, пока стоит запрет."
 lam_fac_detail_ctrl: "Опора власти над державой [Character.MakeScope.ScriptValue('lam_pol_ctrl_count_value')|0]/6"
 lam_fac_detail_ctrl_tt: "Чтобы взять власть над державой, нужны сразу военная сила, организация и власть при дворе.\n[Character.Custom('LamPolOrg')]\n[Character.Custom('LamPolBase')]\n[Character.Custom('LamPolUnity')]\n[Character.Custom('LamPolOffice')]\n[Character.Custom('LamPolLever')]\n[Character.Custom('LamPolRival')]\n\n[Character.Custom('LamPolReady')]\nСила союзников считается лишь наполовину, и нужна собственная опора фракции. Базовый срок удержания: 2 года для игрока, 3 года для ИИ. При потере любого условия подготовка начинается заново."
