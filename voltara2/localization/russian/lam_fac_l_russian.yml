 lam_fac_new_title: "Под именем [lam_new_lead.GetFirstNameNoTooltip] собралась новая фракция"
 lam_faction.0300.install_tt: "Возникает придворная партия во главе с этим человеком (благосклонность 40). Если все места заняты, самая слабая фракция уступает место."
 lam_found_faction_decision_install_tt: "Моя фракция занимает место при дворе сюзерена. Если все места заняты, самая слабая фракция уступает место."
 lam_faction.0100.d.heir: "«[ROOT.Char.Custom('FormOfAddressForLiege')], из всех ваших детей тяжесть короны вынесет лишь [lam_pet_heir.GetFirstName]. Мы в это верим, верят и наши люди. Объявите наследником того, кого мы назвали»."
 lam_faction.0100.d.law: "«Рука двора лежит слишком тяжело. Королевские люди суют нос даже в дела наших земель. Ослабьте поводья короны»."
 lam_faction.0100.d.no_revoke: "«[ROOT.Char.Custom('FormOfAddressForLiege')], все видели, как вы отбираете землю у вассала. Кто следующий? Дайте слово, что владений мелких феодалов вы не тронете»."
 lam_faction.0100.d.tolerance: "«Наш язык и наши молитвы при этом дворе презирают. Относитесь к нам как к подданным одного и того же короля»."
 lam_faction.0100.d.faith: "«[ROOT.Char.Custom('FormOfAddressForLiege')], в вашем совете заседают те, кто не следует истинной вере. Верните эти места людям веры»."
 lam_faction.0100.d.campaign: "«Наши мечи ржавеют. Уже который год мы не выходим на поле брани. Пообещайте нам поход — славой ведь положено делиться»."
 lam_faction.0100.d.council: "«Места в совете всегда достаются одним и тем же. Наш голос тоже должен там звучать»."
 lam_faction.0100.d.reward: "«[ROOT.Char.Custom('FormOfAddressForLiege')], когда под вами шатался трон, мы встали рядом с мечами в руках. Помните эту верность»."
 lam_faction.0100.d.redress: "«[ROOT.Char.Custom('FormOfAddressForLiege')], знаете ли вы, как с нами обходятся при этом дворе? Если так пойдёт и дальше, нам не удержать своих людей»."
 lam_faction.0100.liar: "\n\n#italic В их глазах нет доверия. Они тоже помнят мои нарушенные обещания. Сейчас моё слово ничего не стоит.#!"
 lam_faction.0100.heir: "Объявить наследником: [lam_pet_heir.GetFirstName]"
 lam_faction.0100.law: "Ослабить поводья короны на одну ступень"
 lam_faction.0100.tolerance: "Проявить терпимость"
 lam_faction.0100.reward: "Щедро вознаградить их верность"
 lam_faction.0100.redress: "Как следует извиниться и заплатить за это"
 lam_faction.0100.promise: "Даю слово"
 lam_faction.0100.promise.council_tt: "В течение 1 года кто-то из этой фракции должен войти в совет. Если сдержать слово, благосклонность сильно вырастет; если нарушить — 5 лет будет жить чувство предательства."
 lam_faction.0100.promise.campaign_tt: "В течение 2 лет нужно начать наступательную войну. Если сдержать слово, благосклонность сильно вырастет; если нарушить — 5 лет будет жить чувство предательства."
 lam_faction.0100.promise.faith_tt: "В течение 1 года нужно удалить из совета всех советников иной веры. Если сдержать слово, благосклонность сильно вырастет; если нарушить — 5 лет будет жить чувство предательства."
 lam_faction.0100.promise.no_revoke_tt: "5 лет нельзя отзывать титулы у вассалов. Отзыв хотя бы одного титула сразу означает нарушенное обещание."
 lam_fac_tolerance_desc: "Терпимость, проявленная по просьбе фракции"
 lam_fac_promise_kept_title: "Обещание фракции [lam_pr_lead.GetShortUIName] сдержано"
 lam_fac_promise_broken_title: "Обещание фракции [lam_pr_lead.GetShortUIName] нарушено. Там этого не забудут"
 lam_fac_betrayed_opinion: "Нарушенное обещание"
 lam_fac_clash_opinion: "Столкновение при дворе"
 lam_fac_clash_rival_reason: "Фракции столкнулись при дворе"
 lam_faction.0700.t: "Столкновение двух фракций"
 lam_faction.0700.heir: "[lam_cl_a.GetTitledFirstName] прочит в следующие короли [lam_cl_a_heir.GetFirstName], а [lam_cl_b.GetTitledFirstName] — [lam_cl_b_heir.GetFirstName]. Сегодня на пиру спор вспыхнул у всех на глазах. Кто-то произнёс слова «законная линия», а кто-то положил руку на рукоять меча."
 lam_faction.0700.council: "Из-за места в совете люди [lam_cl_a.GetTitledFirstName] и люди [lam_cl_b.GetTitledFirstName] обвиняют друг друга. Одна сторона заняла место, другая кричит, что оно куплено."
 lam_faction.0700.crown: "Фракции [lam_cl_a.GetTitledFirstName] и [lam_cl_b.GetTitledFirstName] стоят на противоположных полюсах в вопросе о короне: одна хочет вознести короля выше, другая — низвергнуть. Сегодня эти речи столкнулись у меня на глазах."
 lam_faction.0700.blood: "Давняя вражда между семьями [lam_cl_a.GetTitledFirstName] и [lam_cl_b.GetTitledFirstName] вспыхнула вновь. Теперь в эту распрю втянуты обе фракции целиком."
 lam_faction.0700.end: "\n\nОба взгляда обращены на меня. Что я сделаю или чего не сделаю — то и станет моим ответом."
 lam_faction.0700.a: "Решить спор в пользу [lam_cl_a.GetFirstName]"
 lam_faction.0700.b: "Решить спор в пользу [lam_cl_b.GetFirstName]"
 lam_faction.0700.c: "Собрать обе стороны за одним столом и помирить"
 lam_faction.0700.c.ok: "Примирение состоялось"
 lam_faction.0700.c.fail: "Примирение не удалось"
 lam_faction.0700.d: "Пусть разбираются сами"
 lam_faction.0800.t: "Год при дворе"
 lam_faction.0800.open: "Открыть «Фракции при дворе»"
 lam_faction.0800.new: "\n· Новых фракций: [ROOT.Char.MakeScope.Var('lam_dig_new').GetValue|0] (последняя — фракция [ROOT.Char.MakeScope.Var('lam_dig_new_who').Char.GetShortUIName])"
 lam_faction.0800.ends: "\n· Распавшихся фракций: [ROOT.Char.MakeScope.Var('lam_dig_ends').GetValue|0] (последняя — фракция [ROOT.Char.MakeScope.Var('lam_dig_ends_who').Char.GetShortUIName])"
 lam_faction.0800.succ: "\n· Фракций со сменой главы: [ROOT.Char.MakeScope.Var('lam_dig_succ').GetValue|0] (новый глава последней из них — [ROOT.Char.MakeScope.Var('lam_dig_succ_who').Char.GetShortUIName])"
 lam_faction.0800.merge: "\n· Слияний фракций: [ROOT.Char.MakeScope.Var('lam_dig_merge').GetValue|0] (последнее поглощение — на счету фракции [ROOT.Char.MakeScope.Var('lam_dig_merge_who').Char.GetShortUIName])"
 lam_faction.0800.leave: "\n· Покинули фракцию: [ROOT.Char.MakeScope.Var('lam_dig_leave').GetValue|0] (последний случай — [ROOT.Char.MakeScope.Var('lam_dig_leave_who').Char.GetShortUIName])"
 lam_faction.0800.leave_radical: "\n· Отвернулись от фракции, зашедшей слишком далеко: [ROOT.Char.MakeScope.Var('lam_dig_leave_radical').GetValue|0] (последний случай — [ROOT.Char.MakeScope.Var('lam_dig_leave_radical_who').Char.GetShortUIName])"
 lam_faction.0800.leave_loyal: "\n· Покинули фракцию, стоящую за короля: [ROOT.Char.MakeScope.Var('lam_dig_leave_loyal').GetValue|0] (последний случай — [ROOT.Char.MakeScope.Var('lam_dig_leave_loyal_who').Char.GetShortUIName])"
 lam_faction.0800.quiet: "\n· Притихших фракций: [ROOT.Char.MakeScope.Var('lam_dig_quiet').GetValue|0] (последняя — фракция [ROOT.Char.MakeScope.Var('lam_dig_quiet_who').Char.GetShortUIName])"
 lam_faction.0800.goal: "\n· Фракций, добившихся желаемого: [ROOT.Char.MakeScope.Var('lam_dig_goal').GetValue|0] (последняя — фракция [ROOT.Char.MakeScope.Var('lam_dig_goal_who').Char.GetShortUIName])"
 lam_faction.0800.heir: "\n· Фракций, сменивших кандидата в наследники: [ROOT.Char.MakeScope.Var('lam_dig_heir').GetValue|0] (последняя — фракция [ROOT.Char.MakeScope.Var('lam_dig_heir_who').Char.GetShortUIName])"
 lam_faction.0800.spurned: "\n· Фракций, отвернувшихся из-за того, что корона досталась не их кандидату: [ROOT.Char.MakeScope.Var('lam_dig_spurned').GetValue|0] (последняя — фракция [ROOT.Char.MakeScope.Var('lam_dig_spurned_who').Char.GetShortUIName])"
 lam_faction.0800.crown: "\n\nАвторитет короны сейчас: [ROOT.Char.MakeScope.Var('lam_crown').GetValue|0] / 100"
 lam_faction.0800.a: "Ясно"
 lam_fac_card_heir_lawful: "#weak Кандидат в наследники:#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #P (законный наследник)#!"
 lam_fac_card_heir_other: "#weak Кандидат в наследники:#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #N (другой кандидат)#!"
 lam_fac_card_heir_tt: "Кого эта фракция втайне желает видеть следующим правителем. Выбор зависит от расположения главы, крови собственного дома (родня по браку), браков, веры и культуры, возраста и качеств, которых требует курс фракции. Если фракция поддерживает не законного наследника, её решимость растёт, а фракции, стоящие за разных кандидатов, становятся врагами. Если после смерти правителя корона достанется не их кандидату, фракция отвернётся, а если у кандидата есть претензия, дело может дойти до войны за возведение претендента."
 lam_fac_badge_promise: "#P Есть обещание#!"
 lam_fac_defiance_title: "Фракция [lam_abs_lead.GetShortUIName] выходит из повиновения. Повода для восстания у неё нет, но она урезает ополчение и налоги, причитающиеся сюзерену. Насколько — зависит от силы фракции"
 lam_fac_defiance_modifier: "Неповиновение вассалов"
 lam_fac_defiance_modifier_desc: "Крупная фракция (35% и более силы вассалов) выходит из повиновения и сильно урезает ополчение и налоги, причитающиеся сюзерену."
 lam_fac_empty: ""
 lam_fac_liar_tt: "Обещания нарушены уже дважды. Теперь моим обещаниям никто не верит"
 lam_found_faction_decision_flow_tt: "Выбрать двор и того, кто возглавит фракцию. Тот, кого я попрошу, согласится или откажет в зависимости от наших отношений, своего нрава и настроя по отношению к короне."
 lam_found_faction_cd_tt: "Недавняя попытка основать фракцию (2 года)"
 lam_faction.0290.t: "При каком дворе"
 lam_faction.0290.desc: "Я — чей-то вассал, но и у меня есть свои вассалы. Где основать фракцию?"
 lam_faction.0290.a: "При дворе сюзерена — среди собратьев-вассалов"
 lam_faction.0290.b: "При своём дворе — среди своих вассалов"
 lam_faction.0300.peer: "Фракции нужно лицо — такое, на чьё имя сойдутся люди. Я могу выйти вперёд лично или поручить это тому, кто подойдёт лучше. Вот только согласится ли тот — неизвестно."
 lam_faction.0300.own: "Я создам при своём дворе фракцию из своих людей. Только возглавить её мне нельзя: стоит правителю встать во главе — и это уже не фракция, а сама корона. Нужно поручить её кому-то из вассалов. Отказать мне будет непросто, но отказать всё же можно."
 lam_faction.0300.me: "Возглавить лично"
 lam_faction.0300.me_tt: "Я становлюсь главой этой фракции. В течение 1 года она не распадётся, даже если в ней никого, кроме меня."
 lam_faction.0300.acc1: "Вероятность согласия: #V [lam_ff_c1.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc2: "Вероятность согласия: #V [lam_ff_c2.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc3: "Вероятность согласия: #V [lam_ff_c3.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_ff_accepted_title: "[lam_fac_new.GetShortUIName] соглашается возглавить фракцию"
 lam_ff_refused_title: "[lam_ff_no.GetShortUIName] отказывается возглавить фракцию"
 lam_fac_stage_9: "#weak Подполье — запрещённая фракция, в тени выжидает своего часа#!"
 lam_fac_ban_decision: "Запретить фракции"
 lam_fac_ban_decision_desc: "Фракции при дворе подтачивают авторитет короны. Пора запретить само их объединение. Это обойдётся в немалый престиж и золото, и все вассалы будут недовольны указом. Пока действует запрет, приходится платить осведомителям (престиж -0.5/мес., налог с домена -5%). Зато фракции становятся незаконными в принципе. Робкие уходят, во тьме остаются лишь самые непримиримые. Подпольные фракции тайно собираются, распускают подмётные письма, через свои должности прибирают к рукам золото, а когда их сплочённость окрепнет — в конце концов поднимаются. Каждый шаг грозит разоблачением. Главы и ядро подпольных фракций хранят преступный секрет: раскрытый через шпионов, он даёт повод заключить их в темницу или крючок, чтобы держать их в узде."
 lam_fac_ban_decision_tooltip: "Запретить фракции"
 lam_fac_ban_need_foe_tt: "Есть фракция, недовольная мной"
 lam_fac_ban_power_tt: "Моя военная сила превосходит совокупную силу всех недовольных фракций"
 lam_fac_ban_decision_effect_tt: "Запретить все фракции или все, кроме роялистов."
 lam_faction.0900.t: "Запрет фракций"
 lam_faction.0900.desc: "Когда огласили указ, в зале воцарилась тишина. Отныне объединяться без дозволения правителя — измена. Одни склонили головы, другие отводили глаза друг от друга. А иные не выказали ничего — вот кого и следует остерегаться."
 lam_faction.0900.a: "Запретить все фракции"
 lam_faction.0900.a_tt: "Все фракции становятся незаконными. Все вассалы проникаются неприязнью к указу (−20, 5 лет). Глава каждой фракции решает, тихо распустить её или уйти в подполье. Чем сильнее авторитет короны и страх, тем больше тех, кто распускается; при слабой короне (ниже 35) большинство скрывается. Распущенная фракция исчезает, оставив после себя наследие. Из ушедшей в подполье фракции уходят сочувствующие и приближённые, остаётся лишь ядро. Пока она скрывается, ей доступна лишь половина силы (для восстания нужно 20% силы). Её глава и ядро хранят преступный секрет «Запрещённая фракция»; раскрытый, он даёт повод для заключения в темницу. Если схватить и заточить главу скрывающейся фракции, фракция будет разгромлена, а правитель получит престиж и страх. Под запретом фракцию можно основать только в подполье. Подпольная фракция видна лишь настолько, насколько её раскопали осведомители. Пока действует запрет, все нераспущенные фракции находятся в подполье. Лишь восстание до конца раскрывает, кто есть кто."
 lam_faction.0900.b: "Запретить все, кроме роялистов"
 lam_faction.0900.b_tt: "Открыто остаётся лишь партия короны (придворная партия), остальные, как и выше, оказываются вне закона. Недовольство всех вассалов такое же. Если партии короны нет, ею становится самая верная фракция."
 lam_faction.0900.c: "Ещё не время"
 lam_fac_unban_decision: "Отменить запрет на фракции"
 lam_fac_unban_decision_desc: "Отменить запрет. Скрывавшиеся фракции снова покажут лицо. Целый год двор будет бурлить."
 lam_fac_unban_decision_tooltip: "Отменить запрет на фракции"
 lam_fac_banned_opinion: "Фракции под запретом"
 lam_fac_outlaw_modifier: "Член запрещённой фракции"
 lam_fac_outlaw_modifier_desc: "Состоит в запрещённой фракции: слежка, опала, шёпот за спиной."
 trait_lam_fac_member: "Член фракции"
 trait_lam_fac_member_lead: "Глава: [ROOT.Char.Custom('LamFacName')]"
 trait_lam_fac_member_0: "[ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamFacName')]"
 trait_lam_fac_member_1: "Фракция дома [ROOT.Char.MakeScope.Var('lam_bloc').Char.GetHouse.GetNameNoTooltip]"
 trait_lam_fac_member_2: "Чёрная фракция"
 trait_lam_fac_member_3: "Белая фракция"
 trait_lam_fac_member_4: "Синяя фракция"
 trait_lam_fac_member_5: "Красная фракция"
 trait_lam_fac_member_desc: "Состоит в одной из фракций при дворе."
 trait_lam_fac_member_desc_lead: "Возглавляет эту фракцию."
 trait_lam_fac_member_desc_core: "Входит в ядро фракции. Связывают кровь, дружба или глубокое убеждение."
 trait_lam_fac_member_desc_client: "Приближённый фракции. Держится за неё ради выгоды."
 trait_lam_fac_member_desc_sym: "Всего лишь сочувствует фракции. Подует другой ветер — может и уйти."
 lam_found_faction_no_war_tt: "Не воюет со своим сюзереном"
 lam_found_faction_followers_tt: "Есть двор, где можно основать фракцию (при своём дворе нужны хотя бы два вассала, готовых её возглавить; при дворе сюзерена можно и в одиночку; при дворе под запретом — только подпольную)"
 lam_fac_ban_line: "#N [Character.Custom('LamFacBan')]#!"
 lam_fac_ban_line_tt: "Фракции под запретом. Главы запрещённых фракций либо распустили их, либо ушли в подполье. Чем выше авторитет короны и страх, тем покорнее они расходятся; над запретом слабого короля лишь смеются. Затаившаяся подпольная фракция может использовать лишь половину своей силы (для восстания нужно 20% силы), не может ни подавать прошения, ни вступать в столкновения, а её члены теряют престиж. Если схватить и заточить главу скрывающейся фракции, её разгромят и она распадётся, другие подпольные фракции испугаются, а правитель получит престиж и страх. Новые фракции рождаются только в подполье. Подпольная фракция видна в этом окне лишь настолько, насколько её раскопали шпионы (решение «Раскопать подполье»). Пока действует запрет, все нераспущенные фракции находятся в подполье. Лишь восстание до конца показывает, кто они такие. Запрет заканчивается со сменой правителя или по решению, а подпольная фракция, продержавшаяся до конца, возвращается как «выстоявшая гонения»."
 lam_fac_ban_all: "Запрет фракций (все фракции)"
 lam_fac_ban_crown: "Запрет фракций (разрешена лишь партия короны)"
 lam_fac_ban_decision_confirm: "Издать запрет"
 lam_fac_unban_decision_confirm: "Отменить запрет"
 lam_secret_outlaw_faction: "Запрещённая фракция"
 lam_secret_outlaw_faction_desc: "Вопреки запрету возглавляет подпольную фракцию или остаётся в её ядре"
 lam_secret_outlaw_found_title: "Выяснилось, что [secret_owner.GetShortUIName] состоит в запрещённой фракции"
 lam_fac_edict_opinion: "Запрет фракций"
 lam_fac_bar_cohesion: "Сплочённость"
 lam_fac_age_0: "Новая фракция"
 lam_fac_age_1: "Окрепшая фракция"
 lam_fac_age_2: "Старая фракция"
 lam_fac_age_3: "Именитая фракция"
 lam_fac_hist_tt: "#T История#!\nОснована в [Character.MakeScope.Var('lam_fac_founded').GetValue|0] г. · лет со дня основания: [Character.MakeScope.Var('lam_fac_age').GetValue|0] · #high [Character.Custom('LamFacAgeTier')]#!\nОснователь: [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · нынешний глава — в [Character.MakeScope.Var('lam_fac_gen').GetValue|0]-м поколении[Character.Custom('LamFacCofLine')]\n\nВосстания [Character.MakeScope.Var('lam_fac_h_rise').GetValue|0] · пережитые чистки [Character.MakeScope.Var('lam_fac_h_purge').GetValue|0] · возведённые на трон кандидаты [Character.MakeScope.Var('lam_fac_h_crown').GetValue|0]\nСдержанные обещания [Character.MakeScope.Var('lam_fac_h_kept').GetValue|0] · предательства [Character.MakeScope.Var('lam_fac_h_betray').GetValue|0] · столкновения (победы/поражения) [Character.MakeScope.Var('lam_fac_h_won').GetValue|0]/[Character.MakeScope.Var('lam_fac_h_lost').GetValue|0] · сделки с сюзереном [Character.MakeScope.Var('lam_fac_h_deals').GetValue|0]\n\n#weak Чем старше фракция, тем сильнее она притягивает людей, тем крепче её сплочённость и тем труднее ей распасться, даже ослабев (с 15 лет она держится даже горсткой сторонников). Давнее имя сохраняет свой вес, но фракция может и влиться в другую, с общей целью.#!"
 lam_fac_old_modifier: "Глава старой фракции"
 lam_fac_old_modifier_desc: "Несёт имя давней фракции."
 lam_fac_venerable_modifier: "Глава именитой фракции"
 lam_fac_venerable_modifier_desc: "Имя фракции, живущей уже не одно десятилетие, придаёт этому человеку веса."
 lam_fac_deal_interaction: "Сделка с фракцией"
 lam_fac_deal_interaction_desc: "Сесть напротив главы этой фракции. Что-то отдать и что-то получить взамен. Отданное принадлежит не лично главе, а всей фракции, и от того, как это поделят, фракция может сплотиться — или дать трещину."
 lam_fac_deal_interaction_tt: "Выбрать, что отдать и что получить."
 lam_fac_deal_cd_tt: "Недавно уже была сделка с этой фракцией"
 lam_faction.1000.t: "Что же отдать"
 lam_faction.1000.desc: "Напротив садится [lam_deal_lead.GetTitledFirstName]. Стоящие позади следят, с чем им предстоит вернуться."
 lam_faction.1000.seat: "Место в совете"
 lam_faction.1000.seat_tt: "Пообещать в течение года ввести кого-то из этой фракции в совет. Кого — решаю я. Если место займёт только глава, остальные обидятся; если кто-то другой — фракция сплотится."
 lam_faction.1000.county: "Графство"
 lam_faction.1000.county_tt: "Отдать кому-то из фракции наименее развитое графство моего домена. Получателя я выберу после заключения сделки. Если отдать его сопернику главы, во фракции пойдёт трещина."
 lam_faction.1000.gold: "Золото"
 lam_faction.1000.gold_tt: "Золото проходит через руки главы к фракции. Щедрый или справедливый глава делит его поровну (сплочённость растёт), жадный или честолюбивый оставляет себе (сплочённость падает, члены недовольны), прочие награждают лишь ядро."
 lam_faction.1000.marriage: "Брак"
 lam_faction.1000.marriage_tt: "Пообещать в течение двух лет заключить брак или помолвку между моей семьёй и кем-то из этой фракции (или его семьёй)."
 lam_faction.1000.law: "Уступить ступень авторитета короны"
 lam_faction.1000.law_tt: "Сразу понизить авторитет короны на одну ступень."
 lam_faction.1000.heir: "Наследник, которого они поддерживают"
 lam_faction.1000.heir_tt: "Назначить наследником ребёнка, которого поддерживает фракция, заплатив престиж, влияние или благочестие в зависимости от нынешнего типа правления."
 lam_faction.1000.amnesty: "Амнистия"
 lam_faction.1000.amnesty_tt: "Даже при запрете официально разрешить именно эту фракцию. Она выйдет из подполья и снова станет открытой."
 lam_faction.1000.bribe: "Тайные деньги лично главе"
 lam_faction.1000.bribe_tt: "Это золото идёт не фракции, а только в карман главы. Глава станет лучше ко мне относиться, но получит секрет «Подкупленный глава». Если он раскроется, сплочённость фракции рухнет, а главу могут изгнать. Честный или справедливый глава скорее откажется."
 lam_faction.1000.x: "Оставим это"
 lam_faction.1010.t: "Что же потребовать"
 lam_faction.1010.desc: "Теперь мой черёд сказать, чего я хочу."
 lam_faction.1010.oath: "Клятва верности"
 lam_faction.1010.oath_tt: "Пять лет эта фракция не будет выступать против короны или собирать силы. Недовольство в душе может остаться, но наружу оно не выйдет."
 lam_faction.1010.heir: "Поддержать моего наследника"
 lam_faction.1010.heir_tt: "Пять лет эта фракция поддерживает моего законного наследника."
 lam_faction.1010.disband: "Распустить фракцию"
 lam_faction.1010.disband_tt: "Фракция распускается. Чем она старше, тем труднее с этим смириться."
 lam_faction.1010.counter: "Прижать враждебную фракцию"
 lam_faction.1010.counter_tt: "Использовать эту фракцию против крупнейшей враждебной фракции. Та теряет благосклонность и затаивает обиду."
 lam_faction.1010.arms: "Выставить войска"
 lam_faction.1010.arms_tt: "Если я сейчас воюю, глава и ядро вступают в войну на моей стороне; если нет — вступят в войну, которую я начну в течение двух лет."
 lam_faction.1010.law_support: "Не противиться усилению короны"
 lam_faction.1010.law_support_tt: "Три года члены этой фракции не отвернутся от трона из-за высокого авторитета короны."
 lam_faction.1010.back: "Выбрать заново"
 lam_faction.1020.t: "Предложение"
 lam_faction.1020.open: "Я излагаю своё предложение. Слушает [lam_deal_lead.GetTitledFirstName].\n\n"
