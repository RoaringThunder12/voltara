 NOT_lam_fac_promise_kind_tt: "Это требование нельзя отсрочить обещанием"
 NOT_lam_fac_liar_tt: "Обещания нарушены уже дважды. Теперь моим обещаниям никто не верит"
 lam_fac_nm_dead: "Прежняя фракция [Character.GetFirstNameNoTooltip]"
 lam_fac_cp_broken_title: "Фракция [lam_cp_lead.GetFirstNameNoTooltip] утратила место придворной партии"
 lam_fac_cp_broken_desc: "Они слишком далеко разошлись с королём. Теперь это не его правая рука, а лишь одна фракция из многих. Приказывать им нельзя, и ещё два года они не станут придворной партией вновь."
 lam_fac_cp_rift_hint: "Даже придворная партия теряет своё место, если сильно рассорится с сюзереном: настрой фракции -25 или ниже, восстание, мнение главы о сюзерене -40 или ниже, мнение сюзерена о главе -50 или ниже, благосклонность -20 или ниже, или несправедливость со стороны этого сюзерена (заключение невиновного главы или члена ядра, нарушенное обещание; 5 лет). Одних лишь ссор с другими фракциями или отклонённого прошения для этого мало."
 lam_gn_ev_cp_broken: "Разрыв с сюзереном и утрата статуса придворной партии"
 lam_fac_badge_cpbroken: "#N Статус придворной партии утрачен#!"
 lam_fac_badge_cpbroken_tt: "Фракция сильно рассорилась с сюзереном и лишилась места придворной партии. Теперь это обычная фракция: приказов не получает и ещё два года не станет придворной партией вновь."
