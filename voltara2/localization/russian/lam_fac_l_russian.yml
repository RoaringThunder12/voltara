 lam_fac_invited_title: "[recipient.GetFirstNameNoTooltip] вступает в мою фракцию"
 lam_faction.0100.t: "Прошение фракции"
 lam_faction.0100.open: "[lam_pet_lead.GetTitledFirstName] просит аудиенции от имени своих людей. Просьба идёт не от одного человека: все лица, выстроившиеся позади, ждут только моего ответа.\n\n"
 lam_faction.0100.ask.courtly: "«[ROOT.Char.Custom('FormOfAddressForLiege')], достоинство двора — это достоинство державы. Дайте нам места в совете и на пирах оказывайте подобающие почести»."
 lam_faction.0100.ask.glory_hound: "«Наши мечи ржавеют. Пообещайте нам поход — славой ведь положено делиться»."
 lam_faction.0100.ask.parochial: "«Дела наших земель мы знаем сами. Отведите от них руку двора хоть немного»."
 lam_faction.0100.ask.zealot: "«Вера меркнет. Усмирите еретиков и позаботьтесь о святынях»."
 lam_faction.0100.ask.minority: "«Наш язык и наши молитвы при этом дворе презирают. Обещайте нам терпимость»."
 lam_faction.0100.ask.barons_and_minor_landholders: "«Крупные феодалы давят мелких. Защитите нас королевским законом»."
 lam_faction.0100.ask.belligerent: "«Мир затянулся. Враги над нами смеются»."
 lam_faction.0100.ask.loyalist: "«[ROOT.Char.Custom('FormOfAddressForLiege')], мы всегда были рядом с вами. Помните эту верность»."
 lam_faction.0100.ask.dynastic: "«Определитесь с наследником. Пошатнётся наследование — пошатнётся и королевство»."
 lam_faction.0100.ask.none: "«Выслушайте и нас»."
 lam_faction.0100.tone.arms: "\n\n#italic За учтивыми словами видны руки, сжимающие рукояти мечей. Это скорее предупреждение, чем прошение.#!"
 lam_faction.0100.tone.loyal: "\n\n#italic Даже сейчас, когда корона шатается, они остались со мной. И пришли получить за это плату.#!"
 lam_faction.0100.a: "Удовлетворить просьбу."
 lam_faction.0100.b: "Смягчить подарком."
 lam_faction.0100.c: "Отказать."
 lam_faction.0200.t: "Знамя новой фракции"
 lam_faction.0200.desc: "Люди сходятся не на имя, а на знамя. Что начертает на своём знамени фракция [lam_fac_new.GetFirstName]?"
 lam_faction.0200.a: "За правителя (роялисты)"
 lam_faction.0200.b: "За достоинство двора (партия знати)"
 lam_faction.0200.c: "За свои земли (местники)"
 lam_faction.0200.d: "За меч и славу (искатели славы)"
 lam_faction.0200.e: "За веру (ревнители веры)"
 lam_faction.0200.f: "За законное наследование (партия наследника)"
 lam_faction.0210.t: "Имя фракции"
 lam_faction.0210.desc: "Как же станут их называть при дворе?"
 lam_faction.0210.n0: "По курсу и земле: [lam_fac_new.Custom('LamFacAuto')]"
 lam_faction.0210.n1: "По имени дома"
 lam_faction.0210.n2: "Чёрные"
 lam_faction.0210.n3: "Белые"
 lam_faction.0210.n4: "Синие"
 lam_faction.0210.n5: "Красные"
 lam_faction.0300.t: "Кого поставить во главе"
 lam_faction.0300.desc: "Двору нужны люди, которые будут исполнять мою волю. Кого поставить впереди?"
 lam_faction.0300.c1: "Пусть фракцию возглавит [lam_ff_c1.GetTitledFirstName]"
 lam_faction.0300.c2: "Пусть фракцию возглавит [lam_ff_c2.GetTitledFirstName]"
 lam_faction.0300.c3: "Пусть фракцию возглавит [lam_ff_c3.GetTitledFirstName]"
 lam_faction.0300.x: "Ещё не время (престиж возвращается)"
 lam_found_faction_decision: "Основать фракцию"
 lam_found_faction_decision_desc: "Собрать единомышленников и основать фракцию. При дворе сюзерена я могу лично её возглавить или поручить это другому вассалу; при собственном дворе — только кому-то из своих вассалов. Правитель не может лично вести фракцию при своём дворе. Тот, кого я попрошу, может отказаться."
 lam_found_faction_decision_tooltip: "Основать фракцию"
 lam_found_faction_decision_confirm: "Основать фракцию"
 lam_found_court_party_decision: "Основать придворную партию"
 lam_found_court_party_decision_desc: "Собрать среди вассалов людей, которые встанут на мою сторону, и назначить им главу. Начальная благосклонность — 40."
 lam_found_court_party_decision_tooltip: "Создаёт придворную партию во главе с верным вассалом."
 lam_found_court_party_decision_confirm: "Основать"
 lam_leave_faction_decision: "Покинуть фракцию"
 lam_leave_faction_decision_desc: "Выйти из фракции, к которой сейчас принадлежу. Главе это придётся не по душе."
 lam_leave_faction_decision_tooltip: "Выход из фракции (вступить снова нельзя в течение 1 года)."
 lam_leave_faction_decision_confirm: "Уйти"
 lam_join_faction_interaction: "Попроситься во фракцию"
 lam_join_faction_interaction_desc: "Связать свою судьбу с фракцией этого человека."
 lam_invite_faction_interaction: "Позвать в свою фракцию"
 lam_invite_faction_interaction_desc: "Привлечь этого человека в свою фракцию."
 lam_ai_fac_kin_reason: "Тот же дом"
 lam_ai_fac_foe_reason: "Из враждебной фракции"
 lam_ai_fac_core_reason: "Ядро нынешней фракции"
 lam_ai_fac_client_reason: "Приближённый нынешней фракции"
 lam_fac_death_succession_title: "[lam_dead_lead.GetFirstNameNoTooltip] умирает; фракцию наследует [lam_succ.GetFirstNameNoTooltip]"
