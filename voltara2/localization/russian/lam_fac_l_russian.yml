 lam_fac_hint: "Фракции складываются вокруг сильных вассалов, советников и глав домов. Настрой (отношение к короне) и решимость (сила, чтобы его проявить) меняются независимо друг от друга."
 lam_fac_card_camp: "#weak Настрой и решимость:#! [Character.Custom('LamFacCamp')] · [Character.Custom('LamFacStage')]"
 lam_fac_stage_tt: "#high Настрой#! — это отношение к короне (в среднем [Character.MakeScope.Var('lam_fac_att').GetValue|0]). Его определяют мнение, интересы (по склонностям вассалов), родство и должности.\n#high Решимость#! — это сила, чтобы проявить настрой открыто ([Character.MakeScope.Var('lam_fac_bold').GetValue|0]). Она тем выше, чем слабее корона, чем сильнее фракция и чем смелее её глава.\n\nПри сильной короне даже противники короны #weak затаиваются#!. Когда решимость нарастает, всё идёт по ступеням: #N открытое противостояние#! → #N сбор сил#! → #N восстание#!. Восстав, они предъявляют сюзерену требования, а если им отказывают, дело перерастает в войну.\nРоялисты при сильной короне держатся рядом как #P приближённые#!, а когда она шатается — переходят к #P сбору роялистов#!.\n\n#high Главная причина (судя по главе):#! [Character.Custom('LamFacMoodWhy')]"
 lam_fac_crown_line: "Двор #high [Character.GetShortUIName]#! · авторитет короны: [Character.Custom('LamCrown')] #weak ([Character.MakeScope.Var('lam_crown').GetValue|0])#!"
 lam_fac_crown_tt: "Сила авторитета короны зависит от закона об авторитете короны, легитимности, страха, соотношения войск правителя и вассалов, престижа, от того, ведётся ли оборонительная война, и от того, не малолетен ли правитель.\n\nПри сильной короне затихают даже враждебные ей фракции; при слабой противники короны поднимаются, а роялисты сплачиваются под знамёнами короны."
 lam_fac_view_self: "Посмотреть свой двор"
 lam_view_factions_interaction: "Присмотреться к фракциям"
 lam_view_factions_interaction_desc: "Присмотреться к фракциям этой державы: кто чей человек и насколько прочен авторитет короны. (Для независимых правителей. Свой двор и двор сюзерена видны прямо в окне фракций.)"
 lam_fac_camp_pro: "#P На стороне сюзерена#!"
