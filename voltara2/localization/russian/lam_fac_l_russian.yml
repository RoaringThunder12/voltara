 lam_faction.0100.past.wronged: "\n\n#italic Они до сих пор помнят, как по моей воле увели их товарища и как было нарушено обещание. Сегодняшнее требование родилось из этой памяти.#!"
 lam_faction.0100.past.spurned: "\n\n#italic Их кандидат не получил корону при прошлом восшествии на престол. Они этого не забыли.#!"
 lam_faction.0100.past.purge: "\n\n#italic Эта фракция однажды пережила чистку. С тех пор перед государем она взвешивает каждое слово, а взамен хочет гарантий.#!"
 lam_faction.0100.past.pardoned: "\n\n#italic Они скрывались под запретом, пока не получили помилование. Теперь, снова выйдя на свет, они хотят упрочить своё место.#!"
 lam_faction.0100.past.old: "\n\n#italic Это старая фракция, и во главе её стоит уже [lam_pet_lead.MakeScope.Var('lam_fac_gen').GetValue|0]-й по счёту глава. В её требованиях живёт память прежних поколений.#!"
