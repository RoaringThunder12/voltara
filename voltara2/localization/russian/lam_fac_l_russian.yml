 lam_fac_unaligned_title_n: "#high Неприсоединившиеся#! #weak не состоят ни в одной фракции#!"
 lam_fac_unaligned_tt: "Вассалы и советники, не состоящие ни в одной фракции. Остаться неприсоединившимся — самостоятельный политический выбор. При маленьком дворе или там, где можно напрямую сотрудничать с правителем, так проще и остаться. Чтобы вступить, нужна причина отказаться от собственного курса: дружба, родство, защита или выгода. Даже когда при дворе становится тихо, существующие фракции сами собой не распускаются."
