 lam_faction.2000.t: "Предложение примкнуть"
 lam_faction.2000.desc: "От [lam_inv_head.GetShortUIName] прибыл гонец с приглашением примкнуть к #high [lam_inv_head.Custom('LamFacName')]#!. Гонец передал и такие слова: когда собираются те, кто хочет одного и того же, к ним прислушивается и сюзерен.\n\n#weak Если принять приглашение, я стану одним из приближённых этой фракции. Если отказаться, 3 года звать больше не станут.#!"
 lam_faction.2000.a: "Я с вами"
 lam_faction.2000.b: "Вежливо отказываюсь"
 lam_fac_merged_away_title: "Моя фракция влилась в другую. Следовать ли за ней — решать мне"
 lam_ai_fac_strong_reason: "Сильнее главы"
 lam_ai_fac_useful_reason: "Полезная сила"
 lam_ai_fac_weak_reason: "Слишком мало сил, чтобы помочь"
 lam_ai_fac_cause_reason: "Разделяет те же устремления"
 lam_ai_fac_rival_reason: "Соперник главы"
 lam_ai_fac_spy_reason: "Советник сюзерена (возможно, шпион)"
 lam_ai_inv_stronger_reason: "У главы куда больше силы"
 lam_ai_inv_weaker_reason: "Я сильнее главы"
 lam_ai_inv_standing_reason: "Фракция с весом при дворе"
 lam_ai_inv_small_reason: "Пока малочисленная фракция"
 lam_ai_inv_cause_reason: "Разделяет те же устремления"
 lam_ai_inv_against_crown_reason: "Верность сюзерену, а фракция против него"
 lam_ai_inv_for_crown_reason: "Недовольство сюзереном, а фракция за него"
 lam_ai_inv_renown_reason: "Прославленная фракция"
 lam_ai_inv_content_reason: "Нет интереса к политике"
 lam_ai_inv_ambitious_reason: "Честолюбец"
 lam_fac_back_heir_interaction: "Фракция прочит этого человека в наследники"
 lam_fac_back_heir_interaction_desc: "Выбрать, кого моя фракция будет прочить в следующие правители. Если кандидат уже есть, созывается собрание фракции."
 lam_fac_back_heir_interaction_tt: "Поддержка кандидата выносится на собрание фракции. Кандидат сменится, только если вопрос будет принят."
 lam_fac_back_heir_locked_tt: "Сделка с сюзереном связывает нас в поддержке наследника"
 lam_fac_head_posture_decision: "Определить курс фракции"
 lam_fac_head_posture_decision_tooltip: "Определить курс фракции"
 lam_fac_head_posture_decision_desc: "Глава решает, как фракция держится с сюзереном. Курс, расходящийся с настроем её людей, подтачивает сплочённость."
 lam_fac_head_posture_cd_tt: "С последней смены курса должно пройти полгода"
 lam_fac_head_goal_decision: "Определить, чего хочет фракция"
 lam_fac_head_goal_decision_tooltip: "Определить, чего хочет фракция"
 lam_fac_head_goal_decision_desc: "Глава решает, чего фракция добивается от сюзерена. Добьётся — фракция наберёт силу; если долго не выходит — копится недовольство."
 lam_fac_head_confidence_decision: "Поставить вопрос о доверии"
 lam_fac_head_confidence_decision_tooltip: "Поставить вопрос о доверии"
 lam_fac_head_confidence_decision_desc: "Созвать собрание фракции и поставить вопрос о доверии, рискуя постом главы. Если доверие сохранится, фракция сплотится; если против окажется большинство, пост главы будет потерян."
 lam_fac_head_confidence_decision_tt: "Созывается собрание фракции. При доверии: сплочённость +15, немного престижа, мнение членов растёт. Если против большинство, главой становится сильнейший из противников."
 lam_fac_head_confidence_cd_tt: "За последние 5 лет уже созывалось собрание о недоверии"
 lam_fac_head_confidence_held_title: "Фракция выразила доверие своему главе"
 lam_faction.2100.t: "Курс фракции"
 lam_faction.2100.desc: "Видные люди фракции собрались вместе. Как держаться с сюзереном — в конечном счёте решать главе.\n\n#weak Если выбрать курс, расходящийся с настроем большинства членов, сплочённость будет падать при каждом пересчёте. Решение отвернуться от сюзерена или перейти на его сторону сначала выносится на собрание фракции.#!"
 lam_faction.2100.a: "Стоять за сюзерена (верность)"
 lam_faction.2100.a.tt: "Фракция встаёт на сторону сюзерена. Если ему грозит опасность, она собирает силы."
 lam_faction.2100.b: "Наблюдать (выжидание)"
 lam_faction.2100.b.tt: "Не вставать ни на чью сторону и выжидать своего часа."
 lam_faction.2100.c: "Притихнуть (затаиться)"
 lam_faction.2100.c.tt: "Таить недовольство, но не показывать его."
 lam_faction.2100.d: "Открыто выступить против"
 lam_faction.2100.d.tt: "Возвысить голос против сюзерена."
 lam_faction.2100.e: "Готовить оружие (сбор сил)"
 lam_faction.2100.e.tt: "Копить силы к восстанию. Само восстание выносится на собрание фракции как вопрос «Восстание»."
 lam_faction.2100.f: "Положиться на волю членов"
 lam_faction.2100.f.tt: "Не задавать особого курса и следовать настрою членов."
 lam_faction.2100.x: "Оставить как есть"
 lam_faction.2110.t: "Чего хочет фракция"
 lam_faction.2110.desc: "Ради чего мы собрались? Люди пойдут за нами, только если требование к сюзерену будет ясным."
 lam_faction.2110.g1: "Ослабить авторитет короны"
 lam_faction.2110.g2: "Терпимость к иным верам и культурам"
 lam_faction.2110.g3: "Защита истинной веры"
 lam_faction.2110.g4: "Война и походы"
 lam_faction.2110.g5: "Места в совете"
 lam_faction.2110.g6: "Уступки правителя"
 lam_faction.2110.g7: "Надёжное наследование"
 lam_faction.2110.g8: "Сильная корона"
 lam_faction.2110.g9: "Сохранить нынешнее положение"
 lam_faction.2110.auto: "Пусть фракция решит сама"
 lam_fac_head_posture_decision_confirm: "Задать курс"
 lam_fac_head_goal_decision_confirm: "Решить"
 lam_fac_head_confidence_decision_confirm: "Поставить вопрос о доверии"
 lam_faction.0300.me_need_tt: "При дворе должен быть тот, кто основал бы фракцию вместе со мной (кто хорошо ко мне относится — мнение 20+, — член моего дома или друг, но не глава и не ядро другой фракции)"
 lam_faction.0300.me_cofounders_tt: "До двух ближайших единомышленников вступают как сооснователи (первое ядро фракции)"
 lam_ff_cofounder_title: "Сооснователи со мной"
 lam_fac_self_posture_interaction: "Курс фракции"
 lam_fac_self_posture_interaction_desc: "Определить, как фракция держится с сюзереном. Если курс расходится с настроем большинства членов, сплочённость будет постоянно падать."
 lam_po_loyal: "Стоять за сюзерена (верность)"
 lam_po_watch: "Наблюдать (выжидание)"
 lam_po_quiet: "Притихнуть (затаиться)"
 lam_po_oppose: "Открыто выступить против"
 lam_po_arm: "Готовить оружие (сбор сил)"
 lam_po_people: "Положиться на волю членов"
 lam_po_loyal_desc: "Собирает силы, если сюзерену грозит опасность. Если это поворот от противостояния сюзерену — собрание: [actor.Custom('LamPvCourt')]"
 lam_po_watch_desc: "Ни на чьей стороне. Без собрания."
 lam_po_quiet_desc: "Недовольство не показывается. Без собрания."
 lam_po_oppose_desc: "Противостоять сюзерену. Если это поворот от поддержки сюзерена или выжидания — собрание: [actor.Custom('LamPvRise')]"
 lam_po_arm_desc: "Готовиться к восстанию (само восстание — вопрос «Восстание» на собрании фракции). Если это поворот — собрание: [actor.Custom('LamPvRise')]"
 lam_po_people_desc: "Не задавать особого курса и следовать настрою членов."
 lam_fac_self_goal_interaction: "Чего хочет фракция"
 lam_fac_self_goal_interaction_desc: "Определить, чего фракция добивается от сюзерена. Если цель достигнута, фракция крепнет; если её долго нет, недовольство копится и становится поводом к выступлению."
 lam_fac_self_goal_interaction_tt: "Требование фракции меняется."
 lam_go_1_desc: "Выполнено при авторитете короны 0–1."
 lam_go_2_desc: "Выполнено, если культура совпадает с культурой сюзерена или терпимость культур 50+."
 lam_go_3_desc: "Выполнено при той же вере и отсутствии советников иной веры."
 lam_go_4_desc: "Выполнено, пока сюзерен ведёт войну."
 lam_go_5_desc: "Выполнено, если я или кто-то из членов фракции входит в совет."
 lam_go_6_desc: "Выполнено при благосклонности сюзерена 30+."
 lam_go_7_desc: "Выполнено, если наследник сюзерена — наш кандидат, достигший 16 лет."
 lam_go_8_desc: "Выполнено при силе короны 50+."
 lam_go_9_desc: "Выполнено при доле силы при дворе 15%+."
 lam_fac_self_confidence_interaction: "Поставить вопрос о доверии"
 lam_fac_self_confidence_interaction_desc: "Созвать собрание фракции, поставив на кон место главы."
 lam_fac_self_confidence_preview_tt: "Ожидается: [actor.Custom('LamPvConf')]"
 lam_fac_self_recruit_interaction: "Созвать людей во фракцию"
 lam_fac_self_recruit_interaction_desc: "Разом разослать гонцов к товарищам при дворе с приглашением вступить во фракцию. Придут лишь те, кто готов."
 lam_fac_self_recruit_interaction_tt: "Готовы сейчас: около #high [actor.MakeScope.Var('lam_pv_recruit_n').GetValue|0] чел.#! (по данным прошлого сезона). Вступившие становятся приближёнными и остаются во фракции 2 года."
 lam_fac_recruit_cd_tt: "С последнего сбора должно пройти 2 года"
 lam_fac_recruit_yes_title: "Откликнулись на призыв: [Character.MakeScope.Var('lam_rc_n').GetValue|0]"
 lam_fac_recruit_no_title: "Никто не откликнулся на призыв"
 lam_fac_self_order_interaction: "Навести порядок во фракции"
 lam_fac_self_arms_interaction: "Призвать фракцию к оружию"
 lam_fac_self_rise_interaction: "Поднять фракцию"
 lam_fac_self_arms_chance_tt: "Ядро приходит с базовой вероятностью 90%, приближённые — 45%, с поправкой на мнение обо мне, сплочённость и воинские традиции. Те, кто меня не любит (мнение ниже −10), не придут."
 lam_fac_self_rise_preview_tt: "Сначала созывается собрание фракции — [actor.Custom('LamPvRise')]"
 lam_fac_back_heir_preview_tt: "Прогноз собрания фракции: [recipient.Custom('LamPvHeir')]"
