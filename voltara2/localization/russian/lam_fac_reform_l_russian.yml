l_russian:
 lam_cr_ballot_title: "Собрание фракции: наше решение"
 lam_cr_ballot_intro: "Фракция [lam_cr_head.GetShortUIName] собралась перед важным выбором. Исход решит голос каждого — по его положению и заслугам."
 lam_cr_ballot_stale: "Это собрание уже закончилось или положение участника изменилось — голосовать больше нельзя."
 lam_cr_ballot_numbers: "\n\nВлияние сторонников сейчас: #P [lam_cr_head.MakeScope.Var('lam_cr_yes').GetValue|1]#!\nВлияние противников сейчас: #N [lam_cr_head.MakeScope.Var('lam_cr_no').GetValue|1]#!\nОбщий вес голосов: [lam_cr_head.MakeScope.Var('lam_cr_total').GetValue|1]\nМой голос: #high [ROOT.Char.MakeScope.Var('lam_cr_weight').GetValue|1]#! ([ROOT.Char.MakeScope.ScriptValue('lam_cr_ballot_share_value')|1]%)\n\n[lam_cr_head.Custom('LamCrThreshold')]\n#weak Вес голоса определяется при открытии собрания. Умершие и покинувшие собрание выбывают из подсчёта. Голос, не поданный за 15 дней, считается воздержанием.#!\n[ROOT.Char.Custom2('LamUxBallot', GetPlayer)]"
 lam_cr_vote_yes: "Голосую за."
 lam_cr_vote_no: "Голосую против."
 lam_cr_vote_abstain: "Воздержусь."
 lam_cr_vote_request: "Если мои заслуги признают официально, я проголосую за."
 lam_cr_vote_binding_tt: "Мой голос учитывается в итоговом голосовании. В силу вступают только принятые вопросы."
 lam_cr_abstain_tt: "Мой голос остаётся в общем весе голосов, но не добавляется ни к «за», ни к «против»."
 lam_cr_request_tt: "Потребовать от главы официального признания. Если глава согласится, потратив 75 престижа, вы голосуете «за» и на два года получаете +3 влияния за заслуги. Вес голоса на этом собрании не меняется. При отказе можно проголосовать заново."
 lam_cr_request_title: "Цена поддержки"
 lam_cr_request_desc: "[lam_cr_petitioner.GetShortUIName] ставит условие: признайте заслуги официально — и этот вопрос получит поддержку."
 lam_cr_request_accept: "Пусть все узнают о ваших заслугах."
 lam_cr_request_refuse: "Это условие для меня неприемлемо."
 lam_cr_request_accept_tt: "Тратится 75 престижа. Голос «за» обеспечен, а заслуги во фракции признаются на два года: +3 влияния."
 lam_cr_close: "Понятно."
 lam_cr_result_title: "Решение собрания фракции"
 lam_cr_result_passed: "Вопрос получил достаточную поддержку и принят. Фракция будет действовать согласно этому решению."
 lam_cr_result_rejected: "Вопрос не получил нужной поддержки. Предложенные перемены не вводятся. Если отклонён ответ на запрет, фракция избирает противоположный курс."
 lam_cr_result_cancelled: "Руководство или условия вопроса изменились, и собрание отменено. По этому голосованию никакое решение не вводится."
 lam_cr_result_numbers: "\n\nЗа [TopScope.GetValue('lam_cr_result_yes')|1] · против [TopScope.GetValue('lam_cr_result_no')|1]\nОбщий вес голосов [TopScope.GetValue('lam_cr_result_total')|1]\n#weak Вес голоса складывается из военной силы, богатства, знатности, положения при дворе, связей и заслуг перед фракцией. Воздержавшиеся входят в общий вес голосов.#!"
 lam_cr_result_summary: "[ROOT.Char.Custom('LamCrResult')]\nФракция [lam_cr_head.GetShortUIName] завершила собрание.\nЗа [TopScope.GetValue('lam_cr_result_yes')|1] / против [TopScope.GetValue('lam_cr_result_no')|1] / всего [TopScope.GetValue('lam_cr_result_total')|1]"
 lam_cr_legacy_closed: "Это запись собрания, уже решённого по прежнему порядку. На нынешнее членство и положение главы она не влияет."
 lam_cr_contract_cancelled: "Условия для исполнения сделки исчезли, соглашение отменено"
 lam_cr_threshold_normal: "#high Условие принятия: «за» — больше половины общего веса голосов. При равенстве вопрос отклонён.#!"
 lam_cr_threshold_major: "#high Условие принятия: «за» — не менее двух третей общего веса голосов.#!"
 lam_cr_patronage_title: "Весы при дворе качнулись"
 lam_cr_patronage_desc: "Отношение [lam_pr_lord.GetShortUIName] к фракциям изменилось. Все следят, перед какой фракцией двери двора распахнутся шире. Нашей фракции тоже пора решить, как ответить."
 lam_cr_patronage_obstruct: "Не дадим соперникам верховодить в одиночку."
 lam_cr_patronage_coalition: "Объединимся с другими фракциями."
 lam_cr_patronage_approach: "Найдём путь снова приблизиться к правителю."
 lam_cr_obstruct_tt: "Выступить против текущего прошения соперников о должности, наследнике или законе. Давление действует только на это прошение."
 lam_cr_coalition_tt: "Предложить коалицию другой фракции, оттеснённой при дворе. Союз заключается только с её согласия. Если подходящей фракции нет, ответом станет сдерживание соперников."
 lam_cr_approach_tt: "Подать официальное прошение о должности или денежной помощи — по нынешнему недовольству. Нужны согласие правителя и действительное исполнение."
 lam_cr_approach_title: "Обделённая вниманием фракция снова ищет расположения правителя"
 lam_cr_obstruct_title: "Борьба за покровительство двора переросла в противостояние фракций"
 lam_cr_coalition_title: "Коалиция против засилья"
 lam_cr_coalition_desc: "[lam_pr_reactor.GetShortUIName] протягивает руку. Пока покровительство правителя склоняется к одной стороне, предлагается заключить союз и поддерживать друг друга."
 lam_cr_coalition_accept: "Мы тоже возвысим голос вместе с вами."
 lam_cr_coalition_decline: "У нас свой путь."
 lam_cr_coalition_formed: "Фракции, проигравшие борьбу за покровительство, заключили союз"
 lam_cr_coalition_refused: "Предложение коалиции отвергнуто"
 lam_cr_competition_opinion: "Соперничество за покровительство двора"
 lam_cr_person_name: "[Character.GetFirstNameNoTooltip] · [Character.MakeScope.ScriptValue('lam_cr_influence_value')|0]"
 lam_cr_status_active: "Идёт собрание фракции: за [Character.MakeScope.Var('lam_cr_yes').GetValue|0] / всего [Character.MakeScope.Var('lam_cr_total').GetValue|0]"
 lam_cr_status_passed: "Последнее собрание фракции: принято"
 lam_cr_status_rejected: "Последнее собрание фракции: отклонено"
 lam_cr_status_cancelled: "Последнее собрание фракции: отменено"
 lam_cr_status_none: "Сейчас собраний фракции нет"
 lam_cr_split_no_seat: "Непокорные пытались отколоться, но не нашли места для отдельной фракции"
 lam_cr_split_title: "Несогласные откалываются"
 lam_cr_split_desc: "После череды столкновений появилась отдельная фракция во главе с [lam_cr_split_head.GetShortUIName]. Голос «против», поданный вместе с ними, не обязывает уходить следом. Нужно решить, где остаться."
 lam_cr_split_follow: "Присоединюсь к новой фракции."
 lam_cr_split_stay: "Я остаюсь."
 lam_cr_withdraw_interaction: "Поставить вопрос об отзыве поддержки придворной партии"
 lam_cr_withdraw_interaction_desc: "Собрание фракции решит, отзывать ли официальную поддержку правителя."
 lam_cr_ballot_interaction: "Проголосовать на идущем собрании фракции"
 lam_cr_ballot_interaction_desc: "Вернуться к голосованию, на которое ещё не дан ответ. Срок собрания не продлевается."
 lam_cr_issue_court: "\n#high Вопрос: принять ли предложение стать придворной партией#!\nЕсли принято, фракция станет официальной опорой правителя. Пока эта поддержка сохраняется, повторно голосовать не придётся."
 lam_cr_issue_heir: "\n#high Вопрос: сменить ли кандидата на престол#!\nЕсли принято, фракция поддержит предложенного кандидата — [lam_vt_new.GetShortUIName]."
 lam_cr_issue_crown: "\n#high Вопрос: поддерживать ли прежнего кандидата против нового правителя#!\nЕсли принято, фракция сохраняет курс противостояния. Если отклонено, поддержка прежнего кандидата снимается, и фракция присматривается к новому правителю."
 lam_cr_issue_rise: "[lam_cr_head.Custom('LamPbCouncilText')]"
 lam_cr_issue_deal: "\n#high Вопрос: принять ли компромисс с правителем#!\nОбещанное вознаграждение и обязательства фракции исполняются только после принятия. Если отклонено, никто ничего не платит, и фракция остаётся при прежней позиции."
 lam_cr_issue_merge: "\n#high Вопрос: слиться ли с другой фракцией#!\nЕсли принято, нынешняя организация распускается и вливается в другую фракцию. Если отклонено, фракция остаётся самостоятельной.\nС кем слияние: фракция [lam_vt_new.GetShortUIName]. Голосуете «за» — переходите вместе с ней; «против» или воздерживаетесь — остаётесь вне фракций."
 lam_cr_issue_confidence: "\n#high Вопрос: сменить ли нынешнего главу#!\n«За» — смена главы, «против» — нынешний глава остаётся. Нынешний глава не голосует по вопросу о себе.\nКандидат в новые главы: [lam_vt_new.GetShortUIName]."
 lam_cr_issue_ban: "\n#high Вопрос: не подчиниться ли запрету и сохранить фракцию#!\nЕсли принято, фракция уходит в подполье и сохраняет организацию. Если отклонено, она распускается по запрету."
 lam_cr_issue_dissolve: "\n#high Вопрос: распустить ли фракцию по запрету#!\nДля роспуска нужно согласие не менее двух третей. Если отклонено, фракция продолжит жить в подполье."
 lam_cr_issue_withdraw: "\n#high Вопрос: отозвать ли поддержку придворной партии#!\nЕсли принято, фракция слагает с себя роль официальной опоры правителя и 5 лет не сможет снова стать придворной партией."
 lam_cr_issue_loyal: "\n#high Вопрос: перейти ли к курсу поддержки правителя?#!"
 lam_cr_issue_oppose: "\n#high Вопрос: перейти ли к курсу противостояния правителю?#!"
 lam_cr_issue_arm: "\n#high Вопрос: готовить ли военное давление#!\nЭто решение лишь о курсе подготовки. Настоящее выступление потребует отдельного важного голосования."
 lam_cr_issue_watch: "\n#high Вопрос: держаться ли в стороне от правителя и выжидать?#!"
 lam_cr_issue_quiet: "\n#high Вопрос: воздержаться ли от открытых действий?#!"
 lam_cr_issue_people: "\n#high Вопрос: отменить ли курс, заданный главой, и следовать воле членов фракции?#!"
 lam_cr_term_give_seat: "\nПравитель даёт: обещание места в совете"
 lam_cr_term_give_marriage: "\nПравитель даёт: обещание брака"
 lam_cr_term_give_county: "\nПравитель даёт: передача графства"
 lam_cr_term_give_gold: "\nПравитель даёт: деньги для фракции"
 lam_cr_term_give_bribe: "\nПравитель даёт: взятка главе"
 lam_cr_term_give_law: "\nПравитель даёт: смягчение власти правителя"
 lam_cr_term_give_heir: "\nПравитель даёт: назначение кандидата фракции наследником"
 lam_cr_term_give_amnesty: "\nПравитель даёт: амнистия фракции"
 lam_cr_term_ask_oath: "\nОбязательство фракции: клятва верности"
 lam_cr_term_ask_heir: "\nОбязательство фракции: поддержка наследника правителя"
 lam_cr_term_ask_disband: "\nОбязательство фракции: роспуск фракции"
 lam_cr_term_ask_counter: "\nОбязательство фракции: сдерживание фракции-соперницы"
 lam_cr_term_ask_arms: "\nОбязательство фракции: военная помощь"
 lam_cr_term_ask_law_support: "\nОбязательство фракции: поддержка изменения законов"
 lam_cr_term_ult_oath: "\nПравитель даёт: золото. Обязательство фракции: клятва не поднимать оружия ближайшие 5 лет."
