l_russian:
 lam_cv_title: "Собрание фракции"
 lam_cv_btn: "Собрание"
 lam_cv_btn_tt: "Открыть зал собрания этой фракции. Если голосование идёт — посмотреть его ход, если закончилось — прошлые итоги."
 lam_cv_head: "#high Собрание фракции [Character.GetShortUIName]#!  ·  [Character.Custom('LamCvState')]"
 lam_cv_state_now: "#high Идёт голосование#!"
 lam_cv_state_last: "[Character.Custom('LamCrStatus')]"
 lam_cv_target: "#weak О ком этот вопрос#!"
 lam_cv_tally_now: "За [Character.MakeScope.Var('lam_cr_yes').GetValue|0]  ·  против [Character.MakeScope.Var('lam_cr_no').GetValue|0]  ·  всего [Character.MakeScope.Var('lam_cr_total').GetValue|0]  ·  ещё не решили [Character.MakeScope.Var('lam_cr_pending').GetValue|0]  ·  [Character.Custom('LamCrThreshold')]"
 lam_cv_tally_last: "Прошлое собрание  за [Character.MakeScope.Var('lam_cr_last_yes').GetValue|0]  ·  против [Character.MakeScope.Var('lam_cr_last_no').GetValue|0]  ·  всего [Character.MakeScope.Var('lam_cr_last_total').GetValue|0]"
 lam_cv_ch_yes: "#P За#!"
 lam_cv_ch_no: "#N Против#!"
 lam_cv_ch_abstain: "#weak Воздерживается#!"
 lam_cv_ch_pending: "#weak Не решено#!"
 lam_cv_w: "#weak Вес голоса#! [Character.MakeScope.Var('lam_cr_weight').GetValue|0] [Character.Custom('LamCvRole')]"
 lam_cv_role_head: "#weak (глава ×1.5)#!"
 lam_cv_role_core: "#weak (ядро ×1.25)#!"
 lam_cv_call_title: "#high Вынести вопрос#!  #weak Голосование начнётся сразу.#!"
 lam_cv_call_tt: "Вынести этот вопрос на собрание фракции. Голосование начнётся сразу."
 lam_cv_call_retry_tt: "Тот же вопрос можно вынести снова через 6 месяцев"
 lam_cr_goal_seat_ui: "Место в совете для [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]"
 lam_cr_issue_goal_seat: "\n#high Вопрос: сменить ли цель фракции?#!\nМесто в совете для [lam_vt_new.GetShortUIName]"
 lam_cv_ag_goal: "#high Вопрос: сменить ли цель фракции?#!\n[Character.Custom('LamCrGoalUi')]"
 lam_cr_issue_goal: "\n#high Вопрос: сменить ли цель фракции?#!\n[lam_cr_head.Custom('LamCrGoalEv')]"
 lam_cr_req_issue_goal: "\n#high Вопрос: сменить ли цель фракции?#!"
 lam_cv_w_last: "#weak Вес голоса#! [Character.MakeScope.Var('lam_cv_w').GetValue|0]"
 lam_cv_why: "#weak отношения [Character.MakeScope.Var('lam_cv_op').GetValue|+0] · репутация [Character.MakeScope.Var('lam_cv_rep').GetValue|+0] · вопрос [Character.MakeScope.Var('lam_cv_iss').GetValue|+0]#!"
 lam_cv_why_tt: "Почему этот человек голосует именно так.\n#high Отношения#!: мнение о главе\n#high Репутация#!: является ли он сам главой, не присвоил ли глава казну, не предал ли, собственные заслуги\n#high Вопрос#!: взгляд на сам вопрос (характер, положение, отношения с кандидатом и т. п.)\nПри сумме +8 и выше — «за», −8 и ниже — «против», в промежутке — воздерживается."
 lam_cv_why_swayed: "#high Удалось убедить#!"
 lam_cv_why_held: "#weak Убедить не удалось#!"
 lam_cv_why_player: "#weak Личный голос#!"
 lam_cv_vote_yes: "Голосовать за"
 lam_cv_vote_no: "Голосовать против"
 lam_cv_vote_abstain: "Воздержаться"
 lam_cv_vote_tt: "Подать свой голос на этом собрании. Изменить его будет нельзя."
 lam_cv_sway: "Убедить"
 lam_cv_sway_tt: "Потратить 50 престижа, чтобы сдвинуть голос этого человека на шаг в вашу сторону (против → воздержаться → за). Чем лучше мнение этого человека о вас, тем легче его склонить. Раз на человека за собрание. Глава может склонять к «за» ещё до того, как подаст свой голос (в голосовании о доверии — к сохранению главы)."
 lam_cv_sway_first_tt: "Сначала подайте свой голос"
 lam_cv_sway_done_tt: "На этом собрании вы уже пытались убедить этого человека"
 lam_cv_sway_same_tt: "Уже голосует на вашей стороне"
 lam_cv_sway_ok: "Уговоры подействовали"
 lam_cv_sway_no: "Уговоры не помогли"
 lam_cv_hint: "#weak Голосуют глава (вес голоса зависит от вопроса), ядро и приближённые. Проигравшие целый год не помогают главе, а если недовольство накопится, могут отколоться.#!"
 lam_cv_none: "#weak Сейчас собрание не заседает.#!"
 lam_cr_vote_chamber: "Пойти в зал собрания"
 lam_cr_vote_chamber_tt: "В зале собрания видно, как и почему голосуют остальные; там же можно подать голос или переубедить их."
 lam_cv_ag_none: ""
 lam_cv_finish: "Завершить голосование"
 lam_cv_finish_tt: "Все голоса собраны. Подвести итог сейчас. Если этого не сделать, итог подведут через 15 дней после открытия собрания."
 lam_cv_menu_posture: "Курс"
 lam_cv_menu_posture_tt: "Предложить сменить курс по отношению к сюзерену."
 lam_cv_menu_goal: "Цель"
 lam_cv_menu_goal_tt: "Предложить сменить цель фракции."
 lam_cv_menu_seat: "Место в совете"
 lam_cv_menu_seat_tt: "Выбрать, кого провести в совет, и вынести это на собрание."
 lam_cv_menu_heir: "Кандидат в наследники"
 lam_cv_menu_heir_tt: "Выбрать кандидата для поддержки среди детей сюзерена, его нынешнего наследника и тех, у кого есть обоснованная претензия на его первый титул, и вынести на собрание."
 lam_cv_menu_stance: "Придворный вопрос"
 lam_cv_menu_stance_tt: "Предложить перейти на другую сторону в придворном вопросе."
 lam_cv_menu_rise: "Восстание"
 lam_cv_menu_rise_tt: "Предложить восстать против сюзерена."
 lam_cv_committed_tt: "Фракция не должна быть связана войной или коалицией против сюзерена"
 lam_cv_menu_posture_t: "Вопрос о курсе"
 lam_cv_menu_goal_t: "Вопрос о цели"
 lam_cv_menu_stance_t: "Придворный вопрос"
 lam_cv_menu_rise_t: "Вопрос о восстании"
 lam_cv_rise_council: "Вынести восстание на собрание фракции"
 lam_cv_rise_preview_tt: "Решает голосование собрания фракции — [ROOT.Char.Custom('LamPvRise')]"
 lam_cv_rise_puppet: "Последняя ночь: потребовать стать нашей марионеткой"
 lam_cv_rise_puppet_tt: "Без собрания — требование прямо к сюзерену. Если требование примут, власть за троном достанется нам без боя. Вероятность согласия: #high [ROOT.Char.MakeScope.ScriptValue('lam_fac_ult_puppet_chance_value')|0]%#! (зависит от силы фракции, авторитета короны и нрава сюзерена). При отказе вопрос о восстании решит собрание фракции."
 lam_cv_menu_desc: "Что вынесем на собрание фракции?"
 lam_cv_menu_back: "Оставим это"
 lam_cv_no_seat_tt: "Некого провести в совет"
 recipient_secondary_lam_cv_seat_interaction: "Кандидат в совет"
 recipient_secondary_lam_cv_heir_interaction: "Кандидат в наследники"
 lam_cv_seat_interaction: "Продвинуть в совет"
 lam_cv_seat_interaction_desc: "Выбрать человека из фракции и вынести на собрание фракции вопрос о том, чтобы провести его в совет."
 lam_cv_heir_interaction: "Продвинуть в наследники"
 lam_cv_heir_interaction_desc: "Выбрать одного из детей сюзерена, не лишённых наследства, его нынешнего наследника или обладателя обоснованной претензии на его первый титул. Если собрание фракции одобрит, фракция поддержит этого кандидата."
 lam_cv_invalid_heir_tt: "Нужно выбрать живого кандидата в наследники нынешнего сюзерена, которого наша фракция ещё не поддерживает"
 lam_cv_ag_court: "#high Вопрос: принять ли предложение стать придворной партией?#!\nЕсли решение примут, фракция станет официальной опорой правителя. Пока эта поддержка сохраняется, повторного голосования не будет."
 lam_cv_ag_heir: "#high Вопрос: сменить ли кандидата на престол?#!\nЕсли решение примут, фракция будет поддерживать предложенного кандидата — [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]."
 lam_cv_ag_crown: "#high Вопрос: поддерживать ли прежнего кандидата против нового правителя?#!\nЕсли решение примут, фракция остаётся в оппозиции. Если отклонят, она снимает поддержку прежнего кандидата и присматривается к новому правителю."
 lam_cv_ag_rise: "[Character.Custom('LamCvRiseText')]"
 lam_cv_ag_deal: "#high Вопрос: принять ли компромисс с правителем?#!\nОбещанные награды и обязательства фракции вступят в силу только после одобрения. Если отклонят, никто ничем не платит, и фракция остаётся при своём."
 lam_cv_ag_merge: "#high Вопрос: сливаться ли с другой фракцией?#!\nЕсли решение примут, фракция распускает свою организацию и вливается в другую. Если отклонят, остаётся самостоятельной.\nС кем слияние: фракция [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]. Кто за — переходит вместе со всеми; кто против или воздержался — остаётся неприсоединившимся."
 lam_cv_ag_confidence: "#high Вопрос: сменить ли нынешнего главу?#!\n«За» означает смену главы, «против» — сохранение нынешнего. Нынешний глава не участвует в голосовании о себе.\nКандидат в новые главы: [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]."
 lam_cv_ag_ban: "#high Вопрос: не подчиниться ли запрету и сохранить фракцию?#!\nЕсли решение примут, фракция уйдёт в подполье и сохранит организацию. Если отклонят, она распустится согласно запрету."
 lam_cv_ag_dissolve: "#high Вопрос: распустить ли фракцию согласно запрету?#!\nДля роспуска нужно согласие не менее двух третей. Если отклонят, фракция продолжит жить в подполье."
 lam_cv_ag_withdraw: "#high Вопрос: отказаться ли от поддержки правителя как придворная партия?#!\nЕсли решение примут, фракция сложит с себя статус официальной опоры правителя и 5 лет не станет придворной партией вновь."
 lam_cv_ag_loyal: "#high Вопрос: перейти ли к курсу поддержки правителя?#!"
 lam_cv_ag_oppose: "#high Вопрос: перейти ли к курсу противостояния правителю?#!"
 lam_cv_ag_arm: "#high Вопрос: готовить ли военное давление?#!\nЭто решение лишь о курсе подготовки. Чтобы взяться за оружие, нужно ещё одно, особое голосование."
 lam_cv_ag_watch: "#high Вопрос: держаться ли в стороне от правителя и выжидать?#!"
 lam_cv_ag_quiet: "#high Вопрос: воздержаться ли от открытых действий?#!"
 lam_cv_ag_people: "#high Вопрос: отменить ли курс, заданный главой, и следовать воле членов фракции?#!"
 lam_cv_call_stance_btn_crown: "Авторитет короны: сменить сторону"
 lam_cv_call_stance_btn_council: "Места в совете: сменить сторону"
 lam_cv_call_stance_btn_faith: "Вера и культура: сменить сторону"
 lam_cv_call_stance_btn_tax: "Налоги и ополчение: сменить сторону"
 lam_cv_call_stance_btn_war: "Спор о войне: сменить сторону"
 lam_cv_ag_petition: "#high Вопрос: прошение к сюзерену#!"
 lam_cv_ag_stance: "#high Вопрос: сменить ли нашу сторону в придворном вопросе?#!\n[Character.Custom('LamCrStanceUi')]"
