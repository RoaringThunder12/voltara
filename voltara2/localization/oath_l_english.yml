 oathbound_county_conquest_cb_victory_desc_attacker:0 "By blood and iron, you have fulfilled your sworn vow. The contested lands have been successfully seized and delivered into the hands of your Oathholder, proving the absolute strength of your loyalty."
 
 oathbound_county_conquest_cb_victory_desc:0 "[attacker.GetTitledFirstName] has successfully conquered the contested lands, fulfilling their sworn vow and transferring the seized territory directly to their Oathholder."




