 oathbound_task_duel_rival:0 "Task: Duel [ROOT.GetCharacter.Custom('GetOathholderDuelTargetName')]"
 
 oathbound_task_duel_rival_desc:0 "Word has arrived from [ROOT.GetCharacter.Custom('GetOathholderName')]. I have been commanded to track down [ROOT.GetCharacter.Custom('GetOathholderDuelTargetName')] and challenge them to mortal combat. I must pack my gear, travel to their location, and execute my sworn duty."
 
 oathbound_task_duel_rival_tooltip:0 "Begin traveling to the target's current location to initiate the duel."
 
 oathbound_task_duel_rival_effect_tt_1:0 "You will begin traveling to [ROOT.GetCharacter.Custom('GetOathholderDuelTargetLocationName')]."
 
 oathbound_task_duel_rival_effect_tt_2:0 "Upon arrival, you will attempt to corner them and initiate single combat."

 oathbound_task_events.0004.t:0 "A Champion's Errand"
 
 oathbound_task_events.0004.desc:0 "I am called before [scope_oathholder.GetTitledFirstName]. [scope_oathholder.GetSheHe] stands tall, [scope_oathholder.GetHerHis] expression hard and resolute. \n\n"There is an insult to my honor that has gone unanswered for too long," [scope_oathholder.GetTitledFirstName] says, their voice echoing in the hall. "The coward [scope_target_rival.GetTitledFirstName] hides behind their walls, thinking themselves safe from my reach."\n\n[scope_oathholder.GetFirstNameNoTooltip] turns to me, eyes blazing with martial pride. "I am sending my finest blade to answer them. Ride out. Find them. Look them in the eye, and strike them down in my name.""
 
 oathbound_task_events.0004.a:0 "I will saddle my horse immediately."
 oathbound_task_events.0004.a.desc:0 "You will begin traveling to [scope_target_rival.GetTitledFirstName]'s location."
 oathbound_task_events.0004.b:0 "I will make my preparations and depart soon."
 oathbound_task_events.0004.b.desc:0 "You can begin the journey via the Decisions menu when you are ready."


 oathbound_task_events.0005.t:0 "A Public Reckoning"
 
 oathbound_task_events.0005.desc:0 "I have arrived at [scope_target_rival.GetCurrentLocation.GetName]. I did not come here to skulk in the shadows or slip a blade into [scope_target_rival.GetHerHis] ribs in the dead of night. I am the sworn Oathbound of [scope_oathholder.GetTitledFirstName], and I am here to deliver [scope_oathholder.GetHerHis] justice in the light of day.\n\nI make my way to the center of the local courtyard, ignoring the murmurs of the garrison. Drawing my weapon and planting it into the earth, I call out [scope_target_rival.GetHerHis] name for all to hear, formally demanding [scope_target_rival.GetSheHe] step forward and answer for [scope_target_rival.GetHerHis] transgressions with steel."
 
 oathbound_task_events.0005.a:0 "Show yourself and face me!"
 
 oathbound_duel_begun_tt:0 "Pride forces [scope_target_rival.GetTitledFirstName] to answer your call. A lethal duel begins!"
 oathbound_duel_failed_tt:0 "[scope_target_rival.GetTitledFirstName] cowers behind [scope_target_rival.GetHerHis] guards and refuses the challenge. The task is abandoned."
 
 oathbound_duel_failed_toast:0 "Challenge Refused"


 oathbound_task_events.0008.t:0 "The Dust Settles"
 
 oathbound_task_events.0008.desc:0 "The clash of steel has ended. The heavy breathing and the scent of blood fill the air as the duel reaches its definitive, brutal conclusion."
 
 oathbound_task_events.0008.a:0 "A victory in my Oathholder's name."
 oathbound_task_events.0008.a.desc:0 "You have emerged victorious from the duel!"
 
 oathbound_task_events.0008.b:0 "Ugh... I have failed my oath..."
 oathbound_task_events.0008.b.desc:0 "You have been defeated."

 oathbound_task_events.0007.t:0 "A Hollow Journey"
 
 oathbound_task_events.0007.desc:0 "I have arrived, my hand ready on the hilt of my sword... only to find that circumstances have drastically changed. My quarry is no longer in a position to cross blades with me. \n\nFate has robbed me of the chance to fulfill my vow. I have no choice but to pack my gear and return home."
 
 oathbound_task_events.0007.a:0 "A disappointing end to the errand."

 oathbound_duel_attempted_opinion:0 "Rode out for me"

 oathholder_decided_duel_toast:0 "Orders: Honorable Combat"
 oathholder_decided_duel_toast_desc:0 "[root.GetTitledFirstName] has decreed that any enemies of the realm shall be dealt with openly. Expect to be sent into direct, martial duels."

 oathholder_decided_murder_toast:0 "Orders: Shadows & Silence"
 oathholder_decided_murder_toast_desc:0 "[root.GetTitledFirstName] has decided that true threats are best handled quietly. Expect to be dispatched on clandestine murder schemes."

 oathholder_decided_neither_toast:0 "Orders: Stay Your Blade"
 oathholder_decided_neither_toast_desc:0 "[root.GetTitledFirstName] has chosen a path of mercy and diplomacy. For the foreseeable future, you will not be commanded to spill blood on their behalf."

 oathbound_task_cancelled_epidemic_toast:0 "Task Abandoned: Epidemic"
 oathbound_task_cancelled_epidemic_desc:0 "A deadly sickness has swept through the region. With the peasantry dying and panic taking hold, your mandate has collapsed. You have been forced to break camp and abandon your efforts to enforce order."

 oathbound_sway_job_cancelled_toast:0 "Assignment Abandoned"
 oathbound_sway_job_cancelled_toast_desc:0 "You have abandoned the sway scheme assigned by your Oathholder. They will not soon forget this failure of loyalty."

 oathbound_kill_job_invalid_toast:0 "Target No Longer Valid"
 oathbound_kill_job_invalid_toast_desc:0 "The target is no longer considered an enemy by your Oathholder. The murder assignment has been cancelled and your scheme has been ended."

 oathbound_kill_scheme_discovered_toast:0 "Scheme Discovered"
 oathbound_kill_scheme_discovered_toast_desc:0 "Your murder scheme has been uncovered. The assignment has been abandoned to protect both you and your Oathholder."

 oathbound_kill_job_cancelled_toast:0 "Assignment Abandoned"
 oathbound_kill_job_cancelled_toast_desc:0 "You have abandoned the murder scheme assigned by your Oathholder. They will remember this act of disloyalty."

 oathbound_duel_target_dead_toast:0 "Target Already Dead"
 oathbound_duel_target_dead_toast_desc:0 "Your duel target has already perished. The assignment has been concluded without your direct involvement."

