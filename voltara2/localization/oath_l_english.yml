 oathbound_debug_cleanup_complete_desc:0 "All Oathbound variables, flags, and modifiers have been removed from this character."


 oathbound_became_leader_events.0001.t:0 "From Sword to Scepter"
 
 oathbound_became_leader_events.0001.desc:0 "For so long, my life was defined entirely by the oath I swore. I was a weapon pointed at the enemies of my liege, an enforcer of their will, and a loyal servant bound by a sacred, unyielding vow.\n\nBut the wheel of fortune turns. Today, I do not stand in a courtyard awaiting orders. I stand in my own hall. The earth beneath my feet, the titles to my name, and the subjects who look to me for protection—they are mine. My old vow has been respectfully dissolved, replaced by a formal alliance of peers.\n\nI am no longer merely Oathbound. I am a ruler in my own right."
 
 oathbound_became_leader_events.0001.a:0 "Bring me my crown."
 oathbound_became_leader_events.0001.a.desc:0 "You are no longer an Oathbound. All active tasks have been abandoned, and you have secured a lasting alliance with your former Oathholder."

