 oathholder_target_county_name_missing:0 "the targeted region"

 oathbound_task_events.0001.t:0 "Task: Restore Order"
 oathbound_task_events.0001.desc:0 "A missive arrives from [scope_oathholder.GetTitledFirstName]. The situation in [scope_target_county.GetName] has deteriorated. Taxes are being withheld, local magistrates are being ignored, and the peasantry grow bolder by the day.\n\n"The local guards are useless or corrupt," the letter reads. "I need my Oathbound. Bring your camp to the unruly province, draw your steel, and remind these people who rules them.""
 oathbound_task_events.0001.a:0 "I accept the task."
 oathbound_task_events.0001.a.desc:0 "You will immediately begin traveling to [scope_target_county.GetName]. [scope_oathholder.GetTitledFirstName] will provide your provisions.\n#I You must remain stationed in the county until Order reaches 100 to successfully complete this task.#!"
 oathbound_task_events.0001.b:0 "I will make my own way there."
 oathbound_task_events.0001.b.desc:0 "You accept the task, but will manually travel to the targeted county when you are ready. [scope_oathholder.GetTitledFirstName] will provide your provisions."

 oathbound_task_events.0002.t:0 "Enforcing the Oathholder's Will"
 oathbound_task_events.0002.desc:0 "I have arrived at [scope_target_county.GetName], and the tension in the air is palpable. Smugglers linger openly on the roadsides, and the locals sneer at the crown's banners without an ounce of fear.\n\nI give the order to my followers to unpack the wagons and set up camp. It is time to patrol the streets, knock in a few doors, and show this rabble exactly what happens when they defy the [ROOT.GetCharacter.Custom('GetOathholderName')]."
 oathbound_task_events.0002.a:0 "Let's get to work."
 oathbound_task_events.0002.a.desc:0 "You begin actively patrolling in [scope_target_county.GetName]. The effectiveness of your presence will depend on your Martial skill and level of Fame."

 oathbound_task_complete_toast:0 "Task Completed: Order Restored"
 oathbound_task_complete_toast_desc:0 "You have successfully stamped out the unrest. The streets are quiet, the taxes flow once more, and word of your brutal efficiency is spreading."

 oathbound_task_increasing_control:0 "Task: Enforce Order"
 oathbound_task_increasing_control_desc:0 "Word has arrived from [ROOT.GetCharacter.Custom('GetOathholderName')]. The peasantry in [ROOT.GetCharacter.Custom('GetOathholderControlTargetName')] are growing unruly, and the local garrison is failing to maintain the peace. I have been commanded to move my camp to the region and restore order by any means necessary.\n\nCurrent Control: #V [ROOT.Char.MakeScope.ScriptValue('oathholder_target_county_control_value')|0]/100#!\n#I Raise Control to 100.#!"
 oathbound_task_increasing_control_tooltip:0 "You will travel to your Oathholder's targeted county and use your camp's presence to forcefully suppress local unrest until Order is fully restored."
 oathbound_task_increasing_control_confirm:0 "Travel to the county"
 oathbound_task_increasing_control_effect_tt_1:0 "You will travel to the targeted county."
 oathbound_task_increasing_control_effect_tt_2:0 "Your Oathholder will provide the provisions."

 oathholder_no_longer_capital_toast:0 "Task Cancelled: Target Lost"
 oathholder_no_longer_capital_toast_desc:0 "The task has been abandoned because your Oathholder no longer controls the targeted county. The contract is null and void."

 oathbound_task_cancelled_naturally_toast:0 "Task Concluded: Order Restored"
 oathbound_task_cancelled_naturally_desc:0 "Word has reached your camp that the unrest in the county has already been quelled. The local magistrates have regained control, meaning your presence is no longer required."

 oathbound_imprisoned_on_task_toast:0 "Task Failed: Stripped of Agency"
 oathbound_imprisoned_on_task_toast_desc:0 "Stripped of your physical agency, you are entirely unable to command your camp or enforce your Oathholder's will in [ROOT.GetCharacter.Custom('GetOathholderControlTargetName')]. Without your strength to keep the rabble in line, the contract has been broken."

 oathbound_broken_relation_on_task_toast:0 "Task Abandoned: Oaths Shattered"
 oathbound_broken_relation_on_task_toast_desc:0 "An oath broken is a contract severed. You no longer serve your former master, and your word carries no weight. Your camp has packed up and ceased all operations in [ROOT.GetCharacter.Custom('GetOathholderControlTargetName')]."

 oathbound_task_events.1001.t:0 "Task: Sway Vassal"
 oathbound_task_events.1001.desc:0 "A runner arrives from [scope_oathholder.GetTitledFirstName] bearing a sealed missive. There is no call to arms, nor orders to march my camp. Instead, it is a request for delicate diplomacy.\n\nIt seems [scope_target_vassal.GetTitledFirstName] has been nursing a bitter grudge against my Oathholder, and their sour mood could threaten the stability of the realm. Rather than sending my mercenaries to crack skulls, my employer wants me to use a lighter touch.\n\n#I I am expected to warm [scope_target_vassal.GetFirstNameNoTooltip]'s disposition until they hold my Oathholder in reasonably high regard. #!"
 oathbound_task_events.1001.a:0 "I shall begin sending letters at once!"
 oathbound_task_events.1001.a.desc:0 "You will begin a scheme on behalf of your Oathholder to #V Sway#! [scope_target_vassal.GetTitledFirstName].\n\n#I You must raise their opinion of your Oathholder to at least 50. #!\n\n@warning_icon! #X You do not need to travel for this task.#!"


 oathbound_task_events.1002.t:0 "Task Completed: Sway Vassal"
 oathbound_task_events.1002.desc:0 "Through careful words, well-placed gifts, and persistent correspondence, I have successfully smoothed over the friction between [scope_target_vassal.GetTitledFirstName] and my employer.\n\nWhere there was once bitter resentment, [scope_target_vassal.GetSheHe] now speaks of [scope_oathholder.GetTitledFirstName] with newfound respect and understanding. I have sent word to [scope_oathholder.GetFirstNameNoTooltip] that the matter is resolved, and the realm is secure—without a single sword needing to be drawn."
 
 oathbound_task_events.1002.a:0 "The quill is indeed mightier than the sword."

 oathholder_send_to_kill_rival_ai_desc:0 "Command your Oathbound to fulfill their vows by eliminating a dangerous rival or nemesis."
 oathholder_send_to_kill_rival_ai_tooltip:0 "Your Oathbound will be ordered to begin a Murder scheme against your chosen enemy."

 oathbound_task_events.1003.t:0 "A Bloody Mandate"
 
 oathbound_task_events.1003.desc:0 "I am summoned to meet with my Oathholder in absolute secrecy. When I arrive, [scope_oathholder.GetTitledFirstName] is pacing the stone floor, their expression dark and burdened by the burdens of rule.\n\n"There are threats to my reign that cannot be handled in the light of day," [scope_oathholder.GetFirstNameNoTooltip] begins, turning to face me. "You swore an oath to serve my interests, to be the shield at my side and the blade in the dark. I must call upon that vow now."\n\n[scope_oathholder.GetFirstNameNoTooltip] steps closer, lowering [scope_oathholder.GetHerHis] voice to a dangerous whisper. "[scope_target_rival.GetTitledFirstName] is a cancer upon my realm. I need [scope_target_rival.GetHerHim] removed. Permanently. Use your spies, use your poisons, use whatever means necessary, but do not fail me in this.""
 
 oathbound_task_events.1003.a:0 "It will be done. By my oath."
 oathbound_task_events.1003.a.desc:0 "You will begin a Murder scheme against [scope_target_rival.GetTitledFirstName]."

 oathbound_task_events.1004.t:0 "A Promise Kept"
 
 oathbound_task_events.1004.desc:0 "The deed is done. My Oathholder's rival is no more.\n\nI stand quietly before [scope_oathholder.GetTitledFirstName], awaiting my judgment. For a long moment, my Oathholder simply looks at me, a profound mixture of relief and immense gratitude washing over their features.\n\n"You have done me a service that can never truly be spoken of, yet will never be forgotten," [scope_oathholder.GetFirstNameNoTooltip] says softly, placing a hand on my shoulder. "You have proven the true weight of your oath today. I sleep safer knowing you are bound to me.""
 
 oathbound_task_events.1004.a:0 "My blade is yours to command."

 order_oathbound_to_push_my_claim:0 "Invoke the Oath: Press My Claim"
 compell_oathbound_to_push_my_claim_desc:0 "Call upon your sworn Oathbound, ordering them to raise their banners and bleed their armies to press your claim."
 compell_mesmerized_to_push_my_claim_notification:0 "Oath Invoked: War Declared"

 oathholder_order_events.0100.t:0 "The Call to Arms"
 
 oathholder_order_events.0100.desc:0 "I am summoned to the map room, where [my_oathholder.GetTitledFirstName] stands over a sprawling parchment depiction of the known world. A heavy iron dagger has been driven firmly into the lands belonging to [chosen_target.GetTitledFirstName].\n\n"You swore an oath to serve my interests," [my_oathholder.GetFirstNameNoTooltip] says, their voice ringing with absolute authority. "That territory—[chosen_claim.GetName]—is mine by right. Yet it sits in the hands of a usurper."\n\nThey turn to face me, their eyes hard and demanding. "I am calling upon your vow. Marshal your levies. Raise your knights. You will march on their borders and take my lands back for me.""
 
 oathholder_order_events.0100.a:0 "My sword is yours. We march at dawn."
 oathholder_order_events.0100.b:0 "I will not bleed my realm for this! (Break Oath)"

 oathholder_order_events.0101.t:0 "Banners of Iron"
 
 oathholder_order_events.0101.desc:0 "The horns echo through the courtyard as my commanders rally the troops. The declaration of war has already been sent; there is no turning back now. We will bleed for [chosen_claim.GetName].\n\n[my_oathholder.GetTitledFirstName] watches the men assemble, giving a solemn, approving nod. "You have honored your vow," they say quietly. "Bring me the usurper's crown, and your loyalty will be remembered."\n\nI bow my head. The cost in gold and lives will be steep, but my honor remains intact. I am bound to serve."
 
 oathholder_order_events.0101.a:0 "By blood and iron, it will be yours."

 oathholder_order_events.0102.t:0 "A Shattered Vow"
 
 oathholder_order_events.0102.desc:0 "I look at the map, visualizing the thousands of my own peasants who would die in the mud for a title that isn't even mine. The weight of the crown feels heavier than the weight of my word.\n\n"No," I say, my voice steady despite the pounding in my chest. "I swore to aid you, but I will not bankrupt my realm and slaughter my people for your territorial ambitions."\n\n[my_oathholder.GetTitledFirstName]'s expression hardens into pure, absolute disgust. "Your word is as empty as your honor," they spit, turning their back on me. "Do not expect me to forget this betrayal.""
 
 oathholder_order_events.0102.a:0 "My duty to my people comes first."


