 oathbound_sway_job_invalid_toast_desc:0 "Your diplomatic target has passed away. The task assigned by your Oathholder has been abruptly concluded."



 oathbound_control_modifier_upgraded_toast:0 "Patrol Effectiveness Upgraded"
 oathbound_control_modifier_upgraded_strong_desc:0 "Your growing reputation and martial skill have elevated the strength of your patrols. The county now benefits from the presence of a legendary enforcer. Locals and troublemakers alike know your name."
 oathbound_control_modifier_upgraded_normal_desc:0 "Your rising profile has strengthened your patrols. Your enforcement is no longer going unnoticed, and the county benefits from a more capable hand keeping order."



 oathbound_task_events.0003.t:0 "The Oathholder's Peace"
 
 oathbound_task_events.0003.desc:0 "My boots hit the cobblestones as I lead a patrol through the streets of [scope_patrol_county.GetName]. As an Oathbound to my Oathholder, it is my sworn duty to ensure that their laws are respected and their peace is maintained, even in the darkest corners of the realm.\n\nThe locals watch me carefully from doorways and alleys. Some look with gratitude, others with veiled hostility. I keep my hand resting on the pommel of my blade, watching for any sign of dissent, banditry, or insurrection. Order will be kept today, no matter what it takes."
 
 oathbound_task_events.0003.a:0 "We walk the streets until dusk."

 oathbound_patrol_event_nothing_tt:0 "You spend the day patrolling, but find nothing of note."
 oathbound_patrol_event_moderate_tt:0 "You break up a local disturbance and enforce your liege's laws."
 oathbound_patrol_event_major_tt:0 "You decisively crush a budding criminal enterprise, bringing absolute order to the streets."


 oathbound_patrol_toast_nothing:0 "Uneventful Patrol"
 oathbound_patrol_toast_moderate:0 "Order Maintained"
 oathbound_patrol_toast_major:0 "Decisive Justice"


 oathholder_send_to_duel_rival_ai_desc:0 "Command your Oathbound to travel to your enemy's location and challenge them to a duel to the death."
 oathholder_send_to_duel_rival_ai_tooltip:0 "Your Oathbound will be ordered to travel and initiate lethal Single Combat with your chosen enemy."


 oathholder_target_duel_name_found:0 "[oathholder_target_duel.GetTitledFirstName]"
