 oathbound_remove_all_vars_desc:0 "Removes every single variable, flag, and modifier related to the Oathbound system from yourself, your boss, and all counties."
 oathbound_remove_all_vars_tooltip:0 "Remove all Oathbound variables and flags from this character."
 oathbound_remove_all_vars_confirm:0 "Remove all Oathbound variables and flags from this character."

