 oathbound_increase_control_decision_toast_desc:0 "Your camp followers scatter across the county, ready to bring the unruly locals to heel."

 oathbound_control_cooldown_tt:0 "You have recently established patrols in a county"

 oathbound_enforcing_order_weak:0 "Unproven Patrols"
 oathbound_enforcing_order_weak_desc:0 "A bound adventurer is attempting to patrol this region, but their lack of a fearsome reputation and martial coordination means the locals remain defiant and bandits continue to slip through the cracks."
 
 oathbound_enforcing_order_normal:0 "Oathbound Patrols"
 oathbound_enforcing_order_normal_desc:0 "A respected bound adventurer and their camp followers are actively patrolling this region. Their proven martial competence and steady presence are effectively bringing the unruly locals to heel."
 
 oathbound_enforcing_order_strong:0 "Ironclad Order"
 oathbound_enforcing_order_strong_desc:0 "A legendary Oathbound enforcer has locked down this region. Their terrifying reputation precedes them; crime ceases to exist where their banners fly, as the local peasantry lives in absolute awe and fear of their patrols."
