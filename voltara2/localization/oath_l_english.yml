 oathbound_absorb_stress_interaction_desc:0 "The weight of leadership is crushing [recipient.GetTitledFirstNameNoTooltip]. I will step into their inner sanctum, listen to their darkest anxieties, and quietly take over their most grueling, thankless affairs so they might find a moment of peace.\n\nAs their Oathbound, it is my duty to bear the weight they cannot."
