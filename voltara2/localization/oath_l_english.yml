 oathbound_increase_control_decision:0 "Enforce Local Order For Oathholder"
 oathbound_increase_control_decision_desc:0 "As an Oathbound, my blade serves my holder, but right now, the local peasantry needs a stark reminder of who is in charge. By deploying my camp followers to patrol the roads, hang bandits, and dispense harsh justice, I can bring this unruly county to heel.\n\n#I The patrol modifier will be removed when you pack up and move your camp. #!"
 oathbound_increase_control_decision_tooltip:0 "You will begin actively patrolling in the county, increasing its [control|E] over time."
 oathbound_increase_control_decision_confirm:0 "Enforce Local Order For Oathholder"
