 lam_is_faith_title: "#high Faith and Culture#!"
 lam_is_faith_tt: "How to treat other faiths and cultures.\n#high Orthodoxy:#! factions defending the faith or zealous ones; a zealous liege adds weight.\n#high Tolerance:#! factions seeking tolerance or of a minority faith or culture.\nTolerance raises acceptance of their cultures and other faiths' opinion; orthodoxy brings piety.\nCause: the more vassals of other faiths and cultures, the stronger the case for tolerance.\n\n#weak Winning over unaligned vassals adds their power to a side. For three years the winners draw people, while the losers' cohesion falls and people leave. The liege can only lend a hand.#!"
