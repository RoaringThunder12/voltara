 lam_is_even: "Even"
 lam_is_push_tt: "Weigh in on this matter. Once a year across all matters.\nLiege 8 (100 prestige) · head 10 + a tenth of their weight (100 prestige) · member 6 (50 prestige) · unaligned 8 (75 prestige)\nA head also tries to win over one unaligned vassal (the better they think of you, the likelier).\nAn unaligned lord who takes a side adds their power to it until the end; if it wins, they gain prestige and that side's heads' favour.\nThe other side's heads remember it."
