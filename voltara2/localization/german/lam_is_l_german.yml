 lam_is_tax_title: "#high Taxes and Levies#!"
 lam_is_tax_tt: "What vassals owe in taxes and levies.\n#high Keep the dues:#! factions aiming for a stronger crown or loyal ones, and the liege's weight.\n#high Lighten the burden:#! factions seeking concessions or opposed to the liege.\nIf they win, vassal taxes and levies fall for five years; if the dues side wins, they rise for three.\nCause: a war over a year long, or a full treasury in peace, favours lightening; an empty treasury favours the dues.\n\n#weak Winning over unaligned vassals adds their power to a side. For three years the winners draw people, while the losers' cohesion falls and people leave. The liege can only lend a hand.#!"
