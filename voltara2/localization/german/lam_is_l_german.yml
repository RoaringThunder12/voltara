 lam_is_war_evt_c: "The call to arms has carried the court. The factions want their liege to march."
 lam_is_war_evt_p: "A war-weary court wants peace. The factions demand an end to the war with [Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]."
 lam_is_war_acc_c: "Promise a campaign within two years"
 lam_is_war_acc_p: "Make a white peace"
 lam_is_war_title_c: "A Campaign?"
 lam_is_war_title_p: "War with [Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]"
 lam_is_war_tt_c: "Whether to go to war.\n#high Campaign:#! glory-seeking or belligerent factions, those reclaiming lost land, and those led by brave, ambitious or wrathful heads.\n#high Keep the peace:#! factions holding what they have or seeking concessions, those opposed to the liege, and those led by craven, content or lazy heads. A recent war adds weight here.\nIf the campaign side wins, the liege promises a war within two years."
 lam_is_war_tt_p: "Whether to fight this war on.\n#high Fight on:#! glory-seeking or belligerent factions, those reclaiming lost land, and those led by brave, ambitious or wrathful heads. Winning adds weight here.\n#high Make peace:#! factions holding what they have or seeking concessions, those opposed to the liege, and those led by craven, content or lazy heads. Losing, or three years of war, adds weight here.\nIf the peace side wins, this war ends in a white peace."
 lam_is_heir_title: "#high The Succession#!"
 lam_is_heir_tt: "Factions want another child as heir.\n#high The heir's side:#! factions backing the heir, and the weight of the crown.\n#high The other side:#! factions backing that child.\nIf they win, the liege decides whether to change the heir; refusing leaves their backers spurned.\nCause: a child, incapable or bastard heir favours raising another; a child challenger favours the heir. Lawful succession is itself a cause for the heir.\n\n#weak Winning over unaligned vassals adds their power to a side. For three years the winners draw people, while the losers' cohesion falls and people leave. The liege can only lend a hand.#!"
