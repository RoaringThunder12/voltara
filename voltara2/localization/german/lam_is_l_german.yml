 lam_is.0002.t: "The Balance of the Court"
 lam_is.0002.open: "Where the factions of [lam_is_lord.GetShortUINamePossessive] court are locked in a fight:"
 lam_is.0002.a: "I see"
 lam_is.0002.beaten: "\n\n#N Our faction lost a court issue and is weakening. For three years people leave easily.#!"
 lam_is.0002.victor: "\n\n#P Our faction won a court issue and is drawing people.#!"
 lam_is.0002.tip_head: "\n\n#high Worth doing now#!\nIf we throw our weight behind a side in this quarrel (once a year), we also try to win one unaligned vassal over."
 lam_is.0002.tip_member: "\n\n#high Worth doing now#!\nMembers can lend weight on an issue card too (once a year)."
 lam_is.0002.tip_unaligned: "\n\n#high Worth doing now#!\nUnaligned, my power can tip the scales. Taking a side on an issue card adds it to that side until the end; if it wins, I gain prestige and favour."
 lam_is_dig_head: "\n\n#high Court issues#!"
