 lam_cv_ag_arm: "Agenda: Prepare military pressure. An actual rising requires a separate supermajority."
 lam_cv_ag_watch: "Agenda: Watch the ruler without committing."
 lam_cv_ag_quiet: "Agenda: Restrain public action."
 lam_cv_ag_people: "Agenda: End the head's imposed posture and follow the members' inclinations."
