 lam_cv_ag_confidence: "Agenda: Replace the head. Yes means replacement; no retains the incumbent. The incumbent has no vote.\nProposed replacement: [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]."
 lam_cv_ag_ban: "Agenda: Defy the ban and go underground. Rejection accepts dissolution."
