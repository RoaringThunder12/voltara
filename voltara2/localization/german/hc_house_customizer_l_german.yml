l_german:
 hc_house_customizer:0 "Haus-Anpassung"
 hc_house_customizer_desc:0 "Dieser Charakter kann einen Platz unter den etablierten Blutlinien der Welt beanspruchen."
 trait_hc_house_customizer:0 "Haus-Anpassung"
 trait_hc_house_customizer_desc:0 "Dieser Charakter kann einen Platz unter den etablierten Blutlinien der Welt beanspruchen."
 trait_hc_house_customizer_character_desc:0 "Dieser Charakter kann einen Platz unter den etablierten Blutlinien der Welt beanspruchen."

 hc_open_house_customizer_interaction:0 "Abstammung beanspruchen"
 hc_open_house_customizer_interaction_desc:0 "Wählt, wie Eure Verbindung zum Haus von [recipient.GetShortUINameNoTooltip] in Erinnerung bleiben soll."

 hc_house_customizer.0001.t:0 "Blut und Name"
 hc_house_customizer.0001.desc:0 "Schreiber kennen viele Wahrheiten, und mehr als eine wurde mit geduldiger Tinte berichtigt. Vor Euch liegt ein Weg in das Haus [hc_target.GetHouse.GetName], sei es durch Anerkennung, gemeinsames Blut oder einen lange vergessenen Zweig."

 hc_house_customizer.0001.become_child:0 "Man soll mich als ihr Kind anerkennen."
 hc_house_customizer.0001.become_sibling:0 "Man soll mich zu ihren Geschwistern zählen."
 hc_house_customizer.0001.open_bastard_options:0 "Eine Geburt außerhalb der Ehe erwägen."
 hc_house_customizer.0001.open_bastard_options_tt:0 "Ihr werdet verschiedene Wege erwägen, als Kind anerkannt zu werden, das außerhalb einer rechtmäßigen Verbindung geboren wurde."
 hc_house_customizer.0001.become_distant_relative:0 "Man soll mich als Verwandten aus einem entfernten Zweig kennen."
 hc_house_customizer.0001.cancel:0 "Ich werde meine Abstammung nicht ändern."

 hc_house_customizer.0002.t:0 "Blut außerhalb der Ehe"
 hc_house_customizer.0002.desc:0 "Nicht alles edle Blut wird unter feierlichen Gelübden und vor willigen Zeugen geboren. Manche Wahrheiten leben in den Rändern der Chroniken, in versiegelten Briefen und in Geständnissen, die nur wenige auszusprechen wagen."
 hc_house_customizer.0002.back:0 "Zur Frage meiner Abstammung zurückkehren."
 hc_house_customizer.0002.cancel:0 "Diese Wahrheit soll begraben bleiben."

 hc_house_customizer.0001.become_bastard:0 "Man soll mich als Bastard anerkennen."
 hc_house_customizer.0001.become_legitimized_bastard:0 "Man soll mich trotz meiner Geburt legitimieren."

 hc_house_customizer.tt.become_child:0 "Ihr werdet in den Aufzeichnungen als Kind von [hc_target.GetShortUIName] eingetragen."
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName] wird als Euer anderer Elternteil verzeichnet."
 hc_house_customizer.tt.become_sibling:0 "Ihr werdet als Geschwister von [hc_target.GetShortUIName] anerkannt."
 hc_house_customizer.tt.shared_father:0 "Ihr werdet einen Vater mit [hc_target.GetShortUIName] teilen."
 hc_house_customizer.tt.shared_mother:0 "Ihr werdet eine Mutter mit [hc_target.GetShortUIName] teilen."
 hc_house_customizer.tt.become_distant_relative:0 "Euer Name wird dem Haus [hc_target.GetHouse.GetName] als entfernter Zweig seines Blutes angeschlossen."
 hc_house_customizer.tt.become_bastard:0 "Ihr werdet als Bastardkind von [hc_target.GetShortUIName] anerkannt. Ein zusätzlicher Elternteil wird erzeugt und verzeichnet."
 hc_house_customizer.tt.become_legitimized_bastard:0 "Ihr werdet als legitimiertes Bastardkind von [hc_target.GetShortUIName] anerkannt. Ein zusätzlicher Elternteil wird erzeugt und verzeichnet."
 hc_house_customizer.tt.gain_bastard:0 "Ihr erhaltet die Eigenschaft Bastard."
 hc_house_customizer.tt.gain_legitimized_bastard:0 "Ihr erhaltet die Eigenschaft Legitimierter Bastard."
 hc_house_customizer.tt.lose_house_customizer:0 "Ihr verliert die Eigenschaft Haus-Anpassung."

 hc_house_customizer.0200.t:0 "Das Zeichen des Blutes"
 hc_house_customizer.0200.desc:0 "Der Name eines Hauses lebt nicht nur in Pergamenten und Siegeln. Er verweilt in den Augen, im Haar, in der Haltung und in jenen Zügen, von denen alte Diener schwören, sie bereits auf verblassten Porträts gesehen zu haben. Ihr könnt zulassen, dass Eure Erscheinung als eine des Hauses [hc_target.GetHouse.GetName] erinnert wird, oder das Gesicht behalten, mit dem Ihr bis zu diesem Tag gekommen seid."
 hc_house_customizer.0200.adopt:0 "Mein Blut soll auch ihre Ähnlichkeit tragen."
 hc_house_customizer.0200.adopt_tt:0 "Ihr werdet das vererbbare Aussehen von [hc_target.GetShortUIName] kopieren. Dies kann Haare, Augen, Haut und andere erbliche Merkmale verändern."
 hc_house_customizer.0200.keep:0 "Mein Gesicht soll mein eigenes bleiben."

 hc_house_customizer.ok:0 "So soll es geschrieben stehen."

 hc_house_customizer.0101.t:0 "Kind anerkannt"
 hc_house_customizer.0101.desc:0 "Die Aufzeichnungen wurden berichtigt, die Zeugen unterrichtet und die notwendigen Worte gesprochen. Von diesem Tag an werdet Ihr als Kind von [hc_target.GetShortUIName] und als Mitglied des Hauses [hc_target.GetHouse.GetName] anerkannt."

 hc_house_customizer.0102.t:0 "Geschwister anerkannt"
 hc_house_customizer.0102.desc:0 "Das Blut wird in den Familienchroniken neu geordnet. Von diesem Tag an werdet Ihr zu den Geschwistern von [hc_target.GetShortUIName] gezählt und seid Mitglied des Hauses [hc_target.GetHouse.GetName]."

 hc_house_customizer.0103.t:0 "Bastardabstammung anerkannt"
 hc_house_customizer.0103.desc:0 "Abstammung entsteht nicht immer unter einem rechtmäßigen Dach, doch eine Wahrheit, die vor genügend Ohren ausgesprochen wird, nimmt bald die Gestalt des Gesetzes an. Ihr werdet als Bastardkind von [hc_target.GetShortUIName] anerkannt, mit einem zusätzlichen Elternteil, der verzeichnet wird, um Eure Herkunft zu vervollständigen."

 hc_house_customizer.0104.t:0 "Blut legitimiert"
 hc_house_customizer.0104.desc:0 "Was außerhalb der Ordnung geboren wurde, ist nun ins Herz des Hauses gebracht worden. Ihr werdet als legitimiertes Kind von [hc_target.GetShortUIName] anerkannt, mit einem zusätzlichen Elternteil, der verzeichnet wird, um Eure Herkunft zu vervollständigen."

 hc_house_customizer.0106.t:0 "Ein Zweig wiederhergestellt"
 hc_house_customizer.0106.desc:0 "Jedes große Haus besitzt Zweige, die durch Kriege, ferne Ehen und alte Streitigkeiten verloren gingen. Heute wird ein solcher Zweig erneut anerkannt. Ihr gehört zum Haus [hc_target.GetHouse.GetName]."

 hc_house_customizer.0300.t:0 "Rights of Blood"
 hc_house_customizer.0301.desc:0 "If you are to be recognized as the child of [hc_target.GetShortUIName], the question of inheritance cannot be left untouched. Scribes may also record your claims to the titles held by your new parent."
 hc_house_customizer.0302.desc:0 "As the newly acknowledged sibling of [hc_target.GetShortUIName], you may ask that the family records also preserve your weaker rights to the lands held by your house."
 hc_house_customizer.0304.desc:0 "Legitimization carries more than a name. If your birth is now accepted within the house, you may also request claims to the lands held by [hc_target.GetShortUIName]."
 hc_house_customizer.0306.desc:0 "A distant branch rarely inherits before closer kin, but old blood may still be used to justify a claim. You may ask that lesser rights be recorded in your name."
 hc_house_customizer.0300.claim_pressed:0 "Record my direct inheritance rights."
 hc_house_customizer.0300.claim_unpressed:0 "Record my dynastic rights."
 hc_house_customizer.0300.no_claims:0 "The name is enough."
 hc_house_customizer.0300.claim_pressed_tt:0 "You will gain pressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_unpressed_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_distant_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]. This represents a weaker distant-branch claim."

 hc_open_house_customizer_decision:0 "House Customizer verwenden"
 hc_open_house_customizer_decision_desc:0 "Öffnet das House-Customizer-Menü und legt fest, wie die adelige Abstammung eures eigenen Herrschers gestaltet werden soll."
 hc_open_house_customizer_decision_tooltip:0 "Das House-Customizer-Menü öffnen."
 hc_house_customizer_menu.0001.t:0 "House Customizer"
 hc_house_customizer_menu.0001.desc:0 "Das Blut eines Hauses kann in Aufzeichnungen stehen, von Dienern geflüstert oder aus einem vergessenen Zweig neu entfacht werden. Wählt, wie eure Abstammung Gestalt annehmen soll."
 hc_house_customizer_menu.0001.existing_house:0 "Einem lebenden Haus beitreten."
 hc_house_customizer_menu.0001.existing_house_tt:0 "Um einem lebenden Haus beizutreten, klickt mit der rechten Maustaste auf einen lebenden adeligen Charakter und nutzt die House-Customizer-Interaktion."
 hc_house_customizer_menu.0001.extinct_house:0 "Ein erloschenes Haus wiederbeleben."
 hc_house_customizer_menu.0001.extinct_house_tt:0 "Erloschene Häuser werden über optionale House-Customizer-Module verwaltet. Der Hauptmod enthält keine festen erloschenen Häuser, um die Kompatibilität zu wahren."
 hc_house_customizer_menu.0001.cancel:0 "Ich entscheide später."
 hc_house_customizer_menu.0002.t:0 "Erloschene Häuser"
 hc_house_customizer_menu.0002.desc:0 "Die Kernversion von House Customizer enthält keine feste Liste erloschener Häuser. So bleibt der Mod mit Vanilla, AGOT, LOTR, Elder Kings und anderen Total Conversions kompatibel. Erloschene Häuser sollten über optionale Module für die jeweilige Welt hinzugefügt werden."
 hc_house_customizer_menu.0002.ok:0 "Verstanden."
