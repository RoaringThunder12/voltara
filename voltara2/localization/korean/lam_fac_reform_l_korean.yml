l_korean:
 lam_cr_ballot_title: "파벌회의: 우리의 결의"
 lam_cr_ballot_intro: "[lam_cr_head.GetShortUIName]의 파벌이 중대한 선택을 앞두고 모였다. 각자의 기반과 공헌에 걸맞은 목소리가 이번 결의를 좌우한다."
 lam_cr_ballot_stale: "이 회의는 이미 끝났거나, 참석자의 지위가 달라져 더 이상 표를 던질 수 없다."
 lam_cr_ballot_numbers: "\n\n현재 찬성 영향력: #P [lam_cr_head.MakeScope.Var('lam_cr_yes').GetValue|1]#!\n현재 반대 영향력: #N [lam_cr_head.MakeScope.Var('lam_cr_no').GetValue|1]#!\n전체 의결권: [lam_cr_head.MakeScope.Var('lam_cr_total').GetValue|1]\n나의 발언권: #high [ROOT.Char.MakeScope.Var('lam_cr_weight').GetValue|1]#! ([ROOT.Char.MakeScope.ScriptValue('lam_cr_ballot_share_value')|1]%)\n\n[lam_cr_head.Custom('LamCrThreshold')]\n#weak 발언권은 회의 개시 때 확정된다. 사망·이탈한 참석자는 집계에서 빠진다. 15일 이내에 답하지 않은 표는 기권 처리된다.#!\n[ROOT.Char.Custom2('LamUxBallot', GetPlayer)]"
 lam_cr_vote_yes: "찬성한다."
 lam_cr_vote_no: "반대한다."
 lam_cr_vote_abstain: "기권하겠다."
 lam_cr_vote_request: "나의 공헌을 공식적으로 인정한다면 찬성하겠다."
 lam_cr_vote_binding_tt: "내 발언권이 최종 표결에 반영된다. 가결된 안건만 실행된다."
 lam_cr_abstain_tt: "내 발언권은 전체 의결권에 남지만 찬성이나 반대에 보태지지 않는다."
 lam_cr_request_tt: "수장에게 공식적인 인정을 요구한다. 수장이 위신 75를 쓰고 수락하면 찬성표를 던지며, 2년간 공헌에 따른 영향력 +3을 얻는다. 이번 회의의 발언권은 바뀌지 않는다. 거절되면 다시 투표할 수 있다."
 lam_cr_request_title: "지지의 대가"
 lam_cr_request_desc: "[lam_cr_petitioner.GetShortUIName]은(는) 자신의 공헌을 공식적으로 인정해 준다면 이번 안건을 지지하겠다고 한다."
 lam_cr_request_accept: "그대의 공헌을 모두가 알게 하겠다."
 lam_cr_request_refuse: "그 조건은 받아들일 수 없다."
 lam_cr_request_accept_tt: "위신 75를 소모한다. 상대의 찬성표를 확보하고, 2년간 파벌 내 공헌 영향력 +3을 인정한다."
 lam_cr_close: "알겠다."
 lam_cr_result_title: "파벌회의의 결의"
 lam_cr_result_passed: "충분한 지지를 얻어 안건이 가결되었다. 파벌은 이 결의에 따라 움직인다."
 lam_cr_result_rejected: "안건은 필요한 지지를 얻지 못했다. 제안된 변화는 시행하지 않는다. 금지령에 대한 대응을 거부한 경우에는 반대 방침을 택한다."
 lam_cr_result_cancelled: "지도부나 안건의 조건이 달라져 회의를 취소했다. 이 표결로는 어떠한 결정도 시행하지 않는다."
 lam_cr_result_numbers: "\n\n찬성 [TopScope.GetValue('lam_cr_result_yes')|1] · 반대 [TopScope.GetValue('lam_cr_result_no')|1]\n전체 의결권 [TopScope.GetValue('lam_cr_result_total')|1]\n#weak 표의 무게는 군사력·경제력·신분·궁정 입지·인맥·파벌 공헌을 종합한다. 기권은 전체 의결권에 포함된다.#!"
 lam_cr_result_summary: "[ROOT.Char.Custom('LamCrResult')]\n[lam_cr_head.GetShortUIName]의 파벌이 회의를 마쳤다.\n찬성 [TopScope.GetValue('lam_cr_result_yes')|1] / 반대 [TopScope.GetValue('lam_cr_result_no')|1] / 전체 [TopScope.GetValue('lam_cr_result_total')|1]"
 lam_cr_legacy_closed: "이것은 이전 방식으로 이미 처리된 회의의 기록이다. 현재의 소속이나 수장 지위에는 변화를 주지 않는다."
 lam_cr_contract_cancelled: "거래를 이행할 조건이 사라져 합의를 취소했다"
 lam_cr_threshold_normal: "#high 가결 조건: 전체 의결권의 과반 찬성. 동수이면 부결.#!"
 lam_cr_threshold_major: "#high 가결 조건: 전체 의결권의 3분의 2 이상 찬성.#!"
 lam_cr_issue_court: "\n#high 안건: 궁정당 제안을 받아들일 것인가#!\n가결되면 군주의 공식 지지 파벌이 된다. 같은 지지 관계를 유지하는 동안 다시 표결하지 않는다."
 lam_cr_issue_heir: "\n#high 안건: 왕위 지지 후보를 바꿀 것인가#!\n가결되면 제안된 후보 [lam_vt_new.GetShortUIName]을(를) 파벌의 지지 후보로 삼는다."
 lam_cr_issue_crown: "\n#high 안건: 새 군주에게 맞서 기존 후보를 계속 지지할 것인가#!\n가결되면 반대 노선을 유지한다. 부결되면 기존 후보에 대한 지지를 거두고 새 군주를 관망한다."
 lam_cr_issue_rise: "[lam_cr_head.Custom('LamPbCouncilText')]"
 lam_cr_issue_deal: "\n#high 안건: 군주와의 타협안을 수락할 것인가#!\n가결된 뒤에만 제시된 보상과 파벌의 의무를 이행한다. 부결되면 대가를 지불하지 않고 기존 입장을 유지한다."
 lam_cr_issue_merge: "\n#high 안건: 다른 파벌과 합병할 것인가#!\n가결되면 기존 조직을 정리하고 상대 파벌에 합류한다. 부결되면 독자적인 파벌로 남는다.\n합병 상대: [lam_vt_new.GetShortUIName]의 파벌. 찬성하면 함께 옮겨 가고, 반대하거나 기권하면 무소속으로 남는다."
 lam_cr_issue_confidence: "\n#high 안건: 현 수장을 교체할 것인가#!\n찬성은 수장 교체, 반대는 현 수장 유지를 뜻한다. 현 수장은 자신에 대한 표결에 참여하지 않는다.\n새 수장 후보: [lam_vt_new.GetShortUIName]."
 lam_cr_issue_ban: "\n#high 안건: 금지령에 불복하고 파벌을 유지할 것인가#!\n가결되면 지하로 숨어 조직을 유지한다. 부결되면 금지령에 따라 해산한다."
 lam_cr_issue_dissolve: "\n#high 안건: 금지령에 따라 파벌을 해산할 것인가#!\n3분의 2 이상의 동의로 조직을 해산한다. 부결되면 지하에서 명맥을 잇는다."
 lam_cr_issue_withdraw: "\n#high 안건: 궁정당 지지를 철회할 것인가#!\n가결되면 군주의 공식 지지 파벌 지위를 내려놓고 5년간 다시 궁정당이 되지 않는다."
 lam_cr_issue_loyal: "\n#high 안건: 군주를 지지하는 노선으로 전환할 것인가#!"
 lam_cr_issue_oppose: "\n#high 안건: 군주에게 반대하는 노선으로 전환할 것인가#!"
 lam_cr_issue_arm: "\n#high 안건: 군사적 압박을 준비할 것인가#!\n준비 노선의 의결이다. 실제 거병은 별도의 중대 표결을 거친다."
 lam_cr_issue_watch: "\n#high 안건: 군주와 거리를 두고 관망할 것인가#!"
 lam_cr_issue_quiet: "\n#high 안건: 공개적인 행동을 자제할 것인가#!"
 lam_cr_issue_people: "\n#high 안건: 수장이 정한 노선을 거두고 구성원의 뜻을 따를 것인가#!"
 lam_cr_patronage_title: "궁정의 저울이 기울다"
 lam_cr_patronage_desc: "[lam_pr_lord.GetShortUIName]의 대우가 달라졌다. 궁정의 문이 어느 파벌에 더 넓게 열리는지 모두가 지켜보고 있다. 우리 파벌도 대응을 정해야 한다."
 lam_cr_patronage_obstruct: "경쟁 파벌의 독주를 견제하겠다."
 lam_cr_patronage_coalition: "다른 파벌과 손을 잡겠다."
 lam_cr_patronage_approach: "군주에게 다시 다가갈 길을 찾겠다."
 lam_cr_obstruct_tt: "현재 경쟁 파벌이 제출한 인사·후계·법 청원에 반대한다. 반대 압력은 그 청원에만 적용된다."
 lam_cr_coalition_tt: "궁정에서 밀려난 다른 파벌에 연대를 제안한다. 상대의 동의가 있어야 동맹이 성립한다. 적절한 상대가 없으면 경쟁 파벌 견제로 대응한다."
 lam_cr_approach_tt: "현재 불만에 맞춰 관직이나 지원금을 정식 청원한다. 군주의 동의와 실제 이행이 필요하다."
 lam_cr_approach_title: "냉대를 받은 파벌이 군주에게 재접근한다"
 lam_cr_obstruct_title: "궁정의 후원 경쟁이 파벌 간 대립으로 번졌다"
 lam_cr_coalition_title: "독주를 막기 위한 연대"
 lam_cr_coalition_desc: "[lam_pr_reactor.GetShortUIName]이(가) 손을 내밀었다. 군주의 후원이 한쪽에 쏠리는 동안 서로를 받쳐 줄 동맹을 맺자는 제안이다."
 lam_cr_coalition_accept: "우리도 함께 목소리를 내겠다."
 lam_cr_coalition_decline: "우리의 길은 따로 있다."
 lam_cr_coalition_formed: "후원 경쟁에 밀린 파벌들이 동맹을 맺었다"
 lam_cr_coalition_refused: "연대 제안이 거절되었다"
 lam_cr_competition_opinion: "궁정의 후원을 두고 경쟁함"
 lam_cr_person_name: "[Character.GetFirstNameNoTooltip] · [Character.MakeScope.ScriptValue('lam_cr_influence_value')|0]"
 lam_cr_status_active: "진행 중인 파벌회의: 찬성 [Character.MakeScope.Var('lam_cr_yes').GetValue|0] / 전체 [Character.MakeScope.Var('lam_cr_total').GetValue|0]"
 lam_cr_status_passed: "최근 파벌회의: 가결"
 lam_cr_status_rejected: "최근 파벌회의: 부결"
 lam_cr_status_cancelled: "최근 파벌회의: 취소"
 lam_cr_status_none: "현재 진행 중인 파벌회의 없음"
 lam_cr_split_no_seat: "불복 세력이 분파를 시도했으나 독립할 자리를 확보하지 못했다"
 lam_cr_split_title: "반대파가 갈라져 나가다"
 lam_cr_split_desc: "여러 차례의 충돌 끝에 [lam_cr_split_head.GetShortUIName]이(가) 별도의 파벌을 세웠다. 같은 반대표를 던졌다고 반드시 함께 떠나야 하는 것은 아니다. 어느 쪽에 남을지 정해야 한다."
 lam_cr_split_follow: "새 파벌에 합류하겠다."
 lam_cr_split_stay: "나는 남겠다."
 lam_cr_withdraw_interaction: "궁정당 지지 철회를 상정한다"
 lam_cr_withdraw_interaction_desc: "군주에 대한 공식 지지를 거둘지 파벌회의에서 결정한다."
 lam_cr_ballot_interaction: "진행 중인 파벌회의에 투표한다"
 lam_cr_ballot_interaction_desc: "아직 답하지 않은 표결을 다시 연다. 회의 기한은 연장되지 않는다."
 lam_cr_term_give_seat: "\n군주의 대가: 자문회 자리 약속"
 lam_cr_term_give_marriage: "\n군주의 대가: 혼인 약속"
 lam_cr_term_give_county: "\n군주의 대가: 백작령 양도"
 lam_cr_term_give_gold: "\n군주의 대가: 파벌에 자금 지급"
 lam_cr_term_give_bribe: "\n군주의 대가: 수장에게 뇌물 지급"
 lam_cr_term_give_law: "\n군주의 대가: 통치 권한 완화"
 lam_cr_term_give_heir: "\n군주의 대가: 파벌 후보를 후계자로 지정"
 lam_cr_term_give_amnesty: "\n군주의 대가: 파벌 사면"
 lam_cr_term_ask_oath: "\n파벌의 의무: 충성 서약"
 lam_cr_term_ask_heir: "\n파벌의 의무: 군주의 후계자 지지"
 lam_cr_term_ask_disband: "\n파벌의 의무: 파벌 해산"
 lam_cr_term_ask_counter: "\n파벌의 의무: 경쟁 파벌 견제"
 lam_cr_term_ask_arms: "\n파벌의 의무: 군사 협조"
 lam_cr_term_ask_law_support: "\n파벌의 의무: 법 개정 지지"
 lam_cr_term_ult_oath: "\n군주의 대가: 금화 지급. 파벌의 의무: 향후 5년간 거병하지 않는 서약."
