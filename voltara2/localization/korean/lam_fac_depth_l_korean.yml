 lam_lf_land_petition_interaction_desc: "파벌 내 공적과 기존 보상을 살펴 수혜자를 정하고, 군주가 수여할 수 있는 백작령 하나를 청원합니다. 대상과 영지는 파벌회의에서 확인하며, 표결을 통과해도 군주의 동의가 필요합니다."
