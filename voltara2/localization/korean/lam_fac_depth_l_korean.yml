 lam_st_chronicle_title: "발자취"
 lam_st_chronicle_empty: "#weak 남은 기록이 없다.#!"
 lam_st.0100.t: "같은 깃발 아래의 불화"
 lam_st.0100.desc: "[ROOT.Char.MakeScope.Var('lam_st_reconcile_member').Char.GetTitledFirstName]의 반대가 거듭되고 있다. 아직 우리와 결별하지는 않았지만, 회의가 끝난 뒤에도 불만을 감추지 않는다.\n\n그간의 공로를 공개적으로 인정한다면, 내 체면을 조금 내주고 관계를 추스를 여지는 있다."
 lam_st.0100.a: "그대의 공로를 잊지 않았소."
 lam_st.0100.a.tt: "위신 150을 들여 공로를 인정합니다. 해당 인물과의 불화가 다소 누그러지고 파벌 내 공적이 높아집니다. 이미 내린 결정은 유지됩니다."
 lam_st.0100.b: "결정은 내려졌소."
 lam_st_public_turn: "궁정의 새 움직임"
 lam_st_public_rise: "[lam_cr_head.GetTitledFirstName]의 파벌이 군주에 맞서는 봉기를 결의했습니다."
 lam_st_public_loyal: "[lam_cr_head.GetTitledFirstName]의 파벌이 왕실을 지지하기로 뜻을 모았습니다."
 lam_st_public_withdraw: "[lam_cr_head.GetTitledFirstName]의 파벌이 궁정당에서 물러나기로 결의했습니다."
 lam_st_public_dissolve: "[lam_cr_head.GetTitledFirstName]의 파벌이 해산을 결의했습니다."
 lam_st_vote_passed: "[lam_cr_head.GetTitledFirstName]의 파벌회의에서 안건이 가결되었습니다.\n찬성 [TopScope.GetValue('lam_cr_result_yes')|0] · 반대 [TopScope.GetValue('lam_cr_result_no')|0] · 전체 [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_rejected: "[lam_cr_head.GetTitledFirstName]의 파벌회의에서 안건이 부결되었습니다.\n찬성 [TopScope.GetValue('lam_cr_result_yes')|0] · 반대 [TopScope.GetValue('lam_cr_result_no')|0] · 전체 [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_cancelled: "[lam_cr_head.GetTitledFirstName]의 파벌회의에서 정세가 달라져 회의가 취소되었습니다.\n찬성 [TopScope.GetValue('lam_cr_result_yes')|0] · 반대 [TopScope.GetValue('lam_cr_result_no')|0] · 전체 [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_lf.0100.a.tt: "2년 동안 관직 추천을 우선합니다. 분열 위기가 6개월 유예됩니다. 실제 임명에 성공하면 타협이 완성되며, 임명이 가능한데도 기한을 넘기면 불화가 깊어집니다. 군주의 임명을 보장하는 약속은 아닙니다."
 lam_lf.0100.a: "다음 관직은 그대를 위해 청원하겠소."
 lam_lf.0100.b.tt: "위신 150을 지출합니다. 반대파 당원들의 불화가 한 단계 누그러지고 결속이 5 높아집니다. 이미 내린 결정은 바뀌지 않습니다."
 lam_lf.0100.b: "동료들의 공로를 공공연히 치하하겠소."
 lam_lf.0100.c: "양보할 생각은 없소."
 lam_lf.0100.desc: "[ROOT.Char.MakeScope.Var('lam_lf_caucus_rep').Char.GetTitledFirstName] 주변에 불만을 품은 동료들이 모였다. 한 번의 말다툼으로 끝날 일이 아니다. 같은 안건을 둘러싼 반대가 거듭되면서, 이들은 이제 함께 움직이고 있다.\n\n그들의 몫을 인정할 것인가, 내 권위를 지킬 것인가?"
 lam_lf.0100.t: "하나의 목소리가 된 반대"
 lam_lf.0300.a: "[lam_lf_succ_a.GetTitledFirstName]를 지지한다."
 lam_lf.0300.b: "[lam_lf_succ_b.GetTitledFirstName]를 지지한다."
 lam_lf.0300.c: "아직 누구의 편에도 서지 않겠다."
 lam_lf.0300.desc: "수장이 물러난 뒤의 일을 두고 동료들 사이에 두 이름이 오르내린다. [lam_lf_succ_a.GetTitledFirstName]와 [lam_lf_succ_b.GetTitledFirstName].\n\n아직 지도권을 넘길 때는 아니지만, 지금의 지지는 그날의 향방을 가를 수 있다."
 lam_lf.0300.t: "이 깃발의 다음 주인"
 lam_lf.0300.tt: "향후 3년 안에 지도권이 넘어가고 이 인물이 최종 후보로 남아 있다면, 나의 파벌 내 영향력이 그 지지에 반영됩니다. 사망·이탈 등으로 자격을 잃으면 효력이 없습니다."
