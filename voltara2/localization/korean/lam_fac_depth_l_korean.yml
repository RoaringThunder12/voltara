 lam_ux_report_partial: "\n\n#high 내부의 동향 · [Character.MakeScope.Var('lam_ux_report_year').GetValue|0]년, [Character.MakeScope.ScriptValue('lam_ux_report_age_value')|0]개월 전#!\n[Character.MakeScope.Var('lam_ux_report_source').Char.GetTitledFirstName]에게서 얻은 정보에 따르면, 이 파벌은 [Character.Custom('LamUxObservedPartial')].\n#weak 당시의 보고입니다. 이후 방침이 바뀌었을 수 있으며, 실행 시점이나 성공을 보장하지 않습니다.#!"
 lam_ux_report_rumor: "\n\n#high 내부의 소문 · [Character.MakeScope.Var('lam_ux_report_year').GetValue|0]년, [Character.MakeScope.ScriptValue('lam_ux_report_age_value')|0]개월 전#!\n[Character.MakeScope.Var('lam_ux_report_source').Char.GetTitledFirstName]에게서 동료들이 무언가를 의논하고 있다는 말을 들었습니다. 구체적인 목적은 확인되지 않았습니다."
 lam_ux_report_unknown: "\n\n#weak 준비 중인 계획에 관한 새 보고가 없습니다. 아무 일도 없다는 뜻은 아닙니다. 내부 인맥과 실제 제보가 필요하며, 계책만으로 비공개 방침을 알 수는 없습니다.#!"
