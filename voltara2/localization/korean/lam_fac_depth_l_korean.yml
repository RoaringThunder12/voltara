 lam_pd_kind_campaign: "영토 회복 원정"
 lam_pd_kind_none: "종료된 요구"
 lam_pd_petition_title: "위임을 받은 청원"
 lam_pd_petition_desc: "[lam_pd_head.GetTitledFirstName]의 파벌이 [lam_pd_head.Custom('LamPdRequest')]을 요구한다.\n\n금전 조건: [lam_pd_head.MakeScope.Var('lam_pd_gold').GetValue|0]금화. 금전 대안을 제시하면 파벌이 다시 표결한다. 대상이나 비용 조건이 바뀌면 집행할 수 없다. 답변 기한은 60일이다."
 lam_pd_accept: "요구를 이행하겠다."
 lam_pd_counter: "대신 금전 보상을 제안하겠다."
 lam_pd_defer: "한 달 뒤 다시 논의하자."
 lam_pd_refuse: "이 요구는 받아들일 수 없다."
 lam_pd_submit_desc: "중대한 요구는 먼저 파벌의 위임을 구한다. 가결되어도 군주의 동의와 실제 이행이 필요하다. 금전 지원은 수장의 위임 범위에서 청원한다."
 lam_pd_ballot_desc: "청원 안건: [lam_cr_head.Custom('LamPdRequest')]. 가결은 요구를 전달할 권한을 부여한다. 실제 이행은 군주의 답변과 현재 조건에 달려 있다."
 lam_pd_result_title: "청원의 귀결"
 lam_pd_result_desc: "[lam_pd_head.GetTitledFirstName]의 청원: [lam_pd_head.Custom('LamPdResult')]."
 lam_pd_kept: "이행됨"
 lam_pd_refused: "거절됨"
 lam_pd_void: "조건 변경 또는 기한 만료로 종료"
 lam_pd_old_request: "그 청원은 때를 놓쳤다. 파벌은 다음에 다시 뜻을 모아 청할 것이다."
 lam_pd_recruit_title: "새로운 동료가 될 것인가"
 lam_pd_recruit_desc: "[lam_rc_head.GetTitledFirstName]이 합류의 대가로 [ROOT.Char.MakeScope.Var('lam_pd_recruit_price').GetValue|0]금화를 제안했다. 수락하면 금이 실제 지급되고 소속이 바뀐다. 기존 동료와의 관계도 감수해야 한다. 접촉 시작 후 100일까지 답하지 않으면 거절로 끝난다."
 lam_pd_recruit_join: "조건을 받아들이고 합류한다."
 lam_pd_recruit_decline: "지금의 길을 지키겠다."
 lam_pd_retain_title: "동료를 붙잡을 대가"
 lam_pd_retain_desc: "[lam_pd_recruit_person.GetTitledFirstName]이 다른 파벌의 제안을 받았다. [lam_pd_recruit_person.MakeScope.Var('lam_pd_recruit_price').GetValue|0]금화를 실제 지급하면 현재의 협력을 한 해 동안 붙잡을 수 있다. 제안이 아직 진행 중일 때만 유효하다."
 lam_pd_retain_pay: "지원금을 지급하고 붙잡는다."
 lam_pd_retain_leave: "스스로 결정하게 두자."
 lam_pd_recruit_success: "협상을 마친 새 동료"
 lam_pd_pact_title: "목적을 정한 연대"
 lam_pd_pact_desc: "공통 후계 후보, 관직 배분, 왕권 완화, 탄압에 맞선 공동 방어 중 함께 추구하는 목적에 한해 협력한다. 협약은 두 해 또는 목적 달성까지 유효하다. 인사·후계·법 협약은 봉기 병력을 제공하지 않는다."
 lam_pd_pact_possible_tt: "서로 비어 있는 연대 자리와 함께 추구하는 구체적 목적이 필요함"
 lam_pd_information_tt: "군주가 모르는 실제 비밀, 또는 직접 참여 중인 비공개 중대 회의의 새 정보가 필요함"
 lam_pd_information_title: "근거를 갖춘 내부 보고"
 lam_pd_information_desc: "제보자가 알고 있던 비밀 또는 아직 진행 중인 내부 방침이 전달되었다. 보고만으로 구실이나 처벌 권리가 생기지는 않는다. 같은 회의는 다시 보상하지 않는다."
 lam_pd_fabricate_interaction: "정치적 소문 날조"
 lam_pd_fabricate_interaction_desc: "위신 100을 써서 석 달 동안 소문을 꾸민다. 계책이 대상보다 6 이상 높아야 검증을 피한다. 성공해도 여섯 달의 의심만 남으며 범죄 증거나 구실이 되지 않는다. 발각되면 위신 150과 신뢰를 잃는다."
 lam_pd_rumor_title: "아직 입증되지 않은 소문"
 lam_pd_rumor_desc: "이 파벌에 관한 소문이 돌지만 확인된 증거는 없다. 잠시 협상이 어려워질 수 있으나 처벌의 근거로 삼을 수는 없다."
 lam_pd_forgery_exposed: "날조가 드러나다"
 lam_pd_false_report_opinion: "거짓 보고가 드러남"
 lam_pd_wait: "당분간 흐름을 지켜보자."
 lam_pd_obstruct_title: "진행 중인 청원에 반대가 모이다"
 lam_pd_story_contact: "조건을 알아보도록 하자."
 lam_pd_story_contact_desc: "새 파벌과 접촉할 기회가 생겼다. 실제 지원 조건과 기존 소속의 반응을 살핀 뒤 합류 여부를 결정한다."
 lam_pd_story_gold: "지원금을 정식으로 청원하자."
 lam_pd_public_information: "공개적인 협력 논의만으로 죄를 물을 수는 없다."
 lam_pd_promised: "약속 체결 — 실제 이행을 기다리는 중"
