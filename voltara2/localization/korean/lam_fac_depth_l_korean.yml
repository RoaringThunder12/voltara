 lam_ux_report_exact: "\n\n#high 내부 보고 · [Character.MakeScope.Var('lam_ux_report_year').GetValue|0]년, [Character.MakeScope.ScriptValue('lam_ux_report_age_value')|0]개월 전#!\n[Character.MakeScope.Var('lam_ux_report_source').Char.GetTitledFirstName]에게서 얻은 정보에 따르면, 이 파벌은 [Character.Custom('LamUxObservedExact')].\n#weak 당시의 보고입니다. 이후 방침이 바뀌었을 수 있으며, 실행 시점이나 성공을 보장하지 않습니다.#!"
