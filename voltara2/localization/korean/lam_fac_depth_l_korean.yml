 lam_lf_exchange_interaction: "후계 지지와 관직을 교섭"
 lam_lf_exchange_interaction_desc: "상대 파벌이 내가 지지하는 후계자의 지정에 힘을 보태는 대신, 후계자가 지정되면 2년 안에 상대 수장의 관직을 청원하기로 약속합니다. 지위·자격이 유지되는데 약속을 어기면 불신이 남습니다."
 lam_lf_exchange_notice: "후계 지지를 관직 추천과 맞바꾸는 맹약을 맺었습니다. 후계자 지정은 3년 안에, 그 뒤 약속한 인물의 임명은 2년 안에 이루어져야 합니다. 전쟁에 병력을 제공하는 맹약은 아닙니다."
