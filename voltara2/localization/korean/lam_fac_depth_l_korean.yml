 lam_ux_ballot_detail: "\n\n#high 진행 중인 회의의 발언권: [Character.MakeScope.Var('lam_cr_weight').GetValue|1]#!\n개회 당시 영향력 [Character.MakeScope.Var('lam_ux_ballot_base').GetValue|1] + 안건 가중치 [Character.MakeScope.Var('lam_ux_ballot_bonus').GetValue|1]\n[Character.Custom('LamUxBallotReason')]\n#weak 개회 때 확정된 값입니다. 이후의 능력·직위 변화는 이번 표의 무게를 바꾸지 않습니다. 찬반 성향과는 별개입니다.#!"
