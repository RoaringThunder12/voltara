l_korean:
 lam_pol_held_weak: "#N 실권 기반이 흔들리고 있다.#! 정치 비중·결속·요직 부족이 6개월 이상 지속되면 실권을 잃는다."
 lam_pol_held_yes: "#P 현재 군주 뒤에서 국정을 좌우하고 있다.#! 정치적 기반과 요직을 지켜야 한다."
 lam_pol_take_invalid: "국정 장악에 필요한 기반이나 유지 기간을 충족하지 못했다"
 lam_pol_office_grudge_title: "요직에서 밀려난 파벌의 불만"
 lam_pol_office_grudge_desc: "[lam_pol_aggrieved.GetShortUIName]의 파벌은 상당한 정치적 기반에도 1년 동안 자문회에 자리를 얻지 못했다. 다른 파벌은 여러 요직을 차지하고 있다. 호의 -5, 결속 +2. 요직을 배분하면 배제 기간의 누적이 멈춘다."
 lam_pol_next_vote: "파벌회의에서 방침을 결정하는 중"
 lam_pol_next_contract: "가결된 거래의 이행을 기다리는 중"
 lam_pol_next_alliance: "다른 파벌의 연대 답변을 기다리는 중"
 lam_pol_next_rival: "후원받는 경쟁 파벌의 독주를 견제하는 중"
 lam_pol_next_office: "정치적 비중에 맞는 자문회 자리를 요구할 기반을 다지는 중"
 lam_pol_empty_peers: "정치적 기반을 만들 직속 봉신이 없다."
 lam_pol_empty_banned: "파벌 금지령 아래다. 지하 조직은 정보를 확보하기 전까지 보이지 않을 수 있다."
 lam_pol_empty_cooldown: "새 파벌이 자리를 잡는 동안 다른 자연 창설은 잠시 대기한다."
 lam_pol_empty_preparing: "파벌을 세우려는 인물들이 동조자를 모으고 있다."
 lam_pol_empty_general: "조직된 파벌이 없는 정국이다. 작은 궁정이나 이해 충돌이 적은 통치에서는 무소속으로도 충분히 활동할 수 있다. 권력 승계·폭정·불만·관직 배제와 개인의 야심이 결집을 부른다."
 lam_pol_ready_yes: "#P 국정 장악을 시도할 기반과 유지 기간을 갖췄다.#!"
 lam_pol_ready_wait: "모든 요건을 계속 유지할 기간: 약 [Character.MakeScope.ScriptValue('lam_pol_hold_left_value')|0]개월 남음"
 lam_pol_ready_no: "빠진 기반을 먼저 갖춰야 장악 준비 기간이 시작된다."
