 lam_found_faction_decision: "파벌을 세운다"
 lam_found_faction_decision_desc: "뜻을 같이할 사람들을 모아 파벌을 세운다. 주군의 궁정이라면 내가 직접 이끌 수도 있고, 다른 봉신에게 맡길 수도 있다. 내 궁정이라면 봉신 가운데 하나에게 맡긴다. 군주가 제 궁정의 파벌을 직접 이끌 수는 없다. 맡기려는 사람은 거절할 수 있다."
