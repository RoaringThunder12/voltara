 lam_fac_wing_moderate: "온건 "
 lam_fac_council_split_title: "[lam_vt_lead.GetShortUIName](이)가 회의에서 갈라져 나와 새 파벌을 세웠다"
 lam_gn_sr_heir: "후계자 지지 갈등"
 lam_gn_sr_crown: "새 군주를 두고 갈라짐"
 lam_gn_sr_rise: "봉기를 두고 갈라짐"
 lam_gn_sr_deal: "주군과의 타협을 두고 갈라짐"
 lam_gn_sr_ambition: "야심가가 떨어져 나감"
 lam_gn_end_collapsed: "#N 결속이 무너져 해산#!"
 lam_gn_es_collapsed: "결속 붕괴"
 lam_faction.1900.t: "파벌 회의"
 lam_faction.1900.q_heir: "[lam_vt_head.GetShortUIName](이)가 우리 파벌이 밀 후계자를 바꾸겠다고 했다. 옛 후보를 따르던 사람들이 들고일어나 회의가 열렸다. "
 lam_faction.1900.q_crown: "왕관이 우리 후보를 비껴갔다. 끝까지 우리 후보를 밀 것인가, 새 군주와 화해할 것인가를 두고 회의가 열렸다. "
 lam_faction.1900.q_rise: "[lam_vt_head.GetShortUIName](이)가 군사를 일으키자고 했다. 칼을 뽑을 것인가를 두고 회의가 열렸다. "
 lam_faction.1900.q_deal: "[lam_vt_head.GetShortUIName](이)가 주군의 제안을 받아들였다. 그 타협을 두고 회의가 열렸다. "
 lam_faction.1900.split: "\n\n표가 팽팽하게 갈렸고, 끝내 화해하지 못했다. [lam_vt_lead.GetShortUIName](이)가 반대한 사람들을 이끌고 회의장을 나가 새 파벌을 세웠다. 나는 어느 쪽에 설 것인가."
 lam_faction.1900.held: "\n\n반대도 적지 않았지만, 결국 수장의 뜻대로 정해졌다. 파벌은 하나로 남는다. 나는 이 결정을 따를 것인가."
 lam_faction.1900.stay: "[lam_vt_head.GetShortUIName] 곁에 남는다"
 lam_faction.1900.follow: "[lam_vt_lead.GetShortUIName]의 새 파벌로 간다"
 lam_faction.1900.accept: "결정을 따른다"
 lam_faction.1900.leave: "이런 결정에는 따를 수 없다. 파벌을 떠난다"
 lam_faction.1910.t: "파벌 회의"
 lam_faction.1910.q_heir: "우리 파벌이 밀 후계자를 바꾸자고 하자, 옛 후보를 따르던 사람들이 회의를 요구했다. "
 lam_faction.1910.q_crown: "왕관이 우리 후보를 비껴가자, 새 군주와 화해하자는 목소리가 나와 회의가 열렸다. "
 lam_faction.1910.q_rise: "군사를 일으키자고 하자, 칼을 뽑을 것인가를 두고 회의가 열렸다. "
 lam_faction.1910.q_deal: "주군의 제안을 받아들이자, 그 타협을 두고 회의가 열렸다. "
 lam_faction.1910.split: "\n\n표가 팽팽하게 갈렸다. [lam_vt_lead.GetShortUIName](이)가 반대한 사람들을 이끌고 회의장을 나갔다. 이제 그들은 따로 파벌을 세웠다."
 lam_faction.1910.held: "\n\n반대도 있었지만 내 뜻대로 정해졌다. 파벌은 하나로 남았다. 다만 결속은 조금 흔들렸다."
 lam_faction.1910.letgo: "갈 사람은 보내 준다"
 lam_faction.1910.brand: "배신자로 기억하겠다"
 lam_faction.1910.ok: "좋다"
 lam_faction.1900.q_ban: "칙령이 떨어졌는데 [lam_vt_head.GetShortUIName](이)가 지하로 숨겠다고 했다. 왕명을 따르자는 사람들이 회의를 요구했다. "
 lam_faction.1900.q_merge: "우리 파벌을 [lam_vt_new.GetShortUIName]의 파벌에 합치자는 말이 나왔다. 독립을 지키자는 사람들이 회의를 요구했다. "
 lam_faction.1900.q_court: "우리 파벌이 주군의 궁정당으로 지명되었다. 왕권에 붙을 수 없다는 사람들이 회의를 요구했다. "
 lam_faction.1900.q_confidence: "[lam_vt_head.GetShortUIName]의 지도력을 더는 믿을 수 없다는 목소리가 커져 불신임 회의가 열렸다. "
 lam_faction.1900.deposed: "\n\n불신임이 과반을 넘었다. [lam_vt_head.GetShortUIName](은)는 수장 자리에서 물러나고 [lam_vt_lead.GetShortUIName](이)가 새 수장이 되었다. 파벌은 하나로 남는다."
 lam_faction.1910.q_ban: "칙령에 맞서 지하로 숨겠다고 하자, 왕명을 따르자는 사람들이 회의를 요구했다. "
 lam_faction.1910.q_merge: "우리 파벌을 [lam_vt_new.GetShortUIName]의 파벌에 합치려 하자, 독립을 지키자는 사람들이 회의를 요구했다. "
 lam_faction.1910.q_court: "우리 파벌이 궁정당으로 지명되자, 왕권에 붙을 수 없다는 사람들이 회의를 요구했다. "
 lam_faction.1910.q_confidence: "내 지도력을 더는 믿을 수 없다는 목소리가 커져 불신임 회의가 열렸다. "
 lam_faction.1910.deposed: "\n\n불신임이 과반을 넘었다. 나는 수장 자리에서 물러나고 [lam_vt_lead.GetShortUIName](이)가 새 수장이 되었다. 나는 이제 이 파벌의 한 사람일 뿐이다."
 lam_faction.1910.stepdown: "물러난다"
