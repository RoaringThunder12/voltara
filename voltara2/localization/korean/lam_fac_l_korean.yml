 lam_faction.0800.spurned: "\n· 자기 후보가 왕관을 받지 못해 등을 돌린 파벌: [ROOT.Char.MakeScope.Var('lam_dig_spurned').GetValue|0] (가장 최근: [ROOT.Char.MakeScope.Var('lam_dig_spurned_who').Char.GetShortUIName]의 파벌)"
 lam_faction.0800.crown: "\n\n지금 왕권의 세기: [ROOT.Char.MakeScope.Var('lam_crown').GetValue|0] / 100"
 lam_faction.0800.a: "알겠다"
 lam_fac_card_heir_lawful: "#weak 미는 후계:#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #P (정식 후계자)#!"
 lam_fac_card_heir_other: "#weak 미는 후계:#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #N (다른 후보)#!"
 lam_fac_card_heir_tt: "이 파벌이 속으로 다음 군주로 바라는 사람. 수장의 호감, 자기 집안의 피(외척), 혼인, 신앙과 문화, 나이, 그리고 파벌의 노선이 원하는 자질로 고른다. 정식 후계자가 아닌 사람을 밀면 기세가 오르고, 같은 사람을 밀지 않는 파벌끼리는 적이 된다. 군주가 죽었을 때 자기 후보가 왕관을 받지 못하면 등을 돌리고, 그 후보에게 명분이 있으면 주장자를 옹립하는 전쟁으로 번질 수 있다."
 lam_fac_badge_promise: "#P 약속을 받음#!"
 lam_fac_defiance_title: "[lam_abs_lead.GetShortUIName]의 파벌이 항명했다. 반란의 명분은 내세우지 못했지만, 주군에게 바칠 징집병과 세금을 줄이고 있다. 얼마나 줄이느냐는 파벌의 세력에 달렸다"
 lam_fac_defiance_modifier: "봉신들의 항명"
 lam_fac_defiance_modifier_desc: "세력이 큰 파벌(봉신 세력의 35% 이상)이 항명해, 주군에게 바칠 징집병과 세금을 크게 줄이고 있다."
 lam_fac_empty: ""
 lam_fac_liar_tt: "두 번이나 약속을 어겼다. 지금은 아무도 내 약속을 믿지 않는다"
 lam_found_faction_decision_flow_tt: "어느 궁정에서, 누구를 수장으로 세울지 고른다. 부탁받은 사람은 나와의 관계, 성격, 왕권을 대하는 마음에 따라 받아들이거나 거절한다."
 lam_found_faction_cd_tt: "최근에 파벌을 세우려 했다 (2년)"
 lam_faction.0290.t: "어느 궁정에서"
 lam_faction.0290.desc: "나는 누군가의 봉신이면서, 내 아래에도 봉신을 거느리고 있다. 파벌을 어디에 세울 것인가?"
 lam_faction.0290.a: "주군의 궁정에 — 동료 봉신들 사이에"
 lam_faction.0290.b: "내 궁정에 — 내 봉신들 사이에"
 lam_faction.0300.peer: "파벌에는 얼굴이 필요하다. 사람들이 이름을 듣고 모여들 만한 얼굴이. 내가 직접 나설 수도 있고, 더 어울리는 사람에게 맡길 수도 있다. 다만 그 사람이 받아들일지는 모른다."
 lam_faction.0300.own: "내 궁정에 내 사람들의 파벌을 세운다. 다만 내가 수장이 될 수는 없다. 군주가 이끄는 순간 그건 파벌이 아니라 왕권이다. 봉신 가운데 하나에게 맡겨야 한다. 내가 부탁하면 거절하기 어렵겠지만, 그래도 거절할 수는 있다."
 lam_faction.0300.me: "내가 직접 이끈다"
 lam_faction.0300.me_tt: "내가 이 파벌의 수장이 된다. 처음 1년은 혼자여도 흩어지지 않는다."
 lam_faction.0300.acc1: "받아들일 가능성: #V [lam_ff_c1.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc2: "받아들일 가능성: #V [lam_ff_c2.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc3: "받아들일 가능성: #V [lam_ff_c3.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_ff_accepted_title: "[lam_fac_new.GetShortUIName](이)가 파벌을 맡기로 했다"
 lam_ff_refused_title: "[lam_ff_no.GetShortUIName](은)는 파벌을 맡기를 거절했다"
 lam_fac_stage_9: "#weak 지하 — 금지된 파벌, 숨어서 때를 기다린다#!"
 lam_fac_ban_decision: "파벌을 금한다"
 lam_fac_ban_decision_desc: "궁정의 파벌들이 왕권을 갉아먹고 있다. 이제 이들이 무리 짓는 것 자체를 금하려 한다. 위신과 금화가 크게 들고, 모든 봉신이 이 칙령을 못마땅해한다. 금지령이 서 있는 동안은 밀정을 부리는 비용(위신 -0.5/월, 직할 세금 -5%)이 계속 든다. 그 대신 파벌은 원칙적으로 불법이 된다. 겁 많은 자들은 떠나고, 골수만 어둠 속에 남는다. 지하에 남은 파벌은 몰래 모이고, 비방문을 돌리고, 관직을 이용해 금화를 빼돌리다가, 결속이 굳으면 끝내 들고일어난다. 움직일 때마다 정체가 드러날 수 있다. 지하에 남은 수장과 핵심은 범죄의 비밀을 안게 된다. 첩보로 캐내면 투옥할 명분이나 상대를 옭아맬 구실이 된다."
 lam_fac_ban_decision_tooltip: "파벌을 금한다"
 lam_fac_ban_need_foe_tt: "나에게 불만을 품은 파벌이 있다"
 lam_fac_ban_power_tt: "내 군사력이 불만을 품은 파벌들의 힘을 모두 합친 것보다 크다"
 lam_fac_ban_decision_effect_tt: "모든 파벌을 금하거나, 왕당만 남기고 금한다."
 lam_faction.0900.t: "파벌 금지령"
 lam_faction.0900.desc: "칙령이 낭독되자 대전에 침묵이 내려앉았다. 오늘부터 군주의 허락 없이 무리를 짓는 것은 반역이다. 몇몇은 고개를 숙였고, 몇몇은 서로의 눈을 피했다. 그리고 몇몇은 아무 표정도 짓지 않았다. 바로 그런 자들을 조심해야 한다."
 lam_faction.0900.a: "모든 파벌을 금한다"
 lam_faction.0900.a_tt: "모든 파벌이 불법이 된다. 모든 봉신이 칙령에 반감을 품는다 (−20, 5년). 각 파벌의 수장은 조용히 해산할지, 지하로 숨을지 정한다. 왕권과 공포가 클수록 해산하는 쪽이 늘고, 왕권이 약하면(35 미만) 대부분 숨는다. 해산한 파벌은 유산을 남기고 사라진다. 지하로 간 파벌은 동조자와 협력자가 떠나고 핵심만 남는다. 숨어 있는 동안 세력은 절반만 쓸 수 있다(봉기하려면 세력 20%). 그 수장과 핵심은 '금지된 파벌' 범죄 비밀을 안게 되고, 비밀을 캐내면 투옥 명분이 된다. 숨은 파벌의 수장을 잡아 가두면 그 파벌은 소탕되고, 군주는 위신과 공포를 얻는다. 금지령 아래에서는 파벌을 지하에서만 세울 수 있다. 지하 파벌은 밀정이 캐낸 만큼만 보인다. 금지령이 서 있는 동안 해산하지 않은 파벌은 모두 지하에 있다. 봉기해야 비로소 정체가 다 드러난다."
 lam_faction.0900.b: "왕당만 남기고 금한다"
 lam_faction.0900.b_tt: "왕당(궁정당)만 공식적으로 남고, 나머지는 위와 같이 불법이 된다. 모든 봉신의 반감도 같다. 왕당이 없다면 가장 충성스러운 파벌이 왕당이 된다."
 lam_faction.0900.c: "아직은 아니다"
 lam_fac_unban_decision: "파벌 금지령을 거둔다"
 lam_fac_unban_decision_desc: "금지령을 거둔다. 숨어 있던 파벌들이 다시 얼굴을 드러낼 것이다. 1년 동안 궁정이 술렁인다."
 lam_fac_unban_decision_tooltip: "파벌 금지령을 거둔다"
 lam_fac_banned_opinion: "파벌을 금했다"
 lam_fac_outlaw_modifier: "금지된 파벌의 일원"
 lam_fac_outlaw_modifier_desc: "금지된 파벌에 속해 있다. 감시받고, 밀려나고, 수군거림을 듣는다."
 trait_lam_fac_member: "파벌원"
 trait_lam_fac_member_lead: "[ROOT.Char.Custom('LamFacName')]의 수장"
 trait_lam_fac_member_0: "[ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamFacName')]"
 trait_lam_fac_member_1: "[ROOT.Char.MakeScope.Var('lam_bloc').Char.GetHouse.GetNameNoTooltip] 가문파"
 trait_lam_fac_member_2: "흑파"
 trait_lam_fac_member_3: "백파"
 trait_lam_fac_member_4: "청파"
 trait_lam_fac_member_5: "적파"
 trait_lam_fac_member_desc: "궁정의 한 파벌에 속해 있다."
 trait_lam_fac_member_desc_lead: "이 파벌의 수장이다."
 trait_lam_fac_member_desc_core: "파벌의 핵심이다. 핏줄이나 우정, 혹은 깊은 뜻으로 묶여 있다."
 trait_lam_fac_member_desc_client: "파벌의 협력자다. 이해관계로 붙어 있다."
 trait_lam_fac_member_desc_sym: "파벌에 동조할 뿐이다. 바람이 바뀌면 떠날 수 있다."
 lam_found_faction_no_war_tt: "주군과 전쟁 중이 아니다"
 lam_found_faction_followers_tt: "파벌을 세울 수 있는 궁정이 있다 (내 궁정이라면 수장을 맡아 줄 봉신이 둘은 있어야 하고, 주군의 궁정이라면 혼자서도 세울 수 있다. 금지령이 내린 궁정에서는 지하 파벌로만)"
 lam_fac_ban_line: "#N [Character.Custom('LamFacBan')]#!"
 lam_fac_ban_line_tt: "파벌 금지령이 내려져 있다. 금지된 파벌의 수장은 해산하거나 지하로 숨었다. 왕권과 공포가 클수록 순순히 흩어지고, 약한 왕의 금지령은 비웃음을 산다. 숨어 있는 지하 파벌은 세력을 절반만 쓸 수 있어서(봉기하려면 세력 20%), 청원도 충돌도 하지 못하고, 그 일원은 위신을 잃는다. 숨은 파벌의 수장을 잡아 가두면 그 파벌은 소탕되어 무너지고, 다른 지하 파벌도 겁을 먹으며, 군주는 위신과 공포를 얻는다. 새 파벌은 지하에서만 생긴다. 지하 파벌은 밀정이 캐낸 만큼만 이 창에 보인다('지하 조직을 캔다' 결단). 금지령이 서 있는 동안 해산하지 않은 파벌은 모두 지하에 있다. 봉기해야 비로소 정체가 다 드러난다. 군주가 바뀌거나 결단으로 거두면 끝나고, 끝까지 버틴 지하 파벌은 '박해를 견딘 파벌'로 돌아온다."
 lam_fac_ban_all: "파벌 금지령 (모든 파벌)"
 lam_fac_ban_crown: "파벌 금지령 (왕당만 허용)"
 lam_fac_ban_decision_confirm: "금지령을 내린다"
 lam_fac_unban_decision_confirm: "금지령을 거둔다"
 lam_secret_outlaw_faction: "금지된 파벌"
 lam_secret_outlaw_faction_desc: "금지령을 어기고 지하 파벌을 이끌거나 그 핵심으로 남아 있다"
 lam_secret_outlaw_found_title: "[secret_owner.GetShortUIName](이)가 금지된 파벌에 몸담고 있다는 사실을 알아냈다"
 lam_fac_edict_opinion: "파벌 금지령"
 lam_fac_bar_cohesion: "결속"
 lam_fac_age_0: "신생 파벌"
 lam_fac_age_1: "자리 잡은 파벌"
 lam_fac_age_2: "오랜 파벌"
 lam_fac_age_3: "명문 파벌"
 lam_fac_hist_tt: "#T 연혁#!\n[Character.MakeScope.Var('lam_fac_founded').GetValue|0]년 창립, [Character.MakeScope.Var('lam_fac_age').GetValue|0]년째 · #high [Character.Custom('LamFacAgeTier')]#!\n창립자: [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · 지금 수장은 [Character.MakeScope.Var('lam_fac_gen').GetValue|0]대째[Character.Custom('LamFacCofLine')]\n\n봉기 [Character.MakeScope.Var('lam_fac_h_rise').GetValue|0] · 숙청을 견딤 [Character.MakeScope.Var('lam_fac_h_purge').GetValue|0] · 밀던 후보의 즉위 [Character.MakeScope.Var('lam_fac_h_crown').GetValue|0]\n지켜진 약속 [Character.MakeScope.Var('lam_fac_h_kept').GetValue|0] · 배신당함 [Character.MakeScope.Var('lam_fac_h_betray').GetValue|0] · 충돌 승/패 [Character.MakeScope.Var('lam_fac_h_won').GetValue|0]/[Character.MakeScope.Var('lam_fac_h_lost').GetValue|0] · 주군과의 거래 [Character.MakeScope.Var('lam_fac_h_deals').GetValue|0]\n\n#weak 오래된 파벌일수록 사람을 끌고, 결속이 단단하며, 약해져도 쉽게 흩어지지 않는다(15년부터는 소수로라도 명맥을 잇는다). 오랜 이름값은 남지만, 뜻을 함께하는 다른 파벌에 합류할 수도 있다.#!"
 lam_fac_old_modifier: "오랜 파벌의 수장"
 lam_fac_old_modifier_desc: "오래 이어진 파벌의 이름을 이고 있다."
 lam_fac_venerable_modifier: "명문 파벌의 수장"
 lam_fac_venerable_modifier_desc: "수십 년을 이어 온 파벌의 이름이 이 사람에게 무게를 더한다."
 lam_fac_deal_interaction: "파벌과 거래한다"
 lam_fac_deal_interaction_desc: "이 파벌의 수장과 마주 앉는다. 무언가를 내주고, 무언가를 받아낸다. 내주는 것은 수장 개인이 아니라 파벌의 몫이다. 그걸 어떻게 나누느냐에 따라 파벌이 단단해지기도, 금이 가기도 한다."
 lam_fac_deal_interaction_tt: "무엇을 내주고 무엇을 받을지 고른다."
 lam_fac_deal_cd_tt: "최근에 이 파벌과 거래했다"
 lam_faction.1000.t: "무엇을 내줄 것인가"
 lam_faction.1000.desc: "[lam_deal_lead.GetTitledFirstName](이)가 맞은편에 앉았다. 뒤에 선 사람들이 무엇을 들고 돌아갈지 지켜보고 있다."
 lam_faction.1000.seat: "자문회 자리 하나"
 lam_faction.1000.seat_tt: "1년 안에 이 파벌의 누군가를 자문회에 앉힌다고 약속한다. 누구를 앉힐지는 내가 정한다. 수장만 앉으면 다른 이들이 서운해하고, 다른 이를 앉히면 파벌이 단단해진다."
 lam_faction.1000.county: "백작령 하나"
 lam_faction.1000.county_tt: "내 직할령 가운데 가장 덜 개발된 백작령 하나를 파벌의 누군가에게 준다. 누구에게 줄지는 거래가 성사된 뒤 내가 고른다. 수장의 라이벌에게 주면 파벌에 금이 간다."
 lam_faction.1000.gold: "금화"
 lam_faction.1000.gold_tt: "금화가 수장의 손을 거쳐 파벌에 돌아간다. 관대하거나 공정한 수장은 고루 나누고(결속 상승), 탐욕스럽거나 야심 찬 수장은 챙기며(결속 하락, 구성원 반감), 그 밖에는 핵심에게만 나눈다."
 lam_faction.1000.marriage: "혼인"
 lam_faction.1000.marriage_tt: "2년 안에 내 가족과 이 파벌 사람(또는 그 가족) 사이에 혼인이나 약혼을 맺겠다고 약속한다."
 lam_faction.1000.law: "왕권법 한 단계 양보"
 lam_faction.1000.law_tt: "즉시 왕권법을 한 단계 낮춘다."
 lam_faction.1000.heir: "그들이 미는 후계"
 lam_faction.1000.heir_tt: "파벌이 지지하는 자녀를 후계자로 지정합니다. 현재 정부에 따른 위신·영향력·신앙심 비용을 지불합니다."
 lam_faction.1000.amnesty: "사면"
 lam_faction.1000.amnesty_tt: "금지령 아래에서도 이 파벌만은 공식적으로 허락한다. 지하에서 나와 다시 드러난다."
 lam_faction.1000.bribe: "수장 개인에게 뒷돈"
 lam_faction.1000.bribe_tt: "파벌의 몫이 아니라 수장 주머니로만 가는 금화다. 수장은 나를 좋게 보지만 '매수당한 수장'이라는 비밀을 안게 된다. 그 비밀이 드러나면 결속이 무너지고 수장이 쫓겨날 수 있다. 정직하거나 공정한 수장은 거절하기 쉽다."
 lam_faction.1000.x: "그만둔다"
 lam_faction.1010.t: "무엇을 받아낼 것인가"
 lam_faction.1010.desc: "이제 내가 원하는 것을 말할 차례다."
 lam_faction.1010.oath: "충성 서약"
 lam_faction.1010.oath_tt: "5년 동안 이 파벌은 왕권에 맞서 목소리를 내거나 세력을 모으지 않는다. 마음속 불만은 남아도 드러내지 못한다."
 lam_faction.1010.heir: "내 후계자를 밀 것"
 lam_faction.1010.heir_tt: "5년 동안 이 파벌은 내 정식 후계자를 민다."
 lam_faction.1010.disband: "파벌을 접을 것"
 lam_faction.1010.disband_tt: "이 파벌을 해산한다. 오래된 파벌일수록 받아들이기 어렵다."
 lam_faction.1010.counter: "적대 파벌을 누를 것"
 lam_faction.1010.counter_tt: "이 파벌을 내세워 가장 큰 적대 파벌을 누른다. 저쪽은 호의를 잃고 원한을 품는다."
 lam_faction.1010.arms: "군대를 낼 것"
 lam_faction.1010.arms_tt: "지금 전쟁 중이면 수장과 핵심이 내 편에 참전한다. 아니면 2년 안에 시작되는 내 전쟁에 참전한다."
 lam_faction.1010.law_support: "왕권 강화에 반대하지 말 것"
 lam_faction.1010.law_support_tt: "3년 동안 이 파벌 사람들은 왕권법이 높다는 이유로 왕권에 등을 돌리지 않는다."
 lam_faction.1010.back: "다시 고른다"
 lam_faction.1020.t: "제안"
 lam_faction.1020.open: "[lam_deal_lead.GetTitledFirstName]에게 말을 건넸다.\n\n"
 lam_faction.1020.g.seat: "#P 내주는 것:#! 1년 안에 자문회 자리 하나.\n"
 lam_faction.1020.g.county: "#P 내주는 것:#! 백작령 하나.\n"
 lam_faction.1020.g.gold: "#P 내주는 것:#! 금화.\n"
 lam_faction.1020.g.marriage: "#P 내주는 것:#! 2년 안에 혼인.\n"
 lam_faction.1020.g.law: "#P 내주는 것:#! 왕권법 한 단계.\n"
 lam_faction.1020.g.heir: "#P 내주는 것:#! 그들이 미는 후계 지정.\n"
 lam_faction.1020.g.amnesty: "#P 내주는 것:#! 사면.\n"
 lam_faction.1020.g.bribe: "#P 내주는 것:#! 수장 개인에게 뒷돈.\n"
 lam_faction.1020.a.oath: "#N 받는 것:#! 5년 충성 서약.\n"
 lam_faction.1020.a.heir: "#N 받는 것:#! 내 후계자 지지 (5년).\n"
 lam_faction.1020.a.disband: "#N 받는 것:#! 파벌 해산.\n"
 lam_faction.1020.a.counter: "#N 받는 것:#! 적대 파벌 압박.\n"
 lam_faction.1020.a.arms: "#N 받는 것:#! 참전.\n"
 lam_faction.1020.a.law_support: "#N 받는 것:#! 왕권 강화 묵인 (3년).\n"
 lam_faction.1020.chance: "\n받아들일 가능성: #V [lam_deal_lead.MakeScope.Var('lam_deal_acc').GetValue|0]%#! (주고받는 것의 무게, 파벌의 노선, 나를 향한 호의와 호감)"
 lam_faction.1020.a: "제안한다"
 lam_faction.1020.back: "처음부터 다시"
 lam_faction.1020.x: "그만둔다"
 lam_faction.1030.t: "누구에게"
 lam_faction.1030.desc: "거래는 성사되었다. 이제 땅을 누구에게 줄지 정할 차례다. 파벌 사람들 모두가 그 이름을 기다리고 있다."
 lam_faction.1030.lead: "수장 [lam_deal_lead.GetFirstName]에게"
 lam_faction.1030.lead_tt: "수장이 다 가져간다. 다른 이들은 서운해한다 (결속 −10)."
 lam_faction.1030.r1: "핵심 [lam_deal_r1.GetFirstName]에게"
 lam_faction.1030.r1_tt: "파벌의 기둥에게 돌아간다 (결속 +5)."
 lam_faction.1030.r2: "수장과 사이가 나쁜 [lam_deal_r2.GetFirstName]에게"
 lam_faction.1030.r2_tt: "수장의 경쟁자를 키운다. 파벌에 금이 가고 수장이 나를 원망한다 (결속 −20)."
 lam_deal_yes_title: "[lam_deal_lead.GetShortUIName]의 파벌과 거래가 성사되었다"
 lam_deal_no_title: "[lam_deal_lead.GetShortUIName]의 파벌이 거래를 거절했다"
 lam_secret_bribed: "매수당한 수장"
 lam_secret_bribed_desc: "주군의 돈을 파벌 몫이 아닌 제 주머니로 받았다"
 lam_fac_bribed_opinion: "뒷돈을 받았다"
 lam_fac_hoarded_opinion: "파벌 몫을 독차지했다"
 lam_fac_fair_share_opinion: "몫을 고루 나누었다"
 lam_fac_passed_over_opinion: "몫에서 밀려났다"
 lam_faction.0610.t: "들고일어날 때"
 lam_faction.0610.desc: "우리 파벌의 기세가 끓어 넘친다. 사람들이 내 입만 바라본다. 지금이라면 칼을 들어도 따를 자들이 있다. 물론 아직은 참을 수도 있다."
 lam_faction.0610.a: "들고일어난다"
 lam_faction.0610.a_tt: "우리 파벌이 명분에 맞는 요구(주장자 옹립·독립·권한 축소, 일본·중국에서는 그 나라의 방식)를 주군에게 들이민다. 핵심과 측근이 함께 서고, 길이 없으면 공공연한 불복이 된다."
 lam_faction.0610.b: "아직은 참는다"
 lam_faction.0610.b_tt: "1년 동안 기세가 꺾인다."
 lam_fac_command_interaction: "궁정당에 명한다"
 lam_fac_command_interaction_desc: "궁정당은 이름만 파벌일 뿐, 사실상 내 손이다. 그들을 불러 싸우게 하고, 사람을 끌어들이게 하고, 다른 파벌을 누르게 할 수 있다."
 lam_fac_command_interaction_tt: "궁정당에 무엇을 시킬지 고른다."
 lam_faction.1100.t: "궁정당에 명한다"
 lam_faction.1100.desc: "[lam_cp_lead.GetTitledFirstName](이)가 명을 기다린다."
 lam_faction.1100.arms: "칼을 들라 (위신)"
 lam_faction.1100.arms_tt: "전쟁 중이면 수장과 핵심이 지금 내 편으로 참전하고, 아니면 2년 안의 내 전쟁에 참전한다. 2년에 한 번."
 lam_faction.1100.recruit: "사람을 끌어들여라 (금화)"
 lam_faction.1100.recruit_tt: "국고로 정치에 마음이 있는 무소속을 3명까지 궁정당에 들인다. 1년에 한 번."
 lam_faction.1100.press: "다른 파벌을 눌러라 (폭정)"
 lam_faction.1100.press_tt: "가장 큰 다른 파벌을 궁정당이 누른다. 저쪽은 호의를 잃고, 원한을 품고, 결속과 참여가 흔들린다. 2년에 한 번."
 lam_faction.1100.x: "지금은 됐다"
 lam_fac_head_demand_interaction: "파벌의 이름으로 요구한다"
 lam_fac_head_demand_interaction_desc: "나는 한 파벌의 수장이다. 그 무게를 등에 지고 주군 앞에 선다."
 lam_fac_head_demand_interaction_tt: "무엇을 요구할지 고른다. 받아들여질지는 우리 세력, 호의, 왕권의 세기, 주군의 성격에 달렸다. 거절당하면 원한이 남고, 그 원한이 다음 수의 명분이 된다."
 lam_fac_head_demand_cd_tt: "주군에게 요구한 지 1년이 지나야 한다 (약 #high [actor.MakeScope.ScriptValue('lam_fac_hd_cd_left_value')|0]개월#! 남음)"
 lam_faction.1200.t: "파벌의 이름으로"
 lam_faction.1200.desc: "주군 앞에 선다. 내 뒤에는 우리 파벌이 있다. 무엇을 요구할 것인가?"
 lam_faction.1200.law: "왕권법을 누그러뜨려 주십시오"
 lam_faction.1200.heir: "우리가 미는 분을 후계로"
 lam_faction.1200.tolerance: "우리의 말과 기도에 관용을"
 lam_faction.1200.gold: "우리 몫의 금화를"
 lam_faction.1200.amnesty: "우리 파벌의 사면을"
 lam_faction.1200.x: "그만둔다"
 lam_faction.1210.desc: "말을 꺼냈다. 주군의 눈이 가늘어진다."
 lam_faction.1210.chance: "\n\n받아들여질 가능성: #V [ROOT.Char.MakeScope.Var('lam_hd_acc').GetValue|0]%#!"
 lam_faction.1210.a: "밀어붙인다"
 lam_faction.1210.x: "물러선다"
 lam_hd_yes_title: "주군이 우리 파벌의 요구를 들어주었다"
 lam_hd_no_title: "주군이 우리 파벌의 요구를 거절했다. 사람들이 이를 갈고 있다"
 lam_fac_head_arms_decision: "파벌을 소집한다"
 lam_fac_head_arms_decision_desc: "내 전쟁에 우리 파벌의 핵심을 부른다. 모두가 오지는 않겠지만, 온 자들과의 유대는 깊어진다."
 lam_fac_head_arms_decision_tooltip: "파벌을 소집한다"
 lam_fac_head_arms_decision_tt: "내가 주도하는 전쟁에 참전할 수 있는 핵심파·동조파 영주에게 지원을 요청합니다. 실제로 지원군이 합류하면 결속이 5 증가합니다. 요청 후 3년 동안 다시 요청할 수 없습니다."
 lam_fac_head_arms_cd_tt: "최근에 파벌을 소집했다 (3년)"
 lam_fac_head_order_decision: "파벌의 기강을 잡는다"
 lam_fac_head_order_decision_desc: "믿을 만한 동료를 중용하거나 뜻이 갈린 자와 결별한다. 후계 지지 후보를 바꾸려면 파벌회의의 동의를 구한다."
 lam_fac_head_order_decision_tooltip: "파벌의 기강을 잡는다"
 lam_fac_head_order_cd_tt: "최근에 기강을 잡았다 (1년)"
 lam_faction.1300.t: "파벌의 기강"
 lam_faction.1300.desc: "파벌도 결국 사람이다. 사람은 다스려야 따른다."
 lam_faction.1300.out: "[lam_ds_out.GetShortUIName]와 결별하겠다."
 lam_faction.1300.out_tt: "나를 가장 못마땅해하는 자를 파벌에서 내보낸다. 2년 동안 어느 파벌에도 들지 못한다. 결속 +5."
 lam_faction.1300.up: "[lam_ds_up.GetShortUIName]를 핵심 인물로 중용하겠다."
 lam_faction.1300.up_tt: "선택한 동조파를 핵심파로 중용합니다. 5년 동안 지위와 소속이 유지되며, 파벌 결속이 3 증가합니다."
 lam_faction.1300.heir: "[lam_ds_heir.GetShortUIName] 지지를 회의에 부치겠다."
 lam_faction.1300.heir_tt: "주군의 자식 가운데 나를 가장 좋게 보는 이를 5년 동안 우리 파벌의 후보로 삼는다."
 lam_faction.1300.x: "지금은 됐다"
 lam_faction.1400.t: "나라가 우리 손안에"
 lam_faction.1400.desc: "우리 파벌은 군사적 기반과 궁정의 요직을 장악하고, 군주를 움직일 수단까지 확보했다. 이 기반을 오랫동안 유지한 끝에 국정을 직접 좌우할 기회가 왔다. 결행하는 순간에도 기반이 온전해야 한다."
 lam_faction.1400.a: "옥좌 뒤에 선다"
 lam_faction.1400.a_tt: "현재 기반을 재확인하고 비선실세가 된다. 요직과 정치 기반이 무너지면 실권을 잃을 수 있다."
 lam_faction.1400.b: "아직 그 자리까지는 원하지 않는다"
 lam_faction.1410.t: "줄에 매달린 왕관"
 lam_faction.1410.desc: "오늘도 [lam_pm_lead.GetTitledFirstName](이)가 먼저 말했고, 자문회는 그 말을 따랐다. 나는 옥좌에 앉아 그것을 지켜보았다. 내 도장은 내 손에 있다. 그런데 무엇에 찍을지는 내가 정하지 않는다."
 lam_faction.1410.a: "...언젠가는"
 lam_faction.1410.a_tt: "[lam_pm_lead.GetShortUIName]의 파벌이 나라를 쥐었다. 약점을 잡혔고, 왕실 수입의 일부를 빼앗기며, 위신과 봉신들의 존중이 깎인다. 그 파벌이 봉신 세력의 절반 아래로 줄면 풀려난다. 결단 '친위 쿠데타'로 직접 끊어낼 수도 있다."
 lam_fac_coup_decision: "친위 쿠데타"
 lam_fac_coup_decision_desc: "줄을 끊는다. 성공하면 비선실세를 잡아 가두고 옥좌를 되찾는다. 실패하면 줄은 더 조여지고 그 파벌이 무기를 든다."
 lam_fac_coup_decision_tooltip: "친위 쿠데타"
 lam_fac_coup_decision_tt: "성공 확률은 내 계책·전투·공포 수치에 달려 있다. 상대 파벌의 결속이 높을수록 성공하기 어렵다."
 lam_fac_coup_cd_tt: "최근에 쿠데타를 시도했다 (3년)"
 lam_coup_yes_title: "쿠데타가 성공했다. [lam_cu_lead.GetShortUIName](이)가 사슬에 묶였다"
 lam_coup_no_title: "쿠데타가 실패했다. [lam_cu_lead.GetShortUIName]의 파벌이 칼을 든다"
 lam_pm_freed_title: "줄이 끊어졌다. 옥좌가 다시 내 것이다"
 lam_fac_puppet_modifier: "줄에 매달린 왕관"
 lam_fac_puppet_modifier_desc: "한 파벌이 나라를 쥐고 있다. 옥좌의 말은 다른 이의 입에서 나온다."
 lam_fac_puppeteer_modifier: "옥좌 뒤의 그림자"
 lam_fac_puppeteer_modifier_desc: "나라를 움직이는 것은 왕관이 아니라 이 사람이다."
 lam_fac_btn_detail: "상세 보기"
 lam_fac_btn_detail_tt: "이 파벌의 깃발, 역대 수장, 구성원, 명망과 유산, 관계, 연혁을 본다."
 lam_fac_detail_title: "파벌"
 lam_fac_detail_banner_tt: "창립자 [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] 가문의 문장을 깃발로 쓴다."
 lam_fac_detail_line1: "#high [Character.Custom('LamFacAgeTier')]#! · [Character.MakeScope.Var('lam_fac_founded').GetValue|0]년 창립 ([Character.MakeScope.Var('lam_fac_age').GetValue|0]년째) · 수장 [Character.MakeScope.Var('lam_fac_gen').GetValue|0]대째"
 lam_fac_detail_line2: "[Character.Custom('LamFacStance')] · [Character.Custom('LamFacStage')] · 정치 [Character.MakeScope.Var('lam_cr_share').GetValue|0]% · 요직 [Character.MakeScope.ScriptValue('lam_pol_seats_value')|0]석"
 lam_fac_detail_line3: "#weak 창립자:#! [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · #weak 구성원:#! [Character.MakeScope.Var('lam_fac_count').GetValue|0]명"
 lam_fac_detail_heads: "역대 수장"
 lam_fac_detail_head_now: "#high 지금:#! [Character.GetShortUIName]"
 lam_fac_detail_head_past: "[Character.GetShortUIName]"
 lam_fac_detail_core: "핵심"
 lam_fac_detail_clients: "협력자"
 lam_fac_detail_sym: "동조"
 lam_fac_detail_renown: "명망 #V [Character.MakeScope.Var('lam_fac_renown').GetValue|0]#!"
 lam_fac_detail_renown_tt: "해마다 연륜과 세력만큼 쌓이고, 밀던 후보의 즉위·봉기·지켜진 약속·충돌 승리·거래 같은 일로 늘어난다. 파벌의 이름값이다. 파벌이 무너질 때 남는 몫도 이것으로 정해진다. 파벌원 3명 이상인 파벌만 쌓인다."
 lam_fac_leg_buy: "얻는다"
 lam_fac_leg_org_line: "조직 [Character.MakeScope.Var('lam_fac_leg_org').GetValue|0]/3 #weak (역사 [Character.MakeScope.Var('lam_fac_tr_org').GetValue|0])#!"
 lam_fac_leg_org_tt: "결속의 기준치가 단계마다 +5.\n#weak 얻는 길: 수장이 대를 이을 때마다 1, 숙청을 견딜 때마다 2, 충돌에서 질 때마다 1.#!"
 lam_fac_leg_ties_line: "인맥 [Character.MakeScope.Var('lam_fac_leg_ties').GetValue|0]/3 #weak (역사 [Character.MakeScope.Var('lam_fac_tr_ties').GetValue|0])#!"
 lam_fac_leg_ties_tt: "사람을 끌어당기는 힘(가입 점수)이 단계마다 +3.\n#weak 얻는 길: 연륜 한 단계마다 2, 밀던 후보가 즉위할 때마다 2.#!"
 lam_fac_leg_purse_line: "금고 [Character.MakeScope.Var('lam_fac_leg_purse').GetValue|0]/3 #weak (역사 [Character.MakeScope.Var('lam_fac_tr_purse').GetValue|0])#!"
 lam_fac_leg_purse_tt: "구성원이 매 계절 내는 기금이 늘어난다. 무소속을 끌어올 때 내미는 금화도 많아진다. (기금은 수장의 개인 금고로 들어가 수장이 관리한다.)\n#weak 얻는 길: 주군과 거래를 맺을 때마다 1.#!"
 lam_fac_leg_arms_line: "무력 [Character.MakeScope.Var('lam_fac_leg_arms').GetValue|0]/3 #weak (역사 [Character.MakeScope.Var('lam_fac_tr_arms').GetValue|0])#!"
 lam_fac_leg_arms_tt: "소집과 근왕 참전에 응할 확률이 단계마다 +10%.\n#weak 얻는 길: 다른 파벌과의 충돌에서 이길 때마다 2, 들고일어날 때마다 1.#!"
 lam_fac_leg_cause_line: "명분 [Character.MakeScope.Var('lam_fac_leg_cause').GetValue|0]/3 #weak (역사 [Character.MakeScope.Var('lam_fac_tr_cause').GetValue|0])#!"
 lam_fac_leg_cause_tt: "파벌의 요구가 받아들여질 가능성이 단계마다 오른다(+5%, AI 주군의 응답에는 +10).\n#weak 얻는 길: 주군의 약속이 지켜질 때마다 2, 배신당할 때마다 1.#!"
 lam_fac_leg_will_line: "유지(遺志) [Character.MakeScope.Var('lam_fac_leg_will').GetValue|0]/1"
 lam_fac_leg_will_tt: "이 파벌이 무너져도(해산, 수장의 죽음, 나라의 몰락) 한 번은 명망과 전통, 창립 연도, 대수를 20년 동안 마지막 수장(또는 가장 강한 핵심)이 맡아 둔다. 그 사람이나 그 가문·친족·벗이 새 파벌을 세우면 그대로 이어받는다. 이어받으면 '유지'는 소모되고, 그 파벌의 줄기에서는 다시 생기지 않는다. '유지'가 없으면 명망의 4분의 1만 10년 동안 남는다.\n#weak 얻는 길: 파벌이 '오래된' 연륜에 이르면 저절로 생긴다.#!"
 lam_fac_detail_relations: "다른 파벌과의 관계"
 lam_fac_detail_relations_tt: "우호 (맺음): 수장끼리 우호를 맺었다. 서로 다투지 않는다. 숙적: 적대에 더해 수장끼리 라이벌이거나 가문이 원수지간이다. 경쟁: 적대한다. 우호: 가깝다. 중립: 어느 쪽도 아니다. 궁정 현안에서는 같은 편에 선 파벌들이 한 연합이 된다."
 lam_fac_detail_rel_row: "[Character.GetShortUIName]의 파벌 · [GetPlayer.MakeScope.Var('lam_fac_detail').Char.Custom2('LamFacRel', Character.Self)]"
