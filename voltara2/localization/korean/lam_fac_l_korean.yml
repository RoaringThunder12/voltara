 lam_fac_bar_favour: "호의"
 lam_fac_btn_favour: "총애한다"
 lam_fac_btn_favour_tt: "이 파벌을 후원한다. 호의 +15, 수장 의견 +20. 2년간 주요 궁정 접근권을 주며 이전 후원 파벌의 접근권은 거둔다. 경쟁 파벌 최대 둘이 견제·연대·재접근으로 대응한다. 위신 75, 파벌당 1년에 한 번. 궁정당 수락은 별도 표결이다."
 lam_fac_btn_slight: "멀리한다"
 lam_fac_btn_slight_tt: "이 파벌을 배제한다. 호의 -15, 수장 의견 -20. 2년간 궁정 입지가 약해지고 원한을 품는다. 다른 유력 파벌의 호의 +5. 배제된 파벌은 견제·연대·재접근으로 대응한다. 파벌당 1년에 한 번."
