 rule_lam_faction_scope: "살아있는 파벌: 범위"
 rule_lam_faction_scope_desc: "봉신 파벌이 돌아가는 궁정의 범위. 플레이어의 궁정과 그 위 군주들은 늘 포함된다. 넓힐수록 무거워진다 (AI 궁정은 1년에 한 번 갱신)."
 setting_lam_faction_scope_player_area: "플레이어 주변"
 setting_lam_faction_scope_player_area_desc: "플레이어 궁정, 그 위 군주들, 플레이어 최상위 왕국과 국경을 맞댄 독립 군주들."
 setting_lam_faction_scope_kings: "왕 이상 전부"
 setting_lam_faction_scope_kings_desc: "왕국·제국 등급의 모든 궁정."
 setting_lam_faction_scope_dukes: "공작 이상 전부"
 setting_lam_faction_scope_dukes_desc: "공작 등급 이상의 모든 궁정."
 setting_lam_faction_scope_all: "모든 궁정 (기본)"
 setting_lam_faction_scope_all_desc: "백작 이상 직속 봉신이 한 명이라도 있는 모든 궁정. 봉신이 넷 미만인 작은 궁정에서는 불만 품은 영주 한 명이 곧 파벌이다."
 setting_lam_faction_scope_off: "끔"
 setting_lam_faction_scope_off_desc: "봉신 파벌을 만들지 않는다 (내실 파벌은 그대로)."
 rule_lam_fac_absorb: "살아있는 파벌: 귀족 정치 통합"
 rule_lam_fac_absorb_desc: "적용 대상 궁정의 독립·권한 축소·옹립·해체 요구는 살아있는 파벌의 회의와 연대로 결정한다. 상설 파벌이 없는 궁정에도 적용되며 무소속도 참여할 수 있다. 기본 게임의 전쟁과 승패 처리를 이용하고, 해당 귀족 파벌은 별도 파벌 목록에 중복 표시하지 않는다. 행정제·일본·중국의 고유 정치와 민중 봉기는 현재의 별도 절차를 유지한다."
 setting_lam_fac_absorb_on: "통합 (기본)"
 setting_lam_fac_absorb_on_desc: "상설 파벌과 무소속이 구체적인 요구에 연대하고, 동의한 인물들이 행동한다."
 setting_lam_fac_absorb_off: "그대로"
 setting_lam_fac_absorb_off_desc: "바닐라 파벌이 평소처럼 따로 돈다."
