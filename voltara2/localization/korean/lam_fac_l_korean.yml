 lam_faction.0300.install_tt: "이 사람을 머리로 궁정당이 선다 (호의 40). 자리가 다 찼다면 가장 약한 파벌이 밀려난다."
 lam_found_faction_decision_install_tt: "군주의 궁정에 내 파벌이 선다. 자리가 다 찼다면 가장 약한 파벌이 밀려난다."
 lam_faction.0100.d.heir: "\"[ROOT.Char.Custom('FormOfAddressForLiege')]의 자식들 가운데 왕관의 무게를 견딜 분은 [lam_pet_heir.GetFirstName] 님입니다. 저희는 그렇게 믿고, 저희 사람들도 그렇게 믿습니다. 그분을 후계로 세워 주십시오.\""
 lam_faction.0100.d.law: "\"왕궁의 손길이 너무 무겁습니다. 저희 땅의 일까지 왕의 사람들이 들여다봅니다. 왕권의 고삐를 늦춰 주십시오.\""
 lam_faction.0100.d.no_revoke: "\"[ROOT.Char.Custom('FormOfAddressForLiege')]께서 봉신의 땅을 거두시는 것을 모두가 보았습니다. 다음은 누구입니까? 작은 영주들의 땅에는 손대지 않겠다고 약조해 주십시오.\""
 lam_faction.0100.d.tolerance: "\"저희의 말과 기도가 이 궁정에서 업신여겨집니다. 같은 왕을 섬기는 백성으로 대해 주십시오.\""
 lam_faction.0100.d.faith: "\"[ROOT.Char.Custom('FormOfAddressForLiege')]의 자문회에 참된 신앙을 따르지 않는 자가 앉아 있습니다. 그 자리를 신앙의 사람에게 돌려 주십시오.\""
 lam_faction.0100.d.campaign: "\"칼이 녹슬고 있습니다. 몇 해째 전장에 나가지 못했습니다. 원정을 약속해 주십시오. 영광은 나누는 것이니까요.\""
 lam_faction.0100.d.council: "\"자문회의 자리는 늘 같은 사람들 차지입니다. 저희 목소리도 그 자리에 닿아야 합니다.\""
 lam_faction.0100.d.reward: "\"[ROOT.Char.Custom('FormOfAddressForLiege')]께서 흔들리실 때, 저희는 칼을 들고 곁에 섰습니다. 그 충성을 기억해 주십시오.\""
 lam_faction.0100.d.redress: "\"저희가 이 궁정에서 어떤 대접을 받는지, [ROOT.Char.Custom('FormOfAddressForLiege')]께서는 아십니까? 이대로는 저희 사람들을 붙잡아 둘 수가 없습니다.\""
 lam_faction.0100.liar: "\n\n#italic 저들의 눈빛에는 믿음이 없다. 내가 어긴 약속들을 저들도 기억하고 있다. 지금 내 약속은 아무 값어치가 없다.#!"
 lam_faction.0100.heir: "[lam_pet_heir.GetFirstName](을)를 후계자로 세운다"
 lam_faction.0100.law: "왕권의 고삐를 한 단계 늦춘다"
 lam_faction.0100.tolerance: "관용을 베푼다"
 lam_faction.0100.reward: "그 충성에 넉넉히 보답한다"
 lam_faction.0100.redress: "제대로 사과하고, 값을 치른다"
 lam_faction.0100.promise: "약속한다"
 lam_faction.0100.promise.council_tt: "1년 안에 이 파벌의 누군가를 자문회에 앉혀야 한다. 지키면 호의가 크게 오르고, 어기면 5년 동안 배신감이 남는다."
 lam_faction.0100.promise.campaign_tt: "2년 안에 공격 전쟁을 일으켜야 한다. 지키면 호의가 크게 오르고, 어기면 5년 동안 배신감이 남는다."
 lam_faction.0100.promise.faith_tt: "1년 안에 신앙이 다른 자문위원을 모두 내보내야 한다. 지키면 호의가 크게 오르고, 어기면 5년 동안 배신감이 남는다."
 lam_faction.0100.promise.no_revoke_tt: "5년 동안 봉신의 작위를 거두지 않아야 한다. 하나라도 거두면 그 즉시 약속을 어긴 것이 된다."
 lam_fac_tolerance_desc: "파벌의 청을 들어 관용을 베풀었다"
 lam_fac_promise_kept_title: "[lam_pr_lead.GetShortUIName]의 파벌에 한 약속을 지켰다"
 lam_fac_promise_broken_title: "[lam_pr_lead.GetShortUIName]의 파벌에 한 약속을 어겼다. 저들은 잊지 않을 것이다"
 lam_fac_betrayed_opinion: "약속을 어겼다"
 lam_fac_clash_opinion: "궁정에서 맞섰다"
 lam_fac_clash_rival_reason: "궁정에서 파벌끼리 부딪혔다"
 lam_faction.0700.t: "두 파벌이 맞부딪혔다"
 lam_faction.0700.heir: "[lam_cl_a.GetTitledFirstName](은)는 [lam_cl_a_heir.GetFirstName]을(를), [lam_cl_b.GetTitledFirstName](은)는 [lam_cl_b_heir.GetFirstName]을(를) 다음 왕으로 민다. 오늘 연회에서 그 말다툼이 모두가 보는 앞에서 터졌다. 누군가 \"적통\"이라는 말을 했고, 누군가는 칼자루에 손을 얹었다."
 lam_faction.0700.council: "자문회 자리를 두고 [lam_cl_a.GetTitledFirstName]의 사람들과 [lam_cl_b.GetTitledFirstName]의 사람들이 서로를 고발하고 나섰다. 한쪽은 자리를 차지했고, 다른 한쪽은 그 자리가 매수로 얻은 것이라고 외친다."
 lam_faction.0700.crown: "[lam_cl_a.GetTitledFirstName]의 파벌과 [lam_cl_b.GetTitledFirstName]의 파벌은 왕권을 두고 정반대에 서 있다. 한쪽은 왕을 더 높이 세우자 하고, 다른 쪽은 끌어내리자 한다. 오늘 그 말들이 내 앞에서 부딪혔다."
 lam_faction.0700.blood: "[lam_cl_a.GetTitledFirstName]의 집안과 [lam_cl_b.GetTitledFirstName]의 집안 사이의 오랜 원한이 다시 불붙었다. 이제는 두 파벌 전체가 그 싸움에 끌려 들어갔다."
 lam_faction.0700.end: "\n\n두 사람 모두 나를 바라본다. 무엇을 하든, 하지 않든, 그게 곧 내 대답이 된다."
