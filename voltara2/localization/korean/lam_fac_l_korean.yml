 lam_fac_show_vanilla: "기본 게임 파벌 보기"
 lam_fac_show_vanilla_tt: "기본 게임의 파벌 창을 연다(독립·자유·주장자, 일본·중국에서는 조정·제국 정책 파벌 등에 직접 들어가거나 만들 때). 이 창은 다음에 궁정 파벌 현황을 열 때까지 F7에 겹쳐 뜨지 않는다."
