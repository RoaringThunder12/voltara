 lam_fac_card_nerve: "#weak 들고일어날 기세 [Character.MakeScope.Var('lam_fac_bold').GetValue|0], 그 이유:#! [Character.Custom('LamFacNerve1')] +[Character.MakeScope.Var('lam_fac_nf1v').GetValue|0][Character.Custom('LamFacNerve2Sep')]"
 lam_fac_card_nerve_tt: "#high 기세 [Character.MakeScope.Var('lam_fac_bold').GetValue|0]#! = 왕권의 빈틈 [Character.MakeScope.Var('lam_fac_nfc').GetValue|0] + 파벌 세력 [Character.MakeScope.Var('lam_fac_nfs').GetValue|0] + 수장의 기질 [Character.MakeScope.Var('lam_fac_nft').GetValue|0] + 원한·배신·낙선·견제·다른 후계 [Character.MakeScope.Var('lam_fac_nfg').GetValue|0] − 진정(밀던 후보 즉위, 숙청의 공포, 마지막 밤의 타협) [Character.MakeScope.Var('lam_fac_nfx').GetValue|0]\n\n#weak 반왕 파벌은 기세 60에 공개 반대, 85에 결집, 110에 봉기한다. 단 봉기에는 자기 세력이 봉신 전체의 10% 이상이어야 하고, 새 군주 즉위 뒤 6개월은 결집까지만 한다(밀던 후보가 낙선한 파벌은 예외). 카드에는 기세를 가장 크게 올린 두 가지만 보인다.#!"
 lam_fac_nf_crown: "왕권이 약함"
 lam_fac_nf_share: "세력이 큼"
 lam_fac_nf_temper: "수장이 대담함"
 lam_fac_nf_grievance: "쌓인 원한"
 lam_fac_nf_spurned: "밀던 후보의 낙선"
 lam_fac_nf_betrayed: "깨진 약속"
 lam_fac_nf_wary: "궁정당 견제"
 lam_fac_nf_heir: "다른 후계를 밂"
 lam_fac_nerve2_sep: " · [Character.Custom('LamFacNerve2')] +[Character.MakeScope.Var('lam_fac_nf2v').GetValue|0]"
 lam_faction.0800.tips_head: "\n\n#high 지금 둘 만한 수#!"
 lam_faction.0800.tip1: "\n· [ROOT.Char.Custom('LamFacTip1')]"
 lam_faction.0800.tip2: "\n· [ROOT.Char.Custom('LamFacTip2')]"
 lam_faction.0800.take_deal: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]의 파벌과 마주 앉는다"
 lam_faction.0800.take_favour: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]의 파벌을 총애한다"
 lam_faction.0800.take_press: "궁정당에 다른 파벌을 누르라 명한다"
 lam_fac_tip1_deal: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]의 파벌이 결집하고 있다(기세 [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]). 들고일어나기 전에 '파벌과 거래한다'로 충성 서약을 받아 둘 수 있다. #weak 대가: 자문회 자리·백작령·금화·혼인·사면 중 하나#!"
 lam_fac_tip1_promise: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]의 파벌에 한 약속이 아직 걸려 있다. 기한 안에 지키면 호의가 크게 오르고, 어기면 5년 동안 배신감이 남는다."
 lam_fac_tip1_strings: "왕관이 줄에 매달려 있다. '줄을 사들인다'(3년치 수입)나 '친위 쿠데타'(계책·전투·공포)로 끊을 수 있다."
 lam_fac_tip1_amends: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]의 파벌은 내가 저지른 부당한 일을 기억한다. 이 파벌과 거래가 성사되면 그 원한이 풀린다(다른 군주의 원한은 아니다). #weak 대가: 내주는 것 하나#!"
 lam_fac_tip1_make_cp: "궁정당이 없다. [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]의 파벌을 후원하면 지지 기반을 다질 수 있다. 궁정당이 되려면 파벌회의의 동의가 필요하다. 위신 75."
 lam_fac_tip1_rally: "왕권이 흔들린다. 근왕으로 뭉친 [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]의 파벌을 총애해 기세를 실어 줄 수 있다. #weak 대가: 위신 75#!"
 lam_fac_tip1_press: "궁정당에 [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]의 파벌을 누르라 명할 수 있다. 저쪽의 호의·결속·참여가 흔들린다. #weak 대가: 폭정, 2년에 한 번#!"
 lam_fac_tip1_ban: "파벌 금지령을 내릴 조건이 갖춰졌다. 다만 모든 봉신의 반감(−20, 5년)과 금지령이 서 있는 동안의 유지비가 따른다."
 lam_fac_tip2_deal: "[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]의 파벌이 결집하고 있다(기세 [ROOT.Char.MakeScope.Var('lam_tip2_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]). 들고일어나기 전에 '파벌과 거래한다'로 충성 서약을 받아 둘 수 있다. #weak 대가: 자문회 자리·백작령·금화·혼인·사면 중 하나#!"
 lam_fac_tip2_promise: "[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]의 파벌에 한 약속이 아직 걸려 있다. 기한 안에 지키면 호의가 크게 오르고, 어기면 5년 동안 배신감이 남는다."
 lam_fac_tip2_strings: "왕관이 줄에 매달려 있다. '줄을 사들인다'(3년치 수입)나 '친위 쿠데타'(계책·전투·공포)로 끊을 수 있다."
