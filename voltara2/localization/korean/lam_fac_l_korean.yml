 lam_fac_member_row: "[Character.GetShortUIName] · [Character.Custom('LamFacTier')] · [Character.Custom('LamAttitude')]\n\n#high 주요 기반: [Character.Custom('LamUxBasis1')][Character.Custom('LamUxBasis2')]#!\n현재 파벌 내 영향력: #high [Character.MakeScope.ScriptValue('lam_cr_influence_value')|1]/100#!\n기본 10\n군사력 [Character.MakeScope.ScriptValue('lam_cr_military_value')|1]/20 · 경제력 [Character.MakeScope.ScriptValue('lam_cr_economy_value')|1]/15\n신분과 명망 [Character.MakeScope.ScriptValue('lam_cr_standing_value')|1]/15 · 궁정 입지 [Character.MakeScope.ScriptValue('lam_cr_court_value')|1]/15\n인맥 [Character.MakeScope.ScriptValue('lam_cr_network_value')|1]/10 · 파벌 공헌 [Character.MakeScope.ScriptValue('lam_cr_service_value')|1]/15\n\n#weak 군사·경제력은 규모가 커질수록 추가 이득이 줄어듭니다. 궁정 입지는 자문회 직위와 군주 접근권, 인맥은 가문과 수장과의 관계, 공헌은 소속 기간과 공로를 반영합니다.#![Character.Custom2('LamUxBallot', GetPlayer)]"
