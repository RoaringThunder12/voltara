 lam_faction.0100.past.wronged: "\n\n#italic 이들은 내 손에 동료가 끌려가고, 약속이 깨진 일을 아직 기억한다. 오늘의 요구는 그 기억에서 나왔다.#!"
 lam_faction.0100.past.spurned: "\n\n#italic 이들이 밀던 후보는 지난 즉위 때 왕관을 받지 못했다. 이들은 그 일을 잊지 않았다.#!"
 lam_faction.0100.past.purge: "\n\n#italic 이 파벌은 숙청을 견뎌 낸 적이 있다. 그 뒤로 군주 앞에서는 말을 고르고, 대신 보장을 원한다.#!"
 lam_faction.0100.past.pardoned: "\n\n#italic 금지령 아래 숨어 지내다 사면을 받은 이들이다. 다시 빛 아래 선 지금, 그 자리를 굳히고 싶어 한다.#!"
 lam_faction.0100.past.old: "\n\n#italic 수장이 [lam_pet_lead.MakeScope.Var('lam_fac_gen').GetValue|0]대째 바뀌어 온 오랜 파벌이다. 이들의 요구에는 앞선 대의 기억이 실려 있다.#!"
