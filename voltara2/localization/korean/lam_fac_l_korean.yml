 lam_sh_decree_interaction: "왕명을 내린다"
 lam_sh_decree_interaction_desc: "꼭두각시 군주의 이름으로 왕명을 내린다: 왕권을 바꾸고, 왕실 금고를 열고, 신하들을 내 편으로 돌리고, 필요하면 왕을 물러나게 한다."
 lam_sd_up: "왕권 강화"
 lam_sd_down: "왕권 약화"
 lam_sd_gold: "왕실 금고를 연다"
 lam_sd_favor: "신하들에게 나를 따르라 명한다"
 lam_sd_abdicate: "왕을 물러나게 한다"
 lam_sd_up_tt: "왕국의 왕권이 한 단계 오른다."
 lam_sd_down_tt: "왕국의 왕권이 한 단계 내려간다."
 lam_sd_gold_tt: "왕실 금고의 4분의 1을 내가 가져간다."
 lam_sd_favor_tt: "군주의 모든 봉신이 5년간 나를 좋게 본다 (+25)."
 lam_sd_abdicate_tt: "군주가 퇴위하고 후계자가 즉위한다. 새 군주도 내 꼭두각시가 된다 (후계자가 나라면 왕좌는 내 것이다). 위신 -500."
 lam_sd_law_cd_tt: "왕권은 1년에 한 번만 바꿀 수 있다"
 lam_sd_gold_cd_tt: "왕실 금고는 1년에 한 번만 열 수 있다"
 lam_sd_favor_cd_tt: "이 명은 5년에 한 번만 내릴 수 있다"
 lam_sd_abd_cd_tt: "퇴위는 10년에 한 번만 강요할 수 있다"
 lam_sd_heir_tt: "군주에게 후계자가 있다"
 lam_fac_debug_seize_interaction: "(디버그) 이 군주의 비선실세가 된다"
 lam_fac_debug_seize_interaction_desc: "디버그 모드 전용: 조건 없이 즉시 이 군주를 꼭두각시로 삼는다."
 lam_fac_debug_seize_decision: "(디버그) 주군의 비선실세가 된다"
 lam_fac_debug_seize_decision_desc: "디버그 모드 전용: 조건 없이 즉시 내 주군을 꼭두각시로 삼는다 (시험용)."
 lam_fac_debug_seize_decision_tooltip: "디버그 모드 전용 시험 버튼."
 lam_fac_debug_seize_tt: "즉시 왕좌 뒤의 실권자가 된다 (파벌 점유율과 무관하게 유지)."
 lam_sh_inherit_title: "왕은 죽었다. 그러나 새 군주 역시 내 손 안에 있다"
 lam_sh_heir_strings_title: "선대의 끈을 이어받았다: 이 군주는 이제 내 꼭두각시다"
 lam_sh_power_modifier: "옥좌 뒤의 실권"
 lam_sh_power_modifier_desc: "모두가 진짜 권력이 어디 있는지 안다. 청탁과 선물이 끊이지 않고, 궁정의 정치 모략은 내 뜻대로 굴러간다."
 lam_shadow.0001.t: "왕의 밀서"
 lam_shadow.0001.desc: "[lam_sh_king.GetFirstName]이(가) 몰래 밀서를 보내려다 내 사람에게 붙잡혔다. 받는 이는 먼 궁정의 옛 친구다. 구원을 청하는 글인지, 그냥 하소연인지는 읽어 봐야 알 것이다."
 lam_shadow.0001.a: "밀서를 들고 왕을 다그친다"
 lam_shadow.0001.b: "모르는 척 돌려보낸다"
 lam_shadow.0002.t: "청탁의 행렬"
 lam_shadow.0002.desc: "아침부터 내 저택 앞에 줄이 늘어섰다. 왕의 인장을 받으려는 자들이 왕이 아니라 나를 찾아온다. 손에는 하나같이 선물이 들려 있다."
 lam_shadow.0002.a: "선물을 받는다"
 lam_shadow.0002.b: "정중히 돌려보낸다"
 lam_shadow.0002.c: "선물은 왕실 금고로 보낸다"
 lam_shadow.0003.t: "왕실의 의심"
 lam_shadow.0003.desc: "[lam_sh_rel.GetTitledFirstName]이(가) 왕의 곁에서 내 이야기를 하고 다닌다. \"폐하께서는 누구의 왕이십니까?\" 아직은 귓속말이지만, 귓속말은 번진다."
 lam_shadow.0003.a: "연금시켜 입을 막는다"
 lam_shadow.0003.b: "금을 쥐여 주고 달랜다"
 lam_shadow.0003.c: "내버려 둔다"
 lam_shadow.0004.t: "외국 사신"
 lam_shadow.0004.desc: "먼 나라의 사신이 왕궁에 도착했다. 그런데 그는 옥좌로 가기 전에 먼저 내 방 문을 두드렸다. 누구에게 고개를 숙여야 하는지 이미 들은 모양이다."
 lam_shadow.0004.a: "내가 직접 맞는다"
 lam_shadow.0004.b: "왕에게 보낸다"
 lam_shadow.0005.t: "후계자의 교육"
 lam_shadow.0005.desc: "왕의 후계자 [lam_sh_heir.GetFirstName]은(는) 아직 어리다. 지금 누가 곁에 있느냐가 훗날 그 아이가 누구의 말을 들을지를 정한다."
 lam_shadow.0005.a: "내 사람으로 키운다"
 lam_shadow.0005.b: "왕에게 맡긴다"
 lam_shadow.0006.t: "입을 연 귀족"
 lam_shadow.0006.desc: "[lam_sh_critic.GetTitledFirstName]이(가) 어전에서 공공연히 나를 비난했다. \"옥좌 뒤에 숨은 자가 이 나라를 망친다.\" 모두가 내 반응을 지켜보고 있다."
 lam_shadow.0006.a: "본보기로 지하 감옥에 가둔다"
 lam_shadow.0006.b: "조용히 금을 보낸다"
 lam_shadow.0006.c: "못 들은 척한다"
 lam_shadow.0007.t: "금고의 틈"
 lam_shadow.0007.desc: "왕실 장부에 구멍이 하나 있다. 아무도 모르는 돈이 매달 흘러 들어오고 흘러 나간다. 그 물길을 조금 돌리는 건 어렵지 않다."
 lam_shadow.0007.a: "빼돌린다"
 lam_shadow.0007.b: "손대지 않는다"
 lam_shadow.0008.t: "연회의 치하"
 lam_shadow.0008.desc: "연회에서 [lam_sh_king.GetFirstName]이(가) 잔을 들어 나를 치하했다. 목소리는 떨렸지만 말은 또렷했다. 모두가 그 말이 누구의 뜻인지 안다."
 lam_shadow.0008.a: "박수를 받는다"
 lam_shadow.0008.b: "공을 왕에게 돌린다"
 lam_shadow.0009.t: "진짜 왕"
 lam_shadow.0009.desc: "시장 바닥에 소문이 돈다. 진짜 왕은 옥좌에 앉은 자가 아니라 그 뒤에 선 자라고. 왕도 이 소문을 들었을 것이다."
 lam_shadow.0009.a: "소문을 키운다"
 lam_shadow.0009.b: "소문을 잠재운다"
 lam_shadow.0009.c: "소문을 내 영향력으로 바꾼다"
 lam_shadow.0010.t: "독의 유혹"
 lam_shadow.0010.desc: "왕의 잔은 매일 밤 같은 시종이 채운다. 그 시종은 내 사람이다. 왕이 죽으면 끈은 후계자에게 넘어갈 것이다. 운이 따른다면, 더 다루기 쉬운 손으로."
 lam_shadow.0010.a: "잔에 독을 탄다"
 lam_shadow.0010.b: "아직은 아니다"
 lam_shadow.0011.t: "다른 파벌의 제안"
 lam_shadow.0011.desc: "[lam_sh_other.GetTitledFirstName]이(가) 밤늦게 사람을 보내왔다. 옥좌 뒤의 자리를 나눠 갖자는 제안이다. 거절하면 적이 하나 늘 것이다."
 lam_shadow.0011.a: "손을 잡는다"
 lam_shadow.0011.b: "짓밟는다"
 lam_shadow.0012.t: "왕의 반발"
 lam_shadow.0012.desc: "오늘 어전에서 [lam_sh_king.GetFirstName]이(가) 처음으로 신하들 앞에서 내 말에 정면으로 반대했다. 목소리는 떨렸지만 물러서지 않았다. 한 번 물러서면 다음에도 그럴 것이다."
 lam_shadow.0012.a: "그 자리에서 왕을 눌러 버린다"
 lam_shadow.0012.b: "이번만은 왕의 체면을 세워 준다"
 lam_shadow.0013.t: "관료들의 줄서기"
 lam_shadow.0013.desc: "관청마다 관료들이 줄을 섰다. 승진과 자리를 바라는 자들이 왕이 아니라 나에게 충성을 맹세하러 온다."
 lam_shadow.0013.a: "충성을 받아 준다"
 lam_shadow.0013.b: "거절한다"
 lam_shadow.0014.t: "술에 빠진 왕"
 lam_shadow.0014.desc: "[lam_sh_king.GetFirstName]은(는) 요즘 밤마다 술잔을 놓지 않는다. 취한 왕은 아무것도 거스르지 않는다."
 lam_shadow.0014.a: "그대로 둔다"
 lam_shadow.0014.b: "술을 끊게 돕는다"
 lam_shadow.0015.t: "어전 회의"
 lam_shadow.0015.desc: "오늘 어전 회의는 내가 주재하게 되었다. 왕은 옥좌에 앉아 있지만, 자문관들의 눈은 모두 나를 향한다."
 lam_shadow.0015.a: "회의를 이끈다"
 lam_shadow.0015.b: "왕에게 자리를 내준다"
 lam_shadow.0016.t: "왕의 반격"
 lam_shadow.0016.desc: "우리 세력이 예전 같지 않다는 걸 [lam_sh_king.GetFirstName]도 알아챘다. 밤사이 왕의 사람들이 궁정 문을 걸어 잠갔고, 내 측근 몇이 끌려갔다. 왕이 처음으로 칼을 뽑았다."
 lam_shadow.0016.a: "정면으로 맞선다"
 lam_shadow.0016.b: "한발 물러서 숨을 고른다"
 lam_shadow.0016.c: "왕의 측근들을 매수한다"
 lam_shadow.0016.d: "끈을 놓는다"
 lam_shadow.0010.a.tt: "왕이 죽는다. 끈이 후계자에게 이어질 수도, 끊어질 수도 있다."
 lam_shadow.0016.win_tt: "왕의 반격을 꺾는다. 왕은 다시 고개를 숙인다."
 lam_shadow.0016.lose_tt: "실패하면 끈이 끊어진다: 왕은 자유로워지고, 나는 크게 체면을 잃는다."
 lam_shadow.0016.yield_tt: "끈은 지키지만, 2년 동안 왕권 변경과 왕실 금고 왕명을 쓸 수 없다."
 lam_shadow.0016.go_tt: "끈을 놓는다. 왕은 자유로운 군주가 된다."
 lam_faction.3000.t: "흔들리는 동지"
 lam_faction.3000.desc_to: "[lam_wv_who.GetTitledFirstName]이(가) 요즘 우리 모임에 발길이 뜸하다. 들리는 말로는 [lam_wv_to.GetTitledFirstName] 쪽 사람들과 자주 어울린다고 한다. 지금 붙잡지 않으면 다음 모임엔 저쪽 자리에 앉아 있을 것이다."
 lam_faction.3000.desc_out: "[lam_wv_who.GetTitledFirstName]이(가) 파벌 일에서 손을 떼고 싶다고 넌지시 말했다. 지쳤다는 것인지, 다른 셈이 있는 것인지는 모르겠다. 지금 붙잡지 않으면 조용히 사라질 것이다."
 lam_faction.3000.a: "직접 만나 설득한다"
 lam_faction.3000.b: "금으로 붙잡는다"
 lam_faction.3000.c: "쥐고 있는 약점을 쓴다"
 lam_faction.3000.d: "핵심 자리를 약속한다"
 lam_faction.3000.e: "보내준다"
 lam_faction.3000.ok_tt: "[lam_wv_who.GetFirstName]은(는) 2년간 우리 파벌에 남는다."
 lam_faction.3000.fail_tt: "설득에 실패하면 [lam_wv_who.GetFirstName]은(는) 떠난다."
 lam_faction.3000.hook_tt: "[lam_wv_who.GetFirstName]은(는) 3년간 우리 파벌에 남는다."
 lam_faction.3000.core_tt: "[lam_wv_who.GetFirstName]은(는) 핵심 구성원이 되어 2년간 남는다."
 lam_faction.3000.go_tt: "[lam_wv_who.GetFirstName]은(는) 떠나지만, 좋게 헤어진 것을 기억한다 (10년 동안 내가 다시 부르면 응하기 쉽다)."
 lam_fac_stage_shadow: "#high 실권파 (옥좌 뒤의 실세)#!"
 lam_fac_view_up: "상위 군주 궁정 보기"
 lam_fac_view_up_tt: "지금 보고 있는 궁정의 주군, 그 궁정의 파벌들을 본다. 누를 때마다 한 단계씩 위로 올라간다 (최상위 군주까지). 돌아오려면 \"내 궁정 보기\"."
 lam_faction.2940.t: "끈은 이어질 것인가"
 lam_faction.2940.desc_king: "옥좌의 주인이 바뀌었다. [lam_sh_new.GetTitledFirstName]이(가) 선왕처럼 순순히 내 말을 들을지는 아직 모른다. 측근들은 벌써 새 군주의 눈치를 살피고 있다."
 lam_faction.2940.desc_heir: "선대가 쥐고 있던 끈이 내 손에 넘어왔다. 그러나 [lam_sh_new.GetTitledFirstName]은(는) 새 얼굴을 시험하려 든다. 지금 놓치면 다시는 잡지 못할 것이다."
 lam_faction.2940.a: "늘 하던 대로 한다"
 lam_faction.2940.b: "측근들에게 금을 뿌린다"
 lam_faction.2940.c: "두려움으로 누른다"
 lam_faction.2940.d: "끈을 놓는다"
 lam_faction.2940.ok_tt: "끈이 이어진다: [lam_sh_new.GetFirstName]은(는) 계속 내 꼭두각시다."
 lam_faction.2940.go_tt: "[lam_sh_new.GetFirstName]은(는) 자유로운 군주가 된다."
 lam_sh_snapped_title: "끈이 끊어졌다: 새 군주는 더 이상 내 손 안에 있지 않다"
 lam_sh_royal_interaction: "왕실 사람을 내 집안에 들인다"
 lam_sh_royal_interaction_desc: "옥좌 뒤의 실권으로 꼭두각시 군주의 배우자나 성인 자녀를 내 배우자나 첩으로 들인다. 군주의 배우자라면 먼저 군주와 갈라선다. 궁정은 수군거리고, 군주는 모욕을 곱씹는다."
 lam_tr_spouse: "배우자로 맞는다"
 lam_tr_concubine: "첩으로 들인다"
 lam_sh_royal_cd_tt: "1년에 한 번만 할 수 있다"
 lam_sh_royal_counter_tt: "모욕당한 군주가 반격할 용기를 낼 수 있다 (왕의 반격 대기 기간이 사라진다)."
 lam_fac_clash_spoils_tt: "자문회 자리를 둔 다툼: 편을 들어 준 쪽이 진 쪽의 자문회 자리 하나(재상·원수·재무관·첩보관 중)를 차지하고, 진 쪽 사람 하나가 이긴 쪽으로 넘어간다."
 lam_fac_feud_title: "두 파벌은 이제 원수지간이다. 한 번 더 부딪치면 피를 볼 것이다"
 lam_fac_ally_rose_title: "동맹 파벌이 봉기했다. 함께 일어설지는 내가 정한다"
 lam_faction.3010.t: "피의 원한"
 lam_faction.3010.desc: "[lam_bf_foe.GetTitledFirstName]의 파벌과 세 번째로 부딪쳤다. 이제 이건 궁정 정치가 아니다. 저쪽도 같은 생각을 하고 있을 것이다. 먼저 움직이는 쪽이 살아남는다."
 lam_faction.3010.a: "먼저 손을 쓴다 (암살 모략)"
 lam_faction.3010.b: "금을 들고 화해를 청한다"
 lam_faction.3010.c: "지켜본다"
 lam_faction.3010.b_tt: "두 파벌 사이의 원한이 풀린다 (경쟁·원수 관계가 사라진다)."
 lam_faction.3010.c_tt: "저쪽이 먼저 움직일 수도 있다."
 lam_fac_card_inf: "#weak 영향력 금고:#! [Character.MakeScope.Var('lam_fac_inf').GetValue|0]"
 lam_fac_card_inf_tt: "행정제 궁정에서 파벌원들이 내는 회비(핵심 6, 지지자 3, 계절마다. 영향력 50 이상일 때)가 쌓인다. 수장이 이걸로 우리 사람을 제위나 테마 총독 후보로 밀거나, 경쟁 파벌의 후보를 깎는다 (100당 후보 점수 30, 혼자 쓸 때의 1.5배)."
 lam_fac_adm_back_interaction: "파벌 금고로 후보를 민다"
 lam_fac_adm_back_interaction_desc: "파벌의 영향력 금고에서 100을 써서 이 사람을 제위나 근거지 테마 총독 후보로 민다 (후보 점수 +30)."
 lam_fac_adm_harm_interaction: "파벌 금고로 후보를 깎는다"
 lam_fac_adm_harm_interaction_desc: "파벌의 영향력 금고에서 100을 써서 경쟁 파벌 사람의 제위·근거지 테마 총독 후보 점수를 깎는다 (−30)."
 lam_fac_adm_chest_tt: "파벌 영향력 금고에 100 이상"
 lam_adb_throne: "제위 후보로"
 lam_adb_gov: "근거지 테마 총독 후보로"
 lam_adh_throne: "제위 후보에서"
 lam_adh_gov: "근거지 테마 총독 후보에서"
 lam_fac_adm_back_tt: "파벌 금고 −100. 이 사람의 후보 점수 +30."
 lam_fac_adm_harm_tt: "파벌 금고 −100. 이 사람의 후보 점수 −30. 상대가 나를 미워한다."
 lam_facx.0001.t: "회합 뒤풀이"
 lam_facx.0001.d1: "회합이 끝나고 [lam_x_mate.GetFirstName]이(가) 내 소매를 잡아끌었다. \"이대로 헤어지기엔 아깝지 않소?\" 주막의 불빛이 아직 꺼지지 않았다."
 lam_facx.0001.d2: "딱딱한 회의가 끝나자 몇몇이 술잔을 꺼냈다. 그 한가운데에서 [lam_x_mate.GetFirstName]이(가) 내 자리를 비워 두고 손짓한다."
 lam_facx.0001.d3: "회합장을 나서는데 [lam_x_mate.GetFirstName]이(가) 따라 나왔다. \"오늘 같은 날은 한잔해야지.\" 술이 들어가면 사람은 속을 꺼내 놓는 법이다."
 lam_facx.0001.a: "어울려 마신다"
 lam_facx.0001.b: "일찍 자리를 뜬다"
 lam_facx.0001.c: "취한 말에 귀를 기울인다"
 lam_facx.0002.t: "수장의 부탁"
 lam_facx.0002.d1: "[lam_x_head.GetTitledFirstName]이(가) 조용히 나를 불렀다. 파벌 일에 급히 쓸 돈이 모자란다고 했다. 부탁이라기보다는 시험처럼 들렸다."
 lam_facx.0002.d2: "\"자네라면 믿을 수 있지.\" [lam_x_head.GetFirstName]이(가) 그렇게 말하며 작은 청을 꺼냈다. 들어주면 빚이 되고, 거절하면 흠이 된다."
 lam_facx.0002.d3: "수장의 편지가 왔다. 정중한 말투였지만 행간에는 기대가 가득했다. 동지라면 이럴 때 손을 보태야 한다는."
 lam_facx.0002.a: "들어준다"
 lam_facx.0002.b: "정중히 거절한다"
 lam_facx.0003.t: "다른 파벌의 손짓"
 lam_facx.0003.d1: "[lam_x_rival.GetTitledFirstName]의 사람이 밤늦게 찾아왔다. \"그쪽에서 받는 대접이 그 정도라니. 우리 쪽이라면 자리가 다르오.\""
 lam_facx.0003.d2: "사냥터에서 [lam_x_rival.GetFirstName]이(가) 슬쩍 말을 붙여 왔다. 지나가는 말처럼 들렸지만, 지나가는 말이 아니었다."
 lam_facx.0003.d3: "봉인 없는 쪽지 한 장. \"더 나은 자리가 기다리고 있소.\" 글씨는 [lam_x_rival.GetFirstName]의 서기의 것이었다."
 lam_facx.0003.a: "거절하고 수장에게 알린다"
 lam_facx.0003.b: "생각해 보겠다고만 한다"
 lam_facx.0003.c: "그 자리에서 넘어간다"
 lam_facx.0004.t: "파벌의 기금"
 lam_facx.0004.d1: "파벌이 기금을 모으고 있다. 누가 얼마를 냈는지는 모두가 안다. 그리고 모두가 기억한다."
 lam_facx.0004.d2: "[lam_x_head.GetFirstName]이(가) 금고를 열어 보였다. 텅 비어 있었다. 말하지 않아도 무엇을 바라는지 알 수 있었다."
 lam_facx.0004.a: "넉넉히 보탠다"
 lam_facx.0004.b: "아낌없이 쏟아붓는다"
 lam_facx.0004.c: "형편이 안 된다고 한다"
 lam_facx.0005.t: "동지의 위기"
 lam_facx.0005.d1: "[lam_x_mate.GetTitledFirstName]의 금고가 바닥났다는 소식이 들렸다. 빚쟁이들이 문 앞을 지키고 있다고 한다. 동지라고 부르던 이가 지금 궁지에 몰려 있다."
 lam_facx.0005.d2: "[lam_x_mate.GetFirstName]이(가) 병석에 누웠다. 체면 때문에 도와 달라는 말은 못 하겠지만, 보낸 편지의 글씨가 떨리고 있었다."
 lam_facx.0005.d3: "[lam_x_mate.GetFirstName]이(가) 전쟁에서 밀리고 있다. 파벌 안에서 누가 손을 내밀지 모두가 지켜본다."
 lam_facx.0005.a: "돕는다 (금을 보낸다)"
 lam_facx.0005.b: "모른 척한다"
 lam_facx.0006.t: "후계자라는 소문"
 lam_facx.0006.d1: "궁정에 소문이 돈다. [lam_x_head.GetFirstName] 다음은 내 차례라고. 정작 수장의 표정은 굳어 있다."
 lam_facx.0006.d2: "연회에서 누군가 내 잔에 술을 따르며 \"다음 수장님\"이라고 불렀다. 웃음이 터졌지만 [lam_x_head.GetFirstName]은(는) 웃지 않았다."
 lam_facx.0006.d3: "내가 파벌의 다음 얼굴이라는 말이 저잣거리에까지 퍼졌다. 누가 퍼뜨렸는지는 모르지만, 싫지는 않다."
 lam_facx.0006.a: "소문을 즐긴다"
 lam_facx.0006.b: "수장 앞에서 분명히 부인한다"
 lam_facx.0101.t: "새 얼굴"
 lam_facx.0101.d1: "[lam_x_new.GetTitledFirstName]이(가) 우리 파벌에 들고 싶다며 찾아왔다. 아직 어느 편에도 서지 않은 사람이다."
 lam_facx.0101.d2: "\"당신 깃발 아래 서고 싶습니다.\" [lam_x_new.GetFirstName]이(가) 고개를 숙였다. 열정만으로 파벌이 서지는 않지만, 열정 없이도 서지 않는다."
 lam_facx.0101.d3: "[lam_x_new.GetFirstName]이(가) 우리 이름을 듣고 찾아왔다. 받아들이면 식구가 하나 늘고, 그만큼 입도 하나 는다."
 lam_facx.0101.a: "핵심으로 맞아들인다"
 lam_facx.0101.b: "지지자로 받아들인다"
 lam_facx.0101.c: "돌려보낸다"
 lam_facx.0102.t: "결속의 의식"
 lam_facx.0102.d1: "[lam_x_mate.GetFirstName]이(가) 맹세의 의식을 올리자고 했다. 같은 잔을 나누고 같은 말을 외면 사람의 마음도 하나가 된다고."
 lam_facx.0102.d2: "파벌이 느슨해졌다는 말이 나온다. 모두를 한자리에 모아 맹세를 새로 할 때가 됐다."
 lam_facx.0102.d3: "오래된 관습이 있다. 파벌원 모두가 수장의 칼에 손을 얹고 맹세하는 것. 요즘은 아무도 하지 않지만, 그래서 더 무게가 있다."
 lam_facx.0102.a: "성대한 의식을 연다"
 lam_facx.0102.b: "말로써 마음을 묶는다"
 lam_facx.0103.t: "핵심의 불만"
 lam_facx.0103.d1: "[lam_x_mate.GetTitledFirstName]이(가) 회합에서 언성을 높였다. \"우리가 피 흘린 만큼 발언권도 있어야 하오!\""
 lam_facx.0103.d2: "[lam_x_mate.GetFirstName]이(가) 따로 찾아와 불만을 늘어놓았다. 자신이 파벌에 바친 것에 비해 대접이 형편없다고."
 lam_facx.0103.d3: "핵심 구성원 [lam_x_mate.GetFirstName]의 얼굴에 불만이 가득하다. 지금 달래지 않으면 다른 이들도 따라 할 것이다."
 lam_facx.0103.a: "더 큰 목소리를 준다"
 lam_facx.0103.b: "자리를 지키라고 꾸짖는다"
 lam_facx.0103.c: "금으로 입을 막는다"
 lam_facx.0104.t: "파벌 안의 첩자"
 lam_facx.0104.d1: "[lam_x_mate.GetFirstName]이(가) [lam_x_rival.GetFirstName]의 사람과 몰래 만나는 것이 목격됐다. 우리 회합 이야기가 새어 나가고 있었다."
 lam_facx.0104.d2: "이상하게도 우리가 정한 일을 [lam_x_rival.GetFirstName]이(가) 늘 먼저 안다. 흔적을 따라가니 [lam_x_mate.GetFirstName]이(가) 나왔다."
 lam_facx.0104.d3: "가로챈 편지 한 통. [lam_x_mate.GetFirstName]의 필체로, [lam_x_rival.GetFirstName]에게 보내는 것이었다."
 lam_facx.0104.a: "쫓아낸다"
 lam_facx.0104.b: "이중첩자로 쓴다"
 lam_facx.0104.c: "모른 척 넘어간다"
 lam_facx.0105.t: "깃발과 이름"
 lam_facx.0105.d1: "파벌원들이 우리만의 깃발을 갖자고 한다. 천 한 장이지만, 사람들은 천 한 장을 위해 죽기도 한다."
 lam_facx.0105.d2: "다른 파벌은 저마다 문장과 표어가 있다. 우리 사람들도 내세울 무언가를 원한다."
 lam_facx.0105.a: "장인을 불러 깃발을 짓는다"
 lam_facx.0105.b: "허례허식이라며 거절한다"
 lam_facx.0106.t: "원로의 조언"
 lam_facx.0106.d1: "파벌의 원로 [lam_x_mate.GetFirstName]이(가) 지팡이를 짚고 찾아왔다. \"젊은 수장이여, 늙은이의 잔소리를 좀 들어 보시오.\""
 lam_facx.0106.d2: "[lam_x_mate.GetFirstName]은(는) 이 파벌이 생기기 전부터 궁정에 있었다. 그가 걱정스러운 얼굴로 할 말이 있다고 한다."
 lam_facx.0106.d3: "늙은 [lam_x_mate.GetFirstName]이(가) 밤새 쓴 충고를 내밀었다. 빽빽한 글씨 사이로 옛 실패들이 줄줄이 적혀 있다."
 lam_facx.0106.a: "귀담아듣는다"
 lam_facx.0106.b: "시대가 달라졌다고 말한다"
 lam_facx.0201.t: "양쪽의 초대장"
 lam_facx.0201.d1: "같은 날 저녁, 두 통의 초대장이 왔다. 하나는 [lam_x_rival.GetTitledFirstName], 하나는 [lam_x_rival2.GetTitledFirstName]. 둘 다 갈 수는 없다."
 lam_facx.0201.d2: "[lam_x_rival.GetFirstName]과(와) [lam_x_rival2.GetFirstName]이(가) 같은 날 연회를 연다. 우연일 리 없다. 어느 식탁에 앉느냐가 곧 대답이다."
 lam_facx.0201.d3: "두 파벌이 모두 나를 원한다. 오늘 밤 어느 연회장에 나타나느냐를 궁정 전체가 지켜볼 것이다."
 lam_facx.0201.a: "[lam_x_rival.GetFirstName]의 연회에 간다"
 lam_facx.0201.b: "[lam_x_rival2.GetFirstName]의 연회에 간다"
 lam_facx.0201.c: "둘 다 정중히 사양한다"
 lam_facx.0202.t: "중립의 대가"
 lam_facx.0202.d1: "어느 쪽에도 서지 않는 것도 선택이다. 그리고 그 선택은 양쪽 모두를 불편하게 한다."
 lam_facx.0202.d2: "[lam_x_rival.GetFirstName]도 [lam_x_rival2.GetFirstName]도 요즘 나를 보는 눈이 곱지 않다. 중립은 공짜가 아니었다."
 lam_facx.0202.a: "양쪽에 선물을 보낸다"
 lam_facx.0202.b: "중립을 공개적으로 선언한다"
 lam_facx.0203.t: "중재 요청"
 lam_facx.0203.d1: "[lam_x_rival.GetFirstName]과(와) [lam_x_rival2.GetFirstName]이(가) 함께 나를 찾아왔다. 서로 말을 섞지 않으면서도, 내게는 할 말이 많다."
 lam_facx.0203.d2: "두 파벌의 다툼이 길어지자 누군가 내 이름을 꺼냈다. \"어느 편도 아닌 사람이 판정해야 하오.\""
 lam_facx.0203.d3: "궁정은 두 파벌의 싸움에 지쳤다. 그리고 모두의 시선이 무소속인 나에게 향했다."
 lam_facx.0203.a: "중재를 맡는다"
 lam_facx.0203.b: "내 일이 아니라며 물러난다"
 lam_facx.0301.t: "수장들의 연회"
 lam_facx.0301.d1: "파벌 수장들을 한 식탁에 앉히자는 의견이 나왔다. 같은 빵을 나누면 칼을 덜 뽑는다는 옛말이 있다."
 lam_facx.0301.d2: "[lam_x_rival.GetTitledFirstName]을(를) 비롯한 파벌 수장들이 요즘 서로 눈도 마주치지 않는다. 연회를 열어 분위기를 바꿀 때다."
 lam_facx.0301.d3: "궁정 시종장이 연회 계획을 들고 왔다. 손님 명단 맨 위에는 파벌 수장들의 이름이 적혀 있다."
 lam_facx.0301.a: "연회를 연다"
 lam_facx.0301.b: "쓸데없는 낭비다"
 lam_facx.0302.t: "익명의 투서"
 lam_facx.0302.d1: "서명 없는 투서가 옥좌 앞에 놓였다. [lam_x_rival.GetTitledFirstName]이(가) 역모를 꾸미고 있다는 내용이다."
 lam_facx.0302.d2: "\"[lam_x_rival.GetFirstName]을(를) 조심하소서.\" 단 한 줄. 누가 왜 썼는지는 알 수 없다."
 lam_facx.0302.d3: "첩보관이 쪽지 하나를 건넸다. 궁정 우물가에서 주웠다는데, [lam_x_rival.GetFirstName]의 이름이 여러 번 적혀 있다."
 lam_facx.0302.a: "조용히 조사한다"
 lam_facx.0302.b: "태워 버린다"
 lam_facx.0302.c: "공개적으로 추궁한다"
 lam_facx.0303.t: "연판장"
 lam_facx.0303.d1: "여러 봉신이 이름을 나란히 적은 연판장이 올라왔다. 맨 위에 [lam_x_rival.GetFirstName]의 이름이 있다."
 lam_facx.0303.d2: "청원이 하나 올라왔다. 내용보다 무서운 것은 그 아래 빽빽한 서명들이다."
 lam_facx.0303.a: "청원을 귀담아듣는다"
 lam_facx.0303.b: "연판장을 돌려보낸다"
 lam_facx.0304.t: "결투 신청"
 lam_facx.0304.d1: "[lam_x_rival.GetFirstName]과(와) [lam_x_rival2.GetFirstName]이(가) 결투로 시비를 가리겠다며 허락을 청했다."
 lam_facx.0304.d2: "두 파벌 수장이 장갑을 던졌다. 이제 내 허락만 남았다. 궁정은 벌써 판돈을 걸고 있다."
 lam_facx.0304.d3: "\"폐하, 칼로 끝내게 해 주십시오.\" [lam_x_rival.GetFirstName]의 말에 [lam_x_rival2.GetFirstName]도 고개를 끄덕였다."
 lam_facx.0304.a: "결투를 허락한다"
 lam_facx.0304.b: "결투를 금한다"
 lam_facx.0305.t: "줄서기"
 lam_facx.0305.d1: "궁정 사람들이 [lam_x_rival.GetFirstName]의 파벌에만 몰린다. 반면 [lam_x_rival2.GetFirstName] 쪽은 쓸쓸하다. 균형이 무너지고 있다."
 lam_facx.0305.d2: "한쪽으로 기운 저울은 언젠가 넘어진다. 작은 파벌을 키워 줄 때인가, 아니면 흐름에 맡길 때인가."
 lam_facx.0305.a: "약한 쪽을 밀어준다"
 lam_facx.0305.b: "흐름에 맡긴다"
 lam_facx.0001.c_tt: "술자리의 말실수를 붙잡을 수도 있다 (35% 확률로 약점)."
 lam_facx.0003.c_tt: "[lam_x_rival.GetFirstName]의 파벌로 옮겨 핵심이 된다 (2년간 묶인다)."
 lam_facx.0004.b_tt: "파벌의 핵심 구성원이 된다."
 lam_facx.0101.a_tt: "[lam_x_new.GetFirstName]이(가) 우리 파벌의 핵심 구성원이 된다 (2년간 묶인다)."
 lam_facx.0101.b_tt: "[lam_x_new.GetFirstName]이(가) 우리 파벌의 지지자가 된다 (1년간 묶인다)."
 lam_facx.0104.a_tt: "[lam_x_mate.GetFirstName]은(는) 파벌에서 쫓겨난다."
 lam_facx.0104.b_tt: "절반의 확률로 [lam_x_rival.GetFirstName]의 약점을 쥔다."
 lam_facx.0203.ok: "두 수장이 마지못해 악수를 나눴다."
 lam_facx.0203.fail: "중재는 실패했고, 둘 다 나를 원망한다."
 lam_facx.0302.found: "투서는 사실이었다."
 lam_facx.0302.nothing: "아무것도 나오지 않았다. [lam_x_rival.GetFirstName]은(는) 조사받은 것을 안다."
 lam_facx.0304.a_win: "[lam_x_rival.GetFirstName]이(가) 이겼다."
 lam_facx.0304.b_win: "[lam_x_rival2.GetFirstName]이(가) 이겼다."
 lam_fac_clash_spoils_heir_tt: "후계를 둔 다툼: 편을 들어 준 쪽의 후보에 힘이 실리고(주군 총애 +10 추가), 진 쪽은 흔들린다(결속 −5)."
 lam_fac_clash_spoils_face_tt: "체면을 건 다툼: 편을 들어 준 쪽이 위신을 얻고 진 쪽은 잃으며, 진 쪽 사람 하나가 이긴 쪽으로 넘어간다."
 lam_faction.3010.why_heir: "\n\n#weak 시작은 누구를 다음 군주로 밀 것인가였다.#!"
 lam_faction.3010.why_council: "\n\n#weak 시작은 자문회 자리 하나였다.#!"
 lam_faction.3010.why_crown: "\n\n#weak 시작은 왕권을 대하는 태도였다.#!"
 lam_faction.3010.why_old: "\n\n#weak 무엇에서 시작됐는지는 이제 아무도 정확히 기억하지 못한다.#!"
 lam_faction.3000.why_head: "\n\n#weak 이유: 나와의 사이가 틀어졌다. 설득이 어렵다.#!"
 lam_faction.3000.why_other: "\n\n#weak 이유: 다른 쪽이 더 끌린다.#!"
 lam_faction.3000.why_tired: "\n\n#weak 이유: 파벌 일에 지쳤다. 마음만 잡아 주면 된다.#!"
 lam_fac_pr_council: "자문회 자리 하나 — 우리 파벌 수장이나 구성원이 주군의 자문회에 앉으면 이행"
 lam_fac_pr_marriage: "혼인 — 우리 파벌 사람이 주군의 가족과 혼인하면 이행"
 lam_fac_pr_campaign: "원정 — 주군이 공격 전쟁을 일으키면 이행"
 lam_fac_pr_faith: "신앙 — 주군의 자문회에서 다른 신앙의 자문관이 모두 물러나면 이행"
 lam_fac_pr_no_revoke: "작위 몰수 금지 — 기한 동안 작위를 회수하지 않으면 이행 (한 번이라도 회수하면 즉시 파기)"
 lam_fac_badge_promise_tt: "[Character.MakeScope.Var('lam_fac_promise_by').Char.GetShortUIName]의 약속: [Character.Custom('LamFacPromiseWhat')]\n남은 기한: 약 #high [Character.MakeScope.ScriptValue('lam_fac_promise_left_value')|0]개월#!\n\n#weak 기한 안에 이행되면 총애가 오르고, 어기면 배신으로 남는다. 이행이 불가능해진 경우(자문회가 없는 정부, 혼인할 가족이 없음, 방어 전쟁 중)는 무효로 끝난다. 약속은 파벌당 하나씩만 걸린다.#!"
 lam_fac_promise_due_title: "[lam_pr_lead.GetShortUIName]의 파벌에 한 약속의 기한이 석 달도 남지 않았다: [lam_pr_lead.Custom('LamFacPromiseWhat')]"
 lam_fac_succ_brief_title: "[lam_sb_new.GetShortUIName]이(가) 우리 파벌의 새 수장이 되었다. 약속과 후계 지지는 그대로 이어진다"
 lam_faction.3020.t: "파벌을 이어받다"
 lam_faction.3020.desc: "[lam_sb_old.GetShortUIName]의 뒤를 이어 이제 내가 이 파벌을 이끈다. 이름도, 역사도, 남은 약속도 함께 넘어왔다."
 lam_faction.3020.promise: "\n\n· 주군의 약속: [ROOT.Char.Custom('LamFacPromiseWhat')] (약 [ROOT.Char.MakeScope.ScriptValue('lam_fac_promise_left_value')|0]개월 남음)"
 lam_faction.3020.heir: "\n· 우리가 미는 후계: [ROOT.Char.MakeScope.Var('lam_fac_heir').Char.GetShortUIName]"
 lam_faction.3020.oath: "\n· 주군에게 한 충성 서약이 아직 유효하다"
 lam_faction.3020.grievance: "\n· 주군에 대한 원한이 아직 풀리지 않았다"
 lam_faction.3020.a: "선대의 노선을 잇는다"
 lam_faction.3020.b: "노선을 새로 정한다"
 lam_faction.3020.b_tt: "파벌이 주군을 대할 태도를 지금 다시 고른다. 바꾸면 그에 반대하는 구성원이 생길 수 있다."
 lam_fac_why_awe: "정복자의 위세 앞에 아무도 감히 맞서지 못한다"
 lam_fac_why_faith_hostile: "주군의 신앙이 우리 신앙과 적대한다"
 lam_fac_why_sacrilege: "주군이 같은 신앙을 거스르며 첩을 들였다"
 lam_fac_why_zealot: "신앙파인데 주군의 신앙이 다르다"
 lam_fac_why_parochial: "향토파인데 왕권법이 지방을 짓누른다"
 lam_fac_why_kin: "주군과 한 집안이다"
 lam_fac_why_fear: "#N 불만이 있지만 두려워서 숨죽이고 있다#! (해결된 것이 아니다)"
 lam_fac_why_council: "주군의 자문회에 자리가 있다"
 lam_fac_why_like: "수장이 주군을 좋게 본다"
 lam_fac_why_dislike: "수장이 주군을 싫어한다"
 lam_fac_why_none: "두드러진 까닭 없이, 여러 사정이 엇비슷하다"
 lam_fac_card_next: "#weak 현안:#! [Character.Custom('LamUxCauseShort')]"
 lam_fac_card_next_tt: "#high 궁정에 드러난 움직임#!\n[Character.Custom2('LamUxNext', GetPlayer)]\n[Character.Custom('LamLfPublic')]\n\n#high 남아 있는 불만#![Character.Custom('LamUxCause1')][Character.Custom('LamUxCause2')][Character.Custom('LamUxCause3')][Character.Custom('LamUxRelief')][Character.Custom2('LamUxIntel', GetPlayer)]"
 lam_fac_next_promise: "주군의 약속을 기다린다 ([Character.Custom('LamFacPromiseWhat')])"
 lam_fac_next_armed: "#N 들고일어났다#!"
 lam_fac_next_hiding: "숨어서 때를 기다린다"
 lam_fac_next_demand: "주군에게 요구를 꺼내려 한다"
 lam_fac_next_arming: "#N 무장을 준비하고 있다#!"
 lam_fac_next_court: "궁정당으로서 왕권을 떠받친다"
 lam_fac_next_none: "#weak 당장 꾀하는 일은 없다#!"
 lam_fac_vote_weight: "\n\n발언권은 군사력·경제력·신분·궁정 입지·인맥·공헌을 종합한다."
 lam_tk_spy_none_title: "염탐은 성공했지만, 새로 알아낸 것은 없었다"
 lam_tk_spy_quiet_title: "염탐은 소득 없이 끝났다. 다행히 들키지는 않았다"
 lam_fac_raise_merit_tt: "파벌을 위해 세운 공이 있으니 모두가 납득한다 (결속 +2)."
 lam_fac_raise_passed_tt: "[lam_rz_passed.GetShortUIName]은(는) 공을 세우고도 밀렸다고 여긴다."
 lam_faction.2610.e: "공을 세운 자를 나의 후계로 정한다"
 lam_faction.2610.e.tt: "회합에 온 영주 중 파벌을 위해 공을 세운 사람을, 없으면 가장 노련한 사람(외교+관리)을 나의 후계로 지목한다"
 lam_faction.2610.f: "공을 세운 동지를 모두 앞에서 치하한다"
 lam_faction.2610.f.tt: "공을 세운 참석자 한 명을 치하한다: 그 사람의 존경 +20, 결속 +3"
 lam_fac_cof_one: "\n창립 동지: [Character.MakeScope.Var('lam_fac_cof1').Char.GetShortUIName] ([Character.MakeScope.Var('lam_fac_cof1').Char.Custom('LamFacCofWhy')])"
 lam_fac_cof_two: "\n창립 동지: [Character.MakeScope.Var('lam_fac_cof1').Char.GetShortUIName] ([Character.MakeScope.Var('lam_fac_cof1').Char.Custom('LamFacCofWhy')]), [Character.MakeScope.Var('lam_fac_cof2').Char.GetShortUIName] ([Character.MakeScope.Var('lam_fac_cof2').Char.Custom('LamFacCofWhy')])"
 lam_fac_cofwhy_kin: "한 집안"
 lam_fac_cofwhy_friend: "벗"
 lam_fac_cofwhy_liking: "뜻이 맞아서"
 lam_ai_inv_parted_reason: "예전에 좋게 헤어졌다"
 lam_fac_gather_note_unity: "[lam_ga_host.GetShortUIName]의 회합 결의: 결속을 다지기로 했다"
 lam_fac_gather_note_plot: "[lam_ga_host.GetShortUIName]의 회합 결의: 주군에게 맞설 거사를 모의했다"
 lam_fac_gather_note_demand: "[lam_ga_host.GetShortUIName]의 회합 결의: 주군께 올릴 요구를 정했다"
 lam_fac_gather_note_heir: "[lam_ga_host.GetShortUIName]의 회합 결의: 수장의 뒤를 이을 사람을 정했다"
 lam_fac_gather_note_praise: "[lam_ga_host.GetShortUIName]의 회합 결의: 공을 세운 동지를 모두 앞에서 치하했다"
 lam_fac_next_oath: "충성 서약을 지키고 있다 (약 [Character.MakeScope.ScriptValue('lam_fac_oath_left_value')|0]개월 남음): 그동안 왕권에 맞서지 않는다"
 lam_fac_next_sulk: "반대파 구성원들이 1년간 수장의 임무를 거부하고 있다"
 lam_sh_counter_warn_title: "왕의 측근들이 요즘 자주 모인다. 내 힘이 약해진 걸 눈치챈 모양이다"
 lam_fac_backed_won_title: "파벌 금고로 밀었던 [lam_ad_won.GetShortUIName]이(가) 그 자리에 올랐다"
 lam_faction.0100.g: "요구 대신 금을 건넨다"
 lam_faction.0100.g_tt: "파벌 수장에게 금을 건네 요구를 거둬 달라고 한다. 원칙이 걸린 요구(후계·신앙·작위 몰수 금지)는 잘 받아들이지 않는다 (기본 65%, 원칙 문제면 −30, 탐욕스러운 수장이면 +20). 받아들이면 총애 +8, 2년간 같은 요구가 없다. 묵은 원한까지 풀리지는 않는다."
 lam_faction.0100.g_no_tt: "거절하면 요구를 물리친 것으로 여긴다."
 lam_fac_first_win_title: "우리 파벌이 처음으로 주군에게서 무언가를 얻어 냈다"
 lam_fac_rally_thanks_title: "전쟁 동안 왕실 편에 서 준 파벌을 기억한다 (총애 +10)"
 lam_faction.3030.t: "봉기가 끝난 뒤"
 lam_faction.3030.desc: "[lam_rf_cur.GetShortUIName]의 파벌이 일으킨 봉기는 실패로 끝났다. 무기를 내려놓은 그들이 처분을 기다린다. 이 파벌을 어떻게 할지는 이제 내 손에 달렸다."
 lam_faction.3030.a: "봉기를 이끈 [lam_rf_rebel.GetShortUIName]을(를) 지하 감옥에 가둔다"
 lam_faction.3030.b: "당장의 처벌은 유예한다"
 lam_faction.3030.b_tt: "총애 +10, 수장의 감사. 반역의 죄는 기록에서 지워지지 않는다."
 lam_faction.3030.c: "충성 서약을 받고 존속시킨다"
 lam_faction.3030.c_tt: "파벌은 남되, 5년 동안 충성 서약에 묶여 왕권에 맞서지 못한다."
 lam_faction.3030.d: "파벌의 해산을 명한다"
 lam_faction.3030.d_tt: "파벌이 해체된다. 수장은 원한을 품고, 폭정이 늘어난다."
 lam_fac_debug_seize_decision_confirm: "비선실세가 된다 (디버그)"
 lam_fac_task_sulking_tt: "이 인물은 회의 결정에 반발하여 수장의 임무를 거부하고 있다"
 lam_pv_rise_lose: "예상 반대 [Character.MakeScope.Var('lam_pv_rise_pct').GetValue|0]% — 실제 결정은 표결로 확정"
 lam_pv_court_lose: "예상 반대 [Character.MakeScope.Var('lam_pv_court_pct').GetValue|0]% — 실제 결정은 표결로 확정"
