 lam_gn_ev_migrated: "새 군주 아래로 이어짐"
 lam_fac_badge_holding: "#weak 새 군주를 지켜보는 중#!"
 lam_fac_badge_holding_tt: "새 군주가 즉위한 지(또는 이 파벌이 새 궁정에 들어온 지) 6개월이 안 됐다. 그동안은 결집까지만 하고 들고일어나지 않으며, 청원도 미룬다. 밀던 후보가 왕관을 놓친 파벌은 예외다."
 lam_faction.1800.t: "왕명이 내려왔다"
 lam_faction.1800.desc: "[lam_ban_lord.GetTitledFirstName]의 칙령이 낭독되었다. \"오늘부터 군주의 허락 없이 무리를 짓는 것은 반역이다.\" 사람들의 눈이 나에게 쏠린다. 내가 이끄는 파벌도 이제 불법이다.\n\n칙령을 받들어 조용히 흩어질 수도 있다. 그러면 파벌의 이름과 유산은 기록에 남고, 언젠가 다시 일어설 날을 기다릴 수 있다. 아니면 어둠 속으로 들어갈 수도 있다. 겁 많은 자들은 떠나겠지만, 남는 자들은 전보다 단단해진다. 그리고 금지령은 영원하지 않다."
 lam_faction.1800.a: "왕명을 받들어 파벌을 해산한다"
 lam_faction.1800.a_tt: "파벌이 다음 집계 때 해산한다. 유산(전통·명망)은 남아 나중에 다시 세울 때 이어받을 수 있다. 계보에는 '금지령에 따라 해산'으로 남는다. 주군이 나를 좋게 본다 (+15, 5년)."
 lam_faction.1800.b: "지하로 숨는다"
 lam_faction.1800.b_tt: "파벌이 지하로 들어간다. 동조자와 협력자는 떠나고 핵심만 남는다. 나와 핵심은 '금지된 파벌' 범죄 비밀을 안는다. 주군은 이 파벌의 수장이 나라는 것을 알지만, 누가 남았는지는 모른다. 나는 '지하 연락망'을 얻는다 (주군을 노리는 계략 성공률 +10%). 금지령이 끝날 때까지 버티면 '박해를 견딘 파벌'로 돌아온다 (결속·위신·명망, 구성원의 신망)."
 lam_faction.1810.t: "왕명으로 파벌이 금지되었다!"
 lam_faction.1810.desc: "[lam_ban_lord.GetTitledFirstName]의 칙령이 궁정에 내려졌다. 군주의 허락 없이 무리를 짓는 것은 이제 반역이다. 내가 몸담은 [lam_ban_lead.GetShortUIName]의 파벌도 예외가 아니다.\n\n"
 lam_faction.1810.obey: "수장은 왕명을 받들어 파벌을 해산하기로 했다. 우리는 이제 각자의 길을 간다."
 lam_faction.1810.stay: "수장은 지하로 숨기로 했다. 겁 많은 자들은 떠났지만 나는 핵심으로 남았다. 이제부터 나는 범법자다."
 lam_faction.1810.cut: "수장은 지하로 숨기로 했다. 하지만 나는 그 안쪽에 들지 못했다. 파벌은 나 없이 어둠 속으로 들어갔고, 나는 1년 동안 어느 파벌에도 들 수 없다."
 lam_faction.1810.wait: "수장이 아직 답을 내리지 않았다. 흩어질지, 숨을지."
 lam_faction.1810.a: "알겠다"
 lam_fac_ban_obeyed_title: "[lam_ban_lead.GetShortUIName](이)가 왕명을 받들어 파벌을 해산했다"
 lam_fac_ban_defied_title: "[lam_ban_lead.GetShortUIName]의 파벌이 해산하지 않고 지하로 숨었다"
 lam_fac_ban_obeyed_member_title: "수장이 왕명을 받들어 파벌을 해산했다"
 lam_fac_ban_stay_member_title: "수장이 지하로 숨었다. 나는 핵심으로 남았다"
 lam_fac_ban_cut_member_title: "수장이 지하로 숨었다. 나는 그 안쪽에 들지 못했다"
 lam_fac_obeyed_opinion: "왕명을 받들어 파벌을 해산했다"
 lam_fac_endured_opinion: "금지령 아래서 파벌을 지켜 냈다"
 lam_fac_ug_born_title: "금지령 아래 세운 파벌은 처음부터 지하 파벌이다. 주군은 아직 이 파벌이 있는 줄도 모른다"
 lam_fac_ug_born_founder_title: "내가 세운 파벌이 지하에서 출범했다. 주군은 아직 그런 파벌이 있는 줄도 모른다"
 lam_fac_surfaced_head_title: "금지령이 끝났다. 우리 파벌은 박해를 견디고 다시 모습을 드러냈다"
 lam_fac_surfaced_member_title: "금지령이 끝났다. 박해를 견딘 우리 파벌이 다시 모습을 드러냈다"
 lam_fac_surfaced_lord_title: "금지령 아래 숨어 있던 파벌이 다시 모습을 드러냈다"
 lam_fac_tl_surfaced: "금지령을 견디고 다시 드러났다"
 lam_fac_badge_endured: "#P 박해를 견딤#!"
 lam_fac_badge_endured_tt: "금지령 아래 지하에서 버텨 내고 돌아온 파벌이다. 돌아올 때 결속 +15, 수장 위신, 명망 +5를 얻었고, 구성원들이 수장을 더 믿는다 (+15, 3년). 이 표시는 5년 동안 붙는다."
 lam_fac_card_intel: "#weak 드러난 정도:#! [Character.Custom('LamFacIntel')]"
 lam_fac_card_intel_tt: "숨어 있는 지하 파벌은 주군의 밀정이 캐낸 만큼만 남에게 보인다. 낌새만 들킨 파벌은 물음표 카드로, 수장이 드러난 파벌은 구성원이 '?'로 보인다. 핵심까지 드러나면 핵심이 보이고, 모두 드러나면 전부 보인다. 구성원의 '금지된 파벌' 비밀이 들키거나, 정체가 폭로되거나, 누가 밀고·자수하거나, 주군이 '지하 조직을 캔다'로 파고들면 더 드러난다. 수장은 '흔적을 지운다'로 한 단계 되돌릴 수 있다. 이 파벌의 구성원에게는 언제나 전부 보인다. 지하에서 나와 드러내 놓고 움직이는 파벌은 구성원이 모두 보인다."
 lam_fac_intel_0: "#P 아직 아무것도 안 드러남#!"
 lam_fac_intel_1: "#P 낌새만 들킴#!"
 lam_fac_intel_2: "#high 수장이 드러남#!"
 lam_fac_intel_3: "#N 핵심까지 드러남#!"
 lam_fac_intel_4: "#N 모두 드러남#!"
 lam_fac_veil_title: "#N 정체불명의 지하 파벌#!"
 lam_fac_veil_lead: "#weak 수장#! ?"
 lam_fac_veil_members: "#weak 구성원#! ?"
 lam_fac_veil_q: "?"
 lam_fac_veil_desc: "#weak 밀정들이 궁정 어딘가에서 금지된 모임이 열린다는 낌새를 잡았다. 누가 이끄는지, 누가 드나드는지는 아직 모른다. '지하 조직을 캔다' 결단으로 더 파고들 수 있다.#!"
 lam_fac_mrow_veiled: "#weak ? — 아직 정체를 모르는 일원#!"
 lam_fac_mrow_veiled_tt: "이 파벌에 누군가 더 있다는 것까지는 안다. 누구인지는 더 캐내야 드러난다."
 lam_fac_ug_dig_decision: "지하 조직을 캔다"
 lam_fac_ug_dig_decision_tooltip: "지하 조직을 캔다"
 lam_fac_ug_dig_decision_desc: "금지령은 무리를 없애지 못한다. 어둠 속으로 밀어 넣을 뿐이다. 밀정들에게 돈을 쥐여 주고 궁정의 밤을 뒤지게 한다. 첩보관의 계략이 높을수록 잘 찾아낸다. 찾아낸 만큼 파벌창에 드러나고, 수장과 핵심의 범죄 비밀도 손에 들어온다."
 lam_fac_ug_dig_decision_tt: "지하 파벌 하나를 골라 한 단계 더 캐낸다 (성공률 35% + 첩보관 계략×3, 20~90%. 흔적을 지운 파벌이면 절반). 아무것도 못 찾을 수도 있다. 숨은 파벌이 없어서인지, 못 찾은 것인지는 알 수 없다."
 lam_fac_ug_dig_cd_tt: "1년에 한 번만 캘 수 있다"
 lam_fac_dig_named_title: "밀정들이 [lam_dig_lead.GetShortUIName]의 지하 파벌을 캐냈다"
 lam_fac_dig_rumour_title: "밀정들이 궁정 어딘가에 지하 파벌이 있다는 낌새를 잡았다"
 lam_fac_dig_none_title: "밀정들이 아무것도 건지지 못했다"
 lam_fac_dig_watched_title: "주군의 밀정들이 우리 파벌의 꼬리를 밟았다"
 lam_fac_ug_cover_decision: "흔적을 지운다"
 lam_fac_ug_cover_decision_tooltip: "흔적을 지운다"
 lam_fac_ug_cover_decision_desc: "모임 장소를 옮기고, 입이 가벼운 자에게 돈을 쥐여 주고, 편지를 태운다. 주군의 밀정이 잡은 끈을 끊어 놓는다."
 lam_fac_ug_cover_decision_tt: "주군이 아는 단계가 하나 내려간다. 2년 동안 밀정이 끈을 놓쳐서, 들킨 비밀로도 단계가 오르지 않고 '지하 조직을 캔다'의 성공률도 절반이 된다."
 lam_fac_ug_cover_cd_tt: "2년에 한 번만 할 수 있다"
 lam_fac_ug_cover_need_tt: "주군이 우리 파벌에 대해 무언가를 알고 있다 (전부 들킨 뒤에는 지울 흔적이 없다)"
 lam_fac_ug_recruit_interaction: "비밀리에 끌어들인다"
 lam_fac_ug_recruit_interaction_desc: "주군에게 앙심을 품은 사람을 밤에 찾아가 우리 지하 파벌로 끌어들인다. 받아들이면 범법자가 되어 함께하고, 새 사람이 들 때마다 들킬 위험이 조금씩 는다. 거절한 사람이 주군을 따르는 자라면 그 길로 고해바칠 수도 있다."
 lam_fac_ug_recruit_yes_tt: "상대가 우리 지하 파벌에 든다 (10% 확률로 내 비밀이 주군에게 새어 나간다)."
 lam_fac_ug_recruit_no_tt: "상대가 주군을 따르는 자라면 절반의 확률로 고해바친다. 그러면 내 비밀이 드러나고, 주군이 우리 파벌을 한 단계 더 알게 된다."
 lam_fac_ug_recruit_loyal_reason: "주군을 따른다"
 lam_fac_ug_recruit_grudge_reason: "주군에게 앙심이 있다"
 lam_fac_ug_recruit_bold_reason: "야심·복수심·열성"
 lam_fac_ug_recruit_craven_reason: "겁이 많다"
 lam_fac_ug_told_title: "[recipient.GetShortUIName](이)가 거절하고 주군에게 고해바쳤다"
 lam_fac_ug_silent_title: "[recipient.GetShortUIName](이)가 거절했지만, 입은 다물겠다고 했다"
 lam_fac_ug_confess_interaction: "자수하고 털어놓는다"
 lam_fac_ug_confess_interaction_desc: "지하 파벌에서 손을 떼고 주군 앞에 나아가 모든 것을 털어놓는다. 죄는 사면되지만, 주군은 우리 파벌의 핵심까지(내가 핵심이었다면 전부) 알게 된다. 수장은 나를 배신자로 여기고, 나는 '밀고자'라는 비밀을 안게 된다."
 lam_fac_ug_confess_tt: "파벌을 떠나고 범법자에서 벗어난다. 주군이 우리 파벌을 핵심까지(내가 핵심이었다면 전부) 알게 된다. 수장이 나를 배신자로 여긴다 (−35). 3년 동안 어느 파벌에도 들 수 없다."
 lam_fac_ug_network_modifier: "지하 연락망"
 lam_fac_ug_network_modifier_desc: "숨을 집, 편지를 나르는 사람, 신세를 진 사람들. 지하 파벌의 수장은 주군을 노리는 계략을 더 잘 꾸민다."
 lam_gn_end_banned: "#N 금지령에 따라 해산#!"
 lam_gn_ev_surfaced: "금지령을 견디고 복권"
 lam_gn_lg_split:0 "갈라짐"
 lam_gn_lg_revived:0 "계승"
