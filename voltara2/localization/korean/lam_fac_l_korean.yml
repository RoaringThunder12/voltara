 lam_fac_tl_founded: "파벌이 섰다"
 lam_fac_tl_succ: "새 수장이 섰다"
 lam_fac_tl_rise: "들고일어났다"
 lam_fac_tl_purge: "숙청을 견뎠다"
 lam_fac_tl_crown: "밀던 후보가 즉위했다"
 lam_fac_tl_betray: "주군에게 배신당했다"
 lam_fac_tl_kept: "약속이 지켜졌다"
 lam_fac_tl_won: "다른 파벌과의 충돌에서 이겼다"
 lam_fac_tl_lost: "다른 파벌과의 충돌에서 졌다"
 lam_fac_tl_deals: "주군과 거래했다"
 lam_fac_tl_underground: "금지령으로 지하에 숨었다"
 lam_fac_tl_pardoned: "사면을 받았다"
 lam_fac_tl_seized: "나라를 손에 쥐었다"
 lam_fac_tl_disgraced: "수장이 매수 사실이 드러나 물러났다"
 lam_fac_tl_legacy: "새 전통이 생겼다"
 lam_fac_tl_revived: "옛 파벌의 뜻을 이었다"
 lam_fac_tl_migrated: "새 군주의 궁정에서 이어졌다"
 lam_fac_tl_allied: "다른 파벌과 우호를 맺었다"
 lam_fac_tl_challenge: "수장이 도전에 밀려났다"
 lam_fac_ally_interaction: "우호를 맺는다"
 lam_fac_ally_interaction_desc: "이 파벌과 우호를 맺는다. 서로 다투지 않고 수장끼리 호감이 오른다(+10). 궁정 현안에서 같은 편이면 받아들이기 쉽고 반대편이면 어렵다. 한쪽이 끊거나, 사이가 틀어지거나, 수장이 바뀌면 끝난다."
 lam_fac_ally_same_heart_reason: "왕권을 대하는 마음이 같다"
 lam_fac_ally_foes_reason: "서로 적대하고 있다"
 lam_fac_ally_same_heir_reason: "같은 후계를 민다"
 lam_fac_break_ally_interaction: "우호를 끊는다"
 lam_fac_break_ally_interaction_desc: "우호를 끊는다. 저쪽은 배신으로 기억하고 원한을 품는다. 우리 파벌도 조금 흔들린다."
 lam_fac_poach_interaction: "우리 쪽으로 끌어온다"
 lam_fac_poach_interaction_desc: "접촉비 10금화로 후보와 협상을 시작한다. 수락 시 별도의 지원금을 실제 지급한다. 기존 수장도 대가를 내고 붙잡을 수 있다."
 lam_fac_poach_loyal_reason: "지금 수장을 좋게 본다"
 lam_fac_poach_greedy_reason: "탐욕스럽다"
 lam_fac_poach_found_title: "[lam_po_old.GetShortUIName]의 파벌이 우리가 사람을 빼 간 것을 알아챘다"
 lam_fac_smear_interaction: "모함한다"
 lam_fac_smear_interaction_desc: "상대 파벌 수장의 나쁜 소문을 퍼뜨린다. 성공하면 주군이 그 수장을 나쁘게 보고, 그 파벌의 호의와 결속이 떨어진다. 실패하면 우리 파벌의 호의가 떨어지고 그 수장과 라이벌이 된다."
 lam_fac_smear_interaction_tt: "성공 확률은 나와 상대의 계책 수치에 달려 있다."
 lam_fac_smear_cd_tt: "최근에 모함했다 (3년)"
 lam_fac_smear_yes_title: "[recipient.GetShortUIName]의 추문이 퍼졌다"
 lam_fac_smear_no_title: "[recipient.GetShortUIName](을)를 모함한 일이 들통났다"
 lam_fac_challenge_interaction: "재신임 투표를 요구한다"
 lam_fac_challenge_interaction_desc: "수장을 계속 믿을지 파벌 회의에 묻는다. 신임을 잃으면 내가 수장 자리를 이어받고, 신임을 얻으면 수장의 자리가 오히려 단단해진다. 재신임 투표는 5년에 한 번만 열 수 있다."
 lam_fac_challenge_interaction_tt: "파벌 회의의 투표로 정해진다. 파벌 분위기가 좋으면 수장이 신임을 얻는다."
 lam_fac_challenge_weak_tt: "수장이 흔들리고 있다 (결속 40 미만, 몫 독차지, 혹은 정체 탄로)"
 lam_fac_challenge_yes_title: "핵심이 내 편에 섰다. 이제 내가 이 파벌의 수장이다"
 lam_fac_challenge_no_title: "핵심은 [lam_ch_old.GetShortUIName] 곁에 남았다. 나는 쫓겨났다"
 lam_fac_inform_interaction: "주군에게 밀고한다"
 lam_fac_inform_interaction_desc: "우리 파벌의 속내를 주군에게 넘긴다. 주군은 우리 수장에게 구실을 얻고, 나는 금화와 주군의 신임을 얻는다. 다만 '밀고자'라는 비밀이 생기고, 그것이 드러나면 파벌에서 쫓겨난다."
 lam_fac_inform_interaction_tt: "실제 비밀이나 현재의 비공개 방침을 보고한다. 같은 정보는 재보상하지 않으며 구실을 자동 생성하지 않는다."
 lam_fac_inform_cd_tt: "최근에 밀고했다 (5년)"
 lam_secret_informer: "밀고자"
 lam_secret_informer_desc: "자기 파벌의 속내를 주군에게 넘겼다"
 lam_fac_poached_opinion: "사람을 빼 갔다"
 lam_fac_smeared_opinion: "나쁜 소문"
 lam_fac_informer_opinion: "귀한 정보를 가져왔다"
 lam_fac_mediated_opinion: "중재해 주었다"
 lam_fac_meddled_opinion: "쓸데없이 끼어들었다"
 lam_fac_bid_decision: "파벌들의 구애를 받는다"
 lam_fac_bid_decision_desc: "나는 어느 파벌에도 속하지 않았다. 그것만으로도 내 몸값이 된다. 파벌들이 무엇을 내미는지 들어 본다."
 lam_fac_bid_decision_tooltip: "파벌들의 구애를 받는다"
 lam_fac_bid_cd_tt: "최근에 구애를 받았다 (5년)"
 lam_faction.1500.t: "구애"
 lam_faction.1500.desc: "소문이 돌자마자 사람들이 찾아왔다. 하나같이 같은 말이다. 우리와 함께하자고. 그리고 하나같이 빈손이 아니었다."
 lam_faction.1500.o1: "[lam_bd_1.GetShortUIName]의 파벌에 든다 (금화 [lam_bd_1.MakeScope.Var('lam_bd_gold').GetValue|0])"
 lam_faction.1500.o2: "[lam_bd_2.GetShortUIName]의 파벌에 든다 (금화 [lam_bd_2.MakeScope.Var('lam_bd_gold').GetValue|0])"
 lam_faction.1500.o3: "[lam_bd_3.GetShortUIName]의 파벌에 든다 (금화 [lam_bd_3.MakeScope.Var('lam_bd_gold').GetValue|0])"
 lam_faction.1500.x: "모두 돌려보낸다 — 나는 누구의 사람도 아니다"
 lam_fac_mediate_decision: "파벌 사이를 중재한다"
 lam_fac_mediate_decision_desc: "어느 편도 아닌 내가 서로 으르렁대는 두 파벌 사이에 선다. 성공하면 두 파벌 모두와 주군이 나를 좋게 보고, 나는 '중립의 목소리'라는 평판을 얻는다. 실패하면 양쪽 모두 쓸데없이 끼어들었다고 여긴다."
 lam_fac_mediate_decision_tooltip: "파벌 사이를 중재한다"
 lam_fac_mediate_cd_tt: "최근에 중재했다 (3년)"
 lam_faction.1600.t: "두 파벌 사이에서"
 lam_faction.1600.desc: "[lam_md_a.GetTitledFirstName]의 사람들과 [lam_md_b.GetTitledFirstName]의 사람들이 한 방에 있다. 방 안 공기가 칼날 같다. 내가 입을 열면 분위기가 바뀔 수도 있고, 둘 다 나를 겨눌 수도 있다."
 lam_faction.1600.a: "둘 사이에 선다"
 lam_faction.1600.a_tt: "성공 확률: #V [ROOT.Char.MakeScope.Var('lam_md_chance').GetValue|0]%#! (내 외교, 중재 평판). 성공하면 두 파벌의 다툼이 풀리고 위신과 양쪽·주군의 호감을 얻는다."
 lam_faction.1600.x: "끼어들지 않는다"
 lam_fac_mediate_yes_title: "중재가 성공했다. 두 파벌이 칼을 거두었다"
 lam_fac_mediate_no_title: "중재는 실패했다. 양쪽 모두 나를 곱게 보지 않는다"
 lam_fac_head_rise_decision: "파벌을 일으킨다"
 lam_fac_head_rise_decision_desc: "말로는 더 이상 안 된다. 우리 파벌의 이름으로 주군에게 맞선다. 명분에 맞는 요구를 내걸고, 그럴 길이 없으면 공공연히 불복한다."
 lam_fac_head_rise_decision_tooltip: "파벌을 일으킨다"
 lam_fac_head_rise_decision_tt: "명분에 맞는 요구를 내건다: 주장자 옹립, 독립, 권한 축소가 기본이고, 일본·중국에서는 주군 복권·섭정 교체·제국 정책·국가 분열처럼 그 나라의 방식으로 나선다. 분리 성향(소수파·향토파·다른 문화)은 독립과 분열을 먼저 찾는다. 요구가 거절되면 전쟁으로 번질 수 있다. 길이 없으면 공공연한 불복(세금·징집병을 덜 바침)이 된다. 핵심과 측근이 함께 서고, 나머지 구성원은 저마다 동참 여부를 정한다. 봉기하면 5년간 다시 일어날 수 없다."
 lam_fac_rise_cd_tt: "최근에 봉기하지 않았다 (봉기 뒤 5년, 봉기안 부결 뒤 3년)"
 lam_fac_rise_cause_tt: "명분이 있다: 파벌의 원한, 주군의 냉대(총애 -20 이하), 또는 파벌 금지령"
 lam_fac_rise_blocked_tt: "패전 등으로 내려진 파벌 결성 금지가 풀려 있다"
 lam_fac_need_standing_tt: "파벌원이 3명 이상인 파벌만 명망과 유산을 쌓는다"
 lam_fac_detail_traditions: "전통"
 lam_fac_detail_traditions_tt: "전통은 사는 것이 아니다. 파벌이 겪어 온 일이 쌓여 생긴다. 괄호 안의 수가 그 역사이고, 2·4·7에 이르면 한 단계씩 오른다. 한 번 생긴 전통은 사라지지 않고, 수장이 바뀌어도 이어진다. 파벌원 3명 이상인 파벌만 전통이 자란다."
 lam_fac_tl_void: "주군이 바뀌어 약속이 무효가 되었다"
 lam_fac_tl_scheme: "지하에서 움직였다"
 lam_faction.0800.void: "\n· 약속한 주군이 바뀌어 무효가 된 약속: [ROOT.Char.MakeScope.Var('lam_dig_void').GetValue|0] (가장 최근: [ROOT.Char.MakeScope.Var('lam_dig_void_who').Char.GetShortUIName]의 파벌). 배신은 아니니, 다시 청해 올 수 있다."
 lam_faction.0800.scheme: "\n· 지하 파벌의 공작(비방문, 빼돌린 금화): [ROOT.Char.MakeScope.Var('lam_dig_scheme').GetValue|0] (가장 최근: [ROOT.Char.MakeScope.Var('lam_dig_scheme_who').Char.GetShortUIName]의 파벌)"
 lam_fac_ban_upkeep_modifier: "파벌 금지령의 대가"
 lam_fac_ban_upkeep_modifier_desc: "밀정에게 줄 돈, 눈을 마주치지 않는 궁정. 금지령이 서 있는 동안 계속된다."
 lam_fac_detail_ctrl: "국정 장악 기반 [Character.MakeScope.ScriptValue('lam_pol_ctrl_count_value')|0]/6"
