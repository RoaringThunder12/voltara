 puppet_action_description_lam_pa_claim_throne: "꼭두각시 군주의 이름으로 왕위를 주장한다"
 puppet_action_description_lam_pa_fabricate_hook: "꼭두각시 군주의 이름으로 약점을 만든다"
 puppet_action_description_lam_pa_grant_independence: "꼭두각시 군주의 봉신에게 독립을 준다"
 puppet_action_description_lam_pa_purchase_truce: "꼭두각시 군주의 이름으로 휴전을 산다"
 puppet_action_description_lam_pa_invite_activity: "꼭두각시 군주의 이름으로 활동에 초대한다"
 puppet_action_description_lam_pa_gift: "꼭두각시 군주의 이름으로 선물한다"
 lam_puppet_master_opinion: "나를 손에 쥔 자"
 lam_sh_lost_title: "왕좌 뒤의 실권을 잃었다"
 lam_ult_puppet_no_title: "주군이 꼭두각시가 되기를 거부했다 — 봉기한다"
 lam_rs_rise: "곧장 봉기한다"
 lam_rs_rise_desc: "파벌이 주군에게 맞서 일어난다."
 lam_rs_puppet: "마지막 밤: 꼭두각시가 되라고 요구한다"
 lam_rs_puppet_desc: "주군이 받아들이면 싸우지 않고 왕좌 뒤의 실권을 쥔다. 받아들일 확률: #high [actor.MakeScope.ScriptValue('lam_fac_ult_puppet_chance_value')|0]%#! (파벌 세력, 왕권, 주군의 기질에 따라). 거부하면 그대로 봉기한다."
 lam_faction.2900.t: "왕좌 뒤의 실권"
 lam_faction.2900.desc: "[lam_sh_king.GetShortUIName]은(는) 이제 이름뿐인 군주다. 이 나라를 움직이는 것은 나다."
 lam_faction.2900.a: "이제 이 나라는 내 것이다"
 lam_faction.2900.a.tt: "음모 창의 꼭두각시 목록에서 군주의 이름으로 작위 회수·하사, 후계 지명, 봉신 계약, 선전포고·동맹, 투옥·처형 등을 할 수 있다. 군주를 우클릭하면 군주의 자문회를 마음대로 채울 수 있고(나 자신도), 내 초상화를 우클릭하면 궁정 직위를 원하는 만큼 맡을 수 있다. 군주는 나를 거스르지 못하고(호감 +100), 내 파벌에 아무것도 요구하지 않으며, 제멋대로 전쟁을 벌이면 내 승인을 받아야 한다. 파벌 세력이 궁정의 35% 아래로 떨어지면 끈이 끊어진다."
 lam_faction.2910.t: "꼭두각시의 전쟁"
 lam_faction.2910.desc: "[lam_sw_king.GetShortUIName]이(가) 내 허락도 없이 전쟁을 선포했다."
 lam_faction.2910.a: "그대로 둔다"
 lam_faction.2910.b: "당장 거두게 한다 (백지 평화)"
 lam_sh_council_interaction: "군주의 자문회에 앉힌다"
 lam_sh_council_interaction_desc: "꼭두각시 군주의 자문회 자리에 이 사람을 앉힌다. 원래 있던 사람은 물러난다. 나 자신도 앉을 수 있다."
 lam_sh_council_tt: "꼭두각시 군주의 이름으로 자문회 자리가 바뀐다"
 lam_ss_chancellor: "재상"
 lam_ss_marshal: "원수"
 lam_ss_steward: "재무관"
 lam_ss_spymaster: "첩보관"
 lam_ss_chaplain: "궁정 사제"
 lam_sh_office_interaction: "궁정 직위를 맡는다"
 lam_sh_office_interaction_desc: "꼭두각시 군주의 궁정에서 원하는 직위를 맡는다. 여러 개도 맡을 수 있다."
 lam_sh_office_tt: "꼭두각시 군주의 궁정 직위를 맡는다 (궁정에 그 직위를 둘 수 없으면 아무 일도 없다)"
