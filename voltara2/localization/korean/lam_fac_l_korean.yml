 lam_fac_promise_kind_tt: "이 요구는 약속으로 유예할 수 있다 (자리, 원정, 신앙 회의, 몰수 금지)"
 NOT_lam_fac_promise_kind_tt: "이 요구는 약속으로 유예할 수 없다"
 NOT_lam_fac_liar_tt: "두 번이나 약속을 어겼다. 지금은 아무도 내 약속을 믿지 않는다"
 lam_fac_nm_dead: "[Character.GetFirstNameNoTooltip]의 옛 파벌"
 lam_fac_cp_broken_title: "[lam_cp_lead.GetFirstNameNoTooltip]의 파벌이 궁정당의 자리를 잃었다"
 lam_fac_cp_broken_desc: "사이가 너무 멀어졌다. 이제 이들은 왕의 손발이 아니라 그저 여러 파벌 가운데 하나다. 명을 내릴 수 없고, 2년 동안은 다시 궁정당이 되지 않는다."
 lam_fac_cp_rift_hint: "궁정당이라도 주군과 크게 틀어지면 그 자리를 잃는다: 파벌의 마음 -25 이하, 봉기, 수장→주군 의견 -40 이하, 주군→수장 의견 -50 이하, 호의 -20 이하, 또는 이 주군이 저지른 부당한 일(죄 없는 수장·핵심의 투옥, 깨진 약속, 5년). 다른 파벌과의 다툼이나 거절된 청원만으로는 잃지 않는다."
 lam_gn_ev_cp_broken: "주군과 틀어져 궁정당 지위 상실"
 lam_fac_badge_cpbroken: "#N 궁정당 지위 상실#!"
 lam_fac_badge_cpbroken_tt: "주군과 크게 틀어져 궁정당 자리를 잃었다. 지금은 여느 파벌이고, 명을 받지 않으며, 2년 동안은 다시 궁정당이 되지 않는다."
