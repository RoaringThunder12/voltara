 lam_faction.0800.news_head: "\n\n#high 이웃 나라 소식#!"
 lam_faction.1700.t: "마지막 밤"
 lam_faction.1700.desc: "자정이 넘어 성문 밖이 횃불로 밝아졌다. [lam_ult_lead.GetTitledFirstName](이)가 무장한 사람들을 이끌고 와 있었다. 전령이 전한 말은 짧았다. 오늘 밤 안에 답이 없으면, 날이 밝는 대로 깃발이 오른다."
 lam_faction.1700.why: "\n\n#weak 이들을 여기까지 몰고 온 것:#! [lam_ult_lead.Custom('LamFacNerve1')][lam_ult_lead.Custom('LamFacNerve2Sep')]"
 lam_faction.1700.past.wronged: "\n\n#italic 횃불 아래 얼굴들 가운데 몇은, 내가 가두었던 이들의 형제다.#!"
 lam_faction.1700.past.spurned: "\n\n#italic 이들이 밀던 후보는 왕관을 받지 못했다. 오늘 밤은 그 빚을 받으러 온 것이다.#!"
 lam_faction.1700.past.betrayed: "\n\n#italic 내가 깬 약속을 이들은 한 글자도 잊지 않았다.#!"
 lam_faction.1700.ask: "\n\n재상이 낮게 물었다. \"어떻게 하시겠습니까?\""
 lam_faction.1700.a: "요구를 들어준다"
 lam_faction.1700.a_tt: "위신을 잃는다. 대신 이 파벌의 호의가 크게 오르고 원한이 풀리며, 2년 동안 기세가 25 가라앉는다."
 lam_faction.1700.b: "금으로 서약을 산다"
 lam_faction.1700.b_tt: "큰 금화를 내밀어 5년 충성 서약을 산다(2년 동안 기세 −25). 탐욕스러운 수장은 받기 쉽고, 야심가·복수심 강한 수장, 내게 부당한 일을 당한 파벌은 거절하기 쉽다. 거절당하면 금은 그대로지만 이들은 날이 밝는 대로 일어난다."
 lam_faction.1700.c: "수장을 붙잡는다"
 lam_faction.1700.c_tt: "깃발이 오르기 전에 수장을 붙잡아 옥에 가둔다. 공포가 높을수록, 내 무용이 뛰어날수록, 궁정당이 있을수록 성공하기 쉽고, 파벌이 클수록 어렵다. 성공해도 폭정이 오르고 이 파벌은 숙청의 원한을 품는다. 실패하면 위신을 잃고 이들은 곧바로 일어난다."
 lam_faction.1700.d: "오라고 해라"
 lam_faction.1700.d_tt: "타협은 없다. 위신을 조금 얻고, 이들은 날이 밝는 대로 일어난다."
 lam_fac_ult_oath_yes: "[lam_ult_lead.GetFirstName](은)는 금을 받고 서약했다. 횃불이 하나둘 꺼졌다"
 lam_fac_ult_oath_no: "[lam_ult_lead.GetFirstName](은)는 금을 내던졌다. 날이 밝으면 깃발이 오른다"
 lam_fac_ult_arrest_yes: "[lam_ult_lead.GetFirstName](이)가 사슬에 묶였다. 성문 밖 횃불이 흩어졌다"
 lam_fac_ult_arrest_no: "[lam_ult_lead.GetFirstName](을)를 붙잡지 못했다. 그들이 일어선다"
