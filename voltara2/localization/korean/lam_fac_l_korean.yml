 lam_faction.2200.t: "주군의 경고"
 lam_faction.2200.desc: "[lam_cpw_lord.GetShortUIName]이(가) 나를 불렀다. 궁정당이라는 자들이 주군에게 등을 돌리고 있다는 말이 돈다고 했다. 이대로라면 반년 안에 궁정당의 자리를 거두겠다는 것이다."
