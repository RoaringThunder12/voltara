 lam_faction.2000.t: "함께하자는 청"
 lam_faction.2000.desc: "[lam_inv_head.GetShortUIName]이(가) 사람을 보내왔다. #high [lam_inv_head.Custom('LamFacName')]#!에 함께하자는 것이다. 같은 것을 바라는 사람들이 모이면 주군도 귀를 기울인다는 말과 함께였다.\n\n#weak 수락하면 이 파벌의 협력자가 된다. 사양하면 3년 동안은 다시 청하지 않는다.#!"
 lam_faction.2000.a: "함께한다"
 lam_faction.2000.b: "정중히 사양한다"
 lam_fac_merged_away_title: "몸담았던 파벌이 다른 파벌에 합쳐졌다. 따라갈지는 직접 정해야 한다"
 lam_ai_fac_strong_reason: "수장보다 강한 세력"
 lam_ai_fac_useful_reason: "쓸모 있는 세력"
 lam_ai_fac_weak_reason: "보탬이 안 될 만큼 약함"
 lam_ai_fac_cause_reason: "같은 뜻을 품음"
 lam_ai_fac_rival_reason: "수장의 경쟁자"
 lam_ai_fac_spy_reason: "주군의 평의원 (첩자일지도)"
 lam_ai_inv_stronger_reason: "수장의 세력이 훨씬 크다"
 lam_ai_inv_weaker_reason: "수장보다 내가 강하다"
 lam_ai_inv_standing_reason: "궁정에서 무게 있는 파벌"
 lam_ai_inv_small_reason: "아직 사람이 적은 파벌"
 lam_ai_inv_cause_reason: "같은 뜻을 품음"
 lam_ai_inv_against_crown_reason: "주군에게 충성하는데 반주군 파벌이다"
 lam_ai_inv_for_crown_reason: "주군에게 불만인데 친주군 파벌이다"
 lam_ai_inv_renown_reason: "이름난 파벌"
 lam_ai_inv_content_reason: "정치에 관심 없음"
 lam_ai_inv_ambitious_reason: "야심가"
 lam_fac_back_heir_interaction: "파벌이 이 사람을 후계로 민다"
 lam_fac_back_heir_interaction_desc: "내 파벌이 다음 군주로 밀 사람을 정한다. 이미 밀던 사람이 있으면 파벌 회의가 열린다."
 lam_fac_back_heir_interaction_tt: "후보 지지를 파벌회의에 제안한다. 가결된 뒤에만 지지 후보가 바뀐다."
 lam_fac_back_heir_locked_tt: "주군과의 거래로 후계 지지가 묶여 있다"
 lam_fac_head_posture_decision: "파벌의 방침을 정한다"
 lam_fac_head_posture_decision_tooltip: "파벌의 방침을 정한다"
 lam_fac_head_posture_decision_desc: "파벌이 주군을 대하는 태도를 수장이 정한다. 구성원의 마음과 어긋나는 방침은 결속을 갉아먹는다."
 lam_fac_head_posture_cd_tt: "방침을 바꾼 지 반년이 지나야 한다"
 lam_fac_head_goal_decision: "파벌이 바라는 것을 정한다"
 lam_fac_head_goal_decision_tooltip: "파벌이 바라는 것을 정한다"
 lam_fac_head_goal_decision_desc: "파벌이 주군에게서 얻어 내려는 것을 수장이 정한다. 이루어지면 파벌은 힘을 얻고, 오래 안 되면 불만이 쌓인다."
 lam_fac_head_confidence_decision: "파벌의 신임을 묻는다"
 lam_fac_head_confidence_decision_tooltip: "파벌의 신임을 묻는다"
 lam_fac_head_confidence_decision_desc: "파벌 회의를 열어 수장 자리를 걸고 신임을 묻는다. 지켜 내면 파벌이 뭉치지만, 반대가 과반이면 수장 자리를 잃는다."
 lam_fac_head_confidence_decision_tt: "파벌 회의가 열린다. 신임을 얻으면 결속 +15, 위신 소량, 구성원 호감 상승. 반대가 과반이면 가장 강한 반대파가 수장이 된다."
 lam_fac_head_confidence_cd_tt: "최근 5년 안에 불신임 회의가 열렸다"
 lam_fac_head_confidence_held_title: "파벌이 수장을 신임했다"
 lam_faction.2100.t: "파벌의 방침"
 lam_faction.2100.desc: "파벌의 주요 인사들이 모였다. 주군을 어떻게 대할지는 결국 수장이 정해야 한다.\n\n#weak 구성원 다수의 마음과 어긋나는 방침을 고르면 갱신 때마다 결속이 깎인다. 주군에게 등을 돌리거나 주군 편으로 돌아서는 결정은 먼저 파벌 회의를 거친다.#!"
 lam_faction.2100.a: "주군 곁에 선다 (근왕)"
 lam_faction.2100.a.tt: "파벌이 주군 편에 선다. 주군이 위협받으면 결집한다."
 lam_faction.2100.b: "지켜본다 (관망)"
 lam_faction.2100.b.tt: "어느 편에도 서지 않고 때를 본다."
 lam_faction.2100.c: "숨죽인다 (잠복)"
 lam_faction.2100.c.tt: "불만은 품되 드러내지 않는다."
 lam_faction.2100.d: "공개적으로 반대한다"
 lam_faction.2100.d.tt: "주군에게 맞서는 목소리를 낸다."
 lam_faction.2100.e: "무장을 준비한다 (결집)"
 lam_faction.2100.e.tt: "봉기에 대비해 힘을 모은다. 봉기 자체는 파벌회의의 「봉기」 안건으로 올린다."
 lam_faction.2100.f: "구성원들의 뜻에 맡긴다"
 lam_faction.2100.f.tt: "방침을 따로 정하지 않고 구성원들의 마음을 따른다."
 lam_faction.2100.x: "그대로 둔다"
 lam_faction.2110.t: "파벌이 바라는 것"
 lam_faction.2110.desc: "무엇을 위해 모였는가. 주군에게 내밀 요구가 분명해야 사람들도 따라온다."
 lam_faction.2110.g1: "왕권법을 누그러뜨리는 것"
 lam_faction.2110.g2: "다른 신앙·문화에 대한 관용"
 lam_faction.2110.g3: "참된 신앙의 수호"
 lam_faction.2110.g4: "전쟁과 원정"
 lam_faction.2110.g5: "자문회의 자리"
 lam_faction.2110.g6: "군주의 양보"
 lam_faction.2110.g7: "안정된 후계"
 lam_faction.2110.g8: "강한 왕권"
 lam_faction.2110.g9: "지금의 입지를 지키는 것"
 lam_faction.2110.auto: "파벌이 스스로 정하게 둔다"
 lam_fac_head_posture_decision_confirm: "방침을 정한다"
 lam_fac_head_goal_decision_confirm: "정한다"
 lam_fac_head_confidence_decision_confirm: "신임을 묻는다"
 lam_faction.0300.me_need_tt: "함께 세울 사람이 궁정에 있어야 한다 (나를 좋게 보는 사람(호감 20 이상), 같은 가문, 친구 중에서 다른 파벌의 수장이나 핵심이 아닌 사람)"
