 lam_faction.0100.t: "파벌의 청원"
 lam_faction.0100.open: "[lam_pet_lead.GetTitledFirstName](이)가 자기 사람들을 대표해 알현을 청했다. 혼자 온 게 아니다. 뒤에 늘어선 얼굴들이 모두 내 대답만 기다린다.\n\n"
 lam_faction.0100.ask.courtly: "\"[ROOT.Char.Custom('FormOfAddressForLiege')], 궁정의 품격이 곧 나라의 품격입니다. 저희에게 자문회 자리를 내어 주시고, 연회에서도 그에 맞게 대해 주십시오.\""
 lam_faction.0100.ask.glory_hound: "\"칼이 녹슬고 있습니다. 원정을 약속해 주십시오. 영광은 나누는 것이니까요.\""
 lam_faction.0100.ask.parochial: "\"저희 땅의 일은 저희가 압니다. 왕궁의 손길을 조금만 거두어 주십시오.\""
 lam_faction.0100.ask.zealot: "\"신앙이 흐려지고 있습니다. 이단을 다스리고 성소를 돌보십시오.\""
 lam_faction.0100.ask.minority: "\"저희의 말과 기도가 이 궁정에서 업신여겨집니다. 관용을 약속해 주십시오.\""
 lam_faction.0100.ask.barons_and_minor_landholders: "\"큰 영주들이 작은 영주들을 짓누릅니다. 왕의 법으로 저희를 지켜 주십시오.\""
 lam_faction.0100.ask.belligerent: "\"평화가 너무 길었습니다. 적이 우리를 비웃습니다.\""
 lam_faction.0100.ask.loyalist: "\"저희는 언제나 [ROOT.Char.Custom('FormOfAddressForLiege')] 곁에 있었습니다. 그 충성을 기억해 주십시오.\""
 lam_faction.0100.ask.dynastic: "\"후계를 분명히 해 주십시오. 계승이 흔들리면 왕국이 흔들립니다.\""
 lam_faction.0100.ask.none: "\"저희의 목소리도 들어 주십시오.\""
 lam_faction.0100.tone.arms: "\n\n#italic 정중한 말투 뒤로 칼자루를 쥔 손들이 보인다. 이건 청원이라기보다 경고다.#!"
 lam_faction.0100.tone.loyal: "\n\n#italic 왕권이 흔들리는 지금도 이들은 내 곁에 남아 있다. 그 대가를 받으러 온 것이다.#!"
 lam_faction.0100.a: "들어준다."
 lam_faction.0100.b: "선물로 달랜다."
 lam_faction.0100.c: "거절한다."
 lam_faction.0200.t: "새 파벌의 기치"
 lam_faction.0200.desc: "사람은 이름이 아니라 깃발을 보고 모인다. [lam_fac_new.GetFirstName]의 파벌은 무엇을 내걸 것인가?"
