 lam_fac_hint: "파벌은 강한 봉신·자문위원·가장을 중심으로 모인다. 마음(왕권에 대한 태도)과 기세(드러낼 힘)는 따로 움직인다."
 lam_fac_card_camp: "#weak 마음과 기세:#! [Character.Custom('LamFacCamp')] · [Character.Custom('LamFacStage')]"
 lam_fac_stage_tt: "#high 마음#!은 왕권을 대하는 태도다 (평균 [Character.MakeScope.Var('lam_fac_att').GetValue|0]). 호감, 이해관계(봉신 성향별), 혈연, 관직으로 정해진다.\n#high 기세#!는 그 마음을 겉으로 드러낼 힘이다 ([Character.MakeScope.Var('lam_fac_bold').GetValue|0]). 왕권이 약할수록, 파벌 세력이 클수록, 수장이 대담할수록 오른다.\n\n왕권이 강하면 반왕파도 #weak 잠복#!한다. 기세가 차오르면 #N 공개 반대#! → #N 결집#! → #N 봉기#! 순으로 치닫는다. 봉기하면 주군에게 요구를 내걸고, 거절되면 전쟁으로 번진다.\n친왕파는 왕권이 강할 땐 #P 측근#!으로 붙고, 흔들릴 땐 #P 근왕 결집#!으로 뭉친다.\n\n#high 가장 큰 까닭 (수장 기준):#! [Character.Custom('LamFacMoodWhy')]"
 lam_fac_crown_line: "#high [Character.GetShortUIName]#!의 궁정 · 왕권 [Character.Custom('LamCrown')] #weak ([Character.MakeScope.Var('lam_crown').GetValue|0])#!"
 lam_fac_crown_tt: "왕권의 세기를 정하는 것: 왕권법, 정통성, 공포, 군주와 봉신의 병력 차, 위신, 방어 전쟁 중인지, 군주가 미성년인지.\n\n왕권이 세면 반왕 파벌도 숨을 죽이고, 약하면 반왕파는 들고일어나고 친왕파는 근왕의 깃발 아래 뭉친다."
