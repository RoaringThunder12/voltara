 lam_cp_paragon_modifier_desc: "모두가 인정하는 주군의 충신이다."
 lam_cp_legend_modifier: "만고의 충신"
 lam_cp_legend_modifier_desc: "그 충성은 대대로 전해질 것이다."
 lam_cp_counsel_opinion: "훌륭한 충언"
 lam_cp_counsel_bad_opinion: "쓸모없는 충언"
 lam_cp_mission_opinion: "맡긴 일을 해냄"
 lam_cp_envy_opinion: "궁정당에 대한 질시"
 lam_cp_betrayed_opinion: "궁정당의 배신"
 lam_cp_suspect_opinion: "의심"
 lam_cp_loyal_servant_opinion: "충직한 신하"
 lam_secret_cp_treason: "궁정당의 역모"
 lam_secret_cp_treason_desc: "궁정당의 수장이 주군에게 칼을 겨눌 날을 기다리고 있다."
 lam_cp_counsel_interaction: "주군께 충언한다"
 lam_cp_counsel_interaction_desc: "궁정당의 수장으로서 주군께 나랏일을 아뢴다. 능력이 뛰어날수록 귀담아듣는다. 공적이 쌓인다."
 lam_cp_counsel_cd_tt: "1년에 한 번 아뢸 수 있다"
 lam_cp_counsel_tt: "성공: 주군 호감 +10, 호의 +5, 공적 +1 / 실패: 주군 호감 −5"
 lam_cc_purse: "나라 살림을 아뢴다 (관리)"
 lam_cc_purse_desc: "관리가 높을수록 잘 된다"
 lam_cc_arms: "군사를 아뢴다 (군사)"
 lam_cc_arms_desc: "군사가 높을수록 잘 된다"
 lam_cc_court: "궁정의 기강을 아뢴다 (외교)"
 lam_cc_court_desc: "외교가 높을수록 잘 된다"
 lam_cp_counsel_yes_title: "주군이 충언을 받아들였다 (공적 +1)"
 lam_cp_counsel_no_title: "주군이 언짢아했다"
 lam_cp_mission_interaction: "주군의 명을 청한다"
 lam_cp_mission_interaction_desc: "주군께 맡길 일이 있는지 여쭙는다. 해내면 공적이 쌓인다."
 lam_cp_mission_cd_tt: "2년에 한 번 청할 수 있다"
 lam_cp_report_interaction: "주군께 고발한다"
 lam_cp_report_interaction_desc: "주군에게 등 돌린 이 파벌을 고발한다. 그 파벌의 결속 −10, 주군이 그들을 미워하게 되고, 내 공적 +1. 그들은 나를 원수로 여긴다."
 lam_cp_report_cd_tt: "2년에 한 번 고발할 수 있다"
 lam_cp_hidden_blade_interaction: "숨은 칼을 간다"
 lam_cp_hidden_blade_interaction_desc: "주군의 신임을 등에 업은 채, 언젠가 주군에게 칼을 겨눌 준비를 시작한다."
 lam_cp_blade_need_tt: "궁정당이어야 한다"
 lam_cp_blade_years_tt: "궁정당으로 3년 이상 있어야 한다 (주군이 경계를 풀 때까지)"
 lam_cp_hidden_blade_tt: "역모의 비밀을 품는다. 1년 뒤부터 칼을 뽑을 수 있다. 해마다 주군의 밀정이 눈치챌 수 있다 (내 계략이 높을수록 안전)."
 lam_cp_draw_blade_interaction: "칼을 뽑는다"
 lam_cp_draw_blade_interaction_desc: "때가 왔다. 궁정당이 주군에게 등을 돌린다."
 lam_cp_draw_wait_tt: "역모를 꾸민 지 1년은 지나야 한다"
 lam_db_rise: "봉기한다"
 lam_db_rise_desc: "파벌이 주군에게 맞서 일어난다. 허를 찔린 주군 곁에는 충성파가 쉽게 모이지 못한다 (1년)."
 lam_db_seize: "궁정을 장악한다"
 lam_db_seize_desc: "궁정 세력의 5분의 2를 쥐고 있다면, 싸우지 않고 왕좌 뒤의 실권자가 된다."
 lam_db_seize_need_tt: "궁정 세력의 40% 이상을 쥐어야 한다"
 lam_db_rise_tt: "궁정당의 자리와 충신의 명예를 잃고, 계보에 역모가 기록된다. 봉기에 지면 「반역자」라 불린다."
 lam_db_seize_tt: "궁정당의 자리와 충신의 명예를 잃고, 계보에 역모가 기록된다. 대신 실권을 쥔다."
 lam_faction.2800.t: "주군의 신임"
 lam_faction.2800.desc: "[lam_cp_lord.GetShortUIName]이(가) 모두 앞에서 나를 불러 세웠다. 그대만큼 믿을 만한 사람이 없다고.\n\n#weak 기록: 궁정당 수장으로 [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0]년, 세운 공 [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0]가지.#!"
 lam_faction.2800.a: "머리를 숙여 받든다"
 lam_faction.2810.t: "충신의 반열"
 lam_faction.2810.desc: "오랜 세월 궁정당을 이끌며 주군을 섬겨 온 공을 기려, [lam_cp_lord.GetShortUIName]이(가) 나를 충신이라 불렀다. 그 이름이 궁정에 퍼진다.\n\n#weak 기록: 궁정당 수장으로 [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0]년, 세운 공 [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0]가지.#!"
 lam_faction.2810.a: "평생의 영광이다"
 lam_faction.2820.t: "만고의 충신"
 lam_faction.2820.desc: "십오 년을 하루같이. [lam_cp_lord.GetShortUIName]은(는) 내 이름이 가문과 함께 길이 전해지리라 했다. 사관이 붓을 든다.\n\n#weak 기록: 궁정당 수장으로 [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0]년, 세운 공 [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0]가지.#!"
 lam_faction.2820.a: "가문의 이름으로 받든다"
 lam_faction.2830.t: "주군의 명"
 lam_faction.2830.desc: "[lam_cp_lord.GetShortUIName]이(가) 몇 가지 일을 일러 주었다. 무엇을 맡을까."
 lam_faction.2830.a: "버티는 봉신에게서 세금을 받아 온다 (군사·외교)"
 lam_faction.2830.b: "주군에게 등 돌린 파벌을 감시한다 (계략)"
 lam_faction.2830.c: "주군의 후계자를 보필한다 (학식)"
 lam_faction.2830.yes: "맡은 일을 해냈다 (공적이 쌓였다)"
 lam_faction.2830.no: "맡은 일을 그르쳤다"
 lam_faction.2840.t: "숨은 칼"
 lam_faction.2840.desc: "한 해가 또 지났다. 주군의 밀정들은 아직 아무것도 모르는 걸까."
 lam_faction.2840.a: "조용히 때를 기다린다"
 lam_faction.2840.found: "역모가 주군에게 들통났다!"
 lam_faction.2840.safe: "들키지 않고 한 해를 넘긴다 (주군의 계략이 높고 내 계략이 낮을수록 위험)"
 lam_faction.2840.b: "한 해 더 몸을 낮춘다"
 lam_faction.2840.b.tt: "칼을 뽑을 수 있는 때가 1년 미뤄진다"
 lam_faction.2840.c: "역모를 접는다"
 lam_faction.2850.t: "주군의 하사"
 lam_faction.2850.desc: "[lam_cp_lord.GetShortUIName]이(가) 궁정당의 노고를 치하하며 무엇을 바라는지 물었다."
 lam_faction.2850.a: "금화를 받는다"
 lam_faction.2850.b: "파벌 사람들에게 돌려 달라고 한다"
 lam_faction.2850.c: "마음만 받겠다고 한다 (공적 +1)"
 lam_faction.2860.t: "주군의 의심"
 lam_faction.2860.desc: "[lam_cp_lord.GetShortUIName]의 눈빛이 예전 같지 않다. 궁정당이 정말 자기 편인지 의심하는 눈치다."
 lam_faction.2860.a: "금화로 충성을 증명한다"
 lam_faction.2860.b: "말로 의심을 푼다 (외교)"
 lam_faction.2860.b_yes: "의심을 풀었다"
 lam_faction.2860.b_no: "의심이 더 깊어졌다"
 lam_faction.2860.c: "의심받을 일 없다며 버틴다"
 lam_faction.2870.t: "질시"
 lam_faction.2870.desc: "궁정당이 주군의 총애를 독차지한다며 [lam_cp_envious.GetShortUIName]의 파벌이 수군거린다."
 lam_faction.2870.a: "선물로 달랜다"
 lam_faction.2870.b: "그들의 약점을 주군께 흘린다 (계략)"
 lam_faction.2870.b_yes: "그 파벌이 흔들렸다 (공적 +1)"
 lam_faction.2870.b_no: "되레 원한만 샀다"
 lam_faction.2870.c: "무시한다"
 lam_gn_ev_loyal_honor: "수장이 충신으로 이름을 남김"
 lam_gn_ev_treason: "궁정당이 주군에게 칼을 겨눔"
 lam_cp_loyal_house_modifier: "3대 충신 가문"
 lam_cp_loyal_house_modifier_desc: "삼대에 걸쳐 왕가를 섬긴 충신의 가문이다. 그 왕가가 이어지는 한 이 이름도 이어진다."
 lam_cp_loyal_house_opinion: "3대 충신 가문"
 lam_cp_house_seat_title: "3대 충신 가문으로서 자문회 자리를 받았다"
 lam_faction.2810.house_tt: "#weak 가문의 기록: 같은 왕가 아래 충신이 된 우리 가문의 수장 [ROOT.Char.MakeScope.Var('lam_cp_house_n').GetValue|0]명 / 3명 (이번 포함) — 셋이 되면 가문 전체가 3대 충신 가문으로 인정받는다.#!"
 lam_faction.2890.t: "3대 충신 가문"
 lam_faction.2890.desc: "할아버지가, 아버지가, 그리고 이제 내가. 삼대에 걸쳐 우리 가문은 [lam_cp_lord.GetShortUIName]의 왕가를 섬겨 왔다. 왕가는 우리 가문을 충신의 가문으로 기리기로 했다."
 lam_faction.2890.a: "가문의 이름으로 영원히 섬기겠다"
 lam_faction.2890.a.tt: "가문 전체가 「3대 충신 가문」 수식어를 얻는다 (위신, 호감, 주군 호감, 외교, 관리). 왕조 위신 +1000. 이 왕가가 왕좌를 지키는 동안 해마다 왕이 우리를 아끼고(호감 +25), 우리 가문 사람 하나를 자문회에 앉히며, 우리 파벌의 호의가 오른다. 왕가가 끊기면 이 명예도 끝난다."
 lam_faction.2891.t: "왕가가 끊기다"
 lam_faction.2891.desc: "우리 가문이 삼대에 걸쳐 섬긴 왕가가 왕좌를 잃었다. 충신 가문의 이름도 이제 옛이야기가 되었다."
 lam_faction.2891.a: "세상이 바뀌었다"
 lam_gn_ev_loyal_house: "수장의 가문이 3대 충신 가문이 됨"
 lam_faction.2895.t: "충신의 이름을 잃다"
 lam_faction.2895.desc: "한때 충신이라 불렸던 내가 주군에게 등을 돌렸다. 궁정은 이제 나를 다른 이름으로 부른다."
 lam_faction.2895.a: "돌이킬 수 없다"
 lam_faction.2895.a.tt: "충신의 수식어와 공적을 모두 잃는다. 「충신」·「만고의 충신」이라는 이름은 「맹약 파괴자」가 된다. 다시는 충신이 될 수 없고, 가문의 3대 충신 명예도 함께 사라진다."
 lam_faction.2896.t: "가문의 이름에 먹칠"
 lam_faction.2896.desc: "[lam_hs_culprit.GetShortUIName]이(가) 우리 가문이 대대로 섬긴 왕가에 칼을 겨눴다. 3대 충신 가문의 이름은 이제 없다."
 lam_faction.2896.a: "이 수치를 어찌할까"
 lam_faction.2896.a.tt: "가문의 「3대 충신 가문」 수식어와 모든 혜택이 사라진다. 50년 동안 다시 얻을 수 없다."
 lam_court_puppet: "왕좌 뒤의 실권"
 lam_court_puppet_desc: "파벌의 힘으로 군주를 손에 넣었다. 작위를 주고 빼앗고, 후계를 정하고, 전쟁과 동맹을 결정하는 일까지 꼭두각시 군주의 이름으로 할 수 있다. 파벌의 힘이 궁정의 35% 아래로 떨어지면 끈이 끊어진다."
 puppet_action_description_lam_pa_revoke_title: "꼭두각시 군주의 이름으로 작위를 회수한다"
 puppet_action_description_lam_pa_grant_titles: "꼭두각시 군주의 이름으로 작위를 하사한다"
