 lam_fac_btn_leave: "이 파벌을 떠난다"
 lam_faction.0600.t: "깃발이 오르는 밤"
 lam_faction.0600.desc: "[lam_abs_lead.GetTitledFirstName]의 전갈이 왔다. 파벌이 군주에게 맞서 들고일어난다. 같은 깃발 아래 섰던 몸이니, 나도 이제 정해야 한다."
 lam_faction.0600.a: "함께 일어선다."
 lam_faction.0600.b: "군주 편에 남고, 그들과 갈라선다."
 lam_faction.0600.c: "아직은 아무 말도 하지 않는다."
