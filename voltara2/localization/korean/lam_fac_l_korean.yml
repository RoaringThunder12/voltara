 puppet_action_description_lam_pa_modify_contract_admin: "꼭두각시 군주의 봉신 계약을 고친다 (행정제)"
 puppet_action_description_lam_pa_modify_contract_nomad: "꼭두각시 군주의 봉신 계약을 고친다 (유목)"
 puppet_action_description_lam_pa_grant_governorship: "꼭두각시 군주의 이름으로 총독을 임명한다"
 puppet_action_description_lam_pa_arrange_marriage: "꼭두각시 군주의 혼인을 주선한다"
 puppet_action_description_lam_pa_break_betrothal: "꼭두각시 군주의 약혼을 깬다"
 puppet_action_description_lam_pa_execute: "꼭두각시 군주의 죄수를 처형한다"
 puppet_action_description_lam_pa_offer_ward: "꼭두각시 군주의 아이를 맡긴다"
 puppet_action_description_lam_pa_call_dynasty_war: "꼭두각시 군주의 왕조원을 전쟁에 부른다"
 puppet_action_description_lam_pa_gift_artifact: "꼭두각시 군주의 보물을 내린다"
 puppet_action_description_lam_pa_declare_war: "꼭두각시 군주의 이름으로 선전포고한다"
 puppet_action_description_lam_pa_imprison: "꼭두각시 군주의 이름으로 투옥한다"
 puppet_action_description_lam_pa_release: "꼭두각시 군주의 죄수를 풀어 준다"
 puppet_action_description_lam_pa_pardon: "꼭두각시 군주의 이름으로 사면한다"
 puppet_action_description_lam_pa_directive: "꼭두각시 군주의 봉신에게 지시한다"
 puppet_action_description_lam_pa_alliance: "꼭두각시 군주의 동맹을 맺는다"
