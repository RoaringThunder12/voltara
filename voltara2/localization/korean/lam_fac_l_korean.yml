 lam_faction.0400.t: "숙청 뒤의 궁정"
 lam_faction.0400.desc: "[lam_purged.GetTitledFirstName](이)가 끌려간 날 저녁, 궁정은 이상하리만치 조용했다. 복도마다 낮은 목소리가 오가고, 눈이 마주치면 모두 먼저 고개를 숙인다."
 lam_faction.0400.desc.head: "\n\n끌려간 이는 [lam_purge_lead.GetFirstName] 파벌의 수장이었다. 우두머리를 잃은 무리는 흩어지거나 이를 갈거나, 둘 중 하나다."
 lam_faction.0400.desc.core: "\n\n끌려간 이는 [lam_purge_lead.GetFirstName] 파벌의 핵심이었다. [lam_purge_lead.GetFirstName](은)는 아무 말도 하지 않았지만, 그 침묵이 더 무겁다."
 lam_faction.0400.a: "남은 이들을 달랜다. 죄는 한 사람에게만 묻는다."
 lam_faction.0400.b: "본보기로 삼는다. 모두가 보았을 것이다."
 lam_faction.0400.c: "그 파벌을 아예 해체한다."
 lam_faction.0500.t: "갈라서는 밤"
 lam_faction.0500.desc: "알현실 한가운데에서 [lam_fs_new.GetTitledFirstName](이)가 [lam_fs_lead.GetTitledFirstName]에게 등을 돌렸다. 오래 한 깃발 아래 있던 사람들이 오늘 밤 둘로 갈라진다. 따르던 이들이 하나둘 [lam_fs_new.GetFirstName]의 뒤에 선다.\n\n두 사람 모두 나를 본다."
 lam_faction.0500.a: "[lam_fs_lead.GetFirstName]의 편에 선다."
 lam_faction.0500.b: "[lam_fs_new.GetFirstName]의 편에 선다."
 lam_faction.0500.c: "누구의 편도 들지 않는다."
