 lam_fac_rel_nemesis: "#N 숙적#!"
 lam_fac_rel_rival: "#N 경쟁#!"
 lam_fac_rel_friendly: "#P 우호#!"
 lam_fac_rel_neutral: "#weak 중립#!"
