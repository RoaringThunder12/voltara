l_korean:
 lam_rv.0001.t: "최후통첩"
 lam_rv.0001.desc: "뜻을 모은 이들이 모두 모였다. 이제 [lam_rv_lord.GetTitledFirstName]에게 우리의 요구를 내밀 차례다.\n\n주군이 받아들이면 요구가 이루어진다. 거절하면 전쟁이다. 그때는 이 요구에 이름을 올린 모두가 함께 싸운다."
 lam_rv.0001.send: "최후통첩을 보낸다"
 lam_rv.0001.wait: "아직은 때가 아니다"
 lam_rv.0001.wait_tt: "사람을 더 모은 뒤 결정 메뉴의 #high 최후통첩을 보낸다#!로 보낼 수 있다."
 lam_rv_send_tt: "주군에게 우리의 요구를 내민다. 거절하면 이 요구에 이름을 올린 모두가 함께 전쟁에 나선다."
 lam_rv_ultimatum_decision: "최후통첩을 보낸다"
 lam_rv_ultimatum_decision_desc: "우리가 모은 연대의 이름으로 주군에게 요구를 내민다. 받아들이지 않으면 전쟁이다."
 lam_rv_ultimatum_decision_tooltip: "주군에게 최후통첩을 보낸다"
 lam_rv_ultimatum_decision_confirm: "보낸다"
 lam_rv_stall_title: "봉기 투표는 통과했지만 요구를 내걸지 못했다"
 lam_rv_stall_desc: "[ROOT.Char.Custom('LamRvStall')]"
 lam_rv_stall_joined: "이미 다른 요구에 이름을 올려 두었다. 그 일이 끝나야 새 요구를 내걸 수 있다."
 lam_rv_stall_retry: "최근 1년 안에 이미 요구를 내걸었다. 다시 하려면 시간이 더 지나야 한다."
 lam_rv_stall_nolaw: "지금은 내걸 수 있는 요구가 없다. 권한 축소도 독립도 조건이 맞지 않는다(왕권, 주군의 지위, 주군과의 휴전·동맹 등)."
 lam_rv_stall_other: "지금은 요구를 내걸 수 없다(전쟁 중이거나, 다른 협상이 걸려 있거나, 목표가 바뀌었다)."
 lam_rv_proxy_title: "파벌의 다른 사람이 요구를 이끌게 되었다"
 lam_rv_mine: " #P (내 파벌)#!"
 lam_rv_op: "  #weak 의견 [ROOT.Char.MakeScope.Var('lam_fac_loyal').GetValue|0]#!"
 lam_rv_is_held_tt: "이 현안에 걸린 파벌이 봉기나 전쟁에 나서 있다. 그 결과가 날 때까지 현안은 멈춰 있다"
 lam_rv_cv_rise_text: "#high 안건: [ROOT.Char.Custom('LamPbCouncilDemand')]#!\n가결되면 찬성한 이들을 중심으로 지지를 모은다. 찬성은 요구가 거부될 경우 참전하겠다는 약속이다. 반대와 기권은 참전 동의로 취급하지 않는다. 대상이나 조건이 바뀌면 실행을 중단한다.[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_legacy: "#high 안건: 군주에 맞서 거병할 것인가#!\n가결되면 이 정치 체제의 방식에 따라 거병을 추진한다.[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_claimant: "\n\n#high 이번 요구의 옹립 후보:#! [ROOT.Char.MakeScope.Var('lam_wc_plan_candidate').Char.GetShortUIName]"
 NOT_lam_cv_call_retry_tt: "최근에 올렸던 안건이다. 6개월 뒤에 다시 올릴 수 있다"
 NOT_lam_cv_committed_tt: "파벌이 전쟁이나 주군에 맞선 연대에 묶여 있다"
 NOT_lam_cv_no_seat_tt: "자문회에 앉힐 만한 사람이 없다"
 NOT_lam_fac_back_heir_locked_tt: "주군과의 거래로 후계 지지가 묶여 있다"
 NOT_lam_fac_head_posture_cd_tt: "방침을 바꾼 지 아직 반년이 지나지 않았다"
 NOT_lam_fac_rise_blocked_tt: "패전 등으로 내려진 파벌 결성 금지가 아직 풀리지 않았다"
 NOT_lam_fac_rise_cause_tt: "봉기할 명분이 없다: 파벌의 원한, 주군의 냉대(총애 -20 이하), 파벌 금지령 가운데 하나가 있어야 한다"
 NOT_lam_fac_rise_cd_tt: "최근에 봉기했다 (봉기 뒤 5년, 봉기안 부결 뒤 3년은 다시 일어날 수 없다)"
 NOT_lam_pt_head_available_tt: "수장이 지금 움직일 수 없다 (미성년·투옥이거나, 회의·청원·교섭이 진행 중이다)"
 lam_rv_tip_head: "#weak 파벌#! [ROOT.Char.Custom('LamFacName')] #weak 수장#![ROOT.Char.Custom('LamUx2Mine')]\n"
 lam_rv_tip_member: "#weak 파벌#! [ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamFacName')][ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamUx2Mine')]\n"
 lam_rv_conf_recent_tt: "최근 5년 안에 재신임 투표가 없어야 한다"
 lam_rv_conf_busy_tt: "파벌이 회의 중이 아니고, 주군의 답을 기다리는 중도 아니어야 한다"
 lam_rv_cp_lost_title: "[lam_rv_cp_lord.GetShortUIName]의 궁정 파벌이 실권을 쥐었다. 내 줄은 끊어졌다"
