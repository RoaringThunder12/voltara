 lam_is_push_tt: "이 문제에 힘을 싣는다. 모든 문제를 통틀어 1년에 한 번.\n군주 8 (위신 100) · 수장 10 + 영향력의 1/10 (위신 100) · 파벌원 6 (위신 50) · 무소속 8 (위신 75)\n수장은 무소속 봉신 한 명도 끌어오려 한다(나를 좋게 볼수록 잘 넘어온다).\n무소속이 편에 서면 끝날 때까지 그 세력이 그쪽에 실리고, 이기면 위신과 그쪽 수장들의 호감을 얻는다.\n반대편 파벌 수장들은 이 일을 기억한다."
