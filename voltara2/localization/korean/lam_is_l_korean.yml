 lam_is.0001.crown: "왕권을 줄이라는 목소리가 끝내 궁정을 덮었다. 파벌들은 왕권법을 한 단계 낮추라고 입을 모은다.\n\n받아들이면 이긴 쪽은 세를 얻고 진 쪽은 세가 꺾인다. 물리치면 요구한 파벌들의 호의가 떨어지고 원한이 깊어진다."
 lam_is.0001.crown.a: "왕권법을 한 단계 낮춘다"
 lam_is.0001.crown.b: "내 궁정의 일은 내가 정한다"
 lam_is_council_title: "#high 자문회 자리#!"
 lam_is_council_tt: "자문회 자리를 둔 다툼.\n#high 현 자문회 유지:#! 이미 자문회에 사람을 앉힌 파벌.\n#high 자리 요구:#! 관직을 노리거나 세력이 큰데도 자리가 없는 파벌.\n요구 쪽이 이기면 그들의 사람이 자문회에 들어간다.\n명분: 비어 있는 자문회 자리가 있으면 요구 쪽.\n\n#weak 무소속 봉신을 끌어오면 그 세력만큼 무게가 실린다. 이긴 쪽 파벌에는 3년 동안 사람이 모이고, 진 쪽은 결속이 흔들리고 사람이 떠난다. 군주는 거들 수만 있다.#!"
