 lam_is_war_title_p: "[Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]과(와)의 전쟁"
 lam_is_war_tt_c: "전쟁을 벌일지를 둔 다툼.\n#high 출정:#! 공훈을 노리거나 호전적인 파벌, 잃은 땅을 되찾으려는 파벌, 수장이 용감하거나 야심차거나 성마른 파벌.\n#high 평화 유지:#! 지금 세력을 지키거나 양보를 바라는 파벌, 군주와 맞서는 파벌, 수장이 겁 많거나 만족하거나 게으른 파벌. 최근에 전쟁을 치렀다면 그 무게도 실린다.\n출정 쪽이 이기면 군주는 2년 안에 출정하겠다고 약속하게 된다."
 lam_is_war_tt_p: "이 전쟁을 계속할지를 둔 다툼.\n#high 항전:#! 공훈을 노리거나 호전적인 파벌, 잃은 땅을 되찾으려는 파벌, 수장이 용감하거나 야심차거나 성마른 파벌. 이기고 있으면 전황도 이쪽에 실린다.\n#high 강화:#! 지금 세력을 지키거나 양보를 바라는 파벌, 군주와 맞서는 파벌, 수장이 겁 많거나 만족하거나 게으른 파벌. 지고 있거나 3년 넘게 끌면 전황이 이쪽에 실린다.\n강화 쪽이 이기면 이 전쟁을 백지 강화로 끝낸다."
 lam_is_heir_title: "#high 후계 문제#!"
 lam_is_heir_tt: "파벌들이 현 후계자 대신 다른 자녀를 세우려 한다.\n#high 현 후계자 쪽:#! 현 후계자를 미는 파벌, 그리고 왕권의 무게.\n#high 옹립 쪽:#! 그 자녀를 미는 파벌.\n옹립 쪽이 이기면 군주가 후계자를 바꿀지 정한다. 거절하면 그들을 민 파벌들은 무시당했다고 여긴다.\n명분: 현 후계자가 미성년·무능·사생아면 옹립 쪽, 도전자가 미성년이면 현 후계자 쪽. 정당한 계승 자체도 현 후계자 쪽 명분이다.\n\n#weak 무소속 봉신을 끌어오면 그 세력만큼 무게가 실린다. 이긴 쪽 파벌에는 3년 동안 사람이 모이고, 진 쪽은 결속이 흔들리고 사람이 떠난다. 군주는 거들 수만 있다.#!"
