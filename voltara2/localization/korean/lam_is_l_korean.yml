 lam_is.0002.t: "궁정의 판세"
 lam_is.0002.open: "[lam_is_lord.GetShortUIName]의 궁정에서 지금 파벌들이 맞붙은 일:"
 lam_is.0002.a: "알겠다"
 lam_is.0002.beaten: "\n\n#N 우리 파벌은 현안에서 밀려 세가 꺾이고 있다. 3년 동안 사람이 떠나기 쉽다.#!"
 lam_is.0002.victor: "\n\n#P 우리 파벌은 현안에서 이겨 사람이 모이고 있다.#!"
 lam_is.0002.tip_head: "\n\n#high 지금 둘 만한 수#!\n이 다툼에 우리가 힘을 보태면(1년에 한 번) 무소속 봉신 한 명도 우리 편으로 끌어오려 한다."
 lam_is.0002.tip_member: "\n\n#high 지금 둘 만한 수#!\n파벌원도 현안 카드에서 힘을 보탤 수 있다(1년에 한 번)."
 lam_is.0002.tip_unaligned: "\n\n#high 지금 둘 만한 수#!\n어느 편에도 서지 않은 내 세력이 저울을 움직일 수 있다. 현안 카드에서 편을 들면 끝날 때까지 그쪽 무게가 되고, 이기면 위신과 호감을 얻는다."
