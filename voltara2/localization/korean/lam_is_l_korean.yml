 lam_is.0001.heir: "궁정의 저울이 끝내 [lam_is_cb.GetShortUIName] 쪽으로 기울었다. 파벌들은 [lam_is_ca.GetShortUIName] 대신 [lam_is_cb.GetShortUIName](을)를 후계자로 세우라고 입을 모은다.\n\n받아들이면 이긴 쪽은 세를 얻고 진 쪽은 세가 꺾인다. 물리치면 요구한 파벌들의 호의가 떨어지고 원한이 깊어진다."
 lam_is.0001.heir.a: "[lam_is_cb.GetShortUIName](을)를 후계자로 세운다"
 lam_is.0001.heir.b: "내 궁정의 일은 내가 정한다"
 lam_is_crown_title: "#high 왕권#!"
 lam_is_crown_tt: "왕권을 줄이자는 파벌과 지키려는 파벌의 다툼.\n#high 왕권 수호:#! 왕권 강화를 목표로 삼거나 군주를 따르는 파벌, 그리고 왕권의 무게.\n#high 왕권 축소:#! 왕권법 완화를 목표로 삼은 파벌.\n축소 쪽이 이기면 왕권법이 한 단계 내려간다.\n명분: 왕권이 약하거나 군주가 폭정을 일삼으면 축소 쪽.\n\n#weak 무소속 봉신을 끌어오면 그 세력만큼 무게가 실린다. 이긴 쪽 파벌에는 3년 동안 사람이 모이고, 진 쪽은 결속이 흔들리고 사람이 떠난다. 군주는 거들 수만 있다.#!"
