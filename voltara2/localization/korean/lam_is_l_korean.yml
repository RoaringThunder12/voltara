 lam_is.0001.faith: "다른 신앙과 문화를 너그럽게 대하자는 목소리가 궁정을 얻었다. 파벌들은 관용을 요구한다.\n\n받아들이면 이긴 쪽은 세를 얻고 진 쪽은 세가 꺾인다. 물리치면 요구한 파벌들의 호의가 떨어지고 원한이 깊어진다."
 lam_is.0001.faith.a: "관용을 베푼다"
 lam_is.0001.faith.p: "1년 안에 다른 신앙이나 문화의 자문위원을 들이겠다고 약속한다"
 lam_is.0001.faith.b: "내 궁정의 일은 내가 정한다"
 lam_is_tax_title: "#high 세금과 징집#!"
 lam_is_tax_tt: "봉신이 지는 세금과 징집을 둔 다툼.\n#high 징세 유지:#! 왕권 강화를 목표로 삼았거나 충성하는 파벌, 그리고 군주의 무게.\n#high 부담 경감:#! 양보를 바라거나 군주와 맞서는 파벌.\n경감 쪽이 이기면 5년간 봉신의 세금·징집 부담이 줄고, 유지 쪽이 이기면 3년간 오른다.\n명분: 1년 넘는 전쟁과 평시의 넉넉한 금고는 경감 쪽, 금고 적자는 징세 유지 쪽.\n\n#weak 무소속 봉신을 끌어오면 그 세력만큼 무게가 실린다. 이긴 쪽 파벌에는 3년 동안 사람이 모이고, 진 쪽은 결속이 흔들리고 사람이 떠난다. 군주는 거들 수만 있다.#!"
