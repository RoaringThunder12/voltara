 lam_is.0001.council: "자문회 자리를 요구하는 파벌들이 궁정을 얻었다. 그들은 자기 사람을 자문회에 앉히라고 요구한다.\n\n받아들이면 이긴 쪽은 세를 얻고 진 쪽은 세가 꺾인다. 물리치면 요구한 파벌들의 호의가 떨어지고 원한이 깊어진다."
 lam_is.0001.council.a: "그들의 사람을 자문회에 앉힌다"
 lam_is.0001.council.p: "1년 안에 자리를 내주겠다고 약속한다"
 lam_is.0001.council.b: "내 궁정의 일은 내가 정한다"
 lam_is_faith_title: "#high 신앙과 문화#!"
 lam_is_faith_tt: "다른 신앙과 문화를 어떻게 대할지를 둔 다툼.\n#high 정통 고수:#! 신앙 수호를 목표로 삼았거나 독실한 파벌. 군주가 열성적이면 그 무게도 실린다.\n#high 관용:#! 관용을 목표로 삼았거나 소수 신앙·문화 파벌.\n관용 쪽이 이기면 그들 문화의 수용도가 오르고 다른 신앙의 호감을 얻는다. 정통 쪽이 이기면 신앙심이 오른다.\n명분: 다른 신앙·문화를 가진 봉신이 많을수록 관용 쪽.\n\n#weak 무소속 봉신을 끌어오면 그 세력만큼 무게가 실린다. 이긴 쪽 파벌에는 3년 동안 사람이 모이고, 진 쪽은 결속이 흔들리고 사람이 떠난다. 군주는 거들 수만 있다.#!"
