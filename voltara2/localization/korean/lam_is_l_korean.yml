 lam_is_war_evt_c: "칼을 들자는 목소리가 궁정을 덮었다. 파벌들은 군주가 출정하기를 바란다."
 lam_is_war_evt_p: "전쟁에 지친 궁정이 강화를 요구한다. 파벌들은 [Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]과(와)의 전쟁을 끝내자고 입을 모은다."
 lam_is_war_acc_c: "2년 안에 출정하겠다고 약속한다"
 lam_is_war_acc_p: "백지 강화를 맺는다"
