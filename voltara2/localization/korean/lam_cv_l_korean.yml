l_korean:
 lam_cv_title: "파벌회의"
 lam_cv_btn: "파벌회의"
 lam_cv_btn_tt: "이 파벌의 회의장을 연다. 진행 중이면 표결 상황을, 끝났으면 지난 결과를 본다."
 lam_cv_head: "#high [Character.GetShortUIName]의 파벌회의#!  ·  [Character.Custom('LamCvState')]"
 lam_cv_state_now: "#high 표결 중#!"
 lam_cv_state_last: "[Character.Custom('LamCrStatus')]"
 lam_cv_target: "#weak 이 안건의 인물#!"
 lam_cv_tally_now: "찬성 [Character.MakeScope.Var('lam_cr_yes').GetValue|0]  ·  반대 [Character.MakeScope.Var('lam_cr_no').GetValue|0]  ·  전체 [Character.MakeScope.Var('lam_cr_total').GetValue|0]  ·  아직 안 정한 사람 [Character.MakeScope.Var('lam_cr_pending').GetValue|0]명  ·  [Character.Custom('LamCrThreshold')]"
 lam_cv_tally_last: "지난 회의  찬성 [Character.MakeScope.Var('lam_cr_last_yes').GetValue|0]  ·  반대 [Character.MakeScope.Var('lam_cr_last_no').GetValue|0]  ·  전체 [Character.MakeScope.Var('lam_cr_last_total').GetValue|0]"
 lam_cv_ch_yes: "#P 찬성#!"
 lam_cv_ch_no: "#N 반대#!"
 lam_cv_ch_abstain: "#weak 기권#!"
 lam_cv_ch_pending: "#weak 미정#!"
 lam_cv_w: "#weak 발언권#! [Character.MakeScope.Var('lam_cr_weight').GetValue|0] [Character.Custom('LamCvRole')]"
 lam_cv_role_head: "#weak (수장 ×1.5)#!"
 lam_cv_role_core: "#weak (핵심 ×1.25)#!"
 lam_cv_call_title: "#high 안건 올리기#!  #weak 올리면 곧바로 표결이 시작된다.#!"
 lam_cv_call_tt: "이 안건을 파벌회의에 올린다. 곧바로 표결이 시작된다."
 lam_cv_call_retry_tt: "같은 안건은 6개월 뒤에 다시 올릴 수 있다"
 lam_cr_goal_seat_ui: "자문회 자리: [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]을(를) 앉히는 것"
 lam_cr_issue_goal_seat: "\n#high 안건: 파벌의 목표를 바꿀 것인가#!\n자문회 자리: [lam_vt_new.GetShortUIName]을(를) 앉히는 것"
 lam_cv_ag_goal: "#high 안건: 파벌의 목표를 바꿀 것인가#!\n[Character.Custom('LamCrGoalUi')]"
 lam_cr_issue_goal: "\n#high 안건: 파벌의 목표를 바꿀 것인가#!\n[lam_cr_head.Custom('LamCrGoalEv')]"
 lam_cr_req_issue_goal: "\n#high 안건: 파벌의 목표를 바꿀 것인가#!"
 lam_cv_w_last: "#weak 발언권#! [Character.MakeScope.Var('lam_cv_w').GetValue|0]"
 lam_cv_why: "#weak 관계 [Character.MakeScope.Var('lam_cv_op').GetValue|+0] · 평판 [Character.MakeScope.Var('lam_cv_rep').GetValue|+0] · 안건 [Character.MakeScope.Var('lam_cv_iss').GetValue|+0]#!"
 lam_cv_why_tt: "이 사람이 이렇게 표를 던진 이유.\n#high 관계#!: 수장에 대한 호감\n#high 평판#!: 수장 본인이거나, 수장이 금고를 챙겼거나 배신했거나, 자기 공로\n#high 안건#!: 이 안건 자체에 대한 생각(성격, 처지, 후보와의 관계 등)\n합이 +8 이상이면 찬성, −8 이하면 반대, 그 사이면 기권한다."
 lam_cv_why_swayed: "#high 설득됨#!"
 lam_cv_why_held: "#weak 설득을 물리침#!"
 lam_cv_why_player: "#weak 직접 투표#!"
 lam_cv_vote_yes: "찬성한다"
 lam_cv_vote_no: "반대한다"
 lam_cv_vote_abstain: "기권한다"
 lam_cv_vote_tt: "이 회의에 내 표를 던진다. 한 번 던지면 바꿀 수 없다."
 lam_cv_sway: "설득"
 lam_cv_sway_tt: "위신 50을 들여 이 사람의 표를 내 쪽으로 한 걸음 옮기려 한다(반대→기권→찬성). 나를 좋게 볼수록 잘 넘어온다. 한 회의에 한 사람당 한 번. 수장은 표를 던지기 전에 찬성 쪽으로 설득할 수 있다(신임 투표에서는 유임 쪽)."
 lam_cv_sway_first_tt: "먼저 내 표를 던져야 한다"
 lam_cv_sway_done_tt: "이번 회의에서 이미 설득해 보았다"
 lam_cv_sway_same_tt: "이미 내 쪽에 표를 던졌다"
 lam_cv_sway_ok: "설득이 통했다"
 lam_cv_sway_no: "설득이 먹히지 않았다"
 lam_cv_hint: "#weak 선거인은 수장(발언권에 안건 가중치)과 핵심·식객 구성원이다. 진 쪽은 1년 동안 수장을 돕지 않고, 불만이 쌓이면 갈라져 나갈 수 있다.#!"
 lam_cv_none: "#weak 지금은 열린 회의가 없다.#!"
 lam_cr_vote_chamber: "회의장으로 간다"
 lam_cr_vote_chamber_tt: "회의장 창에서 다른 선거인의 표와 이유를 보고, 표를 던지거나 설득할 수 있다."
 lam_cv_ag_none: ""
 lam_cv_finish: "표결을 마친다"
 lam_cv_finish_tt: "모든 표가 모였다. 지금 결과를 낸다. 마치지 않으면 회의를 연 지 15일 뒤에 결과가 난다."
 lam_cv_menu_posture: "노선"
 lam_cv_menu_posture_tt: "주군을 대하는 노선을 바꾸자는 안건을 올린다."
 lam_cv_menu_goal: "목표"
 lam_cv_menu_goal_tt: "파벌의 목표를 바꾸자는 안건을 올린다."
 lam_cv_menu_seat: "자문회 자리"
 lam_cv_menu_seat_tt: "자문회에 앉힐 사람을 골라 안건으로 올린다."
 lam_cv_menu_heir: "후계 후보"
 lam_cv_menu_heir_tt: "주군의 자녀, 현재 후계자, 주군의 대표 작위에 압박 명분을 지닌 인물 가운데 지지할 후보를 골라 회의에 올린다."
 lam_cv_menu_stance: "궁정 현안"
 lam_cv_menu_stance_tt: "궁정 현안에서 우리 편을 바꾸자는 안건을 올린다."
 lam_cv_menu_rise: "봉기"
 lam_cv_menu_rise_tt: "주군에게 맞서 일어나자는 안건을 올린다."
 lam_cv_committed_tt: "파벌이 전쟁이나 주군에 맞선 연대에 묶여 있지 않아야 한다"
 lam_cv_menu_posture_t: "노선 안건"
 lam_cv_menu_goal_t: "목표 안건"
 lam_cv_menu_stance_t: "현안 안건"
 lam_cv_menu_rise_t: "봉기 안건"
 lam_cv_rise_council: "봉기를 파벌회의에 올린다"
 lam_cv_rise_preview_tt: "파벌회의가 표결한다 — [ROOT.Char.Custom('LamPvRise')]"
 lam_cv_rise_puppet: "마지막 밤: 꼭두각시가 되라고 요구한다"
 lam_cv_rise_puppet_tt: "회의 없이 주군에게 곧장 요구한다. 받아들이면 싸우지 않고 왕좌 뒤의 실권을 쥔다. 받아들일 확률: #high [ROOT.Char.MakeScope.ScriptValue('lam_fac_ult_puppet_chance_value')|0]%#! (파벌 세력, 왕권, 주군의 기질에 따라). 거부하면 봉기 여부를 파벌회의에 부친다."
 lam_cv_menu_desc: "무엇을 파벌회의에 올릴까?"
 lam_cv_menu_back: "그만둔다"
 lam_cv_no_seat_tt: "자문회에 앉힐 만한 사람이 없다"
 recipient_secondary_lam_cv_seat_interaction: "앉힐 사람"
 recipient_secondary_lam_cv_heir_interaction: "밀 후보"
 lam_cv_seat_interaction: "자문회 자리에 밀기"
 lam_cv_seat_interaction_desc: "파벌 사람 하나를 골라, 자문회에 앉히자는 안건을 파벌회의에 올린다."
 lam_cv_heir_interaction: "후계 후보로 밀기"
 lam_cv_heir_interaction_desc: "상속권을 박탈당하지 않은 주군의 자녀, 현재 후계자, 주군의 대표 작위에 압박 명분을 지닌 인물 가운데 한 사람을 고른다. 파벌회의에서 가결되면 그 후보를 지지한다."
 lam_cv_invalid_heir_tt: "현재 주군의 후계 후보 가운데 살아 있고 우리 파벌이 아직 지지하지 않는 인물을 골라야 한다"
 lam_cv_ag_court: "#high 안건: 궁정당 제안을 받아들일 것인가#!\n가결되면 군주의 공식 지지 파벌이 된다. 같은 지지 관계를 유지하는 동안 다시 표결하지 않는다."
 lam_cv_ag_heir: "#high 안건: 왕위 지지 후보를 바꿀 것인가#!\n가결되면 제안된 후보 [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]을(를) 파벌의 지지 후보로 삼는다."
 lam_cv_ag_crown: "#high 안건: 새 군주에게 맞서 기존 후보를 계속 지지할 것인가#!\n가결되면 반대 노선을 유지한다. 부결되면 기존 후보에 대한 지지를 거두고 새 군주를 관망한다."
 lam_cv_ag_rise: "[Character.Custom('LamCvRiseText')]"
 lam_cv_ag_deal: "#high 안건: 군주와의 타협안을 수락할 것인가#!\n가결된 뒤에만 제시된 보상과 파벌의 의무를 이행한다. 부결되면 대가를 지불하지 않고 기존 입장을 유지한다."
 lam_cv_ag_merge: "#high 안건: 다른 파벌과 합병할 것인가#!\n가결되면 기존 조직을 정리하고 상대 파벌에 합류한다. 부결되면 독자적인 파벌로 남는다.\n합병 상대: [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]의 파벌. 찬성하면 함께 옮겨 가고, 반대하거나 기권하면 무소속으로 남는다."
 lam_cv_ag_confidence: "#high 안건: 현 수장을 교체할 것인가#!\n찬성은 수장 교체, 반대는 현 수장 유지를 뜻한다. 현 수장은 자신에 대한 표결에 참여하지 않는다.\n새 수장 후보: [Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]."
 lam_cv_ag_ban: "#high 안건: 금지령에 불복하고 파벌을 유지할 것인가#!\n가결되면 지하로 숨어 조직을 유지한다. 부결되면 금지령에 따라 해산한다."
 lam_cv_ag_dissolve: "#high 안건: 금지령에 따라 파벌을 해산할 것인가#!\n3분의 2 이상의 동의로 조직을 해산한다. 부결되면 지하에서 명맥을 잇는다."
 lam_cv_ag_withdraw: "#high 안건: 궁정당 지지를 철회할 것인가#!\n가결되면 군주의 공식 지지 파벌 지위를 내려놓고 5년간 다시 궁정당이 되지 않는다."
 lam_cv_ag_loyal: "#high 안건: 군주를 지지하는 노선으로 전환할 것인가#!"
 lam_cv_ag_oppose: "#high 안건: 군주에게 반대하는 노선으로 전환할 것인가#!"
 lam_cv_ag_arm: "#high 안건: 군사적 압박을 준비할 것인가#!\n준비 노선의 의결이다. 실제 거병은 별도의 중대 표결을 거친다."
 lam_cv_ag_watch: "#high 안건: 군주와 거리를 두고 관망할 것인가#!"
 lam_cv_ag_quiet: "#high 안건: 공개적인 행동을 자제할 것인가#!"
 lam_cv_ag_people: "#high 안건: 수장이 정한 노선을 거두고 구성원의 뜻을 따를 것인가#!"
 lam_cv_call_stance_btn_crown: "왕권: 편을 바꾸자"
 lam_cv_call_stance_btn_council: "자문회 자리: 편을 바꾸자"
 lam_cv_call_stance_btn_faith: "신앙과 문화: 편을 바꾸자"
 lam_cv_call_stance_btn_tax: "세금과 징집: 편을 바꾸자"
 lam_cv_call_stance_btn_war: "전쟁 논의: 편을 바꾸자"
 lam_cv_ag_petition: "#high 안건: 주군에게 낼 청원#!"
 lam_cv_ag_stance: "#high 안건: 현안에서 우리 편을 바꿀 것인가#!\n[Character.Custom('LamCrStanceUi')]"
