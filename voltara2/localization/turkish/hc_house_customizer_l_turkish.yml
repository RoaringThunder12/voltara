l_turkish:
 hc_house_customizer:0 "House Customizer"
 hc_house_customizer_desc:0 "Bu karakter, dünyanın yerleşik soyları arasında kendine bir yer talep edebilir."
 trait_hc_house_customizer:0 "House Customizer"
 trait_hc_house_customizer_desc:0 "Bu karakter, dünyanın yerleşik soyları arasında kendine bir yer talep edebilir."
 trait_hc_house_customizer_character_desc:0 "Bu karakter, dünyanın yerleşik soyları arasında kendine bir yer talep edebilir."

 hc_open_house_customizer_interaction:0 "Soy Bağı Talep Et"
 hc_open_house_customizer_interaction_desc:0 "[recipient.GetShortUINameNoTooltip] hanesiyle olan bağının nasıl hatırlanacağını seç."

 hc_house_customizer.0001.t:0 "Kan ve Ad"
 hc_house_customizer.0001.desc:0 "Kâtipler birçok hakikati bilir; birçoğu da sabırlı mürekkeple yeniden yazılmıştır. Önünde, tanınma, ortak kan ya da uzun zamandır unutulmuş bir kol yoluyla [hc_target.GetHouse.GetName] Hanesi'ne uzanan bir yol duruyor."

 hc_house_customizer.0001.become_child:0 "Onların çocuğu olarak tanınayım."
 hc_house_customizer.0001.become_sibling:0 "Onların kardeşleri arasında sayılayım."
 hc_house_customizer.0001.open_bastard_options:0 "Evlilik dışı bir doğumu düşün."
 hc_house_customizer.0001.open_bastard_options_tt:0 "Meşru bir birlik dışında doğmuş bir çocuk olarak tanınmanın çeşitli yollarını değerlendireceksin."
 hc_house_customizer.0001.become_distant_relative:0 "Uzak bir koldan akraba olarak bilineyim."
 hc_house_customizer.0001.cancel:0 "Soyumu değiştirmeyeceğim."

 hc_house_customizer.0002.t:0 "Evlilik Dışı Kan"
 hc_house_customizer.0002.desc:0 "Soylu kanın tamamı kutsal yeminler ve istekli tanıklar altında doğmaz. Bazı hakikatler kroniklerin kenarlarında, mühürlü mektuplarda ve çok az kişinin yüksek sesle söylemeye cesaret ettiği itiraflarda yaşar."
 hc_house_customizer.0002.back:0 "Soyum meselesine geri dön."
 hc_house_customizer.0002.cancel:0 "Bu hakikat gömülü kalsın."

 hc_house_customizer.0001.become_bastard:0 "Bastard olarak tanınayım."
 hc_house_customizer.0001.become_legitimized_bastard:0 "Doğumuma rağmen meşrulaştırılayım."

 hc_house_customizer.tt.become_child:0 "Kayıtlara [hc_target.GetShortUIName] karakterinin çocuğu olarak geçirileceksin."
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName] diğer ebeveynin olarak kaydedilecek."
 hc_house_customizer.tt.become_sibling:0 "[hc_target.GetShortUIName] karakterinin kardeşi olarak tanınacaksın."
 hc_house_customizer.tt.shared_father:0 "[hc_target.GetShortUIName] ile aynı babayı paylaşacaksın."
 hc_house_customizer.tt.shared_mother:0 "[hc_target.GetShortUIName] ile aynı anneyi paylaşacaksın."
 hc_house_customizer.tt.become_distant_relative:0 "Adın, [hc_target.GetHouse.GetName] Hanesi'nin kanından uzak bir kol olarak bu haneye bağlanacak."
 hc_house_customizer.tt.become_bastard:0 "[hc_target.GetShortUIName] karakterinin bastard çocuğu olarak tanınacaksın. Ek bir ebeveyn oluşturulup kaydedilecek."
 hc_house_customizer.tt.become_legitimized_bastard:0 "[hc_target.GetShortUIName] karakterinin meşrulaştırılmış bastard çocuğu olarak tanınacaksın. Ek bir ebeveyn oluşturulup kaydedilecek."
 hc_house_customizer.tt.gain_bastard:0 "Bastard özelliğini kazanacaksın."
 hc_house_customizer.tt.gain_legitimized_bastard:0 "Meşrulaştırılmış Bastard özelliğini kazanacaksın."
 hc_house_customizer.tt.lose_house_customizer:0 "House Customizer özelliğini kaybedeceksin."

 hc_house_customizer.0200.t:0 "Kanın İşareti"
 hc_house_customizer.0200.desc:0 "Bir hanenin adı yalnızca parşömenlerde ve mühürlerde yaşamaz. Gözlerde, saçlarda, duruşta ve eski hizmetkârların solmuş portrelerde daha önce gördüklerine yemin ettikleri çizgilerde de varlığını sürdürür. Görünüşünün [hc_target.GetHouse.GetName] Hanesi'nden biri gibi hatırlanmasına izin verebilir ya da bugüne geldiğin yüzü koruyabilirsin."
 hc_house_customizer.0200.adopt:0 "Kanım onların suretini de taşısın."
 hc_house_customizer.0200.adopt_tt:0 "[hc_target.GetShortUIName] karakterinin kalıtsal görünümünü kopyalayacaksın. Bu saç, göz, ten ve diğer kalıtsal özellikleri değiştirebilir."
 hc_house_customizer.0200.keep:0 "Yüzüm bana ait kalsın."

 hc_house_customizer.ok:0 "Böyle yazılsın."

 hc_house_customizer.0101.t:0 "Çocuk Tanındı"
 hc_house_customizer.0101.desc:0 "Kayıtlar düzeltildi, tanıklar yönlendirildi ve gerekli sözler söylendi. Bu günden itibaren [hc_target.GetShortUIName] karakterinin çocuğu ve [hc_target.GetHouse.GetName] Hanesi'nin bir üyesi olarak tanınıyorsun."

 hc_house_customizer.0102.t:0 "Kardeş Tanındı"
 hc_house_customizer.0102.desc:0 "Aile kroniklerinde kan bağı yeniden düzenlendi. Bu günden itibaren [hc_target.GetShortUIName] karakterinin kardeşleri arasında sayılıyor ve [hc_target.GetHouse.GetName] Hanesi'nin bir üyesi olarak kabul ediliyorsun."

 hc_house_customizer.0103.t:0 "Bastardlık Tanındı"
 hc_house_customizer.0103.desc:0 "Soy her zaman meşru bir çatının altında doğmaz; fakat yeterince kulağın önünde söylenen bir hakikat kısa sürede yasa biçimini alır. [hc_target.GetShortUIName] karakterinin bastard çocuğu olarak tanınıyorsun ve kökenini tamamlamak için ek bir ebeveyn kaydedildi."

 hc_house_customizer.0104.t:0 "Kan Meşrulaştırıldı"
 hc_house_customizer.0104.desc:0 "Düzenin dışında doğan şey artık hanenin kalbine alındı. [hc_target.GetShortUIName] karakterinin meşrulaştırılmış çocuğu olarak tanınıyorsun ve kökenini tamamlamak için ek bir ebeveyn kaydedildi."

 hc_house_customizer.0106.t:0 "Bir Kol Yeniden Kuruldu"
 hc_house_customizer.0106.desc:0 "Her büyük hanenin savaşlara, uzak evliliklere ve eski anlaşmazlıklara karışıp kaybolmuş kolları vardır. Bugün böyle bir kol yeniden tanındı. Artık [hc_target.GetHouse.GetName] Hanesi'ne aitsin."

 hc_house_customizer.0300.t:0 "Kanın Hakları"
 hc_house_customizer.0301.desc:0 "[hc_target.GetShortUIName] karakterinin çocuğu olarak tanınacaksan, miras meselesi dokunulmadan bırakılamaz. Kâtipler, yeni ebeveyninin elindeki unvanlar üzerindeki haklarını da kayda geçirebilir."
 hc_house_customizer.0302.desc:0 "[hc_target.GetShortUIName] karakterinin yeni tanınmış kardeşi olarak, aile kayıtlarının hanenin elindeki topraklar üzerindeki daha zayıf haklarını da korumasını isteyebilirsin."
 hc_house_customizer.0304.desc:0 "Meşrulaştırma bir addan fazlasını taşır. Doğumun artık hane içinde kabul edildiyse, [hc_target.GetShortUIName] karakterinin elindeki topraklar üzerinde hak talep etmeyi de isteyebilirsin."
 hc_house_customizer.0306.desc:0 "Uzak bir kol, daha yakın akrabalardan önce nadiren miras alır; fakat eski kan yine de bir talebi gerekçelendirmek için kullanılabilir. Adına daha zayıf hakların kaydedilmesini isteyebilirsin."
 hc_house_customizer.0300.claim_pressed:0 "Doğrudan miras haklarımı kaydet."
 hc_house_customizer.0300.claim_unpressed:0 "Hanedan haklarımı kaydet."
 hc_house_customizer.0300.no_claims:0 "Ad yeterli."
 hc_house_customizer.0300.claim_pressed_tt:0 "[hc_target.GetShortUIName] karakterinin şu anda elinde tuttuğu unvanlar üzerinde güçlü hak iddiaları kazanacaksın."
 hc_house_customizer.0300.claim_unpressed_tt:0 "[hc_target.GetShortUIName] karakterinin şu anda elinde tuttuğu unvanlar üzerinde zayıf hak iddiaları kazanacaksın."
 hc_house_customizer.0300.claim_distant_tt:0 "[hc_target.GetShortUIName] karakterinin şu anda elinde tuttuğu unvanlar üzerinde zayıf hak iddiaları kazanacaksın. Bu, daha zayıf bir uzak kol iddiasını temsil eder."

 hc_open_house_customizer_decision:0 "House Customizer'ı Kullan"
 hc_open_house_customizer_decision_desc:0 "House Customizer menüsünü aç ve özel hükümdarının soylu soyunu nasıl tanımlayacağını seç."
 hc_open_house_customizer_decision_tooltip:0 "House Customizer menüsünü aç."
 hc_house_customizer_menu.0001.t:0 "House Customizer"
 hc_house_customizer_menu.0001.desc:0 "Bir hanenin kanı kayıtlara yazılabilir, hizmetkârlar tarafından fısıldanabilir ya da unutulmuş bir koldan yeniden canlandırılabilir. Soyunun nasıl şekilleneceğini seç."
 hc_house_customizer_menu.0001.existing_house:0 "Yaşayan bir haneye katıl."
 hc_house_customizer_menu.0001.existing_house_tt:0 "Yaşayan bir haneye katılmak için yaşayan bir soylu karaktere sağ tıkla ve House Customizer etkileşimini kullan."
 hc_house_customizer_menu.0001.extinct_house:0 "Soyu tükenmiş bir haneyi canlandır."
 hc_house_customizer_menu.0001.extinct_house_tt:0 "Soyu tükenmiş haneler isteğe bağlı House Customizer modülleri tarafından yönetilir. Bu çekirdek mod, vanilla ve total conversion modlarıyla uyumluluğu korumak için belirli bir dünyaya ait soyu tükenmiş haneleri içermez."
 hc_house_customizer_menu.0001.cancel:0 "Daha sonra karar vereceğim."
 hc_house_customizer_menu.0002.t:0 "Soyu Tükenmiş Haneler"
 hc_house_customizer_menu.0002.desc:0 "House Customizer'ın çekirdek sürümü sabit bir soyu tükenmiş haneler listesi içermez. Bu, modu vanilla, AGOT, LOTR, Elder Kings ve diğer total conversion modlarıyla uyumlu tutar. Soyu tükenmiş haneler her dünya için hazırlanmış isteğe bağlı modüller aracılığıyla eklenmelidir."
 hc_house_customizer_menu.0002.ok:0 "Anlaşıldı."
