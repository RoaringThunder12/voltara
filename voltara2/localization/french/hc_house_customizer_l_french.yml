l_french:
 hc_house_customizer:0 "Personnalisation de maison"
 hc_house_customizer_desc:0 "Ce personnage peut revendiquer une place parmi les lignées établies du monde."
 trait_hc_house_customizer:0 "Personnalisation de maison"
 trait_hc_house_customizer_desc:0 "Ce personnage peut revendiquer une place parmi les lignées établies du monde."
 trait_hc_house_customizer_character_desc:0 "Ce personnage peut revendiquer une place parmi les lignées établies du monde."

 hc_open_house_customizer_interaction:0 "Revendiquer une lignée"
 hc_open_house_customizer_interaction_desc:0 "Choisissez comment votre lien avec la maison de [recipient.GetShortUINameNoTooltip] sera retenu."

 hc_house_customizer.0001.t:0 "Le sang et le nom"
 hc_house_customizer.0001.desc:0 "Les scribes connaissent bien des vérités, et plus d'une a été corrigée avec une encre patiente. Devant vous s'ouvre une voie vers la maison [hc_target.GetHouse.GetName], que ce soit par reconnaissance, par sang partagé ou par une branche longtemps oubliée."

 hc_house_customizer.0001.become_child:0 "Que l'on me reconnaisse comme leur enfant."
 hc_house_customizer.0001.become_sibling:0 "Que l'on me compte parmi leurs frères et sœurs."
 hc_house_customizer.0001.open_bastard_options:0 "Envisager une naissance hors mariage."
 hc_house_customizer.0001.open_bastard_options_tt:0 "Vous envisagerez plusieurs manières d'être reconnu comme un enfant né hors d'une union légitime."
 hc_house_customizer.0001.become_distant_relative:0 "Que l'on me connaisse comme parent d'une branche éloignée."
 hc_house_customizer.0001.cancel:0 "Je ne modifierai pas ma lignée."

 hc_house_customizer.0002.t:0 "Sang hors mariage"
 hc_house_customizer.0002.desc:0 "Tout sang noble ne naît pas sous des vœux solennels et devant des témoins consentants. Certaines vérités vivent dans les marges des chroniques, les lettres scellées et les confessions que peu osent prononcer."
 hc_house_customizer.0002.back:0 "Revenir à la question de ma lignée."
 hc_house_customizer.0002.cancel:0 "Que cette vérité reste enterrée."

 hc_house_customizer.0001.become_bastard:0 "Que l'on me reconnaisse comme bâtard."
 hc_house_customizer.0001.become_legitimized_bastard:0 "Que l'on me légitime malgré ma naissance."

 hc_house_customizer.tt.become_child:0 "Vous serez inscrit dans les registres comme enfant de [hc_target.GetShortUIName]."
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName] sera enregistré comme votre autre parent."
 hc_house_customizer.tt.become_sibling:0 "Vous serez reconnu comme frère ou sœur de [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_father:0 "Vous partagerez un père avec [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_mother:0 "Vous partagerez une mère avec [hc_target.GetShortUIName]."
 hc_house_customizer.tt.become_distant_relative:0 "Votre nom sera rattaché à la maison [hc_target.GetHouse.GetName] comme une branche éloignée de son sang."
 hc_house_customizer.tt.become_bastard:0 "Vous serez reconnu comme enfant bâtard de [hc_target.GetShortUIName]. Un parent supplémentaire sera généré et enregistré."
 hc_house_customizer.tt.become_legitimized_bastard:0 "Vous serez reconnu comme enfant bâtard légitimé de [hc_target.GetShortUIName]. Un parent supplémentaire sera généré et enregistré."
 hc_house_customizer.tt.gain_bastard:0 "Vous gagnerez le trait Bâtard."
 hc_house_customizer.tt.gain_legitimized_bastard:0 "Vous gagnerez le trait Bâtard légitimé."
 hc_house_customizer.tt.lose_house_customizer:0 "Vous perdrez le trait Personnalisation de maison."

 hc_house_customizer.0200.t:0 "La marque du sang"
 hc_house_customizer.0200.desc:0 "Le nom d'une maison ne vit pas seulement dans les parchemins et les sceaux. Il demeure dans les yeux, dans les cheveux, dans le port, et dans ces traits que les vieux serviteurs jurent avoir déjà vus dans des portraits fanés. Vous pouvez laisser votre apparence être reconnue comme celle de la maison [hc_target.GetHouse.GetName], ou conserver le visage avec lequel vous êtes venu jusqu'à ce jour."
 hc_house_customizer.0200.adopt:0 "Que mon sang porte aussi leur ressemblance."
 hc_house_customizer.0200.adopt_tt:0 "Vous copierez l'apparence héréditaire de [hc_target.GetShortUIName]. Cela peut modifier les cheveux, les yeux, la peau et d'autres traits héréditaires."
 hc_house_customizer.0200.keep:0 "Mon visage restera le mien."

 hc_house_customizer.ok:0 "Ainsi cela sera écrit."

 hc_house_customizer.0101.t:0 "Enfant reconnu"
 hc_house_customizer.0101.desc:0 "Les registres ont été corrigés, les témoins instruits et les paroles nécessaires prononcées. À compter de ce jour, vous êtes reconnu comme enfant de [hc_target.GetShortUIName] et membre de la maison [hc_target.GetHouse.GetName]."

 hc_house_customizer.0102.t:0 "Fratrie reconnue"
 hc_house_customizer.0102.desc:0 "Le sang est réordonné dans les chroniques familiales. À compter de ce jour, vous êtes compté parmi les frères et sœurs de [hc_target.GetShortUIName] et comme membre de la maison [hc_target.GetHouse.GetName]."

 hc_house_customizer.0103.t:0 "Bâtardise reconnue"
 hc_house_customizer.0103.desc:0 "La lignée ne naît pas toujours sous un toit légitime, mais une vérité prononcée devant assez d'oreilles prend bientôt la forme de la loi. Vous êtes reconnu comme enfant bâtard de [hc_target.GetShortUIName], avec un parent supplémentaire enregistré pour compléter votre origine."

 hc_house_customizer.0104.t:0 "Sang légitimé"
 hc_house_customizer.0104.desc:0 "Ce qui était né hors de l'ordre a désormais été ramené au cœur de la maison. Vous êtes reconnu comme enfant légitimé de [hc_target.GetShortUIName], avec un parent supplémentaire enregistré pour compléter votre origine."

 hc_house_customizer.0106.t:0 "Une branche restaurée"
 hc_house_customizer.0106.desc:0 "Toute grande maison possède des branches perdues dans les guerres, les mariages lointains et les vieilles querelles. Aujourd'hui, l'une de ces branches est de nouveau reconnue. Vous appartenez à la maison [hc_target.GetHouse.GetName]."

 hc_house_customizer.0300.t:0 "Rights of Blood"
 hc_house_customizer.0301.desc:0 "If you are to be recognized as the child of [hc_target.GetShortUIName], the question of inheritance cannot be left untouched. Scribes may also record your claims to the titles held by your new parent."
 hc_house_customizer.0302.desc:0 "As the newly acknowledged sibling of [hc_target.GetShortUIName], you may ask that the family records also preserve your weaker rights to the lands held by your house."
 hc_house_customizer.0304.desc:0 "Legitimization carries more than a name. If your birth is now accepted within the house, you may also request claims to the lands held by [hc_target.GetShortUIName]."
 hc_house_customizer.0306.desc:0 "A distant branch rarely inherits before closer kin, but old blood may still be used to justify a claim. You may ask that lesser rights be recorded in your name."
 hc_house_customizer.0300.claim_pressed:0 "Record my direct inheritance rights."
 hc_house_customizer.0300.claim_unpressed:0 "Record my dynastic rights."
 hc_house_customizer.0300.no_claims:0 "The name is enough."
 hc_house_customizer.0300.claim_pressed_tt:0 "You will gain pressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_unpressed_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_distant_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]. This represents a weaker distant-branch claim."

 hc_open_house_customizer_decision:0 "Utiliser House Customizer"
 hc_open_house_customizer_decision_desc:0 "Ouvrez le menu House Customizer et choisissez comment le lignage noble de votre dirigeant personnalisé doit être défini."
 hc_open_house_customizer_decision_tooltip:0 "Ouvrir le menu House Customizer."
 hc_house_customizer_menu.0001.t:0 "House Customizer"
 hc_house_customizer_menu.0001.desc:0 "Le sang d'une maison peut être écrit dans les registres, murmuré par les serviteurs ou ravivé depuis une branche oubliée. Choisissez la forme que prendra votre lignage."
 hc_house_customizer_menu.0001.existing_house:0 "Rejoindre une maison vivante."
 hc_house_customizer_menu.0001.existing_house_tt:0 "Pour rejoindre une maison vivante, faites un clic droit sur un noble vivant et utilisez l'interaction House Customizer."
 hc_house_customizer_menu.0001.extinct_house:0 "Raviver une maison éteinte."
 hc_house_customizer_menu.0001.extinct_house_tt:0 "Les maisons éteintes seront gérées par des modules optionnels House Customizer. Le mod principal n'inclut pas de maisons éteintes précises afin de préserver la compatibilité."
 hc_house_customizer_menu.0001.cancel:0 "Je déciderai plus tard."
 hc_house_customizer_menu.0002.t:0 "Maisons éteintes"
 hc_house_customizer_menu.0002.desc:0 "La version principale de House Customizer n'inclut pas de liste fixe de maisons éteintes. Cela permet de rester compatible avec vanilla, AGOT, LOTR, Elder Kings et d'autres conversions totales. Les maisons éteintes doivent être ajoutées par des modules optionnels propres à chaque univers."
 hc_house_customizer_menu.0002.ok:0 "Compris."
