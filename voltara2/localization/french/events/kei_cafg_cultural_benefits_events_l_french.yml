l_french:
kCAFG_cultural_benefits_events.0001.t: "Bénefice Culturel [culture.GetCollectiveNounNoTooltip]"
kCAFG_cultural_benefits_events.0001.t.unclear: "Bénefice Culturel [culture.GetCollectiveNounNoTooltip]...?"
kCAFG_cultural_benefits_events.0001.desc: "Favoriser la culture [culture.GetName] porte ses fruits!\nLes [culture.GetCollectiveNounNoTooltip] ont l'air d'apprécier la manière dont ils sont traités dans mon pays et deviennent de plus en plus disposés à faire du commerce et partager leurs connaissances avec les autres habitants.\n\n"
kCAFG_cultural_benefits_events.0001.desc.gift: "Un de leur représentant m'a présenté un cadeau démontrant la qualité et la célébrité de leur artisanat tradionnel."
kCAFG_cultural_benefits_events.0001.desc.gold_gift: "Ils ont eu la gentillesse de m'offrir de nombreux objets de valeur, signe de la richesse résultant de notre coopération."
kCAFG_cultural_benefits_events.0001.desc.gold_loot: "Ils m'ont apporté une part du butin qu'ils avaient acquis lors de leurs dernières expéditions pirates dans des contrées étrangères."
kCAFG_cultural_benefits_events.0001.desc.impressive_character: "J'ai été informé qu'un individu particulièrement remarquable nommé [impressive_character.GetName] est bien connu parmi les [culture.GetCollectiveNounNoTooltip] pour ses compétences [impressive_character.GetHerHis] et pourrait potentiellement m'être utile."
kCAFG_cultural_benefits_events.0001.desc.talent_acquisition: "Cependant, cette affaire est assez particulière. Après avoir commis de graves transgressions sur mes terres, un[talent_acquisition.Custom('FR_E')] [Select_CString(talent_acquisition.IsFemale,'criminelle','criminel')] nommé[talent_acquisition.Custom('FR_E')] [talent_acquisition.GetName] a finalement été arrêté[talent_acquisition.Custom('FR_E')] et emprisonné[talent_acquisition.Custom('FR_E')] dans mes geôles. Les nobles avec lesquels [talent_acquisition.GetSheHe] partage ses traditions ont pour habitude de recruter des criminels compétents qui échangent leur jugement contre leur loyauté. Même mes [knights] les plus condamnatoires reconnaissent ses talents de combattant hors du commun..."
kCAFG_cultural_benefits_events.0001.desc.province_modifier: "Leur activité intense montre de nombreuses répercussions positives sur mon domaine."
kCAFG_cultural_benefits_events.0001.desc.character_modifier: "Les plus compétents d'entre eux ont grandement contribué à l'émergence de nouvelles idées qui me seront utiles en tant que $game_concept_ruler$."
kCAFG_cultural_benefits_events.0001.desc.maa_refill_gift: "Des guerriers [culture.GetCollectiveNounNoTooltip] ont décidé de me prêter allégeance et de se joindre à moi dans les batailles à venir."
kCAFG_cultural_benefits_events.0001.desc.esteemed_hospitality: "Trois [culture.GetCollectiveNounNoTooltip] ont décidé que mon $game_concept_court$ leur plaisait et ont décidé de venir à l'improviste, comme le veut la tradition dans leur culture."
kCAFG_cultural_benefits_events.0001.a: "Une agréable surprise !"
kCAFG_cultural_benefits_events.0001.a.gift: "Un cadeau bienvenu!"
kCAFG_cultural_benefits_events.0001.a.impressive_character: "Je pourrai l'inviter à ma cour."
kCAFG_cultural_benefits_events.0001.a.talent_acquisition: "Son recrutement reste ma decision..."
kCAFG_cultural_benefits_events.0001.a.esteemed_hospitality: "Hmm..."

kCAFG_base_gift_name: ""
kCAFG_tradition_artisans_gift_name: "Cadeau des artisans [culture.GetCollectiveNounNoTooltip]"
kCAFG_tradition_sorcerous_metallurgy_gift_name: "Cadeau des métallurgistes [culture.GetCollectiveNounNoTooltip]"
kCAFG_horse_breeders_gift_name: "Cadeau des éleveurs de chevaux [culture.GetCollectiveNounNoTooltip]"
kCAFG_cultural_maa_gift_name: "Guerriers [culture.GetCollectiveNounNoTooltip] loyaux"

E_kCAFG_cultural_boon_tradition_maa_cavalry_refill_tt: "Une partie de vos $game_concept_men_at_arms$ de cavalerie a été réapprovisionnée"
E_kCAFG_cultural_boon_tradition_maa_refill_tt: "Une partie de vos $game_concept_men_at_arms$ [GetMaA(ROOT.Var('maa_refill_gift_name').GetFlagKey).GetName] a été réapprovisionnée"
E_kCAFG_cultural_boon_tradition_maa_gift_tt: "Vous avez reçu en cadeau une $game_concept_army$ de [GetMaA(ROOT.Var('maa_refill_gift_name').GetFlagKey).GetName] à [province.GetName]"
E_kCAFG_cultural_boon_cultural_acceptance_bonus_ritualized_friendship_tt: "Bénefice Culturel de $tradition_fp2_ritualised_friendship_name$"
E_kCAFG_cultural_boon_character_modifier_tt: "Vous obtenez « [GetModifier(TopScope.GetFlagKey('modifier')).GetNameWithTooltip] » pendant #V [TopScope.GetValue('modifier_duration')] ans#!"
E_kCAFG_cultural_boon_province_modifier_tt: "[THIS.Province.GetTitle.GetTierAsNameNoTooltip] de [THIS.Province.GetName] obtient [GetModifier(TopScope.GetFlagKey('modifier')).GetNameWithTooltip] pendant #V [TopScope.GetValue('modifier_duration')] ans#!"
E_kCAFG_cultural_boon_county_modifier_tt: "[THIS.Title.GetName] obtient «  [GetModifier(TopScope.GetFlagKey('modifier')).GetNameWithTooltip] » pendant #V [TopScope.GetValue('modifier_duration')] ans#!"
