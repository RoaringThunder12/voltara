l_french:
kCAFG_court_chaplain_task_conversion.9001.opening: "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
kCAFG_court_chaplain_task_conversion.9001.desc: "Nos efforts pour convertir [focused_province.GetName] se montrent fructueux jusqu'à présent.\nCependant, puisque continuer à [focused_province.GetName] prendrait trop de temps, je recommande de réorienter nos efforts là où ils seraient pertinents."
kCAFG_court_chaplain_task_conversion.9001.desc_tension: "Nos efforts pour convertir [focused_province.GetName] se montrent fructueux jusqu'à présent.\nCependant, puisque [focused_province.GetName] voit sa [rite_tension] s'estomper, je recommande de réorienter nos efforts là où ils seraient pertinents."
kCAFG_court_chaplain_task_conversion.9001.desc_complete: "Nos efforts pour convertir [focused_province.GetName] ont porté leurs fruits; tous nos sujets y suivraient notre foi!\nJe me mets à votre disposition pour poursuivre mes devoirs là où ils seraient pertinents."
kCAFG_court_chaplain_task_conversion.9001.a: "Très bien, je m'en remets à vos compétences."
kCAFG_court_chaplain_task_conversion.9001.a_complete: "Excellent, poursuivez votre tâche où bon vous semble."
kCAFG_court_chaplain_task_conversion.9001.a.tt: "[councillor.GetFirstNameNoTooltip] commencera la conversion à notre [faith|E] à [kCAFG_selected_province_to_focus.GetName]"
kCAFG_court_chaplain_task_conversion.9001.b: "Continuez à convertir [focused_province.GetName]."
kCAFG_court_chaplain_task_conversion.9001.b.tt: "[councillor.GetFirstNameNoTooltip] continue la conversion à notre [faith|E] à [focused_province.GetName]"
kCAFG_court_chaplain_task_conversion.9001.c: "Retournez à vos autres devoirs."
kCAFG_court_chaplain_task_conversion.9001.c.tt: "[councillor.GetFirstNameNoTooltip] retoune à ses tâches subsidiaires"
kCAFG_court_chaplain_task_conversion.9001.d: "Ne me dérangez plus jamais avec ça."
kCAFG_court_chaplain_task_conversion.9001.d.tt: "Vous ne recevrez plus cette lettre de suggestion. Vous pourrez revenir sur votre décision en utilisant l'[interaction|E] #E $kCAFG_accept_court_chaplain_conversion_suggestions_again$#! envers votre conseiller."