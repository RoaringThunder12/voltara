l_french:
kCAFG_steward_task_promote.9001.opening: "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
kCAFG_steward_task_promote.9001.desc: "Nos efforts pour promouvoir notre culture à [focused_province.GetName] se montrent fructueux jusqu'à présent.\nCependant, puisque continuer à [focused_province.GetName] prendrait trop de temps, je recommande de réorienter nos efforts là où ils seraient pertinents."
kCAFG_steward_task_promote.9001.desc_tension: "Nos efforts pour promouvoir notre culture à [focused_province.GetName] se montrent fructueux jusqu'à présent.\nCependant, puisque [focused_province.GetName] voit sa [culture_tension] s'estomper, je recommande de réorienter nos efforts là où ils seraient pertinents."
kCAFG_steward_task_promote.9001.desc_complete: "Nos efforts pour promouvoir notre culture à [focused_province.GetName] ont porté leurs fruits; tous nos sujets là-bas suivraient nos traditions culturelles!\nJe me mets à votre disposition pour poursuivre mes devoirs là où ils seraient pertinents."
kCAFG_steward_task_promote.9001.a: "Très bien, je m'en remets à vos compétences."
kCAFG_steward_task_promote.9001.a_complete: "Excellent, poursuivez votre tâche où bon vous semble."
kCAFG_steward_task_promote.9001.a.tt: "[councillor.GetFirstNameNoTooltip] commencer à proumouvoir notre [culture|E] à [kCAFG_selected_province_to_focus.GetName]"
kCAFG_steward_task_promote.9001.b: "Continuez à promouvoir notre culture à [focused_province.GetName]."
kCAFG_steward_task_promote.9001.b.tt: "[councillor.GetFirstNameNoTooltip] continue de promouvoir notre [culture|E] à [focused_province.GetName]"
kCAFG_steward_task_promote.9001.c: "Retournez à vos autres devoirs."
kCAFG_steward_task_promote.9001.c.tt: "[councillor.GetFirstNameNoTooltip] retoune à ses tâches subsidiaires"
kCAFG_steward_task_promote.9001.d: "Ne me dérangez plus jamais avec ça."
kCAFG_steward_task_promote.9001.d.tt: "Vous ne recevrez plus cette lettre de suggestion. Vous pourrez revenir sur votre décision en utilisant l'[interaction|E] #E $kCAFG_accept_steward_promotion_suggestions_again$#! envers votre conseiller."