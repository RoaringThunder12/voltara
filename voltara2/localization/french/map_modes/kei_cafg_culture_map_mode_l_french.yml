kCAFG_CULTURE_MAP_MODE_TOOLTIP_FULL: "$kCAFG_CULTURE_MAP_MODE_TOOLTIP_amount$ $kCAFG_CULTURE_MAP_MODE_TOOLTIP_adherents$ ($kCAFG_CULTURE_MAP_MODE_TOOLTIP_factor_percent$)"
