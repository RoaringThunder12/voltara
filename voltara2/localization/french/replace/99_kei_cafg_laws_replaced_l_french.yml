l_french:
crown_authority_1_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent choisir une autre [succession_law|El] par partition parmi celles disponibles#!\n$EFFECT_LIST_BULLET$Les [titles|El] peuvent être révoqués\n$EFFECT_LIST_BULLET$Les [vassals|El] peuvent être soustraits\n$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent choisir d'autres [culture_tolerance_laws|El] ou [rite_tolerance_laws|El] parmi celles disponibles#!"
crown_authority_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvsent choisir une autre [succession_law|El] parmi celles disponibles#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Les [vassals|El] ne peuvent pas engager de [war|El] contre les autres vassaux à moins qu’ils utilisent un [hook|El] contre leur [liege|El]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Les [titles|El] des vassaux ne peuvent pas être hérités par les personnages à l’extérieur du [realm|El]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Tout vassal qui refuse une révocation de titre ou la rétractation d’un vassal est considéré comme un [criminal|El]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Les [vassals|E] doivent utiliser les mêmes [laws|E] de tolérance [Concept('culture_tolerance_law', 'Cultural')|E] et [Concept('rite_tolerance_law', 'Religious')|E] que leur [liege|E]#!"
imperial_bureaucracy_1_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent choisir une autre [succession_law|El] par partition parmi celles disponibles#!\n$EFFECT_LIST_BULLET$Les [titles|El] peuvent être révoqués\n$EFFECT_LIST_BULLET$Les [vassals|El] peuvent être soustraits\n$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent choisir d'autres [culture_tolerance_laws|El] ou [rite_tolerance_laws|El] parmi celles disponibles#!"
imperial_bureaucracy_2_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent choisir une [succession_law|El] parmi celles disponibles#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Tout vassal qui refuse une révocation de titre ou la rétractation d’un vassal est considéré comme un [criminal|El]#!\n$EFFECT_LIST_BULLET$Le coût de l’interaction #high $demand_admin_interaction$#! est réduit\n$EFFECT_LIST_BULLET$#indent_newline:3 Les [vassals|E] doivent utiliser les mêmes [laws|E] de tolérance [Concept('culture_tolerance_law', 'Cultural')|E] et [Concept('rite_tolerance_law', 'Religious')|E] que leur [liege|E]#!"
tribal_authority_2_effects: "$EFFECT_LIST_BULLET$Les [titles|El] peuvent être [Concept( 'revoke', 'révoqués' )|E]\n$EFFECT_LIST_BULLET$Les [vassals|El] peuvent être [Concept( 'retract', 'soustraits' )|E]\n$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants peuvent choisir d'autres [culture_tolerance_laws|El] ou [rite_tolerance_laws|El] parmi celles disponibles#!"
tribal_authority_3_effects: "$EFFECT_LIST_BULLET$#indent_newline:3 Les dirigeants [Concept( 'tribal', 'tribaux' )|E] [Concept( 'independent_ruler', 'indépendants' )|E] peuvent coloniser, devenir [Concept( 'feudal', 'féodaux' )|E] ou [Concept( 'clan', 'claniques' )|E]#!\n$EFFECT_LIST_BULLET$#indent_newline:3 Les [vassals|E] doivent utiliser les mêmes [laws|E] de tolérance [Concept('culture_tolerance_law', 'Cultural')|E] et [Concept('rite_tolerance_law', 'Religious')|E] que leur [liege|E]#!"
LAW_ENACT_EFFECT_HEADER: "\n#S Quand cette loi est promulguée :#!"
SUCCESSION_LAW_CHANGE_WINDOW_TITLE: "Changer la loi"
SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_VASSALS_DESC: "Tous les vassaux puissants doivent approuver ce changement de loi"
I_HAVE_POWERFUL_VASSAL_WITH_NEGATIVE_OPINION: "Vous avez au moins un [powerful_vassal|El] avec une opinion négative de vous et qui empêche le changement de cette [law|El]"
SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T Approuve la modification de cette loi#!\n[Character.Custom('FR_le_Char_U_Pi')|U][Character.GetShortUIName] soutient, ou du moins ne peut pas s’opposer, à ce changement de [law|El].\n\nLes raisons peuvent être :\n$BULLET_WITH_TAB$[Character.Custom('FR_IlElle')|U] a une [opinion|El] positive envers vous\n$BULLET_WITH_TAB$[Character.Custom('FR_IlElle')|U] est [Concept('cowed','terrifié')|E][Character.Custom('FR_E')|E] par vous\n$BULLET_WITH_TAB$[Character.Custom('FR_IlElle')|U] est [Concept('prison','emprisonné')|E][Character.Custom('FR_E')|E]"
SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_OPPOSE_TT: "#T S’oppose à la modification de cette loi#!\n[Character.Custom('FR_le_Char_U_Pi')|U][Character.GetShortUIName] désapprouvera ce changement de [law|El].\n\nAfin qu’[Character.Custom('FR_IlElle')] approuve, [Character.Custom('FR_IlElle')] doit soit :\n$BULLET_WITH_TAB$Avoir une [opinion|El] positive envers vous\n$BULLET_WITH_TAB$Être [Concept('cowed','terrifié')|E][Character.Custom('FR_E')|E] par vous\n$BULLET_WITH_TAB$Être [Concept('prison','emprisonné')|E][Character.Custom('FR_E')|E]"
SUCCESSION_TITLE_LAW_WARNING: "@alert_icon! Un titre avec une [title_law|E] spécifique primera sur la [law|El] de votre pays"
 