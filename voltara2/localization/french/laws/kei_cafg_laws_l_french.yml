MY_REALM_SUB_LAWS_HEADER: "Lois de [GetPlayer.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]"

kCAFG_culture_tolerance_law: "[culture_tolerance_law|E]"
kCAFG_culture_intolerant_law: "Intolérance Culturelle"
kCAFG_culture_intolerant_law_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 La [culture_tension_baseline|E] est augmentée à #N [EmptyScope.ScriptValue('V_kCAFG_intolerant_law_tension_factor')|%0]#!#!\n$EFFECT_LIST_BULLET$Interdit la [councillor_task|E] [Concept('accept_culture', Localize('task_kCAFG_accept_culture'))|L]\n$EFFECT_LIST_BULLET$Vitesse de la [councillor_task|E] [Concept('promote_culture', Localize('task_promote_culture'))|L] : [EmptyScope.ScriptValue('V_kCAFG_intolerant_law_conversion_bonus')|%0+=]"
kCAFG_culture_indifferent_law: "Indifférence Culturelle"
kCAFG_culture_indifferent_law_effects_not_in_prev: "Aucun changement de l'$game_concept_opinions$ et à la [culture_tension_baseline|E]"
kCAFG_culture_tolerant_law: "Tolérance Culturelle"
kCAFG_culture_tolerant_law_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 La [culture_tension_baseline|E] est réduite à #P [EmptyScope.ScriptValue('V_kCAFG_tolerant_law_tension_factor')|%0]#!#!\n$EFFECT_LIST_BULLET$Interdit la [councillor_task|E] [Concept('promote_culture', Localize('task_promote_culture'))|L]"
kCAFG_culture_tolerance_law_is_on_cooldown: "Vous avez récemment changé la $kCAFG_culture_tolerance_law$ et pourrez le refaire le [GetCurrentDateWithDiff(GetVarTimeRemaining(CHARACTER.MakeScope, 'kCAFG_culture_tolerance_law_cooldown'))]"
kCAFG_overrides_culture_tolerance_law: "A l'autorité de faire prévaloir sa propre $game_concept_law$ de [culture_tolerance_law|E] sur ses $game_concept_vassals$"
I_LACK_TRIBAL_law_allowing_culture_tolerance_law_change: "Vous n'avez pas la $game_concept_law$ #high [GetLaw('tribal_authority_2').GetName]#! au moins"
I_LACK_BUREAUCRACY_law_allowing_culture_tolerance_law_change: "Vous n'avez pas la $game_concept_law$ #high [GetLaw('imperial_bureaucracy_1').GetName]#! au moins"
I_LACK_law_allowing_culture_tolerance_law_change: "Vous n'avez pas la $game_concept_law$ #high [GetLaw('crown_authority_1').GetName]#! au moins"

kCAFG_allowed_to_change_tolerance_laws_tt: "Une $game_concept_law$ d'[Concept('crown_authority', 'Autorité')] en application parmi vos [lieges|E] fait prévaloir leur [law|E] de tolérance sur la vôtre"

