l_french:
kCAFG_appease_cultural_tensions: "Apaiser les tensions culturelles"
kCAFG_appease_cultural_tensions_desc: "Ce personnage est chargé d'apaiser les tensions entre les cultures du pays de son seigneur lige."
kCAFG_appease_cultural_tensions_tt: "Chaque mois une des [baronies|El] de votre pays peut voir sa [culture_tension|E] réduite de [EmptyScope.ScriptValue('V_kCAFG_appease_cultural_tensions_decrease')|%0]. Un niveau plus élevé d'[aptitude|El] augmentera les chances que cela se produise. Priorise les baronies à haute tension et celles du seigneur lige."
kCAFG_appease_cultural_tensions_has_any_valid_province_tt: "N’importe laquelle des [baronies|E] de votre pays a de la [culture_tension|E]"
kCAFG_appease_cultural_tensions_notification_title: "Tensions culturelles apaisées"
kCAFG_appease_cultural_tensions_notification_desc: "[ROOT.Char.GetShortUIName] a réduit la [culture_tension|E] à [affected_province.GetName]."
kCAFG_appease_cultural_tensions_effect_tt: "[culture_tension|E] réduite de [EmptyScope.ScriptValue('V_kCAFG_appease_cultural_tensions_decrease')|%0]"