l_braz_por:
 hc_house_customizer:0 "Personalizador de Casa"
 hc_house_customizer_desc:0 "Este personagem pode reivindicar um lugar entre as linhagens estabelecidas do mundo."
 trait_hc_house_customizer:0 "Personalizador de Casa"
 trait_hc_house_customizer_desc:0 "Este personagem pode reivindicar um lugar entre as linhagens estabelecidas do mundo."
 trait_hc_house_customizer_character_desc:0 "Este personagem pode reivindicar um lugar entre as linhagens estabelecidas do mundo."

 hc_open_house_customizer_interaction:0 "Reivindicar Linhagem"
 hc_open_house_customizer_interaction_desc:0 "Escolha como seu vínculo com a casa de [recipient.GetShortUINameNoTooltip] será lembrado."

 hc_house_customizer.0001.t:0 "Sangue e Nome"
 hc_house_customizer.0001.desc:0 "Escribas conhecem muitas verdades, e mais de uma já foi corrigida com tinta paciente. Diante de você há um caminho para a Casa [hc_target.GetHouse.GetName], seja por reconhecimento, sangue compartilhado ou um ramo há muito esquecido."

 hc_house_customizer.0001.become_child:0 "Que eu seja reconhecido como sua descendência."
 hc_house_customizer.0001.become_sibling:0 "Que eu seja contado entre seus irmãos."
 hc_house_customizer.0001.open_bastard_options:0 "Considerar um nascimento fora do casamento."
 hc_house_customizer.0001.open_bastard_options_tt:0 "Você considerará várias formas de ser reconhecido como descendência nascida fora de uma união legítima."
 hc_house_customizer.0001.become_distant_relative:0 "Que eu seja conhecido como parente de um ramo distante."
 hc_house_customizer.0001.cancel:0 "Não alterarei minha linhagem."

 hc_house_customizer.0002.t:0 "Sangue Fora do Casamento"
 hc_house_customizer.0002.desc:0 "Nem todo sangue nobre nasce sob votos solenes e testemunhas dispostas. Algumas verdades vivem nas margens das crônicas, em cartas seladas e em confissões que poucos ousam dizer em voz alta."
 hc_house_customizer.0002.back:0 "Voltar à questão da minha linhagem."
 hc_house_customizer.0002.cancel:0 "Que esta verdade permaneça enterrada."

 hc_house_customizer.0001.become_bastard:0 "Que eu seja reconhecido como bastardo."
 hc_house_customizer.0001.become_legitimized_bastard:0 "Que eu seja legitimado apesar do meu nascimento."

 hc_house_customizer.tt.become_child:0 "Você será inscrito nos registros como descendência de [hc_target.GetShortUIName]."
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName] será registrado como seu outro progenitor."
 hc_house_customizer.tt.become_sibling:0 "Você será reconhecido como irmão de [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_father:0 "Você compartilhará um pai com [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_mother:0 "Você compartilhará uma mãe com [hc_target.GetShortUIName]."
 hc_house_customizer.tt.become_distant_relative:0 "Seu nome será unido à Casa [hc_target.GetHouse.GetName] como um ramo distante de seu sangue."
 hc_house_customizer.tt.become_bastard:0 "Você será reconhecido como descendência bastarda de [hc_target.GetShortUIName]. Um progenitor adicional será gerado e registrado."
 hc_house_customizer.tt.become_legitimized_bastard:0 "Você será reconhecido como descendência bastarda legitimada de [hc_target.GetShortUIName]. Um progenitor adicional será gerado e registrado."
 hc_house_customizer.tt.gain_bastard:0 "Você receberá o traço Bastardo."
 hc_house_customizer.tt.gain_legitimized_bastard:0 "Você receberá o traço Bastardo Legitimado."
 hc_house_customizer.tt.lose_house_customizer:0 "Você perderá o traço Personalizador de Casa."

 hc_house_customizer.0200.t:0 "A Marca do Sangue"
 hc_house_customizer.0200.desc:0 "O nome de uma casa não vive apenas em pergaminhos e selos. Ele permanece nos olhos, nos cabelos, no porte e naqueles traços que velhos servos juram já ter visto antes em retratos desbotados. Você pode permitir que sua aparência seja lembrada como uma da Casa [hc_target.GetHouse.GetName], ou manter o rosto com o qual chegou a este dia."
 hc_house_customizer.0200.adopt:0 "Que meu sangue também carregue sua semelhança."
 hc_house_customizer.0200.adopt_tt:0 "Você copiará a aparência hereditária de [hc_target.GetShortUIName]. Isso pode alterar cabelo, olhos, pele e outros traços hereditários."
 hc_house_customizer.0200.keep:0 "Meu rosto continuará sendo meu."

 hc_house_customizer.ok:0 "Assim será escrito."

 hc_house_customizer.0101.t:0 "Descendência Reconhecida"
 hc_house_customizer.0101.desc:0 "Os registros foram corrigidos, as testemunhas instruídas e as palavras necessárias pronunciadas. A partir deste dia, você é reconhecido como descendência de [hc_target.GetShortUIName] e membro da Casa [hc_target.GetHouse.GetName]."

 hc_house_customizer.0102.t:0 "Irmandade Reconhecida"
 hc_house_customizer.0102.desc:0 "O sangue é reordenado nas crônicas familiares. A partir deste dia, você é contado entre os irmãos de [hc_target.GetShortUIName] e como membro da Casa [hc_target.GetHouse.GetName]."

 hc_house_customizer.0103.t:0 "Bastardia Reconhecida"
 hc_house_customizer.0103.desc:0 "A linhagem nem sempre nasce sob um teto legítimo, mas uma verdade dita diante de ouvidos suficientes logo toma a forma da lei. Você é reconhecido como descendência bastarda de [hc_target.GetShortUIName], com um progenitor adicional registrado para completar sua origem."

 hc_house_customizer.0104.t:0 "Sangue Legitimado"
 hc_house_customizer.0104.desc:0 "O que nasceu fora da ordem agora foi levado ao coração da casa. Você é reconhecido como descendência legitimada de [hc_target.GetShortUIName], com um progenitor adicional registrado para completar sua origem."

 hc_house_customizer.0106.t:0 "Um Ramo Restaurado"
 hc_house_customizer.0106.desc:0 "Toda grande casa possui ramos perdidos em guerras, casamentos distantes e antigas disputas. Hoje, um desses ramos é novamente reconhecido. Você pertence à Casa [hc_target.GetHouse.GetName]."

 hc_house_customizer.0300.t:0 "Rights of Blood"
 hc_house_customizer.0301.desc:0 "If you are to be recognized as the child of [hc_target.GetShortUIName], the question of inheritance cannot be left untouched. Scribes may also record your claims to the titles held by your new parent."
 hc_house_customizer.0302.desc:0 "As the newly acknowledged sibling of [hc_target.GetShortUIName], you may ask that the family records also preserve your weaker rights to the lands held by your house."
 hc_house_customizer.0304.desc:0 "Legitimization carries more than a name. If your birth is now accepted within the house, you may also request claims to the lands held by [hc_target.GetShortUIName]."
 hc_house_customizer.0306.desc:0 "A distant branch rarely inherits before closer kin, but old blood may still be used to justify a claim. You may ask that lesser rights be recorded in your name."
 hc_house_customizer.0300.claim_pressed:0 "Record my direct inheritance rights."
 hc_house_customizer.0300.claim_unpressed:0 "Record my dynastic rights."
 hc_house_customizer.0300.no_claims:0 "The name is enough."
 hc_house_customizer.0300.claim_pressed_tt:0 "You will gain pressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_unpressed_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_distant_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]. This represents a weaker distant-branch claim."

 hc_open_house_customizer_decision:0 "Usar House Customizer"
 hc_open_house_customizer_decision_desc:0 "Abra o menu House Customizer e escolha como a linhagem nobre do seu governante personalizado será definida."
 hc_open_house_customizer_decision_tooltip:0 "Abrir o menu House Customizer."
 hc_house_customizer_menu.0001.t:0 "House Customizer"
 hc_house_customizer_menu.0001.desc:0 "O sangue de uma casa pode ser escrito em registros, sussurrado por servos ou revivido a partir de um ramo esquecido. Escolha como sua linhagem deve tomar forma."
 hc_house_customizer_menu.0001.existing_house:0 "Entrar em uma casa viva."
 hc_house_customizer_menu.0001.existing_house_tt:0 "Para entrar em uma casa viva, clique com o botão direito em um personagem nobre vivo e use a interação House Customizer."
 hc_house_customizer_menu.0001.extinct_house:0 "Reviver uma casa extinta."
 hc_house_customizer_menu.0001.extinct_house_tt:0 "Casas extintas serão tratadas por módulos opcionais do House Customizer. O mod principal não inclui casas extintas específicas para preservar compatibilidade."
 hc_house_customizer_menu.0001.cancel:0 "Decidirei mais tarde."
 hc_house_customizer_menu.0002.t:0 "Casas extintas"
 hc_house_customizer_menu.0002.desc:0 "A versão principal do House Customizer não inclui uma lista fixa de casas extintas. Isso mantém o mod compatível com vanilla, AGOT, LOTR, Elder Kings e outras total conversions. Casas extintas devem ser adicionadas por módulos opcionais feitos para cada ambientação."
 hc_house_customizer_menu.0002.ok:0 "Entendido."
