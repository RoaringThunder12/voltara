 lam_cv_invalid_heir_tt: "必须从现任领主的继承人选中，选择一位在世且本派系尚未支持的人物"
 lam_cv_ag_court: "#high 议题：是否接受成为宫廷党的提议#!\n若获通过，本派系将成为君主正式的支持派系。在此支持关系维持期间，不再重新表决。"
 lam_cv_ag_heir: "#high 议题：是否更换所支持的王位人选#!\n若获通过，派系将以被提名的人选[Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]作为支持对象。"
 lam_cv_ag_crown: "#high 议题：是否对抗新君主，继续支持原先的人选#!\n若获通过，则维持反对路线。若遭否决，则撤回对原人选的支持，转而观望新君主。"
 lam_cv_ag_rise: "[Character.Custom('LamCvRiseText')]"
 lam_cv_ag_deal: "#high 议题：是否接受与君主的妥协方案#!\n只有获得通过之后，才会兑现所提出的补偿与派系的义务。若遭否决，则不付出任何代价，维持原有立场。"
 lam_cv_ag_merge: "#high 议题：是否与其他派系合并#!\n若获通过，则解散现有组织，并入对方派系。若遭否决，则仍为独立的派系。\n合并对象：[Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]的派系。投赞成票者随之转入，投反对票或弃权者则成为无派系者。"
 lam_cv_ag_confidence: "#high 议题：是否撤换现任首领#!\n赞成即撤换首领，反对即保留现任首领。现任首领不参与针对自己的表决。\n新首领人选：[Character.MakeScope.Var('lam_cr_target').Char.GetShortUIName]。"
 lam_cv_ag_ban: "#high 议题：是否抗拒禁令，保全派系#!\n若获通过，则转入地下，维持组织。若遭否决，则依禁令解散。"
 lam_cv_ag_dissolve: "#high 议题：是否依禁令解散派系#!\n须获三分之二以上同意，方可解散组织。若遭否决，则在地下延续命脉。"
 lam_cv_ag_withdraw: "#high 议题：是否撤回作为宫廷党的支持#!\n若获通过，则放弃君主正式支持派系的地位，5年内不再成为宫廷党。"
 lam_cv_ag_loyal: "#high 议题：是否转向支持君主的路线#!"
 lam_cv_ag_oppose: "#high 议题：是否转向反对君主的路线#!"
 lam_cv_ag_arm: "#high 议题：是否准备施加军事压力#!\n这是关于备战路线的表决。真正举兵须另经一次重大表决。"
 lam_cv_ag_watch: "#high 议题：是否与君主保持距离，静观其变#!"
 lam_cv_ag_quiet: "#high 议题：是否克制公开行动#!"
