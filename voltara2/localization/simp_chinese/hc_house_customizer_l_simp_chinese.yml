l_simp_chinese:
 hc_house_customizer:0 "家族定制者"
 hc_house_customizer_desc:0 "该角色可以宣称自己在世间既有血脉中占有一席之地。"
 trait_hc_house_customizer:0 "家族定制者"
 trait_hc_house_customizer_desc:0 "该角色可以宣称自己在世间既有血脉中占有一席之地。"
 trait_hc_house_customizer_character_desc:0 "该角色可以宣称自己在世间既有血脉中占有一席之地。"

 hc_open_house_customizer_interaction:0 "宣称血脉"
 hc_open_house_customizer_interaction_desc:0 "选择你与[recipient.GetShortUINameNoTooltip]家族的联系将如何被铭记。"

 hc_house_customizer.0001.t:0 "血脉与姓氏"
 hc_house_customizer.0001.desc:0 "书记官知晓许多真相，也有不止一项真相曾被耐心的墨水修正。摆在你面前的是一条通往[hc_target.GetHouse.GetName]家族的道路，无论是经由承认、共同血脉，还是一支被长久遗忘的旁支。"

 hc_house_customizer.0001.become_child:0 "让世人承认我是其子嗣。"
 hc_house_customizer.0001.become_sibling:0 "让世人将我列入其兄弟姊妹之中。"
 hc_house_customizer.0001.open_bastard_options:0 "考虑一段婚外出身。"
 hc_house_customizer.0001.open_bastard_options_tt:0 "你将考虑数种方式，使自己被承认为合法婚姻之外出生的子嗣。"
 hc_house_customizer.0001.become_distant_relative:0 "让世人知道我是远支亲族。"
 hc_house_customizer.0001.cancel:0 "我不会改变自己的血脉。"

 hc_house_customizer.0002.t:0 "婚外之血"
 hc_house_customizer.0002.desc:0 "并非所有贵族血脉都诞生于庄严誓言与心甘情愿的见证者之下。有些真相藏在编年史的边角、封缄的书信，以及少有人敢说出口的忏悔之中。"
 hc_house_customizer.0002.back:0 "回到我的血脉问题。"
 hc_house_customizer.0002.cancel:0 "让这个真相继续被埋葬。"

 hc_house_customizer.0001.become_bastard:0 "让世人承认我是私生子嗣。"
 hc_house_customizer.0001.become_legitimized_bastard:0 "让世人承认我虽出身有碍，却已被合法化。"

 hc_house_customizer.tt.become_child:0 "你将被载入记录，成为[hc_target.GetShortUIName]的子嗣。"
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName]将被记录为你的另一位父母。"
 hc_house_customizer.tt.become_sibling:0 "你将被承认为[hc_target.GetShortUIName]的兄弟姊妹。"
 hc_house_customizer.tt.shared_father:0 "你将与[hc_target.GetShortUIName]拥有同一位父亲。"
 hc_house_customizer.tt.shared_mother:0 "你将与[hc_target.GetShortUIName]拥有同一位母亲。"
 hc_house_customizer.tt.become_distant_relative:0 "你的名字将作为[hc_target.GetHouse.GetName]家族远支血脉的一员被纳入其中。"
 hc_house_customizer.tt.become_bastard:0 "你将被承认为[hc_target.GetShortUIName]的私生子嗣。系统会生成并记录一位额外父母。"
 hc_house_customizer.tt.become_legitimized_bastard:0 "你将被承认为[hc_target.GetShortUIName]的已合法化私生子嗣。系统会生成并记录一位额外父母。"
 hc_house_customizer.tt.gain_bastard:0 "你将获得私生子特质。"
 hc_house_customizer.tt.gain_legitimized_bastard:0 "你将获得合法化私生子特质。"
 hc_house_customizer.tt.lose_house_customizer:0 "你将失去家族定制者特质。"

 hc_house_customizer.0200.t:0 "血脉印记"
 hc_house_customizer.0200.desc:0 "家族之名并不只存在于羊皮纸与印章之上。它也残留在眼眸、发色、举止，以及那些老仆人发誓曾在褪色肖像中见过的面容特征里。你可以让自己的外貌被视为[hc_target.GetHouse.GetName]家族的一部分，也可以保留自己来到今日时的容貌。"
 hc_house_customizer.0200.adopt:0 "让我的血脉也承载他们的相貌。"
 hc_house_customizer.0200.adopt_tt:0 "你将复制[hc_target.GetShortUIName]的可遗传外貌。这可能改变头发、眼睛、肤色及其他遗传特征。"
 hc_house_customizer.0200.keep:0 "我的面容仍将属于我自己。"

 hc_house_customizer.ok:0 "就这样写下吧。"

 hc_house_customizer.0101.t:0 "子嗣得到承认"
 hc_house_customizer.0101.desc:0 "记录已被修正，见证者已被告知，必要的话语也已说出。从今日起，你被承认为[hc_target.GetShortUIName]的子嗣，并成为[hc_target.GetHouse.GetName]家族的一员。"

 hc_house_customizer.0102.t:0 "手足得到承认"
 hc_house_customizer.0102.desc:0 "血脉在家族编年史中被重新排列。从今日起，你被列入[hc_target.GetShortUIName]的兄弟姊妹之中，并成为[hc_target.GetHouse.GetName]家族的一员。"

 hc_house_customizer.0103.t:0 "私生身份得到承认"
 hc_house_customizer.0103.desc:0 "血脉并不总是诞生于合法屋檐之下，但当真相在足够多的人耳边被说出，它很快便会具有法律的形状。你被承认为[hc_target.GetShortUIName]的私生子嗣，并记录了一位额外父母以补全你的出身。"

 hc_house_customizer.0104.t:0 "血脉得到合法化"
 hc_house_customizer.0104.desc:0 "生于秩序之外者，如今已被带入家族的核心。你被承认为[hc_target.GetShortUIName]的合法化子嗣，并记录了一位额外父母以补全你的出身。"

 hc_house_customizer.0106.t:0 "一支旁系重归家族"
 hc_house_customizer.0106.desc:0 "每个伟大家族都有因战争、远嫁远娶和旧日纷争而失落的分支。今日，其中一支再次得到承认。你属于[hc_target.GetHouse.GetName]家族。"

 hc_house_customizer.0300.t:0 "Rights of Blood"
 hc_house_customizer.0301.desc:0 "If you are to be recognized as the child of [hc_target.GetShortUIName], the question of inheritance cannot be left untouched. Scribes may also record your claims to the titles held by your new parent."
 hc_house_customizer.0302.desc:0 "As the newly acknowledged sibling of [hc_target.GetShortUIName], you may ask that the family records also preserve your weaker rights to the lands held by your house."
 hc_house_customizer.0304.desc:0 "Legitimization carries more than a name. If your birth is now accepted within the house, you may also request claims to the lands held by [hc_target.GetShortUIName]."
 hc_house_customizer.0306.desc:0 "A distant branch rarely inherits before closer kin, but old blood may still be used to justify a claim. You may ask that lesser rights be recorded in your name."
 hc_house_customizer.0300.claim_pressed:0 "Record my direct inheritance rights."
 hc_house_customizer.0300.claim_unpressed:0 "Record my dynastic rights."
 hc_house_customizer.0300.no_claims:0 "The name is enough."
 hc_house_customizer.0300.claim_pressed_tt:0 "You will gain pressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_unpressed_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_distant_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]. This represents a weaker distant-branch claim."

 hc_open_house_customizer_decision:0 "使用家族定制器"
 hc_open_house_customizer_decision_desc:0 "打开家族定制器菜单，并选择你的自定义统治者应如何定义其贵族血统。"
 hc_open_house_customizer_decision_tooltip:0 "打开家族定制器菜单。"
 hc_house_customizer_menu.0001.t:0 "家族定制器"
 hc_house_customizer_menu.0001.desc:0 "家族的血脉可以写入记录，可以由仆人低声传述，也可以从被遗忘的分支中重新复兴。选择你的血统将以何种方式成形。"
 hc_house_customizer_menu.0001.existing_house:0 "加入一个仍然存在的家族。"
 hc_house_customizer_menu.0001.existing_house_tt:0 "若要加入仍然存在的家族，请右键点击一名存活的贵族角色，并使用家族定制器互动。"
 hc_house_customizer_menu.0001.extinct_house:0 "复兴一个绝嗣家族。"
 hc_house_customizer_menu.0001.extinct_house_tt:0 "绝嗣家族将由家族定制器的可选模块处理。核心模组不包含特定设定的绝嗣家族，以保持兼容性。"
 hc_house_customizer_menu.0001.cancel:0 "稍后再决定。"
 hc_house_customizer_menu.0002.t:0 "绝嗣家族"
 hc_house_customizer_menu.0002.desc:0 "家族定制器核心版本不包含固定的绝嗣家族列表。这样可以保持与原版、AGOT、LOTR、Elder Kings以及其他大型全转换模组的兼容。绝嗣家族应通过针对每个设定制作的可选模块添加。"
 hc_house_customizer_menu.0002.ok:0 "明白了。"
