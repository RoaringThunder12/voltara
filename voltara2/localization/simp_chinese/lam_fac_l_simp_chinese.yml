 lam_faction.0290.t: "在哪个宫廷"
 lam_faction.0290.desc: "我是别人的封臣，自己麾下也有封臣。派系要立在哪里？"
 lam_faction.0290.a: "在领主的宫廷——在同僚封臣之间"
 lam_faction.0290.b: "在我的宫廷——在我的封臣之间"
 lam_faction.0300.peer: "派系需要一张面孔——一张让人们闻其名便愿聚拢而来的面孔。我可以亲自出面，也可以托付给更合适的人。只是对方是否愿意接受，就不得而知了。"
 lam_faction.0300.own: "我要在自己的宫廷里立一个由我的人组成的派系。只是我不能当首领——君主一旦亲自领导，那就不是派系，而是君权了。必须托付给某位封臣。我开口相求，对方很难拒绝，但终究还是可以拒绝。"
 lam_faction.0300.me: "由我亲自领导"
 lam_faction.0300.me_tt: "我成为这个派系的首领。最初1年内，即使只有我一人，派系也不会离散。"
 lam_faction.0300.acc1: "接受的可能性：#V [lam_ff_c1.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc2: "接受的可能性：#V [lam_ff_c2.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
