 lam_fac_backed_won_title: "我们动用派系金库扶持的[lam_ad_won.GetShortUIName]登上了那个位置"
 lam_faction.0100.g: "改以金钱代替让步"
 lam_faction.0100.g_tt: "向派系首领奉上金钱，请其撤回要求。事关原则的要求（继承、信仰、禁止褫夺头衔）很难用金钱打发（基础65%，原则问题−30，首领贪婪+20）。若对方接受：宠信+8，两年内不再提出同样的要求。积怨不会因此消解。"
 lam_faction.0100.g_no_tt: "若对方拒绝，则视同驳回了要求。"
 lam_fac_first_win_title: "我们的派系第一次从领主那里争得了些什么"
 lam_fac_rally_thanks_title: "我会记住战争期间站在王室一边的派系（宠信+10）"
 lam_faction.3030.t: "起事之后"
 lam_faction.3030.desc: "[lam_rf_cur.GetShortUIName]的派系发动的起事以失败告终。放下兵器的他们正在等候发落。如何处置这个派系，如今全在我手中。"
 lam_faction.3030.a: "将领导起事的[lam_rf_rebel.GetShortUIName]打入地牢"
 lam_faction.3030.b: "暂缓惩处"
 lam_faction.3030.b_tt: "宠信+10，首领心怀感激。叛逆之罪不会从记录中抹去。"
 lam_faction.3030.c: "令其立下效忠誓约，允许存续"
 lam_faction.3030.c_tt: "派系得以保留，但五年内受效忠誓约约束，不得与君权对抗。"
 lam_faction.3030.d: "下令解散派系"
 lam_faction.3030.d_tt: "派系将被解散。首领会心怀怨恨，暴政增加。"
 lam_fac_debug_seize_decision_confirm: "成为幕后掌权者（调试）"
 lam_fac_task_sulking_tt: "此人不满会议的决定，正拒绝首领交付的任务"
