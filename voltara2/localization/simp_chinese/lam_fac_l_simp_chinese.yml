 lam_faction.2900.t: "王座背后的实权"
 lam_faction.2900.desc: "[lam_sh_king.GetShortUIName]如今只是名义上的君主。真正左右这个国家的人，是我。"
 lam_faction.2900.a: "如今这个国家是我的了"
 lam_faction.2900.a.tt: "可在谋略窗口的傀儡列表中，以君主的名义收回或授予头衔、指定继承人、修改封臣契约、宣战或结盟、囚禁或处决等。右键点击君主，可随意安排其内阁人选（包括我自己）；右键点击我的头像，可担任任意数量的宫廷职位。君主无法违抗我（好感+100），不会对我的派系提出任何要求，若擅自开战，须经我批准。一旦派系势力跌破宫廷的35%，操纵之线便会断开。"
