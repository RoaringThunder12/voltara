 rule_lam_faction_scope_desc: "运行封臣派系的宫廷范围。玩家的宫廷及其上级君主始终包括在内。范围越广，负担越重（AI宫廷每年更新一次）。"
 setting_lam_faction_scope_player_area: "玩家周边"
 setting_lam_faction_scope_player_area_desc: "玩家的宫廷、其上级君主，以及与玩家所属最高国家接壤的独立统治者。"
 setting_lam_faction_scope_kings: "所有国王及以上"
 setting_lam_faction_scope_kings_desc: "所有王国级及以上的宫廷。"
 setting_lam_faction_scope_dukes: "所有公爵及以上"
 setting_lam_faction_scope_dukes_desc: "所有公国级及以上的宫廷。"
 setting_lam_faction_scope_all: "所有宫廷（默认）"
 setting_lam_faction_scope_all_desc: "所有至少拥有一名伯爵及以上直属封臣的宫廷。在封臣不足四人的小宫廷里，一个心怀不满的封臣本身就是一个派系。"
 setting_lam_faction_scope_off: "关闭"
 setting_lam_faction_scope_off_desc: "不生成封臣派系（内宅派系照旧）。"
 rule_lam_fac_absorb: "Living Factions：贵族政治整合"
 rule_lam_fac_absorb_desc: "在适用的宫廷中，独立、自由权、拥立宣称者与解体的诉求，都由Living Factions的会议与联盟来决定。没有常设派系的宫廷同样适用，无派系者也可以参与。战争与胜负沿用原版游戏的处理，相应的贵族派系不会在另一份派系列表中重复显示。行政制、日本、中国的特有政治与民众起义仍保留现行的独立流程。"
 setting_lam_fac_absorb_on: "整合（默认）"
 setting_lam_fac_absorb_on_desc: "常设派系与无派系者围绕具体诉求结成联盟，由表示同意的人付诸行动。"
 setting_lam_fac_absorb_off: "保持原样"
 setting_lam_fac_absorb_off_desc: "原版派系照常各自运作。"
