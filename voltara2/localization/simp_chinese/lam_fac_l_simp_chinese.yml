 lam_fac_stage_9: "#weak 地下——遭禁的派系，潜藏待时#!"
 lam_fac_ban_decision: "禁绝派系"
 lam_fac_ban_decision_desc: "宫廷中的派系正在蚕食君权。如今要禁止的，是他们结党这件事本身。这需要耗费大量威望与金钱，所有封臣都会对这道敕令心怀不满。禁令生效期间，雇用密探的开销（威望-0.5/月，直辖领地税收-5%）会持续产生。作为交换，派系在原则上即属非法。胆怯者会离去，只有死硬分子留在暗处。留在地下的派系会秘密集会、散发诽谤传单、利用官职侵吞金钱，待凝聚力牢固之时，终将起事。每一次行动都可能暴露身份。留在地下的首领与核心成员会背负犯罪秘密。若通过谍报查出，便可成为将其投入监狱的理由，或用来束缚对方的牵制。"
 lam_fac_ban_decision_tooltip: "禁绝派系"
 lam_fac_ban_need_foe_tt: "有对我心怀不满的派系"
 lam_fac_ban_power_tt: "我的军力超过所有心怀不满之派系的力量总和"
 lam_fac_ban_decision_effect_tt: "禁绝所有派系，或只保留保王派。"
 lam_faction.0900.t: "派系禁令"
 lam_faction.0900.desc: "敕令宣读完毕，大殿上一片沉寂。自今日起，未经君主许可而结党者，即为叛逆。有人低下了头，有人避开了彼此的目光。还有一些人，脸上不露任何神色——要提防的，恰恰是这种人。"
 lam_faction.0900.a: "禁绝所有派系"
 lam_faction.0900.a_tt: "所有派系都将成为非法。所有封臣都会对敕令心生反感（−20，5年）。各派系的首领会决定是悄然解散，还是潜入地下。君权与恐惧越强，选择解散的就越多；君权弱时（低于35），大多数会潜藏起来。解散的派系会留下遗产后消失。潜入地下的派系，同情者与亲信会离去，只剩核心成员。潜藏期间只能动用一半的势力（起事需要20%的势力）。其首领与核心成员会背负“遭禁派系”的犯罪秘密，一旦秘密被查出，便成为囚禁的理由。抓捕并囚禁潜藏派系的首领，该派系就会被剿灭，君主则获得威望与恐惧。禁令之下，派系只能在地下创立。地下派系只有在密探查出的范围内才可见。禁令生效期间，所有未解散的派系都在地下。只有起事之后，其真面目才会完全暴露。"
 lam_faction.0900.b: "只保留保王派，其余一律禁绝"
 lam_faction.0900.b_tt: "只有王党（宫廷党）得以公开存续，其余派系如上所述一律沦为非法。所有封臣的反感也一样。若没有王党，最忠诚的派系便成为王党。"
 lam_faction.0900.c: "还不是时候"
