 lam_faction.0100.d.heir: "“[ROOT.Char.Custom('FormOfAddressForLiege')]的子女之中，能承受王冠之重的，是[lam_pet_heir.GetFirstName]大人。我们如此相信，我们的人也如此相信。请立其为继承人。”"
 lam_faction.0100.d.law: "“王廷的手压得太重了，连我们自己土地上的事，都有国王的人来察看。请放松君权的缰绳。”"
 lam_faction.0100.d.no_revoke: "“所有人都看见了[ROOT.Char.Custom('FormOfAddressForLiege')]收回封臣的土地。下一个会是谁？请您立下约定，不动小领主们的封地。”"
 lam_faction.0100.d.tolerance: "“我们的语言与祈祷在这座宫廷里遭人轻视。请把我们当作侍奉同一位国王的子民来看待。”"
 lam_faction.0100.d.faith: "“[ROOT.Char.Custom('FormOfAddressForLiege')]的内阁里，坐着不奉真信仰的人。请把那些席位交还给虔信之人。”"
 lam_faction.0100.d.campaign: "“刀剑都要生锈了。我们已经好几年没上过战场。请许诺我们一场远征吧，荣耀本就该共享。”"
 lam_faction.0100.d.council: "“内阁的席位总被同一批人占着。我们的声音也该传到那里。”"
 lam_faction.0100.d.reward: "“[ROOT.Char.Custom('FormOfAddressForLiege')]动摇之时，我们曾手持刀剑站在您身旁。请记住这份忠诚。”"
 lam_faction.0100.d.redress: "“我们在这座宫廷里受的是什么样的对待，[ROOT.Char.Custom('FormOfAddressForLiege')]可知道吗？再这样下去，我们的人就留不住了。”"
 lam_faction.0100.liar: "\n\n#italic 他们的眼神里没有信任。我违背过的承诺，他们也都记得。此刻我的承诺一文不值。#!"
