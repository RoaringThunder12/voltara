 lam_fac_card_heir_other: "#weak 拥立的继承人：#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #N （其他人选）#!"
 lam_fac_card_heir_tt: "这个派系私下希望由谁成为下一任君主。依据首领的好感、自家血脉（外戚）、婚姻、信仰与文化、年龄，以及派系路线所看重的品质来挑选。若拥立的不是法定继承人，派系的气势就会高涨；拥立人选不同的派系之间会成为敌人。君主死时，若自家人选未能得到王冠，派系便会反目；若该人选握有宣称，还可能演变为拥立宣称者的战争。"
 lam_fac_badge_promise: "#P 已获承诺#!"
 lam_fac_defiance_title: "[lam_abs_lead.GetShortUIName]的派系抗命了。他们虽拿不出起事的大义，却在削减应向领主缴纳的征召兵与税金。削减多少，取决于派系的势力"
 lam_fac_defiance_modifier: "封臣抗命"
 lam_fac_defiance_modifier_desc: "一个势力强大的派系（占封臣势力的35%以上）抗命，大幅削减应向领主缴纳的征召兵与税金。"
