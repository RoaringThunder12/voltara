 lam_faction.0700.t: "两个派系正面相撞"
 lam_faction.0700.heir: "[lam_cl_a.GetTitledFirstName]拥立[lam_cl_a_heir.GetFirstName]为下一任国王，[lam_cl_b.GetTitledFirstName]则拥立[lam_cl_b_heir.GetFirstName]。今天的宴会上，这场争吵当着所有人的面爆发了。有人说出了“嫡统”二字，也有人把手按在了剑柄上。"
 lam_faction.0700.council: "为了内阁的席位，[lam_cl_a.GetTitledFirstName]的人与[lam_cl_b.GetTitledFirstName]的人互相告发。一方占了席位，另一方则高喊那席位是靠收买得来的。"
 lam_faction.0700.crown: "[lam_cl_a.GetTitledFirstName]的派系与[lam_cl_b.GetTitledFirstName]的派系在君权问题上针锋相对。一方要把国王抬得更高，另一方则要将其拉下马。今天，这些话在我面前撞到了一起。"
 lam_faction.0700.blood: "[lam_cl_a.GetTitledFirstName]家与[lam_cl_b.GetTitledFirstName]家之间的旧怨再度燃起。如今，两个派系都被整个卷进了这场争斗。"
 lam_faction.0700.end: "\n\n两人都望着我。无论我做什么、不做什么，那都将是我的回答。"
