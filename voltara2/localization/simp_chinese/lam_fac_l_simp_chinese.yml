 lam_faction.0800.news_head: "\n\n#high 邻国消息#!"
 lam_faction.1700.t: "最后一夜"
 lam_faction.1700.desc: "子夜已过，城门外火把通明。[lam_ult_lead.GetTitledFirstName]率领着一群武装之人，已候在那里。使者带来的话很短：今夜若得不到答复，天一亮，旗帜便会升起。"
 lam_faction.1700.why: "\n\n#weak 把他们逼到这一步的是：#! [lam_ult_lead.Custom('LamFacNerve1')][lam_ult_lead.Custom('LamFacNerve2Sep')]"
 lam_faction.1700.past.wronged: "\n\n#italic 火把下的那些面孔中，有几张属于被我关押之人的兄弟。#!"
 lam_faction.1700.past.spurned: "\n\n#italic 他们拥立的人选没能得到王冠。今夜，他们是来讨这笔债的。#!"
 lam_faction.1700.past.betrayed: "\n\n#italic 我背弃的那份承诺，他们一个字都没有忘。#!"
 lam_faction.1700.ask: "\n\n掌玺大臣压低声音问道：“您打算怎么办？”"
 lam_faction.1700.a: "答应他们的要求"
 lam_faction.1700.a_tt: "失去威望。作为交换，该派系的宠信大幅上升，怨恨得以化解，并且2年内气势下降25。"
 lam_faction.1700.b: "用金钱买下誓约"
 lam_faction.1700.b_tt: "奉上一大笔金钱，换取5年的忠诚誓约（2年内气势−25）。贪婪的首领容易接受；野心勃勃或睚眦必报的首领，以及曾遭我不公对待的派系，则容易拒绝。若遭拒绝，金钱分文不少，但他们会在天亮时起事。"
 lam_faction.1700.c: "擒拿首领"
 lam_faction.1700.c_tt: "在旗帜升起之前擒住首领，投入牢中。恐怖值越高、我的勇武越强、身边有宫廷党，就越容易成功；派系越大，则越难。即便成功，暴政也会上升，该派系将怀着遭受清洗的怨恨。若失败，则失去威望，他们会立即起事。"
 lam_faction.1700.d: "让他们来吧"
 lam_faction.1700.d_tt: "绝不妥协。获得少许威望，他们会在天亮时起事。"
 lam_fac_ult_oath_yes: "[lam_ult_lead.GetFirstName]收下金子，立下了誓约。火把一支接一支地熄灭了"
 lam_fac_ult_oath_no: "[lam_ult_lead.GetFirstName]把金子扔在了地上。天一亮，旗帜便会升起"
 lam_fac_ult_arrest_yes: "[lam_ult_lead.GetFirstName]已被锁链缚住。城门外的火把四散而去"
 lam_fac_ult_arrest_no: "没能擒住[lam_ult_lead.GetFirstName]。他们起事了"
 lam_fac_card_rep: "\"[Character.Custom('LamFacRep')]\""
 lam_fac_card_rep_tt: "#weak 宫廷中人对这个派系的说法。由派系的势力、路线、凝聚力、资历与当下形势决定。#!"
