 lam_faction.0100.past.wronged: "\n\n#italic 他们仍记得同伴被我抓走、承诺遭到背弃的那些事。今日的要求，便是从那段记忆中来的。#!"
 lam_faction.0100.past.spurned: "\n\n#italic 他们所拥立的人选，在上一次即位时没能得到王冠。他们没有忘记此事。#!"
 lam_faction.0100.past.purge: "\n\n#italic 这个派系曾熬过一场清洗。自那以后，他们在君主面前字斟句酌，作为交换，他们想要保证。#!"
 lam_faction.0100.past.pardoned: "\n\n#italic 他们曾在禁令之下藏身度日，后来得到了赦免。如今重见天日，他们想把这一席之地坐稳。#!"
 lam_faction.0100.past.old: "\n\n#italic 这是一个古老的派系，首领已传至第[lam_pet_lead.MakeScope.Var('lam_fac_gen').GetValue|0]任。他们的要求里，承载着前代人的记忆。#!"
