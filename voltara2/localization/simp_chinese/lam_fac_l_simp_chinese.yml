 lam_fac_merge_title: "[lam_fm_small.GetFirstNameNoTooltip]的派系并入了[lam_fm_big.GetFirstNameNoTooltip]的派系"
 lam_fac_split_title: "[lam_fs_new.GetFirstNameNoTooltip]从[lam_fs_lead.GetFirstNameNoTooltip]的派系中分裂出去"
 lam_fac_rally_title: "[lam_rally_lead.GetFirstNameNoTooltip]的派系举起了勤王的旗帜"
