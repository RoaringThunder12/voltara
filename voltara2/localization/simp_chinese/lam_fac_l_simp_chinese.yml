 lam_db_seize_tt: "失去宫廷党的地位与忠臣的荣誉，谋逆将被记入谱系。但可就此掌握实权。"
 lam_faction.2800.t: "领主的信任"
 lam_faction.2800.desc: "[lam_cp_lord.GetShortUIName]当着众人的面把我叫上前来，说：“无人比你更值得信赖。”\n\n#weak 记录：担任宫廷党首领[ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0]年，立功[ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0]次。#!"
 lam_faction.2800.a: "俯首领受"
 lam_faction.2810.t: "跻身忠臣之列"
 lam_faction.2810.desc: "为表彰我多年来率领宫廷党侍奉领主的功劳，[lam_cp_lord.GetShortUIName]称我为忠臣。这个名号在宫廷中传开了。\n\n#weak 记录：担任宫廷党首领[ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0]年，立功[ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0]次。#!"
 lam_faction.2810.a: "此乃毕生之荣"
 lam_faction.2820.t: "千古忠臣"
 lam_faction.2820.desc: "十五年如一日。[lam_cp_lord.GetShortUIName]说，我的名字将与家族一同永垂后世。史官提起了笔。\n\n#weak 记录：担任宫廷党首领[ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0]年，立功[ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0]次。#!"
 lam_faction.2820.a: "以家族之名领受"
 lam_faction.2830.t: "领主之命"
 lam_faction.2830.desc: "[lam_cp_lord.GetShortUIName]交代了几件差事。该接下哪一件呢？"
 lam_faction.2830.a: "向抗命的封臣收取税款（军事、外交）"
 lam_faction.2830.b: "监视背弃领主的派系（谋略）"
 lam_faction.2830.c: "辅佐领主的继承人（学识）"
 lam_faction.2830.yes: "完成了差事（功绩有所累积）"
 lam_faction.2830.no: "搞砸了差事"
 lam_faction.2840.t: "暗藏之刃"
 lam_faction.2840.desc: "又过去了一年。领主的密探们还什么都不知道吗？"
 lam_faction.2840.a: "静待时机"
 lam_faction.2840.found: "谋逆被领主识破了！"
 lam_faction.2840.safe: "未被察觉地度过一年（领主的谋略越高、我的谋略越低，就越危险）"
 lam_faction.2840.b: "再蛰伏一年"
 lam_faction.2840.b.tt: "可拔刀的时机推迟1年"
 lam_faction.2840.c: "放弃谋逆"
 lam_faction.2850.t: "领主的赏赐"
 lam_faction.2850.desc: "[lam_cp_lord.GetShortUIName]嘉奖了宫廷党的辛劳，并问我想要什么。"
 lam_faction.2850.a: "收下金钱"
 lam_faction.2850.b: "请求将赏赐分给派系的人"
 lam_faction.2850.c: "表示心意已领（功绩+1）"
 lam_faction.2860.t: "领主的猜疑"
 lam_faction.2860.desc: "[lam_cp_lord.GetShortUIName]的眼神不复从前。看样子是在怀疑宫廷党是否真的站在自己一边。"
 lam_faction.2860.a: "以金钱证明忠诚"
 lam_faction.2860.b: "以言辞消除猜疑（外交）"
 lam_faction.2860.b_yes: "猜疑已消除"
 lam_faction.2860.b_no: "猜疑更深了"
 lam_faction.2860.c: "坚称并无可疑之处"
 lam_faction.2870.t: "嫉恨"
 lam_faction.2870.desc: "[lam_cp_envious.GetShortUIName]的派系议论纷纷，说宫廷党独占了领主的宠信。"
 lam_faction.2870.a: "以礼物安抚"
 lam_faction.2870.b: "将他们的把柄透露给领主（谋略）"
 lam_faction.2870.b_yes: "那个派系动摇了（功绩+1）"
 lam_faction.2870.b_no: "反倒只招来了怨恨"
 lam_faction.2870.c: "置之不理"
