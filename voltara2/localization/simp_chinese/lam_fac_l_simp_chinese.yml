 lam_faction.0800.tip2: "\n· [ROOT.Char.Custom('LamFacTip2')]"
 lam_faction.0800.take_deal: "与[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]的派系坐下来谈"
 lam_faction.0800.take_favour: "宠信[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]的派系"
 lam_faction.0800.take_press: "命宫廷党打压另一个派系"
 lam_fac_tip1_deal: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]的派系正在集结（气势[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]）。趁其尚未起事，可以通过“与派系交易”换取他们的忠诚誓约。 #weak 代价：内阁席位、伯爵领、金钱、联姻、赦免中的一项#!"
 lam_fac_tip1_promise: "对[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]的派系许下的承诺仍悬而未决。按期兑现，宠信将大幅上升；若是违背，背叛之感将延续5年。"
 lam_fac_tip1_strings: "王冠悬于丝线之上。可以通过“赎回丝线”（3年的收入）或“宫廷政变”（谋略、军事、恐怖值）将线斩断。"
 lam_fac_tip1_amends: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]的派系记得我对他们犯下的不公。若能与该派系达成交易，这份怨恨便会化解（其他君主结下的怨恨不在此列）。 #weak 代价：让出一样东西#!"
 lam_fac_tip1_make_cp: "眼下没有宫廷党。扶持[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]的派系，可以巩固支持基础。成为宫廷党需经派系会议同意。威望75。"
 lam_fac_tip1_rally: "君权动摇。[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]的派系以勤王之名团结起来，宠信他们，便能为其助长气势。 #weak 代价：威望75#!"
 lam_fac_tip1_press: "可以命宫廷党打压[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUIName]的派系。对方的宠信、凝聚力与参与度都会动摇。 #weak 代价：暴政，每2年一次#!"
 lam_fac_tip1_ban: "颁布派系禁令的条件已经具备。但随之而来的是所有封臣的反感（−20，5年），以及禁令存续期间的维持费用。"
 lam_fac_tip2_deal: "[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]的派系正在集结（气势[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]）。趁其尚未起事，可以通过“与派系交易”换取他们的忠诚誓约。 #weak 代价：内阁席位、伯爵领、金钱、联姻、赦免中的一项#!"
 lam_fac_tip2_promise: "对[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]的派系许下的承诺仍悬而未决。按期兑现，宠信将大幅上升；若是违背，背叛之感将延续5年。"
 lam_fac_tip2_strings: "王冠悬于丝线之上。可以通过“赎回丝线”（3年的收入）或“宫廷政变”（谋略、军事、恐怖值）将线斩断。"
 lam_fac_tip2_amends: "[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]的派系记得我对他们犯下的不公。若能与该派系达成交易，这份怨恨便会化解（其他君主结下的怨恨不在此列）。 #weak 代价：让出一样东西#!"
 lam_fac_tip2_make_cp: "眼下没有宫廷党。扶持[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]的派系，可以巩固支持基础。成为宫廷党需经派系会议同意。威望75。"
 lam_fac_tip2_rally: "君权动摇。[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]的派系以勤王之名团结起来，宠信他们，便能为其助长气势。 #weak 代价：威望75#!"
 lam_fac_tip2_press: "可以命宫廷党打压[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUIName]的派系。对方的宠信、凝聚力与参与度都会动摇。 #weak 代价：暴政，每2年一次#!"
 lam_fac_tip2_ban: "颁布派系禁令的条件已经具备。但随之而来的是所有封臣的反感（−20，5年），以及禁令存续期间的维持费用。"
 lam_gn_ev_ult_yield: "最后一夜，得偿所求"
 lam_gn_ev_ult_oath: "最后一夜，为金子出卖誓约"
 lam_gn_ev_ult_arrest: "最后一夜，首领被擒"
 lam_gn_ev_ult_defied: "最后一夜，谈判破裂而起事"
