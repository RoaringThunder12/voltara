 lam_faction.0100.t: "派系的请愿"
 lam_faction.0100.open: "[lam_pet_lead.GetTitledFirstName]代表自己的人请求觐见。来的不止一人，身后排成一列的面孔，全都在等着我的答复。\n\n"
 lam_faction.0100.ask.courtly: "“[ROOT.Char.Custom('FormOfAddressForLiege')]，宫廷的体面便是国家的体面。请赐我们内阁的席位，在宴席上也请以相称的礼数相待。”"
 lam_faction.0100.ask.glory_hound: "“刀剑都要生锈了。请许诺我们一场远征吧，荣耀本就该共享。”"
 lam_faction.0100.ask.parochial: "“我们自己土地上的事，我们最清楚。请让王廷的手稍稍收回一些吧。”"
 lam_faction.0100.ask.zealot: "“信仰日渐暗淡。请惩治异端，照料圣所。”"
 lam_faction.0100.ask.minority: "“我们的语言与祈祷在这座宫廷里遭人轻视。请许诺我们宽容。”"
 lam_faction.0100.ask.barons_and_minor_landholders: "“大领主们在欺压小领主。请用国王的法度保护我们。”"
 lam_faction.0100.ask.belligerent: "“太平日子过得太久了。敌人都在嘲笑我们。”"
 lam_faction.0100.ask.loyalist: "“我们一直都在[ROOT.Char.Custom('FormOfAddressForLiege')]身边。请记住这份忠诚。”"
 lam_faction.0100.ask.dynastic: "“请把继承之事定下来。继承一动摇，王国便会动摇。”"
 lam_faction.0100.ask.none: "“也请听听我们的声音。”"
 lam_faction.0100.tone.arms: "\n\n#italic 恭敬的言辞背后，可见一只只握着剑柄的手。这与其说是请愿，不如说是警告。#!"
 lam_faction.0100.tone.loyal: "\n\n#italic 即便在君权动摇的此刻，他们仍留在我身边。如今，他们是来讨要回报的。#!"
 lam_faction.0100.a: "应允。"
 lam_faction.0100.b: "以礼物安抚。"
 lam_faction.0100.c: "拒绝。"
 lam_faction.0200.t: "新派系的旗号"
 lam_faction.0200.desc: "人们聚集起来，看的不是名字，而是旗帜。[lam_fac_new.GetFirstName]的派系要打出什么旗号？"
 lam_faction.0200.a: "为了君主（保王派）"
 lam_faction.0200.b: "为了宫廷的体面（贵族派）"
 lam_faction.0200.c: "为了我们的土地（乡土派）"
 lam_faction.0200.d: "为了刀剑与荣耀（武功派）"
 lam_faction.0200.e: "为了信仰（信仰派）"
 lam_faction.0200.f: "为了正当的继承（继承派）"
 lam_faction.0210.t: "派系的名号"
 lam_faction.0210.desc: "宫廷会怎样称呼他们呢？"
 lam_faction.0210.n0: "以路线与土地为名：[lam_fac_new.Custom('LamFacAuto')]"
