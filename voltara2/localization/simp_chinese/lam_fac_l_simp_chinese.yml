 lam_fac_tl_disgraced: "首领被收买之事败露，黯然下台"
 lam_fac_tl_legacy: "形成了新传统"
 lam_fac_tl_revived: "继承了旧派系的遗志"
 lam_fac_tl_migrated: "在新君主的宫廷中延续下来"
 lam_fac_tl_allied: "与其他派系结下友好盟约"
 lam_fac_tl_challenge: "首领在挑战中被赶下台"
 lam_fac_ally_interaction: "结下友好盟约"
 lam_fac_ally_interaction_desc: "与这个派系结下友好盟约。双方不再争斗，首领之间的好感上升（+10）。若在朝堂议题上站在同一边则更容易接受，站在对立面则更难。任何一方断绝、关系破裂或首领更替时，盟约即告终止。"
 lam_fac_ally_same_heart_reason: "对王权的心向相同"
 lam_fac_ally_foes_reason: "彼此敌对"
 lam_fac_ally_same_heir_reason: "支持同一位继承人"
 lam_fac_break_ally_interaction: "断绝友好盟约"
 lam_fac_break_ally_interaction_desc: "断绝友好盟约。对方会将此记作背叛，心怀怨恨。我们的派系也会略有动摇。"
 lam_fac_poach_interaction: "拉拢过来"
 lam_fac_poach_interaction_desc: "花费10金钱作为接触费，与候选人开始交涉。对方接受时，另行实际支付一笔资助金。原首领也可以付出代价将其留住。"
 lam_fac_poach_loyal_reason: "对现任首领有好感"
 lam_fac_poach_greedy_reason: "贪婪"
 lam_fac_poach_found_title: "[lam_po_old.GetShortUIName]的派系察觉我们挖走了他们的人"
 lam_fac_smear_interaction: "构陷"
 lam_fac_smear_interaction_desc: "散布对方派系首领的坏话。若成功，领主会对那位首领心生恶感，该派系的宠信与凝聚力也会下降。若失败，我们派系的宠信会下降，我也会与那位首领成为对手。"
 lam_fac_smear_interaction_tt: "成功率取决于我与对方的谋略数值。"
 lam_fac_smear_cd_tt: "最近构陷过他人（3年）"
 lam_fac_smear_yes_title: "关于[recipient.GetShortUIName]的丑闻传开了"
 lam_fac_smear_no_title: "构陷[recipient.GetShortUIName]一事败露了"
 lam_fac_challenge_interaction: "要求进行信任投票"
 lam_fac_challenge_interaction_desc: "向派系会议询问是否继续信任首领。若首领失去信任，由我接任首领之位；若首领获得信任，其地位反而会更加稳固。信任投票每五年只能举行一次。"
 lam_fac_challenge_interaction_tt: "由派系会议投票决定。派系氛围良好时，首领会获得信任。"
 lam_fac_challenge_weak_tt: "首领地位动摇（凝聚力低于40、独占份额，或身份败露）"
 lam_fac_challenge_yes_title: "核心成员站在了我这边。如今我是这个派系的首领"
 lam_fac_challenge_no_title: "核心成员留在了[lam_ch_old.GetShortUIName]身边。我被赶了出去"
 lam_fac_inform_interaction: "向领主告密"
 lam_fac_inform_interaction_desc: "把我们派系的内情交给领主。领主将获得对我们首领的牵制，我则得到金钱与领主的信任。只是，我会背上“告密者”这一秘密，一旦败露，便会被逐出派系。"
 lam_fac_inform_interaction_tt: "报告真实的秘密或当前未公开的方针。同样的情报不会重复给予奖励，也不会自动产生牵制。"
 lam_fac_inform_cd_tt: "最近告过密（5年）"
 lam_secret_informer: "告密者"
 lam_secret_informer_desc: "把自己派系的内情交给了领主"
 lam_fac_poached_opinion: "挖走了我们的人"
 lam_fac_smeared_opinion: "恶毒的流言"
 lam_fac_informer_opinion: "带来了宝贵的情报"
 lam_fac_mediated_opinion: "为我们居中调停"
 lam_fac_meddled_opinion: "多管闲事"
 lam_fac_bid_decision: "接受各派系的拉拢"
 lam_fac_bid_decision_desc: "我不属于任何派系。单凭这一点，就是我的身价。听听各派系会开出什么条件。"
 lam_fac_bid_decision_tooltip: "接受各派系的拉拢"
 lam_fac_bid_cd_tt: "最近受过拉拢（5年）"
 lam_faction.1500.t: "拉拢"
 lam_faction.1500.desc: "消息刚一传开，人们便找上门来。人人说的都是同一句话：与我们同行吧。而且没有一个是空着手来的。"
 lam_faction.1500.o1: "加入[lam_bd_1.GetShortUIName]的派系（金钱[lam_bd_1.MakeScope.Var('lam_bd_gold').GetValue|0]）"
 lam_faction.1500.o2: "加入[lam_bd_2.GetShortUIName]的派系（金钱[lam_bd_2.MakeScope.Var('lam_bd_gold').GetValue|0]）"
 lam_faction.1500.o3: "加入[lam_bd_3.GetShortUIName]的派系（金钱[lam_bd_3.MakeScope.Var('lam_bd_gold').GetValue|0]）"
 lam_faction.1500.x: "全部打发回去——我不属于任何人"
 lam_fac_mediate_decision: "在派系之间居中调停"
 lam_fac_mediate_decision_desc: "不属于任何一方的我，站到彼此怒目相向的两个派系之间。若成功，两个派系和领主都会对我心生好感，我也将赢得“中立之声”的名声。若失败，双方都会认为我多管闲事。"
 lam_fac_mediate_decision_tooltip: "在派系之间居中调停"
 lam_fac_mediate_cd_tt: "最近调停过（3年）"
 lam_faction.1600.t: "两派之间"
 lam_faction.1600.desc: "[lam_md_a.GetTitledFirstName]的人和[lam_md_b.GetTitledFirstName]的人同处一室。屋里的空气锋利如刀。我一开口，气氛或许就会改变，也可能双方都把矛头对准我。"
 lam_faction.1600.a: "站到两者之间"
 lam_faction.1600.a_tt: "成功率：#V [ROOT.Char.MakeScope.Var('lam_md_chance').GetValue|0]%#!（我的外交、调停名声）。若成功，两派的争端将得到化解，我也会获得威望以及双方与领主的好感。"
 lam_faction.1600.x: "不插手"
 lam_fac_mediate_yes_title: "调停成功。两个派系收起了刀剑"
 lam_fac_mediate_no_title: "调停失败。双方都对我没有好脸色"
 lam_fac_head_rise_decision: "率派系起事"
 lam_fac_head_rise_decision_desc: "光靠言语已经不够了。我们要以派系之名对抗领主：提出符合我们理由的要求；若无路可走，便公然抗命。"
 lam_fac_head_rise_decision_tooltip: "率派系起事"
 lam_fac_head_rise_decision_tt: "提出符合理由的要求：默认为拥立宣称者、独立、削减君权；在日本与中国，则依该国的方式行事，如领主复位、更换摄政、帝国政策、国家分裂。具分离倾向者（少数派、乡土派、异文化）会优先寻求独立与分裂。要求遭拒可能演变为战争。若无路可走，便公然抗命（少缴税金与征召兵）。核心成员与亲信会一同站出来，其余成员则各自决定是否加入。起事之后，5年内无法再次起事。"
 lam_fac_rise_cd_tt: "近期未曾起事（起事后5年；起事议题被否决后3年）"
 lam_fac_rise_cause_tt: "有起事的理由：派系的怨恨、领主的冷落（宠信-20及以下），或派系禁令"
 lam_fac_rise_blocked_tt: "因战败等原因而施加的派系组建禁令已解除"
 lam_fac_need_standing_tt: "只有成员达到3人以上的派系才能积累名望与遗产"
 lam_fac_detail_traditions: "传统"
 lam_fac_detail_traditions_tt: "传统不是买来的，而是由派系经历过的事情积累而成。括号中的数字便是那段历史，达到2、4、7时各提升一级。传统一旦形成便不会消失，即使首领更替也会延续下去。只有成员达到3人以上的派系，传统才会成长。"
 lam_fac_tl_void: "领主更替，承诺随之作废"
 lam_fac_tl_scheme: "在地下活动"
 lam_faction.0800.void: "\n· 因许诺的领主更替而作废的承诺：[ROOT.Char.MakeScope.Var('lam_dig_void').GetValue|0]（最近一次：[ROOT.Char.MakeScope.Var('lam_dig_void_who').Char.GetShortUIName]的派系）。这不算背叛，他们可能会再次提出请求。"
 lam_faction.0800.scheme: "\n· 地下派系的暗中活动（诽谤传单、私吞的金钱）：[ROOT.Char.MakeScope.Var('lam_dig_scheme').GetValue|0]（最近一次：[ROOT.Char.MakeScope.Var('lam_dig_scheme_who').Char.GetShortUIName]的派系）"
 lam_fac_ban_upkeep_modifier: "派系禁令的代价"
 lam_fac_ban_upkeep_modifier_desc: "要付给密探的钱，不愿与君主对视的宫廷。只要禁令仍在，这一切就会持续。"
 lam_fac_detail_ctrl: "掌控国政的根基 [Character.MakeScope.ScriptValue('lam_pol_ctrl_count_value')|0]/6"
 lam_fac_detail_ctrl_tt: "必须同时具备军事力量、组织与宫廷权力，才能掌控国政。\n[Character.Custom('LamPolOrg')]\n[Character.Custom('LamPolBase')]\n[Character.Custom('LamPolUnity')]\n[Character.Custom('LamPolOffice')]\n[Character.Custom('LamPolLever')]\n[Character.Custom('LamPolRival')]\n\n[Character.Custom('LamPolReady')]\n盟友的力量只计一半，且本派系也需要自身独立的根基。基础维持期限：玩家2年，AI 3年。一旦失去某项条件，准备便要从头开始。"
 lam_fac_ctrl_yes_share: "#P ✔#! 宫廷势力的[EmptyScope.ScriptValue('lam_tune_seize_share')|0]%以上（同盟派系按一半计算）"
 lam_fac_ctrl_no_share: "#N ✘#! 宫廷势力的[EmptyScope.ScriptValue('lam_tune_seize_share')|0]%以上（同盟派系按一半计算）"
 lam_fac_ctrl_yes_age: "#P ✔#! 根基已稳的派系（资历）"
 lam_fac_ctrl_no_age: "#N ✘#! 根基已稳的派系（资历）"
 lam_fac_ctrl_yes_cohesion: "#P ✔#! 凝聚力[EmptyScope.ScriptValue('lam_tune_seize_cohesion')|0]以上"
 lam_fac_ctrl_no_cohesion: "#N ✘#! 凝聚力[EmptyScope.ScriptValue('lam_tune_seize_cohesion')|0]以上"
 lam_fac_ctrl_yes_standing: "#P ✔#! 派系成员3人以上"
 lam_fac_ctrl_no_standing: "#N ✘#! 派系成员3人以上"
 lam_fac_ctrl_yes_crown: "#P ✔#! 王权跌至谷底（30及以下）"
 lam_fac_ctrl_no_crown: "#N ✘#! 王权跌至谷底（30及以下）"
 lam_fac_ctrl_yes_peace: "#P ✔#! 领主不在交战中"
 lam_fac_ctrl_no_peace: "#N ✘#! 领主不在交战中"
 lam_fac_ctrl_yes_seats: "#P ✔#! 内阁席位4个以上"
 lam_fac_ctrl_no_seats: "#N ✘#! 内阁席位4个以上"
 lam_fac_ctrl_yes_offices: "#P ✔#! 掌玺大臣与军事统帅之位"
 lam_fac_ctrl_no_offices: "#N ✘#! 掌玺大臣与军事统帅之位"
 lam_fac_ctrl_yes_alone: "#P ✔#! 没有可与之抗衡的其他派系（超过[EmptyScope.ScriptValue('lam_tune_seize_rival_share')|0]%）"
 lam_fac_ctrl_no_alone: "#N ✘#! 没有可与之抗衡的其他派系（超过[EmptyScope.ScriptValue('lam_tune_seize_rival_share')|0]%）"
 lam_fac_ctrl_yes_swords: "#P ✔#! 兵力多于领主"
 lam_fac_ctrl_no_swords: "#N ✘#! 兵力多于领主"
 lam_fac_buyout_decision: "赎回丝线"
 lam_fac_buyout_decision_desc: "以金代剑。向幕后掌权者支付代价，换回王座。贪婪者、知足者与势力衰退者较易接受，野心家则很少肯放手。"
 lam_fac_buyout_decision_tt: "若对方接受，我支付三年收入（至少150）即可脱身：摄政与对方握有的牵制都随之终结。若遭拒绝，金钱分文不少，但会失去威望。与宫廷政变共用3年的等待期。"
 lam_fac_buyout_decision_tooltip: "赎回丝线"
 lam_fac_buyout_gold_tt: "拥有相当于三年收入（至少150）的金钱"
 lam_buyout_yes_title: "丝线已赎回。王座重归于我"
 lam_buyout_no_title: "幕后掌权者拒绝了这笔价钱"
 lam_fac_defiance_mid_modifier: "封臣抗命（中等）"
 lam_fac_defiance_mid_modifier_desc: "一个势力中等的派系（占封臣势力的15~35%）正在抗命，少交了征召兵与税金。"
 lam_fac_defiance_minor_modifier: "封臣抗命（轻微）"
 lam_fac_defiance_minor_modifier_desc: "一个小派系（不足封臣势力的15%）正在抗命，少交了些许征召兵与税金。"
 lam_fac_tl_oath_void: "领主先背弃了信义，效忠誓约就此解除"
 lam_fac_tl_oath_broken: "背弃效忠誓约而起事"
 lam_fac_rise_oath_tt: "#N 我们曾宣誓效忠。背誓起事将大失威望，领主也不会忘记这次背叛。#!"
 lam_ff_court_liege_tt: "可在领主的宫廷中建立派系（若有禁令，则成为地下派系）"
 lam_ff_court_own_tt: "我的宫廷没有派系禁令（我不能违抗自己颁布的禁令）"
