 lam_fac_bar_favour: "宠信"
 lam_fac_btn_favour: "宠信"
 lam_fac_btn_favour_tt: "扶持这个派系。宠信+15，首领好感+20。两年内给予其主要的宫廷出入权，并收回此前受扶持派系的出入权。最多两个竞争派系会以制衡、结盟或重新靠拢作出回应。花费75威望，每个派系每年一次。是否接受成为宫廷党需另行表决。"
 lam_fac_btn_slight: "疏远"
 lam_fac_btn_slight_tt: "排斥这个派系。宠信-15，首领好感-20。两年内其宫廷地位削弱，并心生怨恨。另一个有影响力的派系宠信+5。被排斥的派系会以制衡、结盟或重新靠拢作出回应。每个派系每年一次。"
