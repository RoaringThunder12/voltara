 lam_faction.1900.t: "派系会议"
 lam_faction.1900.q_heir: "[lam_vt_head.GetShortUIName]表示要改换我们派系所拥立的继承人。追随旧候选人的人群起反对，会议由此召开。 "
 lam_faction.1900.q_crown: "王冠与我们的候选人擦肩而过。是将候选人拥护到底，还是与新君主和解？会议为此召开。 "
 lam_faction.1900.q_rise: "[lam_vt_head.GetShortUIName]提议起兵。是否拔剑，会议为此召开。 "
 lam_faction.1900.q_deal: "[lam_vt_head.GetShortUIName]接受了领主的提议。会议为这一妥协而召开。 "
 lam_faction.1900.split: "\n\n票数势均力敌，终究未能弥合。[lam_vt_lead.GetShortUIName]带着反对者走出议事厅，另立新派系。我该站在哪一边？"
 lam_faction.1900.held: "\n\n反对的人虽不在少数，最终还是按首领的意思定了下来。派系依然是一体。我是否遵从这一决定？"
 lam_faction.1900.stay: "留在[lam_vt_head.GetShortUIName]身边"
 lam_faction.1900.follow: "投奔[lam_vt_lead.GetShortUIName]的新派系"
 lam_faction.1900.accept: "遵从决定"
 lam_faction.1900.leave: "这样的决定我无法遵从。我要离开派系"
 lam_faction.1910.t: "派系会议"
 lam_faction.1910.q_heir: "我一提议改换我们派系所拥立的继承人，追随旧候选人的人便要求召开会议。 "
 lam_faction.1910.q_crown: "王冠与我们的候选人擦肩而过，有人提出与新君主和解，会议就此召开。 "
 lam_faction.1910.q_rise: "我一提议起兵，会议便为是否拔剑而召开。 "
 lam_faction.1910.q_deal: "我一接受领主的提议，会议便为这一妥协而召开。 "
 lam_faction.1910.split: "\n\n票数势均力敌。[lam_vt_lead.GetShortUIName]带着反对者走出了议事厅。如今他们已另立派系。"
 lam_faction.1910.held: "\n\n虽有反对，最终还是按我的意思定了下来。派系依然是一体，只是凝聚力略有动摇。"
 lam_faction.1910.letgo: "要走的人，就让他们走"
 lam_faction.1910.brand: "我会记住这些叛徒"
 lam_faction.1910.ok: "好"
 lam_faction.1900.q_ban: "诏令已下，[lam_vt_head.GetShortUIName]却表示要转入地下。主张遵从王命的人要求召开会议。 "
 lam_faction.1900.q_merge: "有人提议将我们派系并入[lam_vt_new.GetShortUIName]的派系。主张保持独立的人要求召开会议。 "
 lam_faction.1900.q_court: "我们派系被指定为领主的宫廷党。不愿依附王权的人要求召开会议。 "
 lam_faction.1900.q_confidence: "再也无法信任[lam_vt_head.GetShortUIName]领导的声音越来越大，不信任会议就此召开。 "
 lam_faction.1900.deposed: "\n\n不信任票过半。[lam_vt_head.GetShortUIName]卸去首领之位，[lam_vt_lead.GetShortUIName]成为新首领。派系依然是一体。"
 lam_faction.1910.q_ban: "我一表示要抗拒诏令、转入地下，主张遵从王命的人便要求召开会议。 "
 lam_faction.1910.q_merge: "我一打算将我们派系并入[lam_vt_new.GetShortUIName]的派系，主张保持独立的人便要求召开会议。 "
 lam_faction.1910.q_court: "我们派系一被指定为宫廷党，不愿依附王权的人便要求召开会议。 "
 lam_faction.1910.q_confidence: "再也无法信任我的领导的声音越来越大，不信任会议就此召开。 "
 lam_faction.1910.deposed: "\n\n不信任票过半。我卸去首领之位，[lam_vt_lead.GetShortUIName]成为新首领。如今我不过是这个派系中的一员。"
