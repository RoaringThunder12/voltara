 lam_gn_books_label: "此宫廷的记录簿："
 lam_gn_book_main: "现今国家的记录"
 lam_gn_book_btn: "[Title.GetNameNoTier]"
 lam_gn_ev_migrated: "在新君主治下延续"
 lam_fac_badge_holding: "#weak 正在观望新君主#!"
 lam_fac_badge_holding_tt: "新君主即位（或该派系进入新宫廷）尚不满6个月。在此期间，派系最多只会集结，不会起事，请愿也会暂缓。所拥人选错失王冠的派系除外。"
 lam_faction.1800.t: "王命降下"
 lam_faction.1800.desc: "[lam_ban_lord.GetTitledFirstName]的敕令当众宣读：“自今日起，未经君主许可擅自结党者，即为谋反。”众人的目光都落到了我身上。我所领导的派系，如今也成了非法的。\n\n我可以奉诏，让派系悄然散去。这样一来，派系的名号与遗产将留在记录之中，等待有朝一日东山再起。又或者，我可以带它遁入黑暗。胆小的人会离开，但留下来的人会比从前更加坚韧。况且，禁令不会永远存在。"
 lam_faction.1800.a: "奉王命解散派系"
 lam_faction.1800.a_tt: "派系将在下次清点时解散。其遗产（传统、名望）会保留下来，日后重建时可以继承。谱系中将记为“依禁令解散”。领主对我心生好感（+15，5年）。"
 lam_faction.1800.b: "转入地下"
 lam_faction.1800.b_tt: "派系转入地下。同情者与亲信离去，只留下核心成员。我与核心成员将背负“非法派系”这一罪行秘密。领主知道这个派系的首领是我，却不知道还有谁留了下来。我获得“地下联络网”（针对领主的计谋成功率+10%）。若能撑到禁令结束，派系将以“历经迫害的派系”之名重返（凝聚力、威望、名望，以及成员的信赖）。"
 lam_faction.1810.t: "王命禁绝派系！"
 lam_faction.1810.desc: "[lam_ban_lord.GetTitledFirstName]向宫廷颁下敕令：未经君主许可而结党，从此便是谋反。我所在的[lam_ban_lead.GetShortUIName]的派系也不例外。\n\n"
 lam_faction.1810.obey: "首领决定奉王命解散派系。从此，我们各奔东西。"
 lam_faction.1810.stay: "首领决定转入地下。胆小的人都走了，而我作为核心成员留了下来。从今往后，我便是不法之徒了。"
 lam_faction.1810.cut: "首领决定转入地下，但我没能进入那个核心圈子。派系撇下我遁入了黑暗，而我在1年之内无法加入任何派系。"
 lam_faction.1810.wait: "首领尚未作出答复——是解散，还是隐匿。"
 lam_faction.1810.a: "明白了"
 lam_fac_ban_obeyed_title: "[lam_ban_lead.GetShortUIName]奉王命解散了派系"
 lam_fac_ban_defied_title: "[lam_ban_lead.GetShortUIName]的派系拒不解散，转入了地下"
 lam_fac_ban_obeyed_member_title: "首领奉王命解散了派系"
 lam_fac_ban_stay_member_title: "首领转入地下。我作为核心成员留了下来"
 lam_fac_ban_cut_member_title: "首领转入地下。我没能进入那个核心圈子"
 lam_fac_obeyed_opinion: "奉王命解散了派系"
 lam_fac_endured_opinion: "在禁令之下保全了派系"
 lam_fac_ug_born_title: "在禁令之下建立的派系，从一开始便是地下派系。领主甚至还不知道它的存在"
 lam_fac_ug_born_founder_title: "我建立的派系在地下诞生了。领主甚至还不知道有这样一个派系"
 lam_fac_surfaced_head_title: "禁令结束了。我们的派系熬过了迫害，重新现身"
 lam_fac_surfaced_member_title: "禁令结束了。我们这个历经迫害的派系重新现身"
 lam_fac_surfaced_lord_title: "曾在禁令之下隐匿的派系重新现身"
 lam_fac_tl_surfaced: "熬过禁令，重新现身"
 lam_fac_badge_endured: "#P 历经迫害#!"
 lam_fac_badge_endured_tt: "这个派系在禁令之下于地下坚持下来，又重返台前。归来时获得凝聚力+15、首领威望、名望+5，成员们也更加信赖首领（+15，3年）。此标记持续5年。"
 lam_fac_card_intel: "#weak 暴露程度：#! [Character.Custom('LamFacIntel')]"
 lam_fac_card_intel_tt: "隐藏的地下派系，只会按领主密探挖出的程度显示给他人。只露出风声的派系显示为问号卡片；首领暴露的派系，其成员显示为“?”。核心成员暴露后可见核心成员，全部暴露后则一览无余。成员的“非法派系”秘密被发现、身份遭到揭露、有人告密或自首，或者领主通过“深挖地下组织”追查时，暴露程度都会加深。首领可以通过“抹去痕迹”将其退回一级。对该派系的成员而言，派系始终完全可见。走出地下、公开行动的派系，所有成员均可见。"
 lam_fac_intel_0: "#P 尚未暴露任何信息#!"
 lam_fac_intel_1: "#P 仅露出风声#!"
 lam_fac_intel_2: "#high 首领已暴露#!"
 lam_fac_intel_3: "#N 核心成员已暴露#!"
 lam_fac_intel_4: "#N 已全部暴露#!"
 lam_fac_veil_title: "#N 身份不明的地下派系#!"
 lam_fac_veil_lead: "#weak 首领#! ?"
 lam_fac_veil_members: "#weak 成员#! ?"
 lam_fac_veil_q: "?"
 lam_fac_veil_desc: "#weak 密探们察觉到，宫廷某处正有违禁的集会。是谁在领头，又有谁出入其间，目前尚不清楚。可以通过“深挖地下组织”决议进一步追查。#!"
 lam_fac_mrow_veiled: "#weak ? — 身份尚未查明的成员#!"
 lam_fac_mrow_veiled_tt: "只知道这个派系里还有别人。究竟是谁，还需进一步追查才能知晓。"
 lam_fac_ug_dig_decision: "深挖地下组织"
 lam_fac_ug_dig_decision_tooltip: "深挖地下组织"
 lam_fac_ug_dig_decision_desc: "禁令无法消灭结党之人，只会把他们逼进黑暗。把钱塞给密探，让他们在宫廷的夜色中四处搜寻。间谍首脑的谋略越高，越能有所发现。查到多少，便会在派系窗口中显示多少，首领与核心成员的罪行秘密也会落入我手。"
 lam_fac_ug_dig_decision_tt: "选择一个地下派系，再深挖一级（成功率35%+间谍首脑谋略×3，限于20~90%；若该派系已抹去痕迹则减半）。也可能一无所获，而且无从得知是根本没有隐藏的派系，还是没能找到。"
 lam_fac_ug_dig_cd_tt: "每年只能追查一次"
 lam_fac_dig_named_title: "密探们挖出了[lam_dig_lead.GetShortUIName]的地下派系"
 lam_fac_dig_rumour_title: "密探们察觉到宫廷某处存在地下派系"
 lam_fac_dig_none_title: "密探们一无所获"
 lam_fac_dig_watched_title: "领主的密探盯上了我们派系的踪迹"
 lam_fac_ug_cover_decision: "抹去痕迹"
 lam_fac_ug_cover_decision_tooltip: "抹去痕迹"
 lam_fac_ug_cover_decision_desc: "更换聚会地点，给口风不紧的人塞些钱，把信件烧掉。切断领主密探手中握着的线索。"
 lam_fac_ug_cover_decision_tt: "领主掌握的程度下降一级。2年内密探失去线索：即便秘密被发现，暴露程度也不会上升，“深挖地下组织”的成功率也会减半。"
 lam_fac_ug_cover_cd_tt: "每2年只能进行一次"
 lam_fac_ug_cover_need_tt: "领主对我们派系已有所察觉（一旦全部暴露，便再无痕迹可抹）"
 lam_fac_ug_recruit_interaction: "秘密拉拢"
 lam_fac_ug_recruit_interaction_desc: "趁夜拜访对领主心怀怨恨的人，将其拉入我们的地下派系。对方若接受，便会成为不法之徒与我们同行；每多一个新人，暴露的风险就增加一分。若拒绝之人是追随领主的人，可能当即前去告发。"
 lam_fac_ug_recruit_yes_tt: "对方加入我们的地下派系（有10%的几率，我的秘密会泄露给领主）。"
 lam_fac_ug_recruit_no_tt: "若对方追随领主，则有一半几率告发。届时我的秘密会暴露，领主对我们派系的了解也会加深一级。"
 lam_fac_ug_recruit_loyal_reason: "追随领主"
 lam_fac_ug_recruit_grudge_reason: "对领主怀恨在心"
 lam_fac_ug_recruit_bold_reason: "野心勃勃·睚眦必报·狂热"
 lam_fac_ug_recruit_craven_reason: "怯懦"
 lam_fac_ug_told_title: "[recipient.GetShortUIName]拒绝了，还向领主告了密"
 lam_fac_ug_silent_title: "[recipient.GetShortUIName]拒绝了，但答应守口如瓶"
 lam_fac_ug_confess_interaction: "自首坦白"
 lam_fac_ug_confess_interaction_desc: "与地下派系断绝关系，来到领主面前，将一切和盘托出。罪行将获赦免，但领主会掌握我们派系直至核心成员的情况（若我是核心成员，则是全部）。首领会视我为叛徒，而我将背负“告密者”这一秘密。"
 lam_fac_ug_confess_tt: "离开派系，不再是不法之徒。领主将掌握我们派系直至核心成员的情况（若我是核心成员，则是全部）。首领视我为叛徒（−35）。3年内无法加入任何派系。"
 lam_fac_ug_network_modifier: "地下联络网"
 lam_fac_ug_network_modifier_desc: "藏身的屋子、送信的人、欠下人情的人。地下派系的首领更擅长策划针对领主的计谋。"
 lam_gn_end_banned: "#N 依禁令解散#!"
 lam_gn_ev_surfaced: "熬过禁令，得以复权"
 lam_gn_lg_split: "分裂"
 lam_gn_lg_revived: "继承"
 lam_gn_lg_line: "同根"
 lam_fac_awe_line: "#P 征服者之威#!"
 lam_fac_awe_line_tt: "这座宫廷的主人是一位征服者（拥有征服者或最伟大的汗特质，或“神之鞭”）。各派系不敢与之对抗，转而站到领主一边。对领主的态度+50，气势−40，不会起事。"
 lam_fac_crushed_lord_title: "剿灭了[lam_purged.GetShortUIName]的地下派系"
 lam_fac_crushed_member_title: "首领被擒，我们的地下派系就此瓦解"
 lam_gn_end_crushed: "#N 首领被擒，遭到剿灭#!"
