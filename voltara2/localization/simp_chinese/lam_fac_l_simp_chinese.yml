 rule_lam_fac_special_govs_desc: "日本的朝廷与幕府、中国的天朝制与贤能制国家，在原版中自有一套宫廷政治（礼仪性摄政、帝国政策、大臣）。默认（共存）下，这些国家同样运行派系，但不阻止原版固有派系；派系起事时，会以该国的固有派系（恢复领主权位、更换摄政、帝国政策、解体）起事。幕后掌权者不占用摄政之位。行政制国家（拜占庭等）也采用同样方式。"
