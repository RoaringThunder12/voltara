 lam_cp_loyal_house_modifier: "三代忠臣世家"
 lam_cp_loyal_house_modifier_desc: "三代侍奉王室的忠臣之家。只要那个王室延续下去，这个名号也将延续。"
 lam_cp_loyal_house_opinion: "三代忠臣世家"
 lam_cp_house_seat_title: "作为三代忠臣世家获得了内阁席位"
 lam_faction.2810.house_tt: "#weak 家族记录：在同一王室之下成为忠臣的本家族家主共[ROOT.Char.MakeScope.Var('lam_cp_house_n').GetValue|0]人／3人（含此次）——满三人时，整个家族将被认可为三代忠臣世家。#!"
 lam_faction.2890.t: "三代忠臣世家"
 lam_faction.2890.desc: "祖父如此，父亲如此，如今轮到了我。三代以来，我们家族一直侍奉[lam_cp_lord.GetShortUIName]的王室。王室决定将我们家族尊为忠臣世家。"
 lam_faction.2890.a: "以家族之名永远效忠"
 lam_faction.2890.a.tt: "整个家族获得「三代忠臣世家」修正（威望、好感、领主好感、外交、管理）。宗族威望+1000。只要这个王室仍据有王座，国王每年都会厚待我们（好感+25），让我们家族的一人进入内阁，我们派系的宠信也会提升。王室一旦断绝，这份荣誉也随之终结。"
 lam_faction.2891.t: "王室断绝"
 lam_faction.2891.desc: "我们家族三代侍奉的王室失去了王座。忠臣世家之名，如今也成了往事。"
 lam_faction.2891.a: "世道变了"
 lam_gn_ev_loyal_house: "首领的家族成为三代忠臣世家"
 lam_faction.2895.t: "失去忠臣之名"
 lam_faction.2895.desc: "曾被称为忠臣的我，背弃了领主。如今，宫廷用另一个名字称呼我。"
 lam_faction.2895.a: "覆水难收"
 lam_faction.2895.a.tt: "失去所有忠臣修正与功绩。「忠臣」「千古忠臣」的名号将变为「破誓者」。从此再也无法成为忠臣，家族的三代忠臣荣誉也随之消失。"
 lam_faction.2896.t: "玷污家族之名"
 lam_faction.2896.desc: "[lam_hs_culprit.GetShortUIName]向我们家族世代侍奉的王室拔刀相向。三代忠臣世家之名，从此不复存在。"
 lam_faction.2896.a: "这等耻辱，如何是好"
 lam_faction.2896.a.tt: "家族失去「三代忠臣世家」修正及其所有益处，50年内无法再次获得。"
