 lam_found_court_party_decision: "创立宫廷党"
 lam_found_court_party_decision_desc: "在封臣中组织一群站在我这边的人，并定下其首领。初始宠信为40。"
 lam_found_court_party_decision_tooltip: "建立一个以忠诚封臣为首领的宫廷党。"
