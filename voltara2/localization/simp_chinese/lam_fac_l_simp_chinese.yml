 lam_fac_show_vanilla: "查看原版派系"
 lam_fac_show_vanilla_tt: "打开原版游戏的派系窗口（用于直接加入或创建独立派系、自由权派系、宣称者派系；在日本和中国则为朝廷、帝国政策派系等）。在你下次打开宫廷派系概况之前，此窗口不会再叠在F7上弹出。"
 lam_fac_btn_join: "加入这个派系"
 lam_fac_btn_leave: "离开这个派系"
 lam_faction.0600.t: "旌旗高举之夜"
 lam_faction.0600.desc: "[lam_abs_lead.GetTitledFirstName]捎来了口信：派系要起来反抗君主了。既然曾同在一面旗帜下，我如今也必须作出决定。"
 lam_faction.0600.a: "一同起事。"
 lam_faction.0600.b: "留在君主一边，与他们分道扬镳。"
 lam_faction.0600.c: "暂且一言不发。"
 lam_fac_card_goal: "#weak 当前所求：#! [Character.Custom('LamFacGoal')]"
 lam_fac_member_row: "[Character.GetShortUIName] · [Character.Custom('LamFacTier')] · [Character.Custom('LamAttitude')]\n\n#high 主要根基：[Character.Custom('LamUxBasis1')][Character.Custom('LamUxBasis2')]#!\n当前派系内影响力：#high [Character.MakeScope.ScriptValue('lam_cr_influence_value')|1]/100#!\n基础 10\n军力 [Character.MakeScope.ScriptValue('lam_cr_military_value')|1]/20 · 财力 [Character.MakeScope.ScriptValue('lam_cr_economy_value')|1]/15\n身份与名望 [Character.MakeScope.ScriptValue('lam_cr_standing_value')|1]/15 · 宫廷地位 [Character.MakeScope.ScriptValue('lam_cr_court_value')|1]/15\n人脉 [Character.MakeScope.ScriptValue('lam_cr_network_value')|1]/10 · 派系功劳 [Character.MakeScope.ScriptValue('lam_cr_service_value')|1]/15\n\n#weak 军力与财力规模越大，额外收益越少。宫廷地位反映内阁职位与面见君主的权利，人脉反映家族及与首领的关系，功劳反映入派时长与功绩。#![Character.Custom2('LamUxBallot', GetPlayer)]"
