 trait_lam_fac_member_desc_sym: "只是派系的同情者。风向一变，便可能离去。"
 lam_found_faction_no_war_tt: "未与领主交战"
 lam_found_faction_followers_tt: "有可以建立派系的宫廷（若是自己的宫廷，需要至少两名愿意出任首领的封臣；若是领主的宫廷，独自一人也能建立。在颁布了禁令的宫廷里，只能建立地下派系）"
 lam_fac_ban_line: "#N [Character.Custom('LamFacBan')]#!"
 lam_fac_ban_line_tt: "派系禁令已经颁布。被禁派系的首领或已将其解散，或已转入地下。君权与恐惧越强，派系越会乖乖散去；弱君的禁令只会招来嘲笑。潜藏的地下派系只能动用一半势力（起事需要20%势力），既不能请愿也不能与人冲突，其成员还会损失威望。若抓捕并囚禁潜藏派系的首领，该派系便会遭到清剿而瓦解，其他地下派系也会心生畏惧，君主则获得威望与恐惧。新派系只会在地下诞生。地下派系只会按密探挖出的程度显示在此窗口中（“深挖地下组织”决议）。禁令有效期间，所有未解散的派系都在地下。直到起事，它们的真面目才会完全暴露。禁令在君主更替或以决议撤销时结束，坚持到最后的地下派系将作为“熬过迫害的派系”重新出现。"
 lam_fac_ban_all: "派系禁令（所有派系）"
 lam_fac_ban_crown: "派系禁令（仅允许王党）"
 lam_fac_ban_decision_confirm: "颁布禁令"
 lam_fac_unban_decision_confirm: "撤销禁令"
 lam_secret_outlaw_faction: "被禁派系"
 lam_secret_outlaw_faction_desc: "违抗禁令，领导地下派系或仍是其核心成员"
 lam_secret_outlaw_found_title: "发现[secret_owner.GetShortUIName]身处一个被禁的派系之中"
 lam_fac_edict_opinion: "派系禁令"
 lam_fac_bar_cohesion: "凝聚力"
 lam_fac_age_0: "新生派系"
 lam_fac_age_1: "根基已稳的派系"
 lam_fac_age_2: "老牌派系"
 lam_fac_age_3: "名门派系"
 lam_fac_hist_tt: "#T 沿革#!\n创立于[Character.MakeScope.Var('lam_fac_founded').GetValue|0]年，已历[Character.MakeScope.Var('lam_fac_age').GetValue|0]年 · #high [Character.Custom('LamFacAgeTier')]#!\n创立者：[Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · 现任首领为第[Character.MakeScope.Var('lam_fac_gen').GetValue|0]代[Character.Custom('LamFacCofLine')]\n\n起事 [Character.MakeScope.Var('lam_fac_h_rise').GetValue|0] · 挺过清洗 [Character.MakeScope.Var('lam_fac_h_purge').GetValue|0] · 所拥立者登基 [Character.MakeScope.Var('lam_fac_h_crown').GetValue|0]\n信守的承诺 [Character.MakeScope.Var('lam_fac_h_kept').GetValue|0] · 遭到背叛 [Character.MakeScope.Var('lam_fac_h_betray').GetValue|0] · 冲突胜/负 [Character.MakeScope.Var('lam_fac_h_won').GetValue|0]/[Character.MakeScope.Var('lam_fac_h_lost').GetValue|0] · 与领主的交易 [Character.MakeScope.Var('lam_fac_h_deals').GetValue|0]\n\n#weak 派系越古老，越能吸引人，凝聚力越牢固，即使衰弱也不易散去（满15年后，哪怕只剩寥寥数人也能延续命脉）。多年的名望会保留下来，但它也可能并入志同道合的其他派系。#!"
 lam_fac_old_modifier: "老牌派系首领"
 lam_fac_old_modifier_desc: "肩负着一个历史悠久的派系之名。"
 lam_fac_venerable_modifier: "名门派系首领"
 lam_fac_venerable_modifier_desc: "延续数十年的派系之名，为此人平添分量。"
 lam_fac_deal_interaction: "与派系交易"
 lam_fac_deal_interaction_desc: "与这个派系的首领相对而坐。给出些什么，也换回些什么。我给出的东西归整个派系所有，而非首领一人。如何分配，可能让派系更加团结，也可能令其出现裂痕。"
 lam_fac_deal_interaction_tt: "选择给出什么、换回什么。"
 lam_fac_deal_cd_tt: "最近已与这个派系交易过"
 lam_faction.1000.t: "该拿出什么"
 lam_faction.1000.desc: "[lam_deal_lead.GetTitledFirstName]在对面坐下。身后站着的人们正注视着，看他们能带着什么回去。"
 lam_faction.1000.seat: "一个内阁席位"
 lam_faction.1000.seat_tt: "承诺在一年内让这个派系的某人进入内阁。人选由我决定。若只让首领入座，其他人会心生不满；若让其他人入座，派系会更加团结。"
 lam_faction.1000.county: "一个伯爵领"
 lam_faction.1000.county_tt: "将我直辖领地中发展度最低的一个伯爵领赐给这个派系的某人。交易达成后，由我挑选受封者。若赐给首领的对手，派系将出现裂痕。"
 lam_faction.1000.gold: "金钱"
 lam_faction.1000.gold_tt: "金钱经首领之手分给派系。慷慨或公正的首领会平均分配（凝聚力上升），贪婪或野心勃勃的首领会中饱私囊（凝聚力下降，成员不满），其余首领只分给核心成员。"
 lam_faction.1000.marriage: "联姻"
 lam_faction.1000.marriage_tt: "承诺在两年内让我的家人与这个派系的人（或其家人）结婚或订婚。"
 lam_faction.1000.law: "君权让步一级"
 lam_faction.1000.law_tt: "立即将君权降低一级。"
 lam_faction.1000.heir: "他们拥护的继承人"
 lam_faction.1000.heir_tt: "将派系支持的子女指定为继承人，并支付当前政体所需的威望、影响力或虔诚。"
 lam_faction.1000.amnesty: "赦免"
 lam_faction.1000.amnesty_tt: "即便在禁令之下，也唯独正式允许这个派系存在。它将走出地下，重新公开露面。"
 lam_faction.1000.bribe: "私下塞给首领的贿金"
 lam_faction.1000.bribe_tt: "这笔金钱不归派系，只进首领的腰包。首领会对我心生好感，却会背上“被收买的首领”这一秘密。秘密一旦败露，派系的凝聚力就会崩溃，首领也可能被赶下台。诚实或公正的首领很可能会拒绝。"
 lam_faction.1000.x: "还是算了"
 lam_faction.1010.t: "该换回什么"
 lam_faction.1010.desc: "现在轮到我说出想要什么了。"
 lam_faction.1010.oath: "效忠誓约"
 lam_faction.1010.oath_tt: "五年内，这个派系不会出声反对王权，也不会聚集势力。心中的不满纵然还在，也无从表露。"
 lam_faction.1010.heir: "支持我的继承人"
 lam_faction.1010.heir_tt: "五年内，这个派系将支持我的正式继承人。"
 lam_faction.1010.disband: "解散派系"
 lam_faction.1010.disband_tt: "解散这个派系。派系越古老，越难接受。"
 lam_faction.1010.counter: "压制敌对派系"
 lam_faction.1010.counter_tt: "借这个派系之手压制最大的敌对派系。对方会失去宠信，并心怀怨恨。"
 lam_faction.1010.arms: "出兵相助"
 lam_faction.1010.arms_tt: "若我正在交战，首领与核心成员会立即加入我方参战；否则，他们会参加我在两年内发起的战争。"
 lam_faction.1010.law_support: "不反对加强王权"
 lam_faction.1010.law_support_tt: "三年内，这个派系的人不会因君权过高而背弃王权。"
 lam_faction.1010.back: "重新选择"
 lam_faction.1020.t: "提议"
 lam_faction.1020.open: "我向[lam_deal_lead.GetTitledFirstName]开了口。\n\n"
 lam_faction.1020.g.seat: "#P 给出：#! 一年内一个内阁席位。\n"
 lam_faction.1020.g.county: "#P 给出：#! 一个伯爵领。\n"
 lam_faction.1020.g.gold: "#P 给出：#! 金钱。\n"
 lam_faction.1020.g.marriage: "#P 给出：#! 两年内联姻。\n"
 lam_faction.1020.g.law: "#P 给出：#! 君权让步一级。\n"
 lam_faction.1020.g.heir: "#P 给出：#! 指定他们拥护的继承人。\n"
 lam_faction.1020.g.amnesty: "#P 给出：#! 赦免。\n"
 lam_faction.1020.g.bribe: "#P 给出：#! 私下塞给首领的贿金。\n"
 lam_faction.1020.a.oath: "#N 换回：#! 五年效忠誓约。\n"
 lam_faction.1020.a.heir: "#N 换回：#! 支持我的继承人（五年）。\n"
 lam_faction.1020.a.disband: "#N 换回：#! 解散派系。\n"
 lam_faction.1020.a.counter: "#N 换回：#! 压制敌对派系。\n"
 lam_faction.1020.a.arms: "#N 换回：#! 参战。\n"
 lam_faction.1020.a.law_support: "#N 换回：#! 默许加强王权（三年）。\n"
 lam_faction.1020.chance: "\n接受的可能性：#V [lam_deal_lead.MakeScope.Var('lam_deal_acc').GetValue|0]%#!（所交换之物的分量、派系的路线、对我的善意与好感）"
 lam_faction.1020.a: "提出"
 lam_faction.1020.back: "从头再来"
 lam_faction.1020.x: "还是算了"
 lam_faction.1030.t: "给谁"
 lam_faction.1030.desc: "交易已经达成。现在该决定把土地给谁了。派系中所有人都在等着那个名字。"
 lam_faction.1030.lead: "给首领[lam_deal_lead.GetFirstName]"
 lam_faction.1030.lead_tt: "首领独吞一切，其他人心生不满（凝聚力−10）。"
 lam_faction.1030.r1: "给核心成员[lam_deal_r1.GetFirstName]"
 lam_faction.1030.r1_tt: "归于派系的中流砥柱（凝聚力+5）。"
 lam_faction.1030.r2: "给与首领不和的[lam_deal_r2.GetFirstName]"
 lam_faction.1030.r2_tt: "扶植首领的对手。派系出现裂痕，首领也会怨恨我（凝聚力−20）。"
 lam_deal_yes_title: "与[lam_deal_lead.GetShortUIName]的派系达成了交易"
 lam_deal_no_title: "[lam_deal_lead.GetShortUIName]的派系拒绝了交易"
 lam_secret_bribed: "被收买的首领"
 lam_secret_bribed_desc: "将领主的钱收进了自己的腰包，而非交给派系"
 lam_fac_bribed_opinion: "收受了贿金"
 lam_fac_hoarded_opinion: "独占了派系的份额"
 lam_fac_fair_share_opinion: "公平分配了份额"
 lam_fac_passed_over_opinion: "未能分到份额"
 lam_faction.0610.t: "揭竿而起之时"
 lam_faction.0610.desc: "我们派系的气势已然沸腾。人们都在等我开口。此时若拔剑而起，必有人追随。当然，也还可以再忍一忍。"
 lam_faction.0610.a: "揭竿而起"
 lam_faction.0610.a_tt: "我们的派系将向领主提出符合其理由的要求（拥立宣称者、独立、削减君权；在日本与中国则依该国的方式）。核心成员与亲信会一同站出来；若无路可走，便公然抗命。"
 lam_faction.0610.b: "暂且忍耐"
 lam_faction.0610.b_tt: "一年内气势受挫。"
 lam_fac_command_interaction: "命令宫廷党"
 lam_fac_command_interaction_desc: "宫廷党只是名义上的派系，实际上就是我的手。我可以召他们去作战，让他们拉拢人手，或让他们压制其他派系。"
 lam_fac_command_interaction_tt: "选择让宫廷党做什么。"
 lam_faction.1100.t: "命令宫廷党"
 lam_faction.1100.desc: "[lam_cp_lead.GetTitledFirstName]正在等候命令。"
 lam_faction.1100.arms: "拿起刀剑（威望）"
 lam_faction.1100.arms_tt: "若我正在交战，首领与核心成员会立即加入我方参战；否则会参加我两年内的战争。每两年一次。"
 lam_faction.1100.recruit: "拉拢人手（金钱）"
 lam_faction.1100.recruit_tt: "动用国库，将最多3名有心于政治的无派系者拉入宫廷党。每年一次。"
 lam_faction.1100.press: "压制其他派系（暴政）"
 lam_faction.1100.press_tt: "宫廷党压制其他派系中最大的一个。对方会失去宠信、心怀怨恨，凝聚力与参与度也会动摇。每两年一次。"
 lam_faction.1100.x: "现在不必了"
 lam_fac_head_demand_interaction: "以派系之名提出要求"
 lam_fac_head_demand_interaction_desc: "我是一个派系的首领。我背负着它的分量，站到领主面前。"
 lam_fac_head_demand_interaction_tt: "选择要提出什么要求。能否被接受，取决于我们的势力、宠信、王权的强弱以及领主的性格。若遭拒绝，便会留下怨恨，而这份怨恨将成为下一步的理由。"
 lam_fac_head_demand_cd_tt: "距上次向领主提出要求须满一年（约剩#high [actor.MakeScope.ScriptValue('lam_fac_hd_cd_left_value')|0]个月#!）"
 lam_faction.1200.t: "以派系之名"
 lam_faction.1200.desc: "我站在领主面前，身后是我们的派系。我该要求什么？"
 lam_faction.1200.law: "请放宽君权"
 lam_faction.1200.heir: "立我们拥护的那位为继承人"
 lam_faction.1200.tolerance: "请宽容我们的语言与祈祷"
 lam_faction.1200.gold: "我们应得的那份金钱"
 lam_faction.1200.amnesty: "赦免我们的派系"
 lam_faction.1200.x: "还是算了"
 lam_faction.1210.desc: "话已出口。领主眯起了眼睛。"
 lam_faction.1210.chance: "\n\n被接受的可能性：#V [ROOT.Char.MakeScope.Var('lam_hd_acc').GetValue|0]%#!"
 lam_faction.1210.a: "坚持到底"
 lam_faction.1210.x: "退让"
 lam_hd_yes_title: "领主答应了我们派系的要求"
 lam_hd_no_title: "领主拒绝了我们派系的要求。众人咬牙切齿"
 lam_fac_head_arms_decision: "召集派系"
 lam_fac_head_arms_decision_desc: "召唤我们派系的核心成员参加我的战争。不会人人都来，但与来者的情谊会更加深厚。"
 lam_fac_head_arms_decision_tooltip: "召集派系"
 lam_fac_head_arms_decision_tt: "向能够参加我所主导战争的核心成员与同情者领主请求援助。只有援军真正加入，凝聚力才会增加5。请求后3年内无法再次请求。"
 lam_fac_head_arms_cd_tt: "最近召集过派系（3年）"
 lam_fac_head_order_decision: "整饬派系纲纪"
 lam_fac_head_order_decision_desc: "重用可靠的同伴，或与意见相左者分道扬镳。若要更换所支持的继承候选人，须征得派系会议同意。"
 lam_fac_head_order_decision_tooltip: "整饬派系纲纪"
 lam_fac_head_order_cd_tt: "最近整饬过纲纪（1年）"
 lam_faction.1300.t: "派系纲纪"
 lam_faction.1300.desc: "派系说到底也是人。人，要管才会服从。"
 lam_faction.1300.out: "我要与[lam_ds_out.GetShortUIName]分道扬镳。"
 lam_faction.1300.out_tt: "将对我最不满的人逐出派系。此人两年内无法加入任何派系。凝聚力+5。"
 lam_faction.1300.up: "我要重用[lam_ds_up.GetShortUIName]，让其成为核心人物。"
 lam_faction.1300.up_tt: "将所选的同情者提拔为核心成员。其地位与归属将维持五年，派系凝聚力增加3。"
 lam_faction.1300.heir: "我要将支持[lam_ds_heir.GetShortUIName]一事提交会议。"
 lam_faction.1300.heir_tt: "在领主的子女中，选出对我最有好感的一位，作为我们派系五年的候选人。"
 lam_faction.1300.x: "现在不必了"
 lam_faction.1400.t: "国家尽在我们掌中"
 lam_faction.1400.desc: "我们的派系掌握了军事根基与宫廷要职，甚至握有左右君主的手段。长久维系这一根基之后，直接左右国政的机会终于到来。但即便在决断的那一刻，根基也必须完好无损。"
 lam_faction.1400.a: "立于王座之后"
 lam_faction.1400.a_tt: "重新确认现有根基，成为幕后掌权者。若要职与政治根基崩塌，便可能失去实权。"
 lam_faction.1400.b: "我还不想坐到那个位置"
 lam_faction.1410.t: "悬于丝线的王冠"
 lam_faction.1410.desc: "今天依旧是[lam_pm_lead.GetTitledFirstName]先开口，内阁随之附和。我坐在王座上看着这一切。印玺在我手中，可要盖在什么上面，却不由我决定。"
 lam_faction.1410.a: "……总有一天"
 lam_faction.1410.a_tt: "[lam_pm_lead.GetShortUIName]的派系掌控了国家。我被对方牵制，王室收入的一部分被夺走，威望与封臣们的敬意也日渐减损。若该派系的势力跌到封臣势力的一半以下，我便能解脱。也可以通过“宫廷政变”决议亲手斩断丝线。"
 lam_fac_coup_decision: "宫廷政变"
 lam_fac_coup_decision_desc: "斩断丝线。若成功，便抓捕囚禁幕后掌权者，夺回王座。若失败，丝线将勒得更紧，那个派系也会拿起武器。"
 lam_fac_coup_decision_tooltip: "宫廷政变"
 lam_fac_coup_decision_tt: "成功率取决于我的谋略、勇武与恐惧数值。对方派系的凝聚力越高，越难成功。"
 lam_fac_coup_cd_tt: "最近尝试过政变（3年）"
 lam_coup_yes_title: "政变成功。[lam_cu_lead.GetShortUIName]已身披枷锁"
 lam_coup_no_title: "政变失败。[lam_cu_lead.GetShortUIName]的派系拔刀而起"
 lam_pm_freed_title: "丝线已断。王座重归我手"
 lam_fac_puppet_modifier: "悬于丝线的王冠"
 lam_fac_puppet_modifier_desc: "一个派系掌控着国家。王座的话语出自他人之口。"
 lam_fac_puppeteer_modifier: "王座背后的影子"
 lam_fac_puppeteer_modifier_desc: "推动国家运转的不是王冠，而是此人。"
 lam_fac_btn_detail: "查看详情"
 lam_fac_btn_detail_tt: "查看这个派系的旗帜、历代首领、成员、名望与遗产、关系及沿革。"
 lam_fac_detail_title: "派系"
 lam_fac_detail_banner_tt: "以创立者[Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName]家族的纹章为旗帜。"
 lam_fac_detail_line1: "#high [Character.Custom('LamFacAgeTier')]#! · 创立于[Character.MakeScope.Var('lam_fac_founded').GetValue|0]年（已历[Character.MakeScope.Var('lam_fac_age').GetValue|0]年） · 第[Character.MakeScope.Var('lam_fac_gen').GetValue|0]代首领"
 lam_fac_detail_line2: "[Character.Custom('LamFacStance')] · [Character.Custom('LamFacStage')] · 政治 [Character.MakeScope.Var('lam_cr_share').GetValue|0]% · 要职 [Character.MakeScope.ScriptValue('lam_pol_seats_value')|0]席"
