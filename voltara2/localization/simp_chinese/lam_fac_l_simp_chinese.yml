 lam_fac_detail_core: "核心成员"
 lam_fac_detail_clients: "亲信"
 lam_fac_detail_sym: "同情者"
 lam_fac_detail_renown: "名望 #V [Character.MakeScope.Var('lam_fac_renown').GetValue|0]#!"
 lam_fac_detail_renown_tt: "每年按资历与势力积累，并随所拥立者登基、起事、承诺兑现、冲突获胜、交易等事件而增加。这是派系的名声所在。派系瓦解时能留下多少，也由它决定。只有成员达到3人以上的派系才会积累。"
 lam_fac_leg_buy: "获得"
 lam_fac_leg_org_line: "组织 [Character.MakeScope.Var('lam_fac_leg_org').GetValue|0]/3 #weak （历史 [Character.MakeScope.Var('lam_fac_tr_org').GetValue|0]）#!"
 lam_fac_leg_org_tt: "每级使凝聚力基准值+5。\n#weak 获取途径：每次首领传承1，每次挺过清洗2，每次冲突落败1。#!"
 lam_fac_leg_ties_line: "人脉 [Character.MakeScope.Var('lam_fac_leg_ties').GetValue|0]/3 #weak （历史 [Character.MakeScope.Var('lam_fac_tr_ties').GetValue|0]）#!"
 lam_fac_leg_ties_tt: "每级使吸引人的力量（加入评分）+3。\n#weak 获取途径：资历每升一级2，每次所拥立者登基2。#!"
 lam_fac_leg_purse_line: "金库 [Character.MakeScope.Var('lam_fac_leg_purse').GetValue|0]/3 #weak （历史 [Character.MakeScope.Var('lam_fac_tr_purse').GetValue|0]）#!"
 lam_fac_leg_purse_tt: "成员每季缴纳的资金增加。拉拢无派系者时能拿出的金钱也会更多。（资金存入首领的私人金库，由首领管理。）\n#weak 获取途径：每次与领主达成交易1。#!"
 lam_fac_leg_arms_line: "武力 [Character.MakeScope.Var('lam_fac_leg_arms').GetValue|0]/3 #weak （历史 [Character.MakeScope.Var('lam_fac_tr_arms').GetValue|0]）#!"
 lam_fac_leg_arms_tt: "每级使响应召集与勤王参战的几率+10%。\n#weak 获取途径：每次在与其他派系的冲突中获胜2，每次起事1。#!"
 lam_fac_leg_cause_line: "大义 [Character.MakeScope.Var('lam_fac_leg_cause').GetValue|0]/3 #weak （历史 [Character.MakeScope.Var('lam_fac_tr_cause').GetValue|0]）#!"
 lam_fac_leg_cause_tt: "派系要求被接受的几率每级提升（+5%，AI领主回应时的权重+10）。\n#weak 获取途径：每次领主信守承诺2，每次遭到背叛1。#!"
 lam_fac_leg_will_line: "遗志 [Character.MakeScope.Var('lam_fac_leg_will').GetValue|0]/1"
 lam_fac_leg_will_tt: "即使这个派系瓦解（解散、首领死亡、国家覆灭），其名望、传统、创立年份与传承代数也会有一次由最后一任首领（或最强的核心成员）保管20年。若此人或其家族、亲属、友人建立新派系，便会原样继承。继承之后，“遗志”即被消耗，在该派系的这一脉中不会再次出现。若无“遗志”，只有四分之一的名望会保留10年。\n#weak 获取途径：派系达到“老牌”资历时自动获得。#!"
 lam_fac_detail_relations: "与其他派系的关系"
 lam_fac_detail_relations_tt: "友好盟约：双方首领结下了友好盟约，彼此不起争斗。宿敌：除了敌对之外，双方首领还互为对手，或家族之间结有世仇。竞争：彼此敌对。友好：关系亲近。中立：两者皆非。在朝堂议题上，站在同一边的派系会结成一个联盟。"
 lam_fac_detail_rel_row: "[Character.GetShortUIName]的派系 · [GetPlayer.MakeScope.Var('lam_fac_detail').Char.Custom2('LamFacRel', Character.Self)]"
