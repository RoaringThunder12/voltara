 lam_fac_card_nerve_tt: "#high 气势 [Character.MakeScope.Var('lam_fac_bold').GetValue|0]#! = 君权的破绽 [Character.MakeScope.Var('lam_fac_nfc').GetValue|0] + 派系势力 [Character.MakeScope.Var('lam_fac_nfs').GetValue|0] + 首领的性情 [Character.MakeScope.Var('lam_fac_nft').GetValue|0] + 怨恨·背叛·落选·提防·另拥继承人 [Character.MakeScope.Var('lam_fac_nfg').GetValue|0] − 平息（所拥人选即位、清洗的恐惧、最后一夜的妥协） [Character.MakeScope.Var('lam_fac_nfx').GetValue|0]\n\n#weak 反王派系在气势达到60时公开反对，85时集结，110时起事。但起事要求自身势力占全体封臣的10%以上，且新君主即位后6个月内最多只会集结（所拥人选落选的派系除外）。卡片上只显示推高气势最多的两项。#!"
