 lam_ai_inv_ambitious_reason: "野心家"
 lam_fac_back_heir_interaction: "派系拥立此人为继承人"
 lam_fac_back_heir_interaction_desc: "决定我的派系要拥立谁为下一任君主。若已有拥立之人，则召开派系会议。"
 lam_fac_back_heir_interaction_tt: "向派系会议提议支持该候选人。只有议题通过后，支持的候选人才会更换。"
 lam_fac_back_heir_locked_tt: "与领主的交易束缚了我们对继承人的支持"
 lam_fac_head_posture_decision: "制定派系方针"
 lam_fac_head_posture_decision_tooltip: "制定派系方针"
 lam_fac_head_posture_decision_desc: "由首领决定派系对待领主的态度。与成员心向相悖的方针会侵蚀凝聚力。"
 lam_fac_head_posture_cd_tt: "距上次更改方针须满半年"
 lam_fac_head_goal_decision: "确定派系所求"
 lam_fac_head_goal_decision_tooltip: "确定派系所求"
 lam_fac_head_goal_decision_desc: "由首领决定派系要向领主争取什么。若能达成，派系便会获得力量；若久久不能如愿，不满就会累积。"
 lam_fac_head_confidence_decision: "向派系提请信任投票"
 lam_fac_head_confidence_decision_tooltip: "向派系提请信任投票"
 lam_fac_head_confidence_decision_desc: "召开派系会议，以首领之位为注，提请信任投票。若能保住，派系将更加团结；若反对过半，便会失去首领之位。"
 lam_fac_head_confidence_decision_tt: "将召开派系会议。若获信任：凝聚力+15，少量威望，成员好感上升。若反对过半，反对者中最强的一人将成为首领。"
 lam_fac_head_confidence_cd_tt: "近5年内已召开过不信任会议"
 lam_fac_head_confidence_held_title: "派系表示信任其首领"
 lam_faction.2100.t: "派系的方针"
 lam_faction.2100.desc: "派系的要人齐聚一堂。如何对待领主，终究要由首领来定。\n\n#weak 若所选方针与多数成员的心向相悖，每次结算时凝聚力都会下降。背弃领主或转投领主一方的决定，须先经派系会议。#!"
 lam_faction.2100.a: "站在领主身边（保王）"
 lam_faction.2100.a.tt: "派系站在领主一边。领主受到威胁时便会集结。"
