 lam_fac_cp_broken_desc: "双方已疏远得太深。如今他们不再是君王的左膀右臂，只是众多派系中的一个。再也无法向他们下令，两年之内他们也不会再成为宫廷党。"
 lam_fac_cp_rift_hint: "即便是宫廷党，若与领主严重失和，也会失去这一地位：派系心向-25或更低、起事、首领对领主的好感-40或更低、领主对首领的好感-50或更低、宠信-20或更低，或该领主犯下的不公之举（无罪囚禁首领或核心成员、背弃承诺，5年内）。仅因与其他派系争执或请愿遭拒，不会失去这一地位。"
