 lam_sh_decree_interaction: "颁下王命"
 lam_sh_decree_interaction_desc: "以傀儡君主的名义颁下王命：调整君权，打开王室金库，让臣下倒向我这一边，必要时令国王退位。"
 lam_sd_up: "强化君权"
 lam_sd_down: "削弱君权"
 lam_sd_gold: "打开王室金库"
 lam_sd_favor: "命臣下追随我"
 lam_sd_abdicate: "令国王退位"
 lam_sd_up_tt: "王国的君权提升一级。"
 lam_sd_down_tt: "王国的君权降低一级。"
 lam_sd_gold_tt: "我取走王室金库的四分之一。"
 lam_sd_favor_tt: "君主的所有封臣在5年内对我更有好感（+25）。"
 lam_sd_abdicate_tt: "君主退位，继承人即位。新君主同样会成为我的傀儡（若继承人是我，王座便归我所有）。威望-500。"
 lam_sd_law_cd_tt: "君权每年只能更改一次"
 lam_sd_gold_cd_tt: "王室金库每年只能打开一次"
 lam_sd_favor_cd_tt: "此令每5年只能颁布一次"
 lam_sd_abd_cd_tt: "每10年只能强迫退位一次"
 lam_sd_heir_tt: "君主有继承人"
 lam_fac_debug_seize_interaction: "（调试）成为这位君主的幕后掌权者"
 lam_fac_debug_seize_interaction_desc: "仅限调试模式：无需任何条件，立即将这位君主变为我的傀儡。"
 lam_fac_debug_seize_decision: "（调试）成为领主的幕后掌权者"
 lam_fac_debug_seize_decision_desc: "仅限调试模式：无需任何条件，立即将我的领主变为傀儡（测试用）。"
 lam_fac_debug_seize_decision_tooltip: "仅限调试模式的测试按钮。"
 lam_fac_debug_seize_tt: "立即成为王座背后的实权者（无论派系占比如何，都将保持）。"
 lam_sh_inherit_title: "国王已死。然而新君同样在我掌中"
 lam_sh_heir_strings_title: "接过了先人手中的丝线：这位君主如今是我的傀儡"
 lam_sh_power_modifier: "王座背后的实权"
 lam_sh_power_modifier_desc: "人人都知道真正的权力在哪里。请托与礼物源源不断，宫廷里的政治计谋都按我的心意运转。"
 lam_shadow.0001.t: "国王的密信"
 lam_shadow.0001.desc: "[lam_sh_king.GetFirstName]想偷偷送出一封密信，却被我的人截了下来。收信人是远方宫廷的一位老友。是求救，还是只是诉苦，得读过才知道。"
 lam_shadow.0001.a: "拿着密信质问国王"
 lam_shadow.0001.b: "装作不知情，原样放行"
 lam_shadow.0002.t: "请托的长队"
 lam_shadow.0002.desc: "从清晨起，我的府邸门前便排起了长队。想求得王印的人，找的不是国王，而是我。他们手中无一例外都捧着礼物。"
 lam_shadow.0002.a: "收下礼物"
 lam_shadow.0002.b: "客气地请他们回去"
 lam_shadow.0002.c: "把礼物送进王室金库"
 lam_shadow.0003.t: "王室的猜疑"
 lam_shadow.0003.desc: "[lam_sh_rel.GetTitledFirstName]在国王身边到处议论我。“陛下究竟是谁的王？”眼下还只是耳语，但耳语会蔓延。"
 lam_shadow.0003.a: "软禁起来，封住其口"
 lam_shadow.0003.b: "塞些金钱，好言安抚"
 lam_shadow.0003.c: "置之不理"
 lam_shadow.0004.t: "外国使节"
 lam_shadow.0004.desc: "一位远方国度的使节抵达了王宫。可他在前往王座之前，先敲响了我的房门。看来早有人告诉过他，该向谁低头。"
 lam_shadow.0004.a: "亲自接见"
 lam_shadow.0004.b: "让他去见国王"
 lam_shadow.0005.t: "继承人的教育"
 lam_shadow.0005.desc: "国王的继承人[lam_sh_heir.GetFirstName]尚且年幼。如今谁陪在其身边，将决定那孩子日后听谁的话。"
 lam_shadow.0005.a: "培养成我的人"
 lam_shadow.0005.b: "交给国王"
 lam_shadow.0006.t: "开口直言的贵族"
 lam_shadow.0006.desc: "[lam_sh_critic.GetTitledFirstName]在御前公然指责我：“躲在王座背后的人正在毁掉这个国家。”所有人都在看我如何回应。"
 lam_shadow.0006.a: "关进地牢，以儆效尤"
 lam_shadow.0006.b: "悄悄送去金钱"
 lam_shadow.0006.c: "装作没听见"
 lam_shadow.0007.t: "金库的缝隙"
 lam_shadow.0007.desc: "王室的账簿上有个窟窿。每个月都有一笔无人知晓的钱流进流出。把这条水道稍稍改个方向，并不难。"
 lam_shadow.0007.a: "暗中挪走"
 lam_shadow.0007.b: "不去碰它"
 lam_shadow.0008.t: "宴会上的嘉许"
 lam_shadow.0008.desc: "宴会上，[lam_sh_king.GetFirstName]举杯嘉许了我。声音在颤抖，话语却很清晰。所有人都知道，那番话是谁的意思。"
 lam_shadow.0008.a: "接受掌声"
 lam_shadow.0008.b: "把功劳归于国王"
 lam_shadow.0009.t: "真正的国王"
 lam_shadow.0009.desc: "市井间流传着一则传言：真正的王不是坐在王座上的那位，而是站在王座背后的人。国王想必也听到了。"
 lam_shadow.0009.a: "推波助澜"
 lam_shadow.0009.b: "平息传言"
 lam_shadow.0009.c: "把传言化作我的影响力"
 lam_shadow.0010.t: "毒药的诱惑"
 lam_shadow.0010.desc: "每天夜里，为国王斟酒的都是同一个侍从。那侍从是我的人。国王一死，丝线便会转到继承人身上。运气好的话，会落进一双更好摆布的手。"
 lam_shadow.0010.a: "在杯中下毒"
 lam_shadow.0010.b: "还不是时候"
 lam_shadow.0011.t: "另一派系的提议"
 lam_shadow.0011.desc: "[lam_sh_other.GetTitledFirstName]深夜派人前来，提议与我分享王座背后的位置。若是拒绝，便会多一个敌人。"
 lam_shadow.0011.a: "携手合作"
 lam_shadow.0011.b: "将其踩在脚下"
 lam_shadow.0012.t: "国王的反抗"
 lam_shadow.0012.desc: "今日御前，[lam_sh_king.GetFirstName]第一次当着群臣的面，正面反对了我的话。声音在发抖，却没有退让。一旦退让一次，下次也会如此。"
 lam_shadow.0012.a: "当场压服国王"
 lam_shadow.0012.b: "这一次给国王留些颜面"
 lam_shadow.0013.t: "官员们的站队"
 lam_shadow.0013.desc: "各个官署前都排起了官员的长队。盼着升迁和职位的人，前来宣誓效忠的对象不是国王，而是我。"
 lam_shadow.0013.a: "接受他们的效忠"
 lam_shadow.0013.b: "拒绝"
 lam_shadow.0014.t: "沉湎于酒的国王"
 lam_shadow.0014.desc: "近来，[lam_sh_king.GetFirstName]每夜都酒杯不离手。醉了的国王，什么都不会违逆。"
 lam_shadow.0014.a: "由他去吧"
 lam_shadow.0014.b: "帮他戒酒"
 lam_shadow.0015.t: "御前会议"
 lam_shadow.0015.desc: "今日的御前会议由我主持。国王坐在王座上，可内阁成员们的目光全都投向了我。"
 lam_shadow.0015.a: "主持会议"
 lam_shadow.0015.b: "把位子让给国王"
 lam_shadow.0016.t: "国王的反击"
 lam_shadow.0016.desc: "[lam_sh_king.GetFirstName]也察觉到，我们的势力已大不如前。一夜之间，国王的人锁上了宫门，我的几名亲信被拖走了。国王第一次拔出了剑。"
 lam_shadow.0016.a: "正面迎击"
 lam_shadow.0016.b: "退后一步，缓一口气"
 lam_shadow.0016.c: "收买国王的亲信"
 lam_shadow.0016.d: "放开丝线"
 lam_shadow.0010.a.tt: "国王会死。丝线也许会延续到继承人身上，也许会就此断开。"
 lam_shadow.0016.win_tt: "挫败国王的反击。国王再次低头。"
 lam_shadow.0016.lose_tt: "若失败，丝线就会断开：国王重获自由，而我将大失颜面。"
 lam_shadow.0016.yield_tt: "丝线得以保住，但2年内无法颁布更改君权或开启王室金库的王命。"
 lam_shadow.0016.go_tt: "放开丝线。国王成为自由的君主。"
 lam_faction.3000.t: "动摇的同志"
 lam_faction.3000.desc_to: "[lam_wv_who.GetTitledFirstName]近来很少来我们的聚会了。听说常与[lam_wv_to.GetTitledFirstName]那边的人来往。若不趁现在留住，下次聚会时，就该坐到那边去了。"
 lam_faction.3000.desc_out: "[lam_wv_who.GetTitledFirstName]委婉地表示，想从派系事务中抽身。是累了，还是另有盘算，我说不准。若不趁现在留住，就会悄无声息地离开。"
 lam_faction.3000.a: "亲自登门劝说"
 lam_faction.3000.b: "用金钱留人"
 lam_faction.3000.c: "动用手中的牵制"
 lam_faction.3000.d: "许以核心之位"
 lam_faction.3000.e: "放其离开"
 lam_faction.3000.ok_tt: "[lam_wv_who.GetFirstName]将在2年内留在我们的派系。"
 lam_faction.3000.fail_tt: "若劝说失败，[lam_wv_who.GetFirstName]就会离开。"
 lam_faction.3000.hook_tt: "[lam_wv_who.GetFirstName]将在3年内留在我们的派系。"
 lam_faction.3000.core_tt: "[lam_wv_who.GetFirstName]成为核心成员，并留下2年。"
 lam_faction.3000.go_tt: "[lam_wv_who.GetFirstName]会离开，但会记得我们好聚好散（10年内，我若再召唤，更容易得到回应）。"
 lam_fac_stage_shadow: "#high 实权派（王座背后的实权者）#!"
 lam_fac_view_up: "查看上级君主的宫廷"
 lam_fac_view_up_tt: "查看当前所见宫廷的领主，以及该宫廷中的派系。每按一次就上升一级（直至最高君主）。要返回，请按“查看我的宫廷”。"
 lam_faction.2940.t: "丝线还能延续吗"
 lam_faction.2940.desc_king: "王座易主了。[lam_sh_new.GetTitledFirstName]会不会像先王那样乖乖听我的话，现在还不知道。亲信们已经开始看新君主的脸色了。"
 lam_faction.2940.desc_heir: "先人握在手中的丝线，如今传到了我手上。然而[lam_sh_new.GetTitledFirstName]想试一试这张新面孔。现在若是脱手，就再也抓不回来了。"
 lam_faction.2940.a: "照旧行事"
 lam_faction.2940.b: "向亲信们撒钱"
 lam_faction.2940.c: "以恐惧压服"
 lam_faction.2940.d: "放开丝线"
 lam_faction.2940.ok_tt: "丝线得以延续：[lam_sh_new.GetFirstName]依然是我的傀儡。"
 lam_faction.2940.go_tt: "[lam_sh_new.GetFirstName]成为自由的君主。"
 lam_sh_snapped_title: "丝线断了：新君主已不在我的掌握之中"
 lam_sh_royal_interaction: "将王室成员纳入我家"
 lam_sh_royal_interaction_desc: "凭借王座背后的实权，将傀儡君主的配偶或成年子女纳为我的配偶或侧室。若是君主的配偶，便先与君主离异。宫廷议论纷纷，君主则反复咀嚼这份屈辱。"
 lam_tr_spouse: "纳为配偶"
 lam_tr_concubine: "纳为侧室"
 lam_sh_royal_cd_tt: "每年只能进行一次"
 lam_sh_royal_counter_tt: "受辱的君主可能会鼓起反击的勇气（国王反击的等待期将被取消）。"
 lam_fac_clash_spoils_tt: "围绕内阁席位的争斗：获得支持的一方夺取落败一方的一个内阁席位（掌玺大臣、军事统帅、财政总管、间谍首脑之一），落败一方的一名成员转投胜方。"
 lam_fac_feud_title: "两派如今已是死对头。再起一次冲突，就要见血了"
 lam_fac_ally_rose_title: "同盟派系已经起事。是否一同起事，由我决定"
 lam_faction.3010.t: "血仇"
 lam_faction.3010.desc: "我们与[lam_bf_foe.GetTitledFirstName]的派系已是第三次交锋。这已经不是宫廷政治了。对方想必也是这么想的。先动手的一方才能活下来。"
 lam_faction.3010.a: "先下手为强（暗杀计谋）"
 lam_faction.3010.b: "带着金钱前去求和"
 lam_faction.3010.c: "静观其变"
 lam_faction.3010.b_tt: "两派之间的怨恨得以化解（竞争与仇敌关系消失）。"
 lam_faction.3010.c_tt: "对方可能会先动手。"
 lam_fac_card_inf: "#weak 影响力金库：#! [Character.MakeScope.Var('lam_fac_inf').GetValue|0]"
 lam_fac_card_inf_tt: "在行政制宫廷中，派系成员缴纳的会费（核心成员6、支持者3，每季一次，影响力达到50以上时）会积存于此。首领可以用它把我们的人推为帝位或军区总督的候选人，或压低敌对派系候选人的分数（每100可换30点候选人分数，是单独花费时的1.5倍）。"
 lam_fac_adm_back_interaction: "以派系金库推举候选人"
 lam_fac_adm_back_interaction_desc: "从派系的影响力金库中花费100，推举此人为帝位或本家军区总督的候选人（候选人分数+30）。"
 lam_fac_adm_harm_interaction: "以派系金库压低候选人"
 lam_fac_adm_harm_interaction_desc: "从派系的影响力金库中花费100，压低敌对派系成员争夺帝位或本家军区总督的候选人分数（−30）。"
 lam_fac_adm_chest_tt: "派系影响力金库中有100或以上"
 lam_adb_throne: "推为帝位候选人"
 lam_adb_gov: "推为本家军区总督候选人"
 lam_adh_throne: "针对帝位候选"
 lam_adh_gov: "针对本家军区总督候选"
 lam_fac_adm_back_tt: "派系金库−100。此人的候选人分数+30。"
 lam_fac_adm_harm_tt: "派系金库−100。此人的候选人分数−30。对方会憎恨我。"
 lam_facx.0001.t: "集会之后的小酌"
 lam_facx.0001.d1: "集会散了，[lam_x_mate.GetFirstName]拉住了我的衣袖。“就这么散了，岂不可惜？”酒肆的灯火还亮着。"
 lam_facx.0001.d2: "拘谨的会议一结束，几个人便取出了酒杯。人群中间，[lam_x_mate.GetFirstName]给我留了个位子，正朝我招手。"
 lam_facx.0001.d3: "我刚走出会场，[lam_x_mate.GetFirstName]便跟了出来。“今天这样的日子，总得喝一杯。”酒一下肚，人就会把心里话掏出来。"
 lam_facx.0001.a: "一起喝酒"
 lam_facx.0001.b: "早早离席"
 lam_facx.0001.c: "侧耳倾听醉话"
 lam_facx.0002.t: "首领的请求"
 lam_facx.0002.d1: "[lam_x_head.GetTitledFirstName]悄悄把我叫了过去，说派系有急用，钱不够了。听起来与其说是请求，不如说是试探。"
 lam_facx.0002.d2: "“你的话，我信得过。”[lam_x_head.GetFirstName]这么说着，提出了一个小小的请求。答应了，便是一份人情；拒绝了，便是一个污点。"
 lam_facx.0002.d3: "首领来了一封信。措辞客气，字里行间却满是期待——身为同志，这种时候就该搭把手。"
 lam_facx.0002.a: "答应下来"
 lam_facx.0002.b: "婉言拒绝"
 lam_facx.0003.t: "另一派系的招手"
 lam_facx.0003.d1: "[lam_x_rival.GetTitledFirstName]的人深夜来访。“在那边就只得到这般待遇？若到我们这边，位子可就不一样了。”"
 lam_facx.0003.d2: "猎场上，[lam_x_rival.GetFirstName]不经意地搭起话来。听着像是随口一提，却并非随口一提。"
 lam_facx.0003.d3: "一张没有封印的字条：“更好的位子正等着你。”字迹出自[lam_x_rival.GetFirstName]的书记之手。"
 lam_facx.0003.a: "拒绝，并告知首领"
 lam_facx.0003.b: "只说会考虑考虑"
 lam_facx.0003.c: "当场投奔过去"
 lam_facx.0004.t: "派系的基金"
 lam_facx.0004.d1: "派系正在募集基金。谁出了多少，人人都知道。而且人人都记得。"
 lam_facx.0004.d2: "[lam_x_head.GetFirstName]打开钱箱给我看。里面空空如也。不必开口，我也明白对方想要什么。"
 lam_facx.0004.a: "慷慨解囊"
 lam_facx.0004.b: "倾囊相助"
 lam_facx.0004.c: "推说手头拮据"
 lam_facx.0005.t: "同志的危难"
 lam_facx.0005.d1: "听说[lam_x_mate.GetTitledFirstName]的钱库已经见了底，债主们都守在门口。那个我唤作同志的人，如今被逼入了绝境。"
 lam_facx.0005.d2: "[lam_x_mate.GetFirstName]卧病在床。碍于颜面，想必说不出求助的话，可寄来的信上，字迹都在发抖。"
 lam_facx.0005.d3: "[lam_x_mate.GetFirstName]在战争中节节败退。派系里谁会伸出援手，所有人都在看着。"
 lam_facx.0005.a: "出手相助（送去金钱）"
 lam_facx.0005.b: "装作不知"
 lam_facx.0006.t: "关于继任者的传言"
 lam_facx.0006.d1: "宫廷里流传着一个说法：[lam_x_head.GetFirstName]之后，就轮到我了。而首领本人的脸色却很僵硬。"
 lam_facx.0006.d2: "宴会上，有人一边给我斟酒，一边称我为“下一任首领”。众人哄堂大笑，[lam_x_head.GetFirstName]却没有笑。"
 lam_facx.0006.d3: "说我是派系下一张面孔的话，已经传到了市井街头。不知是谁散播的，但我并不讨厌。"
 lam_facx.0006.a: "享受这些传言"
 lam_facx.0006.b: "在首领面前明确否认"
 lam_facx.0101.t: "新面孔"
 lam_facx.0101.d1: "[lam_x_new.GetTitledFirstName]找上门来，说想加入我们的派系。此人至今尚未站在任何一边。"
 lam_facx.0101.d2: "“我愿立于您的旗帜之下。”[lam_x_new.GetFirstName]低下了头。光凭热情撑不起一个派系，但没有热情，派系也立不起来。"
 lam_facx.0101.d3: "[lam_x_new.GetFirstName]听闻我们的名声，前来投奔。收下的话，家里多一口人，也就多一张嘴。"
 lam_facx.0101.a: "迎为核心成员"
 lam_facx.0101.b: "收为支持者"
 lam_facx.0101.c: "打发其离开"
 lam_facx.0102.t: "同心之仪"
 lam_facx.0102.d1: "[lam_x_mate.GetFirstName]提议举行一场盟誓之仪。说是同饮一杯酒，同诵一段誓言，人心也就能合而为一。"
 lam_facx.0102.d2: "有人说派系变得松散了。是时候把大家聚到一处，重新立誓了。"
 lam_facx.0102.d3: "有一个古老的习俗：派系所有成员都把手放在首领的剑上起誓。如今已经没人这么做了，也正因如此，才更显分量。"
 lam_facx.0102.a: "举行盛大的仪式"
 lam_facx.0102.b: "以言语凝聚人心"
 lam_facx.0103.t: "核心成员的不满"
 lam_facx.0103.d1: "[lam_x_mate.GetTitledFirstName]在集会上提高了嗓门：“我们流了多少血，就该有多少话语权！”"
 lam_facx.0103.d2: "[lam_x_mate.GetFirstName]私下找来，大倒苦水，说自己为派系付出了那么多，得到的待遇却寒酸得很。"
 lam_facx.0103.d3: "核心成员[lam_x_mate.GetFirstName]满脸不满。现在不加安抚，其他人也会跟着学。"
 lam_facx.0103.a: "给予更大的话语权"
 lam_facx.0103.b: "斥其安守本分"
 lam_facx.0103.c: "用金钱堵住其嘴"
 lam_facx.0104.t: "派系中的奸细"
 lam_facx.0104.d1: "有人看到[lam_x_mate.GetFirstName]与[lam_x_rival.GetFirstName]的人秘密会面。我们集会上的话，一直在往外泄。"
 lam_facx.0104.d2: "奇怪的是，我们定下的事，[lam_x_rival.GetFirstName]总是最先知道。顺着痕迹追查下去，查到了[lam_x_mate.GetFirstName]头上。"
 lam_facx.0104.d3: "一封被截下的信。是[lam_x_mate.GetFirstName]的笔迹，收信人是[lam_x_rival.GetFirstName]。"
 lam_facx.0104.a: "逐出派系"
 lam_facx.0104.b: "收为双面间谍"
 lam_facx.0104.c: "装作不知，放过此事"
 lam_facx.0105.t: "旗帜与名号"
 lam_facx.0105.d1: "派系成员们提议要有一面属于我们自己的旗帜。不过是一块布，可人们有时会为了一块布去死。"
 lam_facx.0105.d2: "其他派系各有纹章与箴言。我们的人也想要些能拿得出手的东西。"
 lam_facx.0105.a: "请工匠来制作旗帜"
 lam_facx.0105.b: "斥为虚礼浮华而拒绝"
 lam_facx.0106.t: "长老的忠告"
 lam_facx.0106.d1: "派系的元老[lam_x_mate.GetFirstName]拄着拐杖来了。“年轻的首领啊，听听老朽的唠叨吧。”"
 lam_facx.0106.d2: "早在这个派系成立之前，[lam_x_mate.GetFirstName]就已在宫廷之中。如今此人面带忧色，说有话要讲。"
 lam_facx.0106.d3: "年迈的[lam_x_mate.GetFirstName]递来一份连夜写成的忠告。密密麻麻的字里，记满了一桩桩往日的失败。"
 lam_facx.0106.a: "洗耳恭听"
 lam_facx.0106.b: "说时代已经变了"
 lam_facx.0201.t: "两边的请帖"
 lam_facx.0201.d1: "同一天傍晚，来了两封请帖。一封来自[lam_x_rival.GetTitledFirstName]，一封来自[lam_x_rival2.GetTitledFirstName]。两边不可能都去。"
 lam_facx.0201.d2: "[lam_x_rival.GetFirstName]和[lam_x_rival2.GetFirstName]在同一天设宴。这不可能是巧合。坐上哪一张桌子，便是我的回答。"
 lam_facx.0201.d3: "两个派系都想要我。今晚我出现在哪个宴会厅，整个宫廷都会看在眼里。"
 lam_facx.0201.a: "赴[lam_x_rival.GetFirstName]的宴会"
 lam_facx.0201.b: "赴[lam_x_rival2.GetFirstName]的宴会"
 lam_facx.0201.c: "两边都婉言谢绝"
 lam_facx.0202.t: "中立的代价"
 lam_facx.0202.d1: "不站在任何一边，也是一种选择。而这种选择，会让双方都不痛快。"
 lam_facx.0202.d2: "近来，无论是[lam_x_rival.GetFirstName]还是[lam_x_rival2.GetFirstName]，看我的眼神都不怎么友善。中立并不是免费的。"
 lam_facx.0202.a: "向双方都送去礼物"
 lam_facx.0202.b: "公开宣布中立"
 lam_facx.0203.t: "调解的请求"
 lam_facx.0203.d1: "[lam_x_rival.GetFirstName]和[lam_x_rival2.GetFirstName]一同来找我。两人彼此不搭一句话，对我却有说不完的话。"
 lam_facx.0203.d2: "两派的争执拖得久了，有人提起了我的名字：“该由不属于任何一方的人来裁决。”"
 lam_facx.0203.d3: "宫廷已经厌倦了两派的争斗。所有人的目光都投向了无派系的我。"
 lam_facx.0203.a: "接下调解之责"
 lam_facx.0203.b: "以事不关己为由退开"
 lam_facx.0301.t: "首领们的宴会"
 lam_facx.0301.d1: "有人提议让各派首领同坐一桌。老话说，同分一块面包的人，就少拔几次剑。"
 lam_facx.0301.d2: "近来，包括[lam_x_rival.GetTitledFirstName]在内的各派首领，彼此连眼神都不愿相交。是时候设宴换换气氛了。"
 lam_facx.0301.d3: "宫廷侍从长拿来了宴会的筹划。宾客名单的最上方，写着各派首领的名字。"
 lam_facx.0301.a: "设宴"
 lam_facx.0301.b: "纯属浪费"
 lam_facx.0302.t: "匿名投书"
 lam_facx.0302.d1: "一封没有署名的投书被放在了王座前。信中说，[lam_x_rival.GetTitledFirstName]正在图谋叛逆。"
 lam_facx.0302.d2: "“请提防[lam_x_rival.GetFirstName]。”只有一行字。是谁写的，又为何而写，无从得知。"
 lam_facx.0302.d3: "间谍首脑递来一张字条，说是在宫中井边捡到的，上面反复写着[lam_x_rival.GetFirstName]的名字。"
 lam_facx.0302.a: "暗中调查"
 lam_facx.0302.b: "一把火烧掉"
 lam_facx.0302.c: "公开追问"
 lam_facx.0303.t: "联名状"
 lam_facx.0303.d1: "一份由多名封臣并排署名的联名状呈了上来。最上方是[lam_x_rival.GetFirstName]的名字。"
 lam_facx.0303.d2: "呈上来一份请愿。比内容更可怕的，是下面密密麻麻的签名。"
 lam_facx.0303.a: "倾听请愿"
 lam_facx.0303.b: "将联名状退回"
 lam_facx.0304.t: "决斗的请求"
 lam_facx.0304.d1: "[lam_x_rival.GetFirstName]和[lam_x_rival2.GetFirstName]请求准许以决斗来分辨是非。"
 lam_facx.0304.d2: "两位派系首领掷下了手套。现在只差我的准许。宫廷里已经有人开始下注了。"
 lam_facx.0304.d3: "“陛下，请让我们以剑了结此事。”听到[lam_x_rival.GetFirstName]这么说，[lam_x_rival2.GetFirstName]也点了点头。"
 lam_facx.0304.a: "准许决斗"
 lam_facx.0304.b: "禁止决斗"
 lam_facx.0305.t: "站队"
 lam_facx.0305.d1: "宫廷里的人都只往[lam_x_rival.GetFirstName]的派系里挤，[lam_x_rival2.GetFirstName]那边却冷冷清清。平衡正在崩塌。"
 lam_facx.0305.d2: "偏向一边的天平，终有一天会翻倒。是该扶持小派系，还是任其随波逐流？"
 lam_facx.0305.a: "扶持弱势一方"
 lam_facx.0305.b: "顺其自然"
 lam_facx.0001.c_tt: "也许能抓住酒席上的失言（35%几率获得牵制）。"
 lam_facx.0003.c_tt: "转投[lam_x_rival.GetFirstName]的派系，成为核心成员（2年内不得脱离）。"
 lam_facx.0004.b_tt: "成为派系的核心成员。"
 lam_facx.0101.a_tt: "[lam_x_new.GetFirstName]成为我们派系的核心成员（2年内不得脱离）。"
 lam_facx.0101.b_tt: "[lam_x_new.GetFirstName]成为我们派系的支持者（1年内不得脱离）。"
 lam_facx.0104.a_tt: "[lam_x_mate.GetFirstName]被逐出派系。"
 lam_facx.0104.b_tt: "有一半的几率获得对[lam_x_rival.GetFirstName]的牵制。"
 lam_facx.0203.ok: "两位首领勉强握了握手。"
 lam_facx.0203.fail: "调解失败了，两人都怪罪于我。"
 lam_facx.0302.found: "投书所言属实。"
 lam_facx.0302.nothing: "什么也没查出来。而[lam_x_rival.GetFirstName]知道自己被调查过。"
 lam_facx.0304.a_win: "[lam_x_rival.GetFirstName]获胜了。"
 lam_facx.0304.b_win: "[lam_x_rival2.GetFirstName]获胜了。"
 lam_fac_clash_spoils_heir_tt: "围绕继承人的争斗：获得支持一方的候选人声势大涨（领主宠信额外+10），落败一方则会动摇（凝聚力−5）。"
 lam_fac_clash_spoils_face_tt: "事关颜面的争斗：获得支持的一方得到威望，落败一方失去威望，且落败一方的一名成员会转投胜方。"
