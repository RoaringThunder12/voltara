 lam_fac_hint: "派系围绕强大的封臣、内阁成员与家主聚集。心向（对君权的态度）与气势（将其表露于外的力量）各自消长。"
 lam_fac_card_camp: "#weak 心向与气势：#! [Character.Custom('LamFacCamp')] · [Character.Custom('LamFacStage')]"
 lam_fac_stage_tt: "#high 心向#!是对君权的态度（平均[Character.MakeScope.Var('lam_fac_att').GetValue|0]），由好感、利害关系（按封臣倾向）、血缘与官职决定。\n#high 气势#!是将这份心向表露于外的力量（[Character.MakeScope.Var('lam_fac_bold').GetValue|0]）。君权越弱、派系势力越大、首领越大胆，气势就越高。\n\n君权强盛时，连反王派也会#weak 潜伏#!。气势一旦高涨，便会沿着#N 公开反对#! → #N 集结#! → #N 起事#!一路升级。起事后会向领主提出要求，若遭拒绝，便会演变为战争。\n保王派在君权强盛时作为#P 亲信#!依附左右，君权动摇时则以#P 保王集结#!之势团结起来。\n\n#high 最主要的原因（以首领为准）：#! [Character.Custom('LamFacMoodWhy')]"
 lam_fac_crown_line: "#high [Character.GetShortUIName]#!的宫廷 · 君权 [Character.Custom('LamCrown')] #weak （[Character.MakeScope.Var('lam_crown').GetValue|0]）#!"
 lam_fac_crown_tt: "君权的强弱取决于：君权法、正统性、恐惧、君主与封臣的兵力之差、威望、是否正在进行防御战争，以及君主是否未成年。\n\n君权强时，连反王派系也屏息噤声；君权弱时，反王派揭竿而起，保王派则聚集到勤王的旗帜之下。"
 lam_fac_view_self: "查看我的宫廷"
 lam_view_factions_interaction: "察看派系"
 lam_view_factions_interaction_desc: "察看这个国家的派系：谁是谁的人，君权有多稳固。（适用于独立统治者。我的宫廷和我领主的宫廷可直接在派系窗口中查看。）"
