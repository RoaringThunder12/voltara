 lam_faction.2000.t: "携手之邀"
 lam_faction.2000.desc: "[lam_inv_head.GetShortUIName]派人前来，邀我加入#high [lam_inv_head.Custom('LamFacName')]#!。来人还转达了一句话：怀着同样心愿的人聚在一起，领主也会侧耳倾听。\n\n#weak 接受后，我将成为该派系的亲信。若婉拒，3年内不会再来相邀。#!"
