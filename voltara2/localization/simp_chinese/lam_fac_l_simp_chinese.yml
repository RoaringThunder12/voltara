 lam_tk_lord_desc: "外交越高越容易成功。成功：领主的宠信+8／失败：−3"
 lam_tk_win: "派其拉拢其他派系的人"
 lam_tk_win_desc: "外交与谋略越高、与对方越亲近（同一家族、朋友、好感），越容易成功。优先拉拢与受托者亲近的人。成功：此人成为我们的亲信（其原派系将心生怨恨）"
 lam_tk_spy: "派其刺探敌对派系"
 lam_tk_spy_desc: "谋略越高越容易成功。成功：查出其首领的一个秘密（若无秘密可挖则空手而归）／失败：通常悄然了结，但十次中有四次会败露，关系随之恶化"
