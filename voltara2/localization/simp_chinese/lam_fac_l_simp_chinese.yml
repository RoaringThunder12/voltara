 lam_faction.0400.t: "清洗过后的宫廷"
 lam_faction.0400.desc: "[lam_purged.GetTitledFirstName]被带走的那天傍晚，宫廷安静得出奇。每条走廊里都有低语往来，目光一旦相遇，人人都抢先低下头去。"
 lam_faction.0400.desc.head: "\n\n被带走的人是[lam_purge_lead.GetFirstName]派系的首领。失了头领的一伙人，要么作鸟兽散，要么咬牙切齿，二者必居其一。"
 lam_faction.0400.desc.core: "\n\n被带走的人是[lam_purge_lead.GetFirstName]派系的核心成员。[lam_purge_lead.GetFirstName]一言未发，但这份沉默更加沉重。"
 lam_faction.0400.a: "安抚余下的人。罪责只追究一人。"
 lam_faction.0400.b: "杀一儆百。所有人应该都看在眼里了。"
 lam_faction.0400.c: "干脆解散那个派系。"
 lam_faction.0500.t: "分道扬镳之夜"
 lam_faction.0500.desc: "就在觐见厅正中，[lam_fs_new.GetTitledFirstName]背弃了[lam_fs_lead.GetTitledFirstName]。长久同在一面旗帜下的人们，今夜一分为二。追随者们一个接一个地站到了[lam_fs_new.GetFirstName]身后。\n\n两人都看着我。"
 lam_faction.0500.a: "站到[lam_fs_lead.GetFirstName]一边。"
 lam_faction.0500.b: "站到[lam_fs_new.GetFirstName]一边。"
 lam_faction.0500.c: "谁也不偏袒。"
