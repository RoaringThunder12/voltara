 lam_fac_badge_promise_tt: "[Character.MakeScope.Var('lam_fac_promise_by').Char.GetShortUIName]的承诺：[Character.Custom('LamFacPromiseWhat')]\n剩余期限：约#high [Character.MakeScope.ScriptValue('lam_fac_promise_left_value')|0]个月#!\n\n#weak 在期限内兑现，宠信便会上升；若是违背，则会被记作背叛。若已无法兑现（政体没有内阁、没有可联姻的家人、正处于防御战争中），承诺便告作废。每个派系同时只能有一项承诺。#!"
