 lam_found_faction_decision: "创立派系"
 lam_found_faction_decision_desc: "召集志同道合的人，创立一个派系。若在领主的宫廷中，我可以亲自领导，也可以托付给其他封臣；若在我自己的宫廷中，则要托付给某位封臣。君主不能亲自领导自己宫廷里的派系。受托之人可以拒绝。"
 lam_found_faction_decision_tooltip: "创立派系"
