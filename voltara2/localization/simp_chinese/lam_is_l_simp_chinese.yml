 lam_is_none: ""
 lam_is_even: "势均力敌"
 lam_is_push_tt: "为此事出力。所有议题合计每年一次。\n君主8（100威望）· 首领10 + 影响力的1/10（100威望）· 派系成员6（50威望）· 无派系者8（75威望）\n首领还会设法拉拢一名无派系封臣（对我的好感越高，越容易倒向我方）。\n无派系者一旦站队，其势力将一直计入该方直至结束；若该方获胜，此人将获得威望以及该方各首领的好感。\n对立一方的派系首领会记住此事。"
