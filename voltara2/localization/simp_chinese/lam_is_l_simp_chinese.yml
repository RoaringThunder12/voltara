 lam_is_war_evt_c: "拔刀出征的呼声笼罩了整个宫廷。各派系都希望君主出征。"
 lam_is_war_evt_p: "厌倦战争的宫廷要求议和。各派系异口同声，要求结束与[Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]的战争。"
 lam_is_war_acc_c: "承诺在2年内出征"
 lam_is_war_acc_p: "缔结白和"
 lam_is_war_title_c: "出征之议"
 lam_is_war_title_p: "与[Character.MakeScope.Var('lam_is_war_foe').Char.GetShortUIName]的战争"
 lam_is_war_tt_c: "围绕是否开战的争执。\n#high 出征：#! 追求功勋或好战的派系、意图收复失地的派系，以及首领勇敢、野心勃勃或暴怒的派系。\n#high 维持和平：#! 守住现有势力或寻求让步的派系、与君主对立的派系，以及首领懦弱、知足或懒惰的派系。若最近刚打过仗，这一点也会加重这一方的分量。\n若出征一方获胜，君主便须承诺在2年内出征。"
 lam_is_war_tt_p: "围绕是否继续这场战争的争执。\n#high 坚持作战：#! 追求功勋或好战的派系、意图收复失地的派系，以及首领勇敢、野心勃勃或暴怒的派系。若战事占优，战况也会为这一方加重分量。\n#high 议和：#! 守住现有势力或寻求让步的派系、与君主对立的派系，以及首领懦弱、知足或懒惰的派系。若战事不利或拖延超过3年，战况会为这一方加重分量。\n若议和一方获胜，这场战争将以白和告终。"
 lam_is_heir_title: "#high 继承问题#!"
 lam_is_heir_tt: "各派系想要另立一名子女，取代现任继承人。\n#high 现继承人一方：#! 支持现继承人的派系，以及君权的分量。\n#high 拥立一方：#! 支持那名子女的派系。\n若拥立一方获胜，由君主决定是否更换继承人。若君主拒绝，支持拥立的派系会认为自己遭到了无视。\n大义：现继承人若未成年、无能或是私生子，大义便在拥立一方；挑战者若未成年，大义便在现继承人一方。正当的继承本身，也是现继承人一方的大义。\n\n#weak 拉拢无派系封臣，便能按其势力增加分量。获胜一方的派系在3年内会吸引人手，落败一方则凝聚力动摇、人员流失。君主只能从旁助力。#!"
