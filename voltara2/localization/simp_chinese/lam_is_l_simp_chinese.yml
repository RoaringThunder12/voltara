 lam_is_faith_title: "#high 信仰与文化#!"
 lam_is_faith_tt: "围绕如何对待其他信仰与文化的争论。\n#high 坚守正统：#! 以捍卫信仰为目标或信仰虔诚的派系。领主若是狂热，也会为此方增添分量。\n#high 宽容：#! 以宽容为目标，或属于少数信仰、少数文化的派系。\n宽容一方获胜，则他们所属文化的文化接受度上升，并赢得其他信仰的好感；正统一方获胜，则虔诚提升。\n理由：信奉其他信仰或属于其他文化的封臣越多，越利于宽容一方。\n\n#weak 拉拢无派系封臣，就能按其势力为一方增添分量。胜方派系3年内会有人前来投奔，败方则凝聚力动摇，人员离去。领主只能从旁相助。#!"
