 lam_is_crown_title: "#high 君权#!"
 lam_is_crown_tt: "主张削减君权的派系与力图维护君权的派系之争。\n#high 维护君权：#! 以加强君权为目标或追随领主的派系，以及君权本身的分量。\n#high 削减君权：#! 以放宽君权为目标的派系。\n若削减一方获胜，君权降低一级。\n理由：君权薄弱或领主施行暴政时，利于削减一方。\n\n#weak 拉拢无派系封臣，就能按其势力为一方增添分量。胜方派系3年内会有人前来投奔，败方则凝聚力动摇，人员离去。领主只能从旁相助。#!"
