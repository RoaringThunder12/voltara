 lam_is.0002.t: "宫廷局势"
 lam_is.0002.open: "[lam_is_lord.GetShortUIName]的宫廷里，各派系眼下正为这些事针锋相对："
 lam_is.0002.a: "知道了"
 lam_is.0002.beaten: "\n\n#N 我们的派系在朝堂议题上落了下风，势头正在衰退。三年之内，容易有人离去。#!"
 lam_is.0002.victor: "\n\n#P 我们的派系在朝堂议题上占了上风，人们纷纷前来投附。#!"
 lam_is.0002.tip_head: "\n\n#high 眼下可走的一步棋#!\n若我们在这场争执中出一份力（每年一次），还会设法把一名无派系的封臣拉到我们这边。"
 lam_is.0002.tip_member: "\n\n#high 眼下可走的一步棋#!\n派系成员也能在议题卡上出一份力（每年一次）。"
 lam_is.0002.tip_unaligned: "\n\n#high 眼下可走的一步棋#!\n不站任何一边的我，手中势力足以拨动天平。在议题卡上选定一边后，直到议题了结，我的势力都会压在那一边；若那一边获胜，我便能获得威望与好感。"
 lam_is_dig_head: "\n\n#high 朝堂议题#!"
