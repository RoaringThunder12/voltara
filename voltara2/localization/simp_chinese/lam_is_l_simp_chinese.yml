 lam_is_council_title: "#high 内阁席位#!"
 lam_is_council_tt: "围绕内阁席位的争夺。\n#high 维持现任内阁：#! 已有自己人进入内阁的派系。\n#high 要求席位：#! 觊觎官职，或势力强大却没有席位的派系。\n若要求一方获胜，他们的人将进入内阁。\n理由：内阁有空缺席位时，利于要求一方。\n\n#weak 拉拢无派系封臣，就能按其势力为一方增添分量。胜方派系3年内会有人前来投奔，败方则凝聚力动摇，人员离去。领主只能从旁相助。#!"
