 lam_is_tax_title: "#high 税收与征兵#!"
 lam_is_tax_tt: "围绕封臣所负税收与征兵的争执。\n#high 维持征税：#!以加强君权为目标或忠心耿耿的派系，以及领主的分量。\n#high 减轻负担：#!寻求让步或与领主对立的派系。\n减负一方获胜，封臣的税收与征兵负担将减轻5年；维持一方获胜，则加重3年。\n理由：持续1年以上的战争与和平时期充盈的国库有利于减负一方，国库亏空有利于维持征税一方。\n\n#weak 拉拢无派系封臣，便能为己方添上其势力的分量。获胜一方的派系在3年内会吸引人员加入，落败一方则凝聚力动摇、人员流失。领主只能从旁相助。#!"
