 lam_is.0001.heir: "宫廷的天平终于倒向了[lam_is_cb.GetShortUIName]。各派系异口同声，要求立[lam_is_cb.GetShortUIName]为继承人，取代[lam_is_ca.GetShortUIName]。\n\n若是应允，胜者得势，败者势衰。若是回绝，提出要求的派系好感下降，怨恨加深。"
