l_simp_chinese:
 lam_cr_ballot_title: "派系会议：我们的决议"
 lam_cr_ballot_intro: "[lam_cr_head.GetShortUIName]的派系面临重大抉择，齐聚一堂。每个人的话语权与其根基和功劳相称，将左右此次决议。"
 lam_cr_ballot_stale: "本次会议已经结束，或与会者的身份已经改变，无法再投票。"
 lam_cr_ballot_numbers: "\n\n当前赞成方影响力：#P [lam_cr_head.MakeScope.Var('lam_cr_yes').GetValue|1]#!\n当前反对方影响力：#N [lam_cr_head.MakeScope.Var('lam_cr_no').GetValue|1]#!\n总表决权：[lam_cr_head.MakeScope.Var('lam_cr_total').GetValue|1]\n我的话语权：#high [ROOT.Char.MakeScope.Var('lam_cr_weight').GetValue|1]#!（[ROOT.Char.MakeScope.ScriptValue('lam_cr_ballot_share_value')|1]%）\n\n[lam_cr_head.Custom('LamCrThreshold')]\n#weak 话语权在会议开始时即已确定。死亡或离开的与会者不计入统计。15天内未作答的票视为弃权。#!\n[ROOT.Char.Custom2('LamUxBallot', GetPlayer)]"
 lam_cr_vote_yes: "我赞成。"
 lam_cr_vote_no: "我反对。"
 lam_cr_vote_abstain: "我弃权。"
 lam_cr_vote_request: "若能正式承认我的功劳，我便赞成。"
 lam_cr_vote_binding_tt: "我的话语权将计入最终表决。只有获得通过的议题才会施行。"
 lam_cr_abstain_tt: "我的话语权仍计入总表决权，但不会加到赞成或反对任何一方。"
 lam_cr_request_tt: "要求首领正式承认功劳。若首领花费75威望应允，则投下赞成票，并在两年内获得功劳带来的影响力+3。本次会议的话语权不变。若遭拒绝，可重新投票。"
 lam_cr_request_title: "支持的代价"
 lam_cr_request_desc: "[lam_cr_petitioner.GetShortUIName]表示，只要正式承认其功劳，便会支持此次议题。"
 lam_cr_request_accept: "我会让所有人都知道你的功劳。"
 lam_cr_request_refuse: "这个条件我无法接受。"
 lam_cr_request_accept_tt: "消耗75威望。确保对方投下赞成票，并在两年内承认其在派系内的功劳影响力+3。"
 lam_cr_close: "知道了。"
 lam_cr_result_title: "派系会议的决议"
 lam_cr_result_passed: "议题获得了足够的支持，已经通过。派系将依此决议行事。"
 lam_cr_result_rejected: "议题未能获得所需的支持。所提议的变动不予施行。若否决的是应对禁令的方案，则改取相反的方针。"
 lam_cr_result_cancelled: "由于领导层或议题的条件发生了变化，会议已取消。此次表决不会施行任何决定。"
 lam_cr_result_numbers: "\n\n赞成 [TopScope.GetValue('lam_cr_result_yes')|1] · 反对 [TopScope.GetValue('lam_cr_result_no')|1]\n总表决权 [TopScope.GetValue('lam_cr_result_total')|1]\n#weak 每一票的分量综合了军力、财力、身份、宫廷地位、人脉与派系功劳。弃权计入总表决权。#!"
 lam_cr_result_summary: "[ROOT.Char.Custom('LamCrResult')]\n[lam_cr_head.GetShortUIName]的派系结束了会议。\n赞成 [TopScope.GetValue('lam_cr_result_yes')|1] / 反对 [TopScope.GetValue('lam_cr_result_no')|1] / 总计 [TopScope.GetValue('lam_cr_result_total')|1]"
 lam_cr_legacy_closed: "这是一份按旧规处理完毕的会议记录，不会改变当前的派系归属或首领地位。"
 lam_cr_contract_cancelled: "履行交易的条件已不复存在，协议已取消"
 lam_cr_threshold_normal: "#high 通过条件：赞成票超过总表决权的半数。票数相同则否决。#!"
 lam_cr_threshold_major: "#high 通过条件：赞成票达到总表决权的三分之二以上。#!"
 lam_cr_patronage_title: "朝堂的天平倾斜了"
 lam_cr_patronage_desc: "[lam_pr_lord.GetShortUIName]对各派系的厚薄有了变化。宫廷之门向哪个派系敞开得更宽，众人都在注视。我们的派系也必须决定如何应对。"
 lam_cr_patronage_obstruct: "我们要遏制竞争派系一家独大。"
 lam_cr_patronage_coalition: "我们要与其他派系联手。"
 lam_cr_patronage_approach: "设法重新接近君主。"
 lam_cr_obstruct_tt: "反对竞争派系当前提交的任免、继承或法律请愿。反对压力仅作用于该请愿。"
 lam_cr_coalition_tt: "向其他在宫廷中失势的派系提议结成联盟。须对方同意，同盟才能成立。若无合适的对象，则改为遏制竞争派系。"
 lam_cr_approach_tt: "针对当前的不满，正式请愿索要官职或资助。需要君主同意并切实兑现。"
 lam_cr_approach_title: "受冷落的派系再度向君主靠拢"
 lam_cr_obstruct_title: "宫廷中的扶持之争已演变为派系间的对立"
 lam_cr_coalition_title: "为阻止一家独大而结成的联盟"
 lam_cr_coalition_desc: "[lam_pr_reactor.GetShortUIName]伸出了手。趁君主的扶持偏向一方之际，提议结成同盟，彼此支撑。"
 lam_cr_coalition_accept: "我们也要一同发声。"
 lam_cr_coalition_decline: "我们自有我们的路。"
 lam_cr_coalition_formed: "在扶持之争中落败的派系结成了同盟"
 lam_cr_coalition_refused: "联盟提议遭到拒绝"
 lam_cr_competition_opinion: "争夺宫廷扶持"
 lam_cr_person_name: "[Character.GetFirstNameNoTooltip] · [Character.MakeScope.ScriptValue('lam_cr_influence_value')|0]"
 lam_cr_status_active: "进行中的派系会议：赞成 [Character.MakeScope.Var('lam_cr_yes').GetValue|0] / 总计 [Character.MakeScope.Var('lam_cr_total').GetValue|0]"
 lam_cr_status_passed: "最近的派系会议：通过"
 lam_cr_status_rejected: "最近的派系会议：否决"
 lam_cr_status_cancelled: "最近的派系会议：取消"
 lam_cr_status_none: "目前没有进行中的派系会议"
 lam_cr_split_no_seat: "抗命的一方试图另立派系，却未能争得自立的席位"
 lam_cr_split_title: "反对派分道扬镳"
 lam_cr_split_desc: "几经冲突之后，[lam_cr_split_head.GetShortUIName]另立了一个派系。投过同样的反对票，并不意味着就必须一同离开。你得决定留在哪一边。"
 lam_cr_split_follow: "我要加入新派系。"
 lam_cr_split_stay: "我留下。"
 lam_cr_withdraw_interaction: "提议撤回宫廷党的支持"
 lam_cr_withdraw_interaction_desc: "在派系会议上决定是否收回对君主的正式支持。"
 lam_cr_ballot_interaction: "在进行中的派系会议上投票"
 lam_cr_ballot_interaction_desc: "重新打开尚未作答的表决。会议期限不会延长。"
 lam_cr_issue_court: "\n#high 议题：是否接受成为宫廷党的提议#!\n若通过，本派系将成为正式支持君主的派系。只要这层支持关系不变，便不再重新表决。"
 lam_cr_issue_heir: "\n#high 议题：是否更换所支持的王位候选人#!\n若通过，派系将改为支持所提名的候选人[lam_vt_new.GetShortUIName]。"
 lam_cr_issue_crown: "\n#high 议题：是否继续支持原候选人，与新君主对抗#!\n若通过，则维持反对路线。若被否决，则撤回对原候选人的支持，对新君主静观其变。"
 lam_cr_issue_rise: "[lam_cr_head.Custom('LamPbCouncilText')]"
 lam_cr_issue_deal: "\n#high 议题：是否接受与君主的妥协方案#!\n只有在通过之后，所提出的补偿与派系的义务才会履行。若被否决，则不付出任何代价，维持原有立场。"
 lam_cr_issue_merge: "\n#high 议题：是否与其他派系合并#!\n若通过，将解散现有组织，并入对方派系。若被否决，则仍作为独立派系存续。\n合并对象：[lam_vt_new.GetShortUIName]的派系。投赞成票者随之转入，投反对票或弃权者将成为无派系者。"
 lam_cr_issue_confidence: "\n#high 议题：是否更换现任首领#!\n赞成即更换首领，反对即保留现任首领。现任首领不参与针对自己的表决。\n新首领候选人：[lam_vt_new.GetShortUIName]。"
 lam_cr_issue_ban: "\n#high 议题：是否抗拒禁令、保住派系#!\n若通过，派系将转入地下，维持组织。若被否决，则遵照禁令解散。"
 lam_cr_issue_dissolve: "\n#high 议题：是否遵照禁令解散派系#!\n须三分之二以上同意方可解散组织。若被否决，派系将在地下延续命脉。"
 lam_cr_issue_withdraw: "\n#high 议题：是否撤回宫廷党的支持#!\n若通过，派系将放弃正式支持君主的地位，5年内不会再成为宫廷党。"
 lam_cr_issue_loyal: "\n#high 议题：是否转向支持君主的路线#!"
 lam_cr_issue_oppose: "\n#high 议题：是否转向反对君主的路线#!"
 lam_cr_issue_arm: "\n#high 议题：是否准备施加军事压力#!\n这只是对准备路线的表决。真正举兵还须另行进行重大表决。"
 lam_cr_issue_watch: "\n#high 议题：是否与君主保持距离，静观其变#!"
 lam_cr_issue_quiet: "\n#high 议题：是否克制公开行动#!"
 lam_cr_issue_people: "\n#high 议题：是否撤销首领定下的路线，转而遵从成员的意愿#!"
 lam_cr_term_give_seat: "\n君主付出：承诺内阁席位"
 lam_cr_term_give_marriage: "\n君主付出：承诺联姻"
 lam_cr_term_give_county: "\n君主付出：让出伯爵领"
 lam_cr_term_give_gold: "\n君主付出：向派系拨付资金"
 lam_cr_term_give_bribe: "\n君主付出：向首领行贿"
 lam_cr_term_give_law: "\n君主付出：放宽统治权限"
 lam_cr_term_give_heir: "\n君主付出：指定派系的候选人为继承人"
 lam_cr_term_give_amnesty: "\n君主付出：赦免派系"
 lam_cr_term_ask_oath: "\n派系的义务：效忠誓约"
 lam_cr_term_ask_heir: "\n派系的义务：支持君主的继承人"
 lam_cr_term_ask_disband: "\n派系的义务：解散派系"
 lam_cr_term_ask_counter: "\n派系的义务：遏制竞争派系"
 lam_cr_term_ask_arms: "\n派系的义务：军事协作"
 lam_cr_term_ask_law_support: "\n派系的义务：支持修改法律"
 lam_cr_term_ult_oath: "\n君主付出：支付金钱。派系的义务：立誓今后5年内不举兵。"
