 lam_rv_stall_joined: "你已在另一项要求上署了名。要等那件事了结，才能提出新的要求。"
 lam_rv_stall_retry: "近一年内已经提出过要求。若要再提，还得再等些时日。"
 lam_rv_stall_nolaw: "眼下没有可以提出的要求：削减君主权力与独立的条件都不满足（君权、领主的地位、与领主的停战协议或同盟等）。"
 lam_rv_stall_other: "眼下无法提出要求（正在交战、另有交涉悬而未决，或目标已经改变）。"
 lam_rv_proxy_title: "改由派系中的另一人来主导这项要求"
