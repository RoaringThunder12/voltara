l_simp_chinese:
 lam_rv.0001.t: "最后通牒"
 lam_rv.0001.desc: "志同道合之人已尽数到齐。如今，是时候向[lam_rv_lord.GetTitledFirstName]提出我们的要求了。\n\n若领主应允，要求便得以实现；若是拒绝，便是战争。届时，所有在这份要求上署名的人都将并肩作战。"
 lam_rv.0001.send: "发出最后通牒"
 lam_rv.0001.wait: "时机未到"
 lam_rv.0001.wait_tt: "可以先召集更多人，之后再在决议菜单中用#high 发出最后通牒#!送出。"
 lam_rv_send_tt: "向领主提出我们的要求。若遭拒绝，所有在这份要求上署名的人将一同开战。"
 lam_rv_ultimatum_decision: "发出最后通牒"
 lam_rv_ultimatum_decision_desc: "以我们召集起来的联盟之名，向领主提出要求。若领主不接受，便是战争。"
 lam_rv_ultimatum_decision_tooltip: "向领主发出最后通牒"
 lam_rv_ultimatum_decision_confirm: "发出"
 lam_rv_stall_title: "起事表决已通过，却未能提出要求"
