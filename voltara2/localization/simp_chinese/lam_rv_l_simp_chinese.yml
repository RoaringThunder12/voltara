 lam_rv_cv_rise_text: "#high 议题：[ROOT.Char.Custom('LamPbCouncilDemand')]#!\n若获通过，将以投赞成票的人为核心召集支持。投赞成，即承诺在要求遭拒时参战。反对和弃权不视为同意参战。若对象或条件发生变化，便中止执行。[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_legacy: "#high 议题：是否起兵反抗君主#!\n若获通过，将按照本政体的方式推动起兵。[ROOT.Char.Custom('LamCvRiseClaimant')]"
