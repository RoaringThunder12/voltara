 lam_pd_kind_none: "已终止的要求"
 lam_pd_petition_title: "获得授权的请愿"
 lam_pd_petition_desc: "[lam_pd_head.GetTitledFirstName]的派系要求：[lam_pd_head.Custom('LamPdRequest')]。\n\n金钱条件：[lam_pd_head.MakeScope.Var('lam_pd_gold').GetValue|0]金钱。若提出金钱替代方案，派系将重新表决。若对象或费用条件发生变化，则无法执行。答复期限为60天。"
 lam_pd_accept: "我会满足这一要求。"
 lam_pd_counter: "我会改为提出金钱补偿。"
 lam_pd_defer: "一个月后再议吧。"
 lam_pd_refuse: "这一要求无法接受。"
 lam_pd_submit_desc: "重大要求须先取得派系的授权。即便获得通过，仍需君主同意并实际执行。金钱援助则在首领的授权范围内请愿。"
 lam_pd_ballot_desc: "请愿议题：[lam_cr_head.Custom('LamPdRequest')]。通过即授权转达此要求。是否真正兑现，取决于君主的答复和当前的条件。"
 lam_pd_result_title: "请愿的结局"
 lam_pd_result_desc: "[lam_pd_head.GetTitledFirstName]的请愿：[lam_pd_head.Custom('LamPdResult')]。"
 lam_pd_kept: "已兑现"
 lam_pd_refused: "已拒绝"
 lam_pd_void: "因条件变化或期限届满而终止"
 lam_pd_old_request: "那份请愿已错过时机。派系日后会再次齐心请求。"
 lam_pd_recruit_title: "要成为新的同伴吗"
 lam_pd_recruit_desc: "[lam_rc_head.GetTitledFirstName]提出以[ROOT.Char.MakeScope.Var('lam_pd_recruit_price').GetValue|0]金钱作为你加入的代价。若接受，这笔钱将实际支付，你的归属也随之改变。你还得承受与原有同伴关系的后果。若自接触起100天内未作答复，即以拒绝告终。"
 lam_pd_recruit_join: "接受条件，加入对方。"
 lam_pd_recruit_decline: "我会坚守现在的道路。"
 lam_pd_retain_title: "挽留同伴的代价"
 lam_pd_retain_desc: "[lam_pd_recruit_person.GetTitledFirstName]收到了其他派系的邀约。若实际支付[lam_pd_recruit_person.MakeScope.Var('lam_pd_recruit_price').GetValue|0]金钱，便可将眼下的合作维系一年。仅在该邀约仍在进行时有效。"
 lam_pd_retain_pay: "支付资助，挽留此人。"
 lam_pd_retain_leave: "让其自己决定吧。"
 lam_pd_recruit_success: "谈妥条件的新同伴"
 lam_pd_pact_title: "目标明确的联盟"
 lam_pd_pact_desc: "仅在共同支持继承人选、分配官职、降低君权、共同抵御镇压之中双方共同追求的目标上合作。协约有效期为两年，或直至目标达成。人事、继承与法律方面的协约不提供起事兵力。"
 lam_pd_pact_possible_tt: "双方都需要有空余的联盟名额，以及共同追求的具体目标"
 lam_pd_information_tt: "需要掌握君主不知道的真实秘密，或你亲自参与的秘密重大会议的新情报"
 lam_pd_information_title: "有凭有据的内部报告"
 lam_pd_information_desc: "告密者所知的秘密，或仍在推行的内部方针，已被传达过来。仅凭报告并不会产生牵制或惩处的权利。同一次会议不会再次给予奖赏。"
 lam_pd_fabricate_interaction: "捏造政治谣言"
 lam_pd_fabricate_interaction_desc: "花费100威望，用三个月编造谣言。你的谋略须比对象高出至少6点，才能躲过查验。即便成功，也只会留下六个月的猜疑，不会成为罪证或牵制。一旦败露，将失去150威望和信任。"
 lam_pd_rumor_title: "尚未证实的谣言"
 lam_pd_rumor_desc: "关于这个派系的谣言四起，但并无确凿证据。交涉可能暂时变得困难，但不能以此作为惩处的依据。"
 lam_pd_forgery_exposed: "捏造败露"
 lam_pd_false_report_opinion: "虚假报告败露"
 lam_pd_wait: "暂且静观局势吧。"
 lam_pd_obstruct_title: "反对者聚集起来，抵制进行中的请愿"
 lam_pd_story_contact: "先打听一下条件吧。"
 lam_pd_story_contact_desc: "出现了与新派系接触的机会。先摸清实际的资助条件以及原属派系的反应，再决定是否加入。"
 lam_pd_story_gold: "正式请愿索要资助吧。"
 lam_pd_public_information: "仅凭公开商议合作，不能以此问罪。"
