 lam_st_chronicle_title: "足迹"
 lam_st_chronicle_empty: "#weak 未留下任何记载。#!"
 lam_st.0100.t: "同一旗帜下的不和"
 lam_st.0100.desc: "[ROOT.Char.MakeScope.Var('lam_st_reconcile_member').Char.GetTitledFirstName]一再表示反对。虽然尚未与我们决裂，但每次会议散后，仍毫不掩饰心中的不满。\n\n若能公开表彰其一直以来的功劳，舍下一点颜面，或许还有修补关系的余地。"
 lam_st.0100.a: "你的功劳，我从未忘记。"
 lam_st.0100.a.tt: "花费150威望表彰其功劳。与此人的不和会有所缓和，其在派系中的功绩也会提升。已作出的决定维持不变。"
 lam_st.0100.b: "决定已经作出。"
 lam_st_public_turn: "朝堂新动向"
 lam_st_public_rise: "[lam_cr_head.GetTitledFirstName]的派系已决议起事反抗君主。"
 lam_st_public_loyal: "[lam_cr_head.GetTitledFirstName]的派系已同心决定支持王室。"
 lam_st_public_withdraw: "[lam_cr_head.GetTitledFirstName]的派系已决议退出宫廷党。"
 lam_st_public_dissolve: "[lam_cr_head.GetTitledFirstName]的派系已决议解散。"
 lam_st_vote_passed: "[lam_cr_head.GetTitledFirstName]的派系会议通过了议题。\n赞成 [TopScope.GetValue('lam_cr_result_yes')|0] · 反对 [TopScope.GetValue('lam_cr_result_no')|0] · 总计 [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_rejected: "[lam_cr_head.GetTitledFirstName]的派系会议否决了议题。\n赞成 [TopScope.GetValue('lam_cr_result_yes')|0] · 反对 [TopScope.GetValue('lam_cr_result_no')|0] · 总计 [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_cancelled: "[lam_cr_head.GetTitledFirstName]的派系会议因局势有变而取消。\n赞成 [TopScope.GetValue('lam_cr_result_yes')|0] · 反对 [TopScope.GetValue('lam_cr_result_no')|0] · 总计 [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_lf.0100.a.tt: "2年内优先举荐其担任官职，分裂危机推迟6个月。若真能任命成功，妥协即告达成；若明明可以任命却逾期未果，不和将会加深。这并不保证君主一定会任命。"
 lam_lf.0100.a: "下一个官职，我会为你请愿。"
 lam_lf.0100.b.tt: "花费150威望。反对派成员的不和缓和一级，凝聚力提高5。已作出的决定不会改变。"
 lam_lf.0100.b: "我会公开嘉奖同伴们的功劳。"
 lam_lf.0100.c: "我无意让步。"
 lam_lf.0100.desc: "心怀不满的同伴们聚集在[ROOT.Char.MakeScope.Var('lam_lf_caucus_rep').Char.GetTitledFirstName]身边。这不是一场口角就能了结的事。围绕同一议题的反对接连不断，如今他们已开始一同行动。\n\n是承认他们应得的份额，还是守住我的权威？"
 lam_lf.0100.t: "反对之声汇聚为一"
 lam_lf.0300.a: "我支持[lam_lf_succ_a.GetTitledFirstName]。"
 lam_lf.0300.b: "我支持[lam_lf_succ_b.GetTitledFirstName]。"
 lam_lf.0300.c: "我暂且不站在任何一边。"
 lam_lf.0300.desc: "说起首领退位之后的事，同伴们口中总会出现两个名字：[lam_lf_succ_a.GetTitledFirstName]与[lam_lf_succ_b.GetTitledFirstName]。\n\n眼下还不到交出领导权的时候，但此刻的支持，或许就能决定那一天的走向。"
 lam_lf.0300.t: "此旗的下一位主人"
 lam_lf.0300.tt: "若3年内发生领导权交接，且此人仍是最终候选人，你在派系中的影响力将计入对其的支持。若此人因死亡、离开等原因失去资格，则支持失效。"
