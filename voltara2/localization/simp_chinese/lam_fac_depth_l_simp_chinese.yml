 lam_lf_contested_opinion: "争夺派系领导权"
 lam_lf_exchange_interaction: "交涉：继承支持换取官职"
 lam_lf_exchange_interaction_desc: "对方派系协助确立你所支持的继承人；作为交换，你承诺在继承人确立后2年内，为对方首领请愿官职。若双方地位与资格未变而违背承诺，将留下不信任。"
 lam_lf_exchange_notice: "已订立以继承支持换取官职举荐的盟约。继承人须在3年内确立，此后所承诺人选的任命须在2年内完成。此盟约不包含战时出兵。"
 lam_lf_kind_land: "将[Character.MakeScope.Var('lam_lf_land_title').Title.GetName]授予[Character.MakeScope.Var('lam_lf_beneficiary').Char.GetTitledFirstName]"
 lam_lf_land_petition_interaction: "以派系功劳请愿封地"
 lam_lf_land_petition_interaction_desc: "根据派系内的功绩与以往所获赏赐选定受益人，并请愿君主授予一块其可授予的伯爵领。人选与封地将在派系会议上确认；即便表决通过，仍需君主同意。"
 lam_lf_memory_arrest: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName]——仍记得[Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName]遭其囚禁之事"
 lam_lf_memory_betrayal: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName]——仍记得其背弃对[Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName]的承诺"
 lam_lf_memory_dismissal: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName]——仍记得[Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName]因其失势"
 lam_lf_memory_revocation: "[Character.MakeScope.Var('lam_lf_mem1_actor').Char.GetTitledFirstName]——仍记得从[Character.MakeScope.Var('lam_lf_mem1_victim').Char.GetTitledFirstName]手中夺走的封地"
 lam_lf_news_exchange_broken: "[lam_lf_news_head.GetTitledFirstName]的派系在获得继承支持后，未能兑现所承诺的官职举荐。两派之间留下了不信任。"
 lam_lf_news_government_falters: "[lam_lf_news_head.GetTitledFirstName]的宫廷党正因执政期间的衰败而遭到追责。"
 lam_lf_news_government_prospers: "[lam_lf_news_head.GetTitledFirstName]的宫廷党因执政期间的复苏与成绩而赢得信任。"
 lam_lf_news_title: "朝中留下的名声"
 lam_lf_public_bad: "正因执政期间的失政而遭追究"
 lam_lf_public_caucus: "内部反对派正围绕[Character.MakeScope.Var('lam_lf_caucus_rep').Char.GetTitledFirstName]聚集"
 lam_lf_public_exchange: "已就继承支持与官职缔结盟约"
 lam_lf_public_good: "因执政期间的成绩而赢得信任"
 lam_ux_ballot_confidence: "不信任案：加上派系贡献的一半。"
 lam_ux_ballot_court: "加入或退出宫廷党：加上宫廷地位的一半。"
 lam_ux_ballot_detail: "\n\n#high 进行中会议的话语权：[Character.MakeScope.Var('lam_cr_weight').GetValue|1]#!\n开会时的影响力 [Character.MakeScope.Var('lam_ux_ballot_base').GetValue|1] + 议题加权 [Character.MakeScope.Var('lam_ux_ballot_bonus').GetValue|1]\n[Character.Custom('LamUxBallotReason')]\n#weak 此值在开会时即已确定。此后能力或职位的变化不会改变这一票的分量。这与赞成或反对的倾向无关。#!"
 lam_ux_ballot_heir: "继承与王位：加上身份与名望的一半。"
 lam_ux_ballot_idle: "\n\n军力、宫廷地位、名望与贡献所占的比重因议题而异。在你所属派系的会议中，还可以查看开会时已确定的话语权。"
 lam_ux_ballot_legacy: "\n\n本次会议的话语权：[Character.MakeScope.Var('lam_cr_weight').GetValue|1]\n#weak 此值在开会时即已确定。本次会议没有留下分项记录。#!"
 lam_ux_ballot_normal: "此议题直接沿用开会时的综合影响力。"
