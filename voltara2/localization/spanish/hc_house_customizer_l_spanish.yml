l_spanish:
 hc_house_customizer:0 "Personalizador de casa"
 hc_house_customizer_desc:0 "Este personaje puede reclamar un lugar entre los linajes establecidos del mundo."
 trait_hc_house_customizer:0 "Personalizador de casa"
 trait_hc_house_customizer_desc:0 "Este personaje puede reclamar un lugar entre los linajes establecidos del mundo."
 trait_hc_house_customizer_character_desc:0 "Este personaje puede reclamar un lugar entre los linajes establecidos del mundo."

 hc_open_house_customizer_interaction:0 "Reclamar linaje"
 hc_open_house_customizer_interaction_desc:0 "Escoge cómo será recordado tu vínculo con la casa de [recipient.GetShortUINameNoTooltip]."

 hc_house_customizer.0001.t:0 "La sangre y el nombre"
 hc_house_customizer.0001.desc:0 "Los escribas conocen muchas verdades, y más de una ha sido corregida con tinta paciente. Ante ti se abre el camino hacia la Casa [hc_target.GetHouse.GetName], ya sea por reconocimiento, por sangre compartida o por una rama largo tiempo olvidada."

 hc_house_customizer.0001.become_child:0 "Que se me reconozca como su descendencia."
 hc_house_customizer.0001.become_sibling:0 "Que se me cuente entre sus hermanos."
 hc_house_customizer.0001.open_bastard_options:0 "Examinar un origen fuera del matrimonio."
 hc_house_customizer.0001.open_bastard_options_tt:0 "Considerarás distintas formas de ser reconocido/a como descendencia nacida fuera de un lecho legítimo."
 hc_house_customizer.0001.become_distant_relative:0 "Que se me reconozca como pariente de una rama lejana."
 hc_house_customizer.0001.cancel:0 "No alteraré mi linaje."

 hc_house_customizer.0002.t:0 "Sangre fuera del matrimonio"
 hc_house_customizer.0002.desc:0 "No toda sangre noble nace bajo votos solemnes ni ante testigos complacidos. Algunas verdades viven en márgenes de crónicas, cartas selladas y confesiones que pocos se atreven a pronunciar."
 hc_house_customizer.0002.back:0 "Volver a considerar mi linaje."
 hc_house_customizer.0002.cancel:0 "Dejaré esta verdad enterrada."

 hc_house_customizer.0001.become_bastard:0 "Que se me reconozca como bastardo/a."
 hc_house_customizer.0001.become_legitimized_bastard:0 "Que se me legitime pese a mi nacimiento."

 hc_house_customizer.tt.become_child:0 "Serás inscrito/a como descendencia de [hc_target.GetShortUIName]."
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName] será registrado/a como tu otro progenitor."
 hc_house_customizer.tt.become_sibling:0 "Serás reconocido/a como hermano/a de [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_father:0 "Compartirás padre con [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_mother:0 "Compartirás madre con [hc_target.GetShortUIName]."
 hc_house_customizer.tt.become_distant_relative:0 "Tu nombre será unido a la Casa [hc_target.GetHouse.GetName] como una rama lejana de su sangre."
 hc_house_customizer.tt.become_bastard:0 "Serás reconocido/a como descendencia bastarda de [hc_target.GetShortUIName]. Se generará y registrará un progenitor adicional."
 hc_house_customizer.tt.become_legitimized_bastard:0 "Serás reconocido/a como descendencia bastarda legitimada de [hc_target.GetShortUIName]. Se generará y registrará un progenitor adicional."
 hc_house_customizer.tt.gain_bastard:0 "Obtendrás el rasgo Bastardo/a."
 hc_house_customizer.tt.gain_legitimized_bastard:0 "Obtendrás el rasgo Bastardo/a legitimado/a."
 hc_house_customizer.tt.lose_house_customizer:0 "Perderás el rasgo Personalizador de casa."

 hc_house_customizer.0200.t:0 "El sello de la sangre"
 hc_house_customizer.0200.desc:0 "El nombre de una casa no vive solo en pergaminos y sellos. También se insinúa en los ojos, en el cabello, en el porte y en esos rasgos que los viejos sirvientes juran haber visto antes en retratos desvaídos. Puedes permitir que tu semblante sea recordado como propio de la Casa [hc_target.GetHouse.GetName], o conservar intacta la apariencia con la que llegaste a este día."
 hc_house_customizer.0200.adopt:0 "Que mi sangre lleve también su semblante."
 hc_house_customizer.0200.adopt_tt:0 "Copiarás la apariencia heredable de [hc_target.GetShortUIName]. Esto puede alterar rasgos como cabello, ojos, piel y otros rasgos hereditarios."
 hc_house_customizer.0200.keep:0 "Mi rostro seguirá siendo mío."

 hc_house_customizer.ok:0 "Así quedará escrito."

 hc_house_customizer.0101.t:0 "Descendencia reconocida"
 hc_house_customizer.0101.desc:0 "Los registros han sido corregidos, los testigos instruidos y las palabras necesarias pronunciadas. Desde este día, eres reconocido/a como descendencia de [hc_target.GetShortUIName] y miembro de la Casa [hc_target.GetHouse.GetName]."

 hc_house_customizer.0102.t:0 "Hermandad reconocida"
 hc_house_customizer.0102.desc:0 "La sangre se ordena de nuevo en las crónicas familiares. Desde este día, eres contado/a entre los hermanos de [hc_target.GetShortUIName] y miembro de la Casa [hc_target.GetHouse.GetName]."

 hc_house_customizer.0103.t:0 "Bastardía reconocida"
 hc_house_customizer.0103.desc:0 "El linaje no siempre nace bajo techo legítimo, pero una verdad dicha ante suficientes oídos acaba tomando forma de ley. Eres reconocido/a como descendencia bastarda de [hc_target.GetShortUIName], con un progenitor adicional registrado para completar tu origen."

 hc_house_customizer.0104.t:0 "Sangre legitimada"
 hc_house_customizer.0104.desc:0 "Lo que nació fuera del orden ha sido llevado al corazón de la casa. Eres reconocido/a como descendencia legitimada de [hc_target.GetShortUIName], con un progenitor adicional registrado para completar tu origen."

 hc_house_customizer.0106.t:0 "Una rama recuperada"
 hc_house_customizer.0106.desc:0 "Toda gran casa tiene ramas que se pierden en guerras, matrimonios lejanos y viejas disputas. Hoy, una de esas ramas vuelve a ser reconocida. Perteneces a la Casa [hc_target.GetHouse.GetName]."

 hc_house_customizer.0300.t:0 "Derechos de sangre"
 hc_house_customizer.0301.desc:0 "Si vas a ser reconocido/a como descendencia de [hc_target.GetShortUIName], la cuestión de la herencia no puede quedar intacta. Los escribas también pueden registrar tus derechos sobre los títulos que posee tu nuevo progenitor."
 hc_house_customizer.0302.desc:0 "Como hermano/a recién reconocido/a de [hc_target.GetShortUIName], puedes pedir que los registros familiares conserven también tus derechos menores sobre las tierras de tu casa."
 hc_house_customizer.0304.desc:0 "La legitimación trae consigo algo más que un nombre. Si tu nacimiento queda aceptado dentro de la casa, también puedes solicitar derechos sobre las tierras de [hc_target.GetShortUIName]."
 hc_house_customizer.0306.desc:0 "Una rama lejana rara vez hereda antes que la sangre cercana, pero el linaje antiguo aún puede justificar una reclamación. Puedes pedir que se registren derechos menores en tu nombre."
 hc_house_customizer.0300.claim_pressed:0 "Registrar mis derechos sucesorios directos."
 hc_house_customizer.0300.claim_unpressed:0 "Registrar mis derechos dinásticos."
 hc_house_customizer.0300.no_claims:0 "El nombre es suficiente."
 hc_house_customizer.0300.claim_pressed_tt:0 "Obtendrás derechos fuertes sobre los títulos que posee actualmente [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_unpressed_tt:0 "Obtendrás derechos débiles sobre los títulos que posee actualmente [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_distant_tt:0 "Obtendrás derechos débiles sobre los títulos que posee actualmente [hc_target.GetShortUIName]. Esto representa una reclamación más débil de rama lejana."

 hc_open_house_customizer_decision:0 "Usar House Customizer"
 hc_open_house_customizer_decision_desc:0 "Abre el menú de House Customizer y elige cómo debe definirse el linaje noble de tu gobernante personalizado."
 hc_open_house_customizer_decision_tooltip:0 "Abrir el menú de House Customizer."
 hc_house_customizer_menu.0001.t:0 "House Customizer"
 hc_house_customizer_menu.0001.desc:0 "La sangre de una casa puede escribirse en registros, susurrarse entre sirvientes o revivir desde una rama olvidada. Elige cómo debe tomar forma tu linaje."
 hc_house_customizer_menu.0001.existing_house:0 "Unirme a una casa viva."
 hc_house_customizer_menu.0001.existing_house_tt:0 "Para unirte a una casa viva, haz clic derecho sobre un personaje noble vivo y usa la interacción de House Customizer."
 hc_house_customizer_menu.0001.extinct_house:0 "Revivir una casa extinta."
 hc_house_customizer_menu.0001.extinct_house_tt:0 "Las casas extintas se gestionarán mediante módulos opcionales de House Customizer. El mod principal no incluye casas extintas concretas para mantener la compatibilidad con vanilla y total conversions."
 hc_house_customizer_menu.0001.cancel:0 "Lo decidiré más tarde."
 hc_house_customizer_menu.0002.t:0 "Casas extintas"
 hc_house_customizer_menu.0002.desc:0 "La versión principal de House Customizer no incluye una lista fija de casas extintas. Esto mantiene el mod compatible con vanilla, AGOT, LOTR, Elder Kings y otras total conversions. Las casas extintas deben añadirse mediante módulos opcionales hechos para cada ambientación."
 hc_house_customizer_menu.0002.ok:0 "Entendido."
