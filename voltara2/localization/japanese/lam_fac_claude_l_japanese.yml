l_japanese:
 lam_pb_join_consequence_tt: "If the demand comes together, you join the noble faction behind [lam_pb_host.GetFirstNameNoTooltip]. If your liege refuses, you go to war against them on that side. If too few join, nothing happens."
 activity_lam_faction_gathering_name: "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Faction Gathering"
 activity_lam_faction_gathering_owner: "Head"
 activity_lam_faction_gathering_predicted_cost: "The cost of a [GetActivityType( 'activity_lam_faction_gathering' ).GetNameNoTooltip] depends mostly on the [activity_options|E] you select."
 TRAVEL_NAME_FOR_activity_lam_faction_gathering: "[Character.GetFirstNamePossessiveNoTooltip] journey to the Faction Gathering"
 lam_secret_outlaw_faction_tooltip_desc: "This character leads a banned faction or remains at its core."
 lam_secret_outlaw_faction_type_desc: "$lam_secret_outlaw_faction_tooltip_desc$"
 lam_secret_bribed_tooltip_desc: "This faction head pocketed the liege's money instead of sharing it with the faction."
 lam_secret_bribed_type_desc: "$lam_secret_bribed_tooltip_desc$"
 lam_secret_informer_tooltip_desc: "This character passed their faction's secrets to the liege."
 lam_secret_informer_type_desc: "$lam_secret_informer_tooltip_desc$"
 lam_secret_rebel_tooltip_desc: "This character joined a faction rising against the liege, and lost."
 lam_secret_rebel_type_desc: "$lam_secret_rebel_tooltip_desc$"
 lam_secret_cp_treason_tooltip_desc: "This court party head is waiting for the day to turn their blade on the liege."
 lam_secret_cp_treason_type_desc: "$lam_secret_cp_treason_tooltip_desc$"
 lam_cr_req_issue_court: "\nAgenda: Accept the court-party offer. Support persists without routine renewal votes."
 lam_cr_req_issue_heir: "\nAgenda: Select [lam_vt_new.GetShortUIName] as the supported claimant."
 lam_cr_req_issue_crown: "\nAgenda: Continue supporting the former claimant against the new ruler. Rejection ends that support."
 lam_cr_req_issue_rise: "[lam_cr_head.Custom('LamPbCouncilText')]"
 lam_cr_req_issue_deal: "\nAgenda: Accept the proposed bargain. Rewards and obligations are enacted only after approval."
 lam_cr_req_issue_merge: "\nAgenda: Merge into the proposed faction. Rejection preserves our independent organization.\nTarget: [lam_vt_new.GetShortUIName]’s faction. Vote yes and you go with it; vote no or abstain and you stay unaligned."
 lam_cr_req_issue_confidence: "\nAgenda: Replace the head. Yes means replacement; no retains the incumbent. The incumbent has no vote.\nProposed replacement: [lam_vt_new.GetShortUIName]."
 lam_cr_req_issue_ban: "\nAgenda: Defy the ban and go underground. Rejection accepts dissolution."
 lam_cr_req_issue_dissolve: "\nAgenda: Dissolve under the ban. Requires two thirds; rejection keeps the faction underground."
 lam_cr_req_issue_withdraw: "\nAgenda: Withdraw court-party support, with a five-year bar on reappointment."
 lam_cr_req_issue_loyal: "\nAgenda: Adopt a loyal course."
 lam_cr_req_issue_oppose: "\nAgenda: Adopt an opposition course."
 lam_cr_req_issue_arm: "\nAgenda: Prepare military pressure. An actual rising requires a separate supermajority."
 lam_cr_req_issue_watch: "\nAgenda: Watch the ruler without committing."
 lam_cr_req_issue_quiet: "\nAgenda: Restrain public action."
 lam_cr_req_issue_people: "\nAgenda: End the head's imposed posture and follow the members' inclinations."
 lam_cr_req_issue_stance: "\n#high Agenda: change our side on a court issue#!"
