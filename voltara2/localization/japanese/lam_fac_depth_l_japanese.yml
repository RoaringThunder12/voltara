 lam_st_chronicle_empty: "#weak Nothing written yet.#!"
 lam_st.0100.t: "Discord beneath one banner"
 lam_st.0100.desc: "[ROOT.Char.MakeScope.Var('lam_st_reconcile_member').Char.GetTitledFirstName] has repeatedly opposed our course. We still share a banner, but the discontent lingers after each meeting.\n\nPublicly recognising past service may mend the relationship, at some expense to my own standing."
 lam_st.0100.a: "Your service has not been forgotten."
 lam_st.0100.a.tt: "Spend 150 prestige to recognise their service, easing their discontent and increasing their standing within the faction. The existing decision stands."
 lam_st.0100.b: "The decision has been made."
 lam_st_public_turn: "A turn in court politics"
 lam_st_public_rise: "The faction of [lam_cr_head.GetTitledFirstName] has resolved to rise against the ruler."
 lam_st_public_loyal: "The faction of [lam_cr_head.GetTitledFirstName] has agreed to support the crown."
 lam_st_public_withdraw: "The faction of [lam_cr_head.GetTitledFirstName] has resolved to withdraw from the court party."
 lam_st_public_dissolve: "The faction of [lam_cr_head.GetTitledFirstName] has resolved to disband."
 lam_st_vote_passed: "The council of [lam_cr_head.GetTitledFirstName]: The motion passed.\nFor [TopScope.GetValue('lam_cr_result_yes')|0] · Against [TopScope.GetValue('lam_cr_result_no')|0] · Total [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_rejected: "The council of [lam_cr_head.GetTitledFirstName]: The motion was rejected.\nFor [TopScope.GetValue('lam_cr_result_yes')|0] · Against [TopScope.GetValue('lam_cr_result_no')|0] · Total [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_st_vote_cancelled: "The council of [lam_cr_head.GetTitledFirstName]: The council was cancelled as circumstances changed.\nFor [TopScope.GetValue('lam_cr_result_yes')|0] · Against [TopScope.GetValue('lam_cr_result_no')|0] · Total [TopScope.GetValue('lam_cr_result_total')|0]"
 lam_lf.0100.a.tt: "Prioritise their nomination for two years and delay a split for six months. Appointment settles the dispute; expiry while an appointment remains feasible deepens it. The ruler still decides whether to appoint them."
 lam_lf.0100.a: "I shall press your claim to the next office."
 lam_lf.0100.b.tt: "Spend 150 prestige, ease each caucus member’s unrest by one and gain 5 cohesion. The existing decision stands."
 lam_lf.0100.b: "Their service deserves public recognition."
 lam_lf.0100.c: "I will make no concession."
 lam_lf.0100.desc: "Discontented companions have gathered around [ROOT.Char.MakeScope.Var('lam_lf_caucus_rep').Char.GetTitledFirstName]. Repeated disagreement over the same question has turned scattered objections into a common position.\n\nWill I make room for them or stand by my authority?"
 lam_lf.0100.t: "Opposition finds a voice"
 lam_lf.0300.a: "Support [lam_lf_succ_a.GetTitledFirstName]."
 lam_lf.0300.b: "Support [lam_lf_succ_b.GetTitledFirstName]."
 lam_lf.0300.c: "I shall keep my own counsel."
 lam_lf.0300.desc: "Two names come up whenever companions discuss the day our leader departs: [lam_lf_succ_a.GetTitledFirstName] and [lam_lf_succ_b.GetTitledFirstName].\n\nThat day has not yet come, but support declared now may decide its course."
 lam_lf.0300.t: "Who will carry the banner?"
 lam_lf.0300.tt: "For three years, your faction influence supports this candidate if leadership changes and they remain a finalist. Death, departure or loss of eligibility invalidates the endorsement."
 lam_lf_broken_word_opinion: "Broke a political promise"
