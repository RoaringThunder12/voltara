 lam_bp_origin_detail: "#high Origins of the branch#!\nIn [Character.MakeScope.Var('lam_bp_origin_year').GetValue|0], [Character.MakeScope.Var('lam_bp_origin_founder').Char.GetShortUIName] led a split from [Character.MakeScope.Var('lam_bp_origin_parent').Char.GetShortUINamePossessive] faction.\n[Character.Custom('LamBpOriginCause')]"
 lam_bp_origin_fair_land: "They opposed seeking land for [Character.MakeScope.Var('lam_bp_origin_target').Char.GetShortUIName] and split over the distribution of rewards."
 lam_bp_origin_fair_office: "They opposed seeking an office for [Character.MakeScope.Var('lam_bp_origin_target').Char.GetShortUIName] and demanded a share for overlooked companions."
 lam_bp_origin_heir: "They split over support for [Character.MakeScope.Var('lam_bp_origin_target').Char.GetShortUIName] as heir."
 lam_bp_origin_land: "They split in opposition to seeking land for [Character.MakeScope.Var('lam_bp_origin_target').Char.GetShortUIName]."
 lam_bp_origin_law: "They split over a petition concerning royal authority."
 lam_bp_origin_merge: "They broke away rather than accept a merger with another faction."
 lam_bp_origin_participate: "They opposed withdrawing from the court party and broke away."
 lam_bp_origin_pressure: "They split from their leader to press their demands against the liege."
 lam_bp_origin_restraint: "They broke away in opposition to the hard line against their ruler."
 lam_bp_origin_retain: "They rejected support for [Character.MakeScope.Var('lam_bp_origin_target').Char.GetShortUIName] and broke away to retain [Character.MakeScope.Var('lam_bp_origin_alternative').Char.GetShortUIName] as their candidate."
 lam_bp_split_desc: "[lam_cr_split_head.GetShortUIName] and their companions have broken with [lam_cr_original_head.GetShortUIName].\n\n[lam_cr_split_head.Custom('LamBpOriginCause')]\n\nWill I join them, or remain with those who stayed?"
 lam_bp_split_follow: "I will join those who broke away."
 lam_bp_split_stay: "I will remain with my companions."
 lam_bp_split_title: "A Parting of Ways"
 lam_bp_split_unaligned: "I will follow neither banner."
