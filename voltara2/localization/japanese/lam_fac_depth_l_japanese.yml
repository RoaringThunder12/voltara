 lam_pd_kind_council: "the office of [ROOT.Char.Custom('LamPdOffice')] for [ROOT.Char.MakeScope.Var('lam_lf_beneficiary').Char.GetTitledFirstName]"
 lam_pd_kind_taxes: "Tax relief"
 lam_pd_kind_release: "Release imprisoned members"
 lam_pd_kind_faith: "A council of our faith"
 lam_pd_kind_no_revoke: "Restraint in revocations"
 lam_pd_kind_campaign: "A recovery campaign"
 lam_pd_kind_none: "Closed request"
 lam_pd_petition_title: "A mandated petition"
 lam_pd_petition_desc: "[lam_pd_head.GetTitledFirstNamePossessive] faction requests: [lam_pd_head.Custom('LamPdRequest')].\n\nMonetary terms: [lam_pd_head.MakeScope.Var('lam_pd_gold').GetValue|0] gold. A monetary counteroffer needs a new faction vote. Changed targets or resources prevent execution. Reply within 60 days."
 lam_pd_accept: "Fulfil the request."
 lam_pd_counter: "Offer monetary compensation instead."
 lam_pd_defer: "Reconsider in a month."
 lam_pd_refuse: "Refuse the demand."
 lam_pd_submit_desc: "Major demands first need a faction mandate, then the ruler’s agreement and execution. Monetary aid falls within the leader’s delegation."
 lam_pd_ballot_desc: "Petition: [lam_cr_head.Custom('LamPdRequest')]. Approval authorizes the request; fulfilment depends on the ruler and current conditions."
 lam_pd_result_title: "The petition is settled"
 lam_pd_result_desc: "[lam_pd_head.GetTitledFirstNamePossessive] petition: [lam_pd_head.Custom('LamPdResult')]."
 lam_pd_kept: "Fulfilled"
 lam_pd_refused: "Refused"
 lam_pd_void: "Closed after changed circumstances or expiry"
 lam_pd_old_request: "The moment for that petition has passed. The faction will gather and ask again another time."
 lam_pd_recruit_title: "A new allegiance"
 lam_pd_recruit_desc: "[lam_rc_head.GetTitledFirstName] offers [ROOT.Char.MakeScope.Var('lam_pd_recruit_price').GetValue|0] gold for joining. Acceptance transfers both payment and allegiance. The offer expires 100 days after contact."
 lam_pd_recruit_join: "Accept payment and join."
 lam_pd_recruit_decline: "Decline."
 lam_pd_retain_title: "The price of loyalty"
 lam_pd_retain_desc: "[lam_pd_recruit_person.GetTitledFirstName] is being approached. Pay [lam_pd_recruit_person.MakeScope.Var('lam_pd_recruit_price').GetValue|0] gold to retain their cooperation for a year while the offer remains open."
 lam_pd_retain_pay: "Pay to retain their support."
 lam_pd_retain_leave: "Let them decide."
 lam_pd_recruit_success: "A recruit joins after negotiations"
 lam_pd_pact_title: "An agreement with a purpose"
 lam_pd_pact_desc: "Cooperation is limited to a shared heir, fair offices, lower crown authority or defense against repression. It ends after two years or when its purpose is achieved. Political agreements do not pledge forces to rebellions."
 lam_pd_pact_possible_tt: "Both leaders need an available pact slot and a concrete shared purpose"
 lam_pd_information_tt: "Requires a real secret unknown to the ruler, or fresh access to a private major council"
 lam_pd_information_title: "An evidenced report"
 lam_pd_information_desc: "The informer disclosed a known secret or an ongoing private policy. Reporting alone does not create hooks or punishment rights. The same council cannot be rewarded again."
 lam_pd_fabricate_interaction: "Fabricate a political rumor"
 lam_pd_fabricate_interaction_desc: "Spend 100 prestige over three months. Intrigue must exceed the target’s by at least 6 to evade scrutiny. Success creates six months of suspicion, never criminal evidence or a hook. Exposure costs 150 more prestige and trust."
 lam_pd_rumor_title: "An unverified rumor"
 lam_pd_rumor_desc: "Rumors surround this faction, but no evidence has been established. Negotiations may become harder temporarily; this grants no grounds for punishment."
 lam_pd_forgery_exposed: "A forgery is exposed"
 lam_pd_false_report_opinion: "Exposed false report"
 lam_pd_wait: "Wait and observe."
 lam_pd_obstruct_title: "Opposition gathers against a pending petition"
 lam_pd_story_contact: "Explore the terms."
 lam_pd_story_contact_desc: "There is an opportunity to approach another faction. Terms and the current leader’s response come before a decision."
 lam_pd_story_gold: "Submit a request for support."
 lam_pd_public_information: "Public cooperation is no proof of wrongdoing."
 lam_pd_promised: "Promise agreed — awaiting fulfilment"
 lam_pd_broken: "The promise expired unfulfilled"
 lam_pd_next_reply: "A petition awaits the ruler"
 lam_pd_next_mandate: "Seeking agreement within the faction"
 lam_pd_next_recruit: "Seeking new companions"
 lam_pd_next_obstruct: "Contesting a rival’s petition"
 lam_pd_next_pact: "Acting in concert with another faction"
 lam_pd_goal_blocked: "Reconsidering its course as circumstances change"
