l_english:
 trait_vca_gladiator:0 "Gladiator"
 trait_vca_gladiator_desc:0 "A fighter of the great arenas. Only victories in the pits advance this path; every lethal contest may be the last."
 trait_track_vca_gladiator:0 "Champion of the Sands"
 trait_track_vca_gladiator_desc:0 "Win arena fights to gain experience and formidable prowess."
 building_vca_grand_arena_01:0 "Grand Arena and Fighting Pits"
 building_vca_grand_arena_01_desc:0 "Vaulted galleries overlook the sand, while training yards, animal pens and fighting pits occupy the foundations. Slaveholders profit from coerced contests; abolitionist rulers may retain the arena for free exhibitions."
 building_type_vca_grand_arena_01:0 "Grand Arena"
 building_type_vca_grand_arena_01_desc:0 "Vaulted galleries overlook the sand, while training yards, animal pens and fighting pits occupy the foundations. Slaveholders profit from coerced contests; abolitionist rulers may retain the arena for free exhibitions."
 vca_arena_festival:0 "The Great Games"
 vca_trade_dividend:0 "Coastal Slave-Trade Dividends"
 vca_refuge:0 "Harbor of Refuge"
 vca_raided_coast:0 "Coast Struck by Slavers"
 vca_chains_situation:0 "The Chains Across the Strait"
 vca_coasts:0 "The Southern Slave Coast"
 vca_slavers:0 "Slaver Interests"
 vca_liberators:0 "Liberators"
 vca_contested:0 "Contested Harbors"
 vca_chains_ascendant:0 "The Chains Ascendant"
 vca_free_harbors:0 "The Free Harbors"
 vca_balance_explanation:0 "Slave expeditions, arena patronage and trading ventures strengthen the slavers. Sanctuary and liberation weaken them. Raiding also inflames Kartholos and supplies Southron resistance."
 vca_trade_readout:0 "Slaver Influence: [GetGlobalVariable('vca_balance').GetValue|0]/100"
 vca_freedom_readout:0 "Liberation pressure rises as slaver influence declines."
 vca_contested_desc:0 "Harbors remain divided. Slave charters and free-port patrols shift influence each year; convoys, rescue missions and local disputes can tip the balance."
 vca_chains_ascendant_desc:0 "Slaver influence is at least 70. Participating slavers receive +1 monthly income and +0.5 monthly prestige at the annual review. Successful convoys earn an extra 20 gold; resistance grows with each venture."
 vca_free_harbors_desc:0 "Slaver influence is at most 30. At the annual review, liberators gain +1 monthly income and +0.5 monthly prestige while slavers lose 1 monthly income. Convoys face stronger interception."
 vca.1.t:0 "Beneath the Galleries"
 vca.1.desc:0 "Trainers count their fighters, merchants purchase places in the galleries, and petitioners wait outside the gate. The arena can enrich its patron—or become a place where a fighter earns freedom."
 vca.1.0:0 "Stage a contest."
 vca.1.0_tt:0 "Select two eligible adult fighters from your court. Choose a lethal contest or a nonlethal exhibition."
 vca.1.1:0 "Maintain the training yards."
 vca.1.1_tt:0 "Spend 30 gold on trainers and facilities. Training alone grants no gladiator experience."
 vca.1.2:0 "Grant a champion their freedom."
 vca.1.2_tt:0 "Free one gladiator you own and weaken the slave trade."
 vca.1.3:0 "Leave the galleries."
 vca.1.3_tt:0 "Return to court."
 vca.10.t:0 "Two Fighters Enter"
 vca.10.desc:0 "The gates open. The fighters stand on opposite sides of the sand while the galleries wait for the patron’s signal."
 vca.10.0:0 "Only one will leave alive."
 vca.10.0_tt:0 "A native single-combat duel to the death. The winner gains 10 gladiator experience, 15 gold and 50 prestige. Your gate receipts are 25 gold."
 vca.10.1:0 "Blunted weapons; stop at submission."
 vca.10.1_tt:0 "A nonlethal single-combat exhibition. Only the winner gains gladiator experience. Gate receipts are 10 gold."
 vca.10.2:0 "Cancel the contest."
 vca.10.2_tt:0 "No fight and no reward."
 vca.20.t:0 "Cargoes Across the Strait"
 vca.20.desc:0 "The ships bind Alu’tor’s brokers, Severosi patrons, Halithor’s merchants and Kartholos’s toll collectors into one profitable trade. Behind the accounts lie captives taken from the southern coast. Chiefs gather supplies when raiders come; fugitives search for a harbor that will shelter them."
 vca.20.0:0 "Underwrite the traders."
 vca.20.0_tt:0 "Invest 75 gold in one convoy. It returns after 90 days with profits, a toll dispute, or a loss."
 vca.20.1:0 "Open a protected landing place."
 vca.20.1_tt:0 "Spend 60 gold on sanctuary. Weaken slaver influence and reduce frontier hostility."
 vca.20.2:0 "Keep our ships out of this."
 vca.20.2_tt:0 "No change."
 vca.30.t:0 "A Name on the Arena Roll"
 vca.30.desc:0 "Your camp lies within Alu’tor’s ancient borders. An arena master offers a place on the fighting rolls. The crowds reward victories, but neither their applause nor a champion’s reputation guarantees freedom."
 vca.30.0:0 "Enter my name."
 vca.30.0_tt:0 "Gain the Gladiator lifestyle trait. Victories—not enrollment or training—advance it."
 vca.30.1:0 "Not today."
 vca.30.1_tt:0 "Decline."
 vca.40.t:0 "Colossus Maximus"
 vca.40.desc:0 "Banners fill the galleries of Alu’tor’s grand arena. The games can celebrate a champion, display the power of a slaveholding patron, or offer a spectacle without killing a person."
 vca.40.0:0 "The champions shall decide the day."
 vca.40.0_tt:0 "Receive 150 gold in gate receipts, gain prestige over two years, and choose a lethal or nonlethal championship contest."
 vca.40.1:0 "Stage the beast exhibition."
 vca.40.1_tt:0 "Receive 100 gold in gate receipts and 200 prestige. Decide how the animal exhibition is handled."
 vca.40.2:0 "Celebrate free competitors and release a captive."
 vca.40.2_tt:0 "Gain 300 prestige, free one enslaved courtier you own, and reduce slaver influence by 5."
 vca.41.t:0 "The Beast Gate"
 vca.41.desc:0 "Handlers lead a captured beast toward the sand. A trainer warns that it has been injured in transit. The crowd cannot see the chains behind the gate."
 vca.41.0:0 "Let the handlers show their skill."
 vca.41.0_tt:0 "A controlled animal exhibition adds 75 prestige; no gladiator experience is awarded."
 vca.41.1:0 "Cancel the display and pay for its care."
 vca.41.1_tt:0 "Spend 25 gold and gain 100 piety."
 vca.41.2:0 "The beast must fight."
 vca.41.2_tt:0 "A gladiator faces a dangerous beast: a 75% chance of victory and experience, and a 25% chance of death."
 vca_view_pits:0 "View the Fighting Pits"
 vca_view_pits_desc:0 "Review fighters, stage a duel, maintain the training yards or free an enslaved champion."
 vca_view_pits_tooltip:0 "Review fighters, stage a duel, maintain the training yards or free an enslaved champion."
 vca_view_pits_confirm:0 "View the Fighting Pits"
 vca_join_pits:0 "Enter the Fighting Pits"
 vca_join_pits_desc:0 "An enslaved adventurer in Alu’tor may register as a gladiator. Wins grant experience and substantial prowess."
 vca_join_pits_tooltip:0 "An enslaved adventurer in Alu’tor may register as a gladiator. Wins grant experience and substantial prowess."
 vca_join_pits_confirm:0 "Enter the Fighting Pits"
 vca_colossus_maximus:0 "Host the Colossus Maximus"
 vca_colossus_maximus_desc:0 "Spend 250 gold to host the grand games: championship duels, animal exhibitions or a celebration of free competitors."
 vca_colossus_maximus_tooltip:0 "Spend 250 gold to host the grand games: championship duels, animal exhibitions or a celebration of free competitors."
 vca_colossus_maximus_confirm:0 "Host the Colossus Maximus"
 vca_finance_trade:0 "Finance a Slave-Trade Venture"
 vca_finance_trade_desc:0 "Invest 75 gold in a convoy that returns after 90 days. Profit, tolls, or interception depend on the voyage; Free Harbors make success less likely. Only one convoy may be pending."
 vca_finance_trade_tooltip:0 "Invest 75 gold in one convoy. Its outcome arrives after 90 days; profits are not guaranteed."
 vca_finance_trade_confirm:0 "Finance a Slave-Trade Venture"
 vca_shelter_fugitives:0 "Establish a Harbor of Refuge"
 vca_shelter_fugitives_desc:0 "Spend 60 gold to shelter fugitives and undermine the coastal slave trade."
 vca_shelter_fugitives_tooltip:0 "Spend 60 gold to shelter fugitives and undermine the coastal slave trade."
 vca_shelter_fugitives_confirm:0 "Establish a Harbor of Refuge"
 vca_challenge_gladiator:0 "Challenge to an Arena Death Duel"
 vca_challenge_gladiator_desc:0 "Fight another available gladiator in Alu’tor to the death. The winner gains 10 gladiator experience, gold and prestige. There is no cooldown between completed bouts."
 vca_chain_war:0 "Impose the Slave Trade"
 vca_chain_war_name:0 "Impose the Slave Trade"
 vca_chain_war_victory:0 "Enforce slavery throughout the defeated realm and enslave its deposed ruler."
 vca_chain_war_peace:0 "No law or ownership changes."
 vca_chain_war_defeat:0 "The attempted intervention fails; laws remain unchanged."
 vca_liberation_war:0 "War of Liberation"
 vca_liberation_war_name:0 "War of Liberation"
 vca_liberation_war_victory:0 "Ban slavery throughout the defeated realm, free its enslaved people, and imprison the defeated slaver ruler."
 vca_liberation_war_peace:0 "No law or ownership changes."
 vca_liberation_war_defeat:0 "The attempted intervention fails; laws remain unchanged."

 activity_vca_colossus:0 "Colossus Maximus"
 activity_vca_colossus_desc:0 "The grand games of Alu’tor: training-yard visits, championship duels, beasts and public manumission."
 activity_vca_colossus_host_an_a:0 "the"
 activity_vca_colossus_name:0 "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] Colossus Maximus"
 activity_vca_colossus_selection_tooltip:0 "Host the grand arena games."
 vca_opening:0 "The Opening Galleries"
 vca_opening_desc:0 "Inspect the pits and prepare the fighters."
 vca_championship:0 "The Great Spectacle"
 vca_championship_desc:0 "Choose the championship, the beast exhibition or a celebration of freedom."
 vca_arena_location:0 "Alu’tor’s grand arena."
 vca_recruit_prisoner:0 "Send an adult prisoner to the training yards."
 vca_recruit_prisoner_tt:0 "Spend 30 gold. One unlanded adult prisoner is enslaved, released into your court, and enrolled as a gladiator. Enrollment gives no experience."
 activity_vca_colossus_host_desc:0 "Host the great games of Alu’tor."
 activity_vca_colossus_guest_desc:0 "Witness the games in the grand galleries."
 activity_vca_colossus_conclusion_desc:0 "The galleries empty. Victories, losses and grants of freedom remain."
 vca_spectacle_intent:0 "Witness the Games"
 vca_spectacle_intent_desc:0 "Watch the games and celebrate the victors."

 vca_buy_freedom:0 "Buy Your Freedom with Arena Winnings"
 vca_buy_freedom_desc:0 "Pay your owner 200 gold in arena winnings to end your enslavement. Your adventurer camp remains yours, and your gladiator experience is retained."
