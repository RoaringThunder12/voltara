l_english:
 dhm_v072_marriage_unknown_desc:0 "The couple has come to speak about their life together. You hear them out before making any judgment."
 dhm_v072_old_outcome_ack:0 "Let Them Speak"
 dhm_v072_dispute_first_desc:0 "[dhm_dispute_first.GetShortUIName] still resents your judgment. [dhm_dispute_second.GetFirstNameNoTooltip] kept your favor, but the quarrel has not ended."
 dhm_v072_dispute_second_desc:0 "[dhm_dispute_second.GetShortUIName] still resents your judgment. [dhm_dispute_first.GetFirstNameNoTooltip] kept your favor, but the quarrel has not ended."
 dhm_v072_dispute_unknown_desc:0 "The quarrel is no longer raised at your table. Whether it is settled or merely left unspoken, neither relative asks you for a new judgment."
 dhm_v072_heir_unavailable_tt:0 "This duty cannot proceed: its intended heir or their circumstances have changed. No reward is granted and the journey does not advance."
 dhm_v072_parent_ending_title:0 "The Years Between Us"
 dhm_v072_parent_trust_desc:0 "[dhm_arc_first.GetFirstName] sits beside you and speaks freely.\n\n'You asked for the truth. I know now that I may give it.'\n\nListening has taken patience, but the trust between you is real."
 dhm_v072_parent_repaired_desc:0 "[dhm_arc_first.GetFirstName] pauses at your door.\n\n'You were hard on me. But when I finally spoke, you listened.'\n\nAdmitting your mistakes has cost you some pride. It has also brought your child back to your table."
 dhm_v072_parent_distance_desc:0 "[dhm_arc_first.GetFirstName] brings a careful account of the work, then asks leave to go.\n\nThe duties are done. Your judgment is respected. Yet private worries are taken to someone else."
 dhm_v072_parent_resentment_desc:0 "[dhm_arc_first.GetFirstName] stands until dismissed. Every answer is brief and proper.\n\nYou demanded obedience and received it. You did not earn trust. The rest of the household has noticed the silence between you."
 dhm_v072_parent_unknown_desc:0 "[dhm_arc_first.GetFirstName] joins you at supper. You speak of the day's work and the family. Neither presses the other about old disagreements."
 dhm_v072_respectful_distance_opinion:0 "Kept at a Distance"
 dhm_v072_school_disciplined_desc:0 "[dhm_story_tutor.GetFirstName] lays the finished lessons before you.\n\n'The work is done on time now. There are no excuses and no tasks left for tomorrow.'\n\n[dhm_story_child.GetFirstName] has learned useful habits, though the strict lessons were not fondly remembered."
 dhm_v072_school_disciplined_option:0 "Give This Hard Work Its Due"
 dhm_v072_school_discipline_modifier:0 "Steady Habits"
 dhm_v072_school_discipline_modifier_desc:0 "A firm lesson schedule taught this character to keep accounts and finish the day's work."
 dhm_v072_tutor_excellence_modifier:0 "A Tutor's Best Work"
 dhm_v072_tutor_excellence_modifier_desc:0 "Patient instruction helped this character understand lessons that once seemed beyond reach."
 dhm_v072_school_discipline_modifier_renewed_2_tt:0 "#high Renewed#! — [THIS.Char.GetShortUIName|U]: [GetModifier('dhm_v072_school_discipline_modifier').GetNameWithTooltip] is renewed for #V 2 years#!, until #V [GetCurrentDateWithDiff( '(int32)730' )]#!. Its effects do not stack; no extra skill points are added."
 dhm_v072_school_discipline_modifier_renewed_3_tt:0 "#high Renewed#! — [THIS.Char.GetShortUIName|U]: [GetModifier('dhm_v072_school_discipline_modifier').GetNameWithTooltip] is renewed for #V 3 years#!, until #V [GetCurrentDateWithDiff( '(int32)1095' )]#!. Its effects do not stack; no extra skill points are added."
 dhm_v072_tutor_excellence_modifier_renewed_2_tt:0 "#high Renewed#! — [THIS.Char.GetShortUIName|U]: [GetModifier('dhm_v072_tutor_excellence_modifier').GetNameWithTooltip] is renewed for #V 2 years#!, until #V [GetCurrentDateWithDiff( '(int32)730' )]#!. Its effects do not stack; no extra skill points are added."
