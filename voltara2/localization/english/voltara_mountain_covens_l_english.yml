l_english:
 vt_seek_mountain_coven_decision:0 "Seek the Mountain Covens"
 vt_seek_mountain_coven_decision_desc:0 "Beyond the great imperial realms, hidden mountain courts keep their own calendars. Ravenbound seers guard their libraries, Thornheart servants watch the passes, and their undying masters offer a forbidden escape from mortality. I can send word that I seek their blood-oath."
 vt_seek_mountain_coven_decision_tooltip:0 "Contact a vampire coven about receiving the blood-oath"
 vt_mountain_covens.1.t:0 "An Invitation after Dusk"
 vt_mountain_covens.1.desc:0 "An emissary of [scope:vt_coven_patron.GetTitledFirstName] arrives with a sealed cup. A black feather is tied to its stem; thornwood guards wait beyond the door. The coven offers its blood-oath for 150 gold. There is no promise of peace, only an end to ordinary aging and the beginning of a hunger that will never leave me."
 vt_mountain_covens.1.a:0 "I accept the blood-oath."
 vt_mountain_covens.1.b:0 "I will keep my mortal life."
 vt_coven_embrace_tt:0 "Become a vampire and a Threadbinder through the coven's blood-oath. The existing vampire hunger and sire mechanics apply."
 vt_seek_mountain_coven_decision_confirm:0 "Send word to the covens"
