 dhm082_settled_marriage_opinion:0 "Kept Our Agreement"
 dhm082_marriage_agreement_desc:0 "[dhm_crisis_relative.GetFirstName] and [dhm_crisis_spouse.GetFirstName] come before me together.\n\n'We still disagree at times,' [dhm_crisis_relative.GetFirstName] admits. 'But we have kept our word. When a quarrel starts, we settle it between ourselves.'\n\nI will leave them to their household. They do not need my praise for every quiet supper."
 dhm082_marriage_agreement_result_tt:0 "#P Both spouses lose a little Stress and gain +1 Opinion of each other for ten years.#! This pair is spared another ordinary repair story during that time; serious new strain can still reopen it. No ruler skill bonus or extra Prestige is awarded."
