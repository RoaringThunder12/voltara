l_english:
 vic_cassian_abolish_slavery:0 "Abolish Slavery in Severos"
 vic_cassian_abolish_slavery_desc:0 "I survived the conspiracy, defeated Octavian's rebellion, and ended Tharn's threat. With the crown secure, I can turn victory into lasting reform: slavery shall be outlawed throughout my realm. Those who profit from bondage will resent the decree, but the enslaved need wait no longer."
 vic_cassian_abolish_slavery_tooltip:0 "Use your victory over Octavian to abolish slavery."
 vic_cassian_abolish_slavery_confirm:0 "Let the chains be broken."
 vic_cassian_abolish_slavery_effect:0 "Slavery is banned in your realm and enslaved characters under its authority are freed. Popular unrest falls by 30; noble opposition rises by 20. Gain the reform legacy for 15 years."

 vic_tharn_dealt_with_tt:0 "Tharn is dead or imprisoned under Cassian’s authority."
