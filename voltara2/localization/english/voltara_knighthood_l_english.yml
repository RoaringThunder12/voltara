l_english:
 trait_squire:0 "Squire"
 trait_squire_desc:0 "An apprentice learning the discipline and duties of knighthood."
 trait_knight:0 "Knight"
 trait_knight_desc:0 "A sworn knight, trained in arms and charged with upholding their vows."
 trait_track_knight:0 "Knighthood"
 trait_track_knight_desc:0 "Training culminates in the formal granting of knighthood."
 voltara_grant_knighthood:0 "Grant Knighthood"
 voltara_grant_knighthood_desc:0 "Offer knighthood to this adult non-knight. If they are a squire, only their mentor may knight them; squires become eligible at sixteen."
 voltara_take_squire:0 "Take as Squire"
 voltara_take_squire_desc:0 "Offer to mentor this male courtier, aged seven or older. You may knight your squire once he turns sixteen."
 voltara_assign_squire:0 "Arrange Squire Training"
 voltara_assign_squire_desc:0 "Choose an existing adult knight from your realm, then a male non-knight aged 5–15 from your realm to become his squire. Includes your vassals and their courtiers."
 voltara_arrange_knighting:0 "Arrange Knighthood"
 voltara_arrange_knighting_desc:0 "Ask this adult squire’s mentor to confer knighthood. The mentor will be recorded in the Knight Tree."
