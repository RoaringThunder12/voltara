 lam_faction.2000.t: "An Invitation"
 lam_faction.2000.desc: "[lam_inv_head.GetShortUIName] has sent word: would I stand with #high [lam_inv_head.Custom('LamFacName')]#!? Those who want the same thing, the message ran, are heard when they speak together.\n\n#weak Accepting makes me one of its clients. Declined, they will not ask again for three years.#!"
 lam_faction.2000.a: "Stand with them"
 lam_faction.2000.b: "Decline politely"
 lam_fac_merged_away_title: "My faction has merged into another. Whether to follow it is mine to decide"
 lam_ai_fac_strong_reason: "Stronger than their head"
 lam_ai_fac_useful_reason: "A useful strength"
 lam_ai_fac_weak_reason: "Too weak to add anything"
 lam_ai_fac_cause_reason: "Shares their cause"
 lam_ai_fac_rival_reason: "The head's rival"
 lam_ai_fac_spy_reason: "On the lord's council (perhaps a spy)"
 lam_ai_inv_stronger_reason: "The head is far stronger"
 lam_ai_inv_weaker_reason: "I am stronger than the head"
 lam_ai_inv_standing_reason: "A faction of weight at court"
 lam_ai_inv_small_reason: "Still a small faction"
 lam_ai_inv_cause_reason: "Shares the cause"
 lam_ai_inv_against_crown_reason: "Loyal to the lord; this faction opposes them"
 lam_ai_inv_for_crown_reason: "Resents the lord; this faction backs them"
 lam_ai_inv_renown_reason: "A renowned faction"
 lam_ai_inv_content_reason: "Has no taste for politics"
 lam_ai_inv_ambitious_reason: "Ambitious"
 lam_fac_back_heir_interaction: "My Faction Backs Them as Heir"
 lam_fac_back_heir_interaction_desc: "Choose whom my faction backs as the next ruler. A change goes before the faction council."
 lam_fac_back_heir_interaction_tt: "Propose this claimant to the council. Support changes only after approval."
 lam_fac_back_heir_locked_tt: "A deal with the lord binds whom we back"
 lam_fac_head_posture_decision: "Set the Faction's Course"
 lam_fac_head_posture_decision_tooltip: "Set the Faction's Course"
 lam_fac_head_posture_decision_desc: "As head I set how the faction stands toward the lord. A course its people do not share wears down its cohesion."
 lam_fac_head_posture_cd_tt: "Half a year must pass since the last change of course"
 lam_fac_head_goal_decision: "Set What the Faction Asks For"
 lam_fac_head_goal_decision_tooltip: "Set What the Faction Asks For"
 lam_fac_head_goal_decision_desc: "As head I set what the faction seeks from the lord. Achieved, it strengthens the faction; long denied, it breeds grievance."
 lam_fac_head_confidence_decision: "Ask the Faction for Its Confidence"
 lam_fac_head_confidence_decision_tooltip: "Ask the Faction for Its Confidence"
 lam_fac_head_confidence_decision_desc: "Call the council and stake the headship on it. Held, the faction closes ranks; lost, I am no longer its head."
 lam_fac_head_confidence_decision_tt: "The faction council meets. Held: cohesion +15, a little prestige, members think better of me. A majority against: the strongest of them takes the head."
 lam_fac_head_confidence_cd_tt: "A council of confidence met within the last five years"
 lam_fac_head_confidence_held_title: "The faction kept its confidence in its head"
 lam_faction.2100.t: "The Faction's Course"
 lam_faction.2100.desc: "The faction's leading men have gathered. How we stand toward the lord is, in the end, the head's to decide.\n\n#weak A course most of its people do not share wears down cohesion every count. Turning against the lord, or back to them, goes before the council first.#!"
 lam_faction.2100.a: "Stand by the lord (loyal)"
 lam_faction.2100.a.tt: "The faction stands with the lord and rallies when they are threatened."
 lam_faction.2100.b: "Watch and wait"
 lam_faction.2100.b.tt: "Take no side; bide our time."
 lam_faction.2100.c: "Lie low"
 lam_faction.2100.c.tt: "Keep our grievances, but out of sight."
 lam_faction.2100.d: "Oppose openly"
 lam_faction.2100.d.tt: "Speak out against the lord."
 lam_faction.2100.e: "Prepare to arm"
 lam_faction.2100.e.tt: "Gather strength for a rising. The rising itself is put to the faction council ('Rise')."
 lam_faction.2100.f: "Follow the will of its people"
 lam_faction.2100.f.tt: "Set no course; follow how the members feel."
 lam_faction.2100.x: "Leave it as it is"
 lam_faction.2110.t: "What the Faction Asks For"
 lam_faction.2110.desc: "What did we gather for? People follow a faction whose demand is clear."
 lam_faction.2110.g1: "Loosen the crown authority"
 lam_faction.2110.g2: "Tolerance of other faiths and cultures"
 lam_faction.2110.g3: "Defend the true faith"
 lam_faction.2110.g4: "War and campaigns"
 lam_faction.2110.g5: "Seats on the council"
 lam_faction.2110.g6: "The lord's concessions"
 lam_faction.2110.g7: "A secure succession"
 lam_faction.2110.g8: "A strong crown"
 lam_faction.2110.g9: "Keep our standing"
 lam_faction.2110.auto: "Let the faction decide for itself"
 lam_fac_head_posture_decision_confirm: "Set the course"
 lam_fac_head_goal_decision_confirm: "Decide"
 lam_fac_head_confidence_decision_confirm: "Ask for confidence"
 lam_faction.0300.me_need_tt: "Someone at court must found it with me (one who thinks well of me - opinion 20+ - of my house, or a friend; not a head or core of another faction)"
 lam_faction.0300.me_cofounders_tt: "Up to the two most willing found it with me (its first core)"
 lam_ff_cofounder_title: "A co-founder stands with me"
 lam_fac_self_posture_interaction: "My Faction's Course"
 lam_fac_self_posture_interaction_desc: "Set how the faction stands toward the lord. A course most of its people do not share keeps wearing down cohesion."
 lam_po_loyal: "Stand by the lord (loyal)"
 lam_po_watch: "Watch and wait"
 lam_po_quiet: "Lie low"
 lam_po_oppose: "Oppose openly"
 lam_po_arm: "Prepare to arm"
 lam_po_people: "Follow the will of its people"
 lam_po_loyal_desc: "Rallies when the lord is threatened. Turning from opposition: the council - [actor.Custom('LamPvCourt')]"
 lam_po_watch_desc: "Take no side. No council."
 lam_po_quiet_desc: "Keep grievances out of sight. No council."
 lam_po_oppose_desc: "Stand against the lord. Turning from the crown: the council - [actor.Custom('LamPvRise')]"
 lam_po_arm_desc: "Prepare for a rising (put to the faction council: 'Rise'). Turning: the council - [actor.Custom('LamPvRise')]"
 lam_po_people_desc: "Set no course; follow how the members feel."
 lam_fac_self_goal_interaction: "What My Faction Asks For"
 lam_fac_self_goal_interaction_desc: "Set what the faction seeks from the lord. Achieved, it gains strength; long denied, grievance becomes its cause."
 lam_fac_self_goal_interaction_tt: "The faction's demand changes."
 lam_go_1_desc: "Met at crown authority 0-1."
 lam_go_2_desc: "Met at the lord's culture or acceptance 50+."
 lam_go_3_desc: "Met with the same faith and no councillor of another."
 lam_go_4_desc: "Met while the lord is at war."
 lam_go_5_desc: "Met when I or a member sits on the council."
 lam_go_6_desc: "Met at the lord's favour 30+."
 lam_go_7_desc: "Met when the lord's heir is ours and 16+."
 lam_go_8_desc: "Met at crown strength 50+."
 lam_go_9_desc: "Met at 15%+ of the court."
 lam_fac_self_confidence_interaction: "Ask the Faction for Its Confidence"
 lam_fac_self_confidence_interaction_desc: "Stake the headship on a council."
 lam_fac_self_confidence_preview_tt: "Likely: [actor.Custom('LamPvConf')]"
 lam_fac_self_recruit_interaction: "Recruit for My Faction"
 lam_fac_self_recruit_interaction_desc: "Send word to my peers at court at once: join us. Only those willing come."
 lam_fac_self_recruit_interaction_tt: "Willing now: about #high [actor.MakeScope.Var('lam_pv_recruit_n').GetValue|0]#! (as of last season). They come as clients and hold for two years."
 lam_fac_recruit_cd_tt: "Two years must pass since the last call"
 lam_fac_recruit_yes_title: "Answered the call: [Character.MakeScope.Var('lam_rc_n').GetValue|0]"
 lam_fac_recruit_no_title: "No one answered the call"
 lam_fac_self_order_interaction: "Keep Order in My Faction"
 lam_fac_self_arms_interaction: "Call My Faction to Arms"
 lam_fac_self_rise_interaction: "Raise My Faction"
 lam_fac_self_arms_chance_tt: "The core comes at 90%, clients at 45%, moved by how they feel about me, cohesion and a tradition of arms. Those who dislike me (under -10) stay home."
 lam_fac_self_rise_preview_tt: "The council meets first - [actor.Custom('LamPvRise')]"
 lam_fac_back_heir_preview_tt: "The council, likely: [recipient.Custom('LamPvHeir')]"
 lam_pv_nocouncil: "#weak Too few for a council (under 3): it simply stands#!"
