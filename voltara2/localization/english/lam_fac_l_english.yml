 lam_faction.1200.council: "A seat on the council"
 lam_faction.1200.taxes: "Lighter taxes"
 lam_faction.1200.release: "Release our imprisoned"
 lam_hd_yes_law_title: "Granted: crown authority lowered a step"
 lam_hd_yes_heir_title: "Granted: our candidate is the designated heir"
 lam_hd_yes_tolerance_title: "Granted: the lord's culture is a little more accepted"
 lam_hd_yes_gold_title: "Granted: gold, shared in the faction"
 lam_hd_yes_amnesty_title: "Granted: the faction pardoned and recognised"
 lam_hd_yes_council_title: "Granted: a seat on the council"
 lam_hd_yes_taxes_title: "Granted: my tax obligation at its lowest"
 lam_hd_yes_release_title: "Granted: our imprisoned are released"
 lam_faction.2200.t: "The Lord's Warning"
 lam_faction.2200.desc: "[lam_cpw_lord.GetShortUIName] has summoned me. Word is the so-called court party is turning its back on the crown. As things stand, the lord will take the place away within half a year."
 lam_faction.2200.a: "Swear loyalty anew"
 lam_faction.2200.a.tt: "Prestige spent to win back the lord's favour (+25). If it is something else that went wrong, that must mend too."
 lam_faction.2200.b: "Let it pass"
 lam_faction.2200.b.tt: "Still at odds in half a year: the place goes, and not again for five years."
 lam_fac_cp_revoked_title: "The court party place is lost (not again for five years)"
 lam_fac_strong_head_opinion: "Head of a strong faction"
 lam_fac_strong_member_opinion: "Core of a strong faction"
 lam_fac_hm_task_interaction: "Give a Task for the Faction"
 lam_fac_hm_task_interaction_desc: "Send a member on the faction's business. Their skills decide how it goes."
 lam_fac_hm_task_cd_tt: "They already had a task this year"
 lam_tk_lord: "Carry our word to the lord"
 lam_tk_lord_desc: "Better with diplomacy. Success: the lord's favour +8 / failure: -3"
 lam_tk_win: "Win someone over"
 lam_tk_win_desc: "Better with diplomacy and intrigue, and with closeness to the target (same house, friend, liking). Aims first at those close to the member. Success: they become our supporter (their old faction resents it)"
 lam_tk_spy: "Spy on a rival faction"
 lam_tk_spy_desc: "Better with intrigue. Success: one of that head's secrets (empty-handed if there is nothing new to find) / Failure: mostly quiet; four times in ten found out, and relations sour"
 lam_tk_lord_tt: "The member goes to the lord"
 lam_tk_win_tt: "The member sets out to win someone over"
 lam_tk_spy_tt: "The member sets out to spy"
 lam_tk_lord_yes_title: "The lord listened (favour +8)"
 lam_tk_lord_no_title: "The lord was displeased (favour -3)"
 lam_tk_win_yes_title: "A new client won over"
 lam_tk_win_no_title: "The approach failed"
 lam_tk_win_none_title: "There was no one to win over"
 lam_tk_spy_yes_title: "A rival head's secret uncovered"
 lam_tk_spy_no_title: "The spying was found out"
 lam_ai_fac_core_member_reason: "Core of the faction"
 lam_ai_lazy_reason: "Lazy"
 lam_ai_diligent_reason: "Diligent"
 lam_ai_fac_long_reason: "Chose this faction"
 lam_ai_fac_cohesive_reason: "A cohesive faction"
 lam_ai_fac_greedy_reason: "Greedy"
 lam_fac_hm_praise_interaction: "Praise Their Service"
 lam_fac_hm_praise_interaction_desc: "Reward a member with gold. A client who thinks well of me (30+) joins the core."
 lam_fac_hm_praise_cd_tt: "Already praised within two years"
 lam_fac_hm_praise_up_tt: "Joins the core"
 lam_fac_hm_raise_interaction: "Raise to the Core"
 lam_fac_hm_raise_interaction_desc: "Make this member one of the core (for five years)."
 lam_fac_hm_lower_interaction: "Lower to a Client"
 lam_fac_hm_lower_interaction_desc: "Take them out of the core. They will resent it."
 lam_fac_hm_expel_interaction: "Cast Out of the Faction"
 lam_fac_hm_expel_interaction_desc: "Send them out of the faction. They resent it and join none for two years."
 lam_fac_hm_successor_interaction: "Name as My Successor"
 lam_fac_hm_successor_interaction_desc: "If I step down or die, they lead the faction (if landed at court and fit)."
 lam_fac_hm_successor_tt: "Named to succeed as the faction's head"
 lam_fac_mh_raise_interaction: "Ask to Join the Core"
 lam_fac_mh_raise_interaction_desc: "Ask the head to make me one of the core. My strength and their opinion matter."
 lam_fac_mh_cd_tt: "Refused within the last year"
 lam_fac_mh_raised_title: "I am now of the core"
 lam_fac_mh_aid_interaction: "Ask the Faction's Help"
 lam_fac_mh_aid_interaction_desc: "Ask the head for gold or arms."
 lam_fac_mh_aid_cd_tt: "Help was asked recently"
 lam_ad_gold: "Ask for gold"
 lam_ad_gold_desc: "The head lends a little gold."
 lam_ad_arms: "Ask them to join my war"
 lam_ad_arms_desc: "The head joins my war; about half the core come too."
 lam_ad_arms_tt: "The head and some of the core join my war"
 lam_fac_mh_counsel_interaction: "Counsel the Head"
 lam_fac_mh_counsel_interaction_desc: "Speak to the head about the faction's course."
 lam_fac_mh_counsel_cd_tt: "Already counselled within the year"
 lam_cs_close: "Close ranks"
 lam_cs_close_desc: "Faction cohesion +5."
 lam_cs_close_tt: "Cohesion rises"
 lam_cs_stir: "Stand against the lord"
 lam_cs_stir_desc: "The faction nurses a grievance for two years (a cause to rise)."
 lam_cs_stir_tt: "The faction grows restive"
 lam_cs_calm: "Show restraint"
 lam_cs_calm_desc: "Calm the faction's grievance; the lord's favour +5."
 lam_cs_calm_tt: "The faction holds back"
 lam_fac_mh_pledge_interaction: "Pledge Myself"
 lam_fac_mh_pledge_interaction_desc: "Swear loyalty to the head: their opinion and the cohesion rise, and my place is fixed."
 lam_fac_mh_pledge_cd_tt: "Already pledged within three years"
 lam_fac_favor_done_opinion: "Did a favour"
 lam_fac_favor_refused_opinion: "Refused a favour"
 lam_fac_expelled_opinion: "Cast out of the faction"
 lam_fac_praised_opinion: "Praised"
 lam_fac_demoted_opinion: "Lowered from the core"
 lam_fac_sided_with_opinion: "Took my side"
 lam_fac_sided_against_opinion: "Took the other side"
 lam_fac_turned_coat_opinion: "Turncoat"
