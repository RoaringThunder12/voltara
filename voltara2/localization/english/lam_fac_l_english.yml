 lam_faction.3020.oath: "\n· Our oath of loyalty to the lord still stands"
 lam_faction.3020.grievance: "\n· Our grievance against the lord is not yet settled"
 lam_faction.3020.a: "Keep my predecessor's course"
 lam_faction.3020.b: "Set a new course"
 lam_faction.3020.b_tt: "Choose now how the faction faces the lord. A change may set some members against it."
