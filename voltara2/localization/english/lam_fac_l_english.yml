 lam_faction.3010.why_council: "\n\n#weak It began over a council seat.#!"
 lam_faction.3010.why_crown: "\n\n#weak It began over how to face the crown.#!"
 lam_faction.3010.why_old: "\n\n#weak No one remembers exactly how it began.#!"
 lam_faction.3000.why_head: "\n\n#weak Why: we have fallen out. Hard to talk round.#!"
 lam_faction.3000.why_other: "\n\n#weak Why: the other side pulls harder.#!"
 lam_faction.3000.why_tired: "\n\n#weak Why: weary of faction business. A little heart will do.#!"
