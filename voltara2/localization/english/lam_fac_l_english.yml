 lam_faction.0100.g: "Offer gold instead"
 lam_faction.0100.g_tt: "Hand the head gold to drop the demand. Matters of principle (the heir, faith, revocations) are rarely bought off (base 65%, -30 for principle, +20 for a greedy head). Taken: favour +8, and no such demand for two years. Old grievances are not wiped."
 lam_faction.0100.g_no_tt: "Refused, it counts as a refusal."
 lam_fac_first_win_title: "Our faction has won something from the lord for the first time"
 lam_fac_rally_thanks_title: "I remember the faction that stood by the crown in the war (favour +10)"
 lam_faction.3030.t: "After the Rising"
 lam_faction.3030.desc: "The rising of [lam_rf_cur.GetShortUINamePossessive] faction has failed. Their arms laid down, they await judgement. What becomes of the faction is now in my hands."
 lam_faction.3030.a: "Imprison [lam_rf_rebel.GetShortUIName], who led the rising"
 lam_faction.3030.b: "Stay their punishment for now"
 lam_faction.3030.b_tt: "Favour +10, and the head's gratitude. The crime of rebellion is not struck from the record."
 lam_faction.3030.c: "Let it stand, under an oath of loyalty"
 lam_faction.3030.c_tt: "The faction remains, bound for five years by an oath not to stand against the crown."
 lam_faction.3030.d: "Order it dissolved"
 lam_faction.3030.d_tt: "The faction is broken up. Its head bears a grudge, and tyranny rises."
