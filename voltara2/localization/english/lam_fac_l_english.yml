 lam_fac_card_camp: "#weak Heart and nerve:#! [Character.Custom('LamFacCamp')] · [Character.Custom('LamFacStage')]"
 lam_fac_stage_tt: "#high Heart#! is the attitude to the crown (average [Character.MakeScope.Var('lam_fac_att').GetValue|0]): opinion, interests by vassal stance, kinship, office.\n#high Nerve#! is the power to show it ([Character.MakeScope.Var('lam_fac_bold').GetValue|0]): higher when the crown is weak, the faction strong, the leader bold.\n\nUnder a strong crown even a hostile bloc stays #weak latent#!. As nerve rises: #N voiced#! → #N mobilising#! → #N in arms#!. In arms it presses its demand on the liege, and a refusal means war.\nA loyal bloc is the #P crown's men#! under a strong crown and #P rallies#! when the crown wavers.\n\n#high Its biggest cause (judged on the head):#! [Character.Custom('LamFacMoodWhy')]"
 lam_fac_crown_line: "#high [Character.GetShortUINamePossessive|U]#! court · crown [Character.Custom('LamCrown')] #weak ([Character.MakeScope.Var('lam_crown').GetValue|0])#!"
 lam_fac_crown_tt: "The crown's strength comes from crown authority, legitimacy, dread, the liege's armies against the vassals', prestige, a defensive war, and a minority.\n\nA strong crown keeps even hostile blocs quiet; a weak one lets them rise - and rallies the loyal."
