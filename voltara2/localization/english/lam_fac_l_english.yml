 lam_faction.0100.t: "A Bloc's Petition"
 lam_faction.0100.open: "[lam_pet_lead.GetTitledFirstName] has asked for an audience on behalf of their people. They did not come alone: every face behind them waits for my answer.\n\n"
 lam_faction.0100.ask.courtly: "\"Majesty, the dignity of the court is the dignity of the realm. Give us seats on the council and the honours of the feast.\""
 lam_faction.0100.ask.glory_hound: "\"Our swords are rusting. Promise us a campaign; glory is meant to be shared.\""
 lam_faction.0100.ask.parochial: "\"We know our own lands best. Lift the crown's hand from them a little.\""
 lam_faction.0100.ask.zealot: "\"The faith grows dim. Deal with the heretics and tend the holy places.\""
 lam_faction.0100.ask.minority: "\"Our tongue and our prayers are scorned at this court. Promise us tolerance.\""
 lam_faction.0100.ask.barons_and_minor_landholders: "\"The great lords crush the small. Let the king's law shield us.\""
 lam_faction.0100.ask.belligerent: "\"The peace has gone on too long. Our enemies laugh at us.\""
 lam_faction.0100.ask.loyalist: "\"We have always stood at your side. Remember that loyalty.\""
 lam_faction.0100.ask.dynastic: "\"Make the succession clear. Nothing shakes a realm like an uncertain heir.\""
 lam_faction.0100.ask.none: "\"Hear our voice too.\""
 lam_faction.0100.tone.arms: "\n\n#italic Behind the courteous words, hands rest on sword hilts. This is less a petition than a warning.#!"
 lam_faction.0100.tone.loyal: "\n\n#italic Now, with the crown shaken, these have stayed at my side. They are asking what that is worth.#!"
 lam_faction.0100.a: "Grant it."
 lam_faction.0100.b: "Soften it with a gift."
 lam_faction.0100.c: "Refuse."
 lam_faction.0200.t: "A New Bloc's Banner"
 lam_faction.0200.desc: "People gather under a banner, not a name. What does [lam_fac_new.GetFirstNamePossessive] bloc stand for?"
