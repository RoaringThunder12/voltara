 lam_faction.1900.t: "The Faction's Council"
 lam_faction.1900.q_heir: "[lam_vt_head.GetShortUIName] would have us back a different heir. Those who stood by the old candidate demanded a council. "
 lam_faction.1900.q_crown: "The crown passed our candidate over. Keep faith with them, or make peace with the new ruler? The council met. "
 lam_faction.1900.q_rise: "[lam_vt_head.GetShortUIName] would take up arms. Do we draw the sword? The council met. "
 lam_faction.1900.q_deal: "[lam_vt_head.GetShortUIName] has taken the lord's bargain. The council met over it. "
 lam_faction.1900.split: "\n\nThe votes fell close and there was no reconciling them. [lam_vt_lead.GetShortUIName] led those against out of the hall and founded a faction of their own. Where do I stand?"
 lam_faction.1900.held: "\n\nThere was no small opposition, but the head carried it. The faction stays one. Do I abide by it?"
 lam_faction.1900.stay: "Stay with [lam_vt_head.GetShortUIName]"
 lam_faction.1900.follow: "Go with [lam_vt_lead.GetShortUIName]"
 lam_faction.1900.accept: "Abide by it"
 lam_faction.1900.leave: "I will not abide by this. I leave the faction"
 lam_faction.1910.t: "The Faction's Council"
 lam_faction.1910.q_heir: "When I would back a different heir, those who stood by the old candidate demanded a council. "
 lam_faction.1910.q_crown: "When the crown passed our candidate over, some called for peace with the new ruler. The council met. "
 lam_faction.1910.q_rise: "When I would take up arms, the council met over drawing the sword. "
 lam_faction.1910.q_deal: "When I took the lord's bargain, the council met over it. "
 lam_faction.1910.split: "\n\nThe votes fell close. [lam_vt_lead.GetShortUIName] led those against out of the hall. They have a faction of their own now."
 lam_faction.1910.held: "\n\nThere was opposition, but I carried it. The faction stays one, if a little shaken."
 lam_faction.1910.letgo: "Let them go"
 lam_faction.1910.brand: "I will remember them as traitors"
 lam_faction.1910.ok: "Good"
 lam_faction.1900.q_ban: "The edict came, and [lam_vt_head.GetShortUIName] would go underground. Those who would obey demanded a council. "
 lam_faction.1900.q_merge: "There is talk of folding us into [lam_vt_new.GetShortUINamePossessive] faction. Those who would stay our own demanded a council. "
 lam_faction.1900.q_court: "We have been named the crown's party. Those who will not be the crown's men demanded a council. "
 lam_faction.1900.q_confidence: "The voices that no longer trust [lam_vt_head.GetShortUINamePossessive] lead grew loud: a council of no confidence. "
 lam_faction.1900.deposed: "\n\nNo confidence carried. [lam_vt_head.GetShortUIName] steps down and [lam_vt_lead.GetShortUIName] takes the head. The faction stays one."
 lam_faction.1910.q_ban: "When I would go underground against the edict, those who would obey demanded a council. "
 lam_faction.1910.q_merge: "When I would fold us into [lam_vt_new.GetShortUINamePossessive] faction, those who would stay our own demanded a council. "
 lam_faction.1910.q_court: "When we were named the crown's party, those who will not be the crown's men demanded a council. "
 lam_faction.1910.q_confidence: "The voices that no longer trust my lead grew loud: a council of no confidence. "
 lam_faction.1910.deposed: "\n\nNo confidence carried. I step down; [lam_vt_lead.GetShortUIName] takes the head. I am one of the faction now."
 lam_faction.1910.stepdown: "I step down"
