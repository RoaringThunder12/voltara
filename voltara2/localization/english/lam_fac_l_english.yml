 lam_fac_card_nerve: "#weak Nerve to act [Character.MakeScope.Var('lam_fac_bold').GetValue|0], because of:#! [Character.Custom('LamFacNerve1')] +[Character.MakeScope.Var('lam_fac_nf1v').GetValue|0][Character.Custom('LamFacNerve2Sep')]"
 lam_fac_card_nerve_tt: "#high Nerve [Character.MakeScope.Var('lam_fac_bold').GetValue|0]#! = the crown's weakness [Character.MakeScope.Var('lam_fac_nfc').GetValue|0] + the faction's strength [Character.MakeScope.Var('lam_fac_nfs').GetValue|0] + the head's temper [Character.MakeScope.Var('lam_fac_nft').GetValue|0] + grudges, betrayal, a passed-over candidate, wariness, another heir [Character.MakeScope.Var('lam_fac_nfg').GetValue|0] - what calms them (their candidate crowned, fear after a purge, terms on the last night) [Character.MakeScope.Var('lam_fac_nfx').GetValue|0]\n\n#weak A faction against the crown speaks out at 60, mobilises at 85 and rises at 110 - if it holds a tenth of the vassals' strength itself, and not in a new ruler's first six months (unless its candidate was passed over). The card shows only the two biggest reasons.#!"
 lam_fac_nf_crown: "a weak crown"
 lam_fac_nf_share: "their strength"
 lam_fac_nf_temper: "a bold head"
 lam_fac_nf_grievance: "a grievance"
 lam_fac_nf_spurned: "their candidate passed over"
 lam_fac_nf_betrayed: "a broken promise"
 lam_fac_nf_wary: "wariness of the court party"
 lam_fac_nf_heir: "backing another heir"
 lam_fac_nerve2_sep: " · [Character.Custom('LamFacNerve2')] +[Character.MakeScope.Var('lam_fac_nf2v').GetValue|0]"
 lam_faction.0800.tips_head: "\n\n#high Moves worth making now#!"
