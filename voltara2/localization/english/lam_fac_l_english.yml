 lam_fac_unaligned_tt: "Vassals and councillors without faction membership. Remaining independent is a political choice. Small courts and direct cooperation with the ruler encourage it; friendship, family, protection or benefits can make joining worthwhile. A quiet court does not automatically dissolve existing factions."
