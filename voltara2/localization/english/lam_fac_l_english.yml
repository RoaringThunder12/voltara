 lam_fac_plot_reported_opinion: "Reported plotting"
 lam_fac_named_successor_opinion: "Named me successor"
 lam_fac_aid_given_opinion: "Gave help"
 lam_faction.2300.t: "The Head's Request"
 lam_faction.2300.desc: "[lam_st_head.GetShortUIName] called me aside. The faction needs money, and quickly. No one is to know."
 lam_faction.2300.a: "Give the gold"
 lam_faction.2300.a.tt: "A client joins the core"
 lam_faction.2300.b: "See to it in person"
 lam_faction.2300.c: "Decline politely"
 lam_faction.2310.t: "Another Faction's Offer"
 lam_faction.2310.desc: "One of [lam_st_a.GetShortUINamePossessive] people came with a purse: come over to us and you will not regret it."
 lam_faction.2310.a: "Take it and go over"
 lam_faction.2310.b: "Tell [lam_st_head.GetShortUIName]"
 lam_faction.2310.c: "Pretend I never heard it"
 lam_faction.2320.t: "Whispers Behind My Back"
 lam_faction.2320.desc: "[lam_st_b.GetShortUIName] has been running me down before our head, [lam_st_head.GetShortUIName]."
 lam_faction.2320.a: "Answer in kind (intrigue)"
 lam_faction.2320.a_yes: "The head has begun to doubt them"
 lam_faction.2320.a_no: "It was I who fell under suspicion"
 lam_faction.2320.b: "Speak to the head myself"
 lam_faction.2320.c: "Let it be"
 lam_faction.2400.t: "A Quarrel in the Faction"
 lam_faction.2400.desc: "The quarrel between [lam_st_a.GetShortUIName] and [lam_st_b.GetShortUIName] has reached the council. Everyone looks to me."
 lam_faction.2400.a: "Side with [lam_st_a.GetShortUIName]"
 lam_faction.2400.b: "Side with [lam_st_b.GetShortUIName]"
 lam_faction.2400.c: "Make peace between them (diplomacy)"
 lam_faction.2400.c_yes: "They made peace (cohesion +6)"
 lam_faction.2400.c_no: "The mediation failed (cohesion -6)"
 lam_faction.2410.t: "An Informer"
 lam_faction.2410.desc: "Someone came in secret to warn me: [lam_st_traitor.GetShortUIName] means to leave us, or to sell us out."
 lam_faction.2410.a: "Cast them out"
 lam_faction.2410.b: "Win them back with gold (diplomacy)"
 lam_faction.2410.b_yes: "Won back"
 lam_faction.2410.b_no: "Gold wasted (cohesion -5)"
 lam_faction.2410.c: "Pay it no mind"
 lam_faction.2420.t: "The Lord's Envoy"
 lam_faction.2420.desc: "[lam_st_lord.GetShortUINamePossessive] envoy brought gold. If the faction keeps quiet for three years, the lord will not forget it."
 lam_faction.2420.a: "Take it (bound by an oath for three years)"
 lam_faction.2420.b: "Send it back"
 lam_faction.2500.t: "Courted by Both"
 lam_faction.2500.desc: "People from [lam_st_a.GetShortUIName] and [lam_st_b.GetShortUIName] came on the same day. Both want me."
 lam_faction.2500.a: "Side with [lam_st_a.GetShortUIName]"
 lam_faction.2500.b: "Side with [lam_st_b.GetShortUIName]"
 lam_faction.2500.c: "Keep both hoping, take the gifts (intrigue)"
 lam_faction.2500.c_yes: "Gifts from both"
 lam_faction.2500.c_no: "Both saw through it"
 lam_faction.2500.d: "Side with neither"
 lam_faction.2510.t: "A Plot Overheard"
 lam_faction.2510.desc: "I saw [lam_st_plot.GetShortUINamePossessive] people meeting in secret, planning to move against the lord."
 lam_faction.2510.a: "Tell the lord"
 lam_faction.2510.b: "Make them pay for my silence (intrigue)"
 lam_faction.2510.c: "Say nothing"
 activity_lam_faction_gathering: "The Faction's Gathering"
 activity_lam_faction_gathering_desc: "Call the members of my faction to one of my holdings. A month together, talk late into the night, and at the end I decide one thing as their head."
 activity_lam_faction_gathering_province_desc: "Where to gather"
 activity_lam_faction_gathering_host_desc: "$BULLET_WITH_TAB$Members think better of me\n$BULLET_WITH_TAB$At the end I decide one thing: close ranks / plot / the demand to put to the lord / my successor"
 activity_lam_faction_gathering_guest_desc: "$BULLET_WITH_TAB$The head thinks better of me\n$BULLET_WITH_TAB$I may have my say"
 activity_lam_faction_gathering_selection_tooltip: "Call my faction to a [GetActivityType('activity_lam_faction_gathering').GetName]"
 activity_lam_faction_gathering_destination_selection: "Within my own domain"
 activity_lam_faction_gathering_conclusion_desc: "The [GetActivityType('activity_lam_faction_gathering').GetName] has ended"
 activity_lam_faction_gathering_guest_help_text: "The faction's core and clients answer their head's call."
 activity_lam_faction_gathering_cooldown: "A gathering can be held once in two years"
 activity_lam_faction_gathering_cost: "Preparations"
 lam_gathering_phase_meet: "The Gathering"
 lam_gathering_phase_meet_desc: "The members drink together and talk of what is to come."
 lam_gathering_members_tt: "At least two members to call"
 lam_gathering_client_reason: "A client of the faction"
 lam_fac_gathered_opinion: "At the faction's gathering"
 lam_faction.2600.t: "The Gathering Opens"
 lam_faction.2600.desc: "The faction's people have arrived one by one. On the first night every eye turns to me."
 lam_faction.2600.a: "Rally them with a speech (diplomacy)"
 lam_faction.2600.a_yes: "The speech moved them (cohesion +5)"
 lam_faction.2600.a_no: "The speech fell flat"
 lam_faction.2600.b: "Spare no wine or food"
 lam_faction.2600.c: "Straight to business"
 lam_faction.2610.t: "The Gathering's Decision"
 lam_faction.2610.desc: "After a month together, I must say what we have decided."
 lam_faction.2610.a: "Close ranks"
 lam_faction.2610.a.tt: "Cohesion +15"
 lam_faction.2610.b: "Plot against the lord"
 lam_faction.2610.b.tt: "A cause to rise for three years; cohesion +5. If it leaks, the lord hears of it (less likely with intrigue)."
 lam_faction.2610.b_leak: "The plot reached the lord"
 lam_faction.2610.c: "Agree the demand to put to the lord"
 lam_faction.2610.c.tt: "No wait for 'Demand in the Faction's Name'; for a year the lord is 15 more likely to agree"
 lam_faction.2610.d: "Name the strongest my successor"
 lam_faction.2610.d.tt: "Name the strongest lord present as my successor"
 lam_faction.2620.t: "At the Gathering"
 lam_faction.2620.desc: "The last day of [lam_ga_host.GetShortUINamePossessive] gathering. It is time I said something."
 lam_faction.2620.a: "Stand by the head's word"
 lam_faction.2620.b: "Make my own voice heard"
 lam_faction.2620.b.tt: "Strong enough: I join the core"
 lam_faction.2620.c: "Quietly gather friends of my own (intrigue)"
 lam_faction.2620.c_yes: "Those who came think better of me"
 lam_faction.2620.c_no: "The head noticed"
 lam_fac_heard_opinion: "Heard me out"
 lam_fac_dismissed_opinion: "Dismissed me"
 lam_fac_threatened_opinion: "Threatened me"
 lam_fac_rewarded_opinion: "Rewarded me"
 lam_fac_dues_opinion: "Took dues"
 lam_fac_conspirator_opinion: "Fellow conspirator"
 lam_fac_insulted_opinion: "Insulted"
 lam_fac_proved_loyal_opinion: "Proved loyal"
 lam_fac_spurned_test_opinion: "Refused my test"
 lam_fac_generous_head_opinion: "A generous head"
 lam_faction.2330.t: "The Head's Blunder"
 lam_faction.2330.desc: "[lam_st_head.GetShortUIName] has fallen out of the lord's favour. Some in the faction whisper of a change."
 lam_faction.2330.a: "Stand by the head"
 lam_faction.2330.b: "Join the discontented"
 lam_faction.2330.b.tt: "In half a year, the moment to move against the head comes"
 lam_faction.2330.c: "Stay out of it"
 lam_faction.2340.t: "Dues"
 lam_faction.2340.desc: "[lam_st_head.GetShortUIName] says the faction is short of money and asks each member for dues."
 lam_faction.2340.a: "Give a little"
 lam_faction.2340.b: "Give generously"
 lam_faction.2340.b.tt: "A client joins the core"
 lam_faction.2340.c: "Refuse"
 lam_faction.2350.t: "An Empty Place"
 lam_faction.2350.desc: "Word is a place in the core has fallen empty. [lam_st_head.GetShortUIName] has yet to choose."
 lam_faction.2350.a: "Win them with gifts"
 lam_faction.2350.b: "Let my record speak (diplomacy)"
 lam_faction.2350.c: "Not my place to ask"
 lam_faction.2350.no: "Someone else took the place"
 lam_faction.2360.t: "A Whispered Offer"
 lam_faction.2360.desc: "[lam_st_plot.GetShortUIName] whispered to me alone: [lam_st_head.GetShortUIName] is not fit to lead us. Will you stand with me?"
 lam_faction.2360.a: "Stand with them"
 lam_faction.2360.b: "Tell the head"
 lam_faction.2360.c: "Pretend I never heard"
 lam_faction.2361.t: "The Day Comes"
 lam_faction.2361.desc: "Half a year gathering friends. Do I move against the head now?"
 lam_faction.2361.a: "Call a vote of no confidence"
 lam_faction.2361.a.tt: "A council of no confidence with me leading those against. A majority: I become head. Lost: I am cast out, the head my enemy."
 lam_faction.2361.b: "Not yet"
 lam_faction.2430.t: "An Empty Purse"
 lam_faction.2430.desc: "The faction's purse is empty. Moving people costs money."
 lam_faction.2430.a: "Take dues from the members"
 lam_faction.2430.b: "Fill it from my own pocket"
 lam_faction.2430.c: "Tighten our belts"
 lam_faction.2440.t: "The Lord's Test"
 lam_faction.2440.desc: "[lam_st_lord.GetShortUIName] summoned me: show me that your faction is truly mine."
 lam_faction.2440.a: "Prove it with gold"
 lam_faction.2440.b: "Swear it before all (bound by an oath for two years)"
 lam_faction.2440.c: "The faction belongs to no one"
 lam_faction.2450.t: "A Rival's Insult"
 lam_faction.2450.desc: "[lam_st_rival.GetShortUIName] mocked our faction in the middle of the court."
 lam_faction.2450.a: "Answer with steel (prowess)"
 lam_faction.2450.a_yes: "Won the duel"
 lam_faction.2450.a_no: "Lost the duel"
 lam_faction.2450.b: "Turn the court against them (intrigue)"
 lam_faction.2450.b_yes: "They became a laughing stock"
 lam_faction.2450.b_no: "We became the laughing stock"
 lam_faction.2450.c: "Endure it"
 lam_faction.2460.t: "A Faction Wavering"
 lam_faction.2460.desc: "The grumbling never stops. Left like this, the faction will come apart."
 lam_faction.2460.a: "Soothe them with gold"
 lam_faction.2460.b: "Rally them (diplomacy)"
 lam_faction.2460.b_yes: "The faction closed ranks"
 lam_faction.2460.b_no: "My words fell flat"
 lam_faction.2460.c: "Make an example of the loudest"
 lam_faction.2470.t: "An Offer of Amity"
 lam_faction.2470.desc: "One of [lam_st_rival.GetShortUINamePossessive] people came: let us stop quarrelling and swear amity."
 lam_faction.2470.a: "Swear amity"
 lam_faction.2470.b: "Tell the lord"
 lam_faction.2470.c: "Refuse"
 lam_faction.2480.t: "Who Will Follow?"
 lam_faction.2480.desc: "[lam_st_a.GetShortUIName] and [lam_st_b.GetShortUIName], two of the core, each claim to be the one to follow me."
 lam_faction.2480.a: "Name [lam_st_a.GetShortUIName]"
 lam_faction.2480.b: "Name [lam_st_b.GetShortUIName]"
 lam_faction.2480.c: "Not yet"
 lam_faction.2700.t: "An Audience"
 lam_faction.2700.desc: "[lam_lo_a.GetShortUIName] asks an audience on behalf of their faction, with much to say."
 lam_faction.2700.a: "Hear them out"
 lam_faction.2700.b: "Cut it short"
 lam_faction.2700.c: "Remind them of their place"
 lam_faction.2710.t: "The Court Party's Offer"
 lam_faction.2710.desc: "[lam_lo_cp.GetShortUIName] of the court party offers to deal with [lam_lo_plot.GetShortUINamePossessive] faction. Only give the word."
 lam_faction.2710.a: "Give the word"
 lam_faction.2710.b: "There is no need"
 lam_faction.2720.t: "The Spymaster's Report"
 lam_faction.2720.desc: "My spymaster reports that [lam_lo_plot.GetShortUINamePossessive] faction is plotting something."
 lam_faction.2720.a: "Seize their head"
 lam_faction.2720.b: "Buy their silence (an oath for three years)"
 lam_faction.2720.c: "Divide them from within (intrigue)"
 lam_faction.2720.c_yes: "The faction begins to waver"
 lam_faction.2720.c_no: "Found out - and resented"
 lam_faction.2720.d: "Watch"
 lam_faction.2730.t: "Factions at Odds"
 lam_faction.2730.desc: "[lam_lo_b.GetShortUINamePossessive] and [lam_lo_c.GetShortUINamePossessive] factions have come to blows at court. All await my judgement."
 lam_faction.2730.a: "Side with [lam_lo_b.GetShortUIName]"
 lam_faction.2730.b: "Side with [lam_lo_c.GetShortUIName]"
 lam_faction.2730.c: "Reconcile them (diplomacy)"
 lam_faction.2730.c_yes: "The two factions made peace"
 lam_faction.2730.c_no: "The mediation failed"
 lam_faction.2730.d: "Let them wear each other down"
 lam_faction.2740.t: "A Loyal Petition"
 lam_faction.2740.desc: "[lam_lo_loyal.GetShortUINamePossessive] faction asks a reward for its loyalty."
 lam_faction.2740.a: "Grant gold"
 lam_faction.2740.b: "Praise them publicly"
 lam_faction.2740.c: "Loyalty is expected"
 lam_faction.2750.t: "A Faction Grown Too Great"
 lam_faction.2750.desc: "[lam_lo_big.GetShortUINamePossessive] faction holds much of my court. Can I leave it so?"
 lam_faction.2750.a: "Draw them close"
 lam_faction.2750.b: "Divide them (intrigue)"
 lam_faction.2750.b_yes: "The faction has cracked"
 lam_faction.2750.b_no: "Found out"
 lam_faction.2750.c: "Leave it"
 lam_nick_loyal_minister: "the Loyal Minister"
 lam_nick_peerless_loyal: "the Peerless Loyal"
 lam_cp_trusted_modifier: "The Lord's Trust"
 lam_cp_trusted_modifier_desc: "Long loyalty has won the lord's trust."
 lam_cp_paragon_modifier: "A Loyal Minister"
 lam_cp_paragon_modifier_desc: "Known by all as the lord's loyal minister."
 lam_cp_legend_modifier: "Peerless Loyalty"
 lam_cp_legend_modifier_desc: "A loyalty to be remembered for generations."
 lam_cp_counsel_opinion: "Good counsel"
 lam_cp_counsel_bad_opinion: "Useless counsel"
 lam_cp_mission_opinion: "Did as asked"
 lam_cp_envy_opinion: "Envy of the court party"
 lam_cp_betrayed_opinion: "The court party's betrayal"
 lam_cp_suspect_opinion: "Suspicion"
 lam_cp_loyal_servant_opinion: "A faithful servant"
 lam_secret_cp_treason: "The Court Party's Treason"
 lam_secret_cp_treason_desc: "The head of the court party waits for the day to turn on the lord."
 lam_cp_counsel_interaction: "Counsel the Lord"
 lam_cp_counsel_interaction_desc: "As head of the court party, advise the lord. The abler the counsel, the more it is heeded. Merit is earned."
 lam_cp_counsel_cd_tt: "Once a year"
 lam_cp_counsel_tt: "Success: the lord's opinion +10, favour +5, merit +1 / failure: opinion -5"
 lam_cc_purse: "The realm's purse (stewardship)"
 lam_cc_purse_desc: "Better with stewardship"
 lam_cc_arms: "Arms (martial)"
 lam_cc_arms_desc: "Better with martial"
 lam_cc_court: "The court's order (diplomacy)"
 lam_cc_court_desc: "Better with diplomacy"
 lam_cp_counsel_yes_title: "The lord took my counsel (merit +1)"
 lam_cp_counsel_no_title: "The lord was displeased"
 lam_cp_mission_interaction: "Ask the Lord's Bidding"
 lam_cp_mission_interaction_desc: "Ask the lord for a task. Done well, it earns merit."
 lam_cp_mission_cd_tt: "Once in two years"
 lam_cp_report_interaction: "Report to the Lord"
 lam_cp_report_interaction_desc: "Report this faction that has turned on the lord. Their cohesion -10, the lord turns against them, merit +1 - and they will hate me."
 lam_cp_report_cd_tt: "Once in two years"
 lam_cp_hidden_blade_interaction: "Sharpen a Hidden Blade"
 lam_cp_hidden_blade_interaction_desc: "Trusted by the lord, begin to prepare the day I turn on them."
 lam_cp_blade_need_tt: "Must head the court party"
 lam_cp_blade_years_tt: "Three years and more as the court party (until the lord's guard is down)"
 lam_cp_hidden_blade_tt: "A secret of treason. The blade may be drawn after a year. Each year the lord's spies may find it (safer with intrigue)."
 lam_cp_draw_blade_interaction: "Draw the Blade"
 lam_cp_draw_blade_interaction_desc: "The time has come. The court party turns on its lord."
 lam_cp_draw_wait_tt: "A year must pass since the plotting began"
 lam_db_rise: "Rise"
 lam_db_rise_desc: "The faction rises against the lord. Taken unawares, the lord finds the loyal slow to rally (a year)."
 lam_db_seize: "Seize the court"
 lam_db_seize_desc: "Holding two fifths of the court, become the power behind the throne without a fight."
 lam_db_seize_need_tt: "Must hold 40% of the court"
 lam_db_rise_tt: "The court party's place and the honours of loyalty are lost; the book records the treason. Lose the rising and be called 'the Traitor'."
 lam_db_seize_tt: "The court party's place and the honours of loyalty are lost; the book records the treason. The power is mine."
 lam_faction.2800.t: "The Lord's Trust"
 lam_faction.2800.desc: "[lam_cp_lord.GetShortUIName] called me forward before all: no one is more to be trusted.\n\n#weak The record: [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0] years heading the court party, [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0] services.#!"
 lam_faction.2800.a: "Bow and accept"
 lam_faction.2810.t: "A Loyal Minister"
 lam_faction.2810.desc: "For long years leading the court party in the lord's service, [lam_cp_lord.GetShortUIName] named me a loyal minister. The name spreads through the court.\n\n#weak The record: [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0] years heading the court party, [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0] services.#!"
 lam_faction.2810.a: "The honour of a lifetime"
 lam_faction.2820.t: "The Peerless Loyal"
 lam_faction.2820.desc: "Fifteen years, every day the same. [lam_cp_lord.GetShortUIName] says my name will be remembered with my house. The chronicler takes up the pen.\n\n#weak The record: [ROOT.Char.MakeScope.Var('lam_cp_years').GetValue|0] years heading the court party, [ROOT.Char.MakeScope.Var('lam_cp_merit').GetValue|0] services.#!"
 lam_faction.2820.a: "In the name of my house"
 lam_faction.2830.t: "The Lord's Bidding"
 lam_faction.2830.desc: "[lam_cp_lord.GetShortUIName] has a few tasks in mind. Which do I take?"
 lam_faction.2830.a: "Collect a defiant vassal's taxes (martial, diplomacy)"
 lam_faction.2830.b: "Watch a faction that has turned on the lord (intrigue)"
 lam_faction.2830.c: "Attend the lord's heir (learning)"
 lam_faction.2830.yes: "The task is done (merit earned)"
 lam_faction.2830.no: "The task went wrong"
 lam_faction.2840.t: "The Hidden Blade"
 lam_faction.2840.desc: "Another year gone. Do the lord's spies still know nothing?"
 lam_faction.2840.a: "Wait quietly"
 lam_faction.2840.found: "The treason is out!"
 lam_faction.2840.safe: "Another year unseen (riskier the abler the lord's intrigue and the poorer mine)"
 lam_faction.2840.b: "Lie low another year"
 lam_faction.2840.b.tt: "The blade can be drawn a year later"
 lam_faction.2840.c: "Give it up"
 lam_faction.2850.t: "The Lord's Bounty"
 lam_faction.2850.desc: "[lam_cp_lord.GetShortUIName] praises the court party's work and asks what I would have."
 lam_faction.2850.a: "Take gold"
 lam_faction.2850.b: "Ask it be given to the faction"
 lam_faction.2850.c: "The thought is enough (merit +1)"
 lam_faction.2860.t: "The Lord's Suspicion"
 lam_faction.2860.desc: "[lam_cp_lord.GetShortUINamePossessive] look is not what it was. The lord doubts the court party is truly theirs."
 lam_faction.2860.a: "Prove it with gold"
 lam_faction.2860.b: "Talk away the doubt (diplomacy)"
 lam_faction.2860.b_yes: "The doubt is gone"
 lam_faction.2860.b_no: "The doubt deepened"
 lam_faction.2860.c: "There is nothing to doubt"
 lam_faction.2870.t: "Envy"
 lam_faction.2870.desc: "[lam_cp_envious.GetShortUINamePossessive] faction mutters that the court party hoards the lord's favour."
 lam_faction.2870.a: "Soothe them with gifts"
 lam_faction.2870.b: "Let their weaknesses reach the lord (intrigue)"
 lam_faction.2870.b_yes: "The faction wavered (merit +1)"
 lam_faction.2870.b_no: "Only made enemies"
 lam_faction.2870.c: "Ignore it"
 lam_gn_ev_loyal_honor: "Its head honoured as a loyal minister"
 lam_gn_ev_treason: "The court party turned on its lord"
 lam_cp_loyal_house_modifier: "House of Loyal Ministers"
 lam_cp_loyal_house_modifier_desc: "Three generations in the service of the royal line. While that line endures, so does this name."
 lam_cp_loyal_house_opinion: "House of loyal ministers"
 lam_cp_house_seat_title: "Given a council seat as a house of loyal ministers"
 lam_faction.2810.house_tt: "#weak The house's record: [ROOT.Char.MakeScope.Var('lam_cp_house_n').GetValue|0] / 3 of our heads (with me) named loyal ministers under one royal line - at three, the whole house is honoured.#!"
 lam_faction.2890.t: "A House of Loyal Ministers"
 lam_faction.2890.desc: "My grandfather, my father, and now I. For three generations my house has served [lam_cp_lord.GetShortUINamePossessive] royal line, and the line has chosen to honour us as a house of loyal ministers."
 lam_faction.2890.a: "We will serve for ever"
 lam_faction.2890.a.tt: "The whole house gains 'House of Loyal Ministers' (prestige, opinion, the liege's opinion, diplomacy, stewardship). Dynasty renown +1000. While this line holds the throne, each year the king thinks well of us (+25), keeps one of our house on the council, and our faction stands higher in favour. Should the line fall, the honour ends."
 lam_faction.2891.t: "The Line Is Gone"
 lam_faction.2891.desc: "The royal line my house served for three generations has lost the throne. The house of loyal ministers is a tale of the past now."
 lam_faction.2891.a: "The world has changed"
 lam_gn_ev_loyal_house: "Its head's house honoured as a house of loyal ministers"
 lam_faction.2895.t: "A Loyal Name Lost"
 lam_faction.2895.desc: "Once called a loyal minister, I have turned on my lord. The court has another name for me now."
 lam_faction.2895.a: "There is no going back"
 lam_faction.2895.a.tt: "All the honours and merit of loyalty are lost. 'the Loyal Minister' becomes 'the Oathbreaker'. Never a loyal minister again - and the house loses its honour too."
 lam_faction.2896.t: "A Stain on the House"
 lam_faction.2896.desc: "[lam_hs_culprit.GetShortUIName] has raised arms against the royal line my house served for generations. The house of loyal ministers is no more."
 lam_faction.2896.a: "Such shame"
 lam_faction.2896.a.tt: "The house loses 'House of Loyal Ministers' and all that came with it, and cannot earn it again for fifty years."
 lam_court_puppet: "The Power Behind the Throne"
 lam_court_puppet_desc: "The faction's strength has put the ruler in my hands. Grant and revoke titles, name the heir, make war and alliances - all in the the puppet's name. Should the faction fall below 35% of the court, the strings break."
 puppet_action_description_lam_pa_revoke_title: "Revoke titles in the the puppet's name"
 puppet_action_description_lam_pa_grant_titles: "Grant titles in the the puppet's name"
 puppet_action_description_lam_pa_retract_vassal: "Retract vassals for the the puppet"
 puppet_action_description_lam_pa_grant_vassal: "Grant the the puppet's vassals to another"
 puppet_action_description_lam_pa_designate_heir: "Name the the puppet's heir"
 puppet_action_description_lam_pa_modify_contract: "Change the the puppet's vassal contracts"
 puppet_action_description_lam_pa_modify_contract_admin: "Change the the puppet's vassal contracts (administrative)"
 puppet_action_description_lam_pa_modify_contract_nomad: "Change the the puppet's vassal contracts (nomadic)"
 puppet_action_description_lam_pa_grant_governorship: "Appoint governors in the the puppet's name"
 puppet_action_description_lam_pa_arrange_marriage: "Arrange marriages for the the puppet"
 puppet_action_description_lam_pa_break_betrothal: "Break the the puppet's betrothals"
 puppet_action_description_lam_pa_execute: "Execute the the puppet's prisoners"
 puppet_action_description_lam_pa_offer_ward: "Send the the puppet's children as wards"
 puppet_action_description_lam_pa_call_dynasty_war: "Call the the puppet's dynasty to war"
 puppet_action_description_lam_pa_gift_artifact: "Gift the the puppet's artifacts"
