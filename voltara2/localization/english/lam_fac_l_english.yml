 lam_sh_decree_interaction: "Issue a Royal Decree"
 lam_sh_decree_interaction_desc: "Decree in the puppet's name: change the crown's authority, open the treasury, turn the vassals my way, or make the ruler step down."
 lam_sd_up: "Raise crown authority"
 lam_sd_down: "Lower crown authority"
 lam_sd_gold: "Open the royal treasury"
 lam_sd_favor: "Order the vassals to follow me"
 lam_sd_abdicate: "Make the ruler abdicate"
 lam_sd_up_tt: "Crown authority rises one step."
 lam_sd_down_tt: "Crown authority falls one step."
 lam_sd_gold_tt: "I take a quarter of the royal treasury."
 lam_sd_favor_tt: "Every vassal of the ruler thinks better of me for five years (+25)."
 lam_sd_abdicate_tt: "The ruler abdicates and the heir takes the throne - also my puppet (if the heir is me, the throne is mine). Prestige -500."
 lam_sd_law_cd_tt: "Crown authority can change once a year"
 lam_sd_gold_cd_tt: "The treasury opens once a year"
 lam_sd_favor_cd_tt: "This decree once every five years"
 lam_sd_abd_cd_tt: "An abdication once every ten years"
 lam_sd_heir_tt: "The ruler has an heir"
 lam_fac_debug_seize_interaction: "(Debug) Become the power behind this throne"
 lam_fac_debug_seize_interaction_desc: "Debug mode only: make this ruler my puppet at once, no conditions."
 lam_fac_debug_seize_decision: "(Debug) Become my liege's power behind the throne"
 lam_fac_debug_seize_decision_desc: "Debug mode only: make my liege my puppet at once, no conditions (for testing)."
 lam_fac_debug_seize_decision_tooltip: "A debug-mode test button."
 lam_fac_debug_seize_tt: "At once the power behind the throne (held whatever the faction's share)."
 lam_sh_inherit_title: "The ruler is dead - and the new one is in my hands as well"
 lam_sh_heir_strings_title: "I have taken up the strings: this ruler is now my puppet"
 lam_sh_power_modifier: "Power Behind the Throne"
 lam_sh_power_modifier_desc: "Everyone knows where the real power lies. Favours and gifts never stop coming, and the political schemes of the court bend to my will."
 lam_shadow.0001.t: "The King's Letter"
 lam_shadow.0001.desc: "[lam_sh_king.GetFirstName] tried to send a secret letter, and my people caught it. It is addressed to an old friend at a distant court - a plea for rescue, or just a lament."
 lam_shadow.0001.a: "Confront the king with it"
 lam_shadow.0001.b: "Pretend I never saw it"
 lam_shadow.0002.t: "A Line of Petitioners"
 lam_shadow.0002.desc: "Since dawn a line has stood outside my house. Those who want the royal seal come to me, not the king - and every one of them carries a gift."
 lam_shadow.0002.a: "Accept the gifts"
 lam_shadow.0002.b: "Send them away politely"
 lam_shadow.0002.c: "Send the gifts to the royal treasury"
 lam_shadow.0003.t: "Royal Suspicion"
 lam_shadow.0003.desc: "[lam_sh_rel.GetTitledFirstName] has been talking about me at the king's side. \"Whose king are you, Your Majesty?\" Only a whisper, for now - but whispers spread."
 lam_shadow.0003.a: "Silence them under house arrest"
 lam_shadow.0003.b: "Quiet them with gold"
 lam_shadow.0003.c: "Let it be"
 lam_shadow.0004.t: "A Foreign Envoy"
 lam_shadow.0004.desc: "An envoy from a distant land has arrived - and knocked on my door before going to the throne. Someone has told them whom to bow to."
 lam_shadow.0004.a: "Receive them myself"
 lam_shadow.0004.b: "Send them to the king"
 lam_shadow.0005.t: "The Heir's Upbringing"
 lam_shadow.0005.desc: "The king's heir, [lam_sh_heir.GetFirstName], is still young. Who stands beside the child now will decide whose word they heed later."
 lam_shadow.0005.a: "Raise them as my own creature"
 lam_shadow.0005.b: "Leave it to the king"
 lam_shadow.0006.t: "A Vassal Speaks Out"
 lam_shadow.0006.desc: "[lam_sh_critic.GetTitledFirstName] denounced me openly at court: \"The one who hides behind the throne is ruining this realm.\" Everyone is watching for my answer."
 lam_shadow.0006.a: "Throw them in the dungeon as an example"
 lam_shadow.0006.b: "Quietly send gold"
 lam_shadow.0006.c: "Pretend not to hear"
 lam_shadow.0007.t: "A Crack in the Treasury"
 lam_shadow.0007.desc: "There is a hole in the royal accounts. Money nobody knows about flows in and out each month. It would not be hard to turn the stream."
 lam_shadow.0007.a: "Divert it"
 lam_shadow.0007.b: "Leave it alone"
 lam_shadow.0008.t: "Praise at the Feast"
 lam_shadow.0008.desc: "At the feast, [lam_sh_king.GetFirstName] raised a cup to me. The voice shook but the words were clear - and everyone knows whose words they were."
 lam_shadow.0008.a: "Take the applause"
 lam_shadow.0008.b: "Give the credit to the king"
 lam_shadow.0009.t: "The Real King"
 lam_shadow.0009.desc: "A rumour runs through the market: the real king is not the one on the throne, but the one behind it. The king has surely heard it too."
 lam_shadow.0009.a: "Feed the rumour"
 lam_shadow.0009.b: "Silence the rumour"
 lam_shadow.0009.c: "Turn it into influence"
 lam_shadow.0010.t: "The Temptation of Poison"
 lam_shadow.0010.desc: "Each night the same servant fills the king's cup, and that servant is mine. Should the king die, the strings would pass to the heir - with luck, a hand easier to guide."
 lam_shadow.0010.a: "Poison the cup"
 lam_shadow.0010.b: "Not yet"
 lam_shadow.0011.t: "Another Faction's Offer"
 lam_shadow.0011.desc: "[lam_sh_other.GetTitledFirstName] has sent someone late at night: an offer to share the place behind the throne. Refuse, and there is one more enemy."
 lam_shadow.0011.a: "Take their hand"
 lam_shadow.0011.b: "Crush them"
 lam_shadow.0012.t: "The King Balks"
 lam_shadow.0012.desc: "In open court today [lam_sh_king.GetFirstName] opposed me to my face for the first time, before the councillors - voice shaking, but not backing down. Give way once, and it will happen again."
 lam_shadow.0012.a: "Put the king down on the spot"
 lam_shadow.0012.b: "Let the king save face this once"
 lam_shadow.0013.t: "Officials Line Up"
 lam_shadow.0013.desc: "Officials queue at every office: those seeking promotion come to swear loyalty to me, not the king."
 lam_shadow.0013.a: "Accept their loyalty"
 lam_shadow.0013.b: "Refuse"
 lam_shadow.0014.t: "The Drinking King"
 lam_shadow.0014.desc: "These nights [lam_sh_king.GetFirstName] never puts the cup down. A drunk king crosses no one."
 lam_shadow.0014.a: "Let them drink"
 lam_shadow.0014.b: "Help them stop"
 lam_shadow.0015.t: "The Royal Council"
 lam_shadow.0015.desc: "Today I chair the council. The king sits on the throne, but every councillor's eyes are on me."
 lam_shadow.0015.a: "Lead the council"
 lam_shadow.0015.b: "Give the king the chair"
 lam_shadow.0016.t: "The King Strikes Back"
 lam_shadow.0016.desc: "[lam_sh_king.GetFirstName] has noticed that our strength is not what it was. Overnight the royal guards barred the palace gates and dragged off some of my people. For the first time, the king has drawn the sword."
 lam_shadow.0016.a: "Face them head on"
 lam_shadow.0016.b: "Step back and catch my breath"
 lam_shadow.0016.c: "Buy the king's men"
 lam_shadow.0016.d: "Let the strings go"
 lam_shadow.0010.a.tt: "The king dies. The strings may pass to the heir - or snap."
 lam_shadow.0016.win_tt: "The counterstroke is broken; the king bows again."
 lam_shadow.0016.lose_tt: "If it fails, the strings are cut: the king goes free, and I lose much face."
 lam_shadow.0016.yield_tt: "The strings hold, but for two years no decrees on crown authority or the treasury."
 lam_shadow.0016.go_tt: "I let the strings go; the king becomes a free ruler."
 lam_faction.3000.t: "A Wavering Ally"
 lam_faction.3000.desc_to: "[lam_wv_who.GetTitledFirstName] has been scarce at our meetings of late - and, I hear, often in the company of [lam_wv_to.GetTitledFirstNamePossessive] people. If I do not hold on to them now, at the next meeting they will sit on the other side."
 lam_faction.3000.desc_out: "[lam_wv_who.GetTitledFirstName] has hinted that they would like to step back from the faction. Weariness, or some other reckoning - I cannot tell. If I do not hold on to them now, they will quietly slip away."
 lam_faction.3000.a: "Meet them and talk them round"
 lam_faction.3000.b: "Keep them with gold"
 lam_faction.3000.c: "Call in the hook I hold"
 lam_faction.3000.d: "Promise them a place in the core"
 lam_faction.3000.e: "Let them go"
 lam_faction.3000.ok_tt: "[lam_wv_who.GetFirstName] stays with the faction for two years."
 lam_faction.3000.fail_tt: "If persuasion fails, [lam_wv_who.GetFirstName] leaves."
 lam_faction.3000.hook_tt: "[lam_wv_who.GetFirstName] stays with the faction for three years."
 lam_faction.3000.core_tt: "[lam_wv_who.GetFirstName] joins the core and stays for two years."
 lam_faction.3000.go_tt: "[lam_wv_who.GetFirstName] leaves - but remembers we parted well (for ten years, readier to answer if I call them back)."
 lam_fac_stage_shadow: "#high The Power Behind the Throne#!"
 lam_fac_view_up: "Court above"
 lam_fac_view_up_tt: "See the factions in the court of the liege of the court in view. Each press goes one step higher (up to the top liege). \"My court\" brings you back."
 lam_faction.2940.t: "Will the Strings Hold?"
 lam_faction.2940.desc_king: "The throne has a new occupant. Whether [lam_sh_new.GetTitledFirstName] will heed me as meekly as the last, no one yet knows - and the courtiers are already watching the new ruler's face."
 lam_faction.2940.desc_heir: "The strings my predecessor held have come to my hands. But [lam_sh_new.GetTitledFirstName] means to test the new face. Let them slip now, and I will never take them up again."
 lam_faction.2940.a: "Carry on as before"
 lam_faction.2940.b: "Pay the courtiers"
 lam_faction.2940.c: "Lean on them with fear"
 lam_faction.2940.d: "Let the strings go"
 lam_faction.2940.ok_tt: "The strings hold: [lam_sh_new.GetFirstName] remains my puppet."
 lam_faction.2940.go_tt: "[lam_sh_new.GetFirstName] becomes a free ruler."
 lam_sh_snapped_title: "The strings have snapped: the new ruler is no longer in my hands"
 lam_sh_royal_interaction: "Take into My Household"
 lam_sh_royal_interaction_desc: "By the power behind the throne, take the puppet ruler's spouse or adult child as my spouse or concubine. A spouse of the ruler is first divorced from them. The court whispers, and the ruler broods on the insult."
 lam_tr_spouse: "Take as my spouse"
 lam_tr_concubine: "Take as my concubine"
 lam_sh_royal_cd_tt: "Once a year at most"
 lam_sh_royal_counter_tt: "The humiliated ruler may find the nerve to strike back (the counterstroke's pause is lifted)."
 lam_fac_clash_spoils_tt: "A quarrel over the council: the side favoured takes one of the other's council seats (chancellor, marshal, steward or spymaster), and one of the other's followers crosses over."
 lam_fac_feud_title: "The two factions are sworn enemies now. One more clash and there will be blood"
 lam_fac_ally_rose_title: "An allied faction has risen. Whether I rise with them is mine to decide"
 lam_faction.3010.t: "Blood Feud"
 lam_faction.3010.desc: "A third clash with [lam_bf_foe.GetTitledFirstNamePossessive] faction. This is no longer court politics - and they will be thinking the same. Whoever moves first lives."
 lam_faction.3010.a: "Strike first (murder scheme)"
 lam_faction.3010.b: "Bring gold and ask for peace"
 lam_faction.3010.c: "Wait and watch"
 lam_faction.3010.b_tt: "The feud between the two factions is forgotten (no longer rivals or enemies)."
 lam_faction.3010.c_tt: "They may move first."
 lam_fac_card_inf: "#weak Influence chest:#! [Character.MakeScope.Var('lam_fac_inf').GetValue|0]"
 lam_fac_card_inf_tt: "In an administrative court the members' dues gather here (core 6, clients 3 a season, while they hold 50 influence). The head spends it to back our own for the throne or their home theme, or to undercut a rival faction's candidate (30 candidacy per 100 - half again what it buys alone)."
 lam_fac_adm_back_interaction: "Back a Candidate from the Faction's Chest"
 lam_fac_adm_back_interaction_desc: "Spend 100 from the faction's influence chest to back this person for the throne or their home theme (+30 candidacy)."
 lam_fac_adm_harm_interaction: "Undercut a Candidate from the Faction's Chest"
 lam_fac_adm_harm_interaction_desc: "Spend 100 from the faction's influence chest to undercut a rival faction's candidate for the throne or their home theme (-30 candidacy)."
 lam_fac_adm_chest_tt: "100 and more in the faction's influence chest"
 lam_adb_throne: "For the throne"
 lam_adb_gov: "For their home theme"
 lam_adh_throne: "For the throne"
 lam_adh_gov: "For their home theme"
 lam_fac_adm_back_tt: "Faction chest -100. Their candidacy +30."
 lam_fac_adm_harm_tt: "Faction chest -100. Their candidacy -30. They resent me."
 lam_facx.0001.t: "After the Meeting"
 lam_facx.0001.d1: "When the meeting broke up, [lam_x_mate.GetFirstName] caught my sleeve. \"A shame to part like this, no?\" The tavern lights were still burning."
 lam_facx.0001.d2: "The stiff meeting over, a few brought out cups. In the middle of them [lam_x_mate.GetFirstName] kept a seat free and waved me over."
 lam_facx.0001.d3: "[lam_x_mate.GetFirstName] followed me out. \"A day like this wants a drink.\" Wine loosens tongues."
 lam_facx.0001.a: "Drink with them"
 lam_facx.0001.b: "Leave early"
 lam_facx.0001.c: "Listen to the drunken talk"
 lam_facx.0002.t: "The Head's Request"
 lam_facx.0002.d1: "[lam_x_head.GetTitledFirstName] called me aside. The faction is short of funds, they said - it sounded less like a request than a test."
 lam_facx.0002.d2: "\"I know I can count on you.\" With that, [lam_x_head.GetFirstName] made a small request. Granted, it is a debt owed; refused, a mark against me."
 lam_facx.0002.d3: "A letter from the head: polite, but every line expects a comrade's hand."
 lam_facx.0002.a: "Grant it"
 lam_facx.0002.b: "Politely refuse"
 lam_facx.0003.t: "Another Faction's Beckoning"
 lam_facx.0003.d1: "[lam_x_rival.GetTitledFirstNamePossessive] man came late at night. \"Is that all they give you? With us, your place would be different.\""
 lam_facx.0003.d2: "At the hunt [lam_x_rival.GetFirstName] struck up a conversation - it sounded like idle talk, and was not."
 lam_facx.0003.d3: "An unsealed note: \"A better place awaits you.\" The hand was [lam_x_rival.GetFirstNamePossessive] clerk's."
 lam_facx.0003.a: "Refuse and tell my head"
 lam_facx.0003.b: "Say I will think about it"
 lam_facx.0003.c: "Go over then and there"
 lam_facx.0004.t: "The Faction's Fund"
 lam_facx.0004.d1: "The faction is raising a fund. Everyone knows who gave what - and everyone remembers."
 lam_facx.0004.d2: "[lam_x_head.GetFirstName] showed me the coffer. Empty. Nothing needed to be said."
 lam_facx.0004.a: "Give generously"
 lam_facx.0004.b: "Pour in everything"
 lam_facx.0004.c: "Plead hard times"
 lam_facx.0005.t: "A Comrade in Trouble"
 lam_facx.0005.d1: "[lam_x_mate.GetTitledFirstNamePossessive] coffers are empty, I hear - creditors wait at their door. The one I call comrade is cornered."
 lam_facx.0005.d2: "[lam_x_mate.GetFirstName] has taken to a sickbed. Pride forbids them to ask, but the hand in their letter shook."
 lam_facx.0005.d3: "[lam_x_mate.GetFirstName] is losing a war. The whole faction watches who offers a hand."
 lam_facx.0005.a: "Help them (send gold)"
 lam_facx.0005.b: "Look away"
 lam_facx.0006.t: "A Rumoured Successor"
 lam_facx.0006.d1: "The court says I am next after [lam_x_head.GetFirstName]. The head's face has gone stiff."
 lam_facx.0006.d2: "At the feast someone filled my cup and called me \"the next head\". Laughter - but [lam_x_head.GetFirstName] did not laugh."
 lam_facx.0006.d3: "Word that I am the faction's next face has reached the market. Who spread it I cannot say - but I do not mind."
 lam_facx.0006.a: "Enjoy the rumour"
 lam_facx.0006.b: "Deny it plainly before the head"
 lam_facx.0101.t: "A New Face"
 lam_facx.0101.d1: "[lam_x_new.GetTitledFirstName] came asking to join us - someone who has stood with no side until now."
 lam_facx.0101.d2: "\"I would stand under your banner.\" [lam_x_new.GetFirstName] bowed. Zeal alone does not make a faction, but no faction stands without it."
 lam_facx.0101.d3: "[lam_x_new.GetFirstName] came at the sound of our name. Take them in: one more of us, and one more mouth."
 lam_facx.0101.a: "Welcome them into the core"
 lam_facx.0101.b: "Take them in as a supporter"
 lam_facx.0101.c: "Send them away"
 lam_facx.0102.t: "The Oath"
 lam_facx.0102.d1: "[lam_x_mate.GetFirstName] proposed an oath-taking: one cup, one vow, one heart."
 lam_facx.0102.d2: "They say the faction has grown slack. Time to gather everyone and renew the oath."
 lam_facx.0102.d3: "An old custom: every member lays a hand on the head's sword and swears. No one does it any more - which gives it weight."
 lam_facx.0102.a: "Hold a grand ceremony"
 lam_facx.0102.b: "Bind them with words"
 lam_facx.0103.t: "A Discontented Core"
 lam_facx.0103.d1: "[lam_x_mate.GetTitledFirstName] raised their voice at the meeting: \"We have bled for this - we should have a say!\""
 lam_facx.0103.d2: "[lam_x_mate.GetFirstName] came to me alone, complaining that they are poorly repaid for all they have given."
 lam_facx.0103.d3: "Discontent is written all over [lam_x_mate.GetFirstNamePossessive] face. Leave it, and others will follow."
 lam_facx.0103.a: "Give them a greater voice"
 lam_facx.0103.b: "Rebuke them"
 lam_facx.0103.c: "Quiet them with gold"
 lam_facx.0104.t: "A Spy Among Us"
 lam_facx.0104.d1: "[lam_x_mate.GetFirstName] was seen meeting [lam_x_rival.GetFirstNamePossessive] people in secret. Our counsels have been leaking."
 lam_facx.0104.d2: "Strangely, [lam_x_rival.GetFirstName] always knows our plans first. The trail led to [lam_x_mate.GetFirstName]."
 lam_facx.0104.d3: "An intercepted letter, in [lam_x_mate.GetFirstNamePossessive] hand, addressed to [lam_x_rival.GetFirstName]."
 lam_facx.0104.a: "Cast them out"
 lam_facx.0104.b: "Turn them into a double agent"
 lam_facx.0104.c: "Let it pass"
 lam_facx.0105.t: "A Banner and a Name"
 lam_facx.0105.d1: "The members want a banner of our own. Only a strip of cloth - but men die for strips of cloth."
 lam_facx.0105.d2: "Every other faction has its arms and motto. Ours want something to raise too."
 lam_facx.0105.a: "Commission a banner"
 lam_facx.0105.b: "Refuse such vanity"
 lam_facx.0106.t: "The Elder's Counsel"
 lam_facx.0106.d1: "The faction's elder, [lam_x_mate.GetFirstName], came leaning on a staff: \"Young head, hear an old man's nagging.\""
 lam_facx.0106.d2: "[lam_x_mate.GetFirstName] was at court before this faction existed, and has something to say, with a worried face."
 lam_facx.0106.d3: "Old [lam_x_mate.GetFirstName] handed me counsel written through the night - old failures, line after line."
 lam_facx.0106.a: "Listen closely"
 lam_facx.0106.b: "Say times have changed"
 lam_facx.0201.t: "Two Invitations"
 lam_facx.0201.d1: "Two invitations for the same evening: [lam_x_rival.GetTitledFirstName] and [lam_x_rival2.GetTitledFirstName]. I cannot go to both."
 lam_facx.0201.d2: "[lam_x_rival.GetFirstName] and [lam_x_rival2.GetFirstName] both feast on the same night - no accident. Which table I sit at is my answer."
 lam_facx.0201.d3: "Both factions want me. The whole court will watch which hall I walk into tonight."
 lam_facx.0201.a: "Attend [lam_x_rival.GetFirstNamePossessive] feast"
 lam_facx.0201.b: "Attend [lam_x_rival2.GetFirstNamePossessive] feast"
 lam_facx.0201.c: "Decline both politely"
 lam_facx.0202.t: "The Price of Neutrality"
 lam_facx.0202.d1: "Standing with no one is a choice too - and it irks both sides."
 lam_facx.0202.d2: "Neither [lam_x_rival.GetFirstName] nor [lam_x_rival2.GetFirstName] looks kindly on me these days. Neutrality was not free."
 lam_facx.0202.a: "Send gifts to both"
 lam_facx.0202.b: "Declare my neutrality openly"
 lam_facx.0203.t: "A Plea to Mediate"
 lam_facx.0203.d1: "[lam_x_rival.GetFirstName] and [lam_x_rival2.GetFirstName] came to me together - not speaking to each other, but with much to say to me."
 lam_facx.0203.d2: "As the quarrel dragged on, someone spoke my name: \"Someone of no side should judge.\""
 lam_facx.0203.d3: "The court is tired of the two factions' feud, and every eye has turned to me, the unaligned."
 lam_facx.0203.a: "Take up the mediation"
 lam_facx.0203.b: "Say it is none of my business"
 lam_facx.0301.t: "A Feast for the Heads"
 lam_facx.0301.d1: "Someone suggested seating the faction heads at one table: those who break bread draw fewer swords."
 lam_facx.0301.d2: "[lam_x_rival.GetTitledFirstName] and the other heads will not even meet each other's eyes. Time for a feast to change the air."
 lam_facx.0301.d3: "The steward brought a feast plan; at the top of the guest list, the faction heads."
 lam_facx.0301.a: "Hold the feast"
 lam_facx.0301.b: "A needless waste"
 lam_facx.0302.t: "An Anonymous Letter"
 lam_facx.0302.d1: "An unsigned letter lay before the throne: [lam_x_rival.GetTitledFirstName] is plotting treason, it says."
 lam_facx.0302.d2: "\"Beware [lam_x_rival.GetFirstName].\" One line. Who wrote it, and why, no one knows."
 lam_facx.0302.d3: "The spymaster handed me a note found by the court well, [lam_x_rival.GetFirstNamePossessive] name written on it again and again."
 lam_facx.0302.a: "Investigate quietly"
 lam_facx.0302.b: "Burn it"
 lam_facx.0302.c: "Accuse them openly"
 lam_facx.0303.t: "The Round Robin"
 lam_facx.0303.d1: "A petition signed by many vassals side by side - [lam_x_rival.GetFirstNamePossessive] name at the top."
 lam_facx.0303.d2: "A petition. More frightening than what it asks are all the names beneath it."
 lam_facx.0303.a: "Hear the petition"
 lam_facx.0303.b: "Send it back"
 lam_facx.0304.t: "A Challenge"
 lam_facx.0304.d1: "[lam_x_rival.GetFirstName] and [lam_x_rival2.GetFirstName] ask leave to settle it by duel."
 lam_facx.0304.d2: "Two faction heads have thrown down their gloves; only my leave remains. The court is already placing bets."
 lam_facx.0304.d3: "\"Let us end it with steel, my liege.\" [lam_x_rival2.GetFirstName] nodded at [lam_x_rival.GetFirstNamePossessive] words."
 lam_facx.0304.a: "Allow the duel"
 lam_facx.0304.b: "Forbid it"
 lam_facx.0305.t: "Flocking"
 lam_facx.0305.d1: "The court flocks to [lam_x_rival.GetFirstNamePossessive] faction, while [lam_x_rival2.GetFirstNamePossessive] grows lonely. The balance is tipping."
 lam_facx.0305.d2: "Scales tipped too far one way fall over. Raise up the small faction - or let the tide run?"
 lam_facx.0305.a: "Raise up the weaker side"
 lam_facx.0305.b: "Let the tide run"
 lam_facx.0001.c_tt: "I may catch a drunken slip (35%: a hook)."
 lam_facx.0003.c_tt: "I join [lam_x_rival.GetFirstNamePossessive] faction, in its core (bound for two years)."
 lam_facx.0004.b_tt: "I become one of the faction's core."
 lam_facx.0101.a_tt: "[lam_x_new.GetFirstName] joins our core (bound for two years)."
 lam_facx.0101.b_tt: "[lam_x_new.GetFirstName] joins us as a supporter (bound for a year)."
 lam_facx.0104.a_tt: "[lam_x_mate.GetFirstName] is cast out of the faction."
 lam_facx.0104.b_tt: "Half a chance to hold a hook on [lam_x_rival.GetFirstName]."
 lam_facx.0203.ok: "The two heads shook hands, grudgingly."
 lam_facx.0203.fail: "The mediation failed, and both blame me."
 lam_facx.0302.found: "The letter was true."
 lam_facx.0302.nothing: "Nothing was found - and [lam_x_rival.GetFirstName] knows they were looked into."
 lam_facx.0304.a_win: "[lam_x_rival.GetFirstName] won."
 lam_facx.0304.b_win: "[lam_x_rival2.GetFirstName] won."
 lam_fac_clash_spoils_heir_tt: "A quarrel over the heir: the favoured side's candidate gains ground (favour +10 more), and the other wavers (cohesion -5)."
 lam_fac_clash_spoils_face_tt: "A quarrel of pride: the side favoured gains prestige and the other loses it, and one of the other's followers crosses over."
