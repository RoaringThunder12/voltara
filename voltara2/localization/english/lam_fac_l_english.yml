 lam_fac_ally_interaction: "Swear Amity"
 lam_fac_ally_interaction_desc: "Swear amity with this faction: the two do not clash and their heads think better of each other (+10). Easier if both stand on the same side of a court issue, harder if on opposite sides. It ends when either breaks it, when they fall out, or when a head changes."
 lam_fac_ally_same_heart_reason: "The same heart toward the crown"
 lam_fac_ally_foes_reason: "They are at odds"
 lam_fac_ally_same_heir_reason: "They back the same heir"
 lam_fac_break_ally_interaction: "Break Amity"
 lam_fac_break_ally_interaction_desc: "Break the amity. They will remember it as a betrayal and bear a grudge, and our own faction is shaken a little."
 lam_fac_poach_interaction: "Lure Them Over"
 lam_fac_poach_interaction_desc: "Spend 10 gold to open negotiations. An agreed payment is transferred only on joining; the current leader can pay to retain the member."
 lam_fac_poach_loyal_reason: "Thinks well of their present head"
 lam_fac_poach_greedy_reason: "Greedy"
 lam_fac_poach_found_title: "[lam_po_old.GetShortUINamePossessive] faction has noticed us luring their people"
 lam_fac_smear_interaction: "Smear"
 lam_fac_smear_interaction_desc: "Spread rumours about another faction's head. If it works, the lord thinks ill of them and their faction loses favour and cohesion; if it fails, our faction loses favour and they become our rival."
 lam_fac_smear_interaction_tt: "The chance rests on my intrigue against theirs."
 lam_fac_smear_cd_tt: "Spread a smear recently (3 years)"
 lam_fac_smear_yes_title: "The rumours about [recipient.GetShortUIName] have spread"
 lam_fac_smear_no_title: "The smear against [recipient.GetShortUIName] was found out"
 lam_fac_challenge_interaction: "Call a Vote of Confidence"
 lam_fac_challenge_interaction_desc: "Ask the faction council whether it still trusts its head. If the head loses, I take their place; if the head wins, their hold grows firmer. A vote of confidence can be called once in five years."
 lam_fac_challenge_interaction_tt: "The faction council votes on it. A content faction keeps its head."
 lam_fac_challenge_weak_tt: "The head is faltering (cohesion under 40, hoarding, or exposed)"
 lam_fac_challenge_yes_title: "The core stood with me. I now lead this faction"
 lam_fac_challenge_no_title: "The core stayed with [lam_ch_old.GetShortUIName]. I have been cast out"
 lam_fac_inform_interaction: "Inform the Lord"
 lam_fac_inform_interaction_desc: "Hand my faction's secrets to my liege. The liege gains a hold over our head; I gain gold and the liege's trust - and the secret 'Informer', which, if it comes out, gets me cast out."
 lam_fac_inform_interaction_tt: "Report real evidence or a current private policy. No repeated rewards or automatic hooks."
 lam_fac_inform_cd_tt: "Informed recently (5 years)"
 lam_secret_informer: "Informer"
 lam_secret_informer_desc: "Handed their own faction's secrets to the lord"
 lam_fac_poached_opinion: "Lured our people away"
 lam_fac_smeared_opinion: "Ill rumours"
 lam_fac_informer_opinion: "Brought valuable information"
 lam_fac_mediated_opinion: "Mediated for us"
 lam_fac_meddled_opinion: "Meddled"
 lam_fac_bid_decision: "Let the Factions Court Me"
 lam_fac_bid_decision_desc: "I belong to no faction, and that itself has a price. Let me hear what the factions will offer."
 lam_fac_bid_decision_tooltip: "Let the factions court me"
 lam_fac_bid_cd_tt: "Was courted recently (5 years)"
 lam_faction.1500.t: "Courted"
 lam_faction.1500.desc: "No sooner had word spread than the visitors came. Each said the same thing - join us - and each came bearing something."
 lam_faction.1500.o1: "Join [lam_bd_1.GetShortUINamePossessive] faction ([lam_bd_1.MakeScope.Var('lam_bd_gold').GetValue|0] gold)"
 lam_faction.1500.o2: "Join [lam_bd_2.GetShortUINamePossessive] faction ([lam_bd_2.MakeScope.Var('lam_bd_gold').GetValue|0] gold)"
 lam_faction.1500.o3: "Join [lam_bd_3.GetShortUINamePossessive] faction ([lam_bd_3.MakeScope.Var('lam_bd_gold').GetValue|0] gold)"
 lam_faction.1500.x: "Send them all away - I am no one's man"
 lam_fac_mediate_decision: "Mediate Between the Factions"
 lam_fac_mediate_decision_desc: "Belonging to no side, I step between two factions at each other's throats. If it works, both factions and the lord think well of me and I gain a name as a neutral voice; if not, both think I meddled."
 lam_fac_mediate_decision_tooltip: "Mediate between the factions"
 lam_fac_mediate_cd_tt: "Mediated recently (3 years)"
 lam_faction.1600.t: "Between Two Factions"
 lam_faction.1600.desc: "[lam_md_a.GetTitledFirstNamePossessive] people and [lam_md_b.GetTitledFirstNamePossessive] are in the same room, and the air is like a blade. If I speak, it may change - or both may turn on me."
 lam_faction.1600.a: "Step between them"
 lam_faction.1600.a_tt: "Chance: #V [ROOT.Char.MakeScope.Var('lam_md_chance').GetValue|0]%#! (my diplomacy, my name as a mediator). Success ends their quarrel and earns prestige and the regard of both and of the lord."
 lam_faction.1600.x: "Stay out of it"
 lam_fac_mediate_yes_title: "The mediation succeeded; the two factions have sheathed their blades"
 lam_fac_mediate_no_title: "The mediation failed; neither side thinks well of me now"
 lam_fac_head_rise_decision: "Raise the Faction"
 lam_fac_head_rise_decision_desc: "Words are no longer enough. In our faction's name we stand against our liege: we press the demand our cause allows, and with no such road, we openly defy."
 lam_fac_head_rise_decision_tooltip: "Raise the Faction"
 lam_fac_head_rise_decision_tt: "We press the demand our cause allows: a claimant, independence or fewer crown rights by default; in Japan and China, the realm's own ways (restoring the liege, replacing the regent, imperial policy, breaking the realm apart). Separatists (minority, localist, another culture) look to independence and breaking away first. A refused demand can become a war. With no road, open defiance (less tax and levies). The core and close members stand with us; the others decide for themselves. Not again for five years after a rising."
 lam_fac_rise_cd_tt: "Has not risen lately (5 years after a rising, 3 after a rising was voted down)"
 lam_fac_rise_cause_tt: "A cause: the faction's grievance, the lord's disfavour (favour -20 or less), or a ban on factions"
 lam_fac_rise_blocked_tt: "Not barred from factions (after a lost war, etc.)"
 lam_fac_need_standing_tt: "Only a faction of three or more members earns renown and legacies"
 lam_fac_detail_traditions: "Traditions"
 lam_fac_detail_traditions_tt: "Traditions are not bought: they grow out of what the faction has lived through. The number in brackets is that history; at 2, 4 and 7 a tradition rises a level. A tradition once gained is never lost, and passes to the next head. Only a faction of three or more members grows them."
 lam_fac_tl_void: "A new lord: the promise was void"
 lam_fac_tl_scheme: "It moved in the dark"
 lam_faction.0800.void: "\n· Promises void because the lord who made them is gone: [ROOT.Char.MakeScope.Var('lam_dig_void').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_void_who').Char.GetShortUINamePossessive]). Not a betrayal; they may ask again."
 lam_faction.0800.scheme: "\n· Underground schemes (pamphlets, skimmed gold): [ROOT.Char.MakeScope.Var('lam_dig_scheme').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_scheme_who').Char.GetShortUINamePossessive])"
 lam_fac_ban_upkeep_modifier: "Cost of the Ban on Factions"
 lam_fac_ban_upkeep_modifier_desc: "Informers to pay, and a court that will not meet the crown's eye. It lasts as long as the ban."
 lam_fac_detail_ctrl: "Foundations of control [Character.MakeScope.ScriptValue('lam_pol_ctrl_count_value')|0]/6"
 lam_fac_detail_ctrl_tt: "Control requires military, organizational and court foundations.\n[Character.Custom('LamPolOrg')]\n[Character.Custom('LamPolBase')]\n[Character.Custom('LamPolUnity')]\n[Character.Custom('LamPolOffice')]\n[Character.Custom('LamPolLever')]\n[Character.Custom('LamPolRival')]\n\n[Character.Custom('LamPolReady')]\nAllies contribute half, alongside a required independent base. Default sustained control: two years for players, three for AI. Losing a requirement resets preparation."
