 lam_faction.0800.news_head: "\n\n#high News from neighbouring realms#!"
 lam_faction.1700.t: "The Last Night"
 lam_faction.1700.desc: "Past midnight the gate was lit with torches. [lam_ult_lead.GetTitledFirstName] had come with armed men. The herald's words were few: answer tonight, or at first light the banners go up."
 lam_faction.1700.why: "\n\n#weak What brought them here:#! [lam_ult_lead.Custom('LamFacNerve1')][lam_ult_lead.Custom('LamFacNerve2Sep')]"
 lam_faction.1700.past.wronged: "\n\n#italic Among the faces under the torches are the brothers of men I once threw in a cell.#!"
 lam_faction.1700.past.spurned: "\n\n#italic Their candidate was denied the crown. Tonight they have come to collect.#!"
 lam_faction.1700.past.betrayed: "\n\n#italic They have not forgotten a word of the promise I broke.#!"
 lam_faction.1700.ask: "\n\nThe chancellor asked, low: \"What will you do?\""
 lam_faction.1700.a: "Give them what they came for"
 lam_faction.1700.a_tt: "I lose prestige. Their favour rises sharply, their grievance is eased, and their nerve sinks by 25 for two years."
 lam_faction.1700.b: "Buy their oath with gold"
 lam_faction.1700.b_tt: "A large sum for a five-year oath of loyalty (nerve -25 for two years). A greedy head takes it readily; an ambitious or vengeful one, or a faction I have wronged, is likely to refuse - then I keep the gold, and they rise at first light."
 lam_faction.1700.c: "Seize their head"
 lam_faction.1700.c_tt: "Take the head before the banners go up. Easier with dread, my own prowess and a court party; harder the bigger the faction. Even if it works, tyranny rises and the faction holds the arrest against me. If it fails I lose prestige and they rise at once."
 lam_faction.1700.d: "Let them come"
 lam_faction.1700.d_tt: "No terms. A little prestige; they rise at first light."
 lam_fac_ult_oath_yes: "[lam_ult_lead.GetFirstName] took the gold and swore. One by one the torches went out"
 lam_fac_ult_oath_no: "[lam_ult_lead.GetFirstName] threw the gold down. At first light the banners go up"
 lam_fac_ult_arrest_yes: "[lam_ult_lead.GetFirstName] is in chains. The torches at the gate scattered"
 lam_fac_ult_arrest_no: "[lam_ult_lead.GetFirstName] slipped my men. They are rising"
 lam_fac_card_rep: "\"[Character.Custom('LamFacRep')]\""
 lam_fac_card_rep_tt: "#weak What the court says of this faction - from its strength, cause, cohesion, age and how things stand now.#!"
 lam_fac_rep_puppeteer: "the true master behind the throne"
 lam_fac_rep_armed: "a rebel band with swords drawn"
 lam_fac_rep_underground: "an outlawed band gone underground"
 lam_fac_rep_core_empire: "the empire's core faction in name and deed"
 lam_fac_rep_core_kingdom: "the kingdom's core faction in name and deed"
 lam_fac_rep_core_court: "the court's core power in name and deed"
 lam_fac_rep_courtparty: "the court party, the ruler's own hand"
 lam_fac_rep_threat: "a great power that threatens the crown"
 lam_fac_rep_pillar: "a pillar that holds up the crown"
 lam_fac_rep_mobilising: "malcontents with a hand on the hilt"
 lam_fac_rep_spurned: "those who believe the crown was stolen from them"
 lam_fac_rep_betrayed: "those their ruler betrayed"
 lam_fac_rep_appeased: "barely talked down on the last night"
 lam_fac_rep_inlaw: "in-laws bound to the royal blood"
 lam_fac_rep_venerable: "an old house of a faction, decades strong"
 lam_fac_rep_rabble: "a rabble that could split any day"
 lam_fac_rep_tight: "a band that moves as one body"
 lam_fac_rep_lone_defiant: "a lone defiant vassal"
 lam_fac_rep_lone: "a lone power"
 lam_fac_rep_voiced: "an opposition raising its voice at court"
 lam_fac_rep_rallying: "loyalists gathering round a shaken crown"
 lam_fac_rep_crowns_men: "the ruler's trusted men"
 lam_fac_rep_latent: "biding their time in silence"
 lam_fac_rep_fledgling: "a small band, newly formed"
 lam_fac_rep_plain: "one power among many at court"
 lam_faction.0800.news1: "[ROOT.Char.Custom('LamFacNews1')]"
 lam_faction.0800.news2: "[ROOT.Char.Custom('LamFacNews2')]"
 lam_gn_books_label: "This court's books:"
 lam_gn_book_main: "The realm's book now"
 lam_gn_book_btn: "[Title.GetNameNoTier]"
 lam_gn_ev_migrated: "Carried on under a new ruler"
 lam_fac_badge_holding: "#weak Watching the new ruler#!"
 lam_fac_badge_holding_tt: "Less than six months since the new ruler took the throne (or since this faction came into the court). Until then it mobilises at most, does not rise and holds its petitions. A faction whose candidate was passed over is not held back."
 lam_faction.1800.t: "The Crown's Word"
 lam_faction.1800.desc: "[lam_ban_lord.GetTitledFirstNamePossessive] edict has been read out: \"From this day, to gather in factions without the ruler's leave is treason.\" Eyes turn to me. The faction I lead is now outlawed.\n\nI could bow to the edict and let it scatter quietly; its name and heritage would stay on record, waiting for a better day. Or I could take it into the dark. The timid will leave, but those who stay will hold closer than before. And edicts do not last forever."
 lam_faction.1800.a: "Bow to the edict and disband"
 lam_faction.1800.a_tt: "The faction disbands at the next count. Its heritage (traditions, renown) stays, for whoever founds it again. The lineage records it as 'Disbanded under the edict'. My lord thinks better of me (+15, 5 years)."
 lam_faction.1800.b: "Go underground"
 lam_faction.1800.b_tt: "The faction goes underground. The fair-weather friends leave; the core stays. The core and I hold the criminal secret 'Outlawed Faction'. My lord knows I led it, but not who stayed. I gain an 'Underground Network' (+10% success for hostile schemes). If we last until the edict ends we come back 'having endured' (cohesion, prestige, renown, our people's regard)."
 lam_faction.1810.t: "Factions Outlawed by Edict!"
 lam_faction.1810.desc: "[lam_ban_lord.GetTitledFirstNamePossessive] edict has come down: to gather in factions without the ruler's leave is treason. [lam_ban_lead.GetShortUINamePossessive] faction, mine, is no exception.\n\n"
 lam_faction.1810.obey: "Our head has bowed to the edict and disbanded the faction. We go our own ways now."
 lam_faction.1810.stay: "Our head has taken us underground. The timid have left, but I stayed in the core. From now on I am an outlaw."
 lam_faction.1810.cut: "Our head has taken us underground, but not me: the faction went into the dark without me, and I may join no faction for a year."
 lam_faction.1810.wait: "Our head has not answered yet: scatter, or hide."
 lam_faction.1810.a: "So be it"
 lam_fac_ban_obeyed_title: "[lam_ban_lead.GetShortUIName] bowed to the edict and disbanded their faction"
 lam_fac_ban_defied_title: "[lam_ban_lead.GetShortUINamePossessive] faction did not disband: it went underground"
 lam_fac_ban_obeyed_member_title: "Our head bowed to the edict and disbanded the faction"
 lam_fac_ban_stay_member_title: "Our head went underground; I stayed in the core"
 lam_fac_ban_cut_member_title: "Our head went underground, without me"
 lam_fac_obeyed_opinion: "Disbanded their faction at my word"
 lam_fac_endured_opinion: "Kept the faction alive through the edict"
 lam_fac_ug_born_title: "A faction founded under the edict is underground from the start: the lord does not even know it exists"
 lam_fac_ug_born_founder_title: "The faction I raised was born underground: the lord does not even know it exists"
 lam_fac_surfaced_head_title: "The edict is over: our faction endured, and shows its face again"
 lam_fac_surfaced_member_title: "The edict is over: our faction endured, and shows its face again"
 lam_fac_surfaced_lord_title: "A faction that hid under the edict shows its face again"
 lam_fac_tl_surfaced: "Outlasted the edict and came back"
 lam_fac_badge_endured: "#P Endured#!"
 lam_fac_badge_endured_tt: "This faction lasted out the edict underground and came back: cohesion +15, prestige for its head, renown +5, and its members trust their head more (+15, 3 years). Shown for five years."
 lam_fac_card_intel: "#weak Exposed:#! [Character.Custom('LamFacIntel')]"
 lam_fac_card_intel_tt: "A hiding underground faction shows to others only as far as the lord's spies have dug: a rumour shows a card of question marks; a known head shows its members as '?'; then the core; then everyone. It is exposed further when a member's 'Outlawed Faction' secret is learned, when they are exposed, when someone informs or turns themselves in, and when the lord digs ('Dig into the Underground'). The head can set it back one step ('Cover Our Tracks'). Its own members always see it whole; a faction out in the open shows all its members."
 lam_fac_intel_0: "#P Nothing yet#!"
 lam_fac_intel_1: "#P A rumour#!"
 lam_fac_intel_2: "#high Its head#!"
 lam_fac_intel_3: "#N Its core#!"
 lam_fac_intel_4: "#N All of it#!"
 lam_fac_veil_title: "#N An Unknown Underground Faction#!"
 lam_fac_veil_lead: "#weak Head#! ?"
 lam_fac_veil_members: "#weak Members#! ?"
 lam_fac_veil_q: "?"
 lam_fac_veil_desc: "#weak The spies have caught wind of forbidden meetings somewhere at court. Who leads them, who comes and goes, no one knows yet. 'Dig into the Underground' to find out more.#!"
 lam_fac_mrow_veiled: "#weak ? - not yet named#!"
 lam_fac_mrow_veiled_tt: "Someone else is in this faction. Who, only more digging will tell."
 lam_fac_ug_dig_decision: "Dig into the Underground"
 lam_fac_ug_dig_decision_tooltip: "Dig into the Underground"
 lam_fac_ug_dig_decision_desc: "An edict does not end factions; it drives them into the dark. Coin in the spies' hands, and they will search the court's nights. The better my spymaster's intrigue, the more they find. What they find shows in the factions window, and the crimes of the head and the core come into my hands."
 lam_fac_ug_dig_decision_tt: "One underground faction is uncovered one step further (35% + spymaster's intrigue x3, 20-90%; half if they have covered their tracks). The spies may find nothing - and there is no telling whether nothing is there."
 lam_fac_ug_dig_cd_tt: "Only once a year"
 lam_fac_dig_named_title: "The spies dug into [lam_dig_lead.GetShortUINamePossessive] underground faction"
 lam_fac_dig_rumour_title: "The spies caught wind of an underground faction somewhere at court"
 lam_fac_dig_none_title: "The spies found nothing"
 lam_fac_dig_watched_title: "The lord's spies are on our faction's trail"
 lam_fac_ug_cover_decision: "Cover Our Tracks"
 lam_fac_ug_cover_decision_tooltip: "Cover Our Tracks"
 lam_fac_ug_cover_decision_desc: "Move the meetings, pay the loose-lipped, burn the letters. Cut the thread the lord's spies hold."
 lam_fac_ug_cover_decision_tt: "What the crown knows drops one step. For two years the spies have lost the thread: learned secrets raise it no further, and 'Dig into the Underground' succeeds half as often."
 lam_fac_ug_cover_cd_tt: "Only once every two years"
 lam_fac_ug_cover_need_tt: "The lord knows something of us (once everything is known there are no tracks left to cover)"
 lam_fac_ug_recruit_interaction: "Recruit by Night"
 lam_fac_ug_recruit_interaction_desc: "Visit someone with a grudge against the lord by night, and bring them into our underground faction. If they agree they join us as an outlaw; every new face is a little more risk. If they refuse and are the lord's creature, they may go straight to the lord."
 lam_fac_ug_recruit_yes_tt: "They join our underground faction (a 10% chance my secret reaches the lord)."
 lam_fac_ug_recruit_no_tt: "If they are loyal to the lord, a one-in-two chance they tell: my secret comes out, and the lord knows our faction one step better."
 lam_fac_ug_recruit_loyal_reason: "Loyal to the lord"
 lam_fac_ug_recruit_grudge_reason: "Holds a grudge against the lord"
 lam_fac_ug_recruit_bold_reason: "Ambitious, vengeful or zealous"
 lam_fac_ug_recruit_craven_reason: "Craven"
 lam_fac_ug_told_title: "[recipient.GetShortUIName] refused - and went to the lord"
 lam_fac_ug_silent_title: "[recipient.GetShortUIName] refused, but will keep quiet"
 lam_fac_ug_confess_interaction: "Turn Myself In"
 lam_fac_ug_confess_interaction_desc: "Walk away from the underground faction and lay it all before the lord. My crime is pardoned, but the lord learns our faction down to its core (everything, if I was of the core). The head will call me a traitor, and I will carry the secret 'Informer'."
 lam_fac_ug_confess_tt: "I leave the faction and am an outlaw no longer. The lord learns our faction down to its core (everything, if I was of the core). The head thinks me a traitor (-35). I may join no faction for 3 years."
 lam_fac_ug_network_modifier: "Underground Network"
 lam_fac_ug_network_modifier_desc: "Safe houses, couriers, people who owe them. An underground faction's head schemes better against the lord."
 lam_gn_end_banned: "#N Disbanded under the edict#!"
 lam_gn_ev_surfaced: "Outlasted the edict"
 lam_gn_lg_split:0 "broke away"
 lam_gn_lg_revived:0 "took up"
 lam_gn_lg_line:0 "same root"
 lam_fac_awe_line: "#P A conqueror's court#!"
 lam_fac_awe_line_tt: "This court's master is a conqueror (the Conqueror or Greatest of Khans trait, or 'Scourge of God'). No faction dares stand against them: they side with the crown. Attitude toward the lord +50, nerve -40, and they do not rise."
 lam_fac_crushed_lord_title: "[lam_purged.GetShortUINamePossessive] underground faction is crushed"
 lam_fac_crushed_member_title: "Our head was taken; our underground faction is broken"
 lam_gn_end_crushed: "#N Crushed: its head taken#!"
