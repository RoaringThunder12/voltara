 lam_faction.0100.past.wronged: "\n\n#italic They still remember a comrade dragged off by my hand, and a promise I broke. Today's demand comes from that memory.#!"
 lam_faction.0100.past.spurned: "\n\n#italic The candidate they backed was passed over at the last crowning. They have not forgotten.#!"
 lam_faction.0100.past.purge: "\n\n#italic This faction has lived through a purge. Since then it weighs its words before the crown - and wants guarantees.#!"
 lam_faction.0100.past.pardoned: "\n\n#italic They hid under the edict until they were pardoned. Back in the light, they want to make their place secure.#!"
 lam_faction.0100.past.old: "\n\n#italic An old faction, now under its [lam_pet_lead.MakeScope.Var('lam_fac_gen').GetValue|0]th head. Its demands carry the memory of those before.#!"
