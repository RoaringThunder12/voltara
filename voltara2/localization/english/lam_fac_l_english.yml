 lam_faction.2900.t: "The Power Behind the Throne"
 lam_faction.2900.desc: "[lam_sh_king.GetShortUIName] rules in name only now. It is I who move this realm."
 lam_faction.2900.a: "This realm is mine"
 lam_faction.2900.a.tt: "From the puppets in the intrigue window, act in the ruler's name: revoke and grant titles, name the heir, change vassal contracts, make war and alliances, imprison and execute. Right-click the ruler's people to fill their council as I please (myself too); right-click myself to take as many court offices as I like. The ruler will not cross me (+100 opinion), asks nothing of my faction, and needs my approval for wars of their own. Should my faction fall below 35% of the court, the strings break."
 lam_faction.2910.t: "The Puppet's War"
 lam_faction.2910.desc: "[lam_sw_king.GetShortUIName] has declared war without my leave."
 lam_faction.2910.a: "Let it stand"
 lam_faction.2910.b: "Have it called off (white peace)"
 lam_sh_council_interaction: "Seat on the Ruler's Council"
 lam_sh_council_interaction_desc: "Put this person in a seat on the puppet ruler's council, in place of whoever holds it. I may seat myself."
