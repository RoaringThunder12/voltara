 lam_fac_ctrl_yes_swords: "#P ✔#! More swords than the lord"
 lam_fac_ctrl_no_swords: "#N ✘#! More swords than the lord"
 lam_fac_buyout_decision: "Buy Back the Strings"
 lam_fac_buyout_decision_desc: "Gold instead of steel: pay the power behind the throne, and take the throne back. The greedy, the content and the waning take the price more easily; the ambitious rarely let go."
 lam_fac_buyout_decision_tt: "If they accept, I pay three years of income (at least 150) and am free: the regency and their hook end. If they refuse, I keep the gold but lose prestige. Shares its 3-year wait with the coup."
 lam_fac_buyout_decision_tooltip: "Buy Back the Strings"
 lam_fac_buyout_gold_tt: "Gold worth three years of income (at least 150)"
 lam_buyout_yes_title: "The strings are bought back: the throne is mine again"
 lam_buyout_no_title: "The power behind the throne refused the price"
 lam_fac_defiance_mid_modifier: "Defiant Vassals (Moderate)"
 lam_fac_defiance_mid_modifier_desc: "A middling faction (15-35% of the vassals' strength) defies the crown and holds back part of its levies and taxes."
 lam_fac_defiance_minor_modifier: "Defiant Vassals (Minor)"
 lam_fac_defiance_minor_modifier_desc: "A small faction (under 15% of the vassals' strength) defies the crown and holds back a little of its levies and taxes."
 lam_fac_tl_oath_void: "The lord broke faith first: the oath was undone"
 lam_fac_tl_oath_broken: "It broke its oath and rose"
 lam_fac_rise_oath_tt: "#N We swore loyalty. Rising breaks the oath: great prestige is lost, and the lord will not forget the betrayal.#!"
 lam_ff_court_liege_tt: "A faction can be founded in my liege's court (under an edict it will be underground)"
 lam_ff_court_own_tt: "No edict against factions in my own court (I cannot defy my own edict)"
