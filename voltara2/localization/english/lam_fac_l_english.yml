 lam_faction.0800.tip2: "\n· [ROOT.Char.Custom('LamFacTip2')]"
 lam_faction.0800.take_deal: "Sit down with [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]'s faction"
 lam_faction.0800.take_favour: "Favour [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetFirstNameNoTooltip]'s faction"
 lam_faction.0800.take_press: "Order the court party to press the other faction"
 lam_fac_tip1_deal: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUINamePossessive] faction is mobilising (nerve [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]). Before it rises, a deal can buy its oath of loyalty. #weak Price: a council seat, a county, gold, a marriage or a pardon#!"
 lam_fac_tip1_promise: "A promise to [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUINamePossessive] faction is still pending. Keep it in time for great favour; break it and they feel betrayed for five years."
 lam_fac_tip1_strings: "My crown hangs on strings. Cut them by 'Buy back the strings' (three years' income) or a 'Palace coup' (intrigue, martial, dread)."
 lam_fac_tip1_amends: "[ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUINamePossessive] faction remembers a wrong I did them. Concluding a deal with them settles it (mine, not another lord's). #weak Price: whatever I give#!"
 lam_fac_tip1_make_cp: "Patronage can build support, but court-party status requires council approval. Costs 75 prestige."
 lam_fac_tip1_rally: "The crown is shaken. [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUINamePossessive] faction is rallying to it; favour would put wind in its sails. #weak Price: 75 prestige#!"
 lam_fac_tip1_press: "The court party can be set on [ROOT.Char.MakeScope.Var('lam_tip1_who').Char.GetShortUINamePossessive] faction: its favour, cohesion and engagement will waver. #weak Price: tyranny; once in two years#!"
 lam_fac_tip1_ban: "The terms for an edict against the factions hold. It costs every vassal's goodwill (−20 for five years) and an upkeep while it stands."
 lam_fac_tip2_deal: "[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUINamePossessive] faction is mobilising (nerve [ROOT.Char.MakeScope.Var('lam_tip2_who').Char.MakeScope.Var('lam_fac_bold').GetValue|0]). Before it rises, a deal can buy its oath of loyalty. #weak Price: a council seat, a county, gold, a marriage or a pardon#!"
 lam_fac_tip2_promise: "A promise to [ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUINamePossessive] faction is still pending. Keep it in time for great favour; break it and they feel betrayed for five years."
 lam_fac_tip2_strings: "My crown hangs on strings. Cut them by 'Buy back the strings' (three years' income) or a 'Palace coup' (intrigue, martial, dread)."
 lam_fac_tip2_amends: "[ROOT.Char.MakeScope.Var('lam_tip2_who').Char.GetShortUINamePossessive] faction remembers a wrong I did them. Concluding a deal with them settles it (mine, not another lord's). #weak Price: whatever I give#!"
