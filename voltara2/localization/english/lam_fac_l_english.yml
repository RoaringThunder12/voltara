 lam_fac_clash_rival_reason: "Their factions clashed at court"
 lam_faction.0700.t: "Two Factions Collide"
 lam_faction.0700.heir: "[lam_cl_a.GetTitledFirstName] backs [lam_cl_a_heir.GetFirstName] for the throne; [lam_cl_b.GetTitledFirstName] backs [lam_cl_b_heir.GetFirstName]. At today's feast the quarrel broke out in front of everyone. Someone said \"the rightful line\"; someone else laid a hand on their sword hilt."
 lam_faction.0700.council: "Over a council seat, [lam_cl_a.GetTitledFirstNamePossessive] people and [lam_cl_b.GetTitledFirstNamePossessive] are accusing each other. One side holds the seat; the other cries that it was bought."
 lam_faction.0700.crown: "[lam_cl_a.GetTitledFirstNamePossessive] faction and [lam_cl_b.GetTitledFirstNamePossessive] stand at opposite ends on the crown: one would raise it higher, the other pull it down. Today those words collided in front of me."
 lam_faction.0700.blood: "The old feud between [lam_cl_a.GetTitledFirstNamePossessive] house and [lam_cl_b.GetTitledFirstNamePossessive] has flared again, and now both factions have been dragged into it."
 lam_faction.0700.end: "\n\nBoth of them are looking at me. Whatever I do - or do not do - will be my answer."
 lam_faction.0700.a: "Side with [lam_cl_a.GetFirstName]"
 lam_faction.0700.b: "Side with [lam_cl_b.GetFirstName]"
 lam_faction.0700.c: "Call them both to the table and make peace"
 lam_faction.0700.c.ok: "Peace is made"
 lam_faction.0700.c.fail: "The peace fails"
 lam_faction.0700.d: "Let them settle it themselves"
 lam_faction.0800.t: "The Year at Court"
 lam_faction.0800.open: "Open Court Factions"
 lam_faction.0800.new: "\n· New factions: [ROOT.Char.MakeScope.Var('lam_dig_new').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_new_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.ends: "\n· Factions dissolved: [ROOT.Char.MakeScope.Var('lam_dig_ends').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_ends_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.succ: "\n· Factions with a new head: [ROOT.Char.MakeScope.Var('lam_dig_succ').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_succ_who').Char.GetShortUIName])"
 lam_faction.0800.merge: "\n· Mergers: [ROOT.Char.MakeScope.Var('lam_dig_merge').GetValue|0] (latest absorber: [ROOT.Char.MakeScope.Var('lam_dig_merge_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.leave: "\n· Left their faction: [ROOT.Char.MakeScope.Var('lam_dig_leave').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_leave_who').Char.GetShortUIName])"
 lam_faction.0800.leave_radical: "\n· Turned from a faction going too far: [ROOT.Char.MakeScope.Var('lam_dig_leave_radical').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_leave_radical_who').Char.GetShortUIName])"
 lam_faction.0800.leave_loyal: "\n· Left a faction loyal to the crown: [ROOT.Char.MakeScope.Var('lam_dig_leave_loyal').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_leave_loyal_who').Char.GetShortUIName])"
 lam_faction.0800.quiet: "\n· Factions gone quiet: [ROOT.Char.MakeScope.Var('lam_dig_quiet').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_quiet_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.goal: "\n· Factions that got what they wanted: [ROOT.Char.MakeScope.Var('lam_dig_goal').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_goal_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.heir: "\n· Factions that changed their candidate: [ROOT.Char.MakeScope.Var('lam_dig_heir').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_heir_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.spurned: "\n· Factions whose candidate was passed over: [ROOT.Char.MakeScope.Var('lam_dig_spurned').GetValue|0] (latest: [ROOT.Char.MakeScope.Var('lam_dig_spurned_who').Char.GetShortUINamePossessive])"
 lam_faction.0800.crown: "\n\nThe crown's strength now: [ROOT.Char.MakeScope.Var('lam_crown').GetValue|0] / 100"
 lam_faction.0800.a: "Noted"
 lam_fac_card_heir_lawful: "#weak Backs:#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #P (the lawful heir)#!"
 lam_fac_card_heir_other: "#weak Backs:#! [Character.MakeScope.Var('lam_fac_heir').Char.GetShortUIName] #N (another candidate)#!"
 lam_fac_card_heir_tt: "Who this faction quietly wants on the throne next - chosen by the leader's regard, their own house's blood (in-laws), marriage, faith and culture, age, and the qualities their cause prizes. Backing someone other than the lawful heir emboldens them, and factions backing different candidates become enemies. If their candidate is passed over when the ruler dies, they turn - and if the candidate has a claim, it can become a pretender's war."
 lam_fac_badge_promise: "#P Promised#!"
 lam_fac_defiance_title: "[lam_abs_lead.GetShortUINamePossessive] faction defies the crown. They have no banner to rally under, but they are holding back levies and taxes they owe - as much as their weight allows"
 lam_fac_defiance_modifier: "Defiant Vassals"
 lam_fac_defiance_modifier_desc: "A large faction (35%+ of the vassals' strength) defies the crown and holds back much of the levies and taxes it owes."
 lam_fac_empty: ""
 lam_fac_liar_tt: "I have broken my word twice. No one believes my promises now"
 lam_found_faction_decision_flow_tt: "Choose the court and who will lead. Whoever I ask decides by our relationship, their temperament, and their heart toward the crown."
 lam_found_faction_cd_tt: "Tried to found a faction recently (2 years)"
 lam_faction.0290.t: "In Whose Court"
 lam_faction.0290.desc: "I am a vassal, and I have vassals of my own. Where shall the faction stand?"
 lam_faction.0290.a: "In my liege's court, among my peers"
 lam_faction.0290.b: "In my own court, among my vassals"
 lam_faction.0300.peer: "A faction needs a face, a name people will gather behind. I could stand forward myself, or ask someone better suited. Whether they will accept is another matter."
 lam_faction.0300.own: "I will raise a party of my own in my court, but I cannot lead it. The moment a king leads a faction, it is no faction but the crown itself. I must ask one of my vassals. It is hard to refuse me, but it can be done."
 lam_faction.0300.me: "I will lead it myself"
 lam_faction.0300.me_tt: "I become this faction's leader. For its first year it holds together even if I stand alone."
 lam_faction.0300.acc1: "Chance they accept: #V [lam_ff_c1.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc2: "Chance they accept: #V [lam_ff_c2.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_faction.0300.acc3: "Chance they accept: #V [lam_ff_c3.MakeScope.Var('lam_ff_acc').GetValue|0]%#!"
 lam_ff_accepted_title: "[lam_fac_new.GetShortUIName] agrees to lead the faction"
 lam_ff_refused_title: "[lam_ff_no.GetShortUIName] refuses to lead the faction"
 lam_fac_stage_9: "#weak Underground - a banned faction, biding its time in hiding#!"
 lam_fac_ban_decision: "Outlaw the Factions"
 lam_fac_ban_decision_desc: "The court's factions are gnawing at the crown. This is the last resort, like dissolving a parliament: it costs great prestige and gold, and every vassal resents the edict. While the ban stands, informers must be paid (-0.5 prestige a month, -5% domain tax). In return, factions become illegal in principle. The timid leave; only the hard core remains in the dark - meeting by night, spreading pamphlets, skimming coin through the offices they hold, and rising at last if they hold together. Every move risks exposure. Those leaders and core members carry a criminal secret: uncover it through your spies and it becomes grounds to imprison them, or a hook to hold over them."
 lam_fac_ban_decision_tooltip: "Outlaw the factions"
 lam_fac_ban_need_foe_tt: "There is a faction that bears a grudge against me"
 lam_fac_ban_power_tt: "My military strength exceeds the combined strength of every disaffected faction"
 lam_fac_ban_decision_effect_tt: "Outlaw every faction, or all but the crown's own party."
 lam_faction.0900.t: "The Edict Against Factions"
 lam_faction.0900.desc: "As the edict was read, silence fell over the hall. From this day, to band together without the ruler's leave is treason. Some bowed their heads; some avoided each other's eyes. And some showed nothing at all - those are the ones to watch."
 lam_faction.0900.a: "Outlaw every faction"
 lam_faction.0900.a_tt: "Every faction is outlawed. Every vassal resents the edict (-20, 5 years). Each faction's head chooses to disband quietly or go underground - more disband the stronger and more feared the crown; under a weak crown (below 35) most hide. A disbanded faction leaves its heritage behind. One that goes underground loses its fair-weather friends and keeps its core; while hiding it has only half its strength (it needs 20% to rise). Its head and core hold the criminal secret 'Outlawed Faction' - grounds to imprison. Imprison the head of a hiding faction and it is crushed; the crown gains prestige and dread. Under the edict a faction can be founded only underground. An underground faction shows only as far as the spies have dug. While the edict stands every faction not disbanded is underground; only a rising shows one for what it is."
 lam_faction.0900.b: "Outlaw all but the crown's party"
 lam_faction.0900.b_tt: "Only the crown's party remains in the open; the rest are outlawed as above, and every vassal resents it just the same. If there is no crown's party, the most loyal faction becomes it."
 lam_faction.0900.c: "Not yet"
 lam_fac_unban_decision: "Lift the Edict Against Factions"
 lam_fac_unban_decision_desc: "Lift the edict. The hidden factions will show their faces again, and the court will stir for a year."
 lam_fac_unban_decision_tooltip: "Lift the edict"
 lam_fac_banned_opinion: "Outlawed the factions"
 lam_fac_outlaw_modifier: "Member of an Outlawed Faction"
 lam_fac_outlaw_modifier_desc: "Belongs to an outlawed faction: watched, passed over, whispered about."
 trait_lam_fac_member: "Faction Member"
 trait_lam_fac_member_lead: "Head of [ROOT.Char.Custom('LamFacName')]"
 trait_lam_fac_member_0: "[ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamFacName')]"
 trait_lam_fac_member_1: "[ROOT.Char.MakeScope.Var('lam_bloc').Char.GetHouse.GetNameNoTooltip] House Faction"
 trait_lam_fac_member_2: "The Black Faction"
 trait_lam_fac_member_3: "The White Faction"
 trait_lam_fac_member_4: "The Blue Faction"
 trait_lam_fac_member_5: "The Red Faction"
 trait_lam_fac_member_desc: "Belongs to a faction at court."
 trait_lam_fac_member_desc_lead: "Leads this faction."
 trait_lam_fac_member_desc_core: "Of the faction's core, bound by blood, friendship, or deep conviction."
 trait_lam_fac_member_desc_client: "A client of the faction, held by interest."
 trait_lam_fac_member_desc_sym: "A sympathiser only; may drift away when the wind changes."
 lam_found_faction_no_war_tt: "Not at war with my liege"
 lam_found_faction_followers_tt: "There is a court where a faction can be founded (in my own court, two vassals willing to lead it; in my liege's court I can stand alone; under a liege's edict, only underground)"
 lam_fac_ban_line: "#N [Character.Custom('LamFacBan')]#!"
 lam_fac_ban_line_tt: "Factions are outlawed. Each banned faction's head disbanded it or took it underground - the stronger and more feared the crown, the more obey; a weak crown's edict is laughed at. A hiding faction has only half its strength (it needs 20% to rise), petitions and clashes with no one, and its members lose prestige. Imprison the head of a hiding faction and it is crushed: it breaks up, the others in hiding take fright, and the crown gains prestige and dread. New factions are born only underground. This window shows an underground faction only as far as the spies have dug ('Dig into the Underground'). While the edict stands every faction not disbanded is underground; only a rising shows one for what it is. It ends with a new ruler or by decision; an underground faction that lasts it out comes back 'having endured'."
 lam_fac_ban_all: "Edict against all factions"
 lam_fac_ban_crown: "Edict: only the crown's party allowed"
 lam_fac_ban_decision_confirm: "Issue the edict"
 lam_fac_unban_decision_confirm: "Lift the edict"
 lam_secret_outlaw_faction: "Outlawed Faction"
 lam_secret_outlaw_faction_desc: "Leads, or remains at the core of, a faction outlawed by edict"
 lam_secret_outlaw_found_title: "I have found out that [secret_owner.GetShortUIName] belongs to an outlawed faction"
 lam_fac_edict_opinion: "Edict against factions"
 lam_fac_bar_cohesion: "Cohesion"
 lam_fac_age_0: "A new faction"
 lam_fac_age_1: "A settled faction"
 lam_fac_age_2: "An old faction"
 lam_fac_age_3: "A venerable faction"
 lam_fac_hist_tt: "#T History#!\nFounded [Character.MakeScope.Var('lam_fac_founded').GetValue|0], [Character.MakeScope.Var('lam_fac_age').GetValue|0] years ago · #high [Character.Custom('LamFacAgeTier')]#!\nFounder: [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · current head is generation [Character.MakeScope.Var('lam_fac_gen').GetValue|0][Character.Custom('LamFacCofLine')]\n\nRisings [Character.MakeScope.Var('lam_fac_h_rise').GetValue|0] · purges survived [Character.MakeScope.Var('lam_fac_h_purge').GetValue|0] · candidates crowned [Character.MakeScope.Var('lam_fac_h_crown').GetValue|0]\nPromises kept [Character.MakeScope.Var('lam_fac_h_kept').GetValue|0] · betrayed [Character.MakeScope.Var('lam_fac_h_betray').GetValue|0] · clashes won/lost [Character.MakeScope.Var('lam_fac_h_won').GetValue|0]/[Character.MakeScope.Var('lam_fac_h_lost').GetValue|0] · deals with the lord [Character.MakeScope.Var('lam_fac_h_deals').GetValue|0]\n\n#weak The older a faction, the more it draws people, the tighter it holds, and the less easily it breaks up when weak (from 15 years it holds on even with a few). Its history retains its standing, but it may still join a faction with a shared cause.#!"
 lam_fac_old_modifier: "Head of an Old Faction"
 lam_fac_old_modifier_desc: "Carries the name of a long-standing faction."
 lam_fac_venerable_modifier: "Head of a Venerable Faction"
 lam_fac_venerable_modifier_desc: "The name of a faction decades old lends this person weight."
 lam_fac_deal_interaction: "Deal with the Faction"
 lam_fac_deal_interaction_desc: "Sit down with this faction's head: give something, ask something. What I give belongs to the faction, not to its head alone, and how it is shared can bind the faction or crack it."
 lam_fac_deal_interaction_tt: "Choose what to give and what to ask."
 lam_fac_deal_cd_tt: "Dealt with this faction recently"
 lam_faction.1000.t: "What I Will Give"
 lam_faction.1000.desc: "[lam_deal_lead.GetTitledFirstName] takes the seat across from me. Those behind them are watching to see what they carry home."
 lam_faction.1000.seat: "A seat on the council"
 lam_faction.1000.seat_tt: "Promise a council seat to one of this faction within a year. I choose who: if only the head sits, the rest resent it; if another sits, the faction holds together."
 lam_faction.1000.county: "A county"
 lam_faction.1000.county_tt: "Grant my least developed demesne county to one of this faction. I choose the recipient once agreed; giving it to the head's rival drives a wedge into the faction."
 lam_faction.1000.gold: "Gold"
 lam_faction.1000.gold_tt: "The gold passes through the head's hands to the faction. A generous or just head shares it (cohesion rises); a greedy or ambitious one keeps it (cohesion falls, members resent it); others reward only the core."
 lam_faction.1000.marriage: "A marriage"
 lam_faction.1000.marriage_tt: "Promise a marriage or betrothal between my family and someone of this faction (or their family) within two years."
 lam_faction.1000.law: "One step off the crown's authority"
 lam_faction.1000.law_tt: "Lower crown authority by one step at once."
 lam_faction.1000.heir: "The heir they back"
 lam_faction.1000.heir_tt: "Designate the child supported by this faction, paying the prestige, influence or piety required by the current government."
 lam_faction.1000.amnesty: "Amnesty"
 lam_faction.1000.amnesty_tt: "Under the edict, allow this one faction in the open; it leaves the underground."
 lam_faction.1000.bribe: "A private payment to the head"
 lam_faction.1000.bribe_tt: "Gold for the head's own purse, not the faction's. They will think well of me but carry the secret 'Bought'; if it comes out, the faction's cohesion collapses and the head may be pushed aside. An honest or just head is likely to refuse."
 lam_faction.1000.x: "Never mind"
 lam_faction.1010.t: "What I Will Ask"
 lam_faction.1010.desc: "Now it is my turn to say what I want."
 lam_faction.1010.oath: "An oath of loyalty"
 lam_faction.1010.oath_tt: "For five years this faction will not speak out or gather against the crown. The grudge may remain, but it will not show."
 lam_faction.1010.heir: "Back my heir"
 lam_faction.1010.heir_tt: "For five years this faction backs my lawful heir."
 lam_faction.1010.disband: "Disband"
 lam_faction.1010.disband_tt: "The faction disbands. The older it is, the harder this is to accept."
 lam_faction.1010.counter: "Press their rival faction"
 lam_faction.1010.counter_tt: "Use this faction against its largest rival: the rival loses favour and takes a grievance."
 lam_faction.1010.arms: "Lend me their swords"
 lam_faction.1010.arms_tt: "If I am at war, the head and the core join my side now; otherwise they join any war I begin within two years."
 lam_faction.1010.law_support: "Do not oppose a stronger crown"
 lam_faction.1010.law_support_tt: "For three years this faction's members will not hold a strong crown authority against the crown."
 lam_faction.1010.back: "Choose again"
 lam_faction.1020.t: "The Offer"
 lam_faction.1020.open: "I put it to [lam_deal_lead.GetTitledFirstName].\n\n"
 lam_faction.1020.g.seat: "#P I give:#! a council seat within a year.\n"
 lam_faction.1020.g.county: "#P I give:#! a county.\n"
 lam_faction.1020.g.gold: "#P I give:#! gold.\n"
 lam_faction.1020.g.marriage: "#P I give:#! a marriage within two years.\n"
 lam_faction.1020.g.law: "#P I give:#! one step off the crown's authority.\n"
 lam_faction.1020.g.heir: "#P I give:#! the heir they back.\n"
 lam_faction.1020.g.amnesty: "#P I give:#! amnesty.\n"
 lam_faction.1020.g.bribe: "#P I give:#! a private payment to the head.\n"
 lam_faction.1020.a.oath: "#N I ask:#! a five-year oath of loyalty.\n"
 lam_faction.1020.a.heir: "#N I ask:#! backing for my heir (five years).\n"
 lam_faction.1020.a.disband: "#N I ask:#! that they disband.\n"
 lam_faction.1020.a.counter: "#N I ask:#! that they press their rival.\n"
 lam_faction.1020.a.arms: "#N I ask:#! their swords.\n"
 lam_faction.1020.a.law_support: "#N I ask:#! no opposition to a stronger crown (three years).\n"
 lam_faction.1020.chance: "\nChance they accept: #V [lam_deal_lead.MakeScope.Var('lam_deal_acc').GetValue|0]%#! (the weight of what is traded, the faction's cause, their favour and regard for me)"
 lam_faction.1020.a: "Make the offer"
 lam_faction.1020.back: "Start over"
 lam_faction.1020.x: "Never mind"
 lam_faction.1030.t: "To Whom"
 lam_faction.1030.desc: "The deal is struck. Now to decide who receives the land, and the whole faction waits to hear the name."
 lam_faction.1030.lead: "To the head, [lam_deal_lead.GetFirstName]"
 lam_faction.1030.lead_tt: "The head takes it all; the rest are put out (cohesion -10)."
 lam_faction.1030.r1: "To the core member [lam_deal_r1.GetFirstName]"
 lam_faction.1030.r1_tt: "It goes to a pillar of the faction (cohesion +5)."
 lam_faction.1030.r2: "To [lam_deal_r2.GetFirstName], at odds with the head"
 lam_faction.1030.r2_tt: "Raises the head's rival: the faction cracks, and the head resents me (cohesion -20)."
 lam_deal_yes_title: "A deal is struck with [lam_deal_lead.GetShortUINamePossessive] faction"
 lam_deal_no_title: "[lam_deal_lead.GetShortUINamePossessive] faction refuses the deal"
 lam_secret_bribed: "Bought"
 lam_secret_bribed_desc: "Took the lord's money for their own purse, not the faction's"
 lam_fac_bribed_opinion: "Took a private payment"
 lam_fac_hoarded_opinion: "Kept the faction's share"
 lam_fac_fair_share_opinion: "Shared fairly"
 lam_fac_passed_over_opinion: "Passed over for a share"
 lam_faction.0610.t: "The Hour to Rise"
 lam_faction.0610.desc: "My faction's blood is up. They are all watching my lips. Now, if I draw the sword, there are those who will follow. Or I could hold back a while longer."
 lam_faction.0610.a: "We rise"
 lam_faction.0610.a_tt: "Our faction presses the demand its cause allows on our liege (a claimant, independence, fewer crown rights; in Japan and China the realm's own ways). The core and close members stand with us; with no road, open defiance."
 lam_faction.0610.b: "Not yet"
 lam_faction.0610.b_tt: "Their nerve is checked for a year."
 lam_fac_command_interaction: "Command the Court Party"
 lam_fac_command_interaction_desc: "The court party is a faction in name only; in truth it is my own hand. I can call it to war, have it draw people in, or set it against another faction."
 lam_fac_command_interaction_tt: "Choose what the court party should do."
 lam_faction.1100.t: "Orders for the Court Party"
 lam_faction.1100.desc: "[lam_cp_lead.GetTitledFirstName] awaits my orders."
 lam_faction.1100.arms: "Take up arms (prestige)"
 lam_faction.1100.arms_tt: "If I am at war, the head and the core join my side now; otherwise they join my wars within two years. Once every two years."
 lam_faction.1100.recruit: "Draw people in (gold)"
 lam_faction.1100.recruit_tt: "With the treasury's gold, bring up to three politically engaged unaligned vassals into the court party. Once a year."
 lam_faction.1100.press: "Press the other factions (tyranny)"
 lam_faction.1100.press_tt: "The court party presses the largest other faction: it loses favour, takes a grievance, and its cohesion and engagement are shaken. Once every two years."
 lam_faction.1100.x: "Not now"
 lam_fac_head_demand_interaction: "Demand in the Faction's Name"
 lam_fac_head_demand_interaction_desc: "I lead a faction. I stand before my liege with its weight at my back."
 lam_fac_head_demand_interaction_tt: "Choose what to demand. Whether it is granted depends on our strength, our standing, the crown's strength and the liege's temperament. A refusal leaves us a grievance, and a cause for what comes next."
 lam_fac_head_demand_cd_tt: "A year must pass since the last demand (about #high [actor.MakeScope.ScriptValue('lam_fac_hd_cd_left_value')|0]#! months left)"
 lam_faction.1200.t: "In the Faction's Name"
 lam_faction.1200.desc: "I stand before my liege, my faction behind me. What will I demand?"
 lam_faction.1200.law: "Loosen the crown's authority"
 lam_faction.1200.heir: "Name the heir we back"
 lam_faction.1200.tolerance: "Tolerance for our tongue and prayers"
 lam_faction.1200.gold: "Our share in gold"
 lam_faction.1200.amnesty: "Amnesty for our faction"
 lam_faction.1200.x: "Never mind"
 lam_faction.1210.desc: "I have said it. My liege's eyes narrow."
 lam_faction.1210.chance: "\n\nChance it is granted: #V [ROOT.Char.MakeScope.Var('lam_hd_acc').GetValue|0]%#!"
 lam_faction.1210.a: "Press it"
 lam_faction.1210.x: "Withdraw"
 lam_hd_yes_title: "My liege has granted our faction's demand"
 lam_hd_no_title: "My liege has refused our faction's demand. My people are grinding their teeth"
 lam_fac_head_arms_decision: "Call the Faction to Arms"
 lam_fac_head_arms_decision_desc: "Call my faction's core to my wars. Not all will come, but the bond with those who do grows deeper."
 lam_fac_head_arms_decision_tooltip: "Call the faction to arms"
 lam_fac_head_arms_decision_tt: "Ask eligible core members and supporters to join wars you lead. Cohesion rises by 5 only if reinforcements actually join. The request has a three-year cooldown."
 lam_fac_head_arms_cd_tt: "Called the faction to arms recently (3 years)"
 lam_fac_head_order_decision: "Keep Order in the Faction"
 lam_fac_head_order_decision_desc: "Elevate a trusted colleague or part ways with a dissenter. Changing the faction’s succession candidate requires a council vote."
 lam_fac_head_order_decision_tooltip: "Keep order in the faction"
 lam_fac_head_order_cd_tt: "Kept order recently (1 year)"
 lam_faction.1300.t: "Order in the Faction"
 lam_faction.1300.desc: "A faction is made of people, and people must be governed."
 lam_faction.1300.out: "Dismiss [lam_ds_out.GetShortUIName]."
 lam_faction.1300.out_tt: "Expel the one who likes me least; they may join no faction for two years. Cohesion +5."
 lam_faction.1300.up: "Promote [lam_ds_up.GetShortUIName] to the core."
 lam_faction.1300.up_tt: "Promote the selected supporter to the core. Their status and membership are secured for five years; faction cohesion rises by 3."
 lam_faction.1300.heir: "Put support for [lam_ds_heir.GetShortUIName] to a vote."
 lam_faction.1300.heir_tt: "For five years, back the liege's child who thinks best of me."
 lam_faction.1300.x: "Not now"
 lam_faction.1400.t: "The Realm in Our Hands"
 lam_faction.1400.desc: "Our faction has sustained military and political strength, captured key offices and secured leverage over the ruler. We can now take control, provided those foundations still hold."
 lam_faction.1400.a: "Stand behind the throne"
 lam_faction.1400.a_tt: "Revalidate the current foundations and take power. Losing representation and political support can cost control."
 lam_faction.1400.b: "I do not want that seat - not yet"
 lam_faction.1410.t: "A Crown on Strings"
 lam_faction.1410.desc: "Again today [lam_pm_lead.GetTitledFirstName] spoke first, and the council followed. I watched from the throne. My seal is in my hand, but I do not decide what it seals."
 lam_faction.1410.a: "...One day"
 lam_faction.1410.a_tt: "[lam_pm_lead.GetShortUINamePossessive] faction holds the realm: I am hooked, a share of the crown's income is taken, and my prestige and my vassals' respect wane. I am freed if that faction falls below half the vassals' strength, or I can cut the strings myself with the decision 'Palace Coup'."
 lam_fac_coup_decision: "Palace Coup"
 lam_fac_coup_decision_desc: "Cut the strings. Succeed, and the power behind the throne is seized and the throne is mine again. Fail, and the strings tighten and their faction takes up arms."
 lam_fac_coup_decision_tooltip: "Palace coup"
 lam_fac_coup_decision_tt: "The chance depends on my intrigue, prowess at arms and dread; a close-knit faction is harder to break."
 lam_fac_coup_cd_tt: "Attempted a coup recently (3 years)"
 lam_coup_yes_title: "The coup succeeds. [lam_cu_lead.GetShortUIName] is in chains"
 lam_coup_no_title: "The coup fails. [lam_cu_lead.GetShortUINamePossessive] faction draws steel"
 lam_pm_freed_title: "The strings are cut. The throne is mine again"
 lam_fac_puppet_modifier: "A Crown on Strings"
 lam_fac_puppet_modifier_desc: "A faction holds the realm; the throne speaks with another's mouth."
 lam_fac_puppeteer_modifier: "The Shadow Behind the Throne"
 lam_fac_puppeteer_modifier_desc: "It is this person, not the crown, who moves the realm."
 lam_fac_btn_detail: "Details"
 lam_fac_btn_detail_tt: "See this faction's banner, its line of heads, members, renown and legacies, relations and history."
 lam_fac_detail_title: "Faction"
 lam_fac_detail_banner_tt: "Flies the arms of its founder's house, [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName]."
 lam_fac_detail_line1: "#high [Character.Custom('LamFacAgeTier')]#! · founded [Character.MakeScope.Var('lam_fac_founded').GetValue|0] ([Character.MakeScope.Var('lam_fac_age').GetValue|0] years) · head of generation [Character.MakeScope.Var('lam_fac_gen').GetValue|0]"
 lam_fac_detail_line2: "[Character.Custom('LamFacStance')] · [Character.Custom('LamFacStage')] · Political [Character.MakeScope.Var('lam_cr_share').GetValue|0]% · Council [Character.MakeScope.ScriptValue('lam_pol_seats_value')|0] seats"
 lam_fac_detail_line3: "#weak Founder:#! [Character.MakeScope.Var('lam_fac_founder').Char.GetShortUIName] · #weak Members:#! [Character.MakeScope.Var('lam_fac_count').GetValue|0]"
 lam_fac_detail_heads: "Line of Heads"
 lam_fac_detail_head_now: "#high Now:#! [Character.GetShortUIName]"
 lam_fac_detail_head_past: "[Character.GetShortUIName]"
 lam_fac_detail_core: "The Core"
 lam_fac_detail_clients: "Clients"
 lam_fac_detail_sym: "Sympathisers"
 lam_fac_detail_renown: "Renown #V [Character.MakeScope.Var('lam_fac_renown').GetValue|0]#!"
 lam_fac_detail_renown_tt: "Gathered each year by age and weight, and by events: a candidate crowned, a rising, a promise kept, a clash won, a deal. The faction's name and standing; it also decides how much survives if the faction falls. Only a faction of three or more members gathers it."
 lam_fac_leg_buy: "Take"
 lam_fac_leg_org_line: "Organisation [Character.MakeScope.Var('lam_fac_leg_org').GetValue|0]/3 #weak (history [Character.MakeScope.Var('lam_fac_tr_org').GetValue|0])#!"
 lam_fac_leg_org_tt: "Cohesion settles 5 higher per level.\n#weak Earned by: each succession of heads 1, each purge survived 2, each clash lost 1.#!"
 lam_fac_leg_ties_line: "Connections [Character.MakeScope.Var('lam_fac_leg_ties').GetValue|0]/3 #weak (history [Character.MakeScope.Var('lam_fac_tr_ties').GetValue|0])#!"
 lam_fac_leg_ties_tt: "Draws people more easily: +3 to joining per level.\n#weak Earned by: each step of age 2, each candidate crowned 2.#!"
 lam_fac_leg_purse_line: "Purse [Character.MakeScope.Var('lam_fac_leg_purse').GetValue|0]/3 #weak (history [Character.MakeScope.Var('lam_fac_tr_purse').GetValue|0])#!"
 lam_fac_leg_purse_tt: "Members pay more into the purse each season, and the faction can offer more gold when courting the unaligned. (The fund goes into the head's own purse, which the head manages.)\n#weak Earned by: each deal struck with the lord 1.#!"
 lam_fac_leg_arms_line: "Swords [Character.MakeScope.Var('lam_fac_leg_arms').GetValue|0]/3 #weak (history [Character.MakeScope.Var('lam_fac_tr_arms').GetValue|0])#!"
 lam_fac_leg_arms_tt: "+10% per level to answering a call to arms or rallying to the crown.\n#weak Earned by: each clash won 2, each rising 1.#!"
 lam_fac_leg_cause_line: "Cause [Character.MakeScope.Var('lam_fac_leg_cause').GetValue|0]/3 #weak (history [Character.MakeScope.Var('lam_fac_tr_cause').GetValue|0])#!"
 lam_fac_leg_cause_tt: "Demands are heard more often: +5% per level (+10 weight with AI lords).\n#weak Earned by: each promise kept by the lord 2, each promise broken 1.#!"
 lam_fac_leg_will_line: "The Will [Character.MakeScope.Var('lam_fac_leg_will').GetValue|0]/1"
 lam_fac_leg_will_tt: "If this faction falls (disbanded, its head dead, its realm gone), its renown, traditions, founding year and generations are kept once, for twenty years, by its last head (or strongest core member). If they, their house, kin or friends found a new faction, it takes them all up; the Will is then spent and never returns in that line. Without the Will, only a quarter of the renown survives, for ten years.\n#weak Earned by: reaching the age of an old faction.#!"
 lam_fac_detail_relations: "Relations with Other Factions"
 lam_fac_detail_relations_tt: "Sworn amity: the heads swore amity; they do not clash. Sworn enemies: hostile, and their heads are rivals or their houses at feud. Rivals: hostile. Friendly: close. Neutral: neither. On a court issue, the factions on one side form its coalition."
