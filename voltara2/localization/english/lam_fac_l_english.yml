 lam_faction.0600.t: "The Night the Banners Rise"
 lam_faction.0600.desc: "Word came from [lam_abs_lead.GetTitledFirstName]: the bloc is rising against our liege. Having stood under the same banner, I must now decide."
 lam_faction.0600.a: "Rise with them."
 lam_faction.0600.b: "Stay loyal to my liege, and part ways with them."
 lam_faction.0600.c: "Say nothing, for now."
