 lam_faction.3020.t: "The Faction Passes to Me"
 lam_faction.3020.desc: "I lead this faction now, after [lam_sb_old.GetShortUIName]. Its name, its history and its open promises have come with it."
 lam_faction.3020.promise: "\n\n· The lord's promise: [ROOT.Char.Custom('LamFacPromiseWhat')] (about [ROOT.Char.MakeScope.ScriptValue('lam_fac_promise_left_value')|0] months left)"
