 lam_faction.0100.d.heir: "\"Of all your children, it is [lam_pet_heir.GetFirstName] who can bear the weight of the crown. We believe it, and so do our people. Name them your heir.\""
 lam_faction.0100.d.law: "\"The crown's hand lies too heavy. Your officers pry even into the affairs of our own lands. Loosen the reins.\""
 lam_faction.0100.d.no_revoke: "\"Everyone saw you take a vassal's land. Who is next? Give us your word that the small lords' holdings will not be touched.\""
 lam_faction.0100.d.tolerance: "\"Our tongue and our prayers are scorned at this court. Treat us as the subjects of the same king that we are.\""
 lam_faction.0100.d.faith: "\"There are those on your council who do not keep the true faith. Give their seats back to the faithful.\""
 lam_faction.0100.d.campaign: "\"Our swords are rusting. Years have passed without a field to fight on. Promise us a campaign - glory is meant to be shared.\""
 lam_faction.0100.d.council: "\"The council's seats always go to the same people. Our voice belongs in that room too.\""
 lam_faction.0100.d.reward: "\"When your throne shook, we stood beside you with our swords drawn. Remember that loyalty.\""
 lam_faction.0100.d.redress: "\"Do you know how we are treated at this court? I cannot hold my people together like this much longer.\""
 lam_faction.0100.liar: "\n\n#italic There is no trust in their eyes. They remember the promises I broke. My word is worth nothing now.#!"
 lam_faction.0100.heir: "Name [lam_pet_heir.GetFirstName] my heir"
 lam_faction.0100.law: "Loosen the crown's authority by a step"
 lam_faction.0100.tolerance: "Grant them tolerance"
 lam_faction.0100.reward: "Reward their loyalty generously"
 lam_faction.0100.redress: "Make proper amends, and pay for it"
 lam_faction.0100.promise: "I give my word"
 lam_faction.0100.promise.council_tt: "Within a year, someone of this faction must sit on my council. Kept, their favour rises greatly; broken, they will feel betrayed for five years."
