 lam_faction.0400.t: "The Court after a Purge"
 lam_faction.0400.desc: "The evening [lam_purged.GetTitledFirstName] was taken, the court was strangely quiet. Low voices passed in every corridor, and whenever eyes met, everyone looked down first."
 lam_faction.0400.desc.head: "\n\nThey were the head of [lam_purge_lead.GetFirstNamePossessive] bloc. Those who lose their head either scatter or grind their teeth."
 lam_faction.0400.desc.core: "\n\nThey were at the heart of [lam_purge_lead.GetFirstNamePossessive] bloc. [lam_purge_lead.GetFirstName] said nothing, and the silence weighs more."
 lam_faction.0400.a: "Reassure the rest: the crime is one person's alone."
 lam_faction.0400.b: "Make an example of them. Everyone will have seen."
 lam_faction.0400.c: "Break that bloc altogether."
 lam_faction.0500.t: "The Night They Split"
 lam_faction.0500.desc: "In the middle of the audience hall, [lam_fs_new.GetTitledFirstName] turned their back on [lam_fs_lead.GetTitledFirstName]. People who stood long under one banner part ways tonight, one by one stepping behind [lam_fs_new.GetFirstName].\n\nBoth of them look at me."
 lam_faction.0500.a: "Stand with [lam_fs_lead.GetFirstName]."
 lam_faction.0500.b: "Stand with [lam_fs_new.GetFirstName]."
 lam_faction.0500.c: "Take no side."
