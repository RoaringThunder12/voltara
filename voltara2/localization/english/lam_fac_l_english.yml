 rule_lam_fac_special_govs: "Living Factions: Japan and China"
 rule_lam_fac_special_govs_desc: "Japan's court and shogunate and the Chinese celestial and meritocratic states run their own court politics in vanilla (ceremonial regents, imperial policy, ministers). By default (Compatible) living factions run there too, vanilla's own factions stay open, and a rising faction rises through the realm's own factions (restoring the liege, replacing the regent, imperial policy, fracturing). The power behind the throne takes no regency there. Administrative realms (Byzantium and others) work the same way."
 setting_lam_fac_special_govs_exclude: "Exclude"
 setting_lam_fac_special_govs_exclude_desc: "No living factions in these realms."
 setting_lam_fac_special_govs_compatible: "Compatible (default)"
 setting_lam_fac_special_govs_compatible_desc: "Factions run, and vanilla's own politics stay alive. Risings use the realm's own factions."
