l_english:
 vt_slavery_status_allowed:0 "Realm Slavery Law: #high Allowed#!"
 vt_slavery_status_banned:0 "Realm Slavery Law: #high Banned#!"
 vt_slavery_status_no_realm:0 "Realm Slavery Law: No ruling realm"
 vt_slavery_tooltip_allowed:0 "#T Slavery is allowed#!\nThe governing realm is [GetPlayer.GetTopLiege.GetPrimaryTitle.GetName], ruled by [GetPlayer.GetTopLiege.GetName].\n\nIts law permits slavery throughout the realm, including its vassals. The top liege's law applies even if an intermediate liege has a different local law. Independent rulers use their own realm law.\n\nIndividual slavery interactions may have additional requirements."
 vt_slavery_tooltip_banned:0 "#T Slavery is banned#!\nThe governing realm is [GetPlayer.GetTopLiege.GetPrimaryTitle.GetName], ruled by [GetPlayer.GetTopLiege.GetName].\n\nSlavery is not permitted by the governing realm's law. The top liege's law applies throughout the realm, including its vassals. Independent rulers use their own realm law."
 vt_slavery_tooltip_no_realm:0 "#T No governing realm law#!\nYou are not a landed ruler. Voltara's realm slavery permission applies to landed rulers and their governing realm. This indicator does not treat an adventurer's current location as their liege's realm."
