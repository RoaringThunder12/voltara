l_english:
 vbr_blood_rite_government:0 "Blood-Rite"
 vbr_blood_rite_government_adjective:0 "Blood-Rite"
 vbr_blood_rite_government_desc:0 "A tribal elective order of the Gorilla-Men. Clan electors favor proven strength and standing; a lawful Blood-Rite challenge can overturn succession through compulsory single combat to the death."
 tradition_vbr_blood_rite_name:0 "Blood-Rite"
 tradition_vbr_blood_rite_desc:0 "No crown places its bearer beyond the circle. Gorilla-Man adventurers and landed rulers may challenge a Gorilla-Man liege or neighboring ruler. The combat admits no refusal: victory, death, and the titles at stake are bound together."
 culture_parameter_vbr_blood_challenges:0 "Gorilla-Man adventurers and rulers may issue compulsory lethal Blood-Rite title challenges against a Gorilla-Man liege or neighboring ruler."
 vbr_blood_elective_law:0 "Blood-Rite Elective"
 vbr_blood_elective_law_effects:0 "The ruler and Gorilla-Man clan vassals elect an adult Gorilla-Man successor from family, claimants, vassals, and councillors. Prowess and victories carry special weight. A lethal Blood-Rite challenge overrides the election for the contested title."
 vbr_blood_elective:0 "Blood-Rite Elective"
 vbr_vote_prowess:0 "Proven Strength"
 vbr_vote_great_prowess:0 "Exceptional Strength"
 vbr_vote_victor:0 "Blood-Rite Victor"
 vbr_vote_bravery:0 "Courage in the Circle"
 vbr_blood_victor:0 "Blood-Rite Victor"
 vbr_blood_victor_desc:0 "Victory in compulsory lethal single combat has affirmed this ruler’s standing among the clans."
 vbr_challenge_interaction:0 "Invoke the Blood-Rite"
 vbr_challenge_interaction_desc:0 "Choose a title held by this Gorilla-Man ruler. They cannot refuse a lawful duel to the death. If you win, you take the selected title and every lower-ranked title personally held by the defender, together with their vassals. Equal-ranked and higher titles are not part of the prize. If you lose, you die and the defender keeps the challenged title. Adventurers may challenge rulers of the county containing their camp or adjacent counties, including those rulers’ lieges."
 vgblood.1.t:0 "The Blood-Rite Is Invoked"
 vgblood.1.desc:0 "[scope:vbr_challenger.GetTitledFirstName] has invoked the Blood-Rite for [scope:vbr_title.GetName]. The clans witness the claim. Neither the challenged ruler nor the challenger may buy release or send a champion. The loser dies. If the challenger wins, the named title and every lesser title personally held by the defender pass with their subjects to the victor."
 vgblood.1.a:0 "Enter the circle. Only one of us leaves."
 vgblood.1.b:0 "The title is no longer lawfully at stake."
 vgblood.4.t:0 "Blood Before the Clans"
 vgblood.4.desc:0 "The circle is silent. My opponent is dead, and the witnesses proclaim my victory. The contested title is mine, taken or defended under the Blood-Rite. The clans will remember what they saw when next they cast their votes."
 vgblood.4.a:0 "Let the witnesses carry the judgment."
 vgblood.5.t:0 "The Circle Cannot Be Formed"
 vgblood.5.desc:0 "The circumstances required for the duel no longer hold. The challenge is void, its title remains where it stands, and neither fighter is condemned by an uncompleted rite."
 vgblood.5.a:0 "Release the witnesses."
