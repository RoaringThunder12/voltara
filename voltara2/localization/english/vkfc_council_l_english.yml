 vkfc.20.t: "On What Terms Shall We Unite?"
 vkfc.20.desc: "The chiefs gather beneath their own banners. Each has brought grievances, ambitions, and the fear that a common crown will become another conqueror. Before they offer their oaths, they demand to know what kind of union I intend to build."
 vkfc.20.a: "Their clans will retain a voice and their customs."
 vkfc.20.a.tt: "Delegates are more likely to seek a negotiated oath with guarantees of autonomy."
 vkfc.20.b: "Let my treasury demonstrate our common purpose."
 vkfc.20.b.tt: "Spend 100 gold on the gathering. Delegates are more likely to offer recognition."
 vkfc.20.c: "One cause requires a single command."
 vkfc.20.c.tt: "More delegates will consider a binding oath, but proud chiefs are also more likely to refuse."
 vkfc.21.t: "The Price of a Banner"
 vkfc.21.desc: "[vkfc_delegate.GetTitledFirstName] approaches my seat. A proclamation alone will not win this banner: its warriors expect security for their homes and a place in the order we build. A bargain here could turn attendance into a genuine endorsement of my rule."
 vkfc.21.a: "Your clan's autonomy will be guaranteed."
 vkfc.21.a.tt: "Secure a conditional oath and an endorsement for empire formation. Promise this chief five years of autonomy."
 vkfc.21.b: "Accept this silver as the first fruit of our alliance."
 vkfc.21.b.tt: "Give this chief 75 gold in exchange for recognition and an endorsement for empire formation."
 vkfc.21.c: "Let the chief decide before the assembled banners."
 vkfc.21.c.tt: "Make no concession. This chief will choose an oath or refusal during the oath-taking stage."
 vkfc.22.t: "Will the Banners Bear a Crown?"
 vkfc.22.desc: "The arguments have ended, and the chiefs await the final reckoning. Those who offered only their presence cannot be counted as supporters. A new empire requires the endorsement of at least two independent chiefs, 500 prestige, and 100 gold. If the banners stand behind me, I must choose the promise by which my reign will be judged."
 vkfc.22.a: "Count the oaths, and hear the judgment of the council."
 vkfc.22.a.tt: "At the council's conclusion, eligible founders choose their imperial promise. Without sufficient endorsements and resources, the gathering ends without creating the empire."
 vkfc_stage_1_log: "The summons have closed."
