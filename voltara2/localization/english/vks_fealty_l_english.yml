 vks_offer_gold:0 "Gift 150 gold"
 vks_offer_prestige:0 "Pledge 500 prestige"
 vks_offer_piety:0 "Consecrate the pact: 500 piety"
 vks_offer_herd:0 "Transfer 500 livestock"
 vks_offer_hook:0 "Call in a hook"
 vks_good_relations:0 "Trust in the emperor"
 vks_bad_relations:0 "Distrust of the emperor"
 vks_ambition:0 "Ambition for independence"
