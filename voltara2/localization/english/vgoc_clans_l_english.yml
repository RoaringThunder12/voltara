l_english:
 vgoc_market_moot:0 "Convene the Many-Purse Moot"
 vgoc_market_moot_desc:0 "Bring the clans together to settle market rights, measures, and debts. Shared standards can advance clan craft; favoring one purse may win prestige at the cost of local trust."
 vgoc_market_moot_tooltip:0 "Convene the Many-Purse Moot"
 vgoc_market_moot_confirm:0 "Gather the clans"
 vgoc_salvage:0 "Commission a Clan Salvage Survey"
 vgoc_salvage_desc:0 "Send appraisers to the abandoned works around the capital. Recovered craft can improve Goblin workshops, but unsafe salvage may damage the county."
 vgoc_salvage_tooltip:0 "Commission a Clan Salvage Survey"
 vgoc_salvage_confirm:0 "Gather the clans"
 vgoc_oath_assembly:0 "Convene the Ember-Oath Assembly"
 vgoc_oath_assembly_desc:0 "Hear the obligations of warbands and hearths before witnesses. Decide whether military honor rests on a tally of warriors, a fulfilled promise, or the households that sustain them."
 vgoc_oath_assembly_tooltip:0 "Convene the Ember-Oath Assembly"
 vgoc_oath_assembly_confirm:0 "Gather the clans"
 vgoc_muster:0 "Inspect the Warband Supply"
 vgoc_muster_desc:0 "Inspect arms, pack routes, and stores with the clan captains. The gathering can advance Orc craft and strengthen the capital without requiring a war."
 vgoc_muster_tooltip:0 "Inspect the Warband Supply"
 vgoc_muster_confirm:0 "Gather the clans"
 vgoc.100.t:0 "Every Purse Has a Witness"
 vgoc.100.desc:0 "Three Goblin clans have arrived with three different sets of weights. Each insists its measure is the oldest, and each can name a cousin cheated by the other two. The market stands idle while the witnesses count the same grain again."
 vgoc.100.a:0 "Commission a common weight and publish its measure."
 vgoc.100.b:0 "Use my household measure. I will answer for it."
 vgoc.100.c:0 "Let the market keepers compare their sealed standards."
 vgoc.101.t:0 "The Weight of a Promise"
 vgoc.101.desc:0 "The new measure is sound, but the clans want to know who will keep it. A single keeper could sell favors; a keeper from every clan could turn each sale into another council."
 vgoc.101.a:0 "Rotate the keeper and require two witnesses."
 vgoc.101.b:0 "Fund a permanent bench of independent appraisers."
 vgoc.101.c:0 "Keep the standard in my treasury."
 vgoc.110.t:0 "The Door Beneath the Scrap"
 vgoc.110.desc:0 "The surveyors uncover a workshop behind a collapsed wall. Copper gauges hang beside unfamiliar tools. One crew wants to haul everything out before the rains; another points to the beams holding up the only exit."
 vgoc.110.a:0 "Brace the roof and catalogue the tools."
 vgoc.110.b:0 "Take the valuable metal now."
 vgoc.110.c:0 "Have our reclamation crews dismantle it safely."
 vgoc.111.t:0 "The Maker Left No Name"
 vgoc.111.desc:0 "A recovered gauge measures heat by the bending of two metals. The salvage clans argue over who may claim the invention. No surviving mark names its maker, and the crews who found it have already begun making copies."
 vgoc.111.a:0 "The finder deserves payment; the knowledge belongs to all."
 vgoc.111.b:0 "Grant the finders a temporary monopoly."
 vgoc.111.c:0 "Test every copy in the reclamation yard."
 vgoc.120.t:0 "The Debt That Outlived Its Witness"
 vgoc.120.desc:0 "A creditor presents a cord of debt-knots. The debtor presents another, shorter cord. The witness died last winter, and neither household will accept the other’s account. Their clans are gathering at the market gate."
 vgoc.120.a:0 "Hear both households and divide the disputed balance."
 vgoc.120.b:0 "Pay the disputed portion from my purse."
 vgoc.120.c:0 "Read the copies kept in the market archive."
 vgoc.121.t:0 "Smoke from the Shared Furnace"
 vgoc.121.desc:0 "The busiest workshop has begun burning cheap scrap with its fuel. Its smoke settles over the neighboring homes. The artisans fear losing their orders; the households fear another season of coughing children."
 vgoc.121.a:0 "Restrict the fuel and repair the flue."
 vgoc.121.b:0 "Move the dirtiest work beyond the houses."
 vgoc.121.c:0 "Let the reclamation masters sort the scrap."
 vgoc.200.t:0 "Who Kept the Ember?"
 vgoc.200.desc:0 "At the oath assembly, a captain claims the place of honor for bringing the most warriors. The hearth-keepers answer that another band guarded the winter grain and returned every borrowed pack beast. Both duties were sworn beside the same ember."
 vgoc.200.a:0 "Honor the promise fulfilled, not merely the largest band."
 vgoc.200.b:0 "The largest band takes precedence."
 vgoc.200.c:0 "Read the obligations recorded at our muster grounds."
 vgoc.201.t:0 "An Oath Needs a Boundary"
 vgoc.201.desc:0 "The assembly accepts that the winter guard fulfilled its duty. Now every captain wants a clear limit: how many days of service, how much grain, and who must care for the wounded when the warriors return?"
 vgoc.201.a:0 "Set terms that every hearth can meet."
 vgoc.201.b:0 "Endow a common store for wounded warriors."
 vgoc.201.c:0 "Leave each captain to bargain for their own band."
 vgoc.210.t:0 "Spears Without Pack Straps"
 vgoc.210.desc:0 "The weapons pass inspection, but half the pack straps snap when loaded. A captain demands more smiths; the quartermaster asks what use another spear will be to a warrior who cannot carry food."
 vgoc.210.a:0 "Test the entire supply line."
 vgoc.210.b:0 "Buy dependable straps from passing merchants."
 vgoc.210.c:0 "Let the oathsmiths certify every fitting."
 vgoc.211.t:0 "The Road Behind the Warband"
 vgoc.211.desc:0 "The inspection finds a washed-out ford used by the grain carts. The captains offer warriors to rebuild it, provided the workers’ households receive the same protection as those serving on the frontier."
 vgoc.211.a:0 "Service at the ford counts toward the oath."
 vgoc.211.b:0 "Pay laborers and keep the warriors drilling."
 vgoc.211.c:0 "Use the muster grounds to organize rotating work crews."
 vgoc.220.t:0 "The Blade That Bears Two Marks"
 vgoc.220.desc:0 "An Orc smith has repaired a rival clan’s blade so well that its owner wants the new maker’s mark beside the old. The first maker’s descendants call that an insult. The warrior calls it the reason the blade is still worth carrying."
 vgoc.220.a:0 "Both makers earned their place on the steel."
 vgoc.220.b:0 "Preserve the first mark; record the repair separately."
 vgoc.220.c:0 "Have the oathsmiths judge the work in public."
 vgoc.221.t:0 "A Place Beside the Hearth"
 vgoc.221.desc:0 "Warriors from a broken band have returned with their families. One clan will shelter them if they surrender their old insignia. Another asks whether a promise of loyalty requires the destruction of every older bond."
 vgoc.221.a:0 "They may keep their names if they keep our peace."
 vgoc.221.b:0 "Offer provisions while they seek another patron."
 vgoc.221.c:0 "Receive their service oath before the assembled clans."
