l_english:
 vir.1.t:0 "Freedom after the War"
 vir.1.desc:0 "The crown has abolished slavery. The proclamation cannot repair a burned village, feed a displaced family, or persuade a lord to surrender the labor on which his estate depended. The work of victory begins with those who survived it."
 vir.1.0:0 "Fund reconstruction and enforce free contracts."
 vir.1.0_tt:0 "Spend 300 gold. Gain ten years of popular reconstruction support; resistant nobles must still be dealt with."
 vir.1.1:0 "The decree will be enforced without compensation."
 vir.1.1_tt:0 "Save the treasury, but provoke five years of noble resistance and an emancipation dispute."
 vir.1.2:0 "Let each community rebuild as it can."
 vir.1.2_tt:0 "Gain five years of unrest in your capital and face an emancipation dispute."
 vir.10.t:0 "A Field of Their Own"
 vir.10.desc:0 "Delegates from families freed by the imperial decree ask for land, tools, and protection from their former owners. They seek a place in the realm as free people, not another household’s charity."
 vir.10.0:0 "Give them a county from my own domain."
 vir.10.0_tt:0 "Spend 100 gold. Grant a personally held non-capital county to an adult former slave, who becomes your vassal. The county gains a twenty-year freeholder settlement."
 vir.10.1:0 "Fund a free community without granting a title."
 vir.10.1_tt:0 "Spend 150 gold. A former-slave representative joins your court; your capital gains ten years of reconstruction."
 vir.10.2:0 "There is nothing left in the treasury."
 vir.10.2_tt:0 "Reject the petition. Five years of local unrest follow."
 vir.20.t:0 "The Price of Emancipation"
 vir.20.desc:0 "[ROOT.Char.MakeScope.Var('vir_disputant').Char.GetTitledFirstName] has withheld cooperation with the emancipation settlement. Estate retainers and villagers fearful of debt and lost livelihoods gather around the old nobility. Their demands would restore slavery, not protect the newly freed."
 vir.20.0:0 "Pay for wages, tools, and free contracts."
 vir.20.0_tt:0 "Transfer 150 gold to the local ruler. Their realm remains emancipated and this dispute closes for ten years."
 vir.20.1:0 "There will be no retreat from emancipation."
 vir.20.1_tt:0 "The resistant ruler leads a restoration uprising with rural levies. If the Empire loses, slavery becomes legal in that ruler’s title and its subordinate realm."
 vir.20.2:0 "Send commissioners; buy time."
 vir.20.2_tt:0 "Postpone the dispute for two years. Local unrest and noble resistance worsen, but slavery stays banned."
 vir.30.t:0 "The Settlement Holds"
 vir.30.desc:0 "The restoration host has been defeated. Emancipation remains law in the disputed realm, and the defeated lord has returned beneath the imperial crown. Victory secures the decree; it does not erase the need to rebuild."
 vir.30.0:0 "Protect the free communities."
 vir.30.0_tt:0 "The affected capital enjoys ten years of secured emancipation."
 vir.31.t:0 "A Tear in the Decree"
 vir.31.desc:0 "The restoration host has forced a local concession. The disputed title has returned beneath the imperial crown, but slavery is legal there again. The imperial ban still holds elsewhere. A later settlement can buy back emancipation in this realm."
 vir.31.0:0 "We will return to this unfinished work."
 vir.31.0_tt:0 "The local exception persists through succession until its ruler abolishes slavery or the crown renegotiates it."
 vir_rebuild_decision:0 "Reconstruct the Imperial Heartland"
 vir_rebuild_decision_desc:0 "Spend 200 gold and reduce unrest in your capital. Reconstruction creates work and strengthens free communities."
 vir_rebuild_decision_tooltip:0 "Spend 200 gold and reduce unrest in your capital. Reconstruction creates work and strengthens free communities."
 vir_rebuild_decision_confirm:0 "Proceed."
 vir_petition_decision:0 "Hear the Freed Communities"
 vir_petition_decision_desc:0 "Hear a petition for land or funding from former slaves. A land grant uses your own non-capital domain, never a vassal’s title."
 vir_petition_decision_tooltip:0 "Hear a petition for land or funding from former slaves. A land grant uses your own non-capital domain, never a vassal’s title."
 vir_petition_decision_confirm:0 "Proceed."
 vir_commission_decision:0 "Convene the Emancipation Commission"
 vir_commission_decision_desc:0 "Address a resistant lord through free-contract compensation, an imperial stand, or a temporary postponement."
 vir_commission_decision_tooltip:0 "Address a resistant lord through free-contract compensation, an imperial stand, or a temporary postponement."
 vir_commission_decision_confirm:0 "Proceed."
 vir_restore_decision:0 "Renegotiate a Restoration Settlement"
 vir_restore_decision_desc:0 "Pay 300 gold to one ruler whose title restored slavery after an imperial defeat. Remove that title’s exception, restore the ban, and free the people held under it."
 vir_restore_decision_tooltip:0 "Pay 300 gold to one ruler whose title restored slavery after an imperial defeat. Remove that title’s exception, restore the ban, and free the people held under it."
 vir_restore_decision_confirm:0 "Proceed."
 vir_rebuilt:0 "Reconstruction and Free Contracts"
 vir_rebuilt_desc:0 "Wages, tools, and rebuilt homes support the emancipated community."
 vir_freeholders:0 "A Community of Freeholders"
 vir_freeholders_desc:0 "Former slaves hold land under imperial protection."
 vir_unsettled:0 "Emancipation Disputes"
 vir_unsettled_desc:0 "Unanswered claims and deprivation trouble the settlement."
 vir_rural_revolt:0 "Restoration Uprising"
 vir_rural_revolt_desc:0 "Noble retainers and a rural host have risen against imperial emancipation."
 vir_emancipation_secured:0 "Emancipation Secured"
 vir_emancipation_secured_desc:0 "The restoration army was defeated and the imperial decree upheld."
 vir_noble_resistance:0 "Resistance to Emancipation"
 vir_noble_resistance_desc:0 "Nobles contest the crown’s emancipation settlement."
 vir_reconstruction_fund:0 "Imperial Reconstruction Fund"
 vir_reconstruction_fund_desc:0 "The crown invests in free labor and the rebuilding of communities."
 vir_restoration_settlement:0 "Local Restoration Settlement"
 vir_restoration_settlement_desc:0 "Military victory has secured a local exception to imperial abolition."
 vir_restoration:0 "Slavery Restoration Uprising"
 vir_restoration_name:0 "The Slavery Restoration Uprising"
 vir_restoration_host:0 "Restoration Retainers and Rural Host"
 vir_restoration_victory:0 "The Empire is defeated. Slavery is restored in the rebel ruler’s disputed title and subordinate realm; they return to imperial allegiance."
 vir_restoration_defeat:0 "Imperial victory preserves emancipation. The defeated ruler returns to the Empire."
 vir_restoration_peace:0 "The ruler returns to imperial allegiance. Slavery remains banned, but the dispute leaves local unrest."
 vir_restoration_invalid:0 "The uprising ends without restoring slavery."
