l_english:
 vel_shift_aeliun_1:0 "Contribute 1 ritual influence toward Aeliun at the next monthly Weave reckoning."
 vel_shift_khaos_1:0 "Contribute 1 ritual influence toward Khaos at the next monthly Weave reckoning."
 vel_shift_aeliun_2:0 "Contribute 2 ritual influence toward Aeliun at the next monthly Weave reckoning."
 vel_shift_khaos_2:0 "Contribute 2 ritual influence toward Khaos at the next monthly Weave reckoning."
 vel_shift_aeliun_3:0 "Contribute 3 ritual influence toward Aeliun at the next monthly Weave reckoning."
 vel_shift_khaos_3:0 "Contribute 3 ritual influence toward Khaos at the next monthly Weave reckoning."
 vel_shift_aeliun_5:0 "Contribute 5 ritual influence toward Aeliun at the next monthly Weave reckoning."
 vel_shift_khaos_5:0 "Contribute 5 ritual influence toward Khaos at the next monthly Weave reckoning."
 vel_dawn_lattice:0 "Raise the Dawn Lattice"
 vel_dawn_lattice_desc:0 "The High Elves serve Aeliun through the living Weave. Raise a lattice of wards around the capital, deciding whether to protect its people, enforce absolute order, or personally sustain its threads. Completed wards influence the global Weave toward Aeliun."
 vel_dawn_lattice_tooltip:0 "Raise the Dawn Lattice"
 vel_dawn_lattice_confirm:0 "Gather the circle"
 vel_first_pattern:0 "Recover the First Pattern"
 vel_first_pattern_desc:0 "Seek an Elven archive containing a fragment of Aeliun’s original ordering. The discovery can renew the realm, train its Threadbinders, or become a lasting beacon of order."
 vel_first_pattern_tooltip:0 "Recover the First Pattern"
 vel_first_pattern_confirm:0 "Gather the circle"
 vel_unwritten_choir:0 "Convene the Unwritten Choir"
 vel_unwritten_choir_desc:0 "The Deep Elves truly serve Khaos. Their choir releases threads from fixed patterns to make new possibilities real. Choose controlled transformation or a dangerous opening that draws more power through the Weave."
 vel_unwritten_choir_tooltip:0 "Convene the Unwritten Choir"
 vel_unwritten_choir_confirm:0 "Gather the circle"
 vel_unmake_seal:0 "Unmake the Buried Seal"
 vel_unmake_seal_desc:0 "An ancient seal fixes a fragment of the Weave beneath the capital. Deep Elf Threadbinders can unravel it in Khaos’s service, reshape it, or release its energy gradually. None of these paths requires obedience to the creatures that may answer."
 vel_unmake_seal_tooltip:0 "Unmake the Buried Seal"
 vel_unmake_seal_confirm:0 "Gather the circle"
 vel.10.t:0 "The Dawn Between Every Thread"
 vel.10.desc:0 "At dawn, the High Elf wardens sing a pattern older than the empire. Aeliun is no convenient emblem to them: their service is real, and the answering light binds stone, root, and running water. Yet a perfect pattern can shelter a city or imprison it. I must decide what this lattice is for."
 vel.10.a:0 "Shelter the living; let the lattice breathe."
 vel.10.b:0 "Nothing within these walls may depart from the pattern."
 vel.10.c:0 "I will supply the threads myself."
 vel.11.t:0 "Where the Light Takes Root"
 vel.11.desc:0 "The wards hold. Gardeners report roots knitting broken walls; the night watch hears the lattice answer whenever a frayed thread touches it. Aeliun’s order is becoming a duty of maintenance, not a single triumph. My wardens ask what lesson the next generation should learn."
 vel.11.a:0 "A ward exists for those who live beneath it."
 vel.11.b:0 "Teach the patient work of restoration."
 vel.11.c:0 "Record its obligations in the law."
 vel.20.t:0 "The Archive of Unbroken Dawn"
 vel.20.desc:0 "Beneath the shattered observatory, Elven inscriptions describe the Weave as something entrusted to its keepers. A surviving pattern burns steadily where centuries of dust should have smothered it. To serve Aeliun is to preserve the possibility of a living world—not simply to preserve every old command."
 vel.20.a:0 "Restore the pattern as a beacon."
 vel.20.b:0 "Make its teachings a school for the realm."
 vel.20.c:0 "Bind its precision into my own craft."
 vel.21.t:0 "The Flaw in the Perfect Circle"
 vel.21.desc:0 "The restored beacon exposes a flaw in the old design. It excludes a neighborhood built long after its makers died. The wardens can expand the pattern around the inhabitants, or insist that the inhabitants yield to it. Both are acts of order. Only one remembers why the work began."
 vel.21.a:0 "Redraw the circle around the living."
 vel.21.b:0 "The ancient boundary must stand."
 vel.30.t:0 "The Unwritten Choir"
 vel.30.desc:0 "The Deep Elves extinguish their lamps. In the dark, each voice takes a path no score permits. Khaos answers in the space between notes. This is devotion, not a disguise for service to Aeliun: the choir exists to free the Weave from certainty. The question is how much change this realm can bear."
 vel.30.a:0 "Give the new patterns room to take root."
 vel.30.b:0 "Draw the answering current through me."
 vel.30.c:0 "Break the choir apart before it becomes another law."
 vel.31.t:0 "A Song with No Last Verse"
 vel.31.desc:0 "The ritual has changed the local threads. Glassworkers find colors they cannot repeat; apprentices arrive with conflicting solutions to the same spell. Some courtiers call it disorder. The choir calls it Khaos’s gift, and asks whether I will permit a school whose students may contradict its founders."
 vel.31.a:0 "Let every student question the first verse."
 vel.31.b:0 "I will learn to reshape the pattern myself."
 vel.31.c:0 "The singers will carry these possibilities abroad."
 vel.40.t:0 "The Seal That Dreams of Breaking"
 vel.40.desc:0 "Far below the capital, a seal holds a strand in the same shape it bore before the present kingdoms existed. Deep Elf inscriptions call it the Unasked Question. To Khaos, an eternal answer is another prison. Beyond the seal, something presses back; breaking a pattern does not grant mastery over what follows."
 vel.40.a:0 "Unravel one knot at a time."
 vel.40.b:0 "Let the whole seal break."
 vel.40.c:0 "Reshape the seal into a door that can close."
 vel.41.t:0 "What the Old Pattern Hid"
 vel.41.desc:0 "Within the loosened thread lie impressions of vanished Elven workshops. Their tools are dust, but their unfinished questions remain. The find offers no commandment and no master. Khaos has given us possibilities; what we make from them will be our responsibility."
 vel.41.a:0 "Build a workshop around the unanswered questions."
 vel.41.b:0 "Let their unfinished craft change mine."
 vel.41.c:0 "Release the impressions into the wider Weave."
 vel.42.t:0 "Too Many Doors"
 vel.42.desc:0 "The broken seal opens in several places at once. Stairways return to the wrong halls, and the workshop bells ring before they are struck. The voices beyond offer obedience in return for admission. We serve Khaos; we have not promised our people to everything that calls from the dark."
 vel.42.a:0 "Evacuate the galleries and bleed the current slowly."
 vel.42.b:0 "I will hold the doors while the others escape."
 vel.50.t:0 "Aeliun’s Light in a Fraying World"
 vel.50.desc:0 "The wardens feel the world pulling away from the ordered pattern. Their service is tested most sharply when Khaos’s influence grows. They ask whether this realm will strengthen its contribution, or conserve its people for the long work ahead."
 vel.50.a:0 "Renew the wards with patient hands."
 vel.50.b:0 "Let my own reserve reinforce the lattice."
 vel.50.c:0 "Care for the keepers; we cannot mend everything today."
 vel.51.t:0 "Khaos Beneath the Stillness"
 vel.51.desc:0 "The Deep Elf listeners hear the wider Weave growing rigid. Fewer possibilities survive the passage from dream to waking. Their devotion to Khaos demands more than the repetition of yesterday’s rebellion: they must decide what can be opened without breaking the people entrusted to them."
 vel.51.a:0 "Unbind a pattern that has outlived its purpose."
 vel.51.b:0 "Let the current pass through my own craft."
 vel.51.c:0 "Teach the listeners to recognize the next opening."
 vel_dawn_anchor:0 "Keeper of the Dawn Lattice"
 vel_dawn_anchor_desc:0 "For five years, this High Elf ruler contributes one annual ritual influence toward Aeliun."
 vel_khaos_anchor:0 "Voice of the Unwritten Choir"
 vel_khaos_anchor_desc:0 "For five years, this Deep Elf ruler contributes one annual ritual influence toward Khaos."
 vel_rigid_order:0 "The Unyielding Pattern"
 vel_rigid_order_desc:0 "A perfect ward admits no deviation, even when its keeper needs rest."
 vel_open_current:0 "The Open Current"
 vel_open_current_desc:0 "An additional three points of monthly magical recovery before atrophy penalties. Drawing above ten net monthly income still causes Weave Atrophy."
 vel_sheltered_county:0 "Under the Dawn Lattice"
 vel_sheltered_county_desc:0 "High Elf wards protect the county’s roads and living settlements."
 vel_pattern_school:0 "School of the First Pattern"
 vel_pattern_school_desc:0 "Elven keepers teach the precise and patient craft of restoring the Weave."
 vel_living_patterns:0 "Workshops of Living Patterns"
 vel_living_patterns_desc:0 "Deep Elf experiments produce new techniques and challenge old certainties."
 vel_frayed_county:0 "Unraveled Galleries"
 vel_frayed_county_desc:0 "An uncontrolled release of bound threads has disrupted the underground workshops."
 vel_current_recovery:0 "The Open Current"
 vel_atrophy_warning:0 "Magical recovery increases by 3 per month before atrophy penalties for three years. Net magical income above 10 per month causes the existing Weave Atrophy progression."
