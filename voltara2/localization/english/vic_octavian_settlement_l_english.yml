l_english:
 vic_trevelyan_exiles:0 "The Trevelyan Exiles"
 vic_heirs.1.d:0 "Leon must die. Let his mother and sister flee."
 vic_heirs.1.d.tt:0 "Leon is executed. Adriana and Nora escape to Marques Trevelyan, whose titles have been confiscated by the Crown. With Roads to Power, he leads their landless adventurer camp."
 vic_settlement.1.t:0 "A Knife Behind the Banners"
 vic_settlement.1.dead:0 "The banners of rebellion rise, and Cassian is dead. Tharn's conspiracy has struck at the heart of the court; the throne must now be wrested from those who claim to inherit it."
 vic_settlement.1.alive:0 "With the raising of my banners, the conspiracy makes its move against Cassian. Tharn's preparations meet the defenses assembled by Marques and the imperial household. The attempt has failed: Cassian lives, and the war will decide which brother wears the crown."
 vic_settlement.1.a:0 "Now the armies will decide."
 vic_settlement.2.t:0 "The Capture of Titania"
 vic_settlement.2.execution:0 "Titania has fallen. Cassian survived the conspirators, but he has not survived defeat. At my command the fallen emperor is put to death. There can be no second imperial court around which my enemies might rally."
 vic_settlement.2.dead:0 "Titania and the imperial crown are mine. Cassian is already dead, but his household and the lords who served him remain. The settlement begins with the confiscation of Marques Trevelyan's titles."
 vic_settlement.2.a:0 "The old reign is over."
 vic_settlement.3.t:0 "The Price of Loyalty"
 vic_settlement.3.desc:0 "Octavian's settlement strips me of my titles and delivers them to the Crown. I leave the imperial court with those who will still follow me. Our future lies on the roads, beyond the new emperor's favor."
 vic_settlement.3.a:0 "We will endure."
 vic_settlement.4.t:0 "The Last Refuge"
 vic_settlement.4.desc:0 "Leon is dead by Octavian's order. Adriana and Nora have reached my followers, carrying the grief of a shattered household. I can offer them no throne or castle now, but they will have shelter beneath our banners."
 vic_settlement.4.a:0 "They are under my protection."
