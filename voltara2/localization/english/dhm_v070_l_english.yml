 dhm_manager.0001.play_style:0 "@skill_stewardship_icon! Choose a Play Style"
 dhm_manager.0001.play_style_tt:0 "Choose how often DHM interrupts play. Your education and marriage automation rules will not be changed."
 dhm_manager.0001.advanced:0 "@skill_stewardship_icon! Advanced Household Tools"
 dhm_manager.0001.advanced_tt:0 "Open manual scans, officers, council settings, personal plans and detailed story controls."

 dhm_manager.0090.t:0 "How Closely Shall We Keep the House?"
 dhm_manager.0090.desc:0 "Your steward lays three ledgers upon the table.\n\n'My liege, the work can be done quietly, reported when it matters, or written into a full family chronicle. The marriages and lessons you have already ordered will remain as they are.'"
 dhm_manager.0090.status.quiet:0 "\n\n#bold Current Style:#! Quiet Steward"
 dhm_manager.0090.status.living:0 "\n\n#bold Current Style:#! Living Household"
 dhm_manager.0090.status.chronicle:0 "\n\n#bold Current Style:#! Full Chronicle"
 dhm_manager.0090.status.custom:0 "\n\n#bold Current Style:#! Custom"
 dhm_manager.0090.quiet:0 "Keep the Work Quiet"
 dhm_manager.0090.quiet_tt:0 "Stops new optional stories, marriage follow-ups, education reports and yearly councils. Uses light matchmaking. Existing promises and required marriage decisions may still conclude. House identity and reputation become records, not extra bonuses."
 dhm_manager.0090.living:0 "Tell Me Only What Matters #high (Recommended)#!"
 dhm_manager.0090.living_tt:0 "Shows one education checkpoint, notable graduation outcomes, important marriage problems and well-spaced family stories. Councils stay on demand. House identity and reputation remain recorded without extra bonuses. Existing stories may finish."
 dhm_manager.0090.chronicle:0 "Write the Whole Family Chronicle"
 dhm_manager.0090.chronicle_tt:0 "Enables the full saga pool, courtship, fuller graduation reports and yearly councils. House identity and reputation bonuses are enabled. Expect more event windows."

 dhm_manager.0091.t:0 "The Steward's Locked Drawer"
 dhm_manager.0091.desc:0 "The everyday ledger closes. From a smaller drawer, your steward produces the seals and private lists used only when the ordinary rules are not enough."
 dhm_manager.0091.scan:0 "@task_contract_icon! Run a Household Scan Now"
 dhm_manager.0091.council_now:0 "@council_icon! Summon the Household Council"
 dhm_manager.0091.council_now_tt:0 "Open the council now. This does not turn on recurring council events."
