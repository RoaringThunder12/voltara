 dhm_manager.0091.disable_plans:0 "Hide Personal Career and Child Plans"
 dhm_v070_appoint_best_officers_tt:0 "Vacant offices are filled by distinct eligible courtiers: Steward by Stewardship, Matchmaker by Diplomacy, and Tutor and Chronicler by Learning. Existing officers are not replaced."
