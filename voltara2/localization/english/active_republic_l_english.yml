l_english:
 active_republic_government_tt: "You are republican."
 republican_magistrate: "Magistrate"
 republican_magistrate_desc: "Elected or appointed from among the republic's leading citizens, the Magistrate is charged with the execution of laws and the daily governance of the city. Balancing justice, order, and civic administration, they act as both arbiter and executive in the service of the republic’s stability."
 republican_magistrate_firenze: "Priori"
 republican_magistrate_firenze_desc: "A member of the ruling Signoria, the Prior holds temporary office as a guardian of republican liberty and public order. Drawn from the city's eligible elite, they rule not by lineage, but by rotation and civic merit, embodying the principle of shared governance."
 republican_magistrate_hansa: "Delegate"
 republican_magistrate_hansa_desc: "Chosen by the republic to represent its interests beyond its borders, the Delegate speaks with the authority of the council in leagues, alliances, and foreign diets. Whether negotiating trade privileges or securing defensive pacts, their influence often reaches farther than their mandate."
 republican_magistrate_veche: "Posadnik"
 republican_magistrate_veche_desc: "Elected by the veche or ruling assembly, the Posadnik serves as the chief magistrate and civic administrator of the republic. Responsible for local justice, law enforcement, and policy execution, they are both the hand of the council and the face of the city to its people."
 republican_election_started_title: "Election Commencing"
 republican_election_started_desc: "A new ruler will be elected from the candidates."
 republican_election_concluded_title: "Election Concluded"
 REPUBLICAN_CHARACTER_HAS_BEEN_ELECTED: "[CHARACTER.GetTitledFirstNameRegnal] has been elected."
 REPUBLICAN_CHARACTER_HAS_BEEN_REELECTED: "[CHARACTER.GetTitledFirstNameRegnal] has been reelected."
