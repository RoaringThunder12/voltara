l_english:
 vth_khaos_income_desc:0 "Thorne’s covenant with Khaos"
 vth_refuge_keeper:0 "Keeper of the Open Hand"
 vth_refuge_keeper_desc:0 "The cult shelters the displaced and disciplines its magic."
 vth_dread_prophet:0 "Prophet of the Withering Hand"
 vth_dread_prophet_desc:0 "Fear binds the faithful, but every promise of dominion demands more."
 vth_southron_sanctuary:0 "Sanctuary of the Southern Banners"
 vth_southron_sanctuary_desc:0 "A Southron ruler has granted the Withering Hand a place beneath the banners."
 vth_refuge_supply:0 "The Open Hand’s Relief Columns"
 vth_refuge_supply_desc:0 "Healers and refugee guides sustain the southern host."
 vth_war_sorcery:0 "Sorcerers of the Withering Hand"
 vth_war_sorcery_desc:0 "Thorne’s disciples turn the Weave against the host’s enemies."
 vth_exhausted_circle:0 "An Exhausted Circle"
 vth_exhausted_circle_desc:0 "Rushed rites have exhausted the faithful."
 vth_wardens:0 "Open-Hand Wardens"
 vth_wardens_flavor:0 "Warriors sworn to protect the living rather than feed Thorne’s grief."
 vth_cantors:0 "Withering Cantors"
 vth_cantors_flavor:0 "Disciplined Threadbinders whose linked chants tear through an enemy line."
 vth_unbound:0 "Khaos-Unbound"
 vth_unbound_flavor:0 "The deepest covenant made manifest: immense power, sustained at a terrible cost to its master."
 vth.1.t:0 "What the Hand Will Hold"
 vth.1.desc:0 "They come to Thorne with stories of dead children, broken chains, and villages abandoned by their lords. Some ask him for shelter. Others ask him to make their enemies suffer. The name Withering Hand can mean either promise. He must decide what these people are becoming."
 vth.1.0:0 "We will become a refuge."
 vth.1.0_tt:0 "Choose the lighter path: protective troops, relief work, and restrained power."
 vth.1.1:0 "We will become a power no crown can dismiss."
 vth.1.1_tt:0 "Choose dominion: fear, war sorcery, and access to the deepest Khaos bargains."
 vth_found:0 "Shape the Withering Hand"
 vth_found_desc:0 "Choose the purpose of Thorne’s cause: a refuge for the living or an instrument of dominion."
 vth_found_tooltip:0 "Choose the purpose of Thorne’s cause: a refuge for the living or an instrument of dominion."
 vth_found_confirm:0 "Gather the Withering Hand."
 vth.10.t:0 "The People beside the Road"
 vth.10.desc:0 "An exhausted band waits at the edge of the camp. One young Threadbinder speaks for them: they have heard of Virell, and they want to know whether his promises reach people without a sword. Feeding them will cost us. Turning their anger into obedience would be easier."
 vth.10.0:0 "Feed them, teach them, and demand no oath of servitude."
 vth.10.0_tt:0 "Spend 50 gold. Gain 15 cult devotion and a real apprentice in your court or camp; strengthen the lighter path."
 vth.10.1:0 "Let their anger become our strength."
 vth.10.1_tt:0 "Spend 50 gold. Gain 25 devotion and an apprentice, but turn toward domination."
 vth.10.2:0 "We cannot support them yet."
 vth.10.2_tt:0 "No payment or recruitment."
 vth_recruit:0 "Gather the Forsaken"
 vth_recruit_desc:0 "Recruit refugees and an apprentice into Thorne’s growing cause.\n\nCult devotion: [ROOT.Char.MakeScope.Var('vth_devotion').GetValue|0]/100. Covenant tier: [ROOT.Char.MakeScope.Var('vth_power').GetValue|0]/3."
 vth_recruit_tooltip:0 "Recruit refugees and an apprentice into Thorne’s growing cause."
 vth_recruit_confirm:0 "Gather the Withering Hand."
 vth.20.t:0 "Ja’Kar’s Open Hand"
 vth.20.desc:0 "Ja’Kar lays a bowl between us. He remembers the people who called obedience a kindness, and the wife and son their world took from him. He does not ask me to forgive those who destroyed my family. He asks whether I intend to build their world again, with my own name above its gate.\n\n“I will help you break chains, Thorne. I will not teach you to fit them.”"
 vth.20.0:0 "Stay. Remind me whom this power is for."
 vth.20.0_tt:0 "Choose mercy, reduce stress, and limit the covenant to its first tier. Existing Weave Atrophy is not erased."
 vth.20.1:0 "Then help me strike their armies, never their captives."
 vth.20.1_tt:0 "Keep Ja’Kar’s counsel and the protective path while pursuing the invasion."
 vth.20.2:0 "Your mercy will leave us powerless."
 vth.20.2_tt:0 "Reject his counsel and turn toward domination. Ja’Kar’s opposition will matter at the final bargain."
 vth_jakar:0 "Hear Ja’Kar’s Counsel"
 vth_jakar_desc:0 "Let Ja’Kar challenge the direction of the Withering Hand."
 vth_jakar_tooltip:0 "Let Ja’Kar challenge the direction of the Withering Hand."
 vth_jakar_confirm:0 "Gather the Withering Hand."
 vth.30.t:0 "The Silence beyond the Weave"
 vth.30.desc:0 "The circle falls silent. For a moment the Weave offers no resistance at all. Khaos does not demand a king’s obedience; it offers the terrible freedom to draw more than a mortal mind can bear. Every deeper covenant could make our cause formidable. Every deeper covenant could also consume the man who began it."
 vth.30.0:0 "Take one step deeper."
 vth.30.0_tt:0 "Spend 250 piety and embrace the Unbound Weave. Gain one covenant tier: +8/+16/+24 Threadcraft and +6/+14/+24 monthly reserve income. Income above 10 risks progressive Weave Atrophy. The deepest tier provokes Ja’Kar’s reckoning."
 vth.30.1:0 "We have drawn enough."
 vth.30.1_tt:0 "Refuse further power. No piety is spent."
 vth_covenant:0 "Draw upon Khaos"
 vth_covenant_desc:0 "Deepen Thorne’s covenant. Great power brings the existing risk of Weave Atrophy.\n\nCult devotion: [ROOT.Char.MakeScope.Var('vth_devotion').GetValue|0]/100. Covenant tier: [ROOT.Char.MakeScope.Var('vth_power').GetValue|0]/3."
 vth_covenant_tooltip:0 "Deepen Thorne’s covenant. Great power brings the existing risk of Weave Atrophy."
 vth_covenant_confirm:0 "Gather the Withering Hand."
 vth.31.t:0 "The Last Chain"
 vth.31.desc:0 "Ja’Kar has seen what the newest disciples are willing to do in my name. He stands at the circle’s edge while the air bends around us. “You can still stop,” he says. “Not because they deserve your mercy. Because these people deserve to belong to themselves.”\n\nFor once, Khaos offers no answer I can mistake for my own."
 vth.31.0:0 "Break the circle. I will not lose another friend to my cause."
 vth.31.0_tt:0 "Return to the first covenant tier and the lighter path. Lose 15 devotion among the zealots; Ja’Kar remains."
 vth.31.1:0 "The cause is greater than either of us."
 vth.31.1_tt:0 "Ja’Kar breaks with the cult. Keep the deepest covenant and its risks."
 vth.40.t:0 "A Host with a Purpose"
 vth.40.desc:0 "The faithful have learned to march together. Some carry shields marked with an open hand. Others have learned to sing a Threadbinder’s working without breaking formation. Beyond them stand those whose shadows no longer obey the firelight. Which of them will carry our cause into battle?"
 vth.40.0:0 "Raise the Open-Hand Wardens."
 vth.40.0_tt:0 "Spend 100 gold to raise two sizes of protective infantry."
 vth.40.1:0 "Form the Withering Cantors."
 vth.40.1_tt:0 "Spend 100 gold to raise two sizes of spellcasting archers."
 vth.40.2:0 "Unleash the Khaos-Unbound."
 vth.40.2_tt:0 "Spend 100 gold to raise two sizes of elite covenant warriors: 250 damage and 100 toughness."
 vth.40.3:0 "Not yet."
 vth.40.3_tt:0 "No troops or costs."
 vth_host:0 "Muster the Withering Hand"
 vth_host_desc:0 "Raise a unique regiment appropriate to Thorne’s chosen path. Requires a free regiment slot.\n\nCult devotion: [ROOT.Char.MakeScope.Var('vth_devotion').GetValue|0]/100. Covenant tier: [ROOT.Char.MakeScope.Var('vth_power').GetValue|0]/3."
 vth_host_tooltip:0 "Raise a unique regiment appropriate to Thorne’s chosen path. Requires a free regiment slot."
 vth_host_confirm:0 "Gather the Withering Hand."
 vth.50.t:0 "A Place beneath the Southern Banners"
 vth.50.desc:0 "The southern chiefs are gathering a force that could shake the Keepers and the imperial settlements beyond them. Their crown needs guides, healers, and power. My people need protection and a chance to be heard. A pact could serve both causes, if the ruler beneath that crown will hear me."
 vth.50.0:0 "Offer the Hand’s service for sanctuary."
 vth.50.0_tt:0 "Ask the United Southron ruler to accept a five-year pact. Acceptance grants sanctuary, cult support, and the option to join the invasion; it does not grant automatic fealty."
 vth.50.1:0 "We will stand alone."
 vth.50.1_tt:0 "No pact is sent."
 vth_southron:0 "Approach the United Southron Clans"
 vth_southron_desc:0 "Negotiate a place for Thorne’s cause in the southern invasion."
 vth_southron_tooltip:0 "Negotiate a place for Thorne’s cause in the southern invasion."
 vth_southron_confirm:0 "Gather the Withering Hand."
 vth.51.t:0 "Virell’s Offer"
 vth.51.desc:0 "Thorne Virell offers the Withering Hand’s service to our cause. He asks for sanctuary beneath our banners, not a place in our succession. His followers can help sustain the host or turn their sorcery against its enemies. Their presence will also give his growing movement a powerful protector."
 vth.51.0:0 "There is room beneath our banners."
 vth.51.0_tt:0 "Accept five years of sanctuary. Gain intelligence and support suited to Thorne’s path; enable his participation in the invasion."
 vth.51.1:0 "Our chiefs will not shelter this cause."
 vth.51.1_tt:0 "Decline. No allegiance or payment is forced."
 vth.52.t:0 "The Hand beneath the Banners"
 vth.52.desc:0 "The answer has come: the southern crown will shelter the Withering Hand. Our future is still our own to choose. Ja’Kar’s hope for the displaced and the zealots’ hunger for power now travel beside the same army."
 vth.52.0:0 "We will show them what our cause means."
 vth.52.0_tt:0 "Your pact is active. During the Kartholos invasion, use March with the Southern Host to join the attackers."
 vth_march:0 "March with the Southern Host"
 vth_march_desc:0 "Join your Southron patron’s active Kartholos invasion as an attacker."
 vth_march_tooltip:0 "Join your Southron patron’s active Kartholos invasion as an attacker."
 vth_march_confirm:0 "Gather the Withering Hand."
 vth.60.t:0 "Across the Strait"
 vth.60.desc:0 "The southern host is moving. Our pact has become a choice of blood and consequence: follow the banners into the war for Kartholos, or remain a voice beside the campfires. My followers watch to see whether I will carry the same risks I ask them to bear."
 vth.60.0:0 "The Withering Hand marches."
 vth.60.0_tt:0 "Join the existing invasion as an attacker. Gain 150 prestige and 10 cult devotion."
 vth.60.1:0 "We are not ready."
 vth.60.1_tt:0 "Remain outside the war."
