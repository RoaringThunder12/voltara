 death_voltara_imperial_assassin:0 "was killed by an assassin in the imperial capital"
 death_voltara_imperial_assassin_killer:0 "was killed by an assassin in the imperial capital"
 voltara_broken_chains_host:0 "The Broken Chains"
 voltara_withering_hand_camp:0 "The Withering Hand"
 voltara_slave_liberation_war:0 "Slave Liberation Revolt"
 voltara_slave_liberation_war_name:0 "The Severosi Slave Rebellion"
 voltara_slave_war_victory:0 "Slavery is abolished throughout the former Severosi realm, all its slaves are freed, and the Hegemony of Severos is destroyed. The regional realms remain independent."
 voltara_slave_war_white_peace:0 "The rebels lay down their arms. Those who already escaped remain free, but slavery laws are unchanged."
 voltara_slave_war_defeat:0 "The empire defeats the rebellion and imprisons the rulers fighting on the rebel side."
 voltara_slave_war_invalidated:0 "The rebellion ends without imposing its demands."
 voltara_cassian_crisis.ack:0 "The empire will never be the same."
 voltara_cassian_crisis.10.t:0 "The Emperor's Last Dawn"
 voltara_cassian_crisis.10.desc:0 "An assassin has struck down Emperor Cassian. Amid the confusion, Adriana gathers Nora and escapes the capital for Bryndale.\n\nOctavian moves faster than the grieving court. Leon Severos is murdered at his command, and the imperial throne passes into Octavian's hands. Cassian's reforms, his household, and the bargains that held the empire together now lie beneath the shadow of the coup."
 voltara_cassian_crisis.20.t:0 "The Breaking of Chains"
 voltara_cassian_crisis.20.desc:0 "Thornfall raises the banner of the Severosi Slave Rebellion. The Sixth Southorion Invasion, Bryndale, Enderal, Marques Trevelyan and Vossgate March rally to the cause. Halithor, Thonia, Rhaulla and the remaining imperial vassals defend Severos, with Kedith also joining the rebels. Victory will free the empire's slaves and shatter the hegemony."
 voltara_cassian_crisis.30.t:0 "The Withering Hand"
 voltara_cassian_crisis.30.desc:0 "The violence reaches the Virell household. Caledor Tharn kills Elira, silencing one of the most determined voices against slavery.\n\nThorne Virell abandons the court and the faith in order that once sustained him. He embraces the Unbound Weave and gathers an exile camp: the Withering Hand. Ja'Kar, now freed from slavery, joins him. Grief has transformed a scholar of reform into an enemy of the settlement that destroyed his daughter."
 voltara_cassian_crisis.30.alternate:0 "The imperial purges scatter the Virell household. With the expected confrontation overtaken by events, Thorne's remaining hope of reform collapses. If he still lives, he leaves imperial service and turns toward the Unbound Weave."
 voltara_cassian_crisis.40.t:0 "After Cassian"
 voltara_cassian_crisis.40.desc:0 "Cassian's story has ended, but Voltara's has not. Follow Octavian as he tries to hold the empire he seized, Thorne as he gathers his exile camp, or Nora as she preserves her father's line under Bryndale's protection."
 voltara_cassian_crisis.40.octavian:0 "Continue as Octavian, the new emperor."
 voltara_cassian_crisis.40.thorne:0 "Continue as Thorne and the Withering Hand."
 voltara_cassian_crisis.40.nora:0 "Continue as Nora, Cassian's surviving child."
 voltara_cassian_crisis.nora_refuge_tt:0 "Bryndale grants Nora a county of refuge, making her playable as its young ruler. Adriana joins her court."
