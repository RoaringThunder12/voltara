l_english:
 vsn_deep_dig:0 "Break the Forbidden Seam"
 vsn_deep_dig_desc:0 "Old hold ledgers forbid digging beneath certain galleries. Some conceal rich ore; others mark the graves of clans lost in the tunnel wars. Deeper shafts can expose a neighboring First Cavern realm. A pact of sealed depths suspends these expeditions."
 vsn_deep_dig_tooltip:0 "Break the Forbidden Seam"
 vsn_deep_dig_confirm:0 "Send word below"
 vsn_tunnel_hold:0 "Tunnel Beneath a Stoneborn Hold"
 vsn_tunnel_hold_desc:0 "First Cavern memory preserves springs walled up by Stoneborn miners and whole broods buried beyond them. Send tunnelers toward a neighboring hold. Its ruler will answer the breach; success is not guaranteed."
 vsn_tunnel_hold_tooltip:0 "Tunnel Beneath a Stoneborn Hold"
 vsn_tunnel_hold_confirm:0 "Send word below"
 vsn_seal_depths:0 "Negotiate the Sealed Depths"
 vsn_seal_depths_desc:0 "Offer a neighboring ancestral rival a five-year truce, shared gallery inspections, and a halt to these tunnel expeditions. The other ruler must agree. Both signatories suspend further scripted digging and incursions for five years."
 vsn_seal_depths_tooltip:0 "Negotiate the Sealed Depths"
 vsn_seal_depths_confirm:0 "Send word below"
 vsn.10.t:0 "The Forbidden Seam"
 vsn.10.desc:0 "The last survey bears a warning in a dead clan’s hand. Beyond the seam lies a rich vein, but the air carries the sound of running water. In the old wars, Stoneborn miners sealed Naga brood-caverns; First Cavern tunnelers opened holds from beneath and left no hearth alight. My miners await an order."
 vsn.10.a:0 "Cut deeper. We need the ore."
 vsn.10.b:0 "Survey the walls and honor the warning."
 vsn.10.c:0 "Seek the neighboring clan before we dig."
 vsn.11.t:0 "Iron Beyond the Silence"
 vsn.11.desc:0 "The ore is real. So is the worked stone beyond it: a passage older than the hold’s surviving records. Fresh scratches mark its far wall. If another clan lives beyond that wall, further digging will be an intrusion."
 vsn.11.a:0 "Open a passage into the neighboring galleries."
 vsn.11.b:0 "Take the ore and seal our shaft."
 vsn.12.t:0 "The Weight of the Mountain"
 vsn.12.desc:0 "The roof gave way before the warning bell could sound. Rescue crews brought out the wounded and the tools of those they could not reach. No enemy did this. The mountain was asked to bear more than its pillars allowed."
 vsn.12.a:0 "Rebuild the supports and care for the families."
 vsn.12.b:0 "We will remember this before the next excavation."
 vsn.13.t:0 "The Names Beneath the Ash"
 vsn.13.desc:0 "In a sealed gallery, Stoneborn hearth-stones stand beside Naga funerary coils. Two accounts survive. The Bronze Hearth clan burned a brood sanctuary after losing its waterworks; the Coil of the Last Spring answered by tunneling beneath the hold and extinguishing its remaining households. Neither clan survived the reprisals. Their descendants’ neighbors preserved only half the story."
 vsn.13.a:0 "Record every name, on both sides."
 vsn.13.b:0 "Let our warriors remember what was done to us."
 vsn.13.c:0 "These dead deserve a treaty among the living."
 vsn.20.t:0 "The Wall Gives Way"
 vsn.20.desc:0 "Surveyors have found a passage into a neighboring realm. Opening it will expose a defended gallery, not an empty mine. The ruler beyond the wall will have a chance to respond."
 vsn.20.a:0 "Send the crews through."
 vsn.20.b:0 "Withdraw before anyone crosses."
 vsn.21.t:0 "Footsteps Beneath the Hearth"
 vsn.21.desc:0 "Crews bearing [scope:vsn_digger.GetTitledFirstNamePossessive] marks have broken into the galleries beneath [scope:vsn_target.GetNameNoTier]. Guards have stopped the first party. The old stories offer many answers, and most end with a clan’s name carved on a tomb."
 vsn.21.a:0 "Counter-mine and drive them out."
 vsn.21.b:0 "Collapse the breached gallery, whatever lies beyond it."
 vsn.21.c:0 "Offer shared inspections and a sealed frontier."
 vsn.21.d:0 "The border has changed; recall the guards."
 vsn.22.t:0 "The Passage Is Lost"
 vsn.22.desc:0 "Our expedition has been driven back or buried behind a collapsed passage. The old feud has another entry. No land has changed hands, but the crews will not forget the ruler who stopped them."
 vsn.22.a:0 "Tend the survivors."
 vsn.23.t:0 "An Open Wound Below"
 vsn.23.desc:0 "Our crews escaped with stores and tools while the defenders abandoned the breached gallery. The neighboring county is shaken, but this raid has not made it ours. Such victories are how the old tunnel wars began."
 vsn.23.a:0 "Secure what the expedition brought home."
 vsn.24.t:0 "An Offer from Below"
 vsn.24.desc:0 "[scope:vsn_warden.GetTitledFirstName] offers to end the incursion with a five-year truce and shared inspections. Accepting means suspending our further tunnel expeditions, even against other clans, while the galleries are surveyed."
 vsn.24.a:0 "Accept. No more buried households."
 vsn.24.b:0 "Withdraw, but promise nothing."
 vsn.30.t:0 "A Map of Sealed Passages"
 vsn.30.desc:0 "Mark the springs that must remain open and the galleries neither clan may cross. A pact can protect the living without asking them to forget the dead. The neighboring ruler must agree to its terms."
 vsn.30.a:0 "Send the maps and an offer of peace."
 vsn.30.b:0 "Keep the maps for another season."
 vsn.31.t:0 "The Sealed Depths"
 vsn.31.desc:0 "[scope:vsn_digger.GetTitledFirstName] proposes a five-year truce: no new breaches, shared inspections, and recognition of burial galleries. Both rulers would suspend further tunnel expeditions while their surveyors work. The offer acknowledges that both peoples have destroyed clans in these depths."
 vsn.31.a:0 "Let the next generation inherit a map, not a feud."
 vsn.31.b:0 "Our ancestors demand more than an apology."
 vsn.32.t:0 "The Depths Are Sealed"
 vsn.32.desc:0 "Both seals are on the maps. For five years, inspectors will keep burial galleries closed, springs open, and new shafts away from the frontier. It is not forgiveness. It is a promise that the next dispute need not extinguish another clan."
 vsn.32.a:0 "Let the surveyors begin."
 vsn.33.t:0 "The Unanswered Dead"
 vsn.33.desc:0 "The neighboring ruler has rejected the pact. Our maps return without a second seal. The passages remain disputed; no truce binds either realm."
 vsn.33.a:0 "Keep the offer in our archives."
 vsn_shared_galleries:0 "Surveyed Shared Galleries"
 vsn_shared_galleries_desc:0 "Inspectors keep the springs and galleries safe under the pact of sealed depths."
 vsn_safe_shafts:0 "Reinforced Shafts"
 vsn_safe_shafts_desc:0 "Rescue work has taught the hold to respect the mountain’s weight."
 vsn_remembrance:0 "Names of Both Peoples"
 vsn_remembrance_desc:0 "A record preserves the victims of Stoneborn and First Cavern reprisals alike."
 vsn_old_grievances:0 "The Unburied Feud"
 vsn_old_grievances_desc:0 "Old clan massacres are invoked to rally the next generation of warriors."
 vsn_collapsed_galleries:0 "Collapsed Galleries"
 vsn_collapsed_galleries_desc:0 "Deliberate cave-ins have stopped an incursion at the cost of workshops and water channels."
 vsn_depths_peace:0 "Honored the Sealed Depths"
 vsn_depths_feud:0 "Blood in the Galleries"
 vsn_truce:0 "Pact of the Sealed Depths"
