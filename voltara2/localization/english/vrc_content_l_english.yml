 vrc_gather_high:0 "Hear the Keepers of Living Light"
 vrc_gather_high_desc:0 "The keepers bring disputes over Aeliun’s wards, public gardens, and inherited duties. Their solutions may advance Dawn Horticulture as well as strengthen the Weave."
 vrc_gather_high_tooltip:0 "Hear the Keepers of Living Light"
 vrc_gather_high_confirm:0 "Convene the gathering"
 vrc.100.t:0 "The Garden Outside the Ward"
 vrc.100.desc:0 "The keepers have drawn a lattice around the capital’s oldest gardens. Outside it, families cultivate a newer orchard whose roots break the ancient measurements. The younger wardens insist that serving Aeliun means protecting living growth. Their elders warn that careless changes could weaken every ward."
 vrc.100.a:0 "Measure the new orchard before altering anything."
 vrc.100.b:0 "Give the families the keepers’ own protected plots."
 vrc.100.c:0 "Preserve the ancient boundary."
 vrc.101.t:0 "A Root in the Pattern"
 vrc.101.desc:0 "The survey reveals that the orchard draws water from the very spring feeding the old gardens. A living lattice can encompass both, but rebuilding the channel costs labor. The alternative is a rigid ward that forces growth into the old design."
 vrc.101.a:0 "Rebuild the channel for both gardens."
 vrc.101.b:0 "Guide the roots with my own threads."
 vrc.101.c:0 "Keep the spring open while we save for the work."
 vrc.102.t:0 "The Keeper Who Cannot Hear"
 vrc.102.desc:0 "A respected keeper admits that the Weave no longer answers as clearly as it once did. Their maps remain exact, their hands steady. Some demand retirement; others say Aeliun’s service cannot be measured only by power drawn from the threads."
 vrc.102.a:0 "Make patient observation a duty equal to spellcraft."
 vrc.102.b:0 "Let the conservatory preserve their measurements."
 vrc.102.c:0 "The strongest wardens must carry the burden."
 vrc.103.t:0 "Light That Will Not Yield"
 vrc.103.desc:0 "A section of the Dawn Lattice refuses to admit a repaired gate. The stone is sound; the pattern still remembers the gate that fell. The keepers face a small version of an ancient danger: order that cannot recognize repair."
 vrc.103.a:0 "Teach the ward to recognize what lives now."
 vrc.103.b:0 "Suspend this section until it can be remade."
 vrc.103.c:0 "Force the new gate into the old pattern."
 vrc_gather_deep:0 "Sponsor the School of Unfinished Forms"
 vrc_gather_deep_desc:0 "Deep Elf artisans bring Khaos’s possibilities into craft. Decide how to share their inventions, who bears the risks, and whether a new school may challenge its patron."
 vrc_gather_deep_tooltip:0 "Sponsor the School of Unfinished Forms"
 vrc_gather_deep_confirm:0 "Convene the gathering"
 vrc.200.t:0 "A Door That Has Not Chosen"
 vrc.200.desc:0 "An apprentice presents a doorway whose frame changes with the questions spoken before it. The Unwritten school sees proof that a thing need not accept its first form. Merchants see a product. The apprentice asks which future I intend to purchase."
 vrc.200.a:0 "Fund a public workshop, with watchers at the threshold."
 vrc.200.b:0 "Let the apprentice keep the invention."
 vrc.200.c:0 "Sell the novelty to a collector."
 vrc.201.t:0 "The Threshold Opens Inward"
 vrc.201.desc:0 "The doorway now leads into the workshop’s own unfinished designs. A worker returned carrying a tool no one remembers making. The school refuses to call this failure, but the people who work here deserve a choice about the risk."
 vrc.201.a:0 "Volunteers only; chart every return."
 vrc.201.b:0 "I will hold the threshold while they bring out the tools."
 vrc.201.c:0 "Close this experiment. Khaos offers other paths."
 vrc.202.t:0 "The Pupil’s Contradiction"
 vrc.202.desc:0 "A pupil has disproved the principle on which a celebrated Deep Elf master built an entire school. The master asks me to suppress the demonstration. Yet to serve Khaos is to admit that even our own patterns may deserve to be unmade."
 vrc.202.a:0 "Let the pupil demonstrate the new pattern."
 vrc.202.b:0 "Require both schools to preserve their experiments."
 vrc.202.c:0 "Protect the master’s reputation this time."
 vrc.203.t:0 "The Current Under the Skin"
 vrc.203.desc:0 "The Open Current has become familiar enough to feel harmless. A listener notices that I now reach for its strength even during ordinary study. Khaos opens possibilities; the body still bears the cost of drawing them through itself."
 vrc.203.a:0 "Close the extra current before habit becomes need."
 vrc.203.b:0 "Keep drawing, and record every symptom."
 vrc_gather_naga:0 "Convene the Keepers of Sacred Waters"
 vrc_gather_naga_desc:0 "Gather Naga water-keepers and clan elders. Restore channels, weigh ancestral claims, and develop Sacred Hydraulics without treating every neighboring people as an enemy."
 vrc_gather_naga_tooltip:0 "Convene the Keepers of Sacred Waters"
 vrc_gather_naga_confirm:0 "Convene the gathering"
 vrc.300.t:0 "Three Springs, One Basin"
 vrc.300.desc:0 "Three Naga clans remember different rites at the same spring. One guards its first emergence, another tends the channel, and the third shelters those displaced when an old cavern flooded. All depend on water that is beginning to turn bitter."
 vrc.300.a:0 "Send surveyors down all three channels."
 vrc.300.b:0 "Share the remaining clean water by household need."
 vrc.300.c:0 "Give precedence to the oldest cavern claim."
 vrc.301.t:0 "The Bitter Channel"
 vrc.301.desc:0 "The surveyors find mineral runoff behind an abandoned retaining wall. No fresh tools or tracks identify a living culprit. The clan stories name old enemies, but accusing one will not clean the spring."
 vrc.301.a:0 "Repair the wall and document what actually happened."
 vrc.301.b:0 "Have the cistern keepers divert the flow."
 vrc.301.c:0 "Close this channel and ration the other two."
 vrc.302.t:0 "A Memory Returned by Water"
 vrc.302.desc:0 "A flood deposits a carved coil from a vanished Naga clan. Its grooves preserve names omitted from the victorious clan’s history. The water-keepers ask whether the coil should be restored to public memory or kept where no descendant will demand an accounting."
 vrc.302.a:0 "Read every name beside the spring."
 vrc.302.b:0 "Build a record that can survive the next flood."
 vrc.302.c:0 "Keep it in the ruler’s private archive."
 vrc.303.t:0 "The Unopened Passage"
 vrc.303.desc:0 "Young First Cavern guards have found a narrow route beyond a sealed frontier. They want to prove themselves in the old struggle with the Stoneborn. The elders remind them that a clan survives by more than the enemies it can reach."
 vrc.303.a:0 "Survey it; no one crosses without an agreement."
 vrc.303.b:0 "Keep the passage closed under our sworn pact."
 vrc.303.c:0 "Send a formal proposal to a neighboring hold."
 vrc_gather_stone:0 "Call the Oathforge Moot"
 vrc_gather_stone_desc:0 "Stoneborn clans bring disputes over metal, ancestral obligations, and the safety of their holds. Their judgments can advance Oathbound Metallurgy and determine what an oath truly requires."
 vrc_gather_stone_tooltip:0 "Call the Oathforge Moot"
 vrc_gather_stone_confirm:0 "Convene the gathering"
 vrc.400.t:0 "The Hammer with Two Makers"
 vrc.400.desc:0 "Two clans claim the same improved furnace. One supplied the ore and tools; the other discovered the airflow that made it work. Their marks cannot both occupy the place reserved for a single maker. The next batch of steel waits while the elders argue."
 vrc.400.a:0 "Forge a shared mark and test the furnace together."
 vrc.400.b:0 "The discovery belongs to the hands that made it work."
 vrc.400.c:0 "Honor the material debt before distributing profit."
 vrc.401.t:0 "The First Shared Casting"
 vrc.401.desc:0 "The new furnace burns hotter than either clan expected. A support beam begins to bend as the first casting cools. Completing the work would vindicate the shared mark. Stopping now would show that a sworn promise includes responsibility for the workers beneath it."
 vrc.401.a:0 "Stop the casting and reinforce the supports."
 vrc.401.b:0 "Use the oathforge’s inspected supports."
 vrc.401.c:0 "Finish it despite the danger."
 vrc.402.t:0 "The Oath of a Dead Clan"
 vrc.402.desc:0 "A surviving ledger records a debt owed to a Stoneborn clan whose last hearth fell generations ago. The debtor’s descendants insist that no living claimant remains. The ledger’s keeper argues that an oath does not become worthless when its witnesses die."
 vrc.402.a:0 "Pay the debt into a fund for lost hearths."
 vrc.402.b:0 "Record the obligation until a rightful claimant appears."
 vrc.402.c:0 "Release the descendants from an unpayable burden."
 vrc.403.t:0 "A Tunnel Drawn in Two Hands"
 vrc.403.desc:0 "A Stoneborn map and a recovered Naga coil describe the same gallery. Each records a different attack as the beginning of the war. Their measurements agree even where their accusations do not. The hold’s elders ask which account belongs in its public records."
 vrc.403.a:0 "Keep both accounts beside the surveyed map."
 vrc.403.b:0 "Use the measurements to propose a sealed frontier."
 vrc.403.c:0 "Honor our dead without claiming this ends the dispute."
 vrc_current_risk:0 "The Open Current remains active. Existing Weave Atrophy continues to use net monthly magical income; this choice grants no protection from it."
 vrc_shared_harvest:0 "Shared Living Gardens"
 vrc_shared_harvest_desc:0 "A revised ward protects the gardens and the households that tend them."
 vrc_preserved_knowledge:0 "A Public Record"
 vrc_preserved_knowledge_desc:0 "Conflicting accounts and practical observations are preserved for future students."
 vrc_shared_water:0 "Protected Common Waters"
 vrc_shared_water_desc:0 "Inspected channels and shared access sustain the local households."
 vrc_safe_workshops:0 "Inspected Clan Workshops"
 vrc_safe_workshops_desc:0 "The clans have bound their reputations to safe and dependable work."
