 pirate_elective_candidates:0 "Close Family and Electors"
 pirate_elective_candidates_tooltip:1 "In order to be a valid Candidate under Pirate Elective, a character must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be a legitimate [close_family|E] member of the current ruler, who is not in line to inherit a Theocracy or Republic. Children of a candidate cannot be nominated\n$EFFECT_LIST_BULLET$Be a valid Feudal [elector|E] to the title"
 pirate_elective_electors:0 "Ruler and Vassals"
 pirate_elective_electors_tooltip:0 "In order to be a valid [elector|E] under Pirate Elective, a vassal must fulfill all the following conditions:\n$EFFECT_LIST_BULLET$Have a [GetGovernment( 'pirate_government' ).GetName] government\n$EFFECT_LIST_BULLET$Be a [de_jure|E] or direct vassal of the title\n$EFFECT_LIST_BULLET$Be only one or two [ranks|E] below the title"
