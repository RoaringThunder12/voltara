l_english:
 dhm090_instructions_open:0 "Household Instructions"
 dhm090_instructions_title:0 "A Word Before You Begin"
 dhm090_instructions_intro:0 "Your steward waits with the household accounts.\n\n'How much freedom shall I give the officers, my liege?'"
 dhm090_reserve_on_desc:0 "\n#bold Reserve:#! Keep #V 100 gold#! untouched by officer thank-you gifts."
 dhm090_reserve_off_desc:0 "\n#bold Reserve:#! No extra reserve. Officer gifts still require enough gold."
 dhm090_allowance_on_desc:0 "\n#bold Officer gifts:#! Up to #N 10 gold#! once a year, after successful work. Larger celebrations still await your choice."
 dhm090_allowance_off_desc:0 "\n#bold Officer gifts:#! No automatic spending."
 dhm090_retention_on_desc:0 "\n#bold Tutors:#! Keep a capable teacher when a child's subject changes."
 dhm090_retention_off_desc:0 "\n#bold Tutors:#! Choose a new specialist when a child's subject changes."
 dhm090_reserve_on:0 "Keep 100 gold in reserve for officer gifts."
 dhm090_reserve_off:0 "Do not set aside an extra reserve."
 dhm090_allowance_on:0 "Allow small thank-you gifts for good service."
 dhm090_allowance_off:0 "Bring spending decisions to me."
 dhm090_retention_on:0 "Keep teachers who can teach the new subject."
 dhm090_retention_off:0 "Find a new specialist when the subject changes."
 dhm090_instructions_back:0 "Back to Preferences"
 dhm090_allowance_permission_tt:0 "Permit a #N 10-gold#! thank-you after successful officer work, at most once a year. The officer gains #P 10 Opinion#! for #V 3 years#!. Public thanks relieve Stress for an Ambitious officer but add Stress for a Shy one.\n\nThis permission belongs to you; a new ruler must grant it again. It never permits a marriage, title grant or larger celebration."
 dhm090_allowance_receipt_title:0 "A Small Thanks for Good Service"
 dhm090_allowance_receipt_desc:0 "As you allowed, the steward spent #N 10 gold#! thanking [dhm_story_officer.GetShortUIName] for completed work. The officer gains #P 10 Opinion#! of you for #V 3 years#!. No further gift will be paid for a year."
 dhm090_officer_thanked_opinion:0 "Thanked Me for Good Service"
 dhm090_responsibility_opinion:0 "Trusted Me to Help"
 dhm090_mediator_peace_opinion:0 "Helped End Our Quarrel"
 dhm090_mediator_blame_opinion:0 "Made Our Quarrel Worse"
 dhm090_dispute_accept_helper:0 "[dhm090_mediator.GetFirstName], speak with them for me."
 dhm090_mediator_risk_tt:0 "A relative you helped offers to mediate. You #P lose a little Stress#! but #N give up Prestige#! as they take the credit. The helper #N takes on Stress#! and gains #P 10 Opinion#! of you for #V 5 years#!.\n\nThe chance of peace starts at #V 60%#!. Diplomacy of 12 or more and Patience improve it; Wrath makes it worse. Success improves the relatives' opinions of one another and their helper. Failure leaves the quarrel unresolved and both blame the helper (#N -10 Opinion#! for #V 3 years#!). This helper cannot take another such case for five years."
 dhm090_mediator_ending_peace:0 "\n\n[dhm090_mediator.GetFirstName] kept the two talking when you could not spare the time. The kindness you once showed has returned to the household."
 dhm090_mediator_ending_blame:0 "\n\n[dhm090_mediator.GetFirstName] tried to help, but both relatives took offence. A willing voice was not enough to settle this quarrel."
 dhm090_offer_lapsed_tt:0 "The people or circumstances have changed. No new cost or reward is applied."
 dhm090_spouse_child_plan:0 "Take the child under your care for a while."
 dhm090_spouse_child_ending:0 "[dhm_partner_spouse.GetFirstName] took time to help [dhm_protected_child.GetFirstName] through a difficult spell. You left that work in trusted hands.\n\n'We had fewer quarrels once there was time to listen.'"
 dhm090_spouse_policy_plan_desc:0 "[dhm_partner_spouse.GetFirstName] closes the household accounts.\n\n'[dhm090_overworked_relative.GetFirstName] is worn thin. Let us share the burden before it becomes a quarrel.'\n\nYour spouse offers to help someone they care for. You can take part, leave the work to them, or insist that the present duties stand."
 dhm090_marriage_report_open:0 "Why Is This Match Waiting?"
 dhm090_marriage_report_title:0 "A Word With the Matchmaker"
 dhm090_marriage_report_intro:0 "#bold [dhm_profile_target.GetShortUIName]'s marriage arrangements#!\n"
 dhm090_report_unavailable:0 "#N Not available#!\nCaptivity, hostage duties or incapacity prevent the office from arranging a match. These circumstances must change first."
 dhm090_report_age:0 "#V Too young for the office#!\nDHM begins considering betrothals at twelve. No setting can override CK3's marriage-age rules."
 dhm090_report_betrothed:0 "#V Already betrothed#!\nThere is no need to find another partner. Check the existing betrothal in the character window."
 dhm090_report_wedding:0 "#V A Grand Wedding is promised#!\nDeal with the existing wedding through CK3. DHM will not replace that promise with an ordinary marriage."
 dhm090_report_away:0 "#V Living elsewhere#!\nThis person is outside your household. DHM will not take marriage authority from another court."
 dhm090_report_manual:0 "#V Waiting for your orders#!\nThe current personal or household setting does not permit an automated search. Open Marriage Settings below if you want assistance."
 dhm090_report_authority:0 "#V Another matchmaker has authority#!\nThe office cannot act under the current household rules. Use CK3's marriage interaction to see who can arrange this person's marriage."
 dhm090_report_no_candidate:0 "\nThe last search found no acceptable match in the people it checked. That does not prove that no match exists anywhere.\n\nReview any optional faith or culture filter below, or try a manual search in CK3. DHM will not relax a rule without your choice."
 dhm090_report_no_known_hold:0 "#V No recorded waiting order#!\nThis is not a promise of a match. CK3 legality, spouse capacity, availability and candidate acceptance are checked during the next search. The household report has a manual scan when you need one."
 dhm090_report_filters:0 "\n\n#bold Your optional filters#!\nA same-faith or same-culture preference is enabled for this person. You may change it under Marriage Strategy; the office will still respect CK3's laws."
 dhm090_report_limits:0 "\n\nThis page reads existing records. It does not search for spouses or change your rules."
 dhm090_report_household:0 "Open the Household Matchmaking Report"
 dhm090_triumph_school_desc:0 "The household's latest chapter belongs to the schoolroom. A difficult lesson, and the people who stayed with it, deserve to be remembered.\n\nYour chronicler lays the record before you. 'How shall we mark what they achieved?'"
 dhm090_triumph_private_desc:0 "This chapter was earned behind a chamber door, not on a battlefield. Your family found a way through a difficult time.\n\nThe chronicler waits with a clean page. You can make much of it, share the credit, or keep a quieter record."
 dhm090_school_keepsake_name:0 "The Schoolroom Keepsake"
 dhm090_school_keepsake_desc:0 "A small wooden box holding copied lesson notes, preserved by [dhm090_keepsake_patron.GetName] when the household Chronicle marked a hard-earned schoolroom chapter. The writing is plain; the effort it records was not."
 dhm090_peace_keepsake_name:0 "A Token of Peace at Home"
 dhm090_peace_keepsake_desc:0 "A small wooden box holding a written account of a household reconciliation or shared family duty, preserved by [dhm090_keepsake_patron.GetName]. A reminder that peace at home sometimes takes more work than victory abroad."
 dhm090_chronicle_keepsake_name:0 "The Household's First Keepsake"
 dhm090_chronicle_keepsake_desc:0 "A small wooden box holding a copy from the household Chronicle, preserved by [dhm090_keepsake_patron.GetName] after a newly earned chapter brought the household to a milestone. Kept for the family, not made for sale."
 dhm090_keepsake_awarded_tt:0 "Receive a modest #P household keepsake#! for your inventory: #P +0.04 monthly Prestige#! while equipped. Normal artifact ownership, durability and inheritance rules apply.\n\nOnly one DHM keepsake can be earned in this campaign. It is not replaced if sold, lost or destroyed."
 dhm_v090_school_diplomacy_risk_tt:0 "The lesson starts with a #V 55%#! chance of progress. Your tutor's Diplomacy (12 and 18), Learning (12 and 18), the pupil's Diplomacy (6), Patience and their earlier success together improve the chance. A Lazy tutor reduces it. With these factors the chance ranges from #V 50% to 76%#!.\n\n#P Success:#! the pupil receives the subject bonus for two years. #N Setback:#! the pupil gains resentment and Stress. The tutor takes on work and Stress either way."
 dhm_v090_school_martial_risk_tt:0 "The lesson starts with a #V 55%#! chance of progress. Your tutor's Martial (12 and 18), Learning (12 and 18), the pupil's Martial (6), Patience and their earlier success together improve the chance. A Lazy tutor reduces it. With these factors the chance ranges from #V 50% to 76%#!.\n\n#P Success:#! the pupil receives the subject bonus for two years. #N Setback:#! the pupil gains resentment and Stress. The tutor takes on work and Stress either way."
 dhm_v090_school_stewardship_risk_tt:0 "The lesson starts with a #V 55%#! chance of progress. Your tutor's Stewardship (12 and 18), Learning (12 and 18), the pupil's Stewardship (6), Patience and their earlier success together improve the chance. A Lazy tutor reduces it. With these factors the chance ranges from #V 50% to 76%#!.\n\n#P Success:#! the pupil receives the subject bonus for two years. #N Setback:#! the pupil gains resentment and Stress. The tutor takes on work and Stress either way."
 dhm_v090_school_intrigue_risk_tt:0 "The lesson starts with a #V 55%#! chance of progress. Your tutor's Intrigue (12 and 18), Learning (12 and 18), the pupil's Intrigue (6), Patience and their earlier success together improve the chance. A Lazy tutor reduces it. With these factors the chance ranges from #V 50% to 76%#!.\n\n#P Success:#! the pupil receives the subject bonus for two years. #N Setback:#! the pupil gains resentment and Stress. The tutor takes on work and Stress either way."
 dhm_v090_school_learning_risk_tt:0 "The lesson starts with a #V 55%#! chance of progress. Your tutor's Learning (12 and 18, used for both subject knowledge and teaching), the pupil's Learning (6), Patience and their earlier success together improve the chance. A Lazy tutor reduces it. With these factors the chance ranges from #V 50% to 76%#!.\n\n#P Success:#! the pupil receives the subject bonus for two years. #N Setback:#! the pupil gains resentment and Stress. The tutor takes on work and Stress either way."

 dhm090_scandal_killing_desc:0 "Since [dhm_crisis_relative.GetFirstName]'s part in a killing became known, the household has struggled to speak of anything else.\n\n'Whatever I say now, they hear only that,' [dhm_crisis_relative.GetSheHe] tells you.\n\nYou can stand beside your kin, demand a public reckoning, or pay toward making amends. None of it will bring the dead back."
 dhm090_scandal_affair_desc:0 "[dhm_crisis_relative.GetFirstName]'s affair is no longer private. What your faith condemns is now being discussed at every table.\n\n'I know what they are saying. Must it follow me everywhere?'\n\nYou can defend your kin, insist on a public apology, or help repair the damage to the household."

 dhm090_scandal_unwed_desc:0 "[dhm_crisis_relative.GetFirstName]'s relationship outside marriage has become household gossip. Your faith condemns it, and silence has done little to quiet the talk.\n\n'I cannot take it back. What would you have me do now?'\n\nYou can stand beside your kin, call for an apology, or help make amends."

 dhm090_rc2_changed_dismiss:0 "This matter must wait."
 dhm090_rc2_teacher_absent:0 "\n\nThe teacher can no longer attend. That need not prevent a fair judgement of the pupil's earlier work."
 dhm090_rc2_letter_strained:0 "There is strain in my marriage, and our disagreements weigh on me. A word from home would be welcome."
 dhm090_rc2_letter_content_neutral:0 "I ask for nothing grand. A letter from home would be welcome. Tell me how our kin are faring."
