l_english:
 dhm_v080_officer_replacement_desc:0 "\n\nThe present holder, [dhm_office_incumbent.GetShortUIName], must surrender the keys before [dhm_office_candidate.GetFirstNameNoTooltip] can take them. A better hand may improve the work, but service cast aside is not soon forgotten."
 dhm_v080_officer_vacancy_desc:0 "\n\nThe chair stands empty. This appointment fills it without displacing another servant of the house."
 dhm_v080_replace_established_officer_tt:0 "#N [dhm_office_incumbent.GetShortUIName] loses 10 Loyalty, resents the dismissal, and Household Cohesion falls slightly.#! #P [dhm_office_candidate.GetShortUIName] keeps any Loyalty earned before.#! Years of service in this office begin again at zero; the appointment itself grants no reward."
 dhm_v080_replace_new_officer_tt:0 "#N [dhm_office_incumbent.GetShortUIName] loses 5 Loyalty and resents the dismissal.#! #P [dhm_office_candidate.GetShortUIName] keeps any Loyalty earned before.#! Years of service in this office begin again at zero; the appointment itself grants no reward."
 dhm_v080_fill_vacant_office_tt:0 "#P The office is filled, and [dhm_office_candidate.GetShortUIName] keeps any Loyalty earned before.#! Years of service in this office begin again at zero; the appointment itself grants no reward."
 dhm_v080_appointment_changed_tt:0 "The office or candidate changed while this petition was open. Nothing happens. Open the officer ledger and choose again."

 dhm_v080_officer_brief_service_ended_opinion:0 "Removed Me Before I Could Prove Myself"
 dhm_v080_officer_long_service_ended_opinion:0 "Cast Aside My Years of Service"
 dhm_v080_officer_service_proven_opinion:0 "Recognized My Proven Service"
 dhm_v080_officer_long_service_opinion:0 "Honored My Long Service"

 dhm_v080_profile_career_diplomat:0 "\n\n@skill_diplomacy_icon! #bold Household Career:#! Diplomacy and Chancery"
 dhm_v080_profile_career_commander:0 "\n\n@skill_martial_icon! #bold Household Career:#! Command and Knighthood"
 dhm_v080_profile_career_steward:0 "\n\n@skill_stewardship_icon! #bold Household Career:#! Stewardship and Administration"
 dhm_v080_profile_career_spymaster:0 "\n\n@skill_intrigue_icon! #bold Household Career:#! Secrets and Intelligence"
 dhm_v080_profile_career_scholar:0 "\n\n@skill_learning_icon! #bold Household Career:#! Scholarship and Clergy"
 dhm_v080_profile_career_physician:0 "\n\n@health_icon! #bold Household Career:#! Medicine"
 dhm_v080_profile_career_officer:0 "\n\n@court_position_icon! #bold Household Career:#! Court Office"
 dhm_v080_profile_career_achieved:0 "#P Achieved#! — [dhm_profile_target.GetSheHe|U] has served in a post that matches this plan. The appointment made it real; writing the plan granted no skill."
 dhm_v080_profile_career_redirected:0 "#high Redirected#! — [dhm_profile_target.GetSheHe|U] entered another serious duty. The ledger records both the road first chosen and the work actually taken."
 dhm_v080_profile_career_blocked:0 "#N Blocked#! — Imprisonment or incapacity bars the road. No year of progress is counted while [dhm_profile_target.GetSheHe] cannot serve."
 dhm_v080_profile_career_ready:0 "#P Ready#! — The needed skill has reached 12. This plan cannot appoint [dhm_profile_target.GetHerHim]; a suitable post must still be found."
 dhm_v080_profile_career_missed:0 "#N Missed#! — Eight years passed without enough skill or a matching appointment. You may choose another road without penalty."
 dhm_v080_profile_career_preparing:0 "#high Preparing#! — [dhm_profile_target.GetSheHe|U] holds no matching post, and the needed skill is still below 12."

 dhm_v080_profile_child_diplomacy:0 "\n\n@skill_diplomacy_icon! #bold Childhood Plan:#! Diplomacy"
 dhm_v080_profile_child_martial:0 "\n\n@skill_martial_icon! #bold Childhood Plan:#! Martial Training"
 dhm_v080_profile_child_stewardship:0 "\n\n@skill_stewardship_icon! #bold Childhood Plan:#! Stewardship"
 dhm_v080_profile_child_intrigue:0 "\n\n@skill_intrigue_icon! #bold Childhood Plan:#! Intrigue"
 dhm_v080_profile_child_learning:0 "\n\n@skill_learning_icon! #bold Childhood Plan:#! Learning"
 dhm_v080_profile_child_achieved:0 "#P Achieved#! — The child's final education followed this road and reached rank two or better."
 dhm_v080_profile_child_redirected:0 "#high Redirected#! — The child's final education followed another road. The plan did not change or replace that education."
 dhm_v080_profile_child_missed:0 "#N Missed#! — The chosen field ended without a sound result. No skill is awarded merely because a plan was written."
 dhm_v080_profile_child_foundation:0 "#high Foundation#! — It is too early to judge. The plan records your hope; it does not change the child's lessons."
 dhm_v080_profile_child_focus_changed:0 "#high Changed Course#! — The child's real Education Focus follows another road. The plan has not changed the lessons."
 dhm_v080_profile_child_promising:0 "#P On Course#! — Focus and plan agree, and the relevant skill has reached 10."
 dhm_v080_profile_child_needs_work:0 "#high Underway#! — Focus and plan agree, but the relevant skill has not yet reached 10."

 dhm_v080_personal_plan_report:0 "\n\n#bold Adult Career Plans#!\nPlans: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_career_total').GetValue|0]#!  |  Achieved: #P [ROOT.Char.MakeScope.Var('dhm_v080_report_career_achieved').GetValue|0]#!  |  Ready: #P [ROOT.Char.MakeScope.Var('dhm_v080_report_career_ready').GetValue|0]#!\nRedirected: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_career_redirected').GetValue|0]#!  |  Blocked: #N [ROOT.Char.MakeScope.Var('dhm_v080_report_career_blocked').GetValue|0]#!  |  Missed: #N [ROOT.Char.MakeScope.Var('dhm_v080_report_career_missed').GetValue|0]#!"
 dhm_v080_child_plan_report:0 "\n\n#bold Children's Education Plans#!\nStill learning: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_child_active').GetValue|0]#!  |  Achieved: #P [ROOT.Char.MakeScope.Var('dhm_v080_report_child_achieved').GetValue|0]#!\nRedirected: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_child_redirected').GetValue|0]#!  |  Missed: #N [ROOT.Char.MakeScope.Var('dhm_v080_report_child_missed').GetValue|0]#!\n#weak Right-click a household member and open their profile to see why.#!"
