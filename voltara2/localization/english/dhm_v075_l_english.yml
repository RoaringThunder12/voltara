 dhm_v075_preferences_work:0 "Office and Family Rules"
 dhm_v075_preferences_work_desc:0 "Choose how the office works. These rules do not change who may arrange a marriage."
 dhm_v075_preferences_stories:0 "Letters and Household Stories"
 dhm_v075_preferences_stories_desc:0 "Decide what reaches your door. Turning stories off does not cancel decisions already in progress."
 dhm_v075_story_settings:0 "Stories and Letters"
 dhm_v075_work_settings:0 "Office and Family Rules"
 dhm_v075_waiting:0 "Who Is Still Waiting?"
 dhm_v075_waiting_title:0 "The Waiting List"
 dhm_v075_waiting_help:0 "\n\nFor a relative's own waiting reason and retry date, right-click them and open their household profile. Opening a report does not search for spouses."
 dhm_v075_profile_retry:0 "\n\n#bold Waiting#!\nMay be reconsidered after #V [GetCurrentDateWithDiff( GetVarTimeRemaining( dhm_profile_target.MakeScope, 'dhm_matchmaking_retry_cooldown') )]#!, when the household next reviews its matches."
 dhm_v075_retry_no_candidate:0 "\nThe last search found no acceptable candidate in the people it checked. Open the personal matchmaking report for useful next steps."
 dhm_v075_retry_refusal:0 "\nA proposal was refused or set aside. The office is giving this person time."
 dhm_v075_retry_wish:0 "\nYou agreed to give this relative time before another proposal."
 dhm_v075_retry_negotiation:0 "\nNegotiations were delayed. The office will not immediately ask again."
 dhm_v075_retry_legacy:0 "\nAn earlier decision set this wait; the old record does not say why."
 dhm_v075_profile_pending:0 "\n\n#bold Proposal pending#!\nAn existing proposal or courtship must finish or lapse before the office starts another."
 dhm_v075_profile_recent:0 "\n\n#bold Recently matched#!\nProtected until #V [GetCurrentDateWithDiff( GetVarTimeRemaining( dhm_profile_target.MakeScope, 'dhm_matchmaking_cooldown') )]#!."
 dhm_v075_digest_open:0 "Read the Steward's Digest"
 dhm_v075_digest_title:0 "A Letter from the Steward"
 dhm_v075_digest_intro:0 "A short account of the household's work since the last letter. There is nothing here that needs a ruling."
 dhm_v075_digest_empty:0 "\n\nNo new work has been recorded since the last digest. The earlier Chronicle remains unchanged."
 dhm_v075_digest_on:0 "Send a Quiet Yearly Digest"
 dhm_v075_digest_off:0 "Keep the Digest in the Ledger"
 dhm_v075_digest_enabled:0 "\n\n#P Yearly letters enabled.#! A small notification is sent only when there is new work to report."
 dhm_v075_digest_disabled:0 "\n\n#high Yearly letters off.#! You may read the latest account here whenever you wish."
 dhm_v075_digest_tt:0 "Optional notification, not a new event chain. At most one letter per year; years without recorded work stay quiet. Turning this on starts a new reporting period."
 dhm_v075_digest_ack:0 "That Will Be All"
 dhm_v075_report_summary:0 "#bold Family Matches#!\nUnmarried adults: #V [ROOT.Char.MakeScope.Var('dhm_report_total').GetValue|0]#!  |  Ready or queued: #V [ROOT.Char.MakeScope.Var('dhm_report_ready').GetValue|0]#!"
 dhm_v075_scan_result:0 "\n\n#bold Last Pass Results#!\nTried: #V [ROOT.Char.MakeScope.Var('dhm_scan_family_attempted').GetValue|0]#! family / #V [ROOT.Char.MakeScope.Var('dhm_scan_courtier_attempted').GetValue|0]#! courtiers\nMarried: #V [ROOT.Char.MakeScope.Var('dhm_scan_matched').GetValue|0]#!  |  Proposals: #V [ROOT.Char.MakeScope.Var('dhm_scan_proposals').GetValue|0]#!"
 dhm_v075_digest_no_previous:0 "\n\nNo yearly letter has been sent for this ruler yet."
 dhm_v075_digest_previous:0 "\n\nLast letter: #V [GetCurrentDateWithDiff( FixedPointToInt( ROOT.Char.MakeScope.ScriptValue('dhm_v075_last_digest_offset_value') ) )]#!. It recorded #V [ROOT.Char.MakeScope.Var('dhm075_digest_last_matches').GetValue|0]#! matches and #V [ROOT.Char.MakeScope.Var('dhm075_digest_last_reconciliations').GetValue|0]#! reconciliations."
 dhm_v075_digest_current:0 "\n\n#bold Recorded This Period#!\nMatches arranged: #V [ROOT.Char.MakeScope.Var('dhm075_digest_matches').GetValue|0]#!\nFamily letters: #V [ROOT.Char.MakeScope.Var('dhm075_digest_letters').GetValue|0]#!\nSchoolroom matters: #V [ROOT.Char.MakeScope.Var('dhm075_digest_education').GetValue|0]#!\nMarriage matters: #V [ROOT.Char.MakeScope.Var('dhm075_digest_marriage_stories').GetValue|0]#!\nDisputes heard: #V [ROOT.Char.MakeScope.Var('dhm075_digest_disputes').GetValue|0]#!\nMarriage wishes: #V [ROOT.Char.MakeScope.Var('dhm075_digest_wishes').GetValue|0]#!\nFamily ceremonies: #V [ROOT.Char.MakeScope.Var('dhm075_digest_ceremonies').GetValue|0]#!\nReconciliations: #V [ROOT.Char.MakeScope.Var('dhm075_digest_reconciliations').GetValue|0]#!"
 dhm_v075_digest_letter_desc:0 "My liege, the household account is ready.\nMatches: [SCOPE.GetValue('dhm075_digest_matches')|0]  |  Letters: [SCOPE.GetValue('dhm075_digest_letters')|0]\nLessons: [SCOPE.GetValue('dhm075_digest_education')|0]  |  Marriages: [SCOPE.GetValue('dhm075_digest_marriage_stories')|0]\nDisputes: [SCOPE.GetValue('dhm075_digest_disputes')|0]  |  Wishes: [SCOPE.GetValue('dhm075_digest_wishes')|0]\nCeremonies: [SCOPE.GetValue('dhm075_digest_ceremonies')|0]  |  Reconciliations: [SCOPE.GetValue('dhm075_digest_reconciliations')|0]"
 dhm_v075_courtship_letters_recap:0 "\n\nI gave them time to exchange letters before the terms were settled."
 dhm_v075_courtship_meeting_recap:0 "\n\nI asked the families to meet before making a final promise."
 dhm_v075_courtship_seal_recap:0 "\n\nI pressed for a quick agreement. The remaining objections must now be settled."
 dhm_v080_auto_scan_pending_window:0 "A marriage proposal already awaits your judgment. The steward has left the other ledgers closed, lest several families arrive at your door at once.\n\n#weak Answer or allow the existing proposal to lapse, then call for another review. No matchmaking pass was performed.#!"
 dhm_v080_auto_scan_wait_window:0 "The household was reviewed recently. The clerk has not disturbed the same families again, and may reopen the ledgers after #V [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'dhm_v080_auto_manual_scan_cooldown') )]#!.\n\n#weak No matchmaking pass was performed.#!"
 dhm_v080_auto_scan_pending_report:0 "\n\n#high No new pass was run: a marriage proposal still awaits your judgment.#!"
 dhm_v080_auto_scan_wait_report:0 "\n\n#high No new pass was run.#! The ledgers may be reopened after #V [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'dhm_v080_auto_manual_scan_cooldown') )]#!."
 dhm_v080_auto_scan_pending_menu:0 "\n\n#high No new review was run.#! A marriage proposal already awaits your judgment."
 dhm_v080_auto_scan_wait_menu:0 "\n\n#high No new review was run.#! The ledgers may be reopened after #V [GetCurrentDateWithDiff( GetVarTimeRemaining( ROOT.Char.MakeScope, 'dhm_v080_auto_manual_scan_cooldown') )]#!."
 dhm_v075_wedding_feast_recap:0 "\n\nI helped the families welcome the marriage with a feast."
 dhm_v075_wedding_customs_recap:0 "\n\nI asked both households to respect each other's customs."
 dhm_v075_wedding_modest_recap:0 "\n\nI kept the wedding modest, leaving the couple more room to settle in."
 dhm_living_family_0200_voice_1:0 "\n\n'I still think my answer was right,' [dhm_story_child.GetFirstName] insists."
 dhm_living_family_0200_voice_2:0 "\n\n'Will you show me where I went wrong?' [dhm_story_child.GetFirstName] asks."
 dhm_legacy_0150_voice_1:0 "\n\n'Let me finish the work, my liege. Then judge it,' [dhm_story_officer.GetFirstName] says."
 dhm_legacy_0150_voice_2:0 "\n\n'We cannot attend to every small matter,' [dhm_story_officer.GetFirstName] says."
 dhm_legacy_0200_voice_1:0 "\n\n'I know you have other duties,' [dhm_ambition_target.GetFirstName] says. 'But I cannot keep waiting for my life to begin.'"
 dhm_legacy_0200_voice_2:0 "\n\n'I do not ask for much,' [dhm_ambition_target.GetFirstName] says. 'This one thing matters to me.'"
 dhm_saga_2200_voice_1:0 "\n\n'Let me take the lead,' [dhm_heir.GetFirstName] says. 'I cannot learn command from the doorway.'"
 dhm_saga_2200_voice_2:0 "\n\n'I will do my duty,' [dhm_heir.GetFirstName] says, 'but I would welcome someone experienced beside me.'"
 dhm_saga_4000_voice_1:0 "\n\n'A frightened child will agree to anything,' [dhm_partner_spouse.GetFirstName] says. 'Let us hear the truth first.'"
 dhm_saga_4000_voice_2:0 "\n\n'The rule should be fair, even when it concerns our own family,' [dhm_partner_spouse.GetFirstName] says."
 dhm_saga_5000_voice_1:0 "\n\n[dhm_marriage_candidate.GetFirstName] asks to exchange letters first. 'It is easier to speak without a whole table listening.'"
 dhm_saga_5000_voice_2:0 "\n\n'Let us meet before the families decide everything,' [dhm_marriage_candidate.GetFirstName] suggests."
 dhm_saga_6210_voice_1:0 "\n\n'Could the family stay a while?' [dhm_mourner.GetFirstName] asks. 'The room feels too quiet.'"
 dhm_saga_6210_voice_2:0 "\n\n'No gathering, please,' [dhm_mourner.GetFirstName] says. 'Just sit with me for a little while.'"
 dhm_saga_6300_voice_1:0 "\n\n'I am willing to try again,' [dhm_crisis_relative.GetFirstName] says. 'But we must both mean it.'"
 dhm_saga_6300_voice_2:0 "\n\n'Am I simply to forget what happened?' [dhm_crisis_relative.GetFirstName] asks. 'I want an honest apology.'"
