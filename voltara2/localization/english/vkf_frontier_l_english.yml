 activity_vkf_war_council_desc:0 "Gather the rulers of Southorion to negotiate grievances, oaths, concessions and strategy. Attendance does not imply allegiance."
 activity_vkf_war_council_host_desc:0 "Bind willing rulers to a common cause."
 activity_vkf_war_council_guest_desc:0 "Pursue your own interests without surrendering independence."
 activity_vkf_war_council_province_desc:0 "The host capital shelters the council."
 vkf_council_location:0 "The host capital"
 activity_vkf_war_council_selection_tooltip:0 "Negotiate the obligations that make a coalition possible."
 vkf_revoke_promise:0 "Revoke the Council Guarantee"
 vkf_revoke_promise_desc:0 "End the promised reduction in obligations. The affected ruler loses allegiance and gains a grievance; the decision damages your prestige."
 activity_vkf_war_council_conclusion_desc:0 "The assembly has concluded; only explicitly sworn pledges remain binding."
 vkf_prepare_campaign:0 "Prepare the Kartholos Campaign"
 vkf_prepare_campaign_desc:0 "Buy supplies, commission scouts, or draw on pastoral wealth. Every contribution has a real cost."
 vkf_prepare_campaign_tooltip:0 "Buy supplies, commission scouts, or draw on pastoral wealth. Every contribution has a real cost."
 vkf_prepare_campaign_confirm:0 "Proceed"
 vkf_contribute:0 "Contribute to the Campaign"
 vkf_contribute_desc:0 "Offer thirty gold in stores or specialist assistance. No armies are duplicated."
 vkf_grazing_request:0 "Request Seasonal Grazing Rights"
 vkf_grazing_request_desc:0 "Ask for a five-year agreement to use the ruler's capital county as a seasonal pasture. Ownership does not change."
 vkf_revoke_grazing:0 "Revoke Seasonal Grazing Rights"
 vkf_revoke_grazing_desc:0 "Break this pasture agreement, creating a grievance and ending its supply benefit."
 vkf_pastoral_reform:0 "Restore the Pastoral Clan"
 vkf_pastoral_reform_desc:0 "Adopt native nomadic government and holdings for this human Southron clan. Settled and nonhuman societies are not converted by coalition membership."
 vkf_pastoral_reform_tooltip:0 "Adopt native nomadic government and holdings for this human Southron clan. Settled and nonhuman societies are not converted by coalition membership."
 vkf_pastoral_reform_confirm:0 "Proceed"
 vkf_launch_invasion:0 "Launch the War for Kartholos"
 vkf_launch_invasion_desc:0 "Requires 60 supplies, 30 passage intelligence, 40 cohesion and at least two committed rulers. The objective is Karthalon county. Independent supporters receive a separate call to join."
 vkf_launch_invasion_tooltip:0 "Requires 60 supplies, 30 passage intelligence, 40 cohesion and at least two committed rulers. The objective is Karthalon county. Independent supporters receive a separate call to join."
