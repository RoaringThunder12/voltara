 vkf_passage_operation:0 "Prepare an Operation at the Passage"
 vkf_passage_operation_desc:0 "Spend fifty gold and twenty intelligence to weaken Karthalon's defenses for two years, or acquire better reconnaissance. Scouts or engineers are alternatives to help from Thorne."
 vkf_passage_operation_tooltip:0 "Spend fifty gold and twenty intelligence to weaken Karthalon's defenses for two years, or acquire better reconnaissance. Scouts or engineers are alternatives to help from Thorne."
 vkf_passage_operation_confirm:0 "Proceed"
 vkf_ancestral_request:0 "Renew Ancestral Grazing Rights"
 vkf_ancestral_request_desc:0 "Your dynasty remembers its previously recognized pasture. Ask its current holder for a new five-year agreement; neither succession nor this request transfers the county."
 vkf_ancestral_request_tooltip:0 "Your dynasty remembers its previously recognized pasture. Ask its current holder for a new five-year agreement; neither succession nor this request transfers the county."
 vkf_ancestral_request_confirm:0 "Proceed"
 vkf.1.t:0 "Fires Across the Water"
 vkf.1.desc:0 "[ROOT.Char.Var('vkf_target').Char.GetTitledFirstName] is the other party in this exchange. A coastal Southron ruler has been selected for a frontier expedition. There is no proven invasion here. An attack can disrupt supplies, but its victims may seek allies. I can instead open talks or keep our forces home."
 vkf.1.0:0 "Launch the expedition for twenty-five gold."
 vkf.1.1:0 "Offer talks instead."
 vkf.1.2:0 "Hold the strait."
 vkf.10.t:0 "Ashes of the Encampment"
 vkf.10.desc:0 "[ROOT.Char.Var('vkf_aggressor').Char.GetTitledFirstName] is the other party in this exchange. A Keeper expedition has disrupted our supplies. The loss is ours, not proof that every Southron people has accepted a common cause. We can demand compensation, seek neighboring support, or prepare our own recovery."
 vkf.10.0:0 "Call neighboring chiefs together."
 vkf.10.1:0 "Demand compensation."
 vkf.10.2:0 "Recover without seeking a coalition."
 vkf.11.t:0 "A Demand Across the Strait"
 vkf.11.desc:0 "[ROOT.Char.Var('vkf_claimant').Char.GetTitledFirstName] is the other party in this exchange. The chief harmed by our expedition demands forty gold in compensation. Paying can repair this grievance; refusing leaves it unresolved."
 vkf.11.0:0 "Pay forty gold and withdraw the accusation."
 vkf.11.1:0 "Refuse the demand."
 vkf.12.t:0 "Compensation Received"
 vkf.12.desc:0 "The Keepers have paid compensation and this incident is settled. Other chiefs must make their own judgments; this agreement does not bind all Southorion."
 vkf.12.0:0 "Return to my affairs."
 vkf.14.t:0 "Compensation Refused"
 vkf.14.desc:0 "The Keepers have rejected our demand. Our grievance remains. Calling neighboring chiefs together remains available through the regional gathering decision."
 vkf.14.0:0 "Return to my affairs."
 vkf.13.t:0 "Terms Across the Water"
 vkf.13.desc:0 "[ROOT.Char.Var('vkf_envoy').Char.GetTitledFirstName] is the other party in this exchange. A Keeper envoy offers talks instead of an expedition. We can agree to de-escalation or refuse. No supplies have been destroyed by this approach."
 vkf.13.0:0 "Accept a local understanding."
 vkf.13.1:0 "Refuse the approach."
 vkf.20.t:0 "A Neighbor Calls"
 vkf.20.desc:0 "[ROOT.Char.Var('vkf_inviter').Char.GetTitledFirstName] is the other party in this exchange. A Southron chief has called a gathering. Attendance does not surrender independence. I may recognize their leadership, promise conditional allegiance with autonomy, or refuse. These personal commitments last five years and do not bind my successor."
 vkf.20.0:0 "Recognize the common cause, while remaining independent."
 vkf.20.1:0 "Promise allegiance if the assembly recognizes their mandate."
 vkf.20.2:0 "Remain outside the gathering."
 vkf.30.t:0 "The First Gathering"
 vkf.30.desc:0 "The time for answers has passed. Only explicit pledges count. With at least two independent chiefs supporting me, I can seek the invasion mandate. A mandate creates no automatic subjects and declares no war."
 vkf.30.0:0 "Record the pledges and conclude the assembly."
 vkf.30.1:0 "Abandon this bid for leadership."
 vkf.31.t:0 "The Oath of the Banners"
 vkf.31.desc:0 "The assembly has concluded. Recognition from two independent chiefs, five hundred prestige and one hundred gold can establish the Southorion Invasion. The chiefs remain independent unless they later accept submission."
 vkf.31.0:0 "Proclaim the mandate: 100 gold and 500 prestige."
 vkf.31.1:0 "Leave the mandate unclaimed."
 vkf.32.t:0 "A Mandate, Not an Empire of Subjects"
 vkf.32.desc:0 "The Southorion Invasion has a recognized leader. My supporters retain their realms. The War Council can negotiate further commitments; supplies, intelligence and cohesion are required before a campaign for Karthalon."
 vkf.32.0:0 "Return to my affairs."
 vkf.40.t:0 "Fulfill the Oath"
 vkf.40.desc:0 "[ROOT.Char.Var('vkf_patron').Char.GetTitledFirstName] is the other party in this exchange. The recognized invasion leader invokes my personal allegiance pledge. Submission preserves my government and grants five years of reduced obligations. I may instead repudiate this pledge and lose prestige."
 vkf.40.0:0 "Honor the agreement and submit."
 vkf.40.1:0 "Offer an alliance instead of submission."
 vkf.40.2:0 "Repudiate my pledge."
 vkf.50.t:0 "A Banner Without Its Bearer"
 vkf.50.desc:0 "The leader to whom I pledged has died. My personal recognition and allegiance oath have ended. The successor must earn a new agreement; my independent realm is not transferred by this pledge."
 vkf.50.0:0 "Return to my affairs."
 vkf.100.t:0 "The Gathering of the Banners"
 vkf.100.desc:0 "Frontier Hostility: [GetGlobalVariable('vkf_hostility').GetValue|0]/100. Regional Unity: [GetGlobalVariable('vkf_unity').GetValue|0]/100.\n\nMy coalition: [ROOT.Char.Var('vkf_strength').GetValue|0] committed rulers; cohesion [ROOT.Char.Var('vkf_cohesion').GetValue|0]/100. Supplies [ROOT.Char.Var('vkf_supplies').GetValue|0]/100; intelligence [ROOT.Char.Var('vkf_intelligence').GetValue|0]/100. Military readiness belongs to a leader, not to the entire continent."
 vkf.100.0:0 "Return to my affairs."
 vkf.101.t:0 "Defenders or Provocateurs?"
 vkf.101.desc:0 "Holding the strait reduces escalation. Punitive operations target coastal chiefs. Pacification authorizes stronger disruption but generates wider hostility. The order must pay for its own operations unless the Crown agrees to support it."
 vkf.101.0:0 "Hold the Strait."
 vkf.101.1:0 "Authorize Punitive Expeditions."
 vkf.101.2:0 "Pursue Southern Pacification."
 vkf.101.3:0 "Request imperial support."
 vkf.102.t:0 "The Keepers Petition the Crown"
 vkf.102.desc:0 "The frontier commander requests eighty gold. Funding strengthens the order. A refusal leaves it to its own means; demanding restraint is a political request the order may reject."
 vkf.102.0:0 "Provide eighty gold."
 vkf.102.1:0 "Offer support only if the raids stop."
 vkf.102.2:0 "The order must support itself."
 vkf.103.t:0 "The Crown Demands Restraint"
 vkf.103.desc:0 "The Emperor asks us to hold the strait and stop provoking the southern clans. Our vows concern the strait; the order must judge whether obedience serves that mission."
 vkf.103.0:0 "Accept the restraint."
 vkf.103.1:0 "Our mission demands independence."
 vkf.210.t:0 "The Eagle Has Fallen"
 vkf.210.desc:0 "News of Cassian's death has reached Southorion. The circumstances known to my court do not identify a hidden assassin. Imperial uncertainty may offer room for cooperation, retaliation or diplomacy."
 vkf.210.0:0 "Gather our neighbors."
 vkf.210.1:0 "Prepare for a harsher frontier."
 vkf.210.2:0 "Keep the possibility of peace alive."
 vkf.120.t:0 "The Reckoning of Grievances"
 vkf.120.desc:0 "We have arrived at the War Council. Each delegate may seek protection, autonomy, spoils, alliance, a new leader, vengeance, peace or advantage. Attendance grants no allegiance. Our intent will shape what we ask of the host."
 vkf.120.0:0 "Ask for protection and common defense."
 vkf.120.1:0 "Insist on autonomy and customs."
 vkf.120.2:0 "Demand a share of future spoils."
 vkf.120.3:0 "Build an alliance of equals."
 vkf.120.4:0 "Challenge the leader's authority."
 vkf.120.5:0 "Demand vengeance against the Keepers."
 vkf.120.6:0 "Speak for peace."
 vkf.120.7:0 "Use the gathering to learn the routes."
 vkf.121.t:0 "The Oaths of the Banners"
 vkf.121.desc:0 "The host seeks a commitment. Cooperation preserves independence. Allegiance permits a later demand for submission. A blood oath adds a strong personal obligation. I can instead request concessions or leave unbound."
 vkf.121.0:0 "Swear cooperation, while retaining independence."
 vkf.121.1:0 "Swear allegiance to the recognized leader."
 vkf.121.2:0 "Swear a binding blood oath."
 vkf.121.3:0 "Make autonomy a condition of my allegiance."
 vkf.121.4:0 "Offer no pledge."
 vkf.122.t:0 "The Price of a Banner"
 vkf.122.desc:0 "A delegate will swear allegiance only with a five-year guarantee of reduced obligations and local customs. Agreeing creates an obligation that can be honored or broken later."
 vkf.122.0:0 "Guarantee their autonomy."
 vkf.122.1:0 "Reject the condition."
 vkf.123.t:0 "The Division of Spoils"
 vkf.123.desc:0 "Promises made before victory survive the celebration. I can reserve eighty gold for supporters now, instead of promising land I may never conquer. Only committed rulers can later receive this fund."
 vkf.123.0:0 "Reserve eighty gold for the pledged houses."
 vkf.123.1:0 "Promise no treasury rewards."
 vkf.124.t:0 "The War Table"
 vkf.124.desc:0 "Choose an approach to Karthalon. Scouts can expose the passage, engineers can prepare for the fortress, or diplomacy can preserve the coalition for a peaceful union. These preparations are paid, not free armies."
 vkf.124.0:0 "Prepare scouts and a passage survey for forty gold."
 vkf.124.1:0 "Prepare engineers and siege stores for sixty gold."
 vkf.124.2:0 "Work toward a union without invasion."
 vkf.125.t:0 "The Closing Oath"
 vkf.125.desc:0 "The council has ended. Only freely accepted pledges bind its delegates. We have neither acquired every guest as a subject nor declared a war by assembling. Review the Frontier to see our actual readiness."
 vkf.125.0:0 "Return to my affairs."
 vkf.150.t:0 "The Cost of Crossing"
 vkf.150.desc:0 "A large following cannot live on pledges alone. Supplies sustain the expedition and intelligence prepares the approaches. Resources belong to this leader; they are not shared with rival coalitions."
 vkf.150.0:0 "Purchase stores for fifty gold."
 vkf.150.1:0 "Send scouts for thirty gold."
 vkf.150.2:0 "Commit two hundred Herd to the supply train."
 vkf.150.3:0 "Wait until the coalition can afford it."
 vkf.151.t:0 "What Our People Can Offer"
 vkf.151.desc:0 "Our contribution should reflect resources we actually possess. We can pay for supplies, sponsor scouts, provide siege specialists or decline. No culture is compelled to serve a predetermined role."
 vkf.151.0:0 "Send thirty gold in supplies."
 vkf.151.1:0 "Sponsor scouts for twenty gold."
 vkf.151.2:0 "Send experienced engineers for forty gold."
 vkf.151.3:0 "Make no contribution."
 vkf.160.t:0 "The Seasonal Pastures"
 vkf.160.desc:0 "A pastoral neighbor requests access to seasonal pastures. This may renew their dynasty's ancestral agreement, or recognize land around my capital. The agreement lasts five years and does not transfer ownership."
 vkf.160.0:0 "Recognize their grazing rights."
 vkf.160.1:0 "Refuse access."
 vkf.161.t:0 "The Pastures Are Closed"
 vkf.161.desc:0 "Our recognized grazing access has been withdrawn. We may preserve the grievance, seek new lands through the normal migration system, or rebuild relations. Another ruler's county remains theirs."
 vkf.161.0:0 "Remember the broken agreement."
 vkf.161.1:0 "Seek another route and let this quarrel rest."
 vkf.170.t:0 "The Woven Totem"
 vkf.170.desc:0 "At fourteen, a woven-grass necklace marks a place in the clan. Its animal is a story to live with, not a command that fixes a child's personality. Which image speaks to me?"
 vkf.170.0:0 "Bear: shelter those who depend on me."
 vkf.170.1:0 "Fox: find another way."
 vkf.170.2:0 "Eagle: look beyond the next horizon."
 vkf.170.3:0 "Dragon: dare to change the world."
 vkf.170.4:0 "Wolf: remember the strength of companions."
 vkf.170.5:0 "Lion: accept the burdens of leadership."
 vkf.171.t:0 "The Meaning of the Necklace"
 vkf.171.desc:0 "Years after the ceremony, the totem still carries a story. I may live up to it through generosity, use it to assert my standing, or admit that my ambitions have changed."
 vkf.171.0:0 "Provide for the clan."
 vkf.171.1:0 "Speak for my own ambitions."
 vkf.171.2:0 "A symbol does not bind my future."
 vkf.190.t:0 "The Banners Are Called"
 vkf.190.desc:0 "Our pledged leader has begun the war for Karthalon. We can commit our own army or repudiate the pledge. No soldiers are created simply because we attended a council."
 vkf.190.0:0 "Honor the pledge and join."
 vkf.190.1:0 "Refuse the call."
 vkf.201.t:0 "The Southron Triumph"
 vkf.201.desc:0 "Karthalon is ours. Control of the port has changed, but this war grants no claim to the entire northern Empire. The coalition must now choose how to govern its victory."
 vkf.201.0:0 "Honor the coalition and its promised rewards."
 vkf.201.1:0 "Keep the treasury and rule by force."
 vkf.202.t:0 "The Keepers Hold"
 vkf.202.desc:0 "The assault has failed. Our personal coalition pledges dissolve, and another major offensive cannot be prepared for five years. Our existing realms remain; a new generation may seek a different course."
 vkf.202.0:0 "Keep the mandate and rebuild."
 vkf.202.1:0 "Dissolve the invasion mandate."
 vkf.203.t:0 "The Treaty of Kartholos"
 vkf.203.desc:0 "The great campaign ends without conquest. For ten years the frontier compact bars new regional invasions and punitive wars. Recovery, diplomacy and clan politics can continue."
 vkf.203.0:0 "Return to my affairs."
 vkf.204.t:0 "The Fractured Banners"
 vkf.204.desc:0 "The campaign mandate has failed. Personal military pledges have ended. Existing subjects keep their political relationships, but no independent chief remains bound to this failed expedition."
 vkf.204.0:0 "Keep the mandate and rebuild."
 vkf.204.1:0 "Dissolve the invasion mandate."
 vkf.205.t:0 "A United South Without Invasion"
 vkf.205.desc:0 "The clans have built a union without spending another generation at the walls of Karthalon. Our existing governments and negotiated rights endure. The peace compact lasts ten years; governing this union remains our responsibility."
 vkf.205.0:0 "Return to my affairs."
 vkf.206.t:0 "A Compact Across the Water"
 vkf.206.desc:0 "The Southron leader proposes ten years without regional punitive expeditions or invasion. Existing borders are recognized for the duration. Acceptance binds both sides; attendance at an earlier council did not."
 vkf.206.0:0 "Accept the ten-year compact."
 vkf.206.1:0 "Reject these terms."
 vkf.126.t:0 "An Alliance of Equals"
 vkf.126.desc:0 "A chief offers military alliance while preserving independence. Accept this alternative, ask for a native tributary agreement, or reject the proposal without forcing submission."
 vkf.126.0:0 "Accept the alliance."
 vkf.126.1:0 "Ask for tribute instead."
 vkf.126.2:0 "Reject the alternative."
 vkf.127.t:0 "Tribute Without Submission"
 vkf.127.desc:0 "The coalition leader proposes a native tributary relationship. I would retain my government and realm, while accepting the obligations of that relationship."
 vkf.127.0:0 "Accept the tributary agreement."
 vkf.127.1:0 "Remain outside the agreement."
 vkf.128.t:0 "Does the Oath Outlive Its Lord?"
 vkf.128.desc:0 "The ruler who won our allegiance has died. Our existing vassal relationship continues, but the personal campaign pledge has ended. I must decide whether to support the successor's coalition."
 vkf.128.0:0 "Renew the commitment."
 vkf.128.1:0 "Withhold military commitment."
 vkf.211.t:0 "The Withering Hand and the Banners"
 vkf.211.desc:0 "A Southron leader seeks my knowledge of Severosi defenses. Sharing it would help their passage preparations. This is my choice, not a necessary step in their campaign."
 vkf.211.0:0 "Share what I know."
 vkf.211.1:0 "Refuse their cause."
 vkf.192.t:0 "An Approach Secured"
 vkf.192.desc:0 "The coalition has seized one of the mapped approaches to Karthalon. The county provides an actual foothold and knowledge of the passage. The main fortress remains a separate objective."
 vkf.192.0:0 "Return to my affairs."
 vkf.193.t:0 "The Locks and the Walls"
 vkf.193.desc:0 "Our agents have identified vulnerable approaches to Karthalon. We can fund sabotage, improve the passage survey, or abandon the operation. None of these choices creates naval combat or changes who owns the fortress."
 vkf.193.0:0 "Spend fifty gold and twenty intelligence on sabotage."
 vkf.193.1:0 "Spend fifty gold on the passage survey."
 vkf.193.2:0 "Withdraw the agents."
