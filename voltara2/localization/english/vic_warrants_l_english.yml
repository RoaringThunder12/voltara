l_english:
 vic_warrants.2.t:0 "The New Emperor's Warrant"
 vic_warrants.2.desc:0 "Octavian has won the imperial war. Now his messengers bring a warrant for my arrest: my support for Cassian is to be answered in his custody. I may submit to imprisonment, or raise my own banners and fight to leave the hegemony."
 vic_warrants.2.accept:0 "I will submit to imprisonment."
 vic_warrants.2.accept.tt:0 "Octavian imprisons you. Your realm remains within the hegemony."
 vic_warrants.2.refuse:0 "Let him come. We will fight for independence."
 vic_warrants.2.refuse.tt:0 "You begin your own independence war against Octavian. Victory frees your realm; defeat brings imprisonment."
 vic_warrant_independence:0 "Resist the Imperial Warrant"
 vic_warrant_independence_name:0 "War of Independence against the Imperial Warrant"
 vic_warrant_independence_victory:0 "The resisting ruler and their realm become independent."
 vic_warrant_independence_defeat:0 "The resisting ruler is imprisoned and remains a vassal."
 vic_warrant_independence_white_peace:0 "The ruler remains a vassal, but this warrant does not lead to imprisonment."
 vic_warrant_independence_invalidated:0 "The independence war ends without a settlement."
