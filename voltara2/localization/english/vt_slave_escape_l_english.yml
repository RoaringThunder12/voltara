l_english:
 vt_slave_escape.1.t:0 "Beyond the Chains"
 vt_slave_escape.1.desc:0 "The last gate is behind me. For the first time in years, no one commands my steps. I have escaped my captor and can begin a life of my own."
 vt_slave_escape.2.t:0 "Caught at the Gate"
 vt_slave_escape.2.desc:0 "My route was discovered before I could reach safety. The guards drag me back, and the cell door closes. I remain enslaved, and another attempt must wait."
 vt_slave_escape.4.t:0 "An Escape from My Household"
 vt_slave_escape.4.desc:0 "[scope:vt_fugitive.GetFirstName] has escaped my household. The search has failed; my former captive is now beyond my control."
 vt_slave_escape.5.t:0 "An Escape Foiled"
 vt_slave_escape.5.desc:0 "The guards have caught [scope:vt_fugitive.GetFirstName] attempting to escape. My captive remains enslaved and has been confined to the dungeon."
 vt_slave_escape.6.t:0 "Death on the Road to Freedom"
 vt_slave_escape.6.desc:0 "[scope:vt_fugitive.GetFirstName] died while attempting to escape my household. The pursuit is over."
 vt_attempt_slave_escape:0 "Escape from Slavery"
 vt_attempt_slave_escape_desc:0 "I can watch the guards, find a route, and stake my life on a chance at freedom. My intrigue and careful planning may help me evade my captor, but escaping from a prison is much harder."
 vt_attempt_slave_escape_tooltip:0 "Attempt to escape your owner and become free."
 vt_attempt_slave_escape_confirm:0 "Make my escape"
 vt_slave_escape_risks:0 "Success chance: [SCOPE.ScriptValue('vt_slave_escape_success_chance')|0]%. Success ends slavery and takes you out of your owner's court, seeking an abolitionist refuge where possible. On failure: 90% imprisonment, 10% death. Attempts have a two-year cooldown."
 vt_slave_escape.continue:0 "So it is."
 vt_slave_escape_death:0 "died attempting to escape slavery"
