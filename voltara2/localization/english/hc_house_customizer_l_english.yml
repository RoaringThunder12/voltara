l_english:
 hc_house_customizer:0 "House Customizer"
 hc_house_customizer_desc:0 "This character may claim a place among the established bloodlines of the world."
 trait_hc_house_customizer:0 "House Customizer"
 trait_hc_house_customizer_desc:0 "This character may claim a place among the established bloodlines of the world."
 trait_hc_house_customizer_character_desc:0 "This character may claim a place among the established bloodlines of the world."

 hc_open_house_customizer_interaction:0 "Claim Lineage"
 hc_open_house_customizer_interaction_desc:0 "Choose how your bond to [recipient.GetShortUINameNoTooltip]'s house shall be remembered."

 hc_house_customizer.0001.t:0 "Blood and Name"
 hc_house_customizer.0001.desc:0 "Scribes know many truths, and more than one has been corrected with patient ink. Before you lies a path into House [hc_target.GetHouse.GetName], whether by recognition, shared blood, or a branch long thought forgotten."

 hc_house_customizer.0001.become_child:0 "Let me be acknowledged as their child."
 hc_house_customizer.0001.become_sibling:0 "Let me be counted among their siblings."
 hc_house_customizer.0001.open_bastard_options:0 "Consider a birth outside marriage."
 hc_house_customizer.0001.open_bastard_options_tt:0 "You will consider several ways to be acknowledged as a child born outside a lawful union."
 hc_house_customizer.0001.become_distant_relative:0 "Let me be known as kin from a distant branch."
 hc_house_customizer.0001.cancel:0 "I shall not alter my lineage."

 hc_house_customizer.0002.t:0 "Blood Outside Marriage"
 hc_house_customizer.0002.desc:0 "Not all noble blood is born beneath solemn vows and willing witnesses. Some truths live in the margins of chronicles, sealed letters, and confessions few dare speak aloud."
 hc_house_customizer.0002.back:0 "Return to the matter of my lineage."
 hc_house_customizer.0002.cancel:0 "Let this truth remain buried."

 hc_house_customizer.0001.become_bastard:0 "Let me be acknowledged as a bastard."
 hc_house_customizer.0001.become_legitimized_bastard:0 "Let me be legitimized despite my birth."

 hc_house_customizer.tt.become_child:0 "You will be entered into the records as a child of [hc_target.GetShortUIName]."
 hc_house_customizer.tt.second_parent:0 "[hc_target_spouse_parent.GetShortUIName] will be recorded as your other parent."
 hc_house_customizer.tt.become_sibling:0 "You will be acknowledged as a sibling of [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_father:0 "You will share a father with [hc_target.GetShortUIName]."
 hc_house_customizer.tt.shared_mother:0 "You will share a mother with [hc_target.GetShortUIName]."
 hc_house_customizer.tt.become_distant_relative:0 "Your name will be joined to House [hc_target.GetHouse.GetName] as a distant branch of its blood."
 hc_house_customizer.tt.become_bastard:0 "You will be acknowledged as a bastard child of [hc_target.GetShortUIName]. An additional parent will be generated and recorded."
 hc_house_customizer.tt.become_legitimized_bastard:0 "You will be acknowledged as a legitimized bastard child of [hc_target.GetShortUIName]. An additional parent will be generated and recorded."
 hc_house_customizer.tt.gain_bastard:0 "You will gain the Bastard trait."
 hc_house_customizer.tt.gain_legitimized_bastard:0 "You will gain the Legitimized Bastard trait."
 hc_house_customizer.tt.lose_house_customizer:0 "You will lose the House Customizer trait."

 hc_house_customizer.0200.t:0 "The Mark of Blood"
 hc_house_customizer.0200.desc:0 "A house's name does not live only in parchment and seals. It lingers in the eyes, in the hair, in the bearing, and in those features old servants swear they have seen before in faded portraits. You may allow your appearance to be remembered as one of House [hc_target.GetHouse.GetName], or keep the face with which you came to this day."
 hc_house_customizer.0200.adopt:0 "Let my blood bear their likeness as well."
 hc_house_customizer.0200.adopt_tt:0 "You will copy the inheritable appearance of [hc_target.GetShortUIName]. This may alter hair, eyes, skin, and other hereditary features."
 hc_house_customizer.0200.keep:0 "My face shall remain my own."

 hc_house_customizer.ok:0 "So it shall be written."

 hc_house_customizer.0101.t:0 "Child Acknowledged"
 hc_house_customizer.0101.desc:0 "The records have been corrected, the witnesses instructed, and the necessary words spoken. From this day forth, you are acknowledged as a child of [hc_target.GetShortUIName] and a member of House [hc_target.GetHouse.GetName]."

 hc_house_customizer.0102.t:0 "Sibling Acknowledged"
 hc_house_customizer.0102.desc:0 "Blood is ordered anew in the family chronicles. From this day forth, you are counted among the siblings of [hc_target.GetShortUIName] and as a member of House [hc_target.GetHouse.GetName]."

 hc_house_customizer.0103.t:0 "Bastardy Acknowledged"
 hc_house_customizer.0103.desc:0 "Lineage is not always born beneath a lawful roof, but a truth spoken before enough ears soon takes the shape of law. You are acknowledged as a bastard child of [hc_target.GetShortUIName], with an additional parent recorded to complete your origin."

 hc_house_customizer.0104.t:0 "Blood Legitimized"
 hc_house_customizer.0104.desc:0 "What was born outside order has now been brought into the heart of the house. You are acknowledged as a legitimized child of [hc_target.GetShortUIName], with an additional parent recorded to complete your origin."

 hc_house_customizer.0106.t:0 "A Branch Restored"
 hc_house_customizer.0106.desc:0 "Every great house has branches lost to war, distant marriages, and old disputes. Today, one such branch is recognized once more. You belong to House [hc_target.GetHouse.GetName]."

 hc_house_customizer.0300.t:0 "Rights of Blood"
 hc_house_customizer.0301.desc:0 "If you are to be recognized as the child of [hc_target.GetShortUIName], the question of inheritance cannot be left untouched. Scribes may also record your claims to the titles held by your new parent."
 hc_house_customizer.0302.desc:0 "As the newly acknowledged sibling of [hc_target.GetShortUIName], you may ask that the family records also preserve your weaker rights to the lands held by your house."
 hc_house_customizer.0304.desc:0 "Legitimization carries more than a name. If your birth is now accepted within the house, you may also request claims to the lands held by [hc_target.GetShortUIName]."
 hc_house_customizer.0306.desc:0 "A distant branch rarely inherits before closer kin, but old blood may still be used to justify a claim. You may ask that lesser rights be recorded in your name."
 hc_house_customizer.0300.claim_pressed:0 "Record my direct inheritance rights."
 hc_house_customizer.0300.claim_unpressed:0 "Record my dynastic rights."
 hc_house_customizer.0300.no_claims:0 "The name is enough."
 hc_house_customizer.0300.claim_pressed_tt:0 "You will gain pressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_unpressed_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]."
 hc_house_customizer.0300.claim_distant_tt:0 "You will gain unpressed claims on the titles currently held by [hc_target.GetShortUIName]. This represents a weaker distant-branch claim."

 hc_open_house_customizer_decision:0 "Use House Customizer"
 hc_open_house_customizer_decision_desc:0 "Open the House Customizer menu and choose how your custom ruler should define their noble lineage."
 hc_open_house_customizer_decision_tooltip:0 "Open the House Customizer menu."
 hc_house_customizer_menu.0001.t:0 "House Customizer"
 hc_house_customizer_menu.0001.desc:0 "The blood of a house may be written in records, whispered by servants, or revived from a forgotten branch. Choose how your lineage should be shaped."
 hc_house_customizer_menu.0001.existing_house:0 "Join a living house."
 hc_house_customizer_menu.0001.existing_house_tt:0 "To join a living house, right-click a living noble character and use the House Customizer interaction."
 hc_house_customizer_menu.0001.extinct_house:0 "Revive an extinct house."
 hc_house_customizer_menu.0001.extinct_house_tt:0 "Extinct houses are handled by optional House Customizer modules. This core mod does not include setting-specific extinct houses, to preserve compatibility with vanilla and total conversions."
 hc_house_customizer_menu.0001.cancel:0 "I will decide later."
 hc_house_customizer_menu.0002.t:0 "Extinct Houses"
 hc_house_customizer_menu.0002.desc:0 "The core version of House Customizer does not include a fixed list of extinct houses. This keeps the mod compatible with vanilla, AGOT, LOTR, Elder Kings and other total conversions. Extinct houses should be added through optional modules made for each setting."
 hc_house_customizer_menu.0002.ok:0 "Understood."
