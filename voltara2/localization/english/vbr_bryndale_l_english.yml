l_english:
 vbr_patrol_decision:0 "Patrol the Grain Roads"
 vbr_patrol_decision_desc:0 "Spend 60 gold to clear bandits and fund three years of road patrols in one eligible personally held Bryndale county. Patrols reduce travel danger by 10 and prevent most new bandit incidents."
 vbr_patrol_decision_tooltip:0 "Spend 60 gold to clear bandits and fund three years of road patrols in one eligible personally held Bryndale county. Patrols reduce travel danger by 10 and prevent most new bandit incidents."
 vbr_patrol_decision_confirm:0 "Proceed"
 vbr_beacons_decision:0 "Light the Coastal Beacons"
 vbr_beacons_decision_desc:0 "Spend 75 gold to organize three years of shore watches in one eligible personally held coastal Bryndale county. The watches intercept most local pirate incursions and protect grain shipments."
 vbr_beacons_decision_tooltip:0 "Spend 75 gold to organize three years of shore watches in one eligible personally held coastal Bryndale county. The watches intercept most local pirate incursions and protect grain shipments."
 vbr_beacons_decision_confirm:0 "Proceed"
 vbr_fair_decision:0 "Charter a Bryndale Grain Fair"
 vbr_fair_decision_desc:0 "Spend 75 gold on a three-year fair charter in one personally held Bryndale county free of banditry and recent pirate devastation. County taxes rise by 15% and development growth by 10%."
 vbr_fair_decision_tooltip:0 "Spend 75 gold on a three-year fair charter in one personally held Bryndale county free of banditry and recent pirate devastation. County taxes rise by 15% and development growth by 10%."
 vbr_fair_decision_confirm:0 "Proceed"
 vbr_convoy_decision:0 "Dispatch a Grain Convoy"
 vbr_convoy_decision_desc:0 "Invest 40 gold in a shipment from a personally held Bryndale county. A report arrives in sixty days. Road patrols protect inland shipments; coastal shipments need both patrols and beacons for the best odds. Failed ventures can lose the investment."
 vbr_convoy_decision_tooltip:0 "Invest 40 gold in a shipment from a personally held Bryndale county. A report arrives in sixty days. Road patrols protect inland shipments; coastal shipments need both patrols and beacons for the best odds. Failed ventures can lose the investment."
 vbr_convoy_decision_confirm:0 "Proceed"
 vbr.1.t:0 "Wagons to the Horizon"
 vbr.1.desc:0 "Bryndale feeds cities far beyond its borders. Today, it seems every sack of grain is travelling along the same road as my party. Drovers shout over axle-deep ruts while a miller begs us not to trample the crop beside the verge."
 vbr.1.0:0 "Wait our turn among the wagons."
 vbr.1.1:0 "Organize passing places and clear the queue."
 vbr.1.2:0 "Pay the carters for an escort along a side road."
 vbr.2.t:0 "Collectors Without a Seal"
 vbr.2.desc:0 "Men with spears have stretched a chain across the road. They claim to collect a grain toll, but their warrant bears no recognizable seal. Behind them, a frightened merchant waits beside an overturned cart."
 vbr.2.0:0 "Pay them and get the party through."
 vbr.2.1:0 "Demand their warrant and name their supposed lord."
 vbr.2.2:0 "Our escort will clear the road."
 vbr.2.3:0 "Force a passage."
 vbr.2.4:0 "Find another crossing."
 vbr.3.t:0 "A Table of Many Tongues"
 vbr.3.desc:0 "At a Bryndale posting house, coastal merchants share a table with inland drovers. Prices, distant wars and the next harvest pass from mouth to mouth. In this country, travellers carry news almost as valuable as their cargo."
 vbr.3.0:0 "Listen to the merchants and compare their accounts."
 vbr.3.1:0 "Buy fresh provisions for everyone."
 vbr.3.2:0 "We have our own road to follow."
 vbr.4.t:0 "The Gleaners at the Granary"
 vbr.4.desc:0 "The granaries are full, but several families wait outside the gates for permission to gather what the harvest left behind. A steward insists that every measure is already promised to distant buyers."
 vbr.4.0:0 "Buy grain for the waiting families."
 vbr.4.1:0 "Negotiate a share of the gleanings."
 vbr.4.2:0 "Keep the caravan moving."
 vbr.5.t:0 "Smoke Beyond the Quay"
 vbr.5.desc:0 "A warning bell rolls across the harbor. Low boats have appeared behind the grain barges, and the quay guards are pulling up the gangplanks. The sea roads that enrich Bryndale bring raiders as well as traders."
 vbr.5.0:0 "Take shelter with the harbor watch."
 vbr.5.1:0 "Help organize the defense."
 vbr.5.2:0 "Get the baggage away from the waterfront."
 vbr.10.t:0 "The Missing Grain Wagons"
 vbr.10.desc:0 "Carters in [scope:vbr_site.GetNameNoTier] refuse to travel after dusk. Several wagons have vanished, and the survivors describe armed men selling stolen grain at hidden camps. Merchants are beginning to take other roads."
 vbr.10.0:0 "Pay for a determined sweep of the roads."
 vbr.10.1:0 "Lead the sweep with my officers."
 vbr.10.2:0 "We cannot spare the resources."
 vbr.12.t:0 "The Price of Bryndale Bread"
 vbr.12.desc:0 "Buyers have come to [scope:vbr_site.GetNameNoTier] from every direction. Exporters want the grain released quickly; local bakers fear that distant purses will leave their ovens empty. The harvest is plentiful, but abundance alone does not decide who eats."
 vbr.12.0:0 "Reserve grain for local households."
 vbr.12.1:0 "License the export merchants."
 vbr.12.2:0 "Set fair measures and keep the market open."
 vbr.12.3:0 "Let buyers and farmers bargain."
 vbr.13.t:0 "Raiders at the Grain Quays"
 vbr.13.desc:0 "Pirates have struck the coast of [scope:vbr_site.GetNameNoTier]. They took stores and cargo before withdrawing beyond the headlands. The warehouses are damaged, and the merchants want help before they will unload another shipment."
 vbr.13.0:0 "Repair the quays and compensate the households."
 vbr.13.1:0 "Organize the recovery and strengthen the defenses."
 vbr.13.2:0 "The losses must stand for now."
 vbr.14.t:0 "The Watch Earns Its Pay"
 vbr.14.desc:0 "The watches in [scope:vbr_site.GetNameNoTier] have intercepted a raiding party before it reached the stores. Carters and merchants are spreading the news that these routes are worth using again."
 vbr.14.0:0 "Keep the watches supplied."
 vbr.15.t:0 "News of the Grain Convoy"
 vbr.15.desc:0 "The factors have sent their accounts from the Bryndale venture. Grain must pass through roads, stores and buyers before its value reaches my treasury; the quality of our protection determines how much survives that journey."
 vbr.15.0:0 "Receive the accounts."
 vbr.16.t:0 "Watchmen on the Grain Roads"
 vbr.16.desc:0 "Patrols are taking up their stations in [scope:vbr_site.GetNameNoTier]. Stolen grain is being recovered, and the carters know where to report trouble. The money will keep these watches in service for three years."
 vbr.16.0:0 "Keep the roads open."
 vbr.17.t:0 "Beacons Above the Quays"
 vbr.17.desc:0 "Lookouts in [scope:vbr_site.GetNameNoTier] have agreed upon their signals. Boatmen, shore guards and warehouse keepers can now warn one another before raiders reach the stores. Their watch is funded for three years."
 vbr.17.0:0 "Let the first warning travel faster than the raiders."
 vbr.18.t:0 "The Grain Fair Opens"
 vbr.18.desc:0 "The charter of [scope:vbr_site.GetNameNoTier] promises regular markets, honest measures and places for travelling merchants. Bakers and millers will trade beside exporters, drawing more of Bryndale's passing traffic into the town."
 vbr.18.0:0 "May the harvest find its buyers."
 vbr.20.t:0 "Bread Sold in Distant Markets"
 vbr.20.desc:0 "The convoy has reached its buyers. Good prices and safe passage have returned eighty-five gold from our forty-gold investment. The factors praise the quality of Bryndale grain and ask to trade with us again."
 vbr.20.0:0 "A profitable journey."
 vbr.21.t:0 "A Thin Margin"
 vbr.21.desc:0 "The grain has sold, but damaged sacks, delays and additional fees consumed most of the profit. Forty-five gold has returned from our forty-gold investment. At least the venture paid its way."
 vbr.21.0:0 "We should examine the route before sending more."
 vbr.22.t:0 "The Convoy Is Lost"
 vbr.22.desc:0 "The factors report that the shipment was scattered before it reached its buyers. Between theft, spoiled grain and the abandoned wagons, none of the forty-gold investment can be recovered."
 vbr.22.0:0 "An expensive lesson."
 vbr_convoy_ready:0 "You have not dispatched a grain convoy in the past two years"
