l_english:
 republican_trade.1000.t: "Trade Deal Nullified"
 republican_trade.1000.desc: "The death of [dead_ruler.GetUINameNoTooltip|V] has abruptly nullified the trade deal with [recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|V], leaving our realm’s economic ties in a state of uncertainty. The carefully negotiated agreements are no longer valid, and [recipient.GetUINameNoTooltip|V] now holds the key to the future of our trade relations.\n\nWith the previous ruler gone, we face a new leadership in [recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip|V], and it is unclear how they will approach the renegotiation. Our standing and prosperity may depend on how the new terms are shaped—or if they are to be restored at all."
 republican_trade.1000.a: "I'll handle the negotiations personally."
 republican_trade.1000.b: "Let the merchant families handle the negotiations."
 republican_trade.1000.b.tt: "The merchant families will be requested to negotiate a new trade deal."
 republican_trade.1000.c: "Perhaps leaving things as they are is best."
 republican_trade.1000.c.tt: "You choose not to pursue a new trade deal."
 republican_trade.1001.t: "[GetPlayer.GetLiege.GetShortUINameNoTooltip] Requests Assistance"
 republican_trade.1001.desc: "Following the recent passing of [dead_ruler.GetShortUINameNoTooltip], the previously negotiated trade deal has been rendered void. With the agreement now in question, [GetPlayer.GetLiege.GetShortUINameNoTooltip|V] has turned to you for help. They are seeking your assistance to establish a new trade deal with [recipient.GetUINameNoTooltip|V].\n\nGiven the delicate nature of these negotiations and the need to secure favorable terms, [GetPlayer.GetLiege.GetShortUINameNoTooltip|V] hopes you can use your skills to ensure that our realm remains prosperous through continued trade. It is up to you to restore the economic ties and secure a fresh agreement that benefits all involved."
 republican_trade.1001.a: "I will take charge of the negotiations myself."
 republican_trade.1001.b: "I have more pressing matters to handle."
 republican_trade.1001.b.tt: "You choose not to assist with the negotiations."
 republican_trade.1002.t: "Negotiate a Trade Deal: Success!"
 republican_trade.1002.desc: "You have successfully negotiated a trade deal with [target.GetShortUINameNoTooltip|V]. After lengthy discussions and carefully navigating the various demands, both parties have finally come to an agreement. The terms ensure that our realm will benefit from profitable trade routes, increased access to valuable goods, and favorable tariffs.\n\nThis new deal not only strengthens the economic ties between our realm and [target.GetShortUINameNoTooltip|V], but also establishes a foundation for future cooperation. With these new arrangements in place, our realm is poised to see significant growth and prosperity from the flow of wealth and resources."
 republican_trade.1002.a: "Excellent!"
 republican_trade.1003.t: "Negotiate a Trade Deal: Failure!"
 republican_trade.1003.desc: "Your attempt to negotiate a trade deal with [target.GetShortUINameNoTooltip|V] has failed. Despite your efforts, the discussions have broken down over key points of disagreement.\n\n[target.GetShortUINameNoTooltip|V] has decided to withdraw from the negotiations. The terms offered were not enough to satisfy their demands, and the opportunity to secure a profitable agreement has been lost."
 republican_trade.1003.a: "I should have been more concise."
 republican_trade.1010.t: "A Personal Request from [target.GetShortUINameNoTooltip|V]"
 republican_trade.1010.desc: "During the ongoing trade negotiations, [target.GetShortUINameNoTooltip|V] privately requests a special favor. They seek an exemption that would allow their goods to pass through the republic’s ports under conditions more favorable than those offered to other traders. This request is framed as a minor adjustment, but it introduces a significant imbalance to the terms of the agreement.\n\nAllowing such preferential treatment would undermine the fairness of the deal and compromise the republic’s authority over trade regulations. Though [target.GetShortUINameNoTooltip|V] presents it as a harmless favor, it’s clear that this adjustment would set a precedent that the republic cannot afford to accept."
 republican_trade.1010.a: "I'll handle this diplomatically."
 republican_trade.1010.b: "I’ll offer a minor adjustment without compromising fairness."
 republican_trade.1010.c: "I will firmly refuse."
 republican_trade.1011.t: "Trade Under Siege"
 republican_trade.1011.desc: "The negotiation teeters on the edge of collapse. A rival merchant faction has infiltrated the [target.GetTitledFirstNameNicknamedPossessiveNoTooltip|V] court, openly opposing our terms and poisoning the [target.GetTitledFirstNameNicknamedPossessiveNoTooltip|V] trust in our intentions.\n\nTheir influence grows stronger by the hour, threatening to unravel the deal entirely. If I do nothing, this faction could destroy our prospects. The time has come to act decisively—whether by exposing their schemes, striking a secret agreement, or silencing their meddling with gold."
 republican_trade.1011.a: "Expose the rival merchant faction's deceit."
 republican_trade.1011.b: "Bypass the court and strike a private deal with the ruler."
 republican_trade.1011.c: "Buy out the rival merchants to remove their influence."
 republican_trade.1011.d: "Abandon the deal and focus elsewhere."
 republican_trade_negotiation_toast: "Negotiate a Trade Deal"
