l_english:
 republican_pulse.001.t: "Sumptuary Ordinance Debate"
 republican_pulse.001.desc: "A motion has been brought before the council to restrict displays of wealth. Ornate garments, gilded banquets, and public extravagance would be curbed in favor of civic modesty. The clergy urges restraint, claiming virtue must be upheld. The oligarchs argue it is an attack on tradition and dignity.\nI must cast the deciding vote."
 republican_pulse.001.a: "Virtue is the foundation of order. The law will pass."
 republican_pulse.001.b: "This republic does not fear finery. Reject the law."
 republican_pulse.002.t: "[magistrate.GetNameNoTooltip] Oversteps [magistrate.GetHerHis|U] Mandate"
 republican_pulse.002.desc: "[magistrate.GetFullName], my [magistrate.GetHeldCourtPositionsString], has begun speaking on behalf of the republic without council sanction. [magistrate.GetHerHis|U] declarations have stirred unrest among the chamber, with accusations of arrogance and overreach. Some praise [magistrate.GetHerHis] initiative. Others call it a breach of order.\n\nI must decide whether to rein [magistrate.GetHerHim] in or let [magistrate.GetHerHis] words stand."
 republican_pulse.002.a: "[magistrate.GetNameNoTooltip] speaks out of turn. Recall [magistrate.GetHerHim] immediately."
 republican_pulse.002.b: "[magistrate.GetNamePossessiveNoTooltip] boldness strengthens our voice. Let it stand."
