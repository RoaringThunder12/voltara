l_english:
 republican_core.1000.t: "A Golden Opportunity from the [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]"
 republican_core.1000.desc: "An envoy arrives, presenting a letter sealed with the crest of the [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]. The message is clear:\n\n#weak "Your loyalty has earned my attention. I offer your family a place among [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] great merchant houses. Wealth, power, and influence await you as a patrician of our Republic. Will you accept this honor, or remain as you are?" #!\n\nThe envoy watches, awaiting your decision."
 republican_core.1000.a: "I shall accept the offer."
 you_become_merchant_family: "You become a [merchant_family|E]."
 republican_core.1000.b: "We cannot betray our roots for gold."
 republican_core.1000.b.tt: "I decline the offer."
 republican_core.1000.c: "Don't mention this again."
 republican_core.1000.c.tt: "You will not get this offer again."
 republican_core.1010.t: "War Engulfs [defender.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 republican_core.1010.desc: "[attacker.GetUINameNoTooltip] has declared war against [defender.GetUINameNoTooltip], the [war.GetName], threatening the stability and future of the republic.\n\nYour liege now calls upon you to join the fight and defend the realm in this critical moment. The outcome of this war could reshape [defender.GetPrimaryTitle.GetNameNoTierNoTooltip] and its allies.\n\nWill you rise to the challenge, or will you refuse the call to arms?"
 republican_core.1010.a: "I will defend [defender.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 republican_core.1010.b: "I will not join the fight."
