l_english:
 dhm_v080.1000.t:0 "Tonight, the Hall Knows Our Name"
 dhm_v080.1000.desc:0 "At dusk, the household gathers around the open Chronicle. Its newest pages do not tell of one lucky day. They tell of quarrels settled, promises kept, and kin who found their feet because this house did not turn away.\n\nYour steward lays a silver cup beside the book. 'My liege, good work should leave a mark. What shall this victory say about us?'"
 dhm_v080.1000.desc.first:0 "This is the first time the hall has paused to measure what your household has built. Even the servants linger by the door."
 dhm_v080.1000.desc.again:0 "The older pages bear the mark of an earlier celebration. Tonight's names are different, and their deeds deserve an answer of their own."
 dhm_v080.1000.desc.veteran:0 "Your household knows this custom now: when three worthy chapters are written, the ruler decides where the honor belongs."
 dhm_v080.1000.a:0 "Open the Hall—Let Every Name Be Heard"
 dhm_v080.1000.b:0 "Let Our Kin Share the Praise"
 dhm_v080.1000.c:0 "Set the Deeds in Ink, Not Trumpets"
 dhm_v080_triumph_acclaimed_modifier:0 "A House Acclaimed"
 dhm_v080_triumph_acclaimed_modifier_desc:0 "The hall's praise has crossed the castle gates. Neighbors admire the house, but its ruler now bears the strain of living up to every song."
 dhm_v080_triumph_shared_modifier:0 "Honor Shared with the Family"
 dhm_v080_triumph_shared_modifier_desc:0 "Close kin received a share of the honor. The household rests easier and is better liked, though less glory gathers around its ruler."
 dhm_v080_triumph_recorded_modifier:0 "Deeds Set in Ink"
 dhm_v080_triumph_recorded_modifier_desc:0 "The deed was kept for prayer and study, bringing wisdom and piety while some courtiers mistake restraint for coldness."
 dhm_v080_shared_household_credit_opinion:0 "Shared the Family's Honor"
 dhm_v080_triumph_progress_desc:0 "\n\n#bold Household Triumph#!\nNamed chapters: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_named_chapters').GetValue|0]#!  |  Next celebration at: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_next_triumph').GetValue|0] chapters#!\nEvery three new named chapters may earn a rare household celebration."
 dhm_v080_triumph_progress_ready_desc:0 "\n\n#bold Household Triumph#!\nNamed chapters: #P [ROOT.Char.MakeScope.Var('dhm_v080_report_named_chapters').GetValue|0]#!  |  #P Ready for celebration#!\nThe steward can prepare the hall now."
 dhm_v080_triumph_progress_pending_desc:0 "\n\n#bold Household Triumph#!\nNamed chapters: #P [ROOT.Char.MakeScope.Var('dhm_v080_report_named_chapters').GetValue|0]#!\nThe steward is already preparing the hall."
 dhm_v080_triumph_progress_recent_desc:0 "\n\n#bold Household Triumph#!\nNamed chapters: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_named_chapters').GetValue|0]#!  |  Next celebration at: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_next_triumph').GetValue|0] chapters#!\nThe last honor is still fresh. Another Triumph may be held after five years."
 dhm_v080_triumph_progress_quiet_desc:0 "\n\n#bold Household Triumph#!\nNamed chapters: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_named_chapters').GetValue|0]#!  |  Next celebration at: #V [ROOT.Char.MakeScope.Var('dhm_v080_report_next_triumph').GetValue|0] chapters#!\nQuiet Steward leaves the hall silent, but no Chronicle progress is lost."
 dhm_v080_triumph_acclaimed_modifier_new_5_tt:0 "#high Temporary effect#! — [THIS.Char.GetShortUIName|U]. [GetModifier('dhm_v080_triumph_acclaimed_modifier').GetNameWithTooltip] ends #V [GetCurrentDateWithDiff( '(int32)1825' )]#!."
 dhm_v080_triumph_acclaimed_modifier_renewed_5_tt:0 "#high Renewed#! — [THIS.Char.GetShortUIName|U]: [GetModifier('dhm_v080_triumph_acclaimed_modifier').GetNameWithTooltip] is renewed for #V 5 years#!, until #V [GetCurrentDateWithDiff( '(int32)1825' )]#!. Its effects do not stack; renewal only extends the end date."
 dhm_v080_triumph_acclaimed_modifier_preserved_tt:0 "#high Already active#! — [THIS.Char.GetShortUIName|U]: [GetModifier('dhm_v080_triumph_acclaimed_modifier').GetNameWithTooltip] remains until #V [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, 'dhm073_expiry_dhm_v080_triumph_acclaimed_modifier' ) )]#!. Its effects do not stack."
 dhm_v080_triumph_acclaimed_modifier_untracked_tt:0 "#high Already active#! — [THIS.Char.GetShortUIName|U]: [GetModifier('dhm_v080_triumph_acclaimed_modifier').GetNameWithTooltip]. This older effect has no recorded end date. Its existing duration is left untouched; its effects do not stack."
