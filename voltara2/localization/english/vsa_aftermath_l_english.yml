l_english:
 vsa.1.t:0 "The Banners United"
 vsa.1.desc:0 "The chiefs have entered Talia’s union. The first great gathering has become a realm, with obligations to feed its armies and a promise to break the Keepers’ grip on the strait."
 vsa.1.0:0 "The work begins."
 vsa.1.0_tt:0 "The new settlement is ready to be shaped."
 vsa.10.t:0 "Beyond the Victory Fires"
 vsa.10.desc:0 "Kartholos has fallen. The chiefs ask who will hold the crossing, its people ask what conquest means, and every promise made before the march now has a price."
 vsa.10.0:0 "The work begins."
 vsa.10.0_tt:0 "The new settlement is ready to be shaped."
 vsa_govern:0 "Settle the Strait"
 vsa_govern_desc:0 "Choose how the former Keeper territories will be governed."
 vsa_govern_tooltip:0 "Choose how the former Keeper territories will be governed."
 vsa_govern_confirm:0 "Proceed."
 vsa.11.t:0 "The People of the Crossing"
 vsa.11.desc:0 "The crossing can become a garrison, a pact with its existing communities, or a place for displaced families to begin again. These policies apply only to the strait territories that remain within our realm."
 vsa.11.0:0 "Keep local customs and rebuild."
 vsa.11.0_tt:0 "Spend 150 gold. Ten years of improved popular opinion and development in controlled strait counties."
 vsa.11.1:0 "Fortify the crossing."
 vsa.11.1_tt:0 "Spend 100 gold. Improve defense and levies for ten years, at the cost of local goodwill."
 vsa.11.2:0 "Make room for the displaced."
 vsa.11.2_tt:0 "Spend 100 gold. Refugee settlement improves development and popular opinion. Thorne’s lighter cause gains devotion if he is your ally."
 vsa.11.3:0 "Leave this unsettled for now."
 vsa.11.3_tt:0 "Make no change."
 vsa_reward:0 "Honor the Sworn Chiefs"
 vsa_reward_desc:0 "Reward a leading sworn vassal with gold or a controlled strait county that is not your capital."
 vsa_reward_tooltip:0 "Reward a leading sworn vassal with gold or a controlled strait county that is not your capital."
 vsa_reward_confirm:0 "Proceed."
 vsa.12.t:0 "The Price of a Kept Oath"
 vsa.12.desc:0 "[scope:vsa_reward_chief.GetTitledFirstName] stood beneath the banners. A share of the new settlement would show every chief that their oath was more than a convenient promise."
 vsa.12.0:0 "Pay the chief from our treasury."
 vsa.12.0_tt:0 "Transfer 150 gold to this chief, grant prestige, and secure five years of loyalty."
 vsa.12.1:0 "Entrust Kartholos to the chief."
 vsa.12.1_tt:0 "Grant the county of Kartholos, retaining the chief as your vassal. Available only when you own it and it is not your capital."
 vsa.12.2:0 "Not yet."
 vsa.12.2_tt:0 "Keep the reward undecided."
 vsa_oath_amnesty:0 "Offer an Oath Amnesty"
 vsa_oath_amnesty_desc:0 "Offer up to three chiefs who renounced your leadership 50 gold each to reopen negotiations. Their response remains their choice."
 vsa_oath_amnesty_tooltip:0 "Offer up to three chiefs who renounced your leadership 50 gold each to reopen negotiations. Their response remains their choice."
 vsa_oath_amnesty_confirm:0 "Proceed."
 vsa.13.t:0 "A Place beside the Old Fire"
 vsa.13.desc:0 "The ruler we abandoned offers payment and a place among the chiefs again. We can renew a limited pledge without swearing away our lands, or keep our distance."
 vsa.13.0:0 "Accept the payment and renew our support."
 vsa.13.0_tt:0 "Receive 50 gold and pledge limited support for five years. Remove the old oath grievance."
 vsa.13.1:0 "Our paths have parted."
 vsa.13.1_tt:0 "Keep the grievance and independent course."
 vsa.20.t:0 "The Banners in the Dust"
 vsa.20.desc:0 "The invasion has failed. Chiefs who once marched together now question who has the right to lead. Rebuilding will require supplies and reconciliation, not merely another order to march."
 vsa.20.0:0 "The work begins."
 vsa.20.0_tt:0 "The new settlement is ready to be shaped."
 vsa.21.t:0 "A Chief without a Victor"
 vsa.21.desc:0 "Defeat has broken the aura of the united crown. Our followers speak of a different leader. We can cultivate that claim or refuse to turn failure into another feud."
 vsa.21.0:0 "We could lead them better."
 vsa.21.0_tt:0 "Keep your claim to the United Southron crown and ten-year rival-chief bonus."
 vsa.21.1:0 "Another feud would finish us."
 vsa.21.1_tt:0 "Abandon this new claim and grievance."
 vsa_rebuild:0 "Rebuild the Broken Host"
 vsa_rebuild_desc:0 "Pay up to three rival chiefs 50 gold each to rebuild limited support. Restore 30 supplies and 15 intelligence; the campaign recovery becomes two years. Claims remain political threats."
 vsa_rebuild_tooltip:0 "Pay up to three rival chiefs 50 gold each to rebuild limited support. Restore 30 supplies and 15 intelligence; the campaign recovery becomes two years. Claims remain political threats."
 vsa_rebuild_confirm:0 "Proceed."
 vsa_enclave_request:0 "Seek a Home for the Hand"
 vsa_enclave_request_desc:0 "Ask your Southron patron to host a settlement for your followers. Approval costs Thorne 100 gold."
 vsa_enclave_request_tooltip:0 "Ask your Southron patron to host a settlement for your followers. Approval costs Thorne 100 gold."
 vsa_enclave_request_confirm:0 "Proceed."
 vsa.30.t:0 "The Hand Asks for Ground"
 vsa.30.desc:0 "Thorne asks for a settlement near our capital. Its people bring craft and magic, but also a loyalty to their teacher that may one day challenge our own."
 vsa.30.0:0 "Let Ja’Kar establish a refuge."
 vsa.30.0_tt:0 "Thorne pays 100 gold. A refuge improves local development and popular opinion for twenty years."
 vsa.30.1:0 "Give the cult a guarded enclave."
 vsa.30.1_tt:0 "Thorne pays 100 gold. A magical enclave strengthens local levies but troubles the population for twenty years."
 vsa.30.2:0 "They may travel with us, but not settle here."
 vsa.30.2_tt:0 "No settlement or payment. The existing pact remains."
 vsa.40.t:0 "Those Who Follow the Smoke"
 vsa.40.desc:0 "Displaced families arrive at the settlement. They have heard of Thorne’s power and ask what place there is for ordinary people within it."
 vsa.40.0:0 "Give them shelter and teachers."
 vsa.40.0_tt:0 "Spend 50 gold, gain 10 devotion, and recruit an apprentice. The enclave becomes a refuge."
 vsa.40.1:0 "Their service will sustain our power."
 vsa.40.1_tt:0 "Gain 20 devotion, but increase local unrest. A living, free Ja’Kar may organize resistance."
 vsa.40.2:0 "Our stores cannot support more people."
 vsa.40.2_tt:0 "No recruitment or change."
 vsa.41.t:0 "Ja’Kar Opens the Gates"
 vsa.41.desc:0 "Ja’Kar has helped families leave the enclave and exposed the demands made in our name. He asks no permission to save them. The followers who remain wait to see whether we will answer with humility or force."
 vsa.41.0:0 "He is right. End the compulsory service."
 vsa.41.0_tt:0 "Return to restraint and tier-one power. Lose 15 devotion and convert the enclave into a refuge. Ja’Kar’s previous estrangement is not automatically undone."
 vsa.41.1:0 "Let the doubters leave. We will endure."
 vsa.41.1_tt:0 "Keep the dark covenant, lose 25 devotion, and suffer five years of resistance in the enclave. Ja’Kar breaks with the cult."
 vsa.42.t:0 "An Inquisitor at the Gate"
 vsa.42.desc:0 "[scope:vsa_inquisitor.GetTitledFirstName] demands an accounting of the settlement’s magic. Protecting the Hand would defend our promise of sanctuary, but the religious orders will remember our choice."
 vsa.42.0:0 "Our sanctuary will be honored."
 vsa.42.0_tt:0 "Spend 100 prestige and accept five years of religious opposition."
 vsa.42.1:0 "Require an open and limited practice."
 vsa.42.1_tt:0 "Force Thorne back to the lighter path and tier-one covenant. Turn the enclave into a supervised refuge."
 vsa.42.2:0 "Revoke the charter and sanctuary."
 vsa.42.2_tt:0 "Close the enclave and end Thorne’s pact. Gain 150 piety."
 vsa.43.t:0 "A Power within the Banners"
 vsa.43.desc:0 "Thorne’s followers now obey his word before any chief’s. His sorcery helped our cause; his growing authority may become a cause of its own."
 vsa.43.0:0 "So long as he honors our pact, let him grow."
 vsa.43.0_tt:0 "Keep the enclave and strengthen its devotion by 10."
 vsa.43.1:0 "His followers must live freely."
 vsa.43.1_tt:0 "Impose restraint, limit the covenant to tier one, and establish a refuge."
 vsa.43.2:0 "End the pact before it consumes us."
 vsa.43.2_tt:0 "Close the enclave and revoke sanctuary."
 vsa_local_compact:0 "Customs of the Crossing"
 vsa_local_compact_desc:0 "A negotiated settlement preserves local customs."
 vsa_garrison:0 "Garrison of the Strait"
 vsa_garrison_desc:0 "The crossing is fortified under military rule."
 vsa_refuge:0 "Refuge of the Open Hand"
 vsa_refuge_desc:0 "Displaced families and their teachers have a lasting home."
 vsa_dark_enclave:0 "Enclave of the Withering Hand"
 vsa_dark_enclave_desc:0 "The cult trains soldiers and binds the settlement to its purpose."
 vsa_resistance:0 "Resistance at the Enclave"
 vsa_resistance_desc:0 "Families and dissenting followers refuse the cult’s demands."
 vsa_rival_chief:0 "A Rival among the Chiefs"
 vsa_rival_chief_desc:0 "Defeat has given this chief an alternative claim to leadership."
 vsa_rewarded_chief:0 "An Oath Rewarded"
 vsa_rewarded_chief_desc:0 "The united crown has honored this chief’s service."
 vsa_religious_opposition:0 "Opposed by the Inquisition"
 vsa_religious_opposition_desc:0 "Religious authorities contest this ruler’s sanctuary for the cult."
 vsa_offer_blood_oath:0 "Swear a Blood Oath"
 vsa_offer_blood_oath_desc:0 "Offer a five-year blood oath and a real contribution to another Southron chief or the united ruler. Acceptance grants the recipient a blood-oath hook and advances supplies, intelligence, and council readiness. No existing army regiment is moved."
 vsa_offer_herd:0 "Contribute 500 Herd"
 vsa_offer_gold:0 "Contribute 100 Gold"
 vsa_council_before_union:0 "The United Southron Clans title has not yet been created. The War Council is an assembly to form the union."
