l_english:
 vic_opening.1.t:0 "A Cup Not Poured"
 vic_opening.1.desc:0 "Adriana lays an unsigned warning beside the untouched cup. It concerns Leon. She cannot name its author, and the words offer no proof of a plot—but they have reached our household. Beyond these walls, Octavian’s musters and the dispute over imperial reform demand my attention. Protecting my family need not mean condemning a man without evidence."
 vic_opening.1.0:0 "Reinforce the Crownsguard around my family."
 vic_opening.1.0.tt:0 "The imperial household receives closer protection. The letter remains an unverified lead."
 vic_opening.1.1:0 "Ask Bryndale for trusted household guards."
 vic_opening.1.1.tt:0 "A request for trusted household protection strengthens confidence without accusing anyone."
 vic_opening.1.2:0 "Trace the warning’s origin discreetly."
 vic_opening.1.2.tt:0 "You retain the warning as a private lead. Its author and connection to any conspiracy remain unknown."
 vic_opening.1.3:0 "Keep our routine. Let no one see our fear."
 vic_opening.1.3.tt:0 "The warning is retained, but palace protection is not increased."
 vic_opening.2.t:0 "The Dead Man’s Treasury"
 vic_opening.2.desc:0 "Quartermaster Joren Pike brings the accounts Cassian asked me to examine. Relief money is recorded as paid to the Office of Civic Recovery—an office that no longer exists. Thirty-four people died in the relief camps last month. These entries prove that questions must be asked, not who should be accused. The originals must survive whatever follows."
 vic_opening.2.0:0 "Open an official treasury investigation."
 vic_opening.2.0.tt:0 "Begin an official inquiry and preserve the financial lead."
 vic_opening.2.1:0 "Use private contacts and protect the originals."
 vic_opening.2.1.tt:0 "Begin a discreet inquiry without publishing the accounts."
 vic_opening.2.2:0 "Send relief first; the inquiry must continue."
 vic_opening.2.2.tt:0 "Spend 25 gold on relief and retain the records for investigation."
 vic_opening.2.3:0 "Send the records directly to Cassian."
 vic_opening.2.3.tt:0 "Cassian receives only the evidence you actually possess; the ledger is not yet authenticated."
 vic_opening.3.t:0 "The Seven Seals"
 vic_opening.3.desc:0 "Cassian calls his measures reform. Among the great houses and the religious circles of Titania, I hear other words: dispossession, disorder, weakness. Discontent is plentiful; trust is not. If I mean to build a conspiracy, I must decide where to begin—and how many people to let near its purpose."
 vic_opening.3.0:0 "Sound out a discreet religious contact."
 vic_opening.3.0.tt:0 "Prepare an approach. No named cleric or Church institution is committed by this choice."
 vic_opening.3.1:0 "Approach dissatisfied aristocrats."
 vic_opening.3.1.tt:0 "Build an aristocratic network; opposition to reform is not consent to murder."
 vic_opening.3.2:0 "Study the access afforded by imperial office."
 vic_opening.3.2.tt:0 "Develop access, accepting greater risk of discovery. This does not connect you to the missing relief funds."
 vic_opening.3.3:0 "Trust only a small circle."
 vic_opening.3.3.tt:0 "A smaller network develops slowly but leaves fewer openings for investigators."
 vic_opening.4.t:0 "The Iron Forest"
 vic_opening.4.desc:0 "The officers gathering in the Iron Forest are not of one mind. Some fear Cassian’s reforms, some resent the court, and some believe only that the legions need firmer leadership. My brother has noticed our preparations. I must choose whether to show strength, cultivate support, or give him an opportunity to listen."
 vic_opening.4.0:0 "Let the musters be seen."
 vic_opening.4.0.tt:0 "Military readiness rises, and the musters become publicly known."
 vic_opening.4.1:0 "Bind the captains together quietly."
 vic_opening.4.1.tt:0 "Build an independent military network without knowledge of another man’s conspiracy."
 vic_opening.4.2:0 "Seek pledges from the great houses."
 vic_opening.4.2.tt:0 "Develop political support for your own opposition."
 vic_opening.4.3:0 "Leave a channel open to my brother."
 vic_opening.4.3.tt:0 "You signal willingness to negotiate; neither ruler is forced into an agreement."
 vic_opening.5.t:0 "The Price of Freedom"
 vic_opening.5.desc:0 "Cassian’s reforms reach into contracts, estates, and privileges on which House Draconis has long depended. Resistance may protect us—or leave us paying for another man’s crown. Accommodation has its own price. I must decide what the house should preserve, and what it can afford to surrender."
 vic_opening.5.0:0 "Organize resistance to abolition."
 vic_opening.5.0.tt:0 "Record opposition to abolition, without committing to assassination or rebellion."
 vic_opening.5.1:0 "Set aside resources for political opposition."
 vic_opening.5.1.tt:0 "Record willingness to finance opposition. No money transfers without a later accepted agreement."
 vic_opening.5.2:0 "Seek concessions from Cassian."
 vic_opening.5.2.tt:0 "Pursue negotiation while preserving House Draconis’s independence of action."
 vic_opening.5.3:0 "Begin adapting our estates to free labor."
 vic_opening.5.3.tt:0 "Spend 50 gold to begin a five-year estate transition. This does not itself abolish slavery throughout the realm."
 vic_opening.20.t:0 "The Office That No Longer Exists"
 vic_opening.20.desc:0 "The original relief ledger can be compared with the surviving authorization register. A matching entry would authenticate the discrepancy, not explain who profited. Publishing an accusation before that distinction is clear would give the guilty and innocent alike reason to destroy what remains."
 vic_opening.20.0:0 "Pay for a full comparison and authenticated copies."
 vic_opening.20.0.tt:0 "Spend 20 gold. Authenticate the missing-funds discrepancy; this is not evidence of regicide."
 vic_opening.20.1:0 "Preserve a corroborated copy without a full audit."
 vic_opening.20.1.tt:0 "The records are corroborated but not fully authenticated."
 vic_opening.21.t:0 "The Counsel of Trevelyan"
 vic_opening.21.desc:0 "Marques has sent copies of the relief accounts, together with a careful statement of what he has established. The Office of Civic Recovery received payments after it ceased to exist. The papers concern missing relief money. They name no proven architect of murder, and I will not pretend that they do."
 vic_opening.21.0:0 "Authorize an audit; protect the records."
 vic_opening.21.0.tt:0 "Accept the findings and authorize investigation. Only your household knows the report."
 vic_opening.21.1:0 "Make the discrepancy public and fund relief."
 vic_opening.21.1.tt:0 "Spend 50 gold on relief. Disclose the financial discrepancy, without accusing Tharn of murder."
 vic_opening.21.2:0 "Acknowledge receipt, but defer action."
 vic_opening.21.2.tt:0 "The evidence remains in your possession, but the request for action is declined."
 vic_journal.1.t:0 "The Imperial Crisis"
 vic_journal.1.desc:0 "Imperial reform has unsettled the great houses, and the military preparations in the Iron Forest have drawn attention at court. The future of the Hegemony is still undecided. Your own correspondence and investigations determine what you know. No hidden conspiracy is revealed by this overview."
 vic_journal.1.ack:0 "Return to my affairs."
 vic_journal.private:0 "Your private record"
 vic_journal.warning:0 "You possess the anonymous warning concerning Leon. Its source remains unknown."
 vic_journal.treasury:0 "You possess relief-account evidence. This concerns financial irregularity, not proof of regicide."
 vic_journal.authenticated:0 "Your copy of the financial discrepancy has been authenticated."
 vic_journal.preparation:0 "You have begun your own preparations in Titania. No assassination method has yet been selected."
 vic_journal.transition:0 "House Draconis has begun restructuring its estates toward free labor."
 vic_review_crisis:0 "Review the Imperial Crisis"
 vic_review_crisis_desc:0 "Review the public situation and the evidence in your possession."
 vic_review_crisis_tooltip:0 "Review the public situation and the evidence in your possession."
 vic_review_crisis_confirm:0 "Proceed"
 vic_present_accounts:0 "Send the Relief Accounts to Cassian"
 vic_present_accounts_desc:0 "Send the records you possess. Authenticating them first makes your report stronger; financial corruption alone does not prove a murder conspiracy."
 vic_present_accounts_tooltip:0 "Send the records you possess. Authenticating them first makes your report stronger; financial corruption alone does not prove a murder conspiracy."
 vic_present_accounts_confirm:0 "Proceed"
 vic_estate_transition:0 "Transition to Free Labor"
 vic_estate_transition_desc:0 "House Draconis is investing in the costly transition away from slave-dependent estates."
