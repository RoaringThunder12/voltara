 vkw_open_routes:0 "Shared Western Trade Routes"
 vkj.28.t:0 "Two Charters, One Road"
 vkj.28.desc:0 "Agents of [scope:vkw_rival.GetTitledFirstName] have reached the approaches to [scope:vkw_site.GetName]. Their surveyors need the same porters and water sources as ours. We could divide the costs, or try to draw their specialists away with better offers."
 vkj.28.0:0 "Pay twenty gold toward a shared route."
 vkj.28.1:0 "Offer twenty gold to poach their surveyors."
 vkj.28.2:0 "Keep our ventures separate."
 vkj.29.t:0 "A Shared Western Road"
 vkj.29.desc:0 "[scope:vkw_merchant_actor.GetTitledFirstName] has contributed twenty gold to a shared route near [scope:vkw_site.GetName]. Both ventures gain standing from the arrangement, and cooperation eases the pressure on local communities."
 vkj.29.0:0 "We can compete without ruining the road."
 vkj.30.t:0 "Our Surveyors Have Been Bought"
 vkj.30.desc:0 "[scope:vkw_merchant_actor.GetTitledFirstName] has hired away specialists from our western venture. The rival charter gains knowledge at the cost of our court's reputation, while local communities bear the disruption."
 vkj.30.0:0 "I will remember who paid them."
