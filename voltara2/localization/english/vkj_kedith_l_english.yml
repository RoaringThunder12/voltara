l_english:
 vkj.1.t:0 "Where the Road Vanishes"
 vkj.1.desc:0 "In Kedith, the road ends beneath a wall of leaves. A local guide points to a flooded trail, then to claw marks above my head. Beyond this point, a straight line on a map promises very little."
 vkj.1.0:0 "Hire guides who know these paths."
 vkj.1.1:0 "We will cut our own way."
 vkj.2.t:0 "The River Has Taken the Crossing"
 vkj.2.desc:0 "The old crossing lies under brown, rushing water. Broken trunks turn in the current. A passage here might save a week, but one slipped footing could carry away a person, a pack, or both."
 vkj.2.0:0 "Follow the guides to a higher ford."
 vkj.2.1:0 "Wait and rebuild the crossing."
 vkj.2.2:0 "Risk the current."
 vkj.3.t:0 "Eyes Beyond the Firelight"
 vkj.3.desc:0 "Something heavy moves beyond our fires. The animals will not settle, and a sentry finds fresh tracks near the baggage. Kedith's hunters know the difference between a creature passing through and one following a meal."
 vkj.3.0:0 "Keep a disciplined watch."
 vkj.3.1:0 "Build a larger camp and wait for daylight."
 vkj.3.2:0 "Drive it away myself."
 vkj.4.t:0 "A Toll Beneath the Canopy"
 vkj.4.desc:0 "Armed figures step out where the path narrows. Their leader calls the payment a toll; the frightened porter beside me calls it robbery. Somewhere behind us, another branch snaps."
 vkj.4.0:0 "Pay twenty gold and keep moving."
 vkj.4.1:0 "Take the concealed path our guide marked."
 vkj.4.2:0 "Break through their line."
 vkj.4.3:0 "Organize an escort through the ambush."
 vkj.5.t:0 "Water That Should Not Be Drunk"
 vkj.5.desc:0 "The water skins smell sour. Several porters have already fallen sick, and the heat makes every lost hour harder. Keeping the party moving will cost us later; finding clean water will cost us now."
 vkj.5.0:0 "Use my knowledge to treat the supplies."
 vkj.5.1:0 "Listen to our guide and find clean water."
 vkj.5.2:0 "Rest until the party recovers."
 vkj.5.3:0 "Press on with what we have."
 vkj.6.t:0 "The Forest Closes Behind Us"
 vkj.6.desc:0 "Yesterday's trail has disappeared into vines and standing water. Even the sun gives us little help beneath this canopy. The western survey maps disagree with one another, and every turn looks familiar."
 vkj.6.0:0 "Let the guide find the route."
 vkj.6.1:0 "Read the watercourses and retrace our steps."
 vkj.6.2:0 "Search methodically."
 vkj.7.t:0 "The Door Beneath the Roots"
 vkj.7.desc:0 "Carved stone rises from a bank of roots. The entrance has survived a kingdom whose name our maps do not record. Fresh offerings lie beside it: this place has not been forgotten by everyone."
 vkj.7.0:0 "Record the site and leave the offerings untouched."
 vkj.7.1:0 "Explore the chambers."
 vkj.7.2:0 "Move on before nightfall."
