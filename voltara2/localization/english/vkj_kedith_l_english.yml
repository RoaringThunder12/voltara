 vkj_in_jungle:0 "Traveling through Kedith jungle"
 vkw_review:0 "Review the Western Ventures"
 vkw_review_desc:0 "Inspect the Kedith-Halithor race, frontier grievances, and how to establish settlements."
 vkw_review_tooltip:0 "Inspect the Kedith-Halithor race, frontier grievances, and how to establish settlements."
 vkw_review_confirm:0 "Proceed"
 vkw_survey:0 "Commission a Western Survey"
 vkw_survey_desc:0 "Spend 75 gold to survey an uncharted frontier county. The expedition returns in sixty days. Each side can survey a site once; surveys reveal opportunities but do not grant ownership."
 vkw_survey_tooltip:0 "Spend 75 gold to survey an uncharted frontier county. The expedition returns in sixty days. Each side can survey a site once; surveys reveal opportunities but do not grant ownership."
 vkw_survey_confirm:0 "Proceed"
 vkw_develop:0 "Develop a Western Concession"
 vkw_develop_desc:0 "Negotiate access to resources in a personally held, restored frontier county, or pursue rapid extraction at the cost of local resentment."
 vkw_develop_tooltip:0 "Negotiate access to resources in a personally held, restored frontier county, or pursue rapid extraction at the cost of local resentment."
 vkw_develop_confirm:0 "Proceed"
 vkw_accord_decision:0 "Propose a Western Accord"
 vkw_accord_decision_desc:0 "Ask the rival regional sovereign to recognize shared routes and negotiated concessions. The other side can refuse."
 vkw_accord_decision_tooltip:0 "Ask the rival regional sovereign to recognize shared routes and negotiated concessions. The other side can refuse."
 vkw_accord_decision_confirm:0 "Proceed"
 vkw_claim_primacy:0 "Claim Western Commercial Primacy"
 vkw_claim_primacy_desc:0 "Your side needs 100 venture standing, three currently held restored frontier counties, and grievances below 60. Recognition grants participating rulers ten years of commercial prestige."
 vkw_claim_primacy_tooltip:0 "Your side needs 100 venture standing, three currently held restored frontier counties, and grievances below 60. Recognition grants participating rulers ten years of commercial prestige."
 vkw_claim_primacy_confirm:0 "Proceed"
 vkj.18.t:0 "Ledgers of the Western Ventures"
 vkj.18.desc:0 "Kedith standing: [GetGlobalVariable('vkw_kedith_score').GetValue|0]/100. Halithor standing: [GetGlobalVariable('vkw_halithor_score').GetValue|0]/100. Frontier grievances: [GetGlobalVariable('vkw_grievance').GetValue|0]/100.\n\nSurveys establish knowledge. A completed settlement earns ten standing once. Concessions earn wealth, but coercion raises grievances. At sixty grievances, organized resistance threatens concessions.\n\nTo settle a ruin, open its county panel and use the existing expedition and rebuilding actions. Surveys do not bypass those costs or ownership requirements."
 vkj.18.0:0 "Return to my affairs."
 vkj.19.t:0 "Two Banners in the West"
 vkj.19.desc:0 "Kedith scouts and Halithoran factors now carry rival charters into the western frontier. Their reports promise rich ground and forgotten cities. The people who still live among these places have their own boundaries, memories, and demands.\n\nMy choices will shape my side's standing and the resentment the ventures leave behind."
 vkj.19.0:0 "We must choose our course carefully."
 vkj.20.t:0 "Beyond the Survey Stakes"
 vkj.20.desc:0 "My expedition returns from [scope:vkw_site.GetName]. Old works lie beneath the vegetation, and nearby communities still mark paths and burial grounds missing from our charts. A local delegation offers guidance if we leave those places undisturbed."
 vkj.20.0:0 "Record their boundaries and negotiate access."
 vkj.20.1:0 "Take portable relics to finance the next venture."
 vkj.20.2:0 "Study the ruins with the local keepers."
 vkj.21.t:0 "A Charter for [scope:vkw_site.GetName]"
 vkj.21.desc:0 "The surveyors have found useful timber, stone, and workable deposits. Local households ask who will control the roads and water. The rival venture watches closely; a profitable concession will be counted in the race west."
 vkj.21.0:0 "Pay forty gold for a negotiated concession."
 vkj.21.1:0 "Extract what we can before anyone interferes."
 vkj.21.2:0 "Leave the concession unissued."
 vkj.22.t:0 "An Accord for the Western Routes"
 vkj.22.desc:0 "[scope:vkw_proposer.GetTitledFirstName] proposes shared routes and mutual recognition of negotiated concessions. Rival standing will remain, but neither court need profit by destroying the other's work. Local grievances will still have to be addressed."
 vkj.22.0:0 "Agree to the accord."
 vkj.22.1:0 "Refuse the terms."
 vkj.23.t:0 "The Western Accord Is Sealed"
 vkj.23.desc:0 "Our rival has accepted the accord. Shared routes and recognized concessions provide room for cooperation. This peace will mean little if our factors continue to provoke the communities along them."
 vkj.23.0:0 "Let the factors carry the news."
 vkj.27.t:0 "The Accord Is Refused"
 vkj.27.desc:0 "The other court has declined our proposal. The frontier remains divided between competing charters, and my factors must plan without assurances from our rival."
 vkj.27.0:0 "Then we proceed carefully."
 vkj.24.t:0 "The Stones Remember"
 vkj.24.desc:0 "In [scope:vkw_site.GetName], workers uncover a sealed chamber. A delegation identifies it as a place of ancestral memory, while my factor sees carved stone fit for sale. The record I make today will outlast this concession."
 vkj.24.0:0 "Protect the chamber and invite its keepers."
 vkj.24.1:0 "Study it before further work."
 vkj.24.2:0 "Sell the carvings."
 vkj.25.t:0 "The Concession Rises"
 vkj.25.desc:0 "Messages from [scope:vkw_site.GetName] report blocked roads and burned storehouses. Local councils have joined workers driven from the exhausted concessions. They demand restitution and control over their water and ancestral places. Refusal will turn their resistance into open war."
 vkj.25.0:0 "Pay restitution and recognize local access."
 vkj.25.1:0 "Recognize their autonomy and suspend the concession."
 vkj.25.2:0 "We will settle this by force."
 vkj.26.t:0 "A Western Commercial Power"
 vkj.26.desc:0 "The race has produced a recognized commercial power. Kedith standing is [GetGlobalVariable('vkw_kedith_score').GetValue|0]; Halithor standing is [GetGlobalVariable('vkw_halithor_score').GetValue|0]. Three restored settlements and a measure of stability have made a claim that court rhetoric alone could not.\n\nThe frontier's people remain, and so do the obligations owed to them."
 vkj.26.0:0 "The west has changed."
