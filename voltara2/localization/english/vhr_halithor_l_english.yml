 vhr_assign_mine:0 "Assign to Ruby Mines"
 vhr_assign_mine_desc:0 "Earn 4 gold each quarter from mine labor. Requires legal slavery and an adult owned slave. Maximum three labor assignments per ruler. Assignments end on freedom, escape or court transfer; payments stop if slavery is banned or the required holdings are lost. Labor disputes can bring unrest and escapes."
 vhr_assign_workshop:0 "Assign to Halithoran Workshops"
 vhr_assign_workshop_desc:0 "Earn 2 gold each quarter from workshop labor. Requires legal slavery and an adult owned slave. Maximum three labor assignments per ruler. Assignments end on freedom, escape or court transfer; payments stop if slavery is banned or the required holdings are lost. Labor disputes can bring unrest and escapes."
 vhr_region:0 "Your capital lies within de jure Halithor"
 vhr_mine_owner:0 "You personally hold a Halithoran ruby mine"
 vhr_mine_realm:0 "Your realm contains a Halithoran ruby mine"
 vhr_labor_capacity:0 "You have fewer than three active labor assignments"
 vhr_worker_available:0 "An adult slave you own is available for assignment"
 vhr_labor_unrest:0 "Resentment of the Labor Gangs"
 vhr_skilled_crews:0 "Skilled Ruby-Mining Crews"
 vhr_recall_worker:0 "Recall from Labor"
 vhr_recall_worker_desc:0 "End this work assignment and its income without changing the character's legal status."
 vhr_ruby_export:0 "Charter a Ruby Shipment"
 vhr_ruby_export_desc:0 "The merchants need an advance to purchase stones, hire guards and carry Halithor's rubies to distant markets. I can underwrite one shipment each year. Forty gold funds the venture; in thirty days, a successful shipment returns eighty gold, a weak market fifty, or a lost cargo nothing."
 vhr_ruby_export_tooltip:0 "Invest 40 gold: 60% returns 80, 25% returns 50, 15% returns nothing. Resolves after 30 days."
 vhr_ruby_export_confirm:0 "Seal the merchant charter."
 vhr_hire_crews:0 "Hire Skilled Ruby Miners"
 vhr_hire_crews_desc:0 "Experienced paid miners can shore up galleries and recover stones that untrained labor would shatter. For 50 gold, hire crews at each ruby mine I personally hold. Each mine earns an additional 1 gold per month for five years. Employment continues even if slavery is abolished."
 vhr_hire_crews_tooltip:0 "Pay 50 gold for five years of skilled crews at your personally held ruby mines."
 vhr_hire_crews_confirm:0 "Offer paid contracts."
 vhr.1.t:0 "The Ruby Charter: Accounts Returned"
 vhr.1.desc:0 "Thirty days after I advanced forty gold, the factor returns with the accounts of our Halithoran ruby shipment. The ledger records the fate of the stones, the guards and the journey to market."
 vhr.1.a:0 "The stones fetched a fine price: collect 80 gold."
 vhr.1.b:0 "A narrow margin: collect 50 gold."
 vhr.1.c:0 "The cargo is lost. There will be no return."
 vhr.2.t:0 "The Price of the Quota"
 vhr.2.desc:0 "My overseers bring a warning from the labor gangs. Tools are worn, the workers are exhausted, and resentment is spreading. The merchants still demand their deliveries. I can force another quota, pay to repair tools and improve provisions, or free those I have assigned to this work."
 vhr.2.a:0 "Extract the extra quota."
 vhr.2.b:0 "Spend twenty gold on tools and provisions."
 vhr.2.c:0 "Free the assigned workers."
 vhr_quota_risk:0 "Gain 25 gold, but resentment reduces popular opinion and control growth in your capital for three years. There is a 40% chance an assigned slave escapes and becomes free."
