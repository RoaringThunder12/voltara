l_english:
 vkfu.1.t:0 "One Banner Above the Camps"
 vkfu.1.desc:0 "The old chiefs speak of unity whenever the Keepers cross the water. When the ashes cool, they return to their feuds. I have listened long enough. If I ask them to follow me, I must offer more than another season of vengeance: a council where their voices matter, and a promise they can hold me to."
 vkfu.1.0:0 "Send my riders to the chiefs."
 vkfu.1.0_tt:0 "Five eligible chiefs receive invitations. Their answers will be reviewed in ninety days."
 vkfu.1.1:0 "Our own people must come first."
 vkfu.1.1_tt:0 "You can reconsider through the decision to rally the clans."
 vkfu.2.t:0 "Riders beneath a Common Banner"
 vkfu.2.desc:0 "[ROOT.Char.Var('vkfu_inviter').Char.GetTitledFirstName] asks my clan to stand with a common cause on the Kartholos frontier. Recognition promises support without surrendering independence. A blood oath binds us more closely: a contribution now, and fealty if the War Council establishes a united crown."
 vkfu.2.0:0 "I recognize this leadership."
 vkfu.2.0_tt:0 "Five-year recognition. You remain independent."
 vkfu.2.1:0 "I swear a blood oath, with our rights protected."
 vkfu.2.1_tt:0 "Swear five years of allegiance. Contribute livestock or gold now and honor the oath when a united crown is formed."
 vkfu.2.2:0 "No stranger will speak for my clan."
 vkfu.2.2_tt:0 "No pledge is made."
 vkfu.3.t:0 "The Name Carried Between Campfires"
 vkfu.3.desc:0 "My riders return with the chiefs’ answers. A reputation cannot be proclaimed into existence; it must be carried by other voices. Those who have pledged to me have given my ambition a shape. Now I must bring them together and earn the authority to bind their banners."
 vkfu.3.0:0 "Let them know me as a conqueror and a uniter."
 vkfu.3.0_tt:0 "Gain Conqueror and resources for the founding War Council. A council-hosting request is scheduled in three months and retried if Talia is temporarily unavailable."
 vkfu.3.1:0 "I must win more voices before I claim their trust."
 vkfu.3.1_tt:0 "Rally the clans again later. No empire is created."
 vkfu.10.t:0 "The Oath Beneath the Banners"
 vkfu.10.desc:0 "The council falls silent. Chiefs who argued over pastures, tribute and old blood now wait for the words that will bind this gathering to something larger. They will accept an emperor—but not an emperor without a purpose. I must name the achievement by which this new Southorion will judge me."
 vkfu.10.0:0 "I swear to conquer the Strait."
 vkfu.10.0_tt:0 "Create the empire for 100 gold and 500 prestige. Within twenty years, bring Karthalon under your realm."
 vkfu.10.1:0 "I swear to unite the Southron peoples."
 vkfu.10.1_tt:0 "Create the empire. Within twenty years, control every Southorion county of Southorion or Desert Southron culture, including their descendants."
 vkfu.10.2:0 "I swear to give the clans enduring halls and laws."
 vkfu.10.2_tt:0 "Create the empire. Within twenty years, become feudal, rule at least two direct Southron vassals, and settle every tribal or nomadic Southron vassal in your realm."
 vkfu.11.t:0 "Banners Without an Oath"
 vkfu.11.desc:0 "The gathering ends without the recognition or resources needed to found an empire. Some chiefs leave unconvinced; others will wait to see whether I can honor the commitments already made. There will be another council, but there is no crown today."
 vkfu.11.0:0 "We will meet again."
 vkfu.11.0_tt:0 "No title is created. Gather support before hosting another council."
 vkfu.12.t:0 "The Emperor’s Herald"
 vkfu.12.desc:0 "[ROOT.Char.Var('vkfu_submission_offer').Char.GetTitledFirstName] offers my clan a place beneath the new imperial banner. The herald promises that our customs and our ruler will remain. I may accept the emperor’s authority with protected autonomy, or keep our independence and bear whatever the future brings."
 vkfu.12.0:0 "Our banner will stand beside theirs."
 vkfu.12.0_tt:0 "Become a vassal, retain your government and receive five years of promised autonomy."
 vkfu.12.1:0 "I offer cooperation, not submission."
 vkfu.12.1_tt:0 "Remain independent with a five-year pledge of cooperation."
 vkfu.12.2:0 "My clan answers to no emperor."
 vkfu.12.2_tt:0 "Remain independent. No land changes hands."
 vkfu.13.t:0 "Another Banner Joins Us"
 vkfu.13.desc:0 "[scope:vkfu_subject.GetTitledFirstName] has accepted my authority. The oath preserves their customs and promises their people autonomy. Each banner makes the empire stronger; each promise gives its ruler another obligation to remember."
 vkfu.13.0:0 "Their oath shall be honored."
 vkfu.20.t:0 "An Empire Rises in Southorion"
 vkfu.20.desc:0 "Riders and merchants carry the news far beyond Kartholos: [GetGlobalVariable('vkfu_founder').Char.GetTitledFirstName] has been acclaimed at the Southron War Council. The clans have an imperial banner, and its founder has sworn a public oath. The Keepers must reckon with a new power across the strait; the world can no longer treat these peoples as scattered camps."
 vkfu.20.0:0 "The balance of the world has changed."
 vkfu.21.t:0 "Ten Years Beneath the Oath"
 vkfu.21.desc:0 "Ten years have passed since the chiefs listened to my promise. They remember the words even when the demands of rule have crowded them from my thoughts. Half the allotted time remains. If I fail, the oaths that held independent allies to my cause will not survive my broken word."
 vkfu.21.0:0 "The oath still binds me."
 vkfu.21.0_tt:0 "Ten years remain on the founding promise."
 vkfu.22.t:0 "A Promise Made Real"
 vkfu.22.desc:0 "The promise spoken before the assembled banners has become a deed. Those who doubted the new empire must now reckon with what it has achieved. Let the chronicles record that the first imperial oath was kept."
 vkfu.22.0:0 "Let every camp hear the news."
 vkfu.22.0_tt:0 "Gain prestige and twenty years of respect from your vassals."
 vkfu.23.t:0 "The Oath Outlives the Words"
 vkfu.23.desc:0 "Twenty years have passed, and the promise remains unfulfilled. Chiefs repeat my own words back to me. Independent allies withdraw their personal pledges; my subjects remain, but their trust has been wounded. An empire may survive a broken oath. Its ruler must still answer for it."
 vkfu.23.0:0 "I must govern what remains."
 vkfu.23.0_tt:0 "Lose 1,000 prestige; personal coalition pledges end, and vassal opinion suffers for ten years. Subjects are not automatically freed."
 vkfu_authorize_title:0 "A Council Worthy of All the Clans"
 vkfu_authorize_desc:0 "Two or more independent chiefs have recognized my leadership. I may now convene a founding Southron War Council through Activities. Its closing oath will determine whether an empire is born. I must still retain their support and the gold and prestige required when the council concludes."
 vkfu_authorize_confirm:0 "Summon the founding council."
 vkfu_authorize_tt:0 "Unlock the Southron War Council activity. No title is created yet; the closing oath costs 100 gold and 500 prestige, in addition to the activity cost."
 vkfu_wait:0 "Not yet."
 vkfu_rally:0 "Rally the Southron Chiefs"
 vkfu_rally_desc:0 "Send riders to seek recognition from independent frontier chiefs. Their replies will determine whether my reputation can sustain a founding council."
 vkfu_rally_tooltip:0 "Seek pledges and blood oaths for a founding War Council."
 vkfu_rally_confirm:0 "Let the riders depart."
 vkfu_send_heralds:0 "Send the Imperial Heralds"
 vkfu_send_heralds_desc:0 "Offer up to five independent chiefs a place within the empire. They may submit with autonomy, cooperate without submitting, or refuse."
 vkfu_send_heralds_tooltip:0 "Invite voluntary submission."
 vkfu_send_heralds_confirm:0 "Carry our offer to the camps."
 vkfu_review_oath:0 "Review the Founding Oath"
 vkfu_review_oath_desc:0 "Recall the promise that founded the empire and the conditions by which the chiefs will judge it."
 vkfu_review_oath_tooltip:0 "Review your public promise."
 vkfu_review_oath_confirm:0 "Let the oath be read."
 vkfu_oath_title:0 "The Words Before the Banners"
 vkfu_oath_desc:0 "The founding oath is personal to the ruler who made it. It must be fulfilled within twenty years of foundation. The frontier is reviewed monthly; a kept oath wins lasting respect, while a broken one costs prestige and dissolves personal coalition pledges."
 vkfu_vow_1:0 "\n\n#bold Conquer the Strait#!: Karthalon must be controlled by the founder’s realm."
 vkfu_vow_2:0 "\n\n#bold Unite the Southron Peoples#!: every county on Southorion with Southorion or Desert Southron culture, or a descendant of either, must belong to the founder’s realm. Nonhuman cultures keep their own identities."
 vkfu_vow_3:0 "\n\n#bold Feudalize the Clans#!: the founder must become feudal, have at least two direct Southron vassals, and leave no tribal or nomadic Southron vassals anywhere within the realm. Nonhuman governments are exempt."
 vkfu_oath_kept:0 "\n\nThis promise has been fulfilled."
 vkfu_oath_failed:0 "\n\nThis promise has been broken."
 vkfu_oath_close:0 "I remember what I swore."
 vkfu_uniter_renown:0 "The Uniter’s Renown"
 vkfu_promise_kept:0 "The Founding Oath Kept"
 vkfu_promise_broken:0 "The Founding Oath Broken"
 vkfu.25.t:0 "Halls in Place of Tents"
 vkfu.25.desc:0 "[ROOT.Char.Var('vkfu_settlement_offer').Char.GetTitledFirstName] offers to fund stone halls and a settled administration for my people. This is part of the founding oath, but it would change our way of life. We can accept feudal government while keeping our ruler and culture, or refuse to surrender the old ways."
 vkfu.25.0:0 "Build the halls. Our people will settle."
 vkfu.25.0_tt:0 "Convert to feudal government and convert your personally held tribal and pastoral county capitals to castles. Nomadic wealth is compensated."
 vkfu.25.1:0 "We will keep the ways of our ancestors."
 vkfu.25.1_tt:0 "Keep your government. The imperial grant is refunded; another offer can be made in three years."
 vkfu_settle_capital:0 "Found the Imperial Halls"
 vkfu_settle_capital_desc:0 "Begin the promised settlement with my own people. For 500 gold and 500 prestige, adopt feudal government and replace the tribal and pastoral capitals I personally hold with castles. My vassals will choose for themselves."
 vkfu_settle_capital_tooltip:0 "Settle your own clan."
 vkfu_settle_capital_confirm:0 "Lay the foundations."
 vkfu_settlement_grants:0 "Offer Grants to Settle the Clans"
 vkfu_settlement_grants_desc:0 "Reserve up to 600 gold for three Southron vassals, at 200 gold each. Those who accept settle their own domains; those who refuse keep their customs and return the grant. Nonhuman governments are not targeted."
 vkfu_settlement_grants_tooltip:0 "Fund voluntary feudalization."
 vkfu_settlement_grants_confirm:0 "Send the builders and envoys."
