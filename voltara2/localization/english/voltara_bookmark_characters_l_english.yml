 voltara_cassian_desc:0 "Emperor Cassian rules Severos and its great noble realms. Hold the hegemony together as rival houses compete for influence."
 voltara_talia_desc:0 "Talia \"the Uniter\" dreams of bringing the divided Southron peoples beneath one banner. Gather the chiefs at a Southron War Council, secure their blood oaths, and swear the promise that will shape a new empire: conquer the Strait, unite the Southron cultures, or feudalize the clans."
 voltara_jerion_desc:0 "Jerion rules the Triarchy of Alu’Tor, the land from which Titus began his journey. Preserve the triarchy’s independence as new empires rise across the sea."
