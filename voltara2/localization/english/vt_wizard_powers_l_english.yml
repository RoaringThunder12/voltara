l_english:
 vt_bestow_wizards_gift:0 "Bestow the Wizard's Gift"
 vt_bestow_wizards_gift_desc:0 "Grant this character the same gift of immortality bestowed upon Micheal. Their appearance will remain at their present age. Only The Wizard can bestow this gift."
 vt_wizards_gift_opinion:0 "Granted Me Immortality"
 vt_death_wizards_wrath:0 "was slain by the Wizard's power after invading his realm"
 vt_death_wizards_wrath_killer:0 "was slain by [TARGET_CHARACTER.GetUINamePossessive] power after invading his realm"
 vt_wizard_powers.1.t:0 "The Wizard's Gift"
 vt_wizard_powers.1.desc:0 "The Wizard rests a hand upon my brow. For a moment I feel every passing year fall silent. He has granted me the gift he once gave Micheal: time will no longer carry me toward old age."
 vt_wizard_powers.1.a:0 "A lifetime without an ending."
 vt_wizard_powers.2.t:0 "An Invasion Silenced"
 vt_wizard_powers.2.desc:0 "[vt_wizard_invader.GetFirstName] dared to declare war upon my realm. A thought was enough to end that ambition. The invader is dead, and the war has ended in white peace."
 vt_wizard_powers.2.a:0 "Let the world remember."
