l_english:
 voltara_veilroot_cult:0 "Veilroot Communion"
 voltara_veilroot_cult_adj:0 "Veilroot"
 voltara_veilroot_cult_adherent:0 "Veilroot Initiate"
 voltara_veilroot_cult_adherent_plural:0 "Veilroot Initiates"
 voltara_veilroot_cult_desc:0 "A heretical Khaotist communion founded in the drowned sanctums of Rhaulla. Ithren Veilroot teaches that death is a prison imposed upon the Weave, and that Khaos commands its breaking. Demons, the dead, blood-drinkers and witch covens are bound by bargains to overthrow Aeliunist dominion. Other servants of Khaos question whether his liberation merely exchanges one master for another."
 vvr_lich_offer_desc:0 "Offer the recipient lichdom. Acceptance grants Lich and both Necromancer traits; refusal leaves them unchanged. The threadbinding reserve is charged only on acceptance."
 vvr_host_name:0 "The Host Beneath the Roots"
 vvr.1.t:0 "The Roots Remember"
 vvr.1.desc:0 "For two centuries I have listened to the threads that linger after death. Beneath Barelvar, the roots speak back. They offer more than memory: Khaos promises a world in which neither the living nor the dead must kneel to Aeliunist masters. A communion could turn my solitary experiments into a cause."
 vvr.1.0:0 "Gather those who will hear the roots."
 vvr.1.1:0 "Not yet. These bargains demand preparation."
 vvr.2.t:0 "A Communion in the Mire"
 vvr.2.desc:0 "Students and fugitives gather around the black water. Some want forbidden knowledge; others want vengeance. I must recover the drowned elven records, bind a vessel for my soul, and learn enough to survive the severing of flesh. Only then can I compel the greater powers to bargain."
 vvr.2.0:0 "Knowledge first; conquest will follow."
 vvr_begin:0 "Listen to the Veilroot"
 vvr_begin_desc:0 "Found Ithren’s personal communion and begin his path toward lichdom."
 vvr_begin_tooltip:0 "Listen to the Veilroot"
 vvr_begin_confirm:0 "Proceed"
 vvr_study:0 "Recover the Drowned Testament"
 vvr_study_desc:0 "Spend 100 gold and 30 threadbinding reserve to study the drowned elven records. Gain 20 forbidden lore, or pursue a more dangerous reading. Current lore: [ROOT.Char.MakeScope.Var('vvr_lore').GetValue]."
 vvr_study_tooltip:0 "Recover the Drowned Testament"
 vvr_study_confirm:0 "Proceed"
 vvr.3.t:0 "The Drowned Testament"
 vvr.3.desc:0 "Marsh guides return with tablets wrapped in reedcloth. Most preserve irrigation plans and family histories. One describes a vessel that can hold a severed soul. Its final lines have been deliberately erased. I can reconstruct the missing sequence slowly—or ask what still whispers inside the stone."
 vvr.3.0:0 "Reconstruct the sequence carefully."
 vvr.3.1:0 "Let the whisper speak."
 vvr.4.t:0 "Something Followed Us Home"
 vvr.4.desc:0 "The recovered voice was not a scholar. For three nights the initiates have dreamed the same door opening beneath the marsh. We seal the chamber, but the strain of keeping it shut will impede my work."
 vvr.4.0:0 "Seal the chamber and count the survivors."
 vvr_vessel:0 "Bind the Root-Heart"
 vvr_vessel_desc:0 "Spend 350 gold and 200 piety to prepare a phylactery. Requires 40 forbidden lore; the work takes one year."
 vvr_vessel_tooltip:0 "Bind the Root-Heart"
 vvr_vessel_confirm:0 "Proceed"
 vvr.5.t:0 "The Root-Heart"
 vvr.5.desc:0 "A year of binding has drawn the chamber’s roots around a hollow of black glass. The vessel answers to my true name. It is ready to shelter the part of me that death would otherwise take."
 vvr.5.0:0 "Keep it hidden beneath the oldest roots."
 vvr_ascension:0 "Sever the Mortal Thread"
 vvr_ascension_desc:0 "Become a lich after preparing the Root-Heart and gathering 80 lore. Costs 500 piety and 100 threadbinding reserve. The completed preparations make this personal rite reliable."
 vvr_ascension_tooltip:0 "Sever the Mortal Thread"
 vvr_ascension_confirm:0 "Proceed"
 vvr.6.t:0 "The Lich of Barelvar"
 vvr.6.desc:0 "My heart has fallen silent. Beyond that silence, the Weave has never sounded clearer. Khaos has kept the first bargain. Now come its servants: the patient dead, the hungry fiends, the blood courts and the covens. None will serve without a price."
 vvr.6.0:0 "Let them approach my throne."
 vvr_seek_dead:0 "Bind The Silent Legion"
 vvr_seek_dead_desc:0 "The dead ask for no land. Their binders ask for the names of those they must never raise. Even this army needs rules. Costs 200 gold and 40 threadbinding reserve. Each pact grants a specialist and one finite contingent, and unlocks its regiment for recruitment."
 vvr_seek_dead_tooltip:0 "Bind The Silent Legion"
 vvr_seek_dead_confirm:0 "Proceed"
 vvr.10.t:0 "The Silent Legion"
 vvr.10.desc:0 "The dead ask for no land. Their binders ask for the names of those they must never raise. Even this army needs rules."
 vvr.10.0:0 "The living retain their burial names."
 vvr_seek_fiends:0 "Bind The Bargain Beyond the Veil"
 vvr_seek_fiends_desc:0 "A horned emissary studies my throne as if measuring it for another occupant. Its legion will fight for Khaos, but demands a continuing share of the power passing through my sanctum. Costs 300 gold and 80 threadbinding reserve. Each pact grants a specialist and one finite contingent, and unlocks its regiment for recruitment."
 vvr_seek_fiends_tooltip:0 "Bind The Bargain Beyond the Veil"
 vvr_seek_fiends_confirm:0 "Proceed"
 vvr.11.t:0 "The Bargain Beyond the Veil"
 vvr.11.desc:0 "A horned emissary studies my throne as if measuring it for another occupant. Its legion will fight for Khaos, but demands a continuing share of the power passing through my sanctum."
 vvr.11.0:0 "Bind the bargain; surrender no soul-name."
 vvr_seek_blood:0 "Bind The Blood Courts Answer"
 vvr_seek_blood_desc:0 "The envoys demand sanctuary from the inquisitors and a place in the order that follows conquest. They will not accept being treated as mindless corpses. Costs 250 gold and 50 threadbinding reserve. Each pact grants a specialist and one finite contingent, and unlocks its regiment for recruitment."
 vvr_seek_blood_tooltip:0 "Bind The Blood Courts Answer"
 vvr_seek_blood_confirm:0 "Proceed"
 vvr.12.t:0 "The Blood Courts Answer"
 vvr.12.desc:0 "The envoys demand sanctuary from the inquisitors and a place in the order that follows conquest. They will not accept being treated as mindless corpses."
 vvr.12.0:0 "Sanctuary in exchange for military service."
 vvr_seek_covens:0 "Bind The Witches of the Black Reeds"
 vvr_seek_covens_desc:0 "The covens know paths that imperial armies cannot follow. They offer scouts and battle rites, but insist that their circles retain their own teachers and customs. Costs 200 gold and 50 threadbinding reserve. Each pact grants a specialist and one finite contingent, and unlocks its regiment for recruitment."
 vvr_seek_covens_tooltip:0 "Bind The Witches of the Black Reeds"
 vvr_seek_covens_confirm:0 "Proceed"
 vvr.13.t:0 "The Witches of the Black Reeds"
 vvr.13.desc:0 "The covens know paths that imperial armies cannot follow. They offer scouts and battle rites, but insist that their circles retain their own teachers and customs."
 vvr.13.0:0 "Their circles shall govern their own rites."
 vvr_muster:0 "Call the Host Beneath the Roots"
 vvr_muster_desc:0 "Unite all four pacts into a conquest host. Costs 600 gold and 1,000 prestige. Unlocks wars for neighboring Aeliunist human counties, and duchies after the first victory. The initial host does not replenish."
 vvr_muster_tooltip:0 "Call the Host Beneath the Roots"
 vvr_muster_confirm:0 "Proceed"
 vvr.14.t:0 "Banners Beneath the Roots"
 vvr.14.desc:0 "Bone standards rise beside the blood courts’ silk. Coven fires mark the marsh paths, and demons wait beyond their light. I have assembled an army whose captains disagree about the world they will inherit. For now, they share an enemy. The neighboring Aeliunist rulers have been warned."
 vvr.14.0:0 "Let the temples hear our marching."
 vvr.20.t:0 "Whispers from Barelvar"
 vvr.20.desc:0 "Reports from Rhaulla agree on one terrible point: Ithren Veilroot has become a lich. His new communion invokes Khaos and seeks bargains with the enemies of the living. There is still time to prepare the graveyards and summon those who understand his arts."
 vvr.20.0:0 "Fund watches and consecrate the graves."
 vvr.20.1:0 "Send warnings through the temples."
 vvr.21.t:0 "The Host Beneath the Roots"
 vvr.21.desc:0 "Ithren’s scattered bargains have become an army. The dead march beside blood-drinkers, fiends and coven warriors. The danger is no longer a rumor from the swamps: neighboring Aeliunist lands may now become the targets of his conquest."
 vvr.21.0:0 "We will hold the crossings."
 vvr.22.t:0 "Silence Beneath Barelvar"
 vvr.22.desc:0 "Ithren Veilroot has fallen. Without his will, the dead host loses its binding purpose. The blood courts and covens scatter to preserve what they can, while his surviving initiates carry their teachings into hiding. His conquests remain in the hands of the living; the communion’s memory will not be so easily buried."
 vvr.22.0:0 "Let the watches remain vigilant."
 vvr_defend:0 "Consecrate the Graves"
 vvr_defend_desc:0 "Fund five years of fortified graveyards and marsh watches against the Veilroot host. Costs 150 gold and 150 piety."
 vvr_defend_tooltip:0 "Consecrate the Graves"
 vvr_defend_confirm:0 "Proceed"
 vvr.30.t:0 "The First Broken Sanctuary"
 vvr.30.desc:0 "The host has secured its first conquest. My captains ask what victory means. The covens want sanctuary, the vampires want dependable subjects, and the dead wait without speaking. Terror can make this land productive quickly; patience may make it loyal."
 vvr.30.0:0 "Govern the living; bind only the fallen."
 vvr.30.1:0 "Let fear secure the new dominion."
 vvr.31.t:0 "The Host Recoils"
 vvr.31.desc:0 "The campaign has failed. Coven captains blame demonic impatience; the blood courts accuse my binders of wasting their warriors. The pacts survive, but for five years I must rebuild their confidence before launching another Veilroot conquest."
 vvr.31.0:0 "The roots endure beneath defeat."
 vvr.32.t:0 "An Uneasy Truce"
 vvr.32.desc:0 "Neither side has broken the other. My captains withdraw under a truce, carrying grievances as well as their surviving banners. The enemy remains, and the cost of another campaign must be weighed carefully."
 vvr.32.0:0 "Preserve the host for another season."
 vvr.40.t:0 "The Marsh Remembers Its Builders"
 vvr.40.desc:0 "A restored elven site has yielded records sealed before the swamps swallowed its approaches. Its engineers understood the ground beneath the mire; its scholars understood how power could be stored without destroying its vessel. The recovered knowledge strengthens my communion."
 vvr.40.0:0 "The ancient work will serve a new purpose."
 vvr_inner_circle:0 "The Veilroot Inner Circle"
 vvr_backlash:0 "Whispers Beyond the Seal"
 vvr_fiend_tithe:0 "The Fiends’ Tithe"
 vvr_dread_host:0 "Master of the Veilroot Host"
 vvr_grave_wards:0 "Consecrated Graves and Watches"
 vvr_patient_rule:0 "Guardians of the Living"
 vvr_terror_rule:0 "The Lich’s Terror"
 vvr_bone_legion:0 "Veilroot Bone Legion"
 vvr_bone_legion_flavor:0 "Bound to Ithren’s communion by a bargain that survives beyond the first campaign."
 vvr_bound_fiends:0 "Bound Fiends"
 vvr_bound_fiends_flavor:0 "Bound to Ithren’s communion by a bargain that survives beyond the first campaign."
 vvr_blood_cavalry:0 "Blood-Court Riders"
 vvr_blood_cavalry_flavor:0 "Bound to Ithren’s communion by a bargain that survives beyond the first campaign."
 vvr_coven_archers:0 "Black-Reed Coven"
 vvr_coven_archers_flavor:0 "Bound to Ithren’s communion by a bargain that survives beyond the first campaign."
 vvr_conquest_county:0 "Veilroot County Conquest"
 vvr_conquest_county_name:0 "Veilroot Conquest"
 vvr_conquest_duchy:0 "Veilroot Duchy Conquest"
 vvr_conquest_duchy_name:0 "Veilroot Conquest"
 vvr_conquest_victory:0 "Ithren takes the contested counties held by the defender and their vassals. His first victory unlocks duchy conquests."
 vvr_conquest_defeat:0 "Ithren loses prestige and cannot launch Veilroot conquests for five years."
 vvr_conquest_peace:0 "No land changes hands. Ithren loses prestige."
 vvr_conquest_invalid:0 "The campaign ends without a settlement."
 building_vvr_archive_surveyed:0 "Stabilized Moradgrom Archive"
 building_vvr_archive_surveyed_desc:0 "Raised causeways, drained chambers and catalogued stonework secure the ancient site. Full restoration remains an immense undertaking."
 building_type_vvr_archive_surveyed:0 "Stabilized Moradgrom Archive"
 building_type_vvr_archive_surveyed_desc:0 "Raised causeways, drained chambers and catalogued stonework secure the ancient site. Full restoration remains an immense undertaking."
 building_vvr_archive_restored:0 "Restored Moradgrom Archive"
 building_vvr_archive_restored_desc:0 "Elven chambers and bindings have been restored after years of work in the Rhaullan swamps. The recovered site supports a functioning settlement and preserves knowledge once buried beneath the mire."
