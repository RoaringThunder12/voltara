l_english:
 vt_weave_crystal_name:0 "Weave Crystal"
 vt_weave_crystal_desc:0 "A clear crystal threaded with a pale, restless radiance. Ancient Threadbinders prized these stones for their ability to gather the ambient Weave.\n\nWhile equipped by a character able to use Threadbinding: #P +5.00#! monthly Thread Reserve recovery. Each equipped crystal contributes separately, up to the normal reserve capacity."
 vt_weave_crystal_recovery:0 "Equipped Weave Crystals"
 vt_weave_crystal_modifier:0 "Weave Crystal: +5.00 Monthly Thread Reserve"
 vt_weave_crystals.1.t:0 "Light Beneath the Dust"
 vt_weave_crystals.1.desc:0 "Beneath a collapsed elven arch, something glimmers among the dust and broken stone. I uncover a crystal untouched by the centuries. Fine strands of light drift through its heart: the lingering power of the Weave, gathered into solid form."
 vt_weave_crystals.2.t:0 "A Glimmer Beside the Road"
 vt_weave_crystals.2.desc:0 "What first appears to be a shard of glass catches my eye beside the road. I brush away the dirt and find a crystal with light moving deep inside it. An old traveller's tale comes to mind: stones that gather the Weave, once sought by the masters of the elven world."
 vt_weave_crystals.take:0 "I will keep this Weave Crystal."
 vt_weave_crystals.leave:0 "Let another traveller find it."
