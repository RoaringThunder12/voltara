 vic_story.13.9:0 "Find the missing clerk, Aven Reed."
 vic_story.13.9.tt:0 "Investigate a threatened clerk without assuming who threatened him."
 vic_story.13.10:0 "Attend Elaine Voss’s salon."
 vic_story.13.10.tt:0 "Hear political rumors and pursue records that actually exist."
 vic_story.13.11:0 "Bring the case before the imperial council."
 vic_story.13.11.tt:0 "Public disclosure affects credibility and allegiance. It cannot turn financial irregularities into proof of murder."
 vic_story.13.12:0 "The Emperor has heard enough; I must choose."
 vic_story.13.12.tt:0 "Decide whether to keep faith with the private inquiry or disclose your case."
 vic_story.13.13:0 "Return to my affairs."
 vic_story.13.13.tt:0 "No commitment is made."
 vic_story.15.7:0 "Place Tharn under discreet surveillance."
 vic_story.15.7.tt:0 "Spend 50 gold in total on surveillance and a palace inquiry. No trace is invented."
 vic_story.15.8:0 "Return to my affairs."
 vic_story.15.8.tt:0 "No commitment is made."
 vic_story.21.3:0 "Decline his political cooperation."
 vic_story.21.3.tt:0 "Refuse the political offer without inventing knowledge of a murder plan."
 vic_story.23.2:0 "Demand a guarantee of regional privileges."
 vic_story.23.2.tt:0 "Send terms to Cassian. No agreement is assumed."
