l_english:
 vic_imperial_claim:0 "War for the Severosi Crown"
 vic_imperial_claim_name:0 "War for the Severosi Crown"
 vic_iron_forest_host:0 "Iron Forest Muster"
 vic_war_victory:0 "The claimant takes the Severosi Hegemony. Surviving imperial relatives are not automatically killed."
 vic_war_defeat:0 "The claimant returns to imperial allegiance and may be imprisoned."
 vic_war_white_peace:0 "The claimant returns to imperial allegiance; the claim and political grievances remain."
 vic_war_invalidated:0 "The imperial claim war ends without a scripted succession."
 vic_story.10.t:0 "The Seven Seals: Counsel in Shadow"
 vic_story.10.desc:0 "A conspiracy survives through access, discretion, and allies who can use the opening it creates. None can be taken for granted. Every new collaborator is also a potential witness; every delay gives the imperial investigators more time. I must choose my next move."
 vic_story.10.0:0 "Develop access and the means of regicide."
 vic_story.10.0.tt:0 "Choose or prepare poison, an ambush, or a magical attack."
 vic_story.10.1:0 "Seek a discreet religious intermediary."
 vic_story.10.1.tt:0 "A newly generated cleric decides independently whether and how to help. No established Church official is automatically implicated."
 vic_story.10.2:0 "Send a letter to Octavian."
 vic_story.10.2.tt:0 "Choose how much to disclose. Octavian has his own goals."
 vic_story.10.3:0 "Silence the vulnerable connections."
 vic_story.10.3.tt:0 "Conceal, discredit, or abandon a connection."
 vic_story.10.4:0 "The hour approaches."
 vic_story.10.4.tt:0 "Review commitment, postponement, or abandonment."
 vic_story.10.5:0 "Build political opposition instead."
 vic_story.10.5.tt:0 "Recruit allies without asking them to consent to murder."
 vic_story.10.6:0 "Abandon the assassination."
 vic_story.10.6.tt:0 "Close the murder branch. Political opposition remains possible."
 vic_story.10.7:0 "Examine the hidden treasury."
 vic_story.10.7.tt:0 "Choose whether to exploit a new diversion. This does not make you responsible for the old missing relief funds."
 vic_story.11.t:0 "The Captains and the Crown"
 vic_story.11.desc:0 "An imperial claim is worth little without captains, funds, and rulers willing to risk their lands. Cassian can be opposed without trusting every enemy of his reforms. The choice of when to turn opposition into war remains mine—unless the arrest of Tharn forces the confrontation."
 vic_story.11.0:0 "Secure the loyalty of more captains."
 vic_story.11.0.tt:0 "Increase mobilization and create discoverable evidence of military preparations."
 vic_story.11.1:0 "Write to the great houses."
 vic_story.11.1.tt:0 "A paramount ruler may pledge support, support Cassian, or remain neutral."
 vic_story.11.2:0 "Meet my brother before blood is shed."
 vic_story.11.2.tt:0 "An offer requires Cassian’s agreement. It cannot override a mandatory uprising after Tharn’s imprisonment."
 vic_story.11.3:0 "Publish a manifesto for order and authority."
 vic_story.11.3.tt:0 "Make opposition public and rally aristocratic support."
 vic_story.11.4:0 "The die is cast. Raise my standard."
 vic_story.11.4.tt:0 "Begin a real claim war with paramount participation."
 vic_story.11.5:0 "Preserve incriminating correspondence and warn Cassian."
 vic_story.11.5.tt:0 "Only a letter that actually disclosed regicide can establish this link."
 vic_story.11.6:0 "Return to my affairs."
 vic_story.11.6.tt:0 "No commitment is made."
 vic_story.12.t:0 "The House Must Endure"
 vic_story.12.desc:0 "House Draconis must live with the result of this contest. Lending coin is not the same as swearing fealty; opposing abolition is not the same as consenting to murder. Each commitment has its own price, and each can be betrayed."
 vic_story.12.0:0 "Offer Octavian seventy-five gold."
 vic_story.12.0.tt:0 "Funds transfer only when Octavian accepts and you can still pay."
 vic_story.12.1:0 "Rally defenders of the ancient privileges."
 vic_story.12.1.tt:0 "Organize anti-abolition politics without committing to murder."
 vic_story.12.2:0 "Back Cassian and negotiate an economic transition."
 vic_story.12.2.tt:0 "Record a public commitment to Cassian. Previous financing is not erased."
 vic_story.12.3:0 "Disclose my financing before it destroys us."
 vic_story.12.3.tt:0 "Reveal your own financial commitment. This does not prove Tharn’s involvement in murder."
 vic_story.12.4:0 "Invest in free-labor estates."
 vic_story.12.4.tt:0 "Pay 50 gold for a five-year transition."
 vic_story.12.5:0 "Keep the house out of either camp."
 vic_story.12.5.tt:0 "Record neutrality without erasing prior financial commitments."
 vic_story.12.6:0 "Request concrete terms for the Draconis estates."
 vic_story.12.6.tt:0 "Ask Cassian to finance an orderly free-labor transition."
 vic_story.13.t:0 "The Imperial Investigation"
 vic_story.13.desc:0 "Financial corruption, military preparations, palace access, religious contacts, and private correspondence are separate lines of inquiry. A lead is not a conviction. Investigators need surviving sources, authenticated copies, and a direct connection to the proposed crime."
 vic_story.13.0:0 "Investigate the palace access records."
 vic_story.13.0.tt:0 "Spend 20 gold. A lead may be found if an access trail exists."
 vic_story.13.1:0 "Examine military correspondence."
 vic_story.13.1.tt:0 "Spend 20 gold to investigate musters. This cannot by itself prove regicide."
 vic_story.13.2:0 "Consult a trusted clerical witness."
 vic_story.13.2.tt:0 "Spend 20 gold. Only an actually complicit or informed witness can reveal a murder connection."
 vic_story.13.3:0 "Trace private political correspondence."
 vic_story.13.3.tt:0 "Spend 20 gold. Only a message that actually disclosed the murder plan can establish that link."
 vic_story.13.4:0 "Authenticate what we already possess."
 vic_story.13.4.tt:0 "Compare sources and authenticate copies."
 vic_story.13.5:0 "Protect witnesses and cross-check the testimony."
 vic_story.13.5.tt:0 "Spend 30 gold to protect a witness and remove compromised-evidence status."
 vic_story.13.6:0 "Send the case to Cassian."
 vic_story.13.6.tt:0 "Send only the evidence currently in your possession."
 vic_story.13.7:0 "Question Tharn before making an accusation."
 vic_story.13.7.tt:0 "Tharn receives an opportunity to respond; no guilt is assumed."
 vic_story.13.8:0 "Ask Joren to return to the accounts."
 vic_story.13.8.tt:0 "Follow the financial inquiry independently of the murder investigation."
 vic_story.14.t:0 "The Chain of Evidence"
 vic_story.14.desc:0 "An authenticated copy can survive a frightened witness or a destroyed original. Even then, I must distinguish what a document actually establishes from what I wish it would prove. A deliberately compromised case requires independent witnesses before it can support an arrest."
 vic_story.14.0:0 "Authenticate the military papers."
 vic_story.14.0.tt:0 "Spend 20 gold to move one step from lead to corroborated to authenticated."
 vic_story.14.1:0 "Authenticate the palace records."
 vic_story.14.1.tt:0 "Spend 20 gold to move one step from lead to corroborated to authenticated."
 vic_story.14.2:0 "Authenticate the clerical testimony."
 vic_story.14.2.tt:0 "Spend 20 gold to move one step from lead to corroborated to authenticated."
 vic_story.14.3:0 "Authenticate the private correspondence."
 vic_story.14.3.tt:0 "Spend 20 gold to move one step from lead to corroborated to authenticated."
 vic_story.14.4:0 "Return to my affairs."
 vic_story.14.4.tt:0 "No commitment is made."
 vic_story.15.t:0 "Blood of Severos"
 vic_story.15.desc:0 "Reform has become a struggle over who may speak for the Empire. My brother can be negotiated with. Tharn can be investigated. Neither suspicion nor affection excuses me from weighing the consequences of an imperial warrant."
 vic_story.15.0:0 "Continue the investigation."
 vic_story.15.0.tt:0 "Pursue separate lines of evidence."
 vic_story.15.1:0 "Review palace security."
 vic_story.15.1.tt:0 "Choose a practical countermeasure without knowing Tharn’s hidden method."
 vic_story.15.2:0 "Offer Octavian a conference."
 vic_story.15.2.tt:0 "He may accept or reject a negotiated settlement."
 vic_story.15.3:0 "Seek public commitments to the crown."
 vic_story.15.3.tt:0 "Ask a paramount for support and strengthen military confidence."
 vic_story.15.4:0 "Issue a warrant for Tharn."
 vic_story.15.4.tt:0 "Strong evidence reduces opposition; a weak case damages legitimacy. A viable Octavian WILL rebel."
 vic_story.15.5:0 "Advance reform through a funded relief effort."
 vic_story.15.5.tt:0 "Spend 50 gold on relief. This does not silently change slavery law."
 vic_story.15.6:0 "Answer sermons against disorder."
 vic_story.15.6.tt:0 "Fund dialogue with religious opponents for 25 gold."
 vic_story.16.t:0 "The Means of Regicide"
 vic_story.16.desc:0 "Access must fit the method. Poison needs a route into the household; an ambush needs a predictable movement; a magical assault needs genuine arcane ability. None is a historical certainty, and all can be countered."
 vic_story.16.0:0 "Prepare a poison route."
 vic_story.16.0.tt:0 "Develop preparation and access. Food screening can counter this method."
 vic_story.16.1:0 "Plan a palace ambush."
 vic_story.16.1.tt:0 "Develop preparation and access. Changed schedules can disrupt this method."
 vic_story.16.2:0 "Prepare a concealed magical attack."
 vic_story.16.2.tt:0 "A warded household can resist the attack."
 vic_story.16.3:0 "Return to my affairs."
 vic_story.16.3.tt:0 "No commitment is made."
 vic_story.17.t:0 "The Confessor’s Promise"
 vic_story.17.desc:0 "Caledor Tharn has sought my help against Cassian. He asks for more than a sermon. I may offer ordinary political counsel, refuse him, risk direct complicity, or take what I have heard to the Emperor. My vows do not make the Church unanimous."
 vic_story.17.0:0 "Help him knowingly, and accept the danger."
 vic_story.17.0.tt:0 "You knowingly join this conspiracy; you become a possible witness."
 vic_story.17.1:0 "Offer political information, but refuse violence."
 vic_story.17.1.tt:0 "Provide political support without consenting to murder."
 vic_story.17.2:0 "Refuse to help."
 vic_story.17.2.tt:0 "No clerical assistance is supplied."
 vic_story.17.3:0 "Warn Cassian and seek protection."
 vic_story.17.3.tt:0 "Give Cassian your own direct testimony. Other investigators do not automatically learn it."
 vic_story.18.t:0 "Men Who Know Too Much"
 vic_story.18.desc:0 "A vulnerable connection can be bribed, intimidated, or abandoned. Destroying a source cannot erase copies already preserved by an investigator. A false accusation may delay an inquiry, but an independent witness can expose it."
 vic_story.18.0:0 "Pay for silence."
 vic_story.18.0.tt:0 "Spend 25 gold to improve concealment."
 vic_story.18.1:0 "Destroy the unprotected records."
 vic_story.18.1.tt:0 "Block new discoveries from unprotected sources at a cost to preparation. Existing copies survive."
 vic_story.18.2:0 "Plant a convenient false accusation."
 vic_story.18.2.tt:0 "Weak investigators may accept compromised evidence; protected witnesses can discredit it."
 vic_story.18.3:0 "Abandon this connection and rebuild elsewhere."
 vic_story.18.3.tt:0 "Reduce exposure at the cost of access. New traces may again be investigated."
 vic_story.18.4:0 "Return to my affairs."
 vic_story.18.4.tt:0 "No commitment is made."
 vic_story.19.t:0 "Knives Beneath the Crown"
 vic_story.19.desc:0 "The arrangements are real, but there is no certainty. Once I commit, Cassian has seven days to alter his defenses before the attempt is resolved. I can still postpone, change my method, or abandon the conspiracy now."
 vic_story.19.0:0 "Commit to the attempt."
 vic_story.19.0.tt:0 "Commit to one attempt. Readiness, exposure, protection, and method-specific countermeasures determine its chance."
 vic_story.19.1:0 "Postpone it and improve the plan."
 vic_story.19.1.tt:0 "Improve the plan and receive another final review in thirty days."
 vic_story.19.2:0 "Choose another method."
 vic_story.19.2.tt:0 "Review the available methods."
 vic_story.19.3:0 "Abandon regicide."
 vic_story.19.3.tt:0 "End the murder branch without ending political opposition."
 vic_story.20.t:0 "A Letter Without a Seal"
 vic_story.20.desc:0 "Octavian is already organizing opposition of his own. I may offer political cooperation without revealing the murder plan—or entrust him with information that could ruin me if he preserves it."
 vic_story.20.0:0 "Offer political cooperation only."
 vic_story.20.0.tt:0 "Octavian receives no knowledge of the assassination."
 vic_story.20.1:0 "Disclose the plan to remove Cassian by murder."
 vic_story.20.1.tt:0 "The letter becomes discoverable evidence of regicide."
 vic_story.20.2:0 "Return to my affairs."
 vic_story.20.2.tt:0 "No commitment is made."
 vic_story.21.t:0 "An Offer Unasked For"
 vic_story.21.desc:0 "Tharn’s sealed letter offers cooperation. I owe him neither consent nor secrecy. I can preserve what he has actually written, demand an accounting, or refuse his involvement in my own plans."
 vic_story.21.0:0 "Accept political cooperation, not a blank promise."
 vic_story.21.0.tt:0 "Record cooperation. If he disclosed regicide, you retain that knowledge privately."
 vic_story.21.1:0 "Refuse murder and preserve his letter."
 vic_story.21.1.tt:0 "Refuse the offer. Only information actually disclosed becomes your evidence."
 vic_story.21.2:0 "Demand that he explain himself before proceeding."
 vic_story.21.2.tt:0 "Request an actual follow-up. Tharn can disclose his plan, withhold it, or end contact."
 vic_story.22.t:0 "A Dangerous Investment"
 vic_story.22.desc:0 "Maxwell offers seventy-five gold for my opposition. The payment is a political commitment, not a confession to another man’s plot. Acceptance requires that he remain free and able to pay."
 vic_story.22.0:0 "Accept his support."
 vic_story.22.0.tt:0 "Transfer 75 gold once, and improve mobilization."
 vic_story.22.1:0 "Refuse the obligation."
 vic_story.22.1.tt:0 "No money changes hands."
 vic_story.23.t:0 "Blood of Severos: An Imperial Conference"
 vic_story.23.desc:0 "A meeting offers a way to reduce the danger without requiring either brother to renounce every conviction. It is not immunity for a murder plot. If Tharn is imprisoned while Cassian lives, the political breach will still become a rebellion."
 vic_story.23.0:0 "Accept a negotiated restraint."
 vic_story.23.0.tt:0 "Reduce mobilization and opposition, and strengthen legitimacy."
 vic_story.23.1:0 "No agreement is possible."
 vic_story.23.1.tt:0 "Reject the offer. No war begins solely because negotiations failed."
 vic_story.26.t:0 "Blood of Severos: An Imperial Conference"
 vic_story.26.desc:0 "A meeting offers a way to reduce the danger without requiring either brother to renounce every conviction. It is not immunity for a murder plot. If Tharn is imprisoned while Cassian lives, the political breach will still become a rebellion."
 vic_story.26.0:0 "Accept a negotiated restraint."
 vic_story.26.0.tt:0 "Reduce mobilization and opposition, and strengthen legitimacy."
 vic_story.26.1:0 "No agreement is possible."
 vic_story.26.1.tt:0 "Reject the offer. No war begins solely because negotiations failed."
 vic_story.24.t:0 "The Emperor Must Know"
 vic_story.24.desc:0 "Marques has submitted a case, distinguishing direct evidence from inference. I must judge the surviving sources and their reliability, not merely count the papers. A financial discrepancy or a military muster is not, on its own, proof of murder."
 vic_story.24.0:0 "Accept the dossier and continue the investigation."
 vic_story.24.0.tt:0 "Receive exactly the clue states Marques sent."
 vic_story.24.1:0 "Accept the dossier and review a warrant."
 vic_story.24.1.tt:0 "Receive the evidence, then decide whether to arrest Tharn."
 vic_story.25.t:0 "Behind Closed Doors"
 vic_story.25.desc:0 "Questions about access and correspondence have reached me. An investigator is asking for an explanation. I may cooperate, deny the inference, or lean on political influence; none erases evidence already held by others."
 vic_story.25.0:0 "Explain what can be explained."
 vic_story.25.0.tt:0 "Give up some preparation to reduce suspicion."
 vic_story.25.1:0 "Deny the accusation."
 vic_story.25.1.tt:0 "Refuse cooperation without destroying the inquiry."
 vic_story.25.2:0 "Intimidate the investigator."
 vic_story.25.2.tt:0 "Increase political pressure and the risk of exposure."
 vic_story.28.t:0 "A Reply from the Iron Forest"
 vic_story.28.desc:0 "Octavian has replied: [ROOT.Char.Custom('VicContactReply')]. A political agreement does not reveal every private intention. Only the contents I actually sent have left my hands."
 vic_story.28.0:0 "Return to my affairs."
 vic_story.28.0.tt:0 "No commitment is made."
 vic_story.29.t:0 "The Price of an Answer"
 vic_story.29.desc:0 "The financing offer has an answer: [ROOT.Char.Custom('VicFundingReply')]. Only an accepted and payable offer transfers the agreed seventy-five gold."
 vic_story.29.0:0 "Return to my affairs."
 vic_story.29.0.tt:0 "No commitment is made."
 vic_story.30.t:0 "Letters to the Great Houses"
 vic_story.30.desc:0 "A principal in the imperial crisis asks for my support. A public pledge, secret sympathy, and financial assistance are different commitments. War will still force me to decide how much I am willing to risk."
 vic_story.30.0:0 "Pledge publicly to Cassian."
 vic_story.30.0.tt:0 "Improve imperial military confidence and favor the Crown when war comes."
 vic_story.30.1:0 "Support Octavian’s claim."
 vic_story.30.1.tt:0 "Strengthen his coalition and favor his side when war comes."
 vic_story.30.2:0 "Remain neutral, but hear both sides."
 vic_story.30.2.tt:0 "Make no military commitment."
 vic_story.40.t:0 "The Emperor’s Protection"
 vic_story.40.desc:0 "Uncertainty is itself a danger. My household can screen food, change movements, or seek arcane protection. These precautions do not reveal an enemy’s chosen method. If an attempt is underway, I must act promptly: it will resolve seven days after the attacker commits."
 vic_story.40.0:0 "Screen food and household deliveries."
 vic_story.40.0.tt:0 "Improve protection against poison."
 vic_story.40.1:0 "Change my schedule and reinforce the guard."
 vic_story.40.1.tt:0 "Improve protection against an ambush."
 vic_story.40.2:0 "Commission wards for the household."
 vic_story.40.2.tt:0 "Spend 30 gold on protection against a magical attack."
 vic_story.40.3:0 "Keep our usual routine."
 vic_story.40.3.tt:0 "Do not improve protection."
 vic_story.41.t:0 "The Crown in Mourning"
 vic_story.41.desc:0 "Cassian has been killed. The succession follows the realm’s laws; an ambitious claimant must still secure power. No public announcement identifies the hidden architect without evidence. The imperial family’s survival remains a separate matter."
 vic_story.41.0:0 "Return to my affairs."
 vic_story.41.0.tt:0 "No commitment is made."
 vic_story.42.t:0 "An Emperor Still Living"
 vic_story.42.desc:0 "The attempt failed. Palace evidence survives, but the political opposition has not disappeared. I must decide whether to investigate further, secure my family, or issue a warrant whose consequences may include war."
 vic_story.42.0:0 "Protect the evidence and my family."
 vic_story.42.0.tt:0 "Retain the evidence and strengthen household protection."
 vic_story.42.1:0 "Review the case against Tharn."
 vic_story.42.1.tt:0 "An arrest remains your decision; its political cost depends on the evidence."
 vic_story.43.t:0 "The Empire Divided"
 vic_story.43.desc:0 "Octavian’s claim is now a war. Paramount rulers must choose the Crown, the claimant, or neutrality. Prior pledges influence their decisions, but neither a promise nor an imperial title can substitute for victory."
 vic_story.43.0:0 "Return to my affairs."
 vic_story.43.0.tt:0 "No commitment is made."
 vic_manage_tharn:0 "Manage the Conspiracy"
 vic_manage_tharn_desc:0 "Meet with your trusted confidants and choose the next move in the conspiracy."
 vic_manage_tharn_tooltip:0 "Meet with your trusted confidants and choose the next move in the conspiracy."
 vic_manage_tharn_confirm:0 "Proceed"
 vic_manage_octavian:0 "Organize Imperial Opposition"
 vic_manage_octavian_desc:0 "Consult your supporters and prepare your challenge to the imperial crown."
 vic_manage_octavian_tooltip:0 "Consult your supporters and prepare your challenge to the imperial crown."
 vic_manage_octavian_confirm:0 "Proceed"
 vic_manage_maxwell:0 "Protect House Draconis"
 vic_manage_maxwell_desc:0 "Examine the threats facing Severos and choose how to protect the realm."
 vic_manage_maxwell_tooltip:0 "Examine the threats facing Severos and choose how to protect the realm."
 vic_manage_maxwell_confirm:0 "Proceed"
 vic_manage_marques:0 "Pursue the Imperial Investigation"
 vic_manage_marques_desc:0 "Gather reports from your agents and decide how to respond to the imperial crisis."
 vic_manage_marques_tooltip:0 "Gather reports from your agents and decide how to respond to the imperial crisis."
 vic_manage_marques_confirm:0 "Proceed"
 vic_manage_cassian:0 "Defend the Imperial Crown"
 vic_manage_cassian_desc:0 "Convene your advisers and decide how to defend your crown and advance your reforms."
 vic_manage_cassian_tooltip:0 "Convene your advisers and decide how to defend your crown and advance your reforms."
 vic_manage_cassian_confirm:0 "Proceed"
 vic_story.70.t:0 "The Hidden Treasury"
 vic_story.70.desc:0 "The old relief scandal is not mine merely because it is useful. I can create a new diversion for my own operations, hide the administrative trail, or leave the accounts untouched. A new payment will create new evidence."
 vic_story.70.0:0 "Divert a new payment into the conspiracy."
 vic_story.70.0.tt:0 "Gain 40 gold and preparation, but create a discoverable payment record linking your operation to regicide."
 vic_story.70.1:0 "Conceal access without stealing the funds."
 vic_story.70.1.tt:0 "Build concealment without claiming responsibility for past corruption."
 vic_story.70.2:0 "Leave the treasury out of this."
 vic_story.70.2.tt:0 "Create no financial connection."
 vic_story.71.t:0 "The Vanishing Clerk"
 vic_story.71.desc:0 "Aven Reed has withdrawn from ordinary work. Fear is not proof of a named enemy. Safe accommodation may persuade him to describe the records he handled; threats may instead silence him. I must separate his knowledge from the rumors around his disappearance."
 vic_story.71.0:0 "Pay for protection and hear him privately."
 vic_story.71.0.tt:0 "Spend 30 gold and corroborate financial irregularities without accusing Tharn."
 vic_story.71.1:0 "Question the office through official channels."
 vic_story.71.1.tt:0 "Obtain a financial lead, at the cost of alerting interested parties."
 vic_story.71.2:0 "Return to my affairs."
 vic_story.71.2.tt:0 "No commitment is made."
 vic_story.72.t:0 "Breakfast with Wolves"
 vic_story.72.desc:0 "Elaine Voss’s salon gathers people who know the language of imperial favor. Some speak of captains, others of access to the palace. Conversation provides a direction, not an authenticated confession."
 vic_story.72.0:0 "Listen for military connections."
 vic_story.72.0.tt:0 "Spend 20 gold following a military lead, if a source exists."
 vic_story.72.1:0 "Trace introductions to the palace."
 vic_story.72.1.tt:0 "Spend 20 gold following palace connections, if a source exists."
 vic_story.72.2:0 "Do not trade confidences here."
 vic_story.72.2.tt:0 "Preserve discretion without receiving evidence."
 vic_story.73.t:0 "The Quartermaster’s Return"
 vic_story.73.desc:0 "Joren has brought the office records back for comparison. The defunct Office of Civic Recovery remains a genuine accounting problem. The documents establish missing relief, not who ordered an assassination."
 vic_story.73.0:0 "Compare the surviving entries."
 vic_story.73.0.tt:0 "Spend 20 gold to authenticate the financial record."
 vic_story.73.1:0 "Send relief before pursuing the culprits."
 vic_story.73.1.tt:0 "Spend 40 gold on relief while retaining a financial lead."
 vic_story.73.2:0 "Return to my affairs."
 vic_story.73.2.tt:0 "No commitment is made."
 vic_story.74.t:0 "A Matter of Conscience"
 vic_story.74.desc:0 "Cassian has received my findings. I cannot force him to interpret them as I do. Public disclosure can rally allies, but an unsupported accusation may damage the lawful cause I mean to serve."
 vic_story.74.0:0 "Trust him and continue gathering proof."
 vic_story.74.0.tt:0 "Keep the inquiry private."
 vic_story.74.1:0 "Present the evidence publicly."
 vic_story.74.1.tt:0 "Expose a strong case; a weak or compromised case instead damages credibility."
 vic_story.75.t:0 "Before the Imperial Council"
 vic_story.75.desc:0 "The council can hear what I actually know. Public proof changes the political argument; untested suspicion can be turned against the crown. Publication cannot be recalled."
 vic_story.75.0:0 "Place the case on the public record."
 vic_story.75.0.tt:0 "A strong case publicly implicates Tharn and weakens opposition; a weak case costs legitimacy."
 vic_story.75.1:0 "Return to my affairs."
 vic_story.75.1.tt:0 "No commitment is made."
 vic_story.76.t:0 "The Price of a Brother’s Peace"
 vic_story.76.desc:0 "Octavian asks that regional privileges survive a settlement. I may accept a political concession without granting immunity for murder, or refuse without immediately declaring war."
 vic_story.76.0:0 "Guarantee privileges and accept restraint."
 vic_story.76.0.tt:0 "Negotiate peace at the cost of a ten-year reduction in vassal contributions."
 vic_story.76.1:0 "Reject those terms."
 vic_story.76.1.tt:0 "End these negotiations without automatically beginning a war."
 vic_story.77.t:0 "An Answer Behind Closed Doors"
 vic_story.77.desc:0 "Tharn has answered the questioning: [ROOT.Char.Custom('VicConfrontReply')]. His response changes the inquiry, but reveals no private plans he did not disclose."
 vic_story.77.0:0 "Return to my affairs."
 vic_story.77.0.tt:0 "No commitment is made."
 vic_story.79.t:0 "The Emperor’s Terms"
 vic_story.79.desc:0 "Maxwell requests fifty gold to convert his estates toward free labor. Funding the transition can secure his public support and weaken opposition to reform, but it requires an actual imperial payment."
 vic_story.79.0:0 "Fund the transition."
 vic_story.79.0.tt:0 "Transfer 50 gold once and grant Draconis a ten-year estate transition."
 vic_story.79.1:0 "The house must pay its own costs."
 vic_story.79.1.tt:0 "Reject the subsidy without dictating Maxwell’s future allegiance."
 vic_story.78.t:0 "Terms for House Draconis"
 vic_story.78.desc:0 "Cassian has answered the estate subsidy proposal: [ROOT.Char.Custom('VicEstateReply')]. The commitments I have made will shape the future of House Draconis."
 vic_story.78.0:0 "Return to my affairs."
 vic_story.78.0.tt:0 "No commitment is made."
 vic_story.82.t:0 "The Prince Demands Details"
 vic_story.82.desc:0 "Octavian has withheld cooperation and asked what I intend. He cannot preserve a confession I have not sent, but a clear account may win his assistance."
 vic_story.82.0:0 "Entrust him with the murder plan."
 vic_story.82.0.tt:0 "Send an explicit account; it can later become evidence."
 vic_story.82.1:0 "Offer only political cooperation."
 vic_story.82.1.tt:0 "Send no details of regicide."
 vic_story.82.2:0 "End the correspondence."
 vic_story.82.2.tt:0 "Continue independently."
 vic_story.83.t:0 "The Confessor’s Answer"
 vic_story.83.desc:0 "The intermediary has promised: [ROOT.Char.Custom('VicClericHelp')]. Refusal does not tell me whether anyone has spoken privately to Cassian."
 vic_story.83.0:0 "Return to my affairs."
 vic_story.83.0.tt:0 "No commitment is made."
 vic_story.81.t:0 "The Provinces Remember"
 vic_story.81.desc:0 "The northern lords, subject kingdoms, and Strait Keepers have borne the cost of uncertainty. The crown can guarantee regional privileges, pay for recovery, or leave those grievances unresolved. None of these choices summons a future invasion."
 vic_story.81.0:0 "Guarantee local privileges."
 vic_story.81.0.tt:0 "Improve vassal relations at a ten-year cost to vassal taxes and levies."
 vic_story.81.1:0 "Pay for regional recovery and the straits."
 vic_story.81.1.tt:0 "Spend 100 gold; regional rulers receive a five-year recovery benefit, and the Strait Keepers receive 50 gold."
 vic_story.81.2:0 "The provinces must recover without imperial aid."
 vic_story.81.2.tt:0 "Retain the treasury, with five more years of unsettled grievances."
 vic_story.80.t:0 "The Price of a New Regime"
 vic_story.80.desc:0 "Those who financed and organized opposition expect a place in the new order. Rewarding a known regicide would carry a public cost. I can honor service without displacing the council or the Crownsguard by decree."
 vic_story.80.0:0 "Reward the financiers who actually supported me."
 vic_story.80.0.tt:0 "Pay 50 gold to a surviving Maxwell only if he funded the opposition."
 vic_story.80.1:0 "Honor Tharn’s political service."
 vic_story.80.1.tt:0 "Grant prestige without assigning an office. Publicly exposed complicity costs legitimacy."
 vic_story.80.2:0 "No house owns the crown."
 vic_story.80.2.tt:0 "Refuse patronage and retain the political resentment."
 vic_clerical_dialogue:0 "Dialogue with the Clergy"
 vic_exposed_conspirator:0 "Publicly Implicated in Regicide"
 vic_regional_concessions:0 "Guaranteed Regional Privileges"
 vic_regional_recovery:0 "Imperial Recovery Funding"
 vic_story.84.t:0 "The Means of Regicide"
 vic_story.84.desc:0 "The first contacts are made. Now opposition must become a concrete plan. Poison requires access to the household; an ambush requires a predictable movement; an arcane attack requires genuine magical ability. Once I choose a method, my agents will return with the next arrangements in three weeks."
 vic_story.84.0:0 "Prepare a poison route."
 vic_story.84.0.tt:0 "Develop preparation and access. Food screening can counter this method."
 vic_story.84.1:0 "Plan a palace ambush."
 vic_story.84.1.tt:0 "Develop preparation and access. Changed schedules can disrupt this method."
 vic_story.84.2:0 "Prepare a concealed magical attack."
 vic_story.84.2.tt:0 "A warded household can resist the attack."
 vic_story.84.3:0 "I will make these arrangements later."
 vic_story.84.3.tt:0 "Continue later through the Manage the Conspiracy decision."
 vic_story.85.t:0 "The Arrangements Take Shape"
 vic_story.85.desc:0 "My agents have returned with the next arrangements. I can strengthen our access, slow the work to improve secrecy, or call it off. If I continue, I will review the final plan in two weeks. Nothing obliges me to carry it through."
 vic_story.85.0:0 "Secure the remaining access."
 vic_story.85.0.tt:0 "Advance preparation and access, then receive the final review in fourteen days."
 vic_story.85.1:0 "Take greater care to conceal the preparations."
 vic_story.85.1.tt:0 "Advance the plan and improve secrecy before the final review."
 vic_story.85.2:0 "Abandon the assassination."
 vic_story.85.2.tt:0 "End this assassination branch; political opposition can continue."
 vic_story.85.3:0 "Leave the arrangements for another time."
 vic_story.85.3.tt:0 "Continue later through Manage the Conspiracy. No further preparation popup is scheduled."
 vic_story.50.t:0 "The Reckoning"
 vic_story.50.desc:0 "The decisive struggle has ended, but the conditions that produced it remain. The great houses remember their pledges, the legions remember their dead, and the relief camps still judge the Empire by what it provides. Settlement, repression, and reform will leave different legacies. If this question goes unanswered for six director intervals, the realm keeps an unsettled legacy."
 vic_story.50.0:0 "Reconcile the realm and honor lawful service."
 vic_story.50.0.tt:0 "Improve legitimacy and reduce opposition; retain a ten-year reconciliation legacy."
 vic_story.50.1:0 "Secure the crown through coercion."
 vic_story.50.1.tt:0 "Strengthen military confidence, but damage legitimacy and increase unrest. Continued slavery may provoke the existing liberation war."
 vic_story.50.2:0 "Make emancipation the settlement."
 vic_story.50.2.tt:0 "Ban slavery using the existing law and liberation effects, angering entrenched interests."
 vic_story.50.3:0 "Leave the settlement to ordinary politics."
 vic_story.50.3.tt:0 "End the scripted crisis with a ten-year unsettled legacy."
 vic_story.51.t:0 "The Family and the Crown"
 vic_story.51.desc:0 "The political struggle has changed the household’s position. Survival does not dictate one destination. Those who are free and unlanded may seek shelter with Bryndale, or remain where their duties and claims place them. No prisoner can be spirited away by a letter."
 vic_story.51.0:0 "Seek shelter with Bryndale."
 vic_story.51.0.tt:0 "Move only living, free, unlanded family members to a living Bryndale host."
 vic_story.51.1:0 "Remain with our household and its obligations."
 vic_story.51.1.tt:0 "Keep the family in its current courts and titles."
 vic_story.52.t:0 "Thorne and the Imperial Order"
 vic_story.52.desc:0 "The crisis has left choices that cannot be settled by another man’s history. I can work within the surviving order, oppose its persecution through lawful allies, or leave it behind. The fate of Elira and the beliefs I choose are not predetermined by Cassian’s death."
 vic_story.52.0:0 "Work with reformers inside the Empire."
 vic_story.52.0.tt:0 "Remain within the realm and pursue reform."
 vic_story.52.1:0 "Leave and gather those abandoned by the crown."
 vic_story.52.1.tt:0 "Become an adventurer if eligible and the DLC is available; otherwise retain a lawful opposition legacy."
 vic_story.52.2:0 "Embrace the Withering Hand."
 vic_story.52.2.tt:0 "Choose the dark transformation in response to persecution. This choice does not kill Elira."
