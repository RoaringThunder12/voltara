 vic_story.92.t:0 "The Correspondence Ends"
 vic_story.92.desc:0 "Tharn has ended the exchange rather than supply the account I requested. I have received no further information about his private intentions."
 vic_story.92.0:0 "Return to my affairs."
 vic_story.92.0.tt:0 "No commitment is made."
 vic_story.90.t:0 "An Answer Between Brothers"
 vic_story.90.desc:0 "The conference has an answer. An accepted settlement restrains the immediate opposition; a refusal leaves the dispute unresolved. Neither promises immunity for a murder conspiracy."
 vic_story.90.0:0 "Return to my affairs."
 vic_story.90.0.tt:0 "No commitment is made."
 vic_story.86.t:0 "A House of Coin"
 vic_story.86.desc:0 "The resources I reserved for opposition are still mine. Octavian will need coin, but making a payment is a commitment of its own. I can offer support or keep the money in reserve."
 vic_story.86.0:0 "Offer seventy-five gold to Octavian."
 vic_story.86.0.tt:0 "Send an offer. No gold transfers until he accepts."
 vic_story.86.1:0 "Keep our resources in reserve."
 vic_story.86.1.tt:0 "Make no offer. Further political choices remain available through Protect House Draconis."
 vic_story.87.t:0 "The Estates in Transition"
 vic_story.87.desc:0 "The work of adapting our estates has begun. I have already committed the initial funds. The question now is whether to make this an open political commitment or preserve the house’s freedom of action."
 vic_story.87.0:0 "Publicly support an orderly reform."
 vic_story.87.0.tt:0 "Support Cassian publicly without spending the initial investment again."
 vic_story.87.1:0 "Keep this an economic decision."
 vic_story.87.1.tt:0 "Continue the transition without pledging political allegiance."
 vic_story.88.t:0 "The Captains’ Oath"
 vic_story.88.desc:0 "The first musters have brought captains to my cause. They now ask what I intend to build: a larger force, a coalition of great houses, or an agreement with my brother. These paths need not lead to the same war."
 vic_story.88.0:0 "Strengthen the musters."
 vic_story.88.0.tt:0 "Improve military readiness. Further mobilization remains available through Organize Imperial Opposition."
 vic_story.88.1:0 "Seek pledges before raising more men."
 vic_story.88.1.tt:0 "A great house receives a request and sends its answer."
 vic_story.88.2:0 "Test the possibility of a conference."
 vic_story.88.2.tt:0 "Send Cassian a genuine offer. His response determines the next event."
 vic_story.89.t:0 "A Great House Replies"
 vic_story.89.desc:0 "[scope:vic_reply_house.GetTitledFirstName] has answered: [scope:vic_reply_house.Custom('VicHouseAnswer')]. This is a political commitment; war will still require a choice about how much to risk."
 vic_story.89.0:0 "Return to my affairs."
 vic_story.89.0.tt:0 "No commitment is made."
