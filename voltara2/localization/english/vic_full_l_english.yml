 vic_story.64.t:0 "The Imperial Crisis: My Position"
 vic_story.64.desc:0 "[ROOT.Char.Custom('VicCrisisPhase')]\n\nThe Empire’s visible political condition:\nLegitimacy: [GetGlobalVariable('vic_legitimacy').GetValue|0]\nNoble opposition: [GetGlobalVariable('vic_noble_opposition').GetValue|0]\nMilitary loyalty: [GetGlobalVariable('vic_military_loyalty').GetValue|0]\nPopular unrest: [GetGlobalVariable('vic_popular_unrest').GetValue|0]\n\n[ROOT.Char.Custom('VicDraconisAllegiance')]\nOpposition investment: [ROOT.Char.Custom('VicDraconisInvestment')]\nFinancing offer: [ROOT.Char.Custom('VicFundingReply')]\nEstate subsidy: [ROOT.Char.Custom('VicEstateReply')]"
