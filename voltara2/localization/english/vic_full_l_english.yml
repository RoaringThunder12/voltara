 setting_vic_methods_mundane_desc:0 "Only poison and ambush are available."
 vic_story.60.t:0 "The Imperial Crisis: My Position"
 vic_story.60.desc:0 "[ROOT.Char.Custom('VicCrisisPhase')]\n\nThe Empire’s visible political condition:\nLegitimacy: [GetGlobalVariable('vic_legitimacy').GetValue|0]\nNoble opposition: [GetGlobalVariable('vic_noble_opposition').GetValue|0]\nMilitary loyalty: [GetGlobalVariable('vic_military_loyalty').GetValue|0]\nPopular unrest: [GetGlobalVariable('vic_popular_unrest').GetValue|0]\n\nYour evidence:\nRelief accounts: [ROOT.Char.Custom('VicClueTreasury')]\nMilitary papers: [ROOT.Char.Custom('VicClueMusters')]\nPalace access: [ROOT.Char.Custom('VicCluePalace')]\nClerical testimony: [ROOT.Char.Custom('VicClueCleric')]\nPrivate correspondence: [ROOT.Char.Custom('VicClueLetters')]"
 vic_story.60.0:0 "Return to my affairs."
 vic_story.60.0.tt:0 "No commitment is made."
