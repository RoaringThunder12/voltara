 vic_story.62.desc:0 "[ROOT.Char.Custom('VicCrisisPhase')]\n\nThe Empire’s visible political condition:\nLegitimacy: [GetGlobalVariable('vic_legitimacy').GetValue|0]\nNoble opposition: [GetGlobalVariable('vic_noble_opposition').GetValue|0]\nMilitary loyalty: [GetGlobalVariable('vic_military_loyalty').GetValue|0]\nPopular unrest: [GetGlobalVariable('vic_popular_unrest').GetValue|0]\n\nChosen method: [ROOT.Char.Custom('VicChosenMethod')]\nPreparation: [GetGlobalVariable('vic_preparation').GetValue|0]\nAccess: [GetGlobalVariable('vic_access').GetValue|0]\nSecrecy: [GetGlobalVariable('vic_secrecy').GetValue|0]\nExposure: [GetGlobalVariable('vic_exposure').GetValue|0]\nOctavian’s reply: [ROOT.Char.Custom('VicContactReply')]\nClerical assistance: [ROOT.Char.Custom('VicClericHelp')]"
