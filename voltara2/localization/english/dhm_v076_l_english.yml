l_english:
 # Safe endings for incomplete or conflicting old-save choice records.
 dhm_v076_outcome_ack:0 "Leave This Old Matter Be"
 dhm_v076_unknown_outcome_tt:0 "The earlier choice is not clearly recorded. This closes the old matter without a reward, penalty, new chapter, memory or further event."
 dhm_v076_dhm_legacy_0151_unknown_desc:0 "[dhm_story_officer.GetFirstName] brings an old task before you. The instructions are missing from the household papers.\n\nWithout them, there is little more to be said."
 dhm_v076_dhm_legacy_0201_unknown_desc:0 "A petition from [dhm_ambition_target.GetFirstName] lies among the old household papers. Your answer is missing.\n\nWhatever was promised then, this faded page cannot tell you."
 dhm_v076_dhm_legacy_0301_unknown_desc:0 "Someone mentions the old quarrel between [dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName]. No one can recall your ruling with certainty.\n\nLet that quarrel rest."
 dhm_v076_dhm_legacy_0401_unknown_desc:0 "An old account mentions a lesson given to [dhm_heir.GetFirstName]. The tutor's report is incomplete.\n\nThere will be other chances to see what the heir has learned."
 dhm_v076_dhm_legacy_0501_unknown_desc:0 "An old disagreement with [dhm_partner_spouse.GetFirstName] comes to mind. The words you exchanged are no longer clear.\n\nThere is little good in arguing over them now."
 dhm_v076_dhm_legacy_0601_unknown_desc:0 "A note about helping [dhm_journey_relative.GetFirstName] and [dhm_journey_spouse.GetFirstName] has lost its final page. Whatever was agreed is missing.\n\nIf they need anything now, they can ask anew."
 dhm_v076_dhm_legacy_0701_unknown_desc:0 "An old account names [dhm_crisis_relative.GetFirstName] and a difficult season for the household. The page listing what each person owed is missing.\n\nNo debt can be settled from these scraps."
 dhm_v076_dhm_saga_0121_unknown_desc:0 "The quarrel between [dhm_officer_first.GetFirstName] and [dhm_officer_second.GetFirstName] appears in an old report. Your ruling does not.\n\nThe officers have present duties to attend to. This can rest."
 dhm_v076_dhm_saga_3041_unknown_desc:0 "A few lines recall a troubled conversation with [dhm_arc_first.GetFirstName]. They give no account of your reply.\n\nOld scraps of writing cannot settle what lies between you."
 dhm_v076_dhm_saga_4001_unknown_desc:0 "An old note recalls [dhm_protected_child.GetFirstName]'s punishment and [dhm_partner_spouse.GetFirstName]'s plea. The account breaks off before your answer.\n\nLet the child be judged for present deeds, not an unfinished tale."
 dhm_v076_dhm_saga_4101_unknown_desc:0 "A disagreement over duties with [dhm_partner_spouse.GetFirstName] is recorded in the household papers. The final arrangement is missing.\n\nThere is no need to reopen it without a fresh complaint."
 dhm_v076_dhm_saga_6001_unknown_desc:0 "An old complaint against [dhm_crisis_relative.GetFirstName] has surfaced. No ruling is attached.\n\nA loose page is no reason to stir up old gossip."
 dhm_v076_dhm_saga_6101_unknown_desc:0 "A tutor's old report names [dhm_former_student.GetFirstName], but the account of the further lessons is incomplete.\n\nYou set it aside. It tells too little to judge the pupil."
 dhm_v076_dhm_saga_6211_unknown_desc:0 "[dhm_mourner.GetFirstName]'s bereavement is noted in an old household account. The space beneath it is blank.\n\nWhatever words passed between you then, there is no need to disturb that grief now."
 dhm_v076_dhm_saga_6301_unknown_desc:0 "An old report names [dhm_crisis_relative.GetFirstName] and [dhm_crisis_spouse.GetFirstName] in a quarrel. It ends before your answer.\n\nTheir marriage is theirs to speak of. This page can be put away."
 dhm_v076_dhm_saga_9001_unknown_desc:0 "[dhm_legacy_critic.GetFirstName]'s criticism survives among the family papers. Your reply has been lost.\n\nLet the house be known by its deeds today."
