l_english:
kCAFG_complete_task_debug_interaction: "Complete Councillor Task"
kCAFG_debug_convert_to_my_rite: "#D Debug action#!\n#I Click:#! Convert [EmptyScope.ScriptValue('V_kCAFG_debug_conversion_amount')|%0] [GetPlayer.GetFaith.GetName] -> [Faith.GetName]\n#I Right-click:#! Convert [EmptyScope.ScriptValue('V_kCAFG_debug_conversion_amount_high')|%0] [GetPlayer.GetFaith.GetName] -> [Faith.GetName]"
kCAFG_debug_convert_from_my_rite: "#D Debug action#!\n#I Click:#! Convert [EmptyScope.ScriptValue('V_kCAFG_debug_conversion_amount')|%0] [Faith.GetName] -> [GetPlayer.GetFaith.GetName]\n#I Right-click:#! Convert [EmptyScope.ScriptValue('V_kCAFG_debug_conversion_amount_high')|%0] [Faith.GetName] -> [GetPlayer.GetFaith.GetName]"
kCAFG_debug_convert_to_my_culture: "#D Debug action#!\n#I Click:#! Convert [EmptyScope.ScriptValue('V_kCAFG_debug_conversion_amount')|%0] [GetPlayer.GetCulture.GetName] -> [Culture.GetName]\n#I Right-click:#! Convert [EmptyScope.ScriptValue('V_kCAFG_debug_conversion_amount_high')|%0] [GetPlayer.GetCulture.GetName] -> [Culture.GetName]"
