kCAFG_mark_for_debug: "kC&FG - Mark for Debug"
kCAFG_mark_for_debug_desc: "[recipient.GetName] will marked for #D debug purposes#! for the mod #tooltip:kCAFG_mod_name_w_desc_tt #color_goldy_yellow $kCAFG_mod_short_name$#!#!:\n- Displaying #E [Concept('convert_county', 'Conversion')]#!, #E [Concept('promote_culture', 'Promotion')]#! and #E [Concept('accept_culture', 'Acceptance Promotion')]#! Monthly Progress in [barony|E] [culture|E]/[faith|E] Windows."
kCAFG_unmark_for_debug: "kC&FG - Unmark for Debug"

kCAFG_province_rites_debug_info_tt: "#T #D [Province.GetNameNoTooltip] - Debug Info #!#!\n[AddLocalizationIf( And(GetGlobalVariable('kCAFG_debug_marked_char').Char.IsValid, GetGlobalVariable('kCAFG_debug_marked_char').Char.GetCouncillorPosition('councillor_court_chaplain').GetCouncillor.IsValid), 'kCAFG_debug_conversion_multiplier_info_marked')][AddLocalizationIf( Not(And(GetGlobalVariable('kCAFG_debug_marked_char').Char.IsValid, GetGlobalVariable('kCAFG_debug_marked_char').Char.GetCouncillorPosition('councillor_court_chaplain').GetCouncillor.IsValid)), 'kCAFG_debug_conversion_multiplier_info_liege')]"
kCAFG_debug_conversion_multiplier_info_liege: "#S Conversion Monthly Progress For\nTop Liege ([Province.GetTitle.GetDeFactoTopLiege.GetHolder.GetShortUIName]): [GuiScope.SetRoot(Province.MakeScope).AddScope('councillor_liege', Province.GetTitle.GetDeFactoTopLiege.GetHolder.MakeScope).AddScope('councillor', Province.GetTitle.GetDeFactoTopLiege.GetHolder.GetCouncillorPosition('councillor_court_chaplain').GetCouncillor.MakeScope).ScriptValue('V_kCAFG_court_chaplain_conversion_bonuses')|v+=]#!\n[GuiScope.SetRoot(Province.MakeScope).AddScope('councillor_liege', Province.GetTitle.GetDeFactoTopLiege.GetHolder.MakeScope).AddScope('councillor', Province.GetTitle.GetDeFactoTopLiege.GetHolder.GetCouncillorPosition('councillor_court_chaplain').GetCouncillor.MakeScope).GetScriptValueDesc('V_kCAFG_court_chaplain_conversion_bonuses')]"
kCAFG_debug_conversion_multiplier_info_marked: "#S  Conversion Monthly Progress For\nMarked Character ([GetGlobalVariable('kCAFG_debug_marked_char').Char.GetShortUIName]): [GuiScope.SetRoot(Province.MakeScope).AddScope('councillor_liege', GetGlobalVariable('kCAFG_debug_marked_char').Char.MakeScope).AddScope('councillor', GetGlobalVariable('kCAFG_debug_marked_char').Char.GetCouncillorPosition('councillor_court_chaplain').GetCouncillor.MakeScope).ScriptValue('V_kCAFG_court_chaplain_conversion_bonuses')|v+=]#!\n[GuiScope.SetRoot(Province.MakeScope).AddScope('councillor_liege', GetGlobalVariable('kCAFG_debug_marked_char').Char.MakeScope).AddScope('councillor', GetGlobalVariable('kCAFG_debug_marked_char').Char.GetCouncillorPosition('councillor_court_chaplain').GetCouncillor.MakeScope).GetScriptValueDesc('V_kCAFG_court_chaplain_conversion_bonuses')]"

kCAFG_province_rite_debug_info_tt: "#T #D [Faith.GetNameNoTooltip] - Debug Info#!#!\n$kCAFG_debug_conversion_multiplier_info_natural_conversion_mult$"
kCAFG_debug_conversion_multiplier_info_natural_conversion_mult: "#S Natural Conversion Multiplier: [GuiScope.SetRoot(Province.MakeScope).AddScope('kCAFG_converting_rite', Faith.MakeScope).ScriptValue('V_kCAFG_province_rite_conversion_multiplier')|v]#!\n[GuiScope.SetRoot(Province.MakeScope).AddScope('kCAFG_converting_rite', Faith.MakeScope).GetScriptValueDesc('V_kCAFG_province_rite_conversion_multiplier')]"

