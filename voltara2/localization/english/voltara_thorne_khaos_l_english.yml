l_english:
 voltara_thorne_submit_to_khaos:0 "Submit to Khaos"
 voltara_thorne_submit_to_khaos_desc:0 "The Unbound Path brought me beyond the certainties of the imperial court. Now I stand before a final threshold: to offer myself to Khaos and let the Weave remake me.\n\nI will become a Threadbinder, awaken Aetheric power, and receive a magically extended life. This oath is mine to make, and mine to bear."
 voltara_thorne_submit_to_khaos_tooltip:0 "As Thorne Virell, submit to Khaos while following the Unbound Path. Gain Threadbinder, Aetheric, and Magical Lifespan III. Stronger magical longevity is preserved. This decision can be taken once."
 voltara_thorne_submit_to_khaos_confirm:0 "I give myself to Khaos."
