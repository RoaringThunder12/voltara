l_english:
 # Event 1: The Fall of the Capital
 player_escape.0001.t: "The Fall of the Capital"
 player_escape.0001.desc: "#help The heavy wooden doors splinter inward as the vanguard of [attacker_ruler.GetTitledFirstName] breaches the inner keep. Ash fills the air, and the screams of the remaining guards echo through the halls. The time for holding out is over; I must escape or I can say farewell to freedom. #!"
 player_escape.0001.a: "I will cut my way out!"
 player_escape.0001.b: "I know the hidden passages."
 player_escape.0001.c: "Make a run for the stables and pray!"

 # Event 2: The Escape
 player_escape.0002.t: "A Narrow Escape"
 player_escape.0002.desc: "#help The cool night air hits my lungs like water. Behind me, my home burns, casting long shadows into the forest. It was a close, but I have managed to slip through the enemy lines. #!\n\nThey are gone, my liege. We must keep moving.\n\n#help A few loyal guards gather around me in the dark. I am battered and my pride is wounded, but I am free to fight another day. #!"
 player_escape.0002.a: "I will have my revenge."

 # Event 3: The Capture
 player_escape.0003.t: "Taken in Chains"
 player_escape.0003.desc: "#help A heavy gauntlet strikes the back of my head, sending me into the mud. A few soldiers carry me a few feet than I hit the floor again. I'm still concussed as I look up to see [attacker_ruler.GetTitledFirstName] staring down at me with a triumphant sneer. He orders his man: #!\n\n Transport this worm to my dungeon...\n\n#help My fate is now entirely at the hands of [attacker_ruler.GetTitledFirstName]... #!"
 player_escape.0003.a: "Curse you!"

 player_escape_success_prowess_tt: "You will attempt to fight your way out. [prowess|E] challange."
 player_escape_success_intrigue_tt: "You will attempt to slip away unnoticed. [intrigue|E] challange."
 player_escape_success_luck_tt: "Try something spontaneous..."
 player_escape_success_tt: "You successfully escape the siege."