 festa_della_sensa_start_log: "The Festival of the Tides begins, as [CHARACTER.GetTitledFirstName] leads the Western Colonies in honoring its eternal bond with the sea through sacred rituals and grand festivities"
 festa_della_sensa_feast_log_title: "Celebrated with a Feast"
 festa_della_sensa_feast_log: "[CHARACTER.GetTitledFirstName] hosts a grand feast, bringing Chartereds together to honor the Republic’s bond with the sea."
 festa_della_sensa_regatta_log_title: "Celebrated with a Regatta"
 festa_della_sensa_regatta_log: "A magnificent regatta takes place, showcasing the Western Colonies’s maritime prowess and celebrating its dominion over the Western Sea."
 festa_della_sensa_alms_log_title: "Celebration with Distributed Alms"
 festa_della_sensa_alms_log: "[CHARACTER.GetTitledFirstName] distributes alms to the poor, reflecting generosity and uniting the people in celebration."
 festa_della_sensa_modest_log_title: "Celebrated Modestly "
 festa_della_sensa_modest_log: "[CHARACTER.GetTitledFirstName] marks the occasion with a modest celebration, embracing simplicity and dignity."
