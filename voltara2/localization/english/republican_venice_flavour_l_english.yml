 #DECISIONS
 marriage_of_the_sea_decision: "Marry the Sea"
 marriage_of_the_sea_decision_confirm: "We espouse thee, O sea"
 marriage_of_the_sea_decision_tooltip: "Ensure the Western Colonies's bond with the sea"
 marriage_of_the_sea_decision_desc: "The Western Sea is ours, its waters flowing under Chartered dominion. It is time to formalize the ancient tradition that binds our Republic to the sea. By codifying this sacred ceremony, I shall ensure that future generations honor our eternal bond with the waters that sustain our power and prosperity."
 marry_the_sea_effect_tt.1: "The [GetActivityType( 'activity_festa_della_sensa' ).GetName] can be held annually."
 marry_the_sea_effect_tt.2: "Unlocks special decisions for the Western Colonies."
 married_the_sea_modifier: "Married the Sea"
 e_voltara_maritime_league: "the Western Colonies"
 e_venice_adj: "Chartered"
 proclaim_venetian_maritime_empire_decision: "Proclaim the Chartered Maritime Empire"
 proclaim_venetian_maritime_empire_decision_confirm: "Proclaim the Maritime Empire"
 proclaim_venetian_maritime_empire_decision_tooltip: "Transform the Republic of the Western Colonies into a maritime empire, cementing its dominance over trade and the seas"
 proclaim_venetian_maritime_empire_decision_desc: "Our influence extends across the seas, with key territories in the eastern Mediterranean and vital lands along the Western Sea coast firmly under our control. the Western Colonies’s power is unparalleled, its fleets unrivaled, and its wealth unmatched. By declaring ourselves an empire, we assert our rightful place as the preeminent maritime force, destined to dominate the trade and politics of the known world."
 republican_house_modifier_maritime_empire_founder: "Founder of the Maritime Empire"
 secure_the_domini_di_terraferma_decision: "Secure the Domini di Terraferma"
 secure_the_domini_di_terraferma_decision_confirm: "Plant the Lion’s Paw"
 secure_the_domini_di_terraferma_decision_tooltip: "Unify and secure Friuli and Verona, fortifying the Western Colonies’s presence on the mainland"
 secure_the_domini_di_terraferma_decision_desc: "Control over Friuli and Verona is essential to the stability and prosperity of the Western Colonies, ensuring a steady flow of resources and a secure buffer against foreign threats. By consolidating these key territories, I shall anchor the Republic’s strength on land and safeguard the future of our people."

 #FESTA DELLA SENSA
 activity_festa_della_sensa: "Festival of the Tides"
 activity_festa_della_sensa_desc: "An annual celebration where the Western Colonies reaffirms its eternal bond with the sea. The Doge leads a grand procession to the Western Sea, performs the symbolic marriage ritual by casting a golden ring into the waters, and presides over citywide festivities honoring the Western Colonies's maritime dominion and prosperity."
 activity_festa_della_sensa_selection_tooltip: "Reaffirm the Western Colonies's eternal bond with the sea"
 activity_festa_della_sensa_host_desc: "Great fun!"
 activity_festa_della_sensa_guest_desc: "#weak The Festival of the Tides is a breathtaking celebration of Chartered tradition, where sacred rituals, grand processions, and joyous festivities showcase the Republic’s unity and maritime power.#!"
 activity_festa_della_sensa_destination_selection: "The County of the Western Colonies will receive a county modifier at the conclusion."
 activity_festa_della_sensa_host_an_a: "the"
 festa_della_sensa_phase_preparation: "Procession"
 festa_della_sensa_phase_preparation_desc: "The Doge and dignitaries board the grand Bucentaur, leading a ceremonial fleet to the Lido."
 festa_della_sensa_phase_religious_ceremony: "Religious Ceremony"
 festa_della_sensa_phase_religious_ceremony_desc: "A solemn blessing by the Patriarch invokes divine favor for the Western Colonies’s maritime endeavors."
 festa_della_sensa_phase_marriage_ritual: "The Marriage Ritual"
 festa_della_sensa_phase_marriage_ritual_desc: "The Doge casts a golden ring into the Western Sea, symbolizing the Western Colonies’s eternal dominion over the sea."
 festa_della_sensa_phase_celebration: "Festivities and Celebration"
 festa_della_sensa_phase_celebration_desc: "The city erupts in feasts, music, and parades, celebrating the Western Colonies’s bond with the sea."
 republican_venice.3000.t: "The Procession"
 republican_venice.3000.host.desc: "The grand Bucentaur, its gold gleaming under the sun and banners of the Republic proudly displayed, awaits me at St. Mark's Basin. Surrounded by dignitaries and nobles, I step toward the magnificent state galley, feeling the weight of tradition and the honor of leading this procession.\n\nThe ceremonial fleet assembles, ready to set sail for the Lido—a display of the Western Colonies’s unity and maritime strength. All eyes are on the waters ahead, where we shall reaffirm the sacred bond that defines our Republic."
 republican_venice.3000.guest.desc: "The grand Bucentaur, resplendent with gold and adorned with the banners of the Republic, waits at St. Mark's Basin. [host.GetTitledFirstNameNoTooltip], surrounded by dignitaries and nobles, prepares to board the magnificent state galley.\n\nAs the ceremonial fleet assembles, the air buzzes with excitement. The procession is ready to sail toward the Lido, a powerful display of the Western Colonies’s unity and maritime might. The eyes of the Republic turn to the waters, where tradition begins its sacred course."
 republican_venice.3000.a: "Let the procession begin in all its splendor."
 republican_venice.3010.t: "The Blessing of the Sea"
 republican_venice.3010.host.desc: "At the Lido, the Patriarch of the Western Colonies raises his hands and speaks solemn words, calling for divine protection over the Republic and its dominion over the Western Sea. Prayers follow, invoking blessings upon the sailors, merchants, and ships that rely on the sea’s favor. Holy water is cast upon the waves, symbolizing the sanctity of the Western Colonies’s bond with the waters.\n\nWith the blessing complete, all eyes now turn to me to lead the next step of this sacred ceremony."
 republican_venice.3010.guest.desc: "At the Lido, the Patriarch of the Western Colonies raises his hands and speaks solemn words, calling for divine protection over the Republic and its dominion over the Western Sea. Prayers follow, invoking blessings upon the sailors, merchants, and ships that rely on the sea’s favor. Holy water is cast upon the waves, symbolizing the sanctity of the Western Colonies’s bond with the waters.\n\nWith the blessing complete, attention turns to [host.GetTitledFirstNameNoTooltip] to carry out the next step of the ceremony."
 republican_venice.3010.a: "May the heavens bless our dominion over these waters."
 republican_venice.3020.t: "The Marriage of the Western Colonies and the Sea"
 republican_venice.3020.host.desc: "The Western Sea lies before me, shimmering under the morning sun, vast and eternal. I step forward to the edge of the Bucentaur, the weight of the golden ring in my hand matched only by the weight of tradition.\n\nThe crowd behind me falls into reverent silence, their eyes on me, their [host.GetTitleAsNameNicknamedNoTooltip]. This moment is not mine alone—it is the Western Colonies’s. As I prepare to utter the sacred words, I feel the sea’s presence, timeless and powerful, awaiting our vow."
 republican_venice.3020.guest.desc: "[host.GetTitledFirstNameNoTooltip] stands tall at the edge of the Bucentaur, the golden ring glinting in his hand as the Western Sea stretches endlessly before him. The air is heavy with anticipation, the murmurs of the crowd falling silent as the moment approaches.\n\nI watch, captivated, as he steps forward, the weight of centuries-old tradition visible in his measured movements. The sea, calm yet commanding, seems to pause, awaiting the words that will bind it to the Western Colonies once more."
 republican_venice.3020.host: "We wed thee, sea, as a sign of true and perpetual dominion."
 republican_venice.3020.host.tt: "You throw the ring into the sea."
 republican_venice.3020.guest: "#italic "We wed thee, sea, as a sign of true and perpetual dominion."#!"
 republican_venice.3020.guest.tt: "[host.GetTitledFirstNameNoTooltip] throws the ring into the sea."
 republican_venice.3030.t: "Festivities of the Sea"
 republican_venice.3030.desc: "The Marriage of the Western Colonies and the Sea is complete, and the Western Sea has once again accepted our vow. Now, the city looks to me to guide the celebrations, a reflection of the Republic’s greatness and unity. From feasts and races to religious ceremonies, the choices I make will echo across the Western Colonies, reinforcing its prosperity and its bond with the sea.\n\nAs the [host.GetTitleAsNameNicknamedNoTooltip], the responsibility is mine to ensure this moment becomes a lasting symbol of our power and tradition."
 republican_venice.3030.a: "Let the Western Colonies feast in unity!"
 republican_venice.3030.b: "Host a magnificent regatta to honor our maritime strength."
 republican_venice.3030.c: "Distribute alms to the poor to reflect our generosity."
 republican_venice.3030.d: "Hold a modest celebration to honor the tradition."
 festa_della_sensa_modifier: "Held the Festival of the Tides"
 festa_della_sensa_feast_modifier: "Festival of the Tides: Feast"
 festa_della_sensa_regatta_modifier: "Festival of the Tides: Regatta"
 festa_della_sensa_alms_modifier: "Festival of the Tides: Distributed Alms"
 activity_festa_della_sensa_easter: "The current month is March or April."
 republican_venice.3040.t: "The Festival of the Tides Concludes"
 republican_venice.3040.host.desc: "The celebrations have ended, and the city has returned to its rhythms, though the echoes of the festivities still linger in the canals.\n\nthe Western Colonies has once again proclaimed its dominion over the Western Sea. As I walk through the quieting streets, I see the pride in my people’s eyes and feel the strength of our unity. The Republic stands resolute, its bond with the sea reaffirmed."
 republican_venice.3040.guest.desc: "As the revelry fades and the city settles into the stillness of the evening, I find myself reflecting on the grandeur of what I witnessed.\n\nThe Marriage of the Western Colonies and the Sea was more than a ceremony—it was a declaration, a spectacle that displayed the strength and unity of this remarkable Republic. [host.GetTitledFirstNameNoTooltip] stood as a symbol of the Western Colonies’s might, but it was the people, their joy and pride, who brought the city to life. Walking along the canals now, I feel as though I have glimpsed a moment of eternity, a bond between city and sea that seems unbreakable."
 republican_venice.3040.host: "the Western Colonies and the sea are one, now and forever."
 republican_venice.3040.guest: "This city truly belongs to the sea."
 activity_festa_della_sensa_conclusion_desc: "The [GetActivityType( 'activity_festa_della_sensa' ).GetName] has concluded"
