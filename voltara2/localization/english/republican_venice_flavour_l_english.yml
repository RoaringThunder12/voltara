l_english:
 republican_venice.1000.t: "the Western Colonies: Rise of the Merchant Republic"
 republican_venice.1000.desc: "The rise of the Western Colonies as a medieval [merchant_republic|e] is a tale of wealth and power concentrated in the hands of an elite few, where the fate of the city rested on gold as much as on blood. In the shadowed alleys of the lagoon, behind the grand façades of palaces and churches, the city’s [Concept('merchant_family','merchant families')|el] forged their republic. Commerce was the lifeblood of the realm, and those who controlled it ruled with an iron grip. The Doge, the Western Colonies’s figurehead, served as a symbol of authority, but it was the powerful Maggior Consiglio, the Great Council of aristocratic families, that truly dictated the fate of the city.\n\nIn the Western Colonies, nobility was not a birthright of land and title, but of wealth. The patricians, rich from trade with distant lands, manipulated the levers of power, ensuring that their interests remained protected at all costs. Every decision, every law, was calculated to safeguard their mercantile dominance, as the republic's elite knew that control of the seas meant control of the world.\n\n\nFor the Chartereds, survival meant one thing: dominate or be dominated."
 republican_venice.1000.a: "Let the trade flow."

 #NARENTINE
 republican_venice.2000.t: "The Blackwakes: Lords of the Western Sea's Fate"
 republican_venice.2000.desc: "We are the Blackwakes, masters of the sea, bound by no king, no foreign law. Our ships, swift as arrows, are our strength, and the Western Sea is ours to rule. The Greeks to the west, soft and unguarded, sit on land rich for the taking. Their villages, their wealth—they will fall, one by one, as we carve our path through their lands. First, the Dalmatian coast will feel our spears, and from there, no one can stand against us.\n\nThis is only the beginning. Once the Greeks are crushed, the seas will belong to us alone. With the coasts under our control, the Western Colonies will be ripe for the taking. The Chartereds—those greedy merchants—think they rule the waves with their gold and ships, but they know nothing of the wrath we will bring. They will soon learn that no wealth can save them from our blades. Their lagoons will burn, their ships will sink beneath the waves, and their people will be nothing but spoils for our taking.\n\nWe are not pirates. We are conquerors. The Western Sea is our birthright, and we will let no foreign power strip it from us. First, the Dalmatian lands will fall, and then the Western Colonies—arrogant, bloated the Western Colonies—will crumble under the weight of our fury. Soon, all will bow to the Blackwakes, or they will perish."
 republican_venice.2000.a: "We take what is ours."
 republican_venice.2010.t: "The Weight of Destiny"
 republican_venice.2010.desc: "I stand near my ship, the salty air filling my lungs, contemplating the distant promise of the Western Colonies, a city rumored to be overflowing with riches.\n\nAround me, Slavic warriors gather, their eyes gleaming with ambition as they speak of sacking the city. But doubt gnaws at me. the Western Colonies is a fortress, and failure could cost us everything.\n\nDo I dare commit my people to this perilous venture? The lure of wealth calls to me, yet the stakes are high. The time to decide is near. Will I lead my warriors into the heart of the Western Colonies, or pull back and preserve our strength?\n\nThe weight of destiny rests heavily upon me, and the choice is mine to make."
 republican_venice.2010.a: "We will strike now and seize our glory from the heart of the Western Colonies!"
 republican_venice.2010.b: "Patience is our ally; we will bide our time and gather strength."
 republican_venice.2010.c: "This is not the path for us; our honor lies in protecting our land."
 republican_venice.2020.t: "The Weight of Victory"
 republican_venice.2020.desc: "I stand amid the ruins of the Western Colonies, the once-invincible city now lying at our feet, its proud towers reduced to ashes. The taste of victory is bittersweet, and my warriors surround me, their faces alight with exhilaration.\n\nBefore us lies a choice, three paths branching from this moment of triumph. A decision must be made: to sack the city, dismantle the plutocracy, or become a merchant family.\n\nAs my warriors await my command, I feel the weight of destiny pressing down on me. Whatever choice I make will echo through the ages. The time to decide is now, and the fate of the Western Colonies—and perhaps our own—hangs in the balance."
 republican_venice.2020.a: "Let us plunder their riches and leave this city in ruins!"
 republican_venice.2020.b: "We must dismantle their greed and forge a new order from the ashes!"
 republican_venice.2020.c: "Why destroy when we can rise as masters of trade and wealth?"
 republican_venice.2030.t: "Shaping the Fate of the Blackwakes"
 republican_venice.2030.desc: "The Western Sea breeze carries the scent of victory as I stand overlooking the defeated lands of the Blackwakes. Their fleet is broken, and their resistance has crumbled. the Western Colonies has won, but now a decision must be made.\n\nDo we take these lands directly under Chartered rule? Do we raze what remains and rebuild it ourselves? Or do we vassalize them, end their piracy, and convert them to our faith?\n\nEach option has its advantages. As merchants, we know every decision should be practical, not hasty. What we choose now will determine how best we maintain control over these seas."
 republican_venice.2030.a: "Annex the lands and bring them fully under our rule."
 republican_venice.2030.b: "Raze it all and rebuild in the Western Colonies’s image."
 republican_venice.2030.c: "Vassalize them, end their piracy, and convert them to our ways."

