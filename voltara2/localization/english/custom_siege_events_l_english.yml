l_english:
 # Step 1: The Breach
 siege_resolution.0001.t: "The Walls Have Fallen"
 siege_resolution.0001.desc: "#help The gates are breached and the defenders have thrown down their arms. [target_barony.GetName] is entirely at our mercy. My soldiers stand by, weapons drawn and eyes hungry for plunder, awaiting my final command on how to treat the conquered populace. #!"
 siege_resolution.0001.a: "Spare them. We are conquerors, not butchers."
 siege_resolution.0001.b: "Allow limited looting. The men deserve their spoils."
 siege_resolution.0001.c: "Burn it all down. Take everything of value!"

 # Step 2: The Court
 siege_resolution.0002.t: "Into the Keep"
 siege_resolution.0002.desc: "#help I give the order to search the keep... My soldiers push deeper into the fortifications, stepping over the rubble and the dead... Few minutes later one of my generals reports: #!\n\nMy Lord, we have cornered some of the courtiers and servants of the estate. Some might have hid or escaped but the majority is captured by our forces. What fate you plan for them?\n\n#help They cower together, awaiting my judgment... #!"
 siege_resolution.0002.a: "Let them go. They are no threat to us."
 siege_resolution.0002.b: "Slaughter them. Leave none alive to plot revenge."
 siege_resolution.0002.c: "Shackle them all. They belong in my dungeons."

 # Step 3: The Ruler
 siege_resolution.0003.t: "The Cornered Lord"
 siege_resolution.0003.desc: "#help As my generals assess our casualties, my guards drag forth the ruler of the surrounding land. [defeated_ruler.GetTitledFirstName] was trapped during the siege and now grovels at my feet, pleading for mercy. #!\n\nMy Lord, what should we do with your defeated foe?"
 siege_resolution.0003.a: "Your reign ends here. Off with their head!"
 siege_resolution.0003.b: "You are worth more alive. Put them in irons!"