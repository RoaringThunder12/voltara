 vct_chain_charter:0 "Chartered Slave Factors"
 vct_free_charter:0 "Free-Port Patrols"
 vct_chain_prosperity:0 "Ascendant Slave Markets"
 vct_free_prosperity:0 "Prosperous Free Harbors"
 vct_trade_isolation:0 "Excluded from Free Harbors"
 vct_freed_quarter:0 "Freedmen’s Quarter"
 vct_debt_unrest:0 "Debt-Bondage Protests"
 vct_watch:0 "Harbor Watch"
 vct_boycott:0 "Dockworkers’ Boycott"
 vct.11.t:0 "The Convoy Returns"
 vct.11.desc:0 "The factors return with their ledgers and receipts. Buyers in the arenas and estates have paid well. Beyond the harbor, families count those who never returned; another profitable voyage will strengthen the chiefs who promise vengeance."
 vct.11.0:0 "Collect the proceeds."
 vct.11.0_tt:0 "Receive 130 gold, plus 25 with a slave charter and 20 during Chains Ascendant. Slaver influence rises by 5; frontier hostility and Southron resistance increase."
 vct.11.1:0 "Divert the receipts into manumission."
 vct.11.1_tt:0 "Recover 45 gold, free your own enslaved courtiers, and reduce slaver influence by 4."
 vct.12.t:0 "A Convoy Held at the Strait"
 vct.12.desc:0 "Rival toll collectors have detained the ships. The original investment is already spent. Our factors offer a costly settlement, an armed confrontation, or the abandonment of the cargo."
 vct.12.0:0 "Pay the extra toll."
 vct.12.0_tt:0 "Pay 30 gold and recover 95. Slaver influence rises by 2."
 vct.12.1:0 "Force the passage."
 vct.12.1_tt:0 "Equal chances to recover 130 gold or lose the investment. Either outcome raises Kartholos hostility by 5."
 vct.12.2:0 "Abandon the venture."
 vct.12.2_tt:0 "Recover nothing. Slaver influence falls by 2."
 vct.13.t:0 "The Broken Convoy"
 vct.13.desc:0 "Liberators and coastal raiders have scattered the convoy. The factors return without their investment. The trade’s opponents celebrate the loss."
 vct.13.0:0 "We must absorb the loss."
 vct.13.0_tt:0 "No gold is recovered. Slaver influence falls by 4."
 vct.14.t:0 "A Voyage Without Chains"
 vct.14.desc:0 "The voyage returns to a realm whose circumstances have changed. Its old slave-trade commission can no longer be honored. The remaining funds are recovered and the venture is closed."
 vct.14.0:0 "Close the books."
 vct.14.0_tt:0 "Recover 50 gold. No slave-trade dividend or backlash is created."
 vct.20.t:0 "A Name on the Manifest"
 vct.20.desc:0 "A contact has identified [scope:vct_captive.GetFirstName], held by [scope:vct_owner.GetTitledFirstName]. We can purchase their release or attempt a clandestine extraction. A failed operation will not magically free its target."
 vct.20.0:0 "Pay for their release."
 vct.20.0_tt:0 "Transfer 90 gold to the owner, free the captive and welcome them to your court. Gain 100 piety and 75 prestige; slaver influence falls by 4."
 vct.20.1:0 "Send an extraction party."
 vct.20.1_tt:0 "Spend 45 gold. A 65% chance frees the captive and grants the same rewards; failure costs 50 prestige."
 vct.20.2:0 "We cannot reach them yet."
 vct.20.2_tt:0 "No gold is spent and the captive remains enslaved."
 vct.30.t:0 "The Creditors at the Gate"
 vct.30.desc:0 "Creditors demand that unpaid debts be enforced through bondage. Dockworkers warn that more families will disappear into the trade. The dispute concerns the port’s debts, not a new universal law of enslavement."
 vct.30.0:0 "Pay the debts and cancel the bonds."
 vct.30.0_tt:0 "Spend 60 gold, gain 100 piety, and reduce slaver influence by 3."
 vct.30.1:0 "Uphold the factors’ claims."
 vct.30.1_tt:0 "Gain 45 gold; debt protests reduce capital taxes and popular opinion for two years. Increase slave-trade influence and frontier resistance."
 vct.30.2:0 "Order a local moratorium."
 vct.30.2_tt:0 "Lose 50 prestige; slaver influence falls by 1."
 vct.31.t:0 "A Quarter of Their Own"
 vct.31.desc:0 "Freed families seek workshops and homes near the docks. Their proposed quarter would bring new skills to the port, but landowners demand compensation."
 vct.31.0:0 "Grant land and tools."
 vct.31.0_tt:0 "Spend 75 gold. Your capital gains popular opinion and development growth for five years; gain 100 prestige and reduce slaver influence by 3."
 vct.31.1:0 "Fund temporary shelter."
 vct.31.1_tt:0 "Spend 25 gold and establish a Harbor of Refuge for one year. Slaver influence falls by 1."
 vct.31.2:0 "The treasury cannot support this."
 vct.31.2_tt:0 "No resources or situation influence change."
 vct.32.t:0 "Silence on the Docks"
 vct.32.desc:0 "The dockworkers refuse to load another slave convoy. Their stoppage threatens the factors and the arenas alike. The port must decide whether profit or peace matters more."
 vct.32.0:0 "Pay for a settlement."
 vct.32.0_tt:0 "Spend 50 gold and reduce slaver influence by 2."
 vct.32.1:0 "Break the stoppage."
 vct.32.1_tt:0 "Gain 75 prestige, but suffer reduced capital taxes and popular opinion for two years. Slave-trade backlash increases."
 vct.32.2:0 "Suspend the shipments."
 vct.32.2_tt:0 "Lose 1.5 monthly income for one year. Slaver influence falls by 4."
 vct.33.t:0 "Chains Behind the Galleries"
 vct.33.desc:0 "Arena attendants report plans for a mass escape. The fighters are people we actually hold, not an endless supply of nameless replacements. We can free them, improve conditions, or harden the watch."
 vct.33.0:0 "Open the gates."
 vct.33.0_tt:0 "Free every enslaved gladiator you own at court. Gain 150 prestige and reduce slaver influence by 5."
 vct.33.1:0 "Pay for better conditions."
 vct.33.1_tt:0 "Spend 40 gold and gain a six-month arena festival modifier. Their legal status does not change."
 vct.33.2:0 "Double the watch."
 vct.33.2_tt:0 "A funded watch reduces capital tax by 5% for a year; slaver influence rises by 1."
 vct_charter_factors:0 "Charter the Slave Factors"
 vct_charter_factors_desc:0 "Pay 120 gold to charter the factors for five years: +1 monthly income, -5 general opinion, and safer, more profitable convoys. This replaces a free-port charter and strengthens slaver influence and Southron resistance."
 vct_charter_factors_confirm:0 "Charter the Slave Factors"
 vct_free_port:0 "Establish a Free Port"
 vct_free_port_desc:0 "Pay 80 gold to establish five years of patrols: -0.5 monthly income and +1 monthly piety. Replace any slave charter and reduce slaver influence by 5. Annual patrols continue to undermine the trade."
 vct_free_port_confirm:0 "Establish a Free Port"
 vct_rescue:0 "Organize a Liberation Mission"
 vct_rescue_desc:0 "Locate an actual enslaved adult in a participating slaver court. Choose a paid release for 90 gold or a risky extraction for 45 gold. Successful captives become free members of your court."
 vct_rescue_confirm:0 "Organize a Liberation Mission"
 vct_freed_land:0 "Endow a Freedmen’s Quarter"
 vct_freed_land_desc:0 "Spend 75 gold to improve capital popular opinion and development growth for five years, gain 100 prestige, and reduce slaver influence by 3."
 vct_freed_land_confirm:0 "Endow a Freedmen’s Quarter"
