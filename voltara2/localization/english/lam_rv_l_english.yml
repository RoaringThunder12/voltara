l_english:
 lam_rv.0001.t: "The Ultimatum"
 lam_rv.0001.desc: "Everyone who stands with us has gathered. Now it is time to lay our demands before [lam_rv_lord.GetTitledFirstName].\n\nIf our liege accepts, the demand is met. If not, it is war - and everyone who put their name to it fights together."
 lam_rv.0001.send: "Send the ultimatum"
 lam_rv.0001.wait: "Not yet"
 lam_rv.0001.wait_tt: "Gather more first; you can send it later with the decision #high Send the Ultimatum#!."
 lam_rv_send_tt: "Our demands go to our liege. If refused, everyone who put their name to them goes to war together."
 lam_rv_ultimatum_decision: "Send the Ultimatum"
 lam_rv_ultimatum_decision_desc: "In the name of the coalition we gathered, we lay our demands before our liege. Refusal means war."
 lam_rv_ultimatum_decision_tooltip: "Send the ultimatum to your liege"
 lam_rv_ultimatum_decision_confirm: "Send it"
 lam_rv_stall_title: "The vote to rise passed, but no demand could be raised"
 lam_rv_stall_desc: "[ROOT.Char.Custom('LamRvStall')]"
 lam_rv_stall_joined: "You already put your name to another demand. A new one must wait until that is over."
 lam_rv_stall_retry: "You raised a demand within the past year. It is too soon to try again."
 lam_rv_stall_nolaw: "There is no demand to make right now: neither fewer crown rights nor independence can be asked for (crown authority, your liege's rank, a truce or alliance with them, and so on)."
 lam_rv_stall_other: "No demand can be raised right now (a war, another negotiation, or the target has changed)."
 lam_rv_proxy_title: "Another member of the faction will lead the demand"
 lam_rv_mine: " #P (yours)#!"
 lam_rv_op: "  #weak opinion [ROOT.Char.MakeScope.Var('lam_fac_loyal').GetValue|0]#!"
 lam_rv_is_held_tt: "A faction with a stand on this issue has gone to a rising or a war. The issue waits for that outcome"
 lam_rv_cv_rise_text: "#high Motion: [ROOT.Char.Custom('LamPbCouncilDemand')]#!\nApproval authorizes gathering support around those who voted yes. A yes vote commits you to fight if the demand is refused. No votes and abstentions do not authorize participation. Changed targets or conditions cancel the action.[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_legacy: "#high Motion: Rise against the ruler#!\nApproval authorizes an uprising under this government's political rules.[ROOT.Char.Custom('LamCvRiseClaimant')]"
 lam_rv_cv_rise_claimant: "\n\n#high Claimant for this demand:#! [ROOT.Char.MakeScope.Var('lam_wc_plan_candidate').Char.GetShortUIName]"
 NOT_lam_cv_call_retry_tt: "This agenda was put recently; it can be put again after six months"
 NOT_lam_cv_committed_tt: "The faction is tied up in a war or in a coalition against the liege"
 NOT_lam_cv_no_seat_tt: "Nobody can take a council seat"
 NOT_lam_fac_back_heir_locked_tt: "A deal with the lord binds whom we back"
 NOT_lam_fac_head_posture_cd_tt: "Less than half a year since the last change of course"
 NOT_lam_fac_rise_blocked_tt: "Still barred from factions (after a lost war, etc.)"
 NOT_lam_fac_rise_cause_tt: "No cause to rise: it takes the faction's grievance, the lord's disfavour (favour -20 or less), or a ban on factions"
 NOT_lam_fac_rise_cd_tt: "Rose recently (no new rising for 5 years after a rising, 3 after one was voted down)"
 NOT_lam_pt_head_available_tt: "The head cannot act now (underage or imprisoned, or a council, petition or negotiation is under way)"
 lam_rv_tip_head: "#weak Faction#! [ROOT.Char.Custom('LamFacName')] #weak head#![ROOT.Char.Custom('LamUx2Mine')]\n"
 lam_rv_tip_member: "#weak Faction#! [ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamFacName')][ROOT.Char.MakeScope.Var('lam_bloc').Char.Custom('LamUx2Mine')]\n"
 lam_rv_conf_recent_tt: "No vote of confidence in the past five years"
 lam_rv_conf_busy_tt: "The faction is not in council or awaiting the liege's answer"
 lam_rv_cp_lost_title: "A faction in [lam_rv_cp_lord.GetShortUINamePossessive] court has seized power. My strings are cut"
