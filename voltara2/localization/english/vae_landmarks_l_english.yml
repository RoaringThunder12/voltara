l_english:
 building_type_vae_site_0_01:0 "Hall of Ancestors"
 building_type_vae_site_0_01_desc:0 "Skarrvalis preserves the names of Giant houses in immense stone chambers. Its custodians interpret descent as a duty of care toward their smaller human kin."
 building_vae_site_0_01:0 "Hall of Ancestors"
 building_vae_site_0_01_desc:0 "Skarrvalis preserves the names of Giant houses in immense stone chambers. Its custodians interpret descent as a duty of care toward their smaller human kin."
 building_type_vae_site_1_01:0 "The Sevenfold Aqueduct"
 building_type_vae_site_1_01_desc:0 "Seven channels carry mountain water through dry country. Maintenance is a sacred obligation shared by rival temples and irrigation courts."
 building_vae_site_1_01:0 "The Sevenfold Aqueduct"
 building_vae_site_1_01_desc:0 "Seven channels carry mountain water through dry country. Maintenance is a sacred obligation shared by rival temples and irrigation courts."
 building_type_vae_site_2_01:0 "Archive of the First Small Kings"
 building_type_vae_site_2_01_desc:0 "Clay and bronze records preserve the first human dynasties after the Sundering, when the children of Giants established their own courts."
 building_vae_site_2_01:0 "Archive of the First Small Kings"
 building_vae_site_2_01_desc:0 "Clay and bronze records preserve the first human dynasties after the Sundering, when the children of Giants established their own courts."
 building_type_vae_site_3_01:0 "The Saffron Observatory"
 building_type_vae_site_3_01_desc:0 "Generations of astronomers compare stellar motions with the measured flow of the Weave, guarding records older than Severos."
 building_vae_site_3_01:0 "The Saffron Observatory"
 building_vae_site_3_01_desc:0 "Generations of astronomers compare stellar motions with the measured flow of the Weave, guarding records older than Severos."
 building_type_vae_site_4_01:0 "The Tal’Ruun Causeway"
 building_type_vae_site_4_01_desc:0 "A monumental crossing follows a fossilized Titan limb. Giant engineers preserve the old structure while human guilds maintain the road across it."
 building_vae_site_4_01:0 "The Tal’Ruun Causeway"
 building_vae_site_4_01_desc:0 "A monumental crossing follows a fossilized Titan limb. Giant engineers preserve the old structure while human guilds maintain the road across it."
 building_type_vae_site_5_01:0 "Gardens of Namarai"
 building_type_vae_site_5_01_desc:0 "Terraced jungle gardens hold medicinal plants and sacred groves above the river. Their keepers recognize neither royal pedigree nor size as proof of wisdom."
 building_vae_site_5_01:0 "Gardens of Namarai"
 building_vae_site_5_01_desc:0 "Terraced jungle gardens hold medicinal plants and sacred groves above the river. Their keepers recognize neither royal pedigree nor size as proof of wisdom."
 building_type_vae_site_6_01:0 "The Bronze Witness Court"
 building_type_vae_site_6_01_desc:0 "Judges receive testimony beneath bronze ancestral masks. The Saffron Testament binds ruler and subject to the same witnessed compact."
 building_vae_site_6_01:0 "The Bronze Witness Court"
 building_vae_site_6_01_desc:0 "Judges receive testimony beneath bronze ancestral masks. The Saffron Testament binds ruler and subject to the same witnessed compact."
 building_type_vae_site_7_01:0 "The Sky-Bracer’s Rib"
 building_type_vae_site_7_01_desc:0 "A fossilized Titan rib rises above the settlement. Its surrounding Weave remains unusually steady, attracting pilgrims and cautious Threadbinders."
 building_vae_site_7_01:0 "The Sky-Bracer’s Rib"
 building_vae_site_7_01_desc:0 "A fossilized Titan rib rises above the settlement. Its surrounding Weave remains unusually steady, attracting pilgrims and cautious Threadbinders."
 building_type_vae_site_8_01:0 "The Thousand-Step Cistern"
 building_type_vae_site_8_01_desc:0 "An ancient stepped reservoir supports neighborhoods built across centuries. Its sluices bear both Giant masonry and human hydraulic inscriptions."
 building_vae_site_8_01:0 "The Thousand-Step Cistern"
 building_vae_site_8_01_desc:0 "An ancient stepped reservoir supports neighborhoods built across centuries. Its sluices bear both Giant masonry and human hydraulic inscriptions."
 building_type_vae_site_9_01:0 "The Emerald Canopy Sanctuary"
 building_type_vae_site_9_01_desc:0 "A temple grown around immense jungle trees shelters disputing clans under a seasonal truce. Rootbound priests protect its living archives."
 building_vae_site_9_01:0 "The Emerald Canopy Sanctuary"
 building_vae_site_9_01_desc:0 "A temple grown around immense jungle trees shelters disputing clans under a seasonal truce. Rootbound priests protect its living archives."
 building_type_vae_site_10_01:0 "The Basalt Listening Hall"
 building_type_vae_site_10_01_desc:0 "Giant archivists preserve songs of stone in resonant chambers. The hall records inherited memory; its keepers do not claim to have personally witnessed the Sundering."
 building_vae_site_10_01:0 "The Basalt Listening Hall"
 building_vae_site_10_01_desc:0 "Giant archivists preserve songs of stone in resonant chambers. The hall records inherited memory; its keepers do not claim to have personally witnessed the Sundering."
 building_type_vae_site_11_01:0 "The House of Measured Threads"
 building_type_vae_site_11_01_desc:0 "Deep Elf scholars teach disciplined Threadbinding, recording the atrophy suffered by those who draw too deeply from the Weave."
 building_vae_site_11_01:0 "The House of Measured Threads"
 building_vae_site_11_01_desc:0 "Deep Elf scholars teach disciplined Threadbinding, recording the atrophy suffered by those who draw too deeply from the Weave."
 building_type_vae_site_12_01:0 "The Pearl Exchange"
 building_type_vae_site_12_01_desc:0 "Old seaborne trade routes converge beneath vaulted halls, where merchants reckon debts in weights standardized before the Severosi conquests."
 building_vae_site_12_01:0 "The Pearl Exchange"
 building_vae_site_12_01_desc:0 "Old seaborne trade routes converge beneath vaulted halls, where merchants reckon debts in weights standardized before the Severosi conquests."
 building_type_vae_site_13_01:0 "The Ancestral Terraces"
 building_type_vae_site_13_01_desc:0 "Human farmers and Giant engineers maintain terraces cut into the foothills. The oldest retaining stones predate every surviving royal genealogy."
 building_vae_site_13_01:0 "The Ancestral Terraces"
 building_vae_site_13_01_desc:0 "Human farmers and Giant engineers maintain terraces cut into the foothills. The oldest retaining stones predate every surviving royal genealogy."
 building_type_vae_site_14_01:0 "The Nethral Glass Archive"
 building_type_vae_site_14_01_desc:0 "An independent Deep Elf sanctuary preserves instruments and manuscripts rescued from the ancient Elven towers. Its mages advise surrounding courts without surrendering the enclave’s sovereignty."
