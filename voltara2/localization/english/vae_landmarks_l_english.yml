 building_type_vae_site_17_01:0 "The Glassroot Library"
 building_type_vae_site_17_01_desc:0 "An ancient Elven complex lies broken beneath Aesaryos’s returning vegetation. Sealed chambers retain damaged Weave instruments and fragments of pre-Sundering knowledge. Exploration may recover relics, but restoration requires wealth and careful scholarship."
