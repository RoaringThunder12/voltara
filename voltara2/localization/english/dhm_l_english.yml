 dhm_steady_lessons_modifier:0 "Steady Lessons"
 dhm_steady_lessons_modifier_desc:0 "A settled schoolroom and a clear course of study sharpen the mind."
 dhm_disrupted_lessons_modifier:0 "Disrupted Lessons"
 dhm_disrupted_lessons_modifier_desc:0 "A change of tutor has broken the rhythm of study for a time."
 dhm_commended_scholar_modifier:0 "Commended Scholar"
 dhm_commended_scholar_modifier_desc:0 "Praise for careful study has brought confidence and standing."
 dhm_honored_tutor_modifier:0 "Honored Tutor"
 dhm_honored_tutor_modifier_desc:0 "The household openly rewarded years of patient instruction."
 dhm_household_settlement_modifier:0 "A Generous Marriage Settlement"
 dhm_household_settlement_modifier_desc:0 "Other courts remember that this house sent silver with its promises."
 dhm_sworn_household_pledge_modifier:0 "Honor Pledged Before the Court"
 dhm_sworn_household_pledge_modifier_desc:0 "A public promise has made every future word carry greater weight—and greater risk."
 dhm_established_household_modifier:0 "A Well-Founded Household"
 dhm_established_household_modifier_desc:0 "A furnished hearth and timely counsel have eased the first years of married life."
 dhm_household_left_unsupported_modifier:0 "Left to Quarrel"
 dhm_household_left_unsupported_modifier_desc:0 "Early disagreements were left to harden without help from the wider family."
 dhm_anniversary_warmth_modifier:0 "Anniversary Warmth"
 dhm_anniversary_warmth_modifier_desc:0 "A remembered vow has renewed affection and eased the burdens of the household."
 dhm_dynastic_celebration_modifier:0 "A House in Celebration"
 dhm_dynastic_celebration_modifier_desc:0 "Bells, open tables and a welcomed child have made the dynasty's good fortune public."
 dhm_family_shelter_modifier:0 "Sheltered by Family"
 dhm_family_shelter_modifier_desc:0 "Material help and familiar company have made grief a little easier to bear."
 dhm_council_succession_modifier:0 "Council Focus: Succession"
 dhm_council_succession_modifier_desc:0 "For this year, the household gives first attention to spouses, children and continuity."
 dhm_council_alliance_modifier:0 "Council Focus: Alliances"
 dhm_council_alliance_modifier_desc:0 "For this year, letters and marriage talks are shaped toward friendship between courts."
 dhm_council_education_modifier:0 "Council Focus: Education"
 dhm_council_education_modifier_desc:0 "For this year, the schoolroom and the next generation receive special attention."
 dhm_council_balanced_modifier:0 "Council Focus: Balanced Stewardship"
 dhm_council_balanced_modifier_desc:0 "For this year, no household duty is permitted to swallow all the rest."

 # v0.4.0 — Living Family
 dhm_manager.0001.chronicle:0 "@skill_learning_icon!  Open the Household Chronicle"
 dhm_manager.0001.stories:0 "@dynasty_prestige_icon!  Set Story Frequency"

 dhm_living_family.0100.t:0 "A Letter from Distant Kin"
 dhm_living_family.0100.opening:0 "To [ROOT.Char.GetFirstNameNoTooltip],"
 dhm_living_family.0100.desc.resentful:0 "I write because we are kin. Old hurts remain, and your silence has not eased them. If you still count me as family, answer me plainly."
 dhm_living_family.0100.desc.weary:0 "Life here is not cruel, but it is not home. I miss familiar voices and the warmth of our hall. Send me word of the family."
 dhm_living_family.0100.desc.ambitious:0 "I have earned a place at this court, though I mean to rise higher. Send me news from home, especially news that may help me."
 dhm_living_family.0100.desc.content:0 "We are on good terms here, and I am grateful for it. Still, I think of home often. Tell me how the family fares."
 dhm_living_family.0100.desc.default:0 "There is much to keep me occupied here, yet I still miss the familiar voices at home. How are our kin?"
 dhm_living_family.0100.desc.familiar:0 "\n\nThey share our faith and customs here. That has made my new life easier."
 dhm_living_family.0100.desc.new_faith:0 "\n\nTheir prayers differ from ours. I show respect, but I will not forget my own faith."
 dhm_living_family.0100.desc.new_customs:0 "\n\nTheir customs are strange to me. I am learning them, though mistakes are not always forgiven."
 dhm_living_family.0100.a:0 "Send Silver and a Warm Reply"
 dhm_living_family.0100.b:0 "Write Back at Once"
 dhm_living_family.0100.c:0 "Leave the Letter Unanswered"

 dhm_living_family.0110.t:0 "Another Letter Arrives"
 dhm_living_family.0110.opening:0 "To [ROOT.Char.GetFirstNameNoTooltip],"
 dhm_living_family.0110.desc.aid:0 "Your silver repaired the roof and paid the servants. More than that, it proved I had not been forgotten. You have my thanks."
 dhm_living_family.0110.desc.counsel:0 "Your letter gave me courage. I did not follow every word, but I no longer faced the matter alone. Things are better now."
 dhm_living_family.0110.desc.distant:0 "This place no longer feels so strange. I still miss home, but I am at peace here."
 dhm_living_family.0110.a:0 "I Am Glad to Hear It"
 dhm_outcome_will_return_tt:0 "You may hear more about this matter later. The outcome will depend on your choice and whether those involved are still available."

 dhm_living_family.0200.t:0 "A Disputed Lesson"
 dhm_living_family.0200.desc.opening:0 "A slate lies broken on the schoolroom floor. [dhm_story_child.GetShortUIName] and [dhm_story_tutor.GetShortUIName] are arguing over the day's lesson. Both ask you to judge."
 dhm_living_family.0200.desc.opening.diplomacy:0 "Two rival guests must share your table. [dhm_story_tutor.GetShortUIName] asks the child to practise a courteous welcome. [dhm_story_child.GetShortUIName] would rather hear what each guest is angry about first."
 dhm_living_family.0200.desc.opening.martial:0 "Wooden soldiers stand beside a river drawn on parchment. [dhm_story_tutor.GetShortUIName] asks for a quick crossing. [dhm_story_child.GetShortUIName] wants to send scouts: 'What if someone is waiting on the other bank?'"
 dhm_living_family.0200.desc.opening.stewardship:0 "[dhm_story_tutor.GetShortUIName] has brought an exercise in household expenses. [dhm_story_child.GetShortUIName] will not agree to delay the servants' wages. 'They have done the work. Surely they should be paid?'"
 dhm_living_family.0200.desc.opening.intrigue:0 "A sealed letter is the subject of today's lesson. [dhm_story_tutor.GetShortUIName] wants the child to study the seal. [dhm_story_child.GetShortUIName] wants to question the messenger before trusting a word of it."
 dhm_living_family.0200.desc.opening.learning:0 "[dhm_story_tutor.GetShortUIName] has set a passage from an old book. [dhm_story_child.GetShortUIName] questions its answer. What began as a lesson has turned into an argument."
 dhm_living_family.0200.desc.diligent:0 "\n\n'I did the work,' [dhm_story_child.GetFirstNameNoTooltip] says. 'I only wanted to understand it.'"
 dhm_living_family.0200.desc.stubborn:0 "\n\n‘I will learn it when it makes sense,’ [dhm_story_child.GetFirstNameNoTooltip] says. ‘Repeating it does not make it wise.’"
 dhm_living_family.0200.desc.shy:0 "\n\n[dhm_story_child.GetFirstNameNoTooltip] falls quiet when you ask what happened. After some coaxing, [dhm_story_child.GetSheHe] shows you the part of the lesson that caused the disagreement."
 dhm_living_family.0200.desc.ambitious:0 "\n\n‘Teach me what a ruler truly needs,’ [dhm_story_child.GetFirstNameNoTooltip] says. ‘I want more than praise for sitting still.’"
 dhm_living_family.0200.desc.lazy:0 "\n\n‘This will take all afternoon,’ [dhm_story_child.GetFirstNameNoTooltip] complains. ‘Surely some lessons are not worth the trouble.’"
 dhm_living_family.0200.desc.default:0 "\n\n'I was trying to get it right,' [dhm_story_child.GetFirstNameNoTooltip] says, looking from you to the tutor."
 dhm_living_family.0200.tutor.patient:0 "\n\n'There is more than one way to teach this,' the tutor admits. 'But we must finish the lesson.'"
 dhm_living_family.0200.tutor.wrathful:0 "\n\nThe tutor grips a broken stylus. ‘The child must learn that defiance has a price.’"
 dhm_living_family.0200.tutor.callous:0 "\n\nThe tutor speaks calmly. ‘Understanding is useful, my liege. Obedience is necessary.’"
 dhm_living_family.0200.tutor.default:0 "\n\nThe tutor turns to you. 'Shall we try the child's approach, or continue with mine?'"
 dhm_living_family.0200.a:0 "Let the Child Question the Passage."
 dhm_living_family.0200.b:0 "Have the Child Explain the Author's Argument First."
 dhm_living_family.0200.c:0 "Tutor, Compare the Accounts and Settle the Question."

 dhm_living_family.0210.t:0 "The Lesson Remembered"
 dhm_living_family.0210.desc.breakthrough:0 "[dhm_story_child.GetShortUIName] brings the finished work. This time, [dhm_story_tutor.GetFirstName] has little to correct.\n\n'It took practice,' the tutor says. The child smiles. 'And fewer arguments.'"
 dhm_living_family.0210.desc.resentment:0 "[dhm_story_child.GetShortUIName] learned the words, but not trust. When [dhm_story_tutor.GetShortUIName] enters, the child grows silent. Obedience was won at a cost."
 dhm_living_family.0210.desc.grown:0 "The schoolroom quarrel is long past. I would need a clearer account before judging what followed."
 dhm_living_family.0210.a:0 "The Matter Is Settled"
 dhm_living_family.0210.reward:0 "You Both Worked for This. Let That Be Known."
 dhm_living_family.0210.repair:0 "Let Us Begin Again, Without the Scolding."
 dhm_living_family.0210.grown:0 "Let Them Carry the Lesson Forward"

 dhm_living_family.0300.t:0 "Trouble at the Hearth"
 dhm_living_family.0300.desc.warm:0 "You expect a quarrel, but hear some laughter. [dhm_story_relative.GetShortUIName] and [dhm_story_spouse.GetShortUIName] disagree over the household accounts, yet affection remains between them."
 dhm_living_family.0300.desc.cold:0 "The servants keep away. [dhm_story_relative.GetShortUIName] and [dhm_story_spouse.GetShortUIName] speak politely, but the anger beneath their words is plain."
 dhm_living_family.0300.desc.measured:0 "No one shouts. [dhm_story_relative.GetShortUIName] and [dhm_story_spouse.GetShortUIName] simply repeat the same argument and no longer listen to each other."
 dhm_living_family.0300.desc.faith:0 "\n\nThey cannot agree which rites and holy days should guide their household."
 dhm_living_family.0300.desc.culture:0 "\n\nThey disagree over guests, language, and the customs their household should follow."
 dhm_living_family.0300.desc.shared:0 "\n\nThey share faith and custom. Pride, not tradition, now drives the quarrel."
 dhm_living_family.0300.a:0 "Sit Down. We Will Settle This Together"
 dhm_living_family.0300.b:0 "Send Silver to Ease Their Burden"
 dhm_living_family.0300.c:0 "Leave Them to Govern Their Own Marriage"

 dhm_living_family.0310.t:0 "Peace at the Hearth"
 dhm_living_family.0310.desc.reconciled:0 "[dhm_story_relative.GetFirstName] and [dhm_story_spouse.GetFirstName] have kept the peace they promised. They still have disagreements, but no longer send every one to your door.\n\n'We can speak to each other now,' [dhm_story_relative.GetFirstName] says. 'That has helped more than we expected.'"
 dhm_living_family.0310.desc.established:0 "Your silver paid debts and repaired the household. With worry eased, affection returned."
 dhm_living_family.0310.desc.independent:0 "Left alone, [dhm_story_relative.GetShortUIName] and [dhm_story_spouse.GetShortUIName] made their own peace. They value it because it was their choice."
 dhm_living_family.0310.desc.unsettled:0 "The quarrel did not worsen, but it did not heal. They remain together, though the household is still uneasy."
 dhm_living_family.0310.a:0 "May Their Hearth Stay Warm"
 dhm_living_family.0310.rejoice:0 "Let the Household Share Their Good Fortune"
 dhm_living_family.0310.repair:0 "Send Aid and Bring Them Back to the Table"
 dhm_living_family.0310.wait:0 "They Must Find Their Own Peace"

 dhm_living_family.0400.t:0 "A Family Quarrel"
 dhm_living_family.0400.desc.opening:0 "[dhm_dispute_first.GetShortUIName] and [dhm_dispute_second.GetShortUIName] accuse each other over missing silver. Old family grievances soon enter the argument."
 dhm_living_family.0400.desc.opening.inheritance:0 "A dead kinsman's goods have been divided, but both claim the better share was promised to them. One trusts memory. The other brings a sealed list and witnesses."
 dhm_living_family.0400.desc.opening.hospitality:0 "One relative was refused a place at the family table. [dhm_dispute_first.GetShortUIName] calls it a grave insult. [dhm_dispute_second.GetShortUIName] calls it a mistake."
 dhm_living_family.0400.desc.wrathful:0 "\n\n[dhm_dispute_first.GetFirstNameNoTooltip] strikes the table. ‘This is no small mistake. I have been wronged for years!’"
 dhm_living_family.0400.desc.stubborn:0 "\n\n[dhm_dispute_second.GetFirstNameNoTooltip] stands firm. ‘I will repay what I owe, but I will not confess to a lie.’"
 dhm_living_family.0400.desc.forgiving:0 "\n\n[dhm_dispute_first.GetFirstNameNoTooltip] lowers [dhm_dispute_first.GetHerHis] voice. ‘I do not seek punishment. I want the truth from my own kin.’"
 dhm_living_family.0400.desc.default:0 "\n\nBoth have witnesses. Both tell a different tale. They ask you for judgment."
 dhm_living_family.0400.a:0 "We Will Hear Both Sides"
 dhm_living_family.0400.b:0 "[dhm_dispute_first.GetFirstNameNoTooltip] Is in the Right"
 dhm_living_family.0400.c:0 "[dhm_dispute_second.GetFirstNameNoTooltip] Was Wronged"
 dhm_living_family.0400.d:0 "I Will Not Judge This Quarrel"

 dhm_living_family.0410.t:0 "The Quarrel Remembered"
 dhm_living_family.0410.desc.reconciled:0 "[dhm_dispute_first.GetFirstName] and [dhm_dispute_second.GetFirstName] arrive together.\n\n'We still disagree about a few things,' the first admits. 'But that quarrel is finished.' For once, the other does not object."
 dhm_living_family.0410.desc.grievance:0 "The dispute is no longer spoken of before you, but both still remember it. Invitations are missed, seats are changed, and the family remains divided."
 dhm_living_family.0410.desc.faded:0 "Time has weakened the old quarrel. There was no apology, but the family has learned to live with the memory."
 dhm_living_family.0410.a:0 "So the Family Remembers"
 dhm_living_family.0410.celebrate:0 "Good. Let the Matter Rest."
 dhm_living_family.0410.settle:0 "Pay What Is Owed and End This Division"
 dhm_living_family.0410.endure:0 "My Judgment Stands"
 dhm_living_family.0410.faded:0 "Let the Old Quarrel Rest"

 dhm_living_family.0500.t:0 "A Voice in the Match"
 dhm_living_family.0500.desc.opening:0 "[dhm_story_relative.GetShortUIName] asks the servants to leave. ‘Before you arrange my marriage, my liege, hear what I ask.’"
 dhm_living_family.0500.desc.romantic:0 "\n\n‘Find me a spouse with kindness. Rank and alliance matter, but I must live beside this person.’"
 dhm_living_family.0500.desc.zealous:0 "\n\n‘Do not marry me into a house that mocks my faith. I could find no peace there.’"
 dhm_living_family.0500.desc.ambitious:0 "\n\n‘If I marry for the family, choose a match that gives me standing and purpose.’"
 dhm_living_family.0500.desc.shy:0 "\n\n‘Please,’ [dhm_story_relative.GetFirstNameNoTooltip] says, ‘let me meet them before the family decides for me.’"
 dhm_living_family.0500.desc.default:0 "\n\n‘I know the house has needs, but I must live with this person. Let me speak before the bargain is made.’"
 dhm_living_family.0500.a:0 "Seek a Kind and Suitable Spouse"
 dhm_living_family.0500.b:0 "Let Faith and Custom Guide the Match"
 dhm_living_family.0500.c:0 "Ask Before Accepting Any Match"
 dhm_living_family.0500.d:0 "Wait Two Years"

 dhm_living_family.0600.t:0 "Two Customs at One Table"
 dhm_living_family.0600.desc.opening:0 "The household gathers to honor [dhm_ceremony_relative.GetShortUIName]. The musicians are ready, but the elders cannot agree which custom should come first."
 dhm_living_family.0600.desc.shared:0 "\n\nMost guests know the same words and gestures. A familiar ceremony will cause little offense."
 dhm_living_family.0600.desc.faith:0 "\n\n[dhm_ceremony_relative.GetFirstNameNoTooltip] follows [dhm_ceremony_relative.GetFaith.GetName]. [dhm_ceremony_relative.GetSheHe|U] hopes the ceremony will respect that faith."
 dhm_living_family.0600.desc.culture:0 "\n\n[dhm_ceremony_relative.GetFirstNameNoTooltip] follows [dhm_ceremony_relative.GetCulture.GetName] customs. Small courtesies will show whether [dhm_ceremony_relative.GetSheHe] is truly welcome."
 dhm_living_family.0600.a:0 "Honor [dhm_ceremony_relative.GetFirstNameNoTooltip] in [dhm_ceremony_relative.GetHerHis] Own Custom"
 dhm_living_family.0600.b:0 "Keep Our Custom and Welcome Every Guest"
 dhm_living_family.0600.c:0 "Set Ceremony Aside. Let Us Share Bread"

 dhm_living_family.0800.t:0 "The Household Chronicle"
 dhm_living_family.0800.desc:0 "The chronicler turns pages smelling of lamp smoke and drying ink. These are not battles or coronations, but the smaller decisions by which a family learns what sort of house it is.\n\n#bold Since the Chronicle Began#!\nLetters received: #V [ROOT.Char.MakeScope.Var('dhm_chronicle_letters').GetValue|0]#!\nSchoolroom turning points: #V [ROOT.Char.MakeScope.Var('dhm_chronicle_education_stories').GetValue|0]#!\nMarried households counseled: #V [ROOT.Char.MakeScope.Var('dhm_chronicle_marriage_stories').GetValue|0]#!\nMarriage wishes heard: #V [ROOT.Char.MakeScope.Var('dhm_chronicle_marriage_wishes').GetValue|0]#!\nFamily disputes heard: #V [ROOT.Char.MakeScope.Var('dhm_chronicle_disputes').GetValue|0]#!\nReconciliations: #P [ROOT.Char.MakeScope.Var('dhm_chronicle_reconciliations').GetValue|0]#!\nHousehold ceremonies: #V [ROOT.Char.MakeScope.Var('dhm_chronicle_ceremonies').GetValue|0]#!\n\n#bold Reputation Marks#!\nGenerous: #V [ROOT.Char.MakeScope.Var('dhm_rep_generous').GetValue|0]#!  |  Stern: #V [ROOT.Char.MakeScope.Var('dhm_rep_strict').GetValue|0]#!\nProtective: #V [ROOT.Char.MakeScope.Var('dhm_rep_guardian').GetValue|0]#!  |  Traditional: #V [ROOT.Char.MakeScope.Var('dhm_rep_traditional').GetValue|0]#!"
 dhm_living_family.0800.rep.generous:0 "\n\n#P A Generous House#! — Kin know that this house gives aid freely."
 dhm_living_family.0800.rep.guardian:0 "\n\n#P A Sheltering House#! — Kin look to this house for counsel and protection."
 dhm_living_family.0800.rep.traditional:0 "\n\n#P A House of Custom#! — Old duties and household traditions are honored here."
 dhm_living_family.0800.rep.strict:0 "\n\n#high A Stern House#! — Your word is obeyed, though it is not always loved."
 dhm_living_family.0800.rep.new:0 "\n\n#weak Your house has not yet earned a clear reputation.#!"
 dhm_living_family.0800.a:0 "Back to Chronicle & Stories"
 dhm_living_family.0800.b:0 "Close the Book"

 dhm_living_family.0900.t:0 "The Pace of Household Life"
 dhm_living_family.0900.desc:0 "Choose the minimum gap between new family stories. Eligibility is checked yearly. Births, marriage matters and stories already under way keep their own timing. This changes frequency, not which saga families are enabled."
 dhm_living_family.0900.status.off:0 "\n\nCurrent pace: #N Off#! — no optional living-family stories"
 dhm_living_family.0900.status.quiet:0 "\n\nCurrent pace: #P Quiet#! — roughly one story every two and a half years"
 dhm_living_family.0900.status.balanced:0 "\n\nCurrent pace: #P Balanced#! — roughly one story every year and a half"
 dhm_living_family.0900.status.lively:0 "\n\nCurrent pace: #high Lively#! — roughly one story every nine months"
 dhm_living_family.0900.quiet:0 "Quiet Household"
 dhm_living_family.0900.balanced:0 "Balanced Household"
 dhm_living_family.0900.lively:0 "Lively Household"
 dhm_living_family.0900.off:0 "Disable Optional Household Stories"
 dhm_living_family.0900.back:0 "Back to Chronicle & Stories"

 dhm_council.0001.annual_report:0 "\n\n#bold This Year in the Household#!\nLetters from kin: #V [ROOT.Char.MakeScope.Var('dhm_report_year_letters').GetValue|0]#!\nSchoolroom matters: #V [ROOT.Char.MakeScope.Var('dhm_report_year_education').GetValue|0]#!\nMarried households advised: #V [ROOT.Char.MakeScope.Var('dhm_report_year_marriages').GetValue|0]#!\nMarriage wishes heard: #V [ROOT.Char.MakeScope.Var('dhm_report_year_wishes').GetValue|0]#!\nFamily disputes: #V [ROOT.Char.MakeScope.Var('dhm_report_year_disputes').GetValue|0]#!\nReconciliations: #P [ROOT.Char.MakeScope.Var('dhm_report_year_reconciliations').GetValue|0]#!\nHousehold ceremonies: #V [ROOT.Char.MakeScope.Var('dhm_report_year_ceremonies').GetValue|0]#!"

