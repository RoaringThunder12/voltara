 dhm_manager.dashboard.kin_avoid:0 "@dynasty_prestige_icon! Kin #high AVOID CLOSE#!"
 dhm_manager.dashboard.kin_prefer:0 "@dynasty_prestige_icon! Kin #P PREFER LEGAL#!"
 dhm_manager.dashboard.courtier_automatic:0 "   #weak |#!   @skill_stewardship_icon! Court #P AUTOMATIC#!"
 dhm_manager.dashboard.courtier_assisted:0 "   #weak |#!   @skill_stewardship_icon! Court #high ASSISTED#!"
 dhm_manager.dashboard.courtier_off:0 "   #weak |#!   @skill_stewardship_icon! Court #N OFF#!"
 dhm_manager.status.education_enabled:0 "\n@skill_learning_icon! Education: #P Automatic#!"
 dhm_manager.status.education_disabled:0 "\n@skill_learning_icon! Education: #N Disabled#!"
 dhm_manager.status.marriage_manual:0 "\n@arrange_marriage_icon! Marriage: #high Manual#!"
 dhm_manager.status.marriage_assisted:0 "\n@arrange_marriage_icon! Marriage: #P Assisted#!"
 dhm_manager.status.marriage_full_auto:0 "\n@arrange_marriage_icon! Marriage: #P Full Automatic#!"
 dhm_manager.status.kin_follow_faith:0 "\n@dynasty_prestige_icon! Kin Policy: #P Follow Faith#!"
 dhm_manager.status.kin_avoid:0 "\n@dynasty_prestige_icon! Kin Policy: #high Avoid Close Kin#!"
 dhm_manager.status.kin_prefer:0 "\n@dynasty_prestige_icon! Kin Policy: #P Prefer Legal Kin#!"
 dhm_manager.status.courtier_automatic:0 "\n@arrange_marriage_icon! Courtiers: #P Automatic#!"
 dhm_manager.status.courtier_assisted:0 "\n@arrange_marriage_icon! Courtiers: #high Assisted#!"
 dhm_manager.status.courtier_off:0 "\n@arrange_marriage_icon! Courtiers: #N Off#!"
 dhm_manager.status.realism_guardrails:0 "\n\n#weak CK3 law, distance, consent and household authority remain final.#!"
 dhm_manager.0001.education_desk:0 "@skill_learning_icon!  Children & Education"
 dhm_manager.0001.education_desk_tt:0 "Manage Guardians, Specialist Tutors and personal development plans."
 dhm_manager.0001.marriage_desk:0 "@arrange_marriage_icon!  Marriage & Kin"
 dhm_manager.0001.marriage_desk_tt:0 "Set marriage rules and review relatives who are still waiting for a lawful match."
 dhm_manager.0001.office_desk:0 "@skill_stewardship_icon!  Household Office"
 dhm_manager.0001.office_desk_tt:0 "Run a household review or adjust the office's performance and reporting rules."
 dhm_manager.0001.chronicle_desk:0 "@dynasty_prestige_icon!  Chronicle & Stories"
 dhm_manager.0001.chronicle_desk_tt:0 "Read the family Chronicle and choose how often personal stories appear."
 dhm_manager.0001.education_menu:0 "@skill_learning_icon!  Open Education Settings"
 dhm_manager.0001.marriage_menu:0 "@arrange_marriage_icon!  Open Marriage Settings"
 dhm_manager.0001.scan:0 "@dynasty_prestige_icon!  Review the Household Now"
 dhm_manager.0001.scan_tt:0 "Ask your officers to review education and matchmaking now. One review may be ordered every thirty days, and a pending marriage proposal must be answered before another begins."
 dhm_manager.0001.report:0 "@arrange_marriage_icon!  Who Still Needs a Match?"
 dhm_manager.0001.report_tt:0 "See which close relatives are waiting and why the marriage office may be holding back."
 dhm_manager.0001.close:0 "Close"

 dhm_manager.0005.t:0 "Children & Education"
 dhm_manager.0005.desc:0 "The schoolroom keeps its own careful ledger. Set the rules for Guardians and Specialist Tutors, or review the paths chosen for your household."
 dhm_manager.0006.t:0 "Marriage & Kin"
 dhm_manager.0006.desc:0 "The marriage table holds family names, foreign seals and promises not yet made. Set your rules or inspect those still waiting."
 dhm_manager.0007.t:0 "The Household Office"
 dhm_manager.0007.desc:0 "Your steward stands ready with the family rolls. Order a household review now, or decide how the office should work in the years ahead."
 dhm_manager.0008.t:0 "Chronicle & Stories"
 dhm_manager.0008.desc:0 "Your chronicler opens the family record. These pages remember what happened; reading them changes nothing."
 dhm_manager.dashboard.back:0 "Return to the Main Desk"

 dhm_manager.0003.t:0 "The Ledgers Are Closed"
 dhm_manager.0003.desc:0 "The last seal is pressed and the household clerk sets down the quill.\n\n#bold This Review#!\nFamily members considered: #V [ROOT.Char.MakeScope.Var('dhm_scan_family_attempted').GetValue|0]#!\nCourtiers considered: #V [ROOT.Char.MakeScope.Var('dhm_scan_courtier_attempted').GetValue|0]#!\nLawful prospects examined: #V [ROOT.Char.MakeScope.Var('dhm_scan_candidates_evaluated').GetValue|0]#!\nMatches completed: #P [ROOT.Char.MakeScope.Var('dhm_scan_matched').GetValue|0]#!\nProposals awaiting your word: #V [ROOT.Char.MakeScope.Var('dhm_scan_proposals').GetValue|0]#!\nDeferred for want of a sound match: #N [ROOT.Char.MakeScope.Var('dhm_scan_no_candidate').GetValue|0]#!\nProposals that failed final review: #N [ROOT.Char.MakeScope.Var('dhm_scan_execution_failed').GetValue|0]#!\n\n#weak Tutor instruction keeps its yearly rhythm; calling another review cannot create extra progress.#!"
 dhm_manager.0003.back:0 "Back to Household Tools"
 dhm_manager.0003.close:0 "Close"

 dhm_manager.0004.t:0 "Matchmaking Reliability Report"
 dhm_manager.0004.desc_summary:0 "#bold Adult Unmarried Close Family#!\n\nTotal: #V [ROOT.Char.MakeScope.Var('dhm_report_total').GetValue|0]#!\nManual instructions: #V [ROOT.Char.MakeScope.Var('dhm_report_manual').GetValue|0]#!\nReady or queued: #V [ROOT.Char.MakeScope.Var('dhm_report_ready').GetValue|0]#!\nOutside your court: #V [ROOT.Char.MakeScope.Var('dhm_report_outside_court').GetValue|0]#!\nUnavailable: #V [ROOT.Char.MakeScope.Var('dhm_report_unavailable').GetValue|0]#!\nAnother matchmaker's authority: #V [ROOT.Char.MakeScope.Var('dhm_report_no_authority').GetValue|0]#!\nRecently matched: #V [ROOT.Char.MakeScope.Var('dhm_report_success_cooldown').GetValue|0]#!\nPersonal retry wait: #V [ROOT.Char.MakeScope.Var('dhm_report_no_candidate').GetValue|0]#!"
 dhm_manager.0004.desc_manual:0 "\n\n#high Manual#! — [ROOT.Char.MakeScope.Var('dhm_report_manual_example').Char.GetShortUIName] is intentionally excluded by the household marriage mode or a personal Manual / Do Not Marry instruction. CK3 may still show its normal marriage reminder."
 dhm_manager.0004.desc_ready:0 "\n\n#P Ready#! — [ROOT.Char.MakeScope.Var('dhm_report_ready_example').Char.GetShortUIName] is eligible for the next matchmaking pass. Passes run twice yearly; the Performance setting controls how many people are considered."
 dhm_manager.0004.desc_outside:0 "\n\n#high Outside Court#! — [ROOT.Char.MakeScope.Var('dhm_report_outside_example').Char.GetShortUIName] is not in your court. DHM will not override another household's control."
 dhm_manager.0004.desc_unavailable:0 "\n\n#high Unavailable#! — [ROOT.Char.MakeScope.Var('dhm_report_unavailable_example').Char.GetShortUIName] is imprisoned, a hostage, incapable, involved in a Grand Wedding promise, or otherwise unavailable for standard interactions."
 dhm_manager.0004.desc_authority:0 "\n\n#high No Authority#! — [ROOT.Char.MakeScope.Var('dhm_report_authority_example').Char.GetShortUIName] has another valid matchmaker. DHM never seizes control from another court."
 dhm_manager.0004.desc_cooldown:0 "\n\n#high Recently Handled#! — [ROOT.Char.MakeScope.Var('dhm_report_cooldown_example').Char.GetShortUIName] is protected by the post-match cooldown, useful if polygamy or widowhood makes another marriage technically possible."
 dhm_manager.0004.desc_no_candidate:0 "\n\n#high Waiting#! — [ROOT.Char.MakeScope.Var('dhm_report_no_candidate_example').Char.GetShortUIName] is on a personal retry wait. This can follow a failed search, a refusal or a request for time. The character's profile gives the date and any recorded reason."
 dhm_manager.0004.desc_last_scan:0 "\n\n#bold Last Runtime Pass#!\nFamily attempts: #V [ROOT.Char.MakeScope.Var('dhm_scan_family_attempted').GetValue|0]#! | Courtier attempts: #V [ROOT.Char.MakeScope.Var('dhm_scan_courtier_attempted').GetValue|0]#!\nProspects evaluated: #V [ROOT.Char.MakeScope.Var('dhm_scan_candidates_evaluated').GetValue|0]#! | Matches: #P [ROOT.Char.MakeScope.Var('dhm_scan_matched').GetValue|0]#! | Proposals: #V [ROOT.Char.MakeScope.Var('dhm_scan_proposals').GetValue|0]#! | Deferred: #N [ROOT.Char.MakeScope.Var('dhm_scan_no_candidate').GetValue|0]#! | Validation failures: #N [ROOT.Char.MakeScope.Var('dhm_scan_execution_failed').GetValue|0]#!"
 dhm_manager.0004.scan:0 "Run Matchmaking Now"
 dhm_manager.0004.scan_tt:0 "Run one bounded household pass and refresh these results. One review may be ordered every thirty days; pending marriage proposals are resolved first."
 dhm_manager.0004.back:0 "Back to Marriage & Kin"
 dhm_manager.0004.close:0 "Close"

 dhm_manager.0010.t:0 "Household Education"
 dhm_manager.0010.desc_intro:0 "@skill_learning_icon! #bold The Schoolroom#!\n\nA #high Guardian#! shapes a child's manners, loyalties and upbringing. From the sixth year, a separate #high Specialist Tutor#! is chosen to suit the path the child is truly studying."
 dhm_manager.0010.status_enabled:0 "\n\nCurrent Status: #P AUTOMATIC#!"
 dhm_manager.0010.status_disabled:0 "\n\nCurrent Status: #N DISABLED#!"
 dhm_manager.0010.desc_footer:0 "\n\n#weak A trusted Guardian is not dismissed for a trivial advantage. Faith and culture remain important, while a Tutor may be reconsidered when the child's course of study changes. These household orders pass to your successor.#!"
 dhm_manager.0010.education_disable:0 "@skill_learning_icon!  Disable Automatic Education"
 dhm_manager.0010.education_enable:0 "@skill_learning_icon!  Enable Automatic Education"
 dhm_manager.0010.back:0 "Back to Children & Education"

 dhm_manager.0020.t:0 "Dynastic Matchmaking"
 dhm_manager.0020.desc_intro:0 "#bold Your Marriage Orders#!\n"
 dhm_manager.0020.status_manual:0 "\n@arrange_marriage_icon! Family: #high Manual#!"
 dhm_manager.0020.status_assisted:0 "\n@arrange_marriage_icon! Family: #P Assisted#!"
 dhm_manager.0020.status_full_auto:0 "\n@arrange_marriage_icon! Family: #P Full Automatic#!"
 dhm_manager.0020.courtier_automatic:0 "\nCourtier Matchmaking: #P AUTOMATIC#!"
 dhm_manager.0020.courtier_assisted:0 "\nCourtier Matchmaking: #high ASSISTED#!"
 dhm_manager.0020.courtier_off:0 "\nCourtier Matchmaking: #N OFF#!"
 dhm_manager.0020.story_status_important:0 "\nMarriage Stories: #P IMPORTANT ONLY#!"
 dhm_manager.0020.story_status_all:0 "\nMarriage Stories: #high ALL STORIES#!"
 dhm_manager.0020.story_status_off:0 "\nMarriage Stories: #N OFF#!"
 dhm_manager.0020.desc_footer:0 "\n\nHover an order to see what your steward may do."
 dhm_manager.0020.marriage_manual:0 "@arrange_marriage_icon!  Marriage: Manual"
 dhm_manager.0020.marriage_assisted:0 "@arrange_marriage_icon!  Marriage: Assisted"
 dhm_manager.0020.marriage_full_auto:0 "@arrange_marriage_icon!  Marriage: Full Automatic"
 dhm_manager.0020.marriage_full_auto_tt:0 "Begins a bounded matchmaking pass now. Your relatives' own instructions, pending proposals, lawful eligibility and personal retry waits still apply. It does not start an unrelated household story."
 dhm_manager.0020.courtier_policy:0 "@arrange_marriage_icon!  Courtier Matchmaking"
 dhm_manager.0020.kin_policy:0 "@dynasty_prestige_icon!  Kin Marriage Policy"
 dhm_manager.0020.marriage_stories:0 "@dynasty_prestige_icon!  Marriage Story Updates"
 dhm_manager.0020.back:0 "Back to Marriage & Kin"


 dhm_manager.0021.t:0 "Courtier Matchmaking"
 dhm_manager.0021.desc_intro:0 "@arrange_marriage_icon! #bold Household Matchmaking#!\n\nManage marriages for adult courtiers who are genuinely under your matchmaking authority: councillors, knights, physicians, court-position holders and ordinary household members."
 dhm_manager.0021.status_automatic:0 "\n\nCurrent Mode: #P AUTOMATIC#!"
 dhm_manager.0021.status_assisted:0 "\n\nCurrent Mode: #high ASSISTED#!"
 dhm_manager.0021.status_off:0 "\n\nCurrent Mode: #N OFF#!"
 dhm_manager.0021.desc_footer:0 "\n\n#weak Managed courtiers are not matched to landed spouses, and DHM avoids taking another ruler's councillors, knights or court officers. Matches are checked again before execution. Foreign matches use conservative willingness checks, not the full vanilla acceptance calculation.#!"
 dhm_manager.0021.automatic:0 "@arrange_marriage_icon!  Courtier Matchmaking: Automatic"
 dhm_manager.0021.assisted:0 "@arrange_marriage_icon!  Courtier Matchmaking: Assisted"
 dhm_manager.0021.off:0 "@arrange_marriage_icon!  Courtier Matchmaking: Off"
 dhm_manager.0021.back:0 "Back"

 dhm_manager.0022.t:0 "Marriage Story Updates"
 dhm_manager.0022.desc_intro:0 "Choose which visible follow-ups appear after a marriage arranged by DHM. Marriage tracking, memories, births, divorce, and bereavement cleanup continue in the background in every mode."
 dhm_manager.0022.status_important:0 "\n\nCurrent Setting: #P IMPORTANT ONLY#!"
 dhm_manager.0022.status_all:0 "\n\nCurrent Setting: #high ALL STORIES#!"
 dhm_manager.0022.status_off:0 "\n\nCurrent Setting: #N OFF#!"
 dhm_manager.0022.desc_footer:0 "\n\n#weak Important Only reports serious trouble, the first child and bereavement. All Stories also allows courtship, wedding and first-year scenes. One marriage follows one early-marriage path, not several overlapping ones. Off prevents new follow-ups; a courtship already awaiting your decision can still finish.#!"
 dhm_manager.0022.important:0 "Important Only — Recommended"
 dhm_manager.0022.all:0 "Show Every Marriage Story"
 dhm_manager.0022.off:0 "Turn Marriage Stories Off"
 dhm_manager.0022.back:0 "Back"

 dhm_manager.0002.t:0 "Kin Marriage Policy"
 dhm_manager.0002.desc_intro:0 "@dynasty_prestige_icon! #bold Faith-Aware Kinship#!\n\nCrusader Kings III's native marriage legality remains the final authority. This policy only changes how relatives that CK3 already considers legal are ranked by the household."
 dhm_manager.0002.status_follow_faith:0 "\n\nCurrent Policy: #P FOLLOW FAITH#!"
 dhm_manager.0002.status_avoid:0 "\n\nCurrent Policy: #high AVOID CLOSE KIN#!"
 dhm_manager.0002.status_prefer:0 "\n\nCurrent Policy: #P PREFER LEGAL KIN#!"
 dhm_manager.0002.desc_footer:0 "\n\n#weak If your faith legally permits sibling marriage, Follow Faith will not block sibling candidates. Prefer Legal Kin favors such legal relatives; Avoid Close Kin adds an extra household restriction.#!"
 dhm_manager.0002.follow_faith:0 "@dynasty_prestige_icon!  Follow Faith Doctrine"
 dhm_manager.0002.avoid_close_kin:0 "@dynasty_prestige_icon!  Avoid Close Kin"
 dhm_manager.0002.prefer_legal_kin:0 "@dynasty_prestige_icon!  Prefer Legal Kin"
 dhm_manager.0002.back:0 "Back"

 dhm_marriage.0100.t:0 "A Marriage Proposal"
 dhm_marriage.0100.desc:0 "A marriage proposal is laid before you: [dhm_marriage_subject.GetShortUIName] and [dhm_marriage_candidate.GetShortUIName].\n\nThe match appears suitable and lawful. Your steward recommends continuing the talks, though the families must still agree to the terms."
 dhm_marriage.0100.accept:0 "Send the Proposal with My Seal"
 dhm_marriage.0100.reject:0 "Strike This Name from the Page"
 dhm_marriage.0100.manual:0 "I Will Handle Marriages Myself"

 dhm_marriage.0200.t:0 "A Match for the Court"
 dhm_marriage.0200.desc:0 "Your steward recommends a marriage between [dhm_marriage_subject.GetShortUIName] and [dhm_marriage_candidate.GetShortUIName].\n\nThe pair appear suited to one another, and the match need not take them away from your court. You may let the arrangements proceed or ask the steward to keep looking."
 dhm_marriage.0200.accept:0 "Let the Families Speak"
 dhm_marriage.0200.reject:0 "No—Seek Another Hearth"

