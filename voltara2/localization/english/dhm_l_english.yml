 dhm_manager.0001.desc_intro:0 "Your household papers are ready. What needs your attention?"
 dhm_manager.0001.desc_status_header:0 "\n\n#bold Household Orders#!\n"
 dhm_manager.dashboard.education_enabled:0 "\n#bold Education:#! Automatic"
 dhm_manager.dashboard.education_disabled:0 "\n#bold Education:#! Manual"
 dhm_manager.dashboard.marriage_manual:0 "\n#bold Marriage:#! Manual"
 dhm_manager.dashboard.marriage_assisted:0 "\n#bold Marriage:#! Assisted"
 dhm_manager.dashboard.marriage_full_auto:0 "\n#bold Marriage:#! Full Automatic"
