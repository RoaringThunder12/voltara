 dhm_refused_family_dispute_opinion:0 "Refused to Hear Our Dispute"
 dhm_family_verdict_grievance_opinion:0 "Favored Over Me in a Family Verdict"
 dhm_respected_my_custom_opinion:0 "Respected My Custom"
 dhm_welcomed_my_custom_opinion:0 "Welcomed Me at the Table"

 dhm_reputation_generous_modifier:0 "Known as a Generous House"
 dhm_reputation_generous_modifier_desc:0 "Kin remember that this household sends help before hardship becomes humiliation."
 dhm_reputation_strict_modifier:0 "Known as a Stern House"
 dhm_reputation_strict_modifier_desc:0 "The ruler's decisions are swift, disciplined, and not easily questioned."
 dhm_reputation_guardian_modifier:0 "Known as a Sheltering House"
 dhm_reputation_guardian_modifier_desc:0 "Relatives expect thoughtful counsel and protection when family trouble reaches the door."
 dhm_reputation_traditional_modifier:0 "Known as a House of Custom"
 dhm_reputation_traditional_modifier_desc:0 "Sacred obligations and inherited customs are treated as living household duties."
 dhm_letters_from_home_modifier:0 "Letters from Home"
 dhm_letters_from_home_modifier_desc:0 "Familiar handwriting and timely help make a distant household feel less alone."
 dhm_household_confidence_modifier:0 "Household Confidence"
 dhm_household_confidence_modifier_desc:0 "Being heard within the family has given this character a surer voice."
 dhm_schoolroom_breakthrough_modifier:0 "A Schoolroom Breakthrough"
 dhm_schoolroom_breakthrough_modifier_desc:0 "A difficult lesson became genuine understanding rather than rote obedience."
 dhm_schoolroom_resentment_modifier:0 "Schoolroom Resentment"
 dhm_schoolroom_resentment_modifier_desc:0 "The lesson was learned, but correction has become tangled with humiliation."
 dhm_marital_self_reliance_modifier:0 "A Marriage Made Their Own"
 dhm_marital_self_reliance_modifier_desc:0 "The couple learned to govern their own disagreements without waiting for family intervention."
 dhm_unsettled_household_modifier:0 "An Unsettled Household"
 dhm_unsettled_household_modifier_desc:0 "Unspoken disagreements make ordinary household burdens harder to share."
 dhm_family_reconciled_modifier:0 "Family Reconciled"
 dhm_family_reconciled_modifier_desc:0 "An old quarrel has given way to ordinary trust and small daily kindnesses."
 dhm_family_grievance_modifier:0 "A Family Grievance"
 dhm_family_grievance_modifier_desc:0 "A dispute survives in silences, seating arrangements, and carefully omitted invitations."
 dhm_reward_household_patron_modifier:0 "Patron of the Household"
 dhm_reward_household_patron_modifier_desc:0 "Timely silver and practical help have made the wider family look to this ruler as a dependable patron."
 dhm_reward_trusted_counsel_modifier:0 "Counsel Worth Hearing"
 dhm_reward_trusted_counsel_modifier_desc:0 "Relatives know they may speak honestly here and leave with an answer that lightens the burden."
 dhm_reward_education_legacy_modifier:0 "A Generation Well Taught"
 dhm_reward_education_legacy_modifier_desc:0 "The success of the household's pupils has become a visible credit to its guidance."
 dhm_reward_household_peacemaker_modifier:0 "Peacemaker of the House"
 dhm_reward_household_peacemaker_modifier_desc:0 "A difficult quarrel ended in lasting peace, earning respect throughout the household."
 dhm_reward_dynastic_momentum_modifier:0 "The House Moves Forward"
 dhm_reward_dynastic_momentum_modifier_desc:0 "A stable marriage and growing family have given the dynasty fresh confidence and purpose."
 dhm_reward_cherished_customs_modifier:0 "Keeper of Many Customs"
 dhm_reward_cherished_customs_modifier_desc:0 "Faith and tradition were treated with care, showing that one roof can honor more than one inheritance."
 dhm_reward_proud_house_modifier:0 "Pride of the Household"
 dhm_reward_proud_house_modifier_desc:0 "A family milestone has filled the hall with confidence, celebration and good reputation."
 dhm_reward_family_regret_modifier:0 "A Trouble Left Unmended"
 dhm_reward_family_regret_modifier_desc:0 "A household quarrel was allowed to harden, and the wider family has noticed the silence."

