 dhm_profile.0001.desc:0 "Set personal instructions for [dhm_profile_target.GetShortUIName]. Individual instructions override the household default without granting control over another court."
 dhm_profile.status.follow_household:0 "\n\nAutomation: #high Follow Household Policy#!"
 dhm_profile.status.full_auto:0 "\n\nAutomation: #P Full Automatic#!"
 dhm_profile.status.ask:0 "\n\nAutomation: #P Ask Before Matching#!"
 dhm_profile.status.manual:0 "\n\nAutomation: #high Manual#!"
 dhm_profile.status.do_not_marry:0 "\n\nAutomation: #N Do Not Marry#!"
 dhm_profile.strategy.balanced:0 "\nMarriage Goal: #high Balanced#!"
