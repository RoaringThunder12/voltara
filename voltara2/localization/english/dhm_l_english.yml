 dhm_profile.0010.t:0 "Personal Automation"
 dhm_profile.0010.desc:0 "Choose how the household office should treat [dhm_profile_target.GetShortUIName]. A personal mode takes precedence over the global marriage policy."
 dhm_profile.0010.follow:0 "Follow Household Policy"
 dhm_profile.0010.full_auto:0 "Full Automatic"
 dhm_profile.0010.full_auto_tt:0 "Enable automatic matching for this relative and run one bounded household pass."
 dhm_profile.0010.ask:0 "Ask Before Every Match"
 dhm_profile.0010.manual:0 "Manual Management"
 dhm_profile.0010.do_not_marry:0 "Do Not Marry"

 dhm_profile.0020.t:0 "Personal Marriage Strategy"
 dhm_profile.0020.desc:0 "Choose the principal goal for [dhm_profile_target.GetShortUINamePossessive] future match. Legality, diplomatic range, spouse capacity, authority and safeguards remain mandatory."
 dhm_profile.0020.balanced:0 "Balanced Stewardship"
 dhm_profile.0020.dynasty:0 "Preserve the Dynasty"
 dhm_profile.0020.alliance:0 "Seek an Alliance"
 dhm_profile.0020.claims:0 "Seek Useful Claims"
 dhm_profile.0020.bloodline:0 "Strengthen the Bloodline"
 dhm_profile.0020.compatibility:0 "Favor Love & Compatibility"
 dhm_profile.0020.safeguards:0 "Faith, Culture & Wedding Safeguards"
 dhm_profile.0021.t:0 "Marriage Safeguards"
 dhm_profile.0021.desc:0 "Choose which customs the matchmaker must respect. Faith may be required, culture may be preferred, and a Grand Wedding may be demanded when your rank and circumstances allow one."
 dhm_profile.0021.same_faith_on:0 "Require Same Faith"
 dhm_profile.0021.same_faith_off:0 "Allow Other Faiths"
 dhm_profile.0021.same_culture_on:0 "Prefer Same Culture"
 dhm_profile.0021.same_culture_off:0 "Remove Culture Preference"
 dhm_profile.0021.grand_wedding_on:0 "Require a Grand Wedding"
 dhm_profile.0021.grand_wedding_off:0 "Standard Wedding Allowed"

 dhm_profile.0030.t:0 "Household Career Plan"
 dhm_profile.0030.desc:0 "Set down the duty for which [dhm_profile_target.GetShortUIName] should prepare. The household ledger will compare that aim with [dhm_profile_target.GetHerHis] real skill and appointments. It will not invent a post or grant free ability."
 dhm_profile.0030.none:0 "No Special Career"
 dhm_profile.0030.diplomat:0 "Diplomat / Chancellor"
 dhm_profile.0030.commander:0 "Commander / Knight"
 dhm_profile.0030.steward:0 "Steward / Administrator"
 dhm_profile.0030.spymaster:0 "Spymaster"
 dhm_profile.0030.scholar:0 "Scholar / Clergy"
 dhm_profile.0030.physician:0 "Physician"
 dhm_profile.0030.officer:0 "Court Officer"

 dhm_profile.0040.t:0 "Child Development Plan"
 dhm_profile.0040.desc:0 "Record the road you hope [dhm_profile_target.GetShortUIName] will follow. The tutor obeys the child's real Education Focus; the ledger compares that focus, growing skill and final education with your plan."
 dhm_profile.0040.actual_focus:0 "Follow Actual Education Focus"
 dhm_profile.0040.diplomacy:0 "Diplomatic Heir"
 dhm_profile.0040.martial:0 "Knight & Commander"
 dhm_profile.0040.stewardship:0 "Administrator"
 dhm_profile.0040.intrigue:0 "Court Operative"
 dhm_profile.0040.learning:0 "Scholar & Physician"

 # v0.3.0 — marriage agency, negotiation and lifecycle
 dhm_marriage.0110.t:0 "A Voice Raised Against the Match"
 dhm_marriage.0110.desc:0 "The chamber empties, but [dhm_marriage_subject.GetShortUIName] remains before you.\n\n‘I know what the family expects of me. Yet when I think of marrying [dhm_marriage_candidate.GetShortUIName], my heart is not at peace.’\n\nA patient answer may win consent. An order will secure obedience at a price. Silence the marriage talks, and [dhm_marriage_subject.GetFirstNameNoTooltip] will remember that you listened."
 dhm_marriage.0110.persuade:0 "Sit with Me—Let Us Speak Plainly"
 dhm_marriage.0110.compel:0 "You Will Do Your Duty"
 dhm_marriage.0110.respect:0 "Then I Will Not Bind You"
 dhm_marriage.0120.t:0 "A Promise Beneath the Banners"
 dhm_marriage.0120.desc:0 "A Grand Wedding has been promised for [dhm_marriage_subject.GetShortUIName]. The proposed match with [dhm_marriage_candidate.GetShortUIName] must therefore be arranged through the usual marriage offer.\n\nYour steward lays the names before you. The final proposal and the wedding promise need your attention."
 dhm_marriage.0120.open:0 "Review the Marriage Offer"
 dhm_marriage.0120.open_tt:0 "Open the candidate's matchmaker. Select the recommended pair and the Grand Wedding promise; CK3's normal marriage rules make the final judgment."
 dhm_marriage.0120.later:0 "The Hall Is Not Yet Ready"
 dhm_marriage.0130.t:0 "An Envoy at Your Table"
 dhm_marriage.0130.desc:0 "An envoy from [dhm_marriage_candidate.GetShortUINamePossessive] household breaks the seal upon a carefully worded reply.\n\n‘Our door is not closed to [dhm_marriage_subject.GetShortUIName], but goodwill must be shown before vows are exchanged. Silver for the new household would speak clearly. A pledge made upon your own honor would speak louder.’\n\nTo end the talks costs nothing—but the slight will not be forgotten at once."
 dhm_marriage.0130.settlement:0 "Send Silver for Their New Hearth"
 dhm_marriage.0130.pledge:0 "My Honor Will Stand Behind This Union"
 dhm_marriage.0130.withdraw:0 "Seal the Letter and End the Talks"
 dhm_marriage.approve_tt:0 "Your steward checks that the match is still lawful, then continues the marriage arrangements. Consent, family terms or a promised Grand Wedding may still need your attention."
 dhm_marriage.0300.t:0 "News from the New Household"
 dhm_marriage.0300.t.quarrel:0 "A Quarrel at the Hearth"
 dhm_marriage.0300.t.faith:0 "Two Faiths Under One Roof"
 dhm_marriage.0300.t.culture:0 "Two Customs Under One Roof"
 dhm_marriage.0300.t.warm:0 "Laughter at the Hearth"
 dhm_marriage.0300.desc_good:0 "You hear laughter before the chamber door opens.\n\n‘My liege,’ [dhm_union_subject.GetFirstNameNoTooltip] says, ‘[dhm_union_spouse.GetFirstNameNoTooltip] steals every blanket.’\n\n‘Only because [dhm_union_subject.GetFirstNameNoTooltip] snores like a war horn,’ [dhm_union_spouse.GetFirstNameNoTooltip] replies. Their new household is plainly finding joy."
 dhm_marriage.0300.desc_mixed:0 "The couple receives you together, though there is space between their chairs.\n\n‘We are learning,’ [dhm_union_subject.GetFirstNameNoTooltip] says.\n\n‘Slowly,’ [dhm_union_spouse.GetFirstNameNoTooltip] adds. There is no open quarrel, but some guidance may help."
 dhm_marriage.0300.desc_friction:0 "A servant meets you outside the chamber. ‘They have argued since dawn, my liege.’\n\n‘Every choice becomes a quarrel,’ [dhm_union_subject.GetFirstNameNoTooltip] says.\n\n‘Because no choice is ever mine,’ [dhm_union_spouse.GetFirstNameNoTooltip] answers. Both fall silent when you enter."
 dhm_marriage.0300.desc_faith:0 "The evening meal has become an argument over prayer.\n\n‘In my family, we have always done this,’ [dhm_union_subject.GetFirstNameNoTooltip] says.\n\n‘And this is our family now,’ [dhm_union_spouse.GetFirstNameNoTooltip] replies. Neither speaks with hatred, but both want to be heard."
 dhm_marriage.0300.desc_culture:0 "A simple supper has become a dispute over guests, language, and which customs rule the hall.\n\n‘Must I always yield?’ [dhm_union_subject.GetFirstNameNoTooltip] asks.\n\n[dhm_union_spouse.GetFirstNameNoTooltip] gives the same answer: ‘Must I?’"
 dhm_marriage.0300.mediate:0 "Sit Down. Both of You Will Speak"
 dhm_marriage.0300.support:0 "Send Silver to Ease Their Burden"
 dhm_marriage.0300.customs:0 "Keep Both Customs Under This Roof"
 dhm_marriage.0300.observe:0 "Leave Them to Settle Their Own Marriage"
 dhm_marriage.0305.t:0 "Word from the Hearth"
 dhm_marriage.0305.desc.reconciled:0 "The two return together, standing closer than before.\n\n‘We still disagree,’ [dhm_union_subject.GetFirstNameNoTooltip] says.\n\n‘But now we finish the argument before supper grows cold,’ [dhm_union_spouse.GetFirstNameNoTooltip] adds. Your counsel has become a habit of peace in their household."
 dhm_marriage.0305.desc.established:0 "The roof is mended, the servants have been paid, and the anxious silence has left the table.\n\n‘Your aid bought us time,’ [dhm_union_subject.GetFirstNameNoTooltip] says. ‘We used it well.’ Their household now stands on firmer ground."
 dhm_marriage.0305.desc.independent:0 "[dhm_union_subject.GetFirstNameNoTooltip] and [dhm_union_spouse.GetFirstNameNoTooltip] visit without a complaint to bring before you.\n\n'We have worked it out,' [dhm_union_spouse.GetFirstNameNoTooltip] says. The two seem glad they were given time to settle things themselves."
 dhm_marriage.0305.desc.unsettled:0 "The argument has not been settled. [dhm_union_subject.GetFirstNameNoTooltip] and [dhm_union_spouse.GetFirstNameNoTooltip] still share a household, but speak little to one another. Another effort at reconciliation might help."
 dhm_marriage.0305.celebrate:0 "Good. May Their Hearth Stay Warm."
 dhm_marriage.0305.repair:0 "Send Aid and Call Them Back to the Table"
 dhm_marriage.0305.wait:0 "Leave Them to Break the Silence"
 dhm_marriage.0310.t:0 "Their First Year Together"
 dhm_marriage.0310.desc:0 "One year has passed since [dhm_union_subject.GetShortUIName] and [dhm_union_spouse.GetShortUIName] exchanged their vows. They have shared a roof, a table, and the burdens of marriage.\n\nYou may mark the day before the court or leave it to them."
 dhm_marriage.0310.commemorate:0 "Hold a Feast for Their First Year"
 dhm_marriage.0310.private:0 "Leave the Day to Them"
 dhm_marriage.0320.t:0 "A Cry in the Family Chambers"
 dhm_marriage.0320.desc:0 "Before dawn, a newborn's cry fills the household. [dhm_union_child.GetShortUIName] is safely placed in the arms of [dhm_union_subject.GetShortUIName] and [dhm_union_spouse.GetShortUIName].\n\nThe marriage you arranged has become a family."
 dhm_marriage.0320.celebrate:0 "Hold a Feast for the Child"
 dhm_marriage.0320.rejoice:0 "Bless Them in Private"
 dhm_marriage.0330.t:0 "The Empty Place at the Hearth"
 dhm_marriage.0330.desc:0 "One place at the table is empty. [dhm_deceased_spouse.GetShortUIName] is dead, and [dhm_surviving_spouse.GetShortUIName] now faces the household alone.\n\nYou may send aid or share the mourning."
 dhm_marriage.0330.support:0 "Send Silver to the Bereaved"
 dhm_marriage.0330.mourn:0 "Sit and Mourn with Them"

 # v0.3.0 — education and careers
 dhm_education.0100.t:0 "Ink-Stained Fingers"
 dhm_education.0100.desc:0 "[dhm_child.GetShortUIName] has reached ten years of age. You visit the schoolroom to see how the lessons are going.\n\nYou can let the present teaching continue, ask for another tutor, or review the child's course of study."
 dhm_education.0100.keep:0 "Keep the Tutor. The Lessons Are Working."
 dhm_education.0100.reselect:0 "Find Another Tutor"
 dhm_education.0100.plan:0 "Show Me the Child's Chosen Path"
 dhm_education.0101.t:0 "The Last Lessons of Childhood"
 dhm_education.0101.desc:0 "[dhm_child.GetShortUIName] is growing older, and the lessons will soon be put to use outside the schoolroom.\n\nYou may keep the present teaching or seek a better fit. Changing tutors could help, but it will disrupt the lessons for a while."
 dhm_education.0101.keep:0 "Let the Tutor Finish the Work"
 dhm_education.0101.reselect:0 "Make One Final Change"
 dhm_education.0101.plan:0 "Let Us Choose the Road Ahead"
 dhm_education.0102.t:0 "The End of Childhood Lessons"
 dhm_education.0102.desc:0 "[dhm_former_student.GetShortUIName] has come of age. The years of lessons are over, and the household gathers to wish the young adult well.\n\nYou could mark the occasion before everyone, or offer a few words in private."
 dhm_education.0102.tutor:0 "\n\n[dhm_selected_tutor.GetShortUIName] stands nearby, pleased to see the pupil ready for adult life."
 dhm_education.0102.university:0 "\n\n#P A Scholar's Road#! — [dhm_former_student.GetFirstNameNoTooltip] has the learning to profit from a university, should fortune and the treasury allow it."
 dhm_education.0102.celebrate:0 "Honor the Student and Reward the Tutor"
 dhm_education.0102.note:0 "Speak with the Student in Private"
 dhm_education.reselect_tt:0 "A new Specialist Tutor will be sought within the household. Breaking the present rhythm briefly hinders the child's lessons and may cause some resentment."

 # v0.3.0 — annual council, performance and diagnostics
 dhm_council.0001.t:0 "Candles Around the Council Table"
 dhm_council.0001.desc:0 "Rain taps against the shutters while your household officers gather around the long table. Family rolls lie open beside sealed proposals and reports from the schoolroom.\n\n‘We cannot press every advantage at once,’ your steward says. ‘Name the duty that shall have first claim upon our attention this year.’"
 dhm_council.0001.extinction:0 "\n\n#N A Thin Family Line#! — #V [ROOT.Char.MakeScope.Var('dhm_report_extinction_risk').GetValue|0]#! mature close relatives remain unmarried and have no living children."
 dhm_council.priority.succession:0 "\nCurrent Emphasis: #P Secure Succession#!"
 dhm_council.priority.alliance:0 "\nCurrent Emphasis: #P Political Alliances#!"
 dhm_council.priority.education:0 "\nCurrent Emphasis: #P Next Generation#!"
 dhm_council.priority.balanced:0 "\nCurrent Emphasis: #high Balanced Stewardship#!"
 dhm_council.0001.succession:0 "Guard the Family Line"
 dhm_council.0001.alliance:0 "Strengthen Our Friends Abroad"
 dhm_council.0001.education:0 "Prepare the Young"
 dhm_council.0001.balanced:0 "Keep Every Duty in Balance"
 dhm_council.priority_persists_tt:0 "This remains the household's current emphasis until you choose another priority at a future council. Its one-year bonus is renewed when selected."
 dhm_council.0001.careers:0 "Show Me Who Is Ready to Serve"
 dhm_council.0001.disable:0 "I Will Call This Council When Needed"
 dhm_council.0010.t:0 "Names in the Steward's Ledger"
 dhm_council.0010.desc:0 "Your steward reads out the names of those whose talents have become difficult to overlook. They are recommendations, not appointments; office, law and courtly politics will still have their say."
 dhm_council.0010.diplomat:0 "\n@skill_diplomacy_icon! Diplomacy: [ROOT.Char.MakeScope.Var('dhm_career_best_diplomat').Char.GetShortUIName]"
 dhm_council.0010.commander:0 "\n@skill_martial_icon! Command: [ROOT.Char.MakeScope.Var('dhm_career_best_commander').Char.GetShortUIName]"
 dhm_council.0010.steward:0 "\n@skill_stewardship_icon! Stewardship: [ROOT.Char.MakeScope.Var('dhm_career_best_steward').Char.GetShortUIName]"
 dhm_council.0010.spymaster:0 "\n@skill_intrigue_icon! Intrigue: [ROOT.Char.MakeScope.Var('dhm_career_best_spymaster').Char.GetShortUIName]"
 dhm_council.0010.scholar:0 "\n@skill_learning_icon! Learning: [ROOT.Char.MakeScope.Var('dhm_career_best_scholar').Char.GetShortUIName]"
 dhm_council.0010.manager:0 "Back to Household Tools"
 dhm_council.0010.close:0 "Close"
 dhm_council.0020.t:0 "Household Office Settings"
 dhm_council.0020.desc:0 "Choose how many relatives and courtiers the steward may consider. The office reviews your household quarterly; routine matchmaking has a six-month pause between passes. No mode searches the whole world."
 dhm_council.performance.light:0 "\nEach matchmaking pass: #V 1 relative and 1 courtier#!"
 dhm_council.performance.balanced:0 "\nEach matchmaking pass: #V 3 relatives and 2 courtiers#!"
 dhm_council.performance.deep:0 "\nEach matchmaking pass: #V 5 relatives and 3 courtiers#!"
