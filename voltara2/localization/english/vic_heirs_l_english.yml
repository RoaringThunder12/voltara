l_english:
 vic_heirs.1.t:0 "The Children of the Fallen Crown"
 vic_heirs.1.desc:0 "The imperial crown and Titania are mine. Yet Cassian's children remain living symbols of the old succession. I must decide how to treat them. Those beyond my authority cannot simply be summoned into custody."
 vic_heirs.1.a:0 "Guarantee their safety."
 vic_heirs.1.a.tt:0 "Spare Cassian's surviving children. They appreciate your clemency and retain their claims."
 vic_heirs.1.b:0 "Keep those within my reach under house arrest."
 vic_heirs.1.b.tt:0 "Place free children in your realm or Cassian's court under house arrest. Children abroad or already imprisoned remain where they are."
 vic_heirs.1.c:0 "Let Bryndale shelter those who can depart."
 vic_heirs.1.c.tt:0 "Send free, unlanded children in your or Cassian's court to Bryndale, if its ruler exists. Landed children and prisoners remain in place."
