l_english:
 vic_loyalist.1.t:0 "The Promise of the Crown"
 vic_loyalist.1.desc:0 "The rebellion has been defeated. Octavian and Tharn can no longer command their supporters from freedom; those who survived are held by the victorious Crown.\n\nNow Cassian's promised reform becomes the settlement of the realm. Slavery is abolished, the loyal houses are recognized, and the imperial household can begin to reckon with all that this war has cost."
 vic_loyalist.1.a:0 "Let the promise become law."
