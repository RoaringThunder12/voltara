 culture_parameter_arcana_claim_enabled:0 "Rulers with high [arcana_i|E][arcana|E] may pay [prestige_i][prestige|E] to claim [titles|E] held by other rulers. The higher the difference of [arcana_i|E][arcana|E] between the rulers, the lower the cost."
 culture_parameter_can_disrupt_prisoners:0 "[rulers|E] can use the Disrupt [interaction|E] on [prisoners|E]"
 culture_parameter_dislikes_marrying_outside_of_heritage:0 "[marriage|E] Acceptance towards cultures of a different [heritage|E]: #N -100#!"
 culture_parameter_magic_disruption_blocks_inheritance:0 "Magically disrupted [claimants|E] cannot press their [claims|E] against [rulers|E] of this [culture|E]"
