l_english:
 # Honest risk receipts for player-chosen random household interventions.
 dhm_v080_risk_school_base_tt:0 "@warning_icon! #high The roll begins at#! #P 55 favorable#! against #N 45 setback#!. The factors below change those weights."
 dhm_v080_risk_school_memory_tt:0 "#P Their earlier lesson adds 20 to the favorable side.#!"
 dhm_v080_risk_school_learned_tt:0 "#P A tutor with 12 Learning or more adds 30 to the favorable side.#!"
 dhm_v080_risk_school_master_tt:0 "#P At 18 Learning or more, the tutor adds another 15.#!"
 dhm_v080_risk_school_patient_tt:0 "#P A patient tutor adds 10 to the favorable side.#!"
 dhm_v080_risk_school_lazy_tt:0 "#N A lazy tutor removes 10 from the favorable side.#!"
 dhm_v080_risk_school_setback_tt:0 "#N On a setback, the child gains Stress and Schoolroom Resentment.#! #P A follow-up comes in 18 months; if child and tutor can still meet, you may mend the lesson.#!"

 dhm_v080_risk_hearth_base_tt:0 "@warning_icon! #high The roll begins at#! #P 65 peaceful#! against #N 35 unsettled#!. The factors below change those weights."
 dhm_v080_risk_hearth_memory_tt:0 "#P An earlier reconciliation adds 20 to the peaceful side.#!"
 dhm_v080_risk_hearth_diplomacy_tt:0 "#P Diplomacy of 12 or more adds 25 to the peaceful side.#!"
 dhm_v080_risk_hearth_compassionate_tt:0 "#P Compassion adds 15 to the peaceful side.#!"
 dhm_v080_risk_hearth_callous_tt:0 "#N Callousness adds 20 to the unsettled side.#!"
 dhm_v080_risk_hearth_setback_tt:0 "#N On a setback, both spouses bear an Unsettled Household for two years.#! #P A follow-up comes in 18 months; if they remain married and you can meet the cost, you may repair the breach.#!"

 dhm_v080_risk_dispute_base_tt:0 "@warning_icon! #high The roll begins at#! #P 65 peaceful#! against #N 35 grievance#!. The factors below change those weights."
 dhm_v080_risk_dispute_memory_tt:0 "#P A peace once kept adds 20 to the peaceful side.#!"
 dhm_v080_risk_dispute_diplomacy_tt:0 "#P Diplomacy of 12 or more adds 25 to the peaceful side.#!"
 dhm_v080_risk_dispute_just_tt:0 "#P Being Just adds 20 to the peaceful side.#!"
 dhm_v080_risk_dispute_setback_tt:0 "#N On a setback, both relatives carry a Family Grievance for three years.#! #P A follow-up comes in two years; if both still live and you can meet the cost, you may settle it.#!"
