l_english:
 vrs.1.t:0 "The Road Beneath the Water"
 vrs.1.desc:0 "The causeway disappears beneath the dark water of Rhaulla. A reed-cutter offers to lead us along the old embankments. Without someone who knows their turns, a single wrong step could swallow a horse."
 vrs.1.0:0 "Hire the reed-cutter."
 vrs.1.1:0 "Our guides know another crossing."
 vrs.1.2:0 "Probe every step before we advance."
 vrs.2.t:0 "Lights Across the Mire"
 vrs.2.desc:0 "Pale lights bob beyond our camp. One porter swears that a familiar voice is calling from the reeds. The locals bank the fires and warn us to keep together until morning."
 vrs.2.0:0 "Keep the party together."
 vrs.2.1:0 "Let our guides mark a safe path."
 vrs.2.2:0 "Investigate the lights."
 vrs.3.t:0 "Fever in the Reeds"
 vrs.3.desc:0 "Mosquitoes rise in clouds from the still pools. By evening the baggage handlers are shaking with fever. We must find clean water and dry ground before the sickness spreads."
 vrs.3.0:0 "Boil the water and treat the sick."
 vrs.3.1:0 "Follow the guides to a dry campsite."
 vrs.3.2:0 "Stop and let them recover."
 vrs.3.3:0 "We cannot afford to stop."
 vrs.4.t:0 "Something Under the Boat"
 vrs.4.desc:0 "A heavy shape strikes the ferry from below. The ferryman cries out as the baggage shifts. Somewhere beneath the opaque water, something turns for another pass."
 vrs.4.0:0 "Drive it away with the boat hooks."
 vrs.4.1:0 "Throw our provisions clear of the boat."
 vrs.4.2:0 "Make for the nearest bank!"
 vrs.5.t:0 "An Arch Among the Reeds"
 vrs.5.desc:0 "An elven arch emerges from the mist, its lower stones buried beneath centuries of silt. Someone has recently left flowers upon it. The drowned settlements of Rhaulla still have their mourners."
 vrs.5.0:0 "Record the carvings without disturbing the offerings."
 vrs.5.1:0 "Search the exposed chambers."
 vrs.5.2:0 "Leave the dead their peace."
 vrs_reclaim:0 "Beat Back the Swamp"
 vrs_reclaim_desc:0 "Spend 100 gold on a year of drainage, embankments and raised paths in one eligible personally held Rhaullan county. Completed works remove encroachment and protect the county for five years. They do not change its terrain or disturb its ancient landmarks."
 vrs_reclaim_tooltip:0 "Spend 100 gold on a year of drainage, embankments and raised paths in one eligible personally held Rhaullan county. Completed works remove encroachment and protect the county for five years. They do not change its terrain or disturb its ancient landmarks."
 vrs_reclaim_confirm:0 "Proceed"
 vrs.10.t:0 "Dry Ground in [scope:vrs_site.GetNameNoTier]"
 vrs.10.desc:0 "A year of cutting channels and raising embankments has brought the waters under control. Families can reach their fields again, and the causeways stand above the flood. The drains will need care; Rhaulla never relinquishes its marshes forever."
 vrs.10.0:0 "Keep the channels clear."
 vrs.11.t:0 "The Swamp at Our Doors"
 vrs.11.desc:0 "The ditches of [scope:vrs_site.GetNameNoTier] have filled with silt. Water stands in the fields and reeds choke the paths between hamlets. The inhabitants ask for embankments before another season is lost."
 vrs.11.0:0 "Send workers to shore up the banks."
 vrs.11.1:0 "We must plan lasting drainage works."
 vrs_mire:0 "Rhaulla: Treacherous Marshes"
 vrs_guides:0 "Rhaullan Reed Guides"
 vrs_exhausted:0 "Exhausted by the Mire"
 vrs_fever:0 "Marsh Fever in the Caravan"
