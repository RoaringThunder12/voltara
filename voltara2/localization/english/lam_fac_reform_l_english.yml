l_english:
 lam_cr_ballot_title: "Faction Council: Our Decision"
 lam_cr_ballot_intro: "[lam_cr_head.GetShortUINamePossessive] faction must decide its course. Standing and service determine each member's voice."
 lam_cr_ballot_stale: "This council has ended, or your standing has changed. This ballot can no longer be cast."
 lam_cr_ballot_numbers: "\n\nFor: [lam_cr_head.MakeScope.Var('lam_cr_yes').GetValue|1]\nAgainst: [lam_cr_head.MakeScope.Var('lam_cr_no').GetValue|1]\nEligible weight: [lam_cr_head.MakeScope.Var('lam_cr_total').GetValue|1]\nMy voice: [ROOT.Char.MakeScope.Var('lam_cr_weight').GetValue|1] ([ROOT.Char.MakeScope.ScriptValue('lam_cr_ballot_share_value')|1]%)\n[lam_cr_head.Custom('LamCrThreshold')]\nWeights are fixed when the council opens. Dead or departed members are removed. Unanswered ballots abstain after 15 days.\n[ROOT.Char.Custom2('LamUxBallot', GetPlayer)]"
 lam_cr_vote_yes: "I vote in favour."
 lam_cr_vote_no: "I vote against."
 lam_cr_vote_abstain: "I abstain."
 lam_cr_vote_request: "Recognize my service, and you have my support."
 lam_cr_vote_binding_tt: "Your voice counts in the final decision. Only approved proposals take effect."
 lam_cr_abstain_tt: "Your weight remains in the eligible total but supports neither side."
 lam_cr_request_tt: "Ask for recognition. If the head accepts and spends 75 prestige, you vote yes and gain +3 service influence for two years. This meeting keeps your original weight. If refused, you may vote again."
 lam_cr_request_title: "The Price of Support"
 lam_cr_request_desc: "[lam_cr_petitioner.GetShortUIName] offers support in return for public recognition."
 lam_cr_request_accept: "Your service deserves recognition."
 lam_cr_request_refuse: "I cannot agree to that."
 lam_cr_request_accept_tt: "Spend 75 prestige to secure their vote and recognize their standing for two years (+3 influence)."
 lam_cr_close: "Understood."
 lam_cr_result_title: "The Council's Decision"
 lam_cr_result_passed: "The proposal has secured the required support and is approved."
 lam_cr_result_rejected: "The proposal failed. Its proposed changes will not be enacted. Rejecting a response to a ban selects the alternative response."
 lam_cr_result_cancelled: "The leadership or conditions changed. The council was cancelled without enacting its proposal."
 lam_cr_result_numbers: "\n\nFor [TopScope.GetValue('lam_cr_result_yes')|1] / Against [TopScope.GetValue('lam_cr_result_no')|1]\nEligible weight [TopScope.GetValue('lam_cr_result_total')|1]\nAbstentions remain in the total. Military, economic, social and court standing, connections and service determine voice."
 lam_cr_result_summary: "[ROOT.Char.Custom('LamCrResult')]\n[lam_cr_head.GetShortUINamePossessive] council has concluded. For [TopScope.GetValue('lam_cr_result_yes')|1], against [TopScope.GetValue('lam_cr_result_no')|1], eligible [TopScope.GetValue('lam_cr_result_total')|1]."
 lam_cr_legacy_closed: "This is a record of a council already resolved under the earlier rules. It cannot alter your current membership."
 lam_cr_contract_cancelled: "The agreed exchange can no longer be fulfilled"
 lam_cr_threshold_normal: "Required: more than half of all eligible weight. A tie fails."
 lam_cr_threshold_major: "Required: at least two thirds of all eligible weight."
 lam_cr_patronage_title: "The Balance at Court"
 lam_cr_patronage_desc: "[lam_pr_lord.GetShortUINamePossessive] favour has shifted. Our faction must decide how to respond."
 lam_cr_patronage_obstruct: "We will oppose their dominance."
 lam_cr_patronage_coalition: "We should find partners."
 lam_cr_patronage_approach: "Seek a way back into favour."
 lam_cr_obstruct_tt: "Oppose a rival’s pending office, heir or law petition. Pressure applies only to that request."
 lam_cr_coalition_tt: "Offer an alliance to another faction without royal patronage. Their consent is required. Without a suitable partner, oppose the rival instead."
 lam_cr_approach_tt: "Submit an office or aid petition matching the grievance. It requires the ruler’s agreement and fulfilment."
 lam_cr_approach_title: "A sidelined faction seeks renewed favour"
 lam_cr_obstruct_title: "Court patronage has provoked political opposition"
 lam_cr_coalition_title: "An Alliance Against Dominance"
 lam_cr_coalition_desc: "[lam_pr_reactor.GetShortUIName] proposes an alliance to balance the favoured faction at court."
 lam_cr_coalition_accept: "We will stand together."
 lam_cr_coalition_decline: "Our paths are separate."
 lam_cr_coalition_formed: "Sidelined factions have formed an alliance"
 lam_cr_coalition_refused: "The alliance proposal was refused"
 lam_cr_competition_opinion: "Competing for court patronage"
 lam_cr_person_name: "[Character.GetFirstNameNoTooltip] · [Character.MakeScope.ScriptValue('lam_cr_influence_value')|0]"
 lam_cr_status_active: "Council pending: for [Character.MakeScope.Var('lam_cr_yes').GetValue|0] / eligible [Character.MakeScope.Var('lam_cr_total').GetValue|0]"
 lam_cr_status_passed: "Last council: approved"
 lam_cr_status_rejected: "Last council: rejected"
 lam_cr_status_cancelled: "Last council: cancelled"
 lam_cr_status_none: "No council pending"
 lam_cr_split_no_seat: "The dissenters could not secure a place for an independent faction"
 lam_cr_split_title: "The Dissenters Break Away"
 lam_cr_split_desc: "After repeated disputes, [lam_cr_split_head.GetShortUIName] has founded a separate faction. Your vote against the proposal does not oblige you to leave. Choose where to stand."
 lam_cr_split_follow: "Join the new faction."
 lam_cr_split_stay: "I will remain."
 lam_cr_withdraw_interaction: "Propose withdrawal of court-party support"
 lam_cr_withdraw_interaction_desc: "Ask the council whether to withdraw official support for the ruler."
 lam_cr_ballot_interaction: "Vote in the pending faction council"
 lam_cr_ballot_interaction_desc: "Reopen your unanswered ballot without extending its deadline."
 lam_cr_issue_court: "\nAgenda: Accept the court-party offer. Support persists without routine renewal votes."
 lam_cr_issue_heir: "\nAgenda: Select [lam_vt_new.GetShortUIName] as the supported claimant."
 lam_cr_issue_crown: "\nAgenda: Continue supporting the former claimant against the new ruler. Rejection ends that support."
 lam_cr_issue_rise: "[lam_cr_head.Custom('LamPbCouncilText')]"
 lam_cr_issue_deal: "\nAgenda: Accept the proposed bargain. Rewards and obligations are enacted only after approval."
 lam_cr_issue_merge: "\nAgenda: Merge into the proposed faction. Rejection preserves our independent organization.\nTarget: [lam_vt_new.GetShortUIName]’s faction. Vote yes and you go with it; vote no or abstain and you stay unaligned."
 lam_cr_issue_confidence: "\nAgenda: Replace the head. Yes means replacement; no retains the incumbent. The incumbent has no vote.\nProposed replacement: [lam_vt_new.GetShortUIName]."
 lam_cr_issue_ban: "\nAgenda: Defy the ban and go underground. Rejection accepts dissolution."
 lam_cr_issue_dissolve: "\nAgenda: Dissolve under the ban. Requires two thirds; rejection keeps the faction underground."
 lam_cr_issue_withdraw: "\nAgenda: Withdraw court-party support, with a five-year bar on reappointment."
 lam_cr_issue_loyal: "\nAgenda: Adopt a loyal course."
 lam_cr_issue_oppose: "\nAgenda: Adopt an opposition course."
 lam_cr_issue_arm: "\nAgenda: Prepare military pressure. An actual rising requires a separate supermajority."
 lam_cr_issue_watch: "\nAgenda: Watch the ruler without committing."
 lam_cr_issue_quiet: "\nAgenda: Restrain public action."
 lam_cr_issue_people: "\nAgenda: End the head's imposed posture and follow the members' inclinations."
 lam_cr_term_give_seat: "\nRuler offers: Promise a council seat"
 lam_cr_term_give_marriage: "\nRuler offers: Promise a marriage"
 lam_cr_term_give_county: "\nRuler offers: Grant a county"
 lam_cr_term_give_gold: "\nRuler offers: Fund the faction"
 lam_cr_term_give_bribe: "\nRuler offers: Bribe the head"
 lam_cr_term_give_law: "\nThe ruler concedes: lower realm authority"
 lam_cr_term_give_heir: "\nRuler offers: Designate the faction candidate"
 lam_cr_term_give_amnesty: "\nRuler offers: Amnesty for the faction"
 lam_cr_term_ask_oath: "\nFaction agrees: An oath of loyalty"
 lam_cr_term_ask_heir: "\nFaction agrees: Support the ruler’s heir"
 lam_cr_term_ask_disband: "\nFaction agrees: Dissolve the faction"
 lam_cr_term_ask_counter: "\nFaction agrees: Counter a rival faction"
 lam_cr_term_ask_arms: "\nFaction agrees: Military cooperation"
 lam_cr_term_ask_law_support: "\nFaction agrees: Support changes in law"
 lam_cr_term_ult_oath: "\nThe ruler pays gold in return for a five-year oath against rising."
