l_english:
 vtf_shelter_decision:0 "Fund Thornfall Sanctuaries"
 vtf_shelter_decision_desc:0 "Spend 50 gold to maintain shelter and work for freed households for five years. Successful fugitives within diplomatic range will prefer these courts. The capital gains popular opinion and development growth."
 vtf_shelter_decision_tooltip:0 "Spend 50 gold to maintain shelter and work for freed households for five years. Successful fugitives within diplomatic range will prefer these courts. The capital gains popular opinion and development growth."
 vtf_shelter_decision_confirm:0 "Proceed"
 vtf_reform_decision:0 "Support Cassian's Reform"
 vtf_reform_decision_desc:0 "Send 100 gold and a public endorsement to Cassian. This supports his authority and relief efforts, but angers opponents of reform. Thornfall can organize one such regional contribution every five years. His existing conditions for imperial abolition still apply."
 vtf_reform_decision_tooltip:0 "Send 100 gold and a public endorsement to Cassian. This supports his authority and relief efforts, but angers opponents of reform. Thornfall can organize one such regional contribution every five years. His existing conditions for imperial abolition still apply."
 vtf_reform_decision_confirm:0 "Proceed"
 vtf_patrol_decision:0 "Protect the Free Roads"
 vtf_patrol_decision_desc:0 "Spend 60 gold on three years of protection in one personally held Thornfall county. Clear bandits, reduce travel danger and protect refugees from kidnappers."
 vtf_patrol_decision_tooltip:0 "Spend 60 gold on three years of protection in one personally held Thornfall county. Clear bandits, reduce travel danger and protect refugees from kidnappers."
 vtf_patrol_decision_confirm:0 "Proceed"
 vtf_petition_decision:0 "Petition for Manumission"
 vtf_petition_decision_desc:0 "Spend 25 gold to send advocates to a slaveholding ruler within diplomatic range. The ruler may release the enslaved people in their court or reject our petition. Imprisoned people and pending sales are excluded."
 vtf_petition_decision_tooltip:0 "Spend 25 gold to send advocates to a slaveholding ruler within diplomatic range. The ruler may release the enslaved people in their court or reject our petition. Imprisoned people and pending sales are excluded."
 vtf_petition_decision_confirm:0 "Proceed"
 vtf.1.t:0 "The Road to Freedom"
 vtf.1.desc:0 "A small party waits at a Thornfall crossroads. They carry letters of freedom, but fear that armed pursuers will disregard them. Beyond the milestone, a local watch has promised to hear their case."
 vtf.1.0:0 "Pay for their escort to the watch."
 vtf.1.1:0 "Accompany them and challenge anyone who interferes."
 vtf.1.2:0 "Point them toward the nearest sanctuary."
 vtf.2.t:0 "Hunters on the Free Roads"
 vtf.2.desc:0 "Armed men have stopped a wagon ahead. They claim to be recovering stolen property; the people inside insist they are free. In Thornfall, such claims grant no right to seize a person."
 vtf.2.0:0 "Call the road watch."
 vtf.2.1:0 "Drive the kidnappers away."
 vtf.2.2:0 "Take the wagon with us to the next settlement."
 vtf.3.t:0 "Bandits Behind the Petitions"
 vtf.3.desc:0 "The people of [scope:vtf_site.GetNameNoTier] report missing wagons and strangers demanding proof of freedom. Some are common robbers; others sell their captives beyond Thornfall. The ban means little if the roads belong to them."
 vtf.3.0:0 "Fund a sweep of the roads."
 vtf.3.1:0 "Lead the patrol myself."
 vtf.3.2:0 "We cannot reach every road this season."
 vtf.10.t:0 "A Petition from Thornfall"
 vtf.10.desc:0 "[scope:vtf_petitioner.GetTitledFirstName] has sent advocates asking me to free the enslaved people in my court. They cite Thornfall's example and offer public recognition for an act of manumission. The choice remains mine."
 vtf.10.0:0 "Let the people of my court go free."
 vtf.10.1:0 "Reject the petition."
 vtf.11.t:0 "The Petition Bears Fruit"
 vtf.11.desc:0 "[scope:vtf_slaveholder.GetTitledFirstName] has accepted our advocates' petition and freed the eligible enslaved people of their court. Their realm has not yet outlawed slavery, but these acts of freedom are real."
 vtf.11.0:0 "Let this example travel farther."
 vtf.12.t:0 "Thornfall Stands with Reform"
 vtf.12.desc:0 "[scope:vtf_patron.GetTitledFirstName] has sent one hundred gold and a public pledge of support. Thornfall's free courts give my reforms a living example. The contribution strengthens relief efforts and my authority, though the holders of slave estates resent it."
 vtf.12.0:0 "We must make their support count."
 vtf.13.t:0 "A Hearth Beyond Bondage"
 vtf.13.desc:0 "Our funded sanctuaries can now offer lodging and work to people who escape bondage. Their safety rests on Thornfall's law and on keeping the roads open. This commitment will last five years."
 vtf.13.0:0 "Let them build lives of their own."
 vtf.14.t:0 "The Free Roads Are Watched"
 vtf.14.desc:0 "The patrols of [scope:vtf_site.GetNameNoTier] have their orders: keep the roads open, clear the robbers and recognize no claim of ownership over a person. Their wages are funded for three years."
 vtf.14.0:0 "Freedom must reach beyond the court."
 vtf.15.t:0 "The Advocates Return Empty-Handed"
 vtf.15.desc:0 "[scope:vtf_slaveholder.GetTitledFirstName] has rejected our petition. The advocates were heard, but no one was released. We will need another opportunity to persuade this court."
 vtf.15.0:0 "We will not forget them."
 vtf_petition_available:0 "A slaveholding ruler within diplomatic range holds people eligible for manumission"
