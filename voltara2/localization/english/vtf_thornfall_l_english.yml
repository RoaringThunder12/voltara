 vtf_reformer_opinion:0 "Supported My Reforms"
 vtf_slavery_tooltip:0 "#T Slavery is banned in Thornfall#!\nThornfall's free-soil charter protects its rulers and their vassals even when the imperial law permits slavery. Slave trading and forced labor are prohibited. Enslaved people held by these courts are freed through the shared emancipation system."
