 vt_weave_rift_host:0 "Host of the Fractured Weave"
 voltara_weave_desc:0 "The Weave binds every realm of Voltara. Death, belief, violence, and mercy draw its threads toward Aeliun or Khaos. Neither ascendancy is permanent."
 vt_weave_balance_readout:0 "Balance: [GetGlobalVariable('vt_weave_balance').GetValue|1]  (−100 to +100)"
 vt_weave_balance_labels:0 "Aeliun / Order                  Balance                  Khaos"
 vt_weave_balance_explanation:0 "The score updates monthly. At −30 Order ascends; at +30 Khaos rises. Natural deaths favour Order; violent deaths favour Khaos. Killing demons or necromancers favours Order. Conversions, rites and choices also shift the balance. Use Read the Weave for the latest contributions."
 vt_weave_balanced_desc:0 "The powers check one another. Settlements prosper and the strain on living minds eases."
 vt_weave_order_phase_desc:0 "Order steadies the world. Sanctuary and peaceful life flourish, but excessive rigidity can disrupt Threadcraft just as chaos can."
 vt_weave_chaos_desc:0 "The binding frays. Demons may invade Aeliunist counties, forbidden study spreads, and Threadcraft aptitude becomes unstable."
