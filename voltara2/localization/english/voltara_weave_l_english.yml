l_english:
 voltara_weave.1.t:0 "The Weave"
 voltara_weave.1.desc:0 "Across Voltara, every life is a thread. Aeliun binds those threads into a lasting pattern; Khaos pulls them apart and makes new shapes possible. Neither power ever truly sleeps.\n\nBalance: #V [GetGlobalVariable('vt_weave_balance').GetValue|1]#! (−100 Aeliun; +100 Khaos).\nLast month: deaths [GetGlobalVariable('vt_weave_last_deaths').GetValue|1], conversions [GetGlobalVariable('vt_weave_last_conversions').GetValue|1], rites and choices [GetGlobalVariable('vt_weave_last_rituals').GetValue|1].\n\nAt −30 Order ascends; at +30 Khaos rises. Natural deaths favour Order, violence favours Khaos, and killing demons or necromancers favours Order. Extreme imbalance can alter Threadcraft. The score updates monthly."
 voltara_weave.1.a:0 "The pattern reaches every realm."
 voltara_weave.10.t:0 "The Last Thread"
 voltara_weave.10.desc:0 "A bell sounds for a commoner who died peacefully in their sleep. The family cannot afford the customary vigil. The priest asks whether the household of a ruler will honour a life that brought it neither taxes nor glory."
 voltara_weave.10.a:0 "Pay for a vigil open to everyone."
 voltara_weave.10.b:0 "Let the family keep a quiet vigil."
 voltara_weave.11.t:0 "A Fraying Sanctuary"
 voltara_weave.11.desc:0 "The sanctuary lamps burn blue. Frightened attendants report that the same crack has appeared in every door lintel. Wardens can renew the binding, but only if the treasury supplies silver and clean oil."
 voltara_weave.11.a:0 "Renew the wards."
 voltara_weave.11.b:0 "Demand that the priests solve it themselves."
 voltara_weave.12.t:0 "The Measure and the Mercy"
 voltara_weave.12.desc:0 "A teacher argues that Aeliun asks for a measured life, not a world without curiosity. Older clerics want the lecture stopped. Artisans and students await your judgment."
 voltara_weave.12.a:0 "Protect the lecture and its scholars."
 voltara_weave.12.b:0 "Commission a charitable house instead."
 voltara_weave.12.c:0 "Leave the dispute to the clerics."
 voltara_weave.20.t:0 "A Coal That Will Not Cool"
 voltara_weave.20.desc:0 "An ember from an abandoned shrine whispers without consuming its fuel. Your devotees call it a fragment of Khaos, promising strength to whoever will loosen the binding around it."
 voltara_weave.20.a:0 "Feed it silver and speak the forbidden names."
 voltara_weave.20.b:0 "Seal the ember; change need not devour us."
 voltara_weave.21.t:0 "The Unwritten Covenant"
 voltara_weave.21.desc:0 "A wandering Threadbinder offers to loosen the pattern that has fixed your household into its present fortunes. The rite demands wealth and leaves its participants exhausted. Its promise is freedom, but freedom from what?"
 voltara_weave.21.a:0 "I will pay the price."
 voltara_weave.21.b:0 "Offer the wanderer shelter, but no victims."
 voltara_weave.21.c:0 "Send them away."
 voltara_weave.22.t:0 "The Dead at the Threshold"
 voltara_weave.22.desc:0 "Your followers hear voices beneath the burial stones. Some demand that you call those voices into service. Others warn that even an Unbound soul deserves an end."
 voltara_weave.22.a:0 "Study the voices without binding them."
 voltara_weave.22.b:0 "Let the dead finish their journey."
 voltara_weave.23.t:0 "A Voice Beyond the Last Breath"
 voltara_weave.23.desc:0 "The boundary between breath and silence has become thin. You can feel a departing soul catch on the threads around you. With study, you might learn to hold it there. The opportunity is real; so is the cost of becoming known as a necromancer."
 voltara_weave.23.a:0 "I will master the forbidden art."
 voltara_weave.23.b:0 "Release the soul."
 voltara_weave.30.t:0 "A Clearer Thread"
 voltara_weave.30.desc:0 "For a moment, the pattern of the world becomes painfully clear. A knot that once resisted your touch loosens. The unsettled Weave has strengthened your Threadcraft aptitude."
 voltara_weave.30.a:0 "I can feel the difference."
 voltara_weave.31.t:0 "The Slipping Thread"
 voltara_weave.31.desc:0 "A familiar thread slips through your thoughts. The power has not vanished from the world, but your grasp of it has weakened. The unsettled Weave has diminished your Threadcraft aptitude."
 voltara_weave.31.a:0 "I must learn to work around this."
 voltara_weave.40.t:0 "Ash on the Wind"
 voltara_weave.40.desc:0 "Fine grey ash falls from a cloudless sky. Villagers fear the Weave is fraying. Whatever the priests call it, frightened people still need food, shelter, and someone willing to listen."
 voltara_weave.40.a:0 "Open the storehouses."
 voltara_weave.40.b:0 "Keep watch and preserve our supplies."
 voltara_weave.50.t:0 "A Wound in the Weave"
 voltara_weave.50.desc:0 "In [scope:vt_weave_target.GetNameNoTier], a tear in the unseen pattern has opened. A demonic host has crossed into the world and laid claim to the county. This is no distant omen: its banners are already marching."
 voltara_weave.50.a:0 "Summon the defenders."
 vt_weave_consult:0 "Read the Weave"
 vt_weave_consult_desc:0 "Study the balance between Aeliun and Khaos, and the forces that changed it last month."
 vt_weave_consult_tooltip:0 "Study the balance between Aeliun and Khaos, and the forces that changed it last month."
 vt_weave_consult_confirm:0 "Proceed"
 vt_weave_ward:0 "Renew the Wards of Aeliun"
 vt_weave_ward_desc:0 "Pay for vigils, sanctuary wards, and the proper burial of the dead. This strengthens Order."
 vt_weave_ward_tooltip:0 "Pay for vigils, sanctuary wards, and the proper burial of the dead. This strengthens Order."
 vt_weave_ward_confirm:0 "Proceed"
 vt_weave_bargain:0 "Offer an Ember to Khaos"
 vt_weave_bargain_desc:0 "Fund a forbidden rite to loosen the local pattern. Gain strength at the cost of a less stable Weave."
 vt_weave_bargain_tooltip:0 "Fund a forbidden rite to loosen the local pattern. Gain strength at the cost of a less stable Weave."
 vt_weave_bargain_confirm:0 "Proceed"
 vt_weave_reconcile:0 "Mend the Fraying Weave"
 vt_weave_reconcile_desc:0 "Bring scholars, healers, and Threadbinders together to mend the fraying pattern. Move the Weave four points toward Aeliun and Balance."
 vt_weave_reconcile_tooltip:0 "Bring scholars, healers, and Threadbinders together to mend the fraying pattern. Move the Weave four points toward Aeliun and Balance."
 vt_weave_reconcile_confirm:0 "Proceed"
