l_english:
 dhm_v080_match_reason_bond_desc:0 "#high An existing bond:#! [dhm_marriage_subject.GetShortUIName] already knows and trusts [dhm_marriage_candidate.GetShortUIName]. Affection helps, but it cannot promise an easy marriage."
 dhm_v080_match_reason_alliance_desc:0 "#high A useful alliance:#! [dhm_marriage_candidate.GetShortUIName] brings rank or ties to a ruling family, as you ordered."
 dhm_v080_match_reason_claim_desc:0 "#high A useful claim:#! [dhm_marriage_candidate.GetShortUIName] carries a claim, fitting your order to seek one."
 dhm_v080_match_reason_bloodline_desc:0 "#high An inherited gift:#! [dhm_marriage_candidate.GetShortUIName] bears a strong inheritable quality, fitting your bloodline order."
 dhm_v080_match_reason_same_culture_desc:0 "#high Shared customs:#! Both were raised in the same culture, as you asked."
 dhm_v080_match_reason_compatibility_desc:0 "#high A sounder beginning:#! Shared faith, culture, or affection gives this pair useful common ground."
 dhm_v080_match_reason_dynasty_desc:0 "#high A dynastic match:#! [dhm_marriage_candidate.GetShortUIName] belongs to a dynasty and may have children with [dhm_marriage_subject.GetShortUIName], fitting your order to protect the family line."
 dhm_v080_match_reason_bounded_desc:0 "#high The steward's search:#! Among the lawful matches within diplomatic reach, this was the strongest name your steward found."
 dhm_v080_match_shared_customs_desc:0 "They also share faith and culture, sparing them two common sources of household strain."
 dhm_v080_match_warning_personal_desc:0 "#N Warning:#! the household notes mistrust or open dislike between them. Rank and parchment cannot warm a hostile hearth."
 dhm_v080_match_warning_faith_desc:0 "#N Warning:#! their faiths differ. The marriage is lawful, but worship, children, and family expectations may still cause strain."
 dhm_v080_match_warning_culture_desc:0 "#N Warning:#! their customs differ. The match may broaden the house, but daily life will ask patience from both spouses."
 dhm_v080_match_warning_none_desc:0 "No serious personal warning appears in the household notes, though no steward can promise what marriage will become."
 dhm_v080_officer_reason_skill_desc:0 "#high Why this name was brought forward:#! The steward chose [dhm_office_candidate.GetShortUIName] for the skill this office uses."
 dhm_v080_officer_warning_rival_desc:0 "#N Warning:#! [dhm_office_candidate.GetShortUIName] is your rival. Even a small disagreement may become a struggle for influence."
 dhm_v080_officer_warning_weak_desc:0 "#N Warning:#! [dhm_office_candidate.GetShortUINamePossessive] skill for this office is below 10. The harder duties may test [dhm_office_candidate.GetHerHim]."
 dhm_v080_officer_warning_none_desc:0 "No grave concern is written beside the name. Skill still does not guarantee loyalty."
