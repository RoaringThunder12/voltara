 voltara_colonial_government: "Communal Republic"
 communal_republic_government_with_icon: "@government_type_communal_republic! $voltara_colonial_government$"
 communal_republic_government_adjective: "Communal Republic"
 communal_republic_government_realm: "Communal Republic Realm"
 communal_republic_government_vassals_label: "Republican [obligations|E] are based on each [vassal|E]'s [vassal_contract|E]"
 communal_republic_government_desc: "$game_concept_communal_republic_desc$\n\n#F The commune runs itself, or so the statutes claim. Councils rotate, ballots are cast, and the same officials return in new robes. No one rules, yet decisions arrive as if agreed in advance. Influence moves quietly through guilds, favors, and well-timed silences. All is orderly. No names on monuments, only signatures on grain permits.#!"
 COMMUNAL_REPUBLIC: "[Concept('communal_republic','@government_type_communal_republic!')|E] [Character.GetGovernment.GetAdjective] [realm|E]"
 veche_republic_government_desc: "#size:18;L @government_type_communal_republic! Veche Republic#!\n$game_concept_communal_republic_desc$\n\n#F The Veche governed by voice, loudest wins unless the scribes were deaf that week. Councils were open to all, except those not invited. Elders rotated regularly, often in circles, sometimes in coffins. Laws were passed with great ceremony and ignored with greater speed. Guilds traded favors like coin; coin was traded for silence. Power, officially absent, could be smelled in the bread. Statues were forbidden, too permanent. Decisions preferred to evaporate.#!"
 VECHE_REPUBLIC: "[Concept('communal_republic','@government_type_communal_republic!')|E] #tooltip:veche_republic_government_desc #L Veche Republic#!#! [realm|E]"

