 merchant_republic_government_desc: "$game_concept_merchant_republic_desc$\n\n#F Mist drifts across the canals as the Merchant Republic roars, a living organism of trade and ambition. Ships creak like prayers, and merchants count their ledgers by candlelight, invoking order from divine indifference. Time seeps into stone and parchment; prosperity and decay clash like the tide. In this thunder of creation lies the paradox of man, building eternity from the fleeting shimmer of gold and salt.#!"
