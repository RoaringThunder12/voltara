l_english:
 dhm_v080_courtship_lapsed_close:0 "Put These Papers Away"
 dhm_v080_courtship_lapsed_close_tt:0 "Circumstances have already ended these talks. The clerk clears the old note; #P no refusal or new waiting period is added#!."
 dhm_v080_auto_scan_story_window:0 "Another household matter is already on its way to your door, so the steward has left the marriage rolls closed for the moment. Return after it has passed.\n\n#P No matchmaking pass was run, and your 30-day review was not spent.#!"
 dhm_v080_auto_scan_story_report:0 "\n\n#high No new pass was run: another household matter is already due.#! #P The manual review remains ready.#!"
 dhm_v080_auto_scan_story_menu:0 "\n\n#high No new review was run: another household matter is already due.#! #P The 30-day review remains ready.#!"

 # Memories returning in later household scenes.
 dhm_v080_relative_letter_history_desc:0 "Before sealing the letter, [dhm_story_relative.GetFirstName] adds a familiar mark—the same one used in an earlier exchange between you."
 dhm_v080_school_pair_history_desc:0 "[dhm_story_child.GetFirstName] glances toward [dhm_story_tutor.GetFirstName]. Both remember the lesson that once carried them through a difficult hour."
 dhm_v080_union_reconciliation_history_desc:0 "This is not the first breach [dhm_story_relative.GetFirstName] and [dhm_story_spouse.GetFirstName] have mended. Neither has forgotten what that earlier peace required."
 dhm_v080_dispute_pair_history_desc:0 "[dhm_dispute_first.GetFirstName] and [dhm_dispute_second.GetFirstName] have stood on opposite sides before—and once found their way back."
 dhm_v080_officer_rivalry_history_desc:0 "The edge in their voices is an old one. [dhm_officer_first.GetFirstName] and [dhm_officer_second.GetFirstName] have carried this rivalry through earlier service."
 dhm_v080_partner_promise_history_desc:0 "[dhm_partner_spouse.GetFirstName] lowers [dhm_partner_spouse.GetHerHis] voice. 'We have given our word to this household before. I have not forgotten yours.'"
 dhm_v080_crisis_union_history_desc:0 "They have survived such a season once before. The memory of that reconciliation hangs between them: proof that peace is possible, and that it has a price."

 # A remembered reconciliation opens a costly, more dependable route.
 dhm_v080_dispute_remembered_option:0 "Remind Them of the Peace They Chose Before"
 dhm_v080_dispute_remembered_tt:0 "#N You gain Stress and lose Prestige.#! #P Both relatives make peace again, and Household Cohesion rises slightly.#! The matter returns in two years."
 dhm_v080_memory_context_changed_tt:0 "The people or bond remembered are gone. Nothing more is gained or lost, and no later matter follows."

 # Quiet conclusions: compact feedback, with the same consequences as the old full events.
 dhm_v080_officer_progress_title:0 "Word from Your Officer"
 dhm_v080_officer_progress_trust_desc:0 "[dhm_story_officer.GetFirstName] sends word: 'The work is going well, my liege. Thank you for trusting me.'\n\n#P Counsel Worth Hearing is granted or preserved; it does not stack with an existing award.#! #N You gain a little Stress.#!"
 dhm_v080_officer_progress_audit_desc:0 "The accounts arrive with [dhm_story_officer.GetFirstName]'s seal. Your close watch has kept the work in order, though it has worn [dhm_story_officer.GetHerHim] down.\n\n#P You gain Prestige.#! #N [dhm_story_officer.GetFirstNameNoTooltip] gains Stress.#!"
 dhm_v080_officer_progress_credit_desc:0 "[dhm_story_officer.GetFirstName] writes: 'You gave me the credit, my liege. I will not forget it.' The work has prospered, and some of that good name returns to you.\n\n#P You gain Prestige; [dhm_story_officer.GetFirstNameNoTooltip] loses a little Stress.#!"
 dhm_v080_officer_progress_unknown_desc:0 "A report arrives from [dhm_story_officer.GetFirstName], but the clerk cannot find your earlier instructions. Nothing is gained or lost."
 dhm_v080_officer_success_title:0 "An Officer Proves Their Worth"
 dhm_v080_officer_success_remembered_desc:0 "[dhm_story_officer.GetFirstName] has proved that your earlier trust was well placed.\n\n#P You gain Prestige and become known for Proven Household Service; [dhm_story_officer.GetFirstNameNoTooltip] gains loyalty.#! #N The burden of public praise gives you a little Stress.#!"
 dhm_v080_officer_success_desc:0 "[dhm_story_officer.GetFirstName] has brought the work entrusted to [dhm_story_officer.GetHerHim] to a worthy end.\n\n#P You gain Prestige and become known for Proven Household Service; [dhm_story_officer.GetFirstNameNoTooltip] gains loyalty.#! #N The burden of public praise gives you a little Stress.#!"
 dhm_v080_officer_setback_title:0 "An Officer Falls Short"
 dhm_v080_officer_setback_remembered_desc:0 "Past service could not save [dhm_story_officer.GetFirstName]'s present task from failure.\n\n#N You lose Prestige; [dhm_story_officer.GetFirstNameNoTooltip] loses loyalty and gains a little Stress.#! #P Letting the matter end eases a little of your Stress.#!"
 dhm_v080_officer_setback_desc:0 "The work entrusted to [dhm_story_officer.GetFirstName] has ended poorly.\n\n#N You lose Prestige; [dhm_story_officer.GetFirstNameNoTooltip] loses loyalty and gains a little Stress.#! #P Letting the matter end eases a little of your Stress.#!"
 dhm_v080_letter_aid_title:0 "Aid Remembered"
 dhm_v080_letter_aid_desc:0 "[dhm_story_relative.GetFirstName] writes that your aid arrived when it was needed most.\n\n#P You gain Prestige and become known as a Patron of the Household; [dhm_story_relative.GetFirstNameNoTooltip] gains Opinion of you and loses Stress.#!"
 dhm_v080_letter_counsel_title:0 "Counsel Remembered"
 dhm_v080_letter_counsel_desc:0 "[dhm_story_relative.GetFirstName] writes that your counsel steadied [dhm_story_relative.GetHerHim] when doubt set in.\n\n#P You gain Prestige and a reputation for Counsel Worth Hearing; [dhm_story_relative.GetFirstNameNoTooltip] gains Opinion of you and loses Stress.#!"
 dhm_v080_letter_unknown_title:0 "A Faded Reply"
 dhm_v080_letter_unknown_desc:0 "An old reply from [dhm_story_relative.GetFirstName] reaches the household, but too much of its meaning has faded. Nothing is gained or lost."
