 vae_titan_archive:0 "The Titan Archive"
 vae_titan_archive_desc:0 "Careful copies of ancient inscriptions support a living school of scholarship."
 vae_broken_anchor:0 "Echoes of a Broken Anchor"
 vae_broken_anchor_desc:0 "Drawing recklessly on a fossilized Weave anchor has left this scholar exhausted."
 vae_pass_compact:0 "The Mountain Compact"
 vae_pass_compact_desc:0 "Negotiated tolls and protected springs keep caravans moving through the passes."
 vae_caravan_watch:0 "Lanterns on the Road"
 vae_caravan_watch_desc:0 "Local watch posts and caravan guides have restored confidence in the road."
 vae_outlaw_tolls:0 "The Red Lantern Toll"
 vae_outlaw_tolls_desc:0 "A ruler profits from a network of smugglers and highway bands."
 vae_shared_weave:0 "The Open Circle"
 vae_shared_weave_desc:0 "Threadbinders of several peoples have agreed to exchange methods without demanding a common faith."
 vae_closed_weave:0 "The Sealed Circle"
 vae_closed_weave_desc:0 "A secretive circle concentrates power around its patron."
 vae_pass_friend:0 "Honored the Mountain Compact"
 vae_pass_refused:0 "Refused the Mountain Compact"
 vae_seek_titan_archive:0 "Seek the Buried Titan Archive"
 vae_seek_titan_archive_desc:0 "Aesaryos remembers the Sundering in broken pillars and bones turned to stone. Sponsor an expedition to a buried observatory and decide whether its legacy belongs to scholars, priests, or those willing to draw on its surviving threads."
 vae_seek_titan_archive_tooltip:0 "Seek the Buried Titan Archive"
 vae_seek_titan_archive_confirm:0 "Begin preparations"
 vae_story.100.t:0 "Beneath the Titan’s Ribs"
 vae_story.100.desc:0 "The observatory was built around a rib of a fallen Titan. Later Giant masons carved their account of the Sundering over older Elven diagrams. A trembling light remains beneath the stone. My expedition cannot carry everything home."
 vae_story.100.a:0 "Copy the inscriptions; disturb nothing."
 vae_story.100.b:0 "Draw a thread from the sleeping anchor."
 vae_story.100.c:0 "Leave offerings and establish a shrine."
 vae_story.101.t:0 "The Record of the First Descendants"
 vae_story.101.desc:0 "The returned tablets describe Titans diminished into Giants, and Giants diminished into humanity after the Sundering. The account is incomplete; its margins bear the corrections of generations of scholars. There is enough here to found a school—or sell a collection."
 vae_story.101.a:0 "Let a new generation study these fragments."
 vae_story.101.b:0 "A private collector can fund my next undertaking."
 vae_story.102.t:0 "A Thread That Still Remembers"
 vae_story.102.desc:0 "For a moment the cavern answers with a voice too vast to be language. The Titan was a living anchor of the Weave. Whatever remains is neither tame nor inexhaustible. I can bind a fragment, or let it pass through me."
 vae_story.102.a:0 "Bind it, despite the danger."
 vae_story.102.b:0 "Release it, and record what I felt."
 vae_negotiate_passes:0 "Negotiate a Mountain Compact"
 vae_negotiate_passes_desc:0 "The Stoneborn forges and Naga spring-keepers can make a mountain road profitable—or impassable. Propose a reciprocal compact to a neighboring clan. Its ruler can accept or refuse; the agreement grants trade benefits, not allegiance."
 vae_negotiate_passes_tooltip:0 "Negotiate a Mountain Compact"
 vae_negotiate_passes_confirm:0 "Begin preparations"
 vae_story.200.t:0 "Iron and Living Water"
 vae_story.200.desc:0 "A pass needs more than soldiers. Stoneborn galleries hold the slopes together; Naga channels keep the high springs flowing. A neighboring clan may share these burdens, if I offer terms worth honoring."
 vae_story.200.a:0 "Send an offer of shared tolls and protected springs."
 vae_story.200.b:0 "The moment has passed; recover what we can."
 vae_story.201.t:0 "A Compact Across the Pass"
 vae_story.201.desc:0 "[scope:vae_envoy.GetTitledFirstName] proposes shared tolls, safe passage for merchants, and protection for the springs and galleries. Neither realm would surrender its independence. The offer asks that each of us trust the other for three years."
 vae_story.201.a:0 "Our roads will stand together."
 vae_story.201.b:0 "Our passes are our own."
 vae_story.202.t:0 "The Passes Open"
 vae_story.202.desc:0 "The clan has accepted. Marked caravans may cross the galleries and draw from the protected springs. Merchants are already arranging their first joint train."
 vae_story.202.a:0 "Let both peoples profit."
 vae_story.203.t:0 "A Closed Gate"
 vae_story.203.desc:0 "My envoys return without an agreement. The clan will keep its own tolls and guard its own springs. Trade may yet find another road."
 vae_story.203.a:0 "We will seek another route."
 vae_lantern_roads:0 "Settle the Lantern Roads"
 vae_lantern_roads_desc:0 "Smugglers, toll-keepers, and caravan guards dispute the old roads. Decide whether to suppress the bands, bring them into lawful service, or rule through them."
 vae_lantern_roads_tooltip:0 "Settle the Lantern Roads"
 vae_lantern_roads_confirm:0 "Begin preparations"
 vae_story.300.t:0 "The Red Lantern at the Crossroads"
 vae_story.300.desc:0 "A red lantern hangs above the road: a promise of safe passage to those who pay, and a warning to those who do not. The bands are no single army. Some are hungry villagers; others have made a profession of their knives."
 vae_story.300.a:0 "Break their camps and reopen the road."
 vae_story.300.b:0 "Pay guides and guards to become a lawful watch."
 vae_story.300.c:0 "Let the lantern burn in my name."
 vae_story.301.t:0 "The Last Tollgate"
 vae_story.301.desc:0 "The fortified tollgate has fallen. The surviving bandits offer their knowledge of the tracks in return for mercy. Their victims ask for restitution."
 vae_story.301.a:0 "Return the plunder and settle the survivors."
 vae_story.301.b:0 "The best of them will serve as scouts."
 vae_story.302.t:0 "Empty Camps, Cut Ropes"
 vae_story.302.desc:0 "The bands knew the gullies better than my soldiers. Bridges were cut behind us and the camps were empty. The expedition returns with little but a lesson in the cost of ruling these roads."
 vae_story.302.a:0 "Treat the wounded and learn the routes."
 vae_story.302.b:0 "Pay their price this time."
 vae_gather_threadbinders:0 "Gather the Many-Handed Circle"
 vae_gather_threadbinders_desc:0 "Invite practitioners from Aesaryos’s human courts, Giant halls, Deep Elf schools, and mountain clans. Their traditions disagree on almost everything except the danger of drawing too deeply from the Weave."
 vae_gather_threadbinders_tooltip:0 "Gather the Many-Handed Circle"
 vae_gather_threadbinders_confirm:0 "Begin preparations"
 vae_story.400.t:0 "Many Hands, One Weave"
 vae_story.400.desc:0 "The Giant measures a spell by its resonance in stone. The Naga listens for the rhythm of water; the Stoneborn tests an alloy; the Deep Elf asks which part of the pattern we have failed to see. They can build a school together, or become instruments of my private ambition."
 vae_story.400.a:0 "Knowledge should pass between peoples."
 vae_story.400.b:0 "Their secrets will strengthen my court."
 vae_story.400.c:0 "Study how to mend, rather than how to draw more."
 vae_story.401.t:0 "An Apprentice Between Worlds"
 vae_story.401.desc:0 "A young practitioner asks to remain after the gathering. No school will claim exclusive authority over the new circle. I may offer a place to a scholar from the mountain clans, or to an itinerant Deep Elf."
 vae_story.401.a:0 "Welcome a Stoneborn runesmith."
 vae_story.401.b:0 "Welcome a Naga spring-reader."
 vae_story.401.c:0 "Welcome a Deep Elf scholar."
 vae_story.401.d:0 "Let them travel with our letters of introduction."
