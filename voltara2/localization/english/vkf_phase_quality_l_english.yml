l_english:
 vkf_frontier_situation_vkf_phase_1_situation_phase_desc:0 "Separate campfires mark a divided homeland. No invasion leader holds the banners, unity is below 30, and hostility is below 35. Independent chiefs can gather neighbors; the Keepers can patrol or negotiate."
 vkf_phase_actions_1:0 "The Scattered Clans — Opportunities"
 situation_parameter_vkf_clan_phase_1:0 "Independent chiefs can Gather the Southron Chiefs. Regional subjects can negotiate grazing access and answer invitations; they must become independent before proclaiming their own mandate."
 situation_parameter_vkf_keeper_phase_1:0 "The Keeper commander can choose a frontier policy and contact coastal chiefs through the expedition interaction. The Crown can respond to requests for funding."
 vkf_frontier_situation_vkf_phase_2_situation_phase_desc:0 "Burned camps and border raids deepen old grievances. Hostility is at least 35, but unity remains below 30 and no invasion leader has emerged. Victims can seek compensation or gather allies; Keeper restraint can lower tensions."
 vkf_phase_actions_2:0 "The Bloody Frontier — Opportunities"
 situation_parameter_vkf_clan_phase_2:0 "Raided chiefs can demand compensation, seek allies or recover. A grievance can replace the prestige requirement for gathering chiefs."
 situation_parameter_vkf_keeper_phase_2:0 "Expeditions disrupt supplies but raise hostility. Compensation, negotiations and defensive policy can reduce it."
 vkf_frontier_situation_vkf_phase_3_situation_phase_desc:0 "Oaths begin to bridge rivalries. Unity has reached 30 without an invasion title being held. A chief with two independent supporters and a concluded gathering can authorize a founding War Council, provided they can meet its costs."
 vkf_phase_actions_3:0 "The Gathering Banners — Opportunities"
 situation_parameter_vkf_clan_phase_3:0 "Two independent pledges and a concluded gathering unlock a founding War Council. Its closing oath requires 500 prestige and 100 gold. Recognition alone does not transfer land."
 situation_parameter_vkf_keeper_phase_3:0 "Clan cooperation does not itself declare war. The Keepers can continue diplomacy or disrupt coastal preparations."
 vkf_frontier_situation_vkf_phase_4_situation_phase_desc:0 "An invasion leader has been recognized, but the coalition is not yet marching. Its rulers retain their own interests. The leader can host a War Council, seek contributions, prepare a campaign, or negotiate peace."
 vkf_phase_actions_4:0 "The United South — Opportunities"
 situation_parameter_vkf_clan_phase_4:0 "The invasion leader can host the Southron War Council. Other regional rulers can contribute, negotiate oaths and preserve their autonomy."
 situation_parameter_vkf_keeper_phase_4:0 "The Keepers can answer a treaty offer or seek imperial support. The coalition title does not automatically start an invasion."
 vkf_frontier_situation_vkf_phase_5_situation_phase_desc:0 "The coalition is prepared and hostility has reached 50. Its leader has at least 60 supplies, 30 intelligence, 40 cohesion and two committed rulers, with no war or treaty blocking readiness. Launching remains a choice, subject to the target and recovery requirements."
 vkf_phase_actions_5:0 "The March on Kartholos — Opportunities"
 situation_parameter_vkf_clan_phase_5:0 "The leader can choose to launch when all decision requirements are met. Contributions and honored promises sustain readiness; peace remains possible."
 situation_parameter_vkf_keeper_phase_5:0 "The coalition is prepared, but has not attacked. Keeper defense and negotiated peace can still shape the outcome."
 vkf_frontier_situation_vkf_phase_6_situation_phase_desc:0 "The invasion is underway. Victory, defeat, a negotiated peace or an interrupted campaign will decide what follows. The coalition fights for Kartholos; holding its banners does not guarantee that its oaths will survive the war."
 vkf_phase_actions_6:0 "The War for the Strait — Opportunities"
 situation_parameter_vkf_clan_phase_6:0 "The invasion settlement determines captured territory, coalition losses and any treaty. Allies retain obligations and negotiated promises."
 situation_parameter_vkf_keeper_phase_6:0 "Defend the strait. Defeat of the invasion weakens its coalition; a negotiated settlement creates a truce."
 vkf_guide_chief:0 "\n\nThe neighboring camps look to their own leaders first. Use Gather the Southron Chiefs to seek up to three independent supporters. Replies conclude after 65 days. Two pledges can authorize a founding War Council; afterward, the War Council is hosted through Activities."
 vkf_guide_leader:0 "\n\nMy mandate must be sustained. Host a Southron War Council through Activities, prepare supplies and scouts through Prepare the Campaign, and ask sworn chiefs to fulfill their oaths through diplomacy. A treaty with the Keepers or a peaceful union remains an alternative to invasion."
 vkf_guide_keeper:0 "\n\nThe walls are my responsibility. Choose a frontier policy, then contact a coastal independent chief through the frontier expedition interaction to send soldiers or an envoy. The policy menu also offers a request for imperial support."
 vkf_guide_crown:0 "\n\nThe Keepers command their own expeditions. Their requests for imperial support will reach my court; I can fund them, demand restraint as a condition, or refuse. Their raids may unite the very chiefs they aim to weaken."
 vkf_guide_subject:0 "\n\nMy liege does not speak for every interest of my people. I can attend the invasion leader’s War Council if invited and offer contributions through diplomacy. Nomadic rulers can negotiate grazing access. Proclaiming a separate invasion mandate requires independence."
 vkf_intro_title:0 "Between the Camps and the Strait"
 vkf_intro_desc:0 "Beyond the walls of Kartholos, the chiefs weigh old grievances against the needs of their people. A raid may scatter a warband or bring rival camps together. A promise may earn an ally—or become a debt that survives a victory. My choices can shape this frontier."
 vkf_intro_review:0 "Bring me the reports."
 vkf_intro_later:0 "I will consult the frontier reports later."
 vkf_choice_20_0_tt:0 "Recognize this chief for five years. You remain independent; the pledge counts toward their support."
 vkf_choice_20_1_tt:0 "Promise conditional allegiance for five years. You remain independent until asked to fulfill the oath; submission grants promised autonomy."
 vkf_choice_20_2_tt:0 "Decline without making a pledge."
 vkf_choice_150_0_tt:0 "Spend 50 gold for 25 supplies, up to 100."
 vkf_choice_150_1_tt:0 "Spend 30 gold for 15 intelligence, up to 100."
 vkf_choice_150_2_tt:0 "Spend 200 Herd for 30 supplies, up to 100."
 vkf_choice_31_0_tt:0 "With two independent supporters, spend 100 gold and 500 prestige to create the invasion title. This neither annexes supporters nor declares war."
