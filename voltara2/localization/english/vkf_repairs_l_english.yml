 vic_story.89.crown:0 "A reply has arrived from [vic_reply_house.GetTitledFirstName] of [vic_reply_house.GetPrimaryTitle.GetNameNoTier], answering my request to declare a position in the dispute between Cassian and Octavian.\n\nThe ruler pledges support to Cassian and the imperial crown. Political support is not yet a promise to march: if war breaks out, this house must still decide whether to take up arms."
 vic_story.89.opposition:0 "A reply has arrived from [vic_reply_house.GetTitledFirstName] of [vic_reply_house.GetPrimaryTitle.GetNameNoTier], answering my request to declare a position in the dispute between Cassian and Octavian.\n\nThe ruler pledges support to Octavian and his opposition. Political support is not yet a promise to march: if war breaks out, this house must still decide whether to take up arms."
 vic_story.89.neutral:0 "A reply has arrived from [vic_reply_house.GetTitledFirstName] of [vic_reply_house.GetPrimaryTitle.GetNameNoTier], answering my request to declare a position in the dispute between Cassian and Octavian.\n\nThe ruler declines to commit to either side and will remain neutral. Political support is not yet a promise to march: if war breaks out, this house must still decide whether to take up arms."
