l_english:
 vsk_become_seaking:0 "Become King of the Seas"
 vsk_become_seaking_desc:0 "I have mastered the black flag, the hidden road, and the clandestine harbor. Now the captains of Thonia shall acknowledge a sovereign whose dominion reaches every shore. My enemies will pay tribute, or see their ports burn."
 vsk_become_seaking_tooltip:0 "Proclaim dominion over the seas and unlock coastal tributary wars once independent."
 vsk_become_seaking_confirm:0 "Raise my banner over the seas!"
 vsk_eligible:0 "You are an adult Thonian emperor, a Slaver, and a Master Pirate, Master Bandit and Master Smuggler."
 vsk_coastal_realm:0 "The realm contains coastal land."
 trait_vsk_sea_conqueror:0 "King of the Seas"
 trait_vsk_sea_conqueror_desc:0 "A master of piracy, banditry and smuggling, this Thonian sovereign claims tribute from every shore. Can raid regardless of government or faith and wage coastal tributary wars while independent. This personal distinction is not inherited."
 vsk.1.t:0 "King of the Seas"
 vsk.1.desc:0 "The captains gather beneath my banner. Some grew rich by the sword, others by slipping cargo past a sleeping watch; all know what it took to bring them here.\n\nNo single harbor can contain my ambition. From this day, distant rulers will learn that a coast is both a source of wealth and a door I can force open. Those who submit will keep their crowns and pay tribute. Those who resist will meet my crews."
 vsk.1.a:0 "Let every shore know my name."
 vsk_coastal_tribute_cb:0 "Demand Tribute from the Coast"
 vsk_coastal_tribute_cb_name:0 "Coastal Tributary War"
 vsk_coastal_tribute_cb_name_base:0 "Coastal Tributary War"
 vsk_coastal_tribute_cb_war_name:0 "Coastal Tributary War"
