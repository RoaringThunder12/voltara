l_english:
 #Game Concept
 game_concept_merchant_republic:0 "Merchant Republic"
 game_concept_merchant_republic_government:0 "Merchant Republic Government"
 game_concept_merchant_republic_i: "@government_type_merchant_republic!"
 game_concept_merchant_republic_desc:0 "Under the Merchant Republic government, the ruler grants [Concept('merchant','Merchant Families')|E] control over [Concept('trade_value','Trade Routes')|E] and financial districts in exchange for [taxes|E], levies, and political support\n\nMerchant Republics have the following modifiers:\n• [Concept('income','Monthly Income')|E]: #P +10%#! (#N -20%#! during War)\n• [domain_limit|E]: #N -2#!\n• [vassal_limit|E]: #N -10#!\n• [Concept('levy','Levy Size')|E]: #N -25%#!\n• [Concept('garrison','Garrison Size')|E]: #P +20%#!\n• [fort_level|E]: #P +1#!\n• [Concept('embarking','Naval Movement Speed')|E]: #P +20%#!\n• [Concept('knight','Knight Limit')|E]: #N -2#!\n• [Concept('mercenary_company','Mercenary Hire Cost')|E]: #P -20%#!\n• #N -20%#! [Concept('levy','Levy Contribution')|E] and #P +10%#! [Concept('vassal_taxes','Tax Contribution')|E] from [feudal|E], [clan|E] and [administrative|E] [vassals|E]#!"
 
 game_concept_merchant_family: "Merchant Family"
 game_concept_merchant: "Merchant"
 game_concept_merchant_i: "@government_type_merchant_republic!"
 game_concept_merchant_family_desc: "Merchant families are the most powerful and wealthy [houses|E] in a [merchant_republic|E]. They control much of the realm’s economy and play an important role in its [Concept('trade_value','Trade')|E] and politics.\n\nEach merchant family lives in a [family_palace|E], a special home that shows their status and wealth. They also have the right to vote on who will become the next ruler of the [merchant_republic|E] [realm|E].\n\nMerchant families can establish [Concept('trade_value','Trade Deals')|E] with other [realms|E], helping to grow their wealth and influence even further."

 game_concept_family_palace: "Family Palace"
 game_concept_family_palace_i: "@family_palace_icon!"
 game_concept_family_palace_desc: "A Family Palace is the private [domicile|E] of a [merchant_family|E] in a [merchant_republic|E] [government|E]. It symbolizes the family's wealth and power, boosts their influence in [Concept('trade_value','Trade Deals')|E], and serves as a hub for their mercantile operations."

 game_concept_trade_value: "Trade Value"
 game_concept_trade_value_i: "@tradevalue_icon!"
 game_concept_trade_value_with_icon: "@tradevalue_icon! $game_concept_trade_value$"
 game_concept_trade_value_desc: "Trade Value represents the strength of your republic's economy through trade. It's influenced by:\n• [raid_loot|E]: Available loot in the realm will be the base value.\n• [Concept('provinces','Coastal Provinces')|E]: Coastal areas provide a bonus to trade value due to access to sea routes.\n• [Concept('buildings','Trade Posts')|E]: Each trade post adds a 2% boost to your overall trade value.\n\nOverall, Trade Value reflects how well your realm is set up for trade based on its size, stability, access to the coast, and investment in trade infrastructure."

 game_concept_trade_strength: "Trade Strength"
 game_concept_trade_strength_i: "@tradevalue_icon!"
 game_concept_trade_strength_desc: "Trade Strength determines a [merchant_family|E]'s ability to dominate trade. Higher Trade Strength gives you a larger share of profits from deals and an advantage in competition with rival republics.\n\nIt increases with more [house|E] members in court and the construction of [family_palace|E] buildings."
 game_concept_city_culture_tradition: "City-related Tradition"
 game_concept_city_culture_tradition_desc: "One of the following:#V \n• City Keepers\n• Parochialism\n• Republican Legacy\n• Family Business#!"
 game_concept_maritime_culture_tradition: "Maritime-related Tradition"
 game_concept_maritime_culture_tradition_desc: "One of the following:#V \n• Maritime Mercantilism\n• Seafaring\n• Dexterous Fishermen\n• Coastal Warriors\n• Polders\n• Wetlanders#!"

 game_concept_communal_republic: "Communal Republic"
 game_concept_communal_republic_government: "Communal Republic Government"
 game_concept_communal_republic_i: "@government_type_republic!"
 game_concept_communal_republic_desc: "Under the [communal_republic|E], rulers are elected each cycle regardless of [dynasty|E], balancing five factions, Oligarchs, Burghers, Commons, Clerics, and Militants, whose support governs [laws|E], [wars|E], and reform. Republican Prestige unlocks lasting Republican Legacies."
