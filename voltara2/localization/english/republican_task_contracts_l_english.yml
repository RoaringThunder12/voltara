l_english:
 republican_establish_trade_presence_contract_contract: "Establish Trade Presence"
 republican_establish_trade_presence_contract_desc_title: "Establish a Trade Presence"
 republican_establish_trade_presence_contract_desc: "As a trusted envoy, you are tasked with securing my realm's prosperity. This contract grants you the authority to negotiate with local merchants and establish a thriving trade presence on my behalf."
 republican_establish_trade_presence_contract_request: "This contract requires you to negotiate a deal with a local merchant to establish a stronger trade presence and ensure the ruler's interests are well-represented in the region."

 #EVENTS
 republican_contract.trade_task.Build_Tradepost: "Build Tradepost"
 republican_contract.trade_task.Upgrade_Tradepost: "Expand Tradepost"
