 republican_contract.1000.t: "Establish Trade Presence: [Localize(Concatenate('republican_contract.trade_task.',task_contract.MakeScope.Var('trade_task').GetFlagName))]"
 republican_contract.1000.desc: "As I arrive in [location.GetNameNoTooltip], I’m greeted by a local merchant. He’s well aware that my presence could shift the balance of power in the local trade, and he watches me with cautious interest.\n\nI've been sent by [task_contract_employer.GetUINameNoTooltipNoFormat] [Localize(Concatenate('republican_contract.trade_task.desc.',task_contract.MakeScope.Var('trade_task').GetFlagName))]"
 republican_contract.trade_task.desc.Build_Tradepost: "in this realm to build a tradepost and strengthen the realm's economic power. The merchant stands in a position to either help or hinder my mission, and securing his support will be crucial to ensuring the project’s success."
 republican_contract.trade_task.desc.Upgrade_Tradepost: "to expand the tradepost already established here, aiming to solidify our influence and increase the region’s prosperity. The local merchant’s cooperation could make this effort much easier, but I'll need to choose whether to persuade him or offer a financial incentive for his support."
 republican_contract.trade_task.desc.Found_City: "to found a new city in this region. The merchant's cooperation will be crucial, and I must decide how to secure his support—through persuasion or compensation."
 republican_contract.trade_task.desc.Foreign_Merchants: "to welcome foreign merchants into the region, but the local merchant sees this as a threat. His support will be crucial to avoid conflict and ensure smooth relations."
 republican_contract.trade_task.desc.Mercantile_Contacts: "to establish new mercantile connections and contacts in the region. The local merchant could help me navigate these unfamiliar markets, but I’ll need to gain his trust or offer compensation to secure his cooperation."
 republican_contract.trade_task.desc.Increase_Development: "to improve the local infrastructure—building better roads and ports to enhance trade. The local merchant's support will be key in this, and I must either convince him of the benefits or offer him compensation for his cooperation."
