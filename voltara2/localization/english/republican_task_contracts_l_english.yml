 republican_contract.1010.t.critfailure.desc: "[Localize(Concatenate('republican_contract.1010.desc.failure.',task_contract.MakeScope.Var('trade_task').GetFlagName))]"
 republican_contract.1010.desc.success: "[Localize(Concatenate('republican_contract.1010.desc.success.',task_contract.MakeScope.Var('trade_task').GetFlagName))]"
 republican_contract.1010.desc.failure: "[Localize(Concatenate('republican_contract.1010.desc.failure.',task_contract.MakeScope.Var('trade_task').GetFlagName))]"
 republican_contract.1010.option.success: "[task_contract_employer.GetTitledFirstNameNoTooltip] will be happy to hear this."
 republican_contract.1010.option.failure: "[task_contract_employer.GetTitledFirstNameNoTooltip] won't be happy."
 republican_contract.1010.desc.success.Build_Tradepost: "The market is bustling as I meet the merchant, his eyes sharp and calculating. He listens carefully to my proposal, assessing the potential impact of the tradepost on his own interests.\n\nAfter some negotiation, he finally agrees to support the project. Whether it was the promise of new wealth or other incentives, the result is clear—the merchant is on board, and construction begins without delay.\n\nIn no time, the tradepost becomes a vital hub of activity, strengthening the local economy and securing our presence in the region."
 republican_contract.1010.desc.failure.Build_Tradepost: "The market is quieter today, and the merchant seems disinterested in my pitch. His skepticism is palpable as I outline the benefits of the new tradepost, but he remains unmoved.\n\nDespite my best efforts, I leave the meeting with no commitment from him. Whatever approach I took, it wasn’t enough to sway his influence in the marketplace.\n\nWithout his support, the project faces numerous delays, and our plans to establish a foothold here falter before they can take root."
 republican_contract.1010.desc.success.Upgrade_Tradepost: "The existing tradepost hums with activity as I sit down with the local merchant. He’s familiar with the potential benefits, but wary of losing control over the local market.\n\nAfter a series of discussions, we come to an understanding. Whether it was a shared vision or something else, the merchant gives his approval, and the upgrade proceeds smoothly.\n\nSoon, the expanded tradepost draws even more traders and goods, solidifying the region as a growing center of commerce."
 republican_contract.1010.desc.failure.Upgrade_Tradepost: "The tradepost is active, but the merchant remains unconvinced as we talk about the upgrade. His concerns about disrupting the current balance overshadow any promises I make.\n\nDespite my attempts to reassure him, he remains distant and noncommittal. Whatever approach I used, it wasn’t enough to secure his full cooperation.\n\nAs a result, the planned upgrades stall, leaving the tradepost outdated and struggling to keep up with demand."
 republican_contract.1010.desc.success.Found_City: "The prospect of founding a city is no small matter, and the local merchant is keenly aware of what this could mean for him. We discuss the potential growth, trade, and influence this new city could bring.\n\nAfter some back and forth, we reach a deal. Whether through shared ambition or another form of persuasion, the merchant agrees to support the endeavor.\n\nWith his help, the foundations of the new city are laid, and soon it becomes a beacon of prosperity, attracting merchants and settlers alike."
 republican_contract.1010.desc.failure.Found_City: "Founding a city in this region is a grand idea, but the merchant’s guarded responses suggest he’s not entirely convinced. He worries about the upheaval it might cause to his established interests.\n\nDespite my efforts to persuade him, our discussions yield little in terms of concrete support. Whatever my approach, it wasn’t enough to get him fully on board.\n\nWithout his backing, the city’s development faces numerous setbacks, and the dream of establishing a thriving new center remains distant."
 republican_contract.1010.desc.success.Foreign_Merchants: "The local merchant seems skeptical as I present the idea of allowing foreign merchants to establish themselves here. He clearly understands the potential impact on his control over local trade.\n\nAfter a careful exchange of ideas, he agrees to cooperate. Whether it was a shared understanding or another incentive, the merchant gives his approval for the foreign traders to enter the market.\n\nWith his backing, the foreign merchants quickly set up shop, bringing new goods and wealth to the region while integrating smoothly into the local economy."
 republican_contract.1010.desc.failure.Foreign_Merchants: "The merchant listens quietly as I explain the benefits of allowing foreign merchants to establish a presence in the region. His wariness is evident, and it’s clear he feels threatened by the potential competition.\n\nDespite my efforts, the merchant remains resistant to the idea. Whatever approach I took—whether persuasion or incentive—it wasn’t enough to secure his support.\n\nAs a result, the foreign merchants face constant obstacles in establishing their presence, and the region misses out on the potential boost in trade and commerce."
 republican_contract.1010.desc.success.Mercantile_Contacts: "The merchant listens carefully as I explain the value of establishing new mercantile connections in the region. He knows the potential benefits, but also the risks of disrupting the local network.\n\nAfter a lengthy conversation, we come to an agreement. Whether it was the promise of profit or something else that swayed him, the merchant agrees to help facilitate the new contacts.\n\nWith his guidance, I quickly secure the alliances and connections needed, expanding our trade influence in the region."
 republican_contract.1010.desc.failure.Mercantile_Contacts: "The merchant’s expression remains neutral as I outline the importance of building new connections and alliances. His reluctance to embrace change is clear, despite my best efforts to ease his concerns.\n\nIn the end, we part ways without any solid commitment. Whatever I offered wasn’t enough to secure his support for the endeavor.\n\nWithout his assistance, forming new connections proves far more difficult than expected, and our expansion into the region stalls."
 republican_contract.1010.desc.success.Increase_Development: "Improving the infrastructure in this region could transform trade, but the local merchant is understandably cautious. He weighs the benefits of better roads and ports against the potential disruption to his established operations.\n\nAfter a series of discussions, we reach an understanding. Whether through a convincing argument or other means, he agrees to support the improvements.\n\nWith his cooperation, construction moves ahead smoothly, and soon the region’s trade flourishes, thanks to the enhanced infrastructure."
 republican_contract.1010.desc.failure.Increase_Development: "The merchant listens as I lay out the plan to improve the local infrastructure, but his responses are hesitant. He’s concerned about the disruption it could cause to his current operations, and my reassurances don’t seem to have much effect.\n\nIn the end, we don’t reach a satisfactory agreement. Whatever approach I took, it wasn’t enough to gain his full support.\n\nAs a result, the infrastructure project faces delays and complications, leaving the region without the much-needed improvements."
