l_english:
 vkfu.30.t:0 "One Banner Against the Keepers"
 vkfu.30.desc:0 "The council has given our scattered banners a single purpose. The Southron Invasion is born, and I swear to wrest the Strait from the Keepers. The chiefs who swore blood oaths now enter my realm with their customs protected; those who offered only support remain bound by the pledges they actually made. Our long march begins."
 vkfu.30.a:0 "Let the Keepers see us united."
