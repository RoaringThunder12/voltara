l_english:
 game_rule_category_vt_core:0 "Voltara — General Rules"
 game_rule_category_vt_weave:0 "Voltara — The Weave"
 game_rule_category_vt_magic:0 "Voltara — Threadbinding and Magic"
 game_rule_category_vt_supernatural:0 "Voltara — Supernatural Beings"
 game_rule_category_vt_dragons:0 "Voltara — Dragons and Eggs"
 game_rule_category_vt_clergy:0 "Voltara — Citadel and Inquisition"
 game_rule_category_vt_relics:0 "Voltara — Artifacts and Elven Ruins"
 game_rule_category_vt_government:0 "Voltara — Realms and Councils"
 game_rule_category_vt_wonders:0 "Voltara — Cities of Wonder"
 game_rule_category_vt_viet:0 "Voltara — Flavor Events"
 game_rule_category_vt_courtiers:0 "Voltara — Courtiers and Prisoners"
 game_rule_category_vt_advanced:0 "Voltara — Advanced Balance"
 rule_vt_rule_weave_awakenings:0 "Supernatural Awakenings and the Weave"
 setting_vt_rule_weave_awakenings_on:0 "Enabled"
 setting_vt_rule_weave_awakenings_on_desc:0 "New vampires, lycans, Threadbinders, and mages contribute toward Khaos. Existing characters are not recounted."
 setting_vt_rule_weave_awakenings_off:0 "Disabled"
 setting_vt_rule_weave_awakenings_off_desc:0 "New supernatural awakenings do not shift the Weave. Deaths, conversions, rituals, and the situation remain active."
 rule_vt_rule_weave_incursions:0 "Weave Demon Incursions"
 setting_vt_rule_weave_incursions_on:0 "Enabled"
 setting_vt_rule_weave_incursions_on_desc:0 "The Khaos phase can spawn the existing demon incursions, with their normal cooldown and army limits."
 setting_vt_rule_weave_incursions_off:0 "Disabled"
 setting_vt_rule_weave_incursions_off_desc:0 "The Weave does not spawn new demon incursions. Other magic-system demon events are controlled separately."
 rule_vt_rule_inquisitor_orders:0 "Founding Inquisitorial Holy Orders"
 setting_vt_rule_inquisitor_orders_on:0 "Enabled"
 setting_vt_rule_inquisitor_orders_on_desc:0 "The two starting Inquisitorial holy orders are founded normally."
 setting_vt_rule_inquisitor_orders_off:0 "Disabled"
 setting_vt_rule_inquisitor_orders_off_desc:0 "The scripted starting Inquisitorial holy orders are not founded. Individual Inquisitors remain available."
 rule_vt_rule_monster_wars:0 "Inquisitorial Expulsion Wars"
 setting_vt_rule_monster_wars_on:0 "Enabled"
 setting_vt_rule_monster_wars_on_desc:0 "Eligible Inquisitors can wage county and duchy expulsion wars against supernatural rulers."
 setting_vt_rule_monster_wars_off:0 "Disabled"
 setting_vt_rule_monster_wars_off_desc:0 "The Inquisitorial expulsion casus belli is unavailable. Ordinary wars and individual monster hunts remain active."
 rule_vt_rule_citadel_education:0 "Child Education at the Citadel"
 setting_vt_rule_citadel_education_on:0 "Enabled"
 setting_vt_rule_citadel_education_on_desc:0 "Aeliunist rulers can send eligible children to study at the Citadel."
 setting_vt_rule_citadel_education_off:0 "Disabled"
 setting_vt_rule_citadel_education_off_desc:0 "The child-education interaction is unavailable. Adult clergy recruitment and existing Citadel services remain active."
 rule_vt_rule_citadel_destruction:0 "Destruction of the Citadel"
 setting_vt_rule_citadel_destruction_on:0 "Enabled"
 setting_vt_rule_citadel_destruction_on_desc:0 "Khaotist rulers controlling the Citadel county can destroy it under the normal conditions."
 setting_vt_rule_citadel_destruction_off:0 "Disabled"
 setting_vt_rule_citadel_destruction_off_desc:0 "The decision to destroy the Citadel is unavailable."
 rule_vt_rule_coven_oath:0 "Mountain Coven Blood Oaths"
 setting_vt_rule_coven_oath_on:0 "Enabled"
 setting_vt_rule_coven_oath_on_desc:0 "Eligible mortals can seek a mountain coven and pursue its blood oath."
 setting_vt_rule_coven_oath_off:0 "Disabled"
 setting_vt_rule_coven_oath_off_desc:0 "The mountain-coven blood-oath decision is unavailable. Coven characters and other vampire mechanics remain active."
 rule_vt_rule_request_turning:0 "Requests to Become a Vampire"
 setting_vt_rule_request_turning_on:0 "Enabled"
 setting_vt_rule_request_turning_on_desc:0 "Eligible mortals can ask vampires to turn them; normal acceptance conditions apply."
 setting_vt_rule_request_turning_off:0 "Disabled"
 setting_vt_rule_request_turning_off_desc:0 "The Ask to Be Turned interaction is unavailable. Other supernatural conversion systems keep their own rules."
 rule_vt_rule_council_experience:0 "Council Experience Progression"
 setting_vt_council_xp_normal:0 "Normal"
 setting_vt_council_xp_normal_desc:0 "Council experience grows at the current quarterly rate, including ability and diligence bonuses."
 setting_vt_council_xp_double:0 "Double"
 setting_vt_council_xp_double_desc:0 "Council experience gains, including bonuses, are doubled."
 setting_vt_council_xp_off:0 "Disabled"
 setting_vt_council_xp_off_desc:0 "Council service does not grant new council-experience traits or experience. Council positions remain active."
 rule_vt_rule_elven_ruins:0 "Elven Ruin Expeditions"
 setting_vt_elven_ruins_normal:0 "Normal"
 setting_vt_elven_ruins_normal_desc:0 "Eligible rulers and adventurers can explore ruins. Outcomes remain 45% nothing, 40% relic, 12% Astral Steel, and 3% egg."
 setting_vt_elven_ruins_no_eggs:0 "No Dragon Eggs"
 setting_vt_elven_ruins_no_eggs_desc:0 "Expeditions remain available, but the 3% dragon-egg outcome instead yields an elven relic. Other egg sources are unchanged."
 setting_vt_elven_ruins_off:0 "Disabled"
 setting_vt_elven_ruins_off_desc:0 "The Explore Elven Ruins decision is unavailable."
 rule_vt_rule_astral_forging:0 "Astral Steel Forging"
 setting_vt_rule_astral_forging_on:0 "Enabled"
 setting_vt_rule_astral_forging_on_desc:0 "Owners of Astral Steel can forge a weapon using the existing design menu and costs."
 setting_vt_rule_astral_forging_off:0 "Disabled"
 setting_vt_rule_astral_forging_off_desc:0 "Astral Steel cannot be forged into weapons. Existing weapons and the material remain valid artifacts."
 rule_vt_rule_native_armies:0 "Generic Men-at-Arms Access"
 setting_vt_native_armies_restricted:0 "Cultural Rosters"
 setting_vt_native_armies_restricted_desc:0 "Named Voltara cultures use their cultural rosters. Native regiments remain available to generic humans."
 setting_vt_native_armies_open:0 "Open Generic Recruitment"
 setting_vt_native_armies_open_desc:0 "All cultures may recruit native regiments when their other requirements are met. Cultural regiments keep their culture and technology gates."
 rule_vt_rule_crownsguard_gender:0 "Crownsguard Recruitment"
 setting_vt_crownsguard_men:0 "Men Only"
 setting_vt_crownsguard_men_desc:0 "New Crownsguard candidates must be men, as in the current Voltara setup."
 setting_vt_crownsguard_any_gender:0 "Any Gender"
 setting_vt_crownsguard_any_gender_desc:0 "Any gender may qualify for Crownsguard recruitment. All other eligibility requirements remain in force; the starting seven are unchanged."
 rule_vt_rule_abolition:0 "Severosi Abolition Restrictions"
 setting_vt_abolition_lore:0 "Lore Restrictions"
 setting_vt_abolition_lore_desc:0 "The Severosi abolition restriction remains in force while the designated starting sovereign lives. Normal prestige, piety, and peace requirements still apply."
 setting_vt_abolition_open:0 "Open Reform"
 setting_vt_abolition_open_desc:0 "Remove the special Severosi lifetime restriction on abolishing slavery. The normal prestige, piety, and peace requirements still apply."
 vt_ruins_no_eggs_outcomes_tt:0 "The expedition may find nothing (45%), an elven relic (43%), or illustrious Astral Steel (12%). Dragon eggs are disabled for this expedition."
