l_english:
 dhm_v073_partner_changed_desc:0 "Much has changed since we last spoke of the household. That old counsel no longer fits what lies before us. I set the matter aside."
 dhm_v073_couple_changed_desc:0 "The household I once helped to settle is no longer as it was. I will not count an old promise as a success when circumstances have changed."
 dhm_v073_changed_ack:0 "Let the Matter Rest"
 dhm_v073_circumstances_changed_tt:0 "Circumstances have changed. No reward, cost or progress is applied."
 dhm_v073_school_unavailable_desc:0 "Other cares now need our attention. This old schoolroom matter can wait."
 dhm_v073_school_unknown_desc:0 "The schoolroom quarrel is long past. Before judging it, I would need a clearer account of what followed."
 dhm_v073_school_grown_success_desc:0 "[dhm_story_child.GetFirstName] is grown now. The lessons are over, but the patience shown in that old quarrel was not wasted. Good work deserves to be remembered."
 dhm_v073_school_grown_discipline_desc:0 "[dhm_story_child.GetFirstName] is grown now. The habit of finishing a task has endured, though those strict lessons are remembered with little warmth."
 dhm_v073_school_grown_setback_desc:0 "[dhm_story_child.GetFirstName] is grown now, but harsh words from the schoolroom still lie between us. It is not too late to put them right."
 dhm_v073_school_changed_desc:0 "The lessons can no longer continue as before. Still, I can judge fairly the work that was done and make amends for harsh words."
