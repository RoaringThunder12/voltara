l_english:
 dhm_v074_appointment_unknown_t:0 "A Household Appointment"
 dhm_v074_appointment_unknown_desc:0 "The office has not been named. Return to the ledger and choose the post you wish to fill."
 dhm_v074_appointment_empty_desc:0 "No suitable courtier is free to take this post. We must leave it vacant for now."
 dhm_v074_appointment_lapsed_tt:0 "This appointment can no longer be made. The current officer keeps the post. No reward or cost is applied."
 dhm_v074_proposal_lapsed_desc:0 "This proposal is no longer ready to be settled. The office must check the pair's circumstances again before asking for your decision."
 dhm_v074_proposal_lapsed_option:0 "Set This Proposal Aside"
 dhm_v074_proposal_lapsed_tt:0 "No payment, reward or new penalty is applied. Any newer proposal is left untouched."
 dhm_v074_confirm_match_tt:0 "The match is checked again when you confirm. If it is no longer possible, none of the following costs or rewards apply."
