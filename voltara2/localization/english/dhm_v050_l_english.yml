l_english:
 # Dashboard additions
 dhm_manager.0005.heir_journey:0 "@child_icon! The Heir's Journey"
 dhm_manager.0006.marriage_journey:0 "@arrange_marriage_icon! Marriage Journeys"
 dhm_manager.0007.institutions:0 "@council_icon! Officers & Household Mood"
 dhm_manager.0008.chapters:0 "@skill_learning_icon! Chronicle Chapters"
 dhm_manager.0008.legacy:0 "@dynasty_icon! House Legacy"

 # Household institutions
 dhm_legacy.0001.t:0 "The Household Office"
 dhm_legacy.0001.desc:0 "The accounts, marriage letters, lessons and family records all need attention. Choose who will serve your household and which matters should come before you."
 dhm_legacy.0001.officers:0 "Name the Household Officers"
 dhm_legacy.0001.mood:0 "Take the Measure of the House"
 dhm_legacy.0010.t:0 "The Household Offices"
 dhm_legacy.0010.desc:0 "A capable steward keeps the accounts in order. A good matchmaker, tutor and chronicler each have their own work. Choose whom you trust with these duties."
 dhm_legacy.0010.steward.filled:0 "\n@skill_stewardship_icon! #bold Household Steward:#! [ROOT.Char.MakeScope.Var('dhm_officer_steward').Char.GetShortUIName]"
 dhm_legacy.0010.steward.empty:0 "\n@skill_stewardship_icon! #bold Household Steward:#! #N Vacant#!"
 dhm_legacy.0010.matchmaker.filled:0 "\n@arrange_marriage_icon! #bold Family Matchmaker:#! [ROOT.Char.MakeScope.Var('dhm_officer_matchmaker').Char.GetShortUIName]"
 dhm_legacy.0010.matchmaker.empty:0 "\n@arrange_marriage_icon! #bold Family Matchmaker:#! #N Vacant#!"
 dhm_legacy.0010.tutor.filled:0 "\n@skill_learning_icon! #bold Chief Tutor:#! [ROOT.Char.MakeScope.Var('dhm_officer_tutor').Char.GetShortUIName]"
 dhm_legacy.0010.tutor.empty:0 "\n@skill_learning_icon! #bold Chief Tutor:#! #N Vacant#!"
 dhm_legacy.0010.chronicler.filled:0 "\n@skill_learning_icon! #bold House Chronicler:#! [ROOT.Char.MakeScope.Var('dhm_officer_chronicler').Char.GetShortUIName]"
 dhm_legacy.0010.chronicler.empty:0 "\n@skill_learning_icon! #bold House Chronicler:#! #N Vacant#!"
 dhm_legacy.0010.steward:0 "Appoint the Best Household Steward"
 dhm_legacy.0010.matchmaker:0 "Appoint the Best Family Matchmaker"
 dhm_legacy.0010.tutor:0 "Appoint the Best Chief Tutor"
 dhm_legacy.0010.chronicler:0 "Appoint the Best House Chronicler"
 dhm_legacy.0011.steward.t:0 "The Keys and Account Chest"
 dhm_legacy.0011.matchmaker.t:0 "Seals Between Two Houses"
 dhm_legacy.0011.tutor.t:0 "The Schoolroom Keys"
 dhm_legacy.0011.chronicler.t:0 "Keeper of the Family Ink"
 dhm_legacy.0011.steward.desc:0 "[dhm_office_candidate.GetShortUIName] is well suited to managing stores and household accounts. The post brings honor, but its daily demands can be tiring."
 dhm_legacy.0011.matchmaker.desc:0 "[dhm_office_candidate.GetShortUIName] has a good eye for a suitable marriage. The families will welcome sound advice—and complain when the talks go poorly."
 dhm_legacy.0011.tutor.desc:0 "[dhm_office_candidate.GetShortUIName] understands how to guide young pupils. As Chief Tutor, [dhm_office_candidate.GetSheHe] would answer for the household's lessons."
 dhm_legacy.0011.chronicler.desc:0 "[dhm_office_candidate.GetShortUIName] can keep a careful record of the family. It is an honored post, though gathering the accounts takes patience."
 dhm_legacy.0011.appoint:0 "Give [dhm_office_candidate.GetFirstName] the Office"
 dhm_legacy.0011.not_yet:0 "Not Yet"

 # Household mood
 dhm_cohesion.fractured:0 "\n@warning_icon! Household Mood: #N Fractured#!"
 dhm_cohesion.uneasy:0 "\n@warning_icon! Household Mood: #N Uneasy#!"
 dhm_cohesion.stable:0 "\n@skill_stewardship_icon! Household Mood: #V Stable#!"
 dhm_cohesion.united:0 "\n@skill_diplomacy_icon! Household Mood: #P United#!"
 dhm_cohesion.devoted:0 "\n@dynasty_icon! Household Mood: #P Devoted#!"
 dhm_legacy.0100.t:0 "The Mood of the Household"
 dhm_legacy.0100.desc:0 "Shared meals and fair treatment bring the household together. Quarrels and heavy demands pull it apart. Consider whether your kin need encouragement or a firmer routine."
 dhm_cohesion.fractured.long:0 "\n#N Fractured#! — Kin speak through servants, old injuries are counted, and every empty chair is noticed."
 dhm_cohesion.uneasy.long:0 "\n#N Uneasy#! — Work continues, but cups are set down too carefully and harmless words are weighed for insult."
 dhm_cohesion.stable.long:0 "\n#V Stable#! — The household keeps its rhythm. There is trust enough for ordinary days, though not yet enough for every hard truth."
 dhm_cohesion.united.long:0 "\n#P United#! — Disagreements remain, but people expect to be heard before doors are shut."
 dhm_cohesion.devoted.long:0 "\n#P Devoted#! — The house stands close around its own. That loyalty is powerful, and it expects much from the one at its center."
 dhm_legacy.0100.supper:0 "Set One Table for Everyone"
 dhm_legacy.0100.order:0 "Set a Firmer Routine"
 dhm_cohesion_gain_small_tt:0 "#P Household cohesion rises slightly.#!"
 dhm_cohesion_gain_large_tt:0 "#P Household cohesion rises.#!"
 dhm_cohesion_loss_small_tt:0 "#N Household cohesion falls slightly.#!"
 dhm_cohesion_loss_large_tt:0 "#N Household cohesion falls.#!"

 # Officer dilemma
 dhm_legacy.0150.t:0 "An Officer Asks for Help"
 dhm_legacy.0150.steward:0 "[dhm_story_officer.GetShortUIName] brings two account books. The entries for the household stores do not agree. Finding the mistake will take time."
 dhm_legacy.0150.matchmaker:0 "[dhm_story_officer.GetShortUIName] brings a bundle of marriage letters. Several families have changed their terms, and the replies need checking before the talks can continue."
 dhm_legacy.0150.tutor:0 "[dhm_story_officer.GetShortUIName] brings the schoolroom records. Some pupils have fallen behind, and their families want to know what will be done."
 dhm_legacy.0150.chronicler:0 "[dhm_story_officer.GetShortUIName] has two different accounts of a family quarrel. The witnesses must be heard before either version goes into the chronicle."
 dhm_legacy.0150.question:0 "\n\n'Give me time to put this right, my liege. Or, if you wish, we can go through it together.'"
 dhm_legacy.0150.trust:0 "Trust the Officer"
 dhm_legacy.0150.audit:0 "Check Every Line"
 dhm_legacy.0150.credit:0 "Recognize the Officer's Hard Work"
 dhm_legacy.0151.t:0 "The Officer Returns"
 dhm_legacy.0151.trust:0 "[dhm_story_officer.GetFirstName] brings the work you entrusted to the office. It is finished, though later than expected.\n\n'Thank you for your patience, my liege. I shall warn you sooner if I need help again.'"
 dhm_legacy.0151.audit:0 "After many careful checks, [dhm_story_officer.GetFirstName] brings the finished work.\n\n'Everything you asked for is here, my liege.' The officer looks tired. Your close attention has ensured a thorough job, but made it harder to finish."
 dhm_legacy.0151.credit:0 "The praise you gave [dhm_story_officer.GetFirstName] has been well received. The officer works with renewed confidence, and the household speaks well of the appointment."
 dhm_legacy.0151.a:0 "Good. Keep Me Informed."

 # Personal ambitions
 dhm_legacy.0200.t:0 "What [dhm_ambition_target.GetFirstName] Wants"
 dhm_legacy.0200.opening:0 "[dhm_ambition_target.GetShortUIName] waits until the servants have left.\n\n'May I ask something of you? It concerns my own future.'"
 dhm_legacy.0200.love:0 "\n\n'I want a marriage with some kindness in it, not merely an agreement between families.'"
 dhm_legacy.0200.status:0 "\n\n'I want a chance to earn an honored place in this house.'"
 dhm_legacy.0200.learning:0 "\n\n'I would like to study. With books, a teacher and time, I could learn much more.'"
 dhm_legacy.0200.faith:0 "\n\n'I wish to give more time to prayer and the duties of our faith.'"
 dhm_legacy.0200.security:0 "\n\n'I want to know the household will help me if I fall on hard times.'"
 dhm_legacy.0200.freedom:0 "\n\n'I know what I owe the family. I would still like some say in my own life.'"
 dhm_legacy.0200.question:0 "\n\nThere is room to help, but other household duties will have to wait."
 dhm_legacy.0200.support:0 "Help Them Pursue It"
 dhm_legacy.0200.duty:0 "The Household Must Come First"
 dhm_legacy.0200.compromise:0 "We Can Spare Some Time for This"
 dhm_legacy.0201.t:0 "A Wish Given Time"
 dhm_legacy.0201.support:0 "[dhm_ambition_target.GetFirstName] comes to thank you.\n\n'I have not achieved all I hoped, but your help gave me a fair chance.' There is still work ahead, and [dhm_ambition_target.GetSheHe] knows it."
 dhm_legacy.0201.duty:0 "[dhm_ambition_target.GetFirstName] has done what the household required. The private hope you set aside has not gone away.\n\n'I kept my word. I hope you will remember what I gave up.'"
 dhm_legacy.0201.compromise:0 "The arrangement has held. [dhm_ambition_target.GetFirstName] has found some time for personal wishes while keeping up with household duties. Neither side has received everything it wanted."
 dhm_legacy.0201.a:0 "I Have Heard You"

 # Relationship arcs
 dhm_legacy.0300.siblings.t:0 "Two Siblings, One Old Wound"
 dhm_legacy.0300.tutor.t:0 "When a Lesson Becomes a Bond"
 dhm_legacy.0300.inlaw.t:0 "A New Name at the Old Table"
 dhm_legacy.0300.estranged.t:0 "Kin Across a Growing Distance"
 dhm_legacy.0300.kin.t:0 "Two Voices Beneath One Roof"
 dhm_legacy.0300.siblings.desc:0 "[dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] are arguing again. What began as a small disagreement has become a list of old complaints. Each believes the other has always been favored."
 dhm_legacy.0300.tutor.desc:0 "[dhm_arc_first.GetFirstName] has questioned [dhm_arc_second.GetFirstName]'s advice before the household. The tutor calls it disrespect; the pupil insists the question deserved an answer."
 dhm_legacy.0300.inlaw.desc:0 "[dhm_arc_second.GetFirstName] objects to the way family suppers are arranged. [dhm_arc_first.GetFirstName] insists the household has always done it this way. Neither will give ground."
 dhm_legacy.0300.estranged.desc:0 "[dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] avoid one another. Each says the other stopped making an effort. Unanswered letters and missed invitations have only made matters worse."
 dhm_legacy.0300.kin.desc:0 "[dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] have stopped speaking plainly. The silence now does more harm than the original disagreement."
 dhm_legacy.0300.listen:0 "Hear Them Separately"
 dhm_legacy.0300.rule:0 "Give My Judgment"
 dhm_legacy.0300.leave:0 "Leave the Quarrel to Them"
 dhm_legacy.0301.t:0 "What Remained Between Them"
 dhm_legacy.0301.listen:0 "[dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] can share a meal again without arguing. Hearing them separately helped each feel fairly treated. They still disagree, but they are willing to speak."
 dhm_legacy.0301.rule:0 "Your judgment settled the immediate dispute between [dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName]. Both obeyed. Neither seems eager to bring another disagreement before you."
 dhm_legacy.0301.leave:0 "Left to themselves, [dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] have kept their distance. The household has learned to seat them apart rather than risk another quarrel."
 dhm_legacy.0301.a:0 "I Will Remember This"

 # Heir's journey
 dhm_legacy.0400.council.t:0 "The Empty Chair at Council"
 dhm_legacy.0400.hall.t:0 "A Voice Before the Hall"
 dhm_legacy.0400.duty.t:0 "The First Burden to Carry"
 dhm_legacy.0400.ready.t:0 "Is the Heir Ready?"
 dhm_legacy.0400.council.desc:0 "A place has been set beside you at council. [dhm_heir.GetFirstName] watches the councillors present their reports. There is time to ask questions before the next matter is heard."
 dhm_legacy.0400.hall.desc:0 "A petitioner has come before the household. You ask [dhm_heir.GetFirstName] to hear the request and offer an answer. The hall falls quiet."
 dhm_legacy.0400.duty.desc:0 "[dhm_heir.GetFirstName] has been given responsibility for a small part of the household's work. There are complaints to hear and decisions to make. How closely should you guide the heir?"
 dhm_legacy.0400.ready.desc:0 "[dhm_heir.GetFirstName] has spent time at council and before the hall. There is still much to learn, but these early duties have shown where help is needed."
 dhm_legacy.0400.bold:0 "Let the Heir Act"
 dhm_legacy.0400.careful:0 "Teach the Heir Caution"
 dhm_legacy.0400.listen:0 "Teach the Heir to Listen"
 dhm_legacy.0401.t:0 "The Lesson Takes Root"
 dhm_legacy.0401.bold:0 "[dhm_heir.GetFirstName] now answers with greater confidence. The heir is willing to act, though sometimes too quick to decide before hearing everyone."
 dhm_legacy.0401.careful:0 "[dhm_heir.GetFirstName] has learned to check the details before giving an answer. Fewer mistakes are made, but the household sometimes waits longer than it would like."
 dhm_legacy.0401.listen:0 "People find [dhm_heir.GetFirstName] willing to hear them out. The heir has gained useful advice, along with several requests that are difficult to refuse."
 dhm_legacy.0401.a:0 "Another Step Toward the High Seat"
 dhm_legacy.0410.t:0 "The Heir's Journey"
 dhm_legacy.0410.desc:0 "Review the heir's progress through council, public duties, command and preparations for household rule."
 dhm_legacy.0410.council:0 "\n\n#bold Next Chapter:#! A first seat at council."
 dhm_legacy.0410.hall:0 "\n\n#bold Next Chapter:#! A first answer before the hall."
 dhm_legacy.0410.duty:0 "\n\n#bold Next Chapter:#! A real duty with real consequences."
 dhm_legacy.0410.ready:0 "\n\n#P The foundation is laid.#! Future scenes will test the habits already taught."

 # Spouse partnership
 dhm_legacy.0500.t:0 "A Private Disagreement"
 dhm_legacy.0500.opening:0 "Your spouse, [dhm_partner_spouse.GetShortUIName], asks to speak before you give the household its next duties.\n\n'We have asked much of them lately. We should agree on what comes next.'"
 dhm_legacy.0500.ambitious:0 "\n\n'There is more this house could achieve. I would rather ask for another effort than let the chance pass.'"
 dhm_legacy.0500.content:0 "\n\n'They have served us well. We can afford to give them some peace.'"
 dhm_legacy.0500.stubborn:0 "\n\n'I know you disagree. Hear my reasons before you dismiss them.'"
 dhm_legacy.0500.default:0 "\n\n'We both know these people. Let us hear one another before we decide.'"
 dhm_legacy.0500.share:0 "We Will Decide Together"
 dhm_legacy.0500.yield:0 "Your Counsel Has Convinced Me"
 dhm_legacy.0500.overrule:0 "My Word Stands"
 dhm_legacy.0501.t:0 "After Our Disagreement"
 dhm_legacy.0501.share:0 "Since you agreed to decide together, [dhm_partner_spouse.GetFirstName] has spoken more freely. The advice is useful, though reaching an agreement takes patience."
 dhm_legacy.0501.yield:0 "The household noticed that you accepted [dhm_partner_spouse.GetFirstName]'s advice. Some thought you too willing to yield, but the decision eased the strain at home."
 dhm_legacy.0501.overrule:0 "The order was obeyed. Yet the messages we exchange are brief, and neither of us speaks as freely as before."
 dhm_legacy.0501.a:0 "We Must Live With Our Decision"

 # Marriage journey
 dhm_legacy.0600.t:0 "The First Year Under One Roof"
 dhm_legacy.0600.opening:0 "[dhm_journey_relative.GetFirstName] and [dhm_journey_spouse.GetFirstName] are settling into married life. They are still deciding how to manage their shared duties and what they want from their home."
 dhm_legacy.0600.arranged:0 "\n\nYou helped arrange the match. Now they must learn to live together."
 dhm_legacy.0600.faith:0 "\n\nThey follow different faiths. Both want room for their own prayers and observances."
 dhm_legacy.0600.culture:0 "\n\nEach is used to different household customs. Even a simple meal can take some discussion."
 dhm_legacy.0600.ordinary:0 "\n\nThey seem willing to listen to one another. A little help might make the first months easier."
 dhm_legacy.0600.furnish:0 "Help Furnish Their Home"
 dhm_legacy.0600.freedom:0 "Let Them Build Their Own Household"
 dhm_legacy.0600.custom:0 "Keep the House Custom"
 dhm_legacy.0601.t:0 "News of Their Household"
 dhm_legacy.0601.furnish:0 "Your help has made it easier for [dhm_journey_relative.GetFirstName] and [dhm_journey_spouse.GetFirstName] to settle in. They are grateful, though the household now looks to you when another expense arises."
 dhm_legacy.0601.freedom:0 "[dhm_journey_relative.GetFirstName] and [dhm_journey_spouse.GetFirstName] have made arrangements of their own. You would not have chosen everything they did, but they no longer bring every small problem to you."
 dhm_legacy.0601.custom:0 "The couple have kept the household customs you asked them to follow. The elders approve, though the rules have left the spouses less room to choose for themselves."
 dhm_legacy.0601.a:0 "May They Manage Well"
 dhm_legacy.0610.t:0 "Marriage Is More Than the Match"
 dhm_legacy.0610.desc:0 "The wedding feast is only the beginning. Married kin may return with worries about faith, custom, money, affection, or the freedom to build a household of their own."

 # Crisis and recovery
 dhm_legacy.0700.t:0 "The Household Needs Help"
 dhm_legacy.0700.opening:0 "The stores have arrived late, expenses are mounting, and the servants are short-tempered. [dhm_crisis_relative.GetFirstName] asks you to settle how the household will get through the difficulty."
 dhm_legacy.0700.thin_coffers:0 "\n\nThe account chest offers no easy answer."
 dhm_legacy.0700.weary:0 "\n\n[dhm_crisis_relative.GetFirstName] looks exhausted enough to mistake any answer for judgment."
 dhm_legacy.0700.uneasy:0 "\n\nIn an uneasy house, even help may be measured for favoritism."
 dhm_legacy.0700.default:0 "\n\nYou could meet the expense, cut the spending, or ask the family to share the work."
 dhm_legacy.0700.pay:0 "Open the Chest"
 dhm_legacy.0700.austerity:0 "Tighten Every Belt"
 dhm_legacy.0700.share:0 "Ask the Family to Share the Burden"
 dhm_legacy.0701.t:0 "After a Difficult Season"
 dhm_legacy.0701.pay:0 "The urgent bills have been paid and the household is calmer. [dhm_crisis_relative.GetFirstName] thanks you for the help. Your generosity will be remembered the next time money runs short."
 dhm_legacy.0701.austerity:0 "The stricter budget has steadied the household. [dhm_crisis_relative.GetFirstName] reports that the worst is over, though some still resent the comforts they lost."
 dhm_legacy.0701.share:0 "Sharing the work has eased the worst of the strain. [dhm_crisis_relative.GetFirstName] is glad the family helped, even if the extra duties left everyone tired."
 dhm_legacy.0701.a:0 "Good. Let Us Keep Things in Order."

 # Chronicle chapters and legacy
 dhm_legacy.0800.t:0 "The Living Chronicle"
 dhm_legacy.0800.desc:0 "Open the household's record of ambitions, quarrels, lessons and marriages."
 dhm_legacy.0800.ambitions:0 "\n@skill_diplomacy_icon! #bold Hopes Spoken in Private#! — Personal ambitions have been heard, denied, or bargained with."
 dhm_legacy.0800.ambitions.empty:0 "\n@skill_diplomacy_icon! #weak Hopes Spoken in Private — no chapter yet.#!"
 dhm_legacy.0800.relationships:0 "\n@friend_icon! #bold Knots Between Kin#! — Rivalries and reconciliations have changed how the family speaks."
 dhm_legacy.0800.relationships.empty:0 "\n@friend_icon! #weak Knots Between Kin — no chapter yet.#!"
 dhm_legacy.0800.heir:0 "\n@child_icon! #bold The Heir Learns to Carry Weight#! — Lessons have become real duties."
 dhm_legacy.0800.heir.empty:0 "\n@child_icon! #weak The Heir Learns to Carry Weight — no chapter yet.#!"
 dhm_legacy.0800.partnership:0 "\n@marriage_icon! #bold Two Seals, One Household#! — Spousal counsel has shaped rule."
 dhm_legacy.0800.partnership.empty:0 "\n@marriage_icon! #weak Two Seals, One Household — no chapter yet.#!"
 dhm_legacy.0800.marriages:0 "\n@arrange_marriage_icon! #bold After the Wedding Feast#! — Married kin have begun lives of their own."
 dhm_legacy.0800.marriages.empty:0 "\n@arrange_marriage_icon! #weak After the Wedding Feast — no chapter yet.#!"
 dhm_legacy.0800.crises:0 "\n@warning_icon! #bold When the House Bent#! — Hard seasons have tested what the family owes its own."
 dhm_legacy.0800.crises.empty:0 "\n@warning_icon! #weak When the House Bent — no chapter yet.#!"
 dhm_legacy.0900.t:0 "The Name Our House Earns"
 dhm_legacy.0900.desc:0 "The way you treat your kin shapes the house's reputation. Choose an identity earned through your decisions. Each brings an advantage and a burden."
 dhm_legacy.0900.scholarly:0 "\n\n@skill_learning_icon! Current Legacy: #P Scholarly#! — learned minds, softer steel."
 dhm_legacy.0900.honorable:0 "\n\n@skill_diplomacy_icon! Current Legacy: #P Honorable#! — trusted words, weaker guile."
 dhm_legacy.0900.protective:0 "\n\n@skill_martial_icon! Current Legacy: #P Protective#! — readiness, carried with strain."
 dhm_legacy.0900.ambitious:0 "\n\n@prestige_icon! Current Legacy: #P Ambitious#! — momentum, paid for in pressure."
 dhm_legacy.0900.traditional:0 "\n\n@piety_icon! Current Legacy: #P Traditional#! — shared custom, narrower learning."
 dhm_legacy.0900.severe:0 "\n\n@dread_icon! Current Legacy: #N Severe#! — fear obeys, affection withdraws."
 dhm_legacy.0900.unformed:0 "\n\n#V Current Legacy: Unformed#! — the family is still deciding what its name means."
 dhm_legacy.0900.choose:0 "Review the Legacy the House Has Earned"
 dhm_legacy.0910.t:0 "The First Names in the Chronicle"
 dhm_legacy.0910.desc:0 "An identity requires three matching household choices. Locked choices remain hidden until the family has truly earned them."
 dhm_legacy.0910.scholarly:0 "Let Our House Be Known for Learning"
 dhm_legacy.0910.honorable:0 "Let Our Word Be Our Honor"
 dhm_legacy.0910.protective:0 "Let Our House Shelter Its Own"
 dhm_legacy.0910.more:0 "More Possible Legacies"
 dhm_legacy.0920.t:0 "The Harder Names a House May Earn"
 dhm_legacy.0920.desc:0 "These identities reward ambition, custom or discipline. Read the benefits and drawbacks before choosing how your house will be known."
 dhm_legacy.0920.ambitious:0 "Let Our House Climb Higher"
 dhm_legacy.0920.traditional:0 "Let the Old Ways Guide Us"
 dhm_legacy.0920.severe:0 "Let Discipline Guard the House"
 dhm_legacy.0920.previous:0 "Return to the First Legacies"

 # Modifiers — all mixed outcomes are explicit in their effects.
 dhm_officer_shared_burden_modifier:0 "Weight of Household Office"
 dhm_officer_shared_burden_modifier_desc:0 "Responsibility sharpens this officer's stewardship while making every new problem feel personal."
 dhm_heir_bold_duty_modifier:0 "Taught to Step Forward"
 dhm_heir_bold_duty_modifier_desc:0 "Bold action comes quickly; tact must catch up."
 dhm_heir_careful_duty_modifier:0 "Taught to Count the Cost"
 dhm_heir_careful_duty_modifier_desc:0 "Careful management prevents mistakes, though it wins little glory."
 dhm_heir_listening_duty_modifier:0 "Taught to Hear the Hall"
 dhm_heir_listening_duty_modifier_desc:0 "Open ears invite honest counsel and practiced manipulation alike."
 dhm_household_open_hands_modifier:0 "An Open Door and a Full Table"
 dhm_household_open_hands_modifier_desc:0 "Kin speak freely here, leaving their ruler to carry more of their worries."
 dhm_household_hard_order_modifier:0 "Every Duty in Its Place"
 dhm_household_hard_order_modifier_desc:0 "The household runs efficiently, but warmth has been mistaken for disorder."
 dhm_household_recovery_modifier:0 "Leading the Recovery"
 dhm_household_recovery_modifier_desc:0 "Hardship has produced practical discipline and a lasting weight of responsibility."
 dhm_household_austerity_modifier:0 "A Lean Household"
 dhm_household_austerity_modifier_desc:0 "Tight accounts reward stewardship and make gracious rule harder."
 dhm_cohesion_fractured_modifier:0 "Fractured Household"
 dhm_cohesion_fractured_modifier_desc:0 "Old wounds now shape ordinary decisions."
 dhm_cohesion_uneasy_modifier:0 "Uneasy Household"
 dhm_cohesion_uneasy_modifier_desc:0 "Watchfulness grows where trust has thinned."
 dhm_cohesion_stable_modifier:0 "Stable Household"
 dhm_cohesion_stable_modifier_desc:0 "Routine brings order and a little complacency."
 dhm_cohesion_united_modifier:0 "United Household"
 dhm_cohesion_united_modifier_desc:0 "Open counsel strengthens diplomacy while leaving less room for secret work."
 dhm_cohesion_devoted_modifier:0 "Devoted Household"
 dhm_cohesion_devoted_modifier_desc:0 "Loyalty is deep, and so are the expectations placed upon its center."
 dhm_legacy_scholarly_modifier:0 "Legacy: The Scholarly House"
