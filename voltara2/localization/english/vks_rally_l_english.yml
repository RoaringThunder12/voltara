l_english:
 vks_rally_title:0 "Banners around My Fire"
 vks_rally_desc:0 "The heralds return from the southern chiefs. Their pledges, blood oaths, and contributions are now part of our common cause on the Kartholos frontier. With two independent chiefs behind me, 500 prestige, and 100 gold, I can summon a War Council and seek a united crown."
 vks_rally_ready:0 "Let the War Council gather."
 vks_rally_continue:0 "Our cause needs further support."
 vks_rally_unlock_tt:0 "Unlock the Southron War Council. Its negotiations, blood oaths, and founding promises determine whether the United Southron Clans are formed."
