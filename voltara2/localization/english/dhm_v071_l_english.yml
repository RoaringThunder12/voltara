l_english:
 dhm_v071_courtship_lapsed_desc:0 "These marriage talks can no longer go ahead. Circumstances have changed since the first letter. No settlement will be taken for an agreement we cannot keep."
 dhm_v071_courtship_failed_tt:0 "The marriage could not be completed. No settlement cost or completion reward is applied."
 dhm_v071_courtship_cancel:0 "End These Marriage Talks"
 dhm_v071_courtship_cancel_tt:0 "These talks end here. The marriage desk will leave them be for one year, and will not propose this same pair again for five years."
 dhm_v071_heir_reassessment_tt:0 "The heir receives one further term of instruction. A final assessment follows in #V two years#! if they remain your heir and can attend."
 dhm_v071_heir_reopen:0 "Arrange a Final Review"
 dhm_v071_heir_reopen_tt:0 "Reopen an earlier assessment that ended during further study. The heir returns in #V two years#!. This grants no additional skill bonus."
 dhm_v071_officer_generic_desc:0 "[dhm_story_officer.GetShortUIName] brings unfinished household business to your table. 'A little more time, my liege, and I can put this right.'"
 dhm_shared_grief_companion_memory:0 "Grief Shared at the Hearth"
 dhm_shared_grief_companion_memory_desc:0 "I mourned [deceased_relative.GetName] with [companion.GetName]."
