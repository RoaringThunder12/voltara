 building_vt_elven_memory_83:0 "Alderanbarrow — Court of the Paired Threads"
 building_vt_elven_memory_83_desc:0 "Two worn interlaced patterns face one another across the court. Keepers study endurance and possibility together, honoring Aeliun and Khaos without subordinating either creator. Its benefits become available only after the ruins have been reclaimed into a functioning holding."
