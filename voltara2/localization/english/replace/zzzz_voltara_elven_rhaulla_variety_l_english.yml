 building_vt_elven_memory_162:0 "Alderavhaven — Grove of Returning Light"
 building_vt_elven_memory_162_desc:0 "Roots have grown through the empty Elven halls. Healers cultivate the sheltered clearings, preserving a fragment of the living forests that once spread toward Thornfall and Enderal. Its benefits become available only after the ruins have been reclaimed into a functioning holding."
