 building_vt_elven_memory_77:0 "Merealcairn — Archive of Unbroken Memory"
 building_vt_elven_memory_77_desc:0 "Fragments of pre-Sundering scripture survive in sealed stone shelves. Patient comparison of these texts helps scholars distinguish the ancient Elven record from later imperial interpretations. Its benefits become available only after the ruins have been reclaimed into a functioning holding."
