l_english:
 voltara_justice_requirements:0 "Requires at least 20 Prowess and either both Strong and Athletic, or the highest-tier positive physique trait (Herculean/Amazonian)."
 voltara_forge_false_justice:0 "Commission a False Justice"
 voltara_forge_false_justice_desc:0 "Justice carries the weight of Titus Severos's conquests. I can commission a lighter imitation of its great hammerhead and gilded haft. From across the throne room, who will know the difference? Its appearance may bolster my standing, but it will possess none of the original's martial power."
 voltara_forge_false_justice_tooltip:0 "Commission a ceremonial imitation of Justice for a modest prestige benefit."
 voltara_forge_false_justice_confirm:0 "Let them see Justice in my hand."
 voltara_false_justice_name:0 "False Justice"
 voltara_false_justice_desc:0 "Octavian Severos commissioned this ceremonial imitation of Titus's legendary hammer. Its familiar silhouette lends a little prestige, but its hollow grandeur offers no advantage in battle."
 artifact_voltara_false_justice_type:0 "Ceremonial Hammer"
