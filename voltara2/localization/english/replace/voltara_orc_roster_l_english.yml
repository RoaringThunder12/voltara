l_english:
 voltara_orc_warband:0 "Orc Marauders"
 voltara_orc_warband_flavor:0 "Orc veterans in heavy armor form the core of the warband. They excel in mountains, hills and woodland, but lose some of their advantage on open ground."
 vmaa_voltara_culture_20_1:0 "Orc Berserkers"
 vmaa_voltara_culture_20_1_flavor:0 "Furious shock infantry who break enemy foot soldiers. Rugged terrain protects their otherwise exposed flanks."
 vmaa_voltara_culture_20_2:0 "Orc Champions"
 vmaa_voltara_culture_20_2_flavor:0 "Veteran Orc champions counter archers and heavy infantry, pursuing defeated enemies across dry country. Requires $innovation_men_at_arms$."
 vt_orc_wood_skirmishers:0 "Orc Wood Skirmishers"
 vt_orc_wood_skirmishers_flavor:0 "Mobile Orc fighters who ambush heavy infantry in forests, jungles and hills."
 vt_orc_war_trolls:0 "War Trolls"
 vt_orc_war_trolls_flavor:0 "Orc handlers drive hulking trolls into enemy formations. Small, costly regiments deliver devastating blows and endure heavy punishment, but struggle in desert heat. Requires $innovation_men_at_arms$."
