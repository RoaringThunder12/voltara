 became_hagraven_memory:0 "Became Ravenbound"
 became_hagraven_memory_desc:0 "I became a Ravenbound through an ancient dark ritual"
 became_hagraven_memory_desc_second_perspective:0 "you became a Ravenbound through an ancient dark ritual"
 became_hagraven_memory_desc_third_perspective:0 "[owner.GetTitledFirstName] became a Ravenbound through an ancient dark ritual"
 death_failed_during_briarheart_ascension:0 "died while trying to become a Rootbound"
 death_failed_during_hagraven_ascension:0 "died while trying to become a Ravenbound"
 life_extension.0400.death:0 "The ritual goes horribly wrong..."
 life_extension.0400.desc:0 "It begins with a dance and a measly sacrifice, to attract carrion birds to the ritual site. Twenty steps and four pieces of flesh scattered upon the earth, the dance becomes erratic. I feel the creeping of magick seep into my flesh. The time is almost night. Am I ready for the last steps of the dance? To unmask my skin and ascend into the skies with black wings? Or is my spirit not yet willing?"
 life_extension.0400.failure:0 "The ritual is a failure"
 life_extension.0400.success:0 "The ritual is a success!"
 life_extension.0400a:0 "There is no way back now!"
 life_extension.0400a.tt:0 "You will attempt the ritual to become a Ravenbound.\n\nThe higher your[arcana_i][arcana|E], the better are your chances of success.\n\nFailure may result in #N death#!."
 life_extension.0400b:0 "I need more time to prepare for this."
 life_extension.0400b.tt:0 "You will not attempt the ritual. You may try again in the future, when you feel ready."
 life_extension.0401.desc:0 "My false and former skin slipping from my form is liberating. The night sky is brighter, the winds carry myriad birdsongs from the corners of the world. My feathers are bloody and bright, I gather the false skin and graft it back unto my body - A facsimile, a ruse. I am now more, kin to the blackbirds and the dancers of the skein."
 life_extension.0401.t:0 "Skintwisting and the Dance"
 life_extension.0401a:0 "Twenty steps, four pieces of flesh, and a former life discarded."
 life_extension.0402.desc:0 "Perhaps the dance was incorrent, perhaps the steps were imprecise, perhaps it was mere chance. My skin slipped gently, yet I feel only searing pain. Agony burning through my veins, I stopped the dance. It was all a mistake! My ritual had gone awry and now I must live with my pitiful half-healed half-skin."
 life_extension.0402.t:0 "Skintwisting and the Dance"
 life_extension.0402a:0 "The colour red has become familiar with me now, dripping forever and ever..."
 life_extension.0403.desc:0 "It was too much, the fatigue overtook me even before the piping and beating of unseen instruments ceased. Too much and too little in the end. When I fell unto the earth, my skin bloomed with black and red - Feathers and blood escaping from beneath. They all took flight before I slipped away."
 life_extension.0403.t:0 "Skintwisting and the Dance"
 life_extension.0403a:0 "Fly, fly, fly away from all my woes..."
 life_extension.0410.death:0 "The ritual goes horribly wrong..."
 life_extension.0410.desc:0 "The Ravenbounds are wise and dangerous, and the journey to their coven is unsafe. It's foolish to trust them, but the land we're both bound to burns. They know I'm here to have my heart carved out of my body, to find a perilous strength in the shadow of our god. Outside, a hag picks a budding briar off a flowering corpse. They will provide it, and more, at the price of a great agony and a not-quite-life."
 life_extension.0410.failure:0 "The ritual is a failure"
 life_extension.0410.success:0 "The ritual is a success!"
 life_extension.0410a:0 "Tie my limbs and put a stick between my teeth!"
 life_extension.0410a.tt:0 "You will attempt the ritual to become a Rootbound.\n\nThe higher your[prowess_i][prowess|E], the better are your chances of success.\n\nFailure may result in #N death#!."
 life_extension.0410b:0 "I cannot shoulder this risk."
 life_extension.0410b.tt:0 "You will not attempt the ritual. You may try again in the future, when you are ready."
 life_extension.0411.desc:0 "Blessed by curses! Cursed with blessings! A briar heart pumps sap and ichor in the hollow of my chest! Through the white-hot coals of pain I feel the hags' razors whittling my soul down to a deadly spearpoint! Now, my limbs may break, my organs may fail, yet still I will keep living. Yet still I will keep living! Until my fire burns through all fuel!"
 life_extension.0411.t:0 "Not Blood, Not Lymph"
 life_extension.0411a:0 "To hunt! To hunt! To lead a great hunt!"
 life_extension.0412.desc:0 "The crone of the coven hunches over me with a razor, but even as it digs into my ribs, she does not cut. I hear them whisper.\n\n"Weak... Too weak!!" They erupt into cawing and flapping of cloth all at once. "Weak of mind! Weak of body! Feeble, feeble child!"\n\nThe crone slashes my restrains and shoves me off the altar. "Go! Leave! You are not worth the blood!" The noise grows louder and more disturbing as I hurry outside faster than my legs can carry me."
 life_extension.0412.t:0 "Not Blood, Not Lymph"
 life_extension.0412a:0 "I am lucky to have lived."
 life_extension.0413.desc:0 "Blood sprays endlessly out of my wound. The crone looks coldly at the beating heart in her hand. Cruel runes and healing magick that keep my soul within my body begin to fail.../n/nAh, the briar is not blooming within my chest..."
 life_extension.0413.t:0 "Not Blood, Not Lymph"
 life_extension.0413a:0 "All that pain... wasted..."
