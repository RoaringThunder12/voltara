 vt_request_citadel_acolyte_desc:0 "Ask the Citadel to send an acolyte to serve as your court priest. Their training is less complete, but their services cost less than those of a fully trained priest."
 vt_request_citadel_acolyte_confirm:0 "Receive the acolyte"
 vt_weave_experiment:0 "Experiment with the Weave"
 vt_weave_experiment_desc:0 "Turn restless curiosity into a magical experiment. The outcome may bring insight, discomfort, or unexpected changes."
 vt_weave_experiment_confirm:0 "Prepare the experiment"
 vt_ascend_ravenbound:0 "Undertake the Ravenbound Rite"
 vt_ascend_ravenbound_desc:0 "Bind your lifespan to the Weave through an ancient rite of transformation. The ritual costs 1,000 piety and 100 Thread Reserve if attempted; failure can kill you."
 vt_ascend_ravenbound_confirm:0 "Review the ritual"
 vt_ascend_rootbound:0 "Undertake the Rootbound Rite"
 vt_ascend_rootbound_desc:0 "Replace your mortal heart with a living vessel of bound power. The ritual costs 1,000 piety if attempted; failure can kill you."
 vt_ascend_rootbound_confirm:0 "Review the ritual"
