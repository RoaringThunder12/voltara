l_english:
 rule_agot_dragon_trait_inheritance:0 "Dragon Eggs: Inherited Traits"
 setting_agot_dragon_trait_inheritance_full:0 "Full"
 setting_agot_dragon_trait_inheritance_full_desc:0 "Use AGOT's full inherited-trait chances for dragon hatchlings, with parents recorded when an egg is laid."
 setting_agot_dragon_trait_inheritance_reduced:0 "Reduced"
 setting_agot_dragon_trait_inheritance_reduced_desc:0 "Use reduced AGOT inherited-trait probabilities."
 setting_agot_dragon_trait_inheritance_half:0 "Half"
 setting_agot_dragon_trait_inheritance_half_desc:0 "Use half-strength AGOT inherited-trait probabilities."
 setting_agot_dragon_trait_inheritance_disabled:0 "Disabled"
 setting_agot_dragon_trait_inheritance_disabled_desc:0 "Newborn dragons retain their randomly generated traits without parental trait rolls."
 voltara_cradle_dragon_egg_desc:0 "Keep a living dragon egg close and tend it patiently. Each year it may hatch, remain dormant, or turn to stone. You may cradle only one egg at a time. Use the egg browser or the Cradle Dragon Egg interaction to choose a particular egg."
 voltara_cradle_dragon_egg_tooltip:0 "Begin tending a viable egg, with a hatching check each year."
 voltara_cradle_dragon_egg_confirm:0 "I will cradle the egg."
 vt_egg_port.1.t:0 "A Bond Born in Fire"
 vt_egg_port.1.desc:0 "The egg I have tended cracks open. A newborn dragon emerges, its gaze meeting mine. Our bond has begun."
 vt_egg_port.1.a:0 "Welcome to the world."
 vt_egg_port.2.t:0 "New Life in the Dragonpit"
 vt_egg_port.2.desc:0 "The keepers bring joyful news: an egg has hatched. The newborn dragon remains in the pit, cared for and waiting for a future companion."
 vt_egg_port.2.a:0 "See that the hatchling is well cared for."
 vt_egg_port.3.t:0 "An Egg Turned to Stone"
 vt_egg_port.3.desc:0 "The warmth has left the egg. Its shell has hardened into lifeless stone. Ordinary cradling and incubation can no longer awaken it, though a dangerous hatching ceremony may yet offer hope."
 vt_egg_port.3.a:0 "I will keep it safe."
 vt_egg_port.10.t:0 "An Egg for the Cradle"
 vt_egg_port.10.desc:0 "With a child newly born into my family, I could place one of my spare dragon eggs in the cradle. In time, child and hatchling might grow together."
 vt_egg_port.10.a:0 "Let an egg share the child's cradle."
 vt_egg_port.10.b:0 "I will choose an egg another time."
 vt_egg_petrified_desc:0 "An Illustrious dragon egg that has turned to stone. It cannot hatch through ordinary cradling or dragonpit incubation; a hatching ceremony may still awaken it."
 vt_cradle_egg_interaction:0 "Cradle Dragon Egg"
 vt_cradle_egg_interaction_desc:0 "Choose an egg to cradle. This replaces any egg you are currently cradling. A viable egg is checked for hatching each year."
 vt_stop_cradling_interaction:0 "Stop Cradling Dragon Egg"
 vt_stop_cradling_interaction_desc:0 "Set your cradled egg aside without destroying it."
 vt_give_dragon_egg:0 "Give Dragon Egg"
 vt_give_dragon_egg_desc:0 "Give a selected egg to this character. Eligible recipients without another cradled egg will begin tending it, including children."
 vt_incubate_dragon_egg:0 "Incubate Egg in Dragonpit"
 vt_incubate_dragon_egg_desc:0 "Place an egg under the care of a functioning dragonpit in your realm. Incubation is checked each year. The hatchling will remain unbonded in the pit."
 vt_retrieve_dragon_egg:0 "Retrieve Incubating Egg"
 vt_retrieve_dragon_egg_desc:0 "End this egg's incubation and return it to ordinary care."
 vt_demand_dragon_egg:0 "Demand Dragon Egg"
 vt_demand_dragon_egg_desc:0 "Spend 2,000 Prestige to demand a selected dragon egg. Its holder can refuse; family, opinion and vassalage affect acceptance."
 vt_take_prisoner_dragon_egg:0 "Seize Prisoner's Dragon Egg"
 vt_take_prisoner_dragon_egg_desc:0 "Take a selected, unlocked egg from a prisoner in your custody."
 vt_egg_browser_title:0 "Dragon Eggs and Their Holders"
 vt_living_dragons_title:0 "Living Dragons"
 vt_egg_browser_help:0 "Inspect an egg or its holder. The controls below your own eggs let you cradle, set aside, or incubate them. Right-click a character for egg gifts and demands."
 vt_living_dragons_help:0 "Select a portrait to inspect a living dragon and its available interactions."
 vt_egg_close:0 "Close"
 vt_egg_cradle:0 "Cradle"
 vt_egg_stop:0 "Set Aside"
 vt_egg_incubate:0 "Incubate"
 vt_egg_cradle_tip:0 "Requires an unlocked, viable egg and no living bonded dragon. Replaces your current cradled egg."
 vt_egg_stop_tip:0 "Stop cradling or incubating this egg. Eggs committed to a ceremony cannot be moved."
 vt_egg_incubate_tip:0 "Requires an unlocked, viable egg and a functioning dragonpit in your realm."
 vt_egg_card_owner:0 "Holder: [Artifact.GetOwner.GetUINameNotMeNoTooltip]"
 vt_egg_card_status:0 "[Artifact.Custom('vt_egg_care_status')]"
 vt_egg_status_stone:0 "Petrified — ceremony required"
 vt_egg_status_ritual:0 "Committed to a hatching ceremony"
 vt_egg_status_cradled:0 "Being cradled"
 vt_egg_status_pit:0 "Incubating in a dragonpit"
 vt_egg_status_idle:0 "Viable — awaiting care"
 vt_dragon_card_age:0 "Age: [Character.GetAge]"
 vt_dragon_card_rider:0 "Companion: [Character.MakeScope.Var('current_rider').GetCharacter.GetUINameNotMeNoTooltip]"
 rule_vt_egg_cradle_chance:0 "Dragon Eggs: Cradling"
 setting_vt_egg_cradle_normal:0 "Normal"
 setting_vt_egg_cradle_normal_desc:0 "Annual AGOT-style hatch, dormant and petrification rolls. Longer cradling reduces the chance of success."
 setting_vt_egg_cradle_rare:0 "Rare"
 setting_vt_egg_cradle_rare_desc:0 "Cradled eggs have one quarter of the normal hatch weight."
 setting_vt_egg_cradle_guaranteed:0 "Guaranteed"
 setting_vt_egg_cradle_guaranteed_desc:0 "A viable, eligible cradled egg hatches on its next annual check after the starting year."
 setting_vt_egg_cradle_never:0 "Never"
 setting_vt_egg_cradle_never_desc:0 "Cradled eggs remain dormant without petrifying from cradling."
 rule_vt_egg_pit_chance:0 "Dragon Eggs: Dragonpit Incubation"
 setting_vt_egg_pit_normal:0 "Normal"
 setting_vt_egg_pit_normal_desc:0 "Each eligible year, a pitted egg has a 2% hatch chance and a 1% petrification chance."
 setting_vt_egg_pit_frequent:0 "Frequent"
 setting_vt_egg_pit_frequent_desc:0 "The annual hatch weight is multiplied by five."
 setting_vt_egg_pit_guaranteed:0 "Guaranteed"
 setting_vt_egg_pit_guaranteed_desc:0 "A viable, eligible pitted egg hatches on its next annual check after the starting year."
 setting_vt_egg_pit_never:0 "Never"
 setting_vt_egg_pit_never_desc:0 "Eggs remain dormant in dragonpits without petrifying from incubation."
