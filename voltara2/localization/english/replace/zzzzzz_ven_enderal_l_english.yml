l_english:
 ven_lodge_government:0 "Lodge Kingship"
 ven_lodge_government_with_icon:0 "@government_type_feudal! $ven_lodge_government$"
 ven_lodge_government_desc:0 "Enderal is governed through hereditary estates and the consent of its bear lodges. The Bear Kingsmoot elects the crown from adult northern claimants, kin and landed lodge leaders. Werebear blood, prowess, service and the Northern Creed carry weight, but no bloodline owns the throne. Sworn werebears may challenge a fit king before the lodge witnesses."
