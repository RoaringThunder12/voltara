 ven_kingsmoot_law:0 "Bear Kingsmoot"
 ven_kingsmoot_law_effects:0 "Enderal’s crown passes to the candidate elected by its landed lodge representatives. Adult northern kin, claimants and vassals may stand. Werebears, sworn lodge members, proven champions and faithful servants of the Northern Creed are favored."
 ven_kingsmoot:0 "Bear Kingsmoot"
 ven_electors:0 "Lodge Representatives"
