 ven_vote_creed:0 "Keeper of the Northern Creed"
 ven_vote_champion:0 "Proven in the challenge ring"
 ven_vote_service:0 "Service to the winter hearths"
 ven_vote_oathbreaker:0 "Broke the royal oath"
 ven_vote_pledge:0 "My pledged candidate"
 ven_vote_prowess:0 "A formidable protector"
 ven_vote_cruelty:0 "Cruelty dishonors the hearth"
 ven_lodge_bond:0 "Sworn to the Bear Lodges"
 ven_lodge_bond_desc:0 "Hospitality, witness and service bind this character to Enderal’s lodges."
 ven_hearth_service:0 "Protector of the Winter Hearths"
 ven_hearth_service_desc:0 "The lodges remember food, shelter and protection more clearly than boasts."
 ven_ring_victor:0 "Champion of the Bear Ring"
 ven_ring_victor_desc:0 "A witnessed throne challenge proved this ruler’s courage."
 ven_refused_challenge:0 "Refused the Bear Ring"
 ven_refused_challenge_desc:0 "A lawful challenger was denied a hearing before the lodges."
 ven_oathbreaker:0 "Broken Hearth Oath"
 ven_oathbreaker_desc:0 "The king promised to sustain the winter hearths and withheld the pledged stores."
 ven_royal_hearth:0 "Royal Winter Stores"
 ven_royal_hearth_desc:0 "Food and timber sustain the settlements through the northern cold."
 ven_lodge_debate:0 "Voice of the Kingsmoot"
 ven_lodge_debate_desc:0 "A persuasive address has brought this candidate to the lodges’ attention."
 ven_lodge_friend:0 "Lodge Fellowship"
 ven_challenge_grudge:0 "Challenged My Crown"
 voltara_order_rite_26_desc:0 "The Northern Creed teaches that Order is kept through shelter, sworn witness and the defense of the living. Enderal’s bear lodges guard ancestral groves, shelter travelers and judge royal promises. Bear-blood is revered as a burden of guardianship, never a license for cruelty. The Kingsmoot may raise a worthy protector above a royal heir, and the ring permits a sworn werebear to test a king before living witnesses."
 tradition_ven_bear_lodges_name:0 "Bear Lodges"
 tradition_ven_bear_lodges_desc:0 "The lodges are Enderal’s winter shelters, witness courts and schools of restraint. Their sworn members judge rulers by service as well as strength. Bear-blooded protectors are honored, but the law binds a mighty werebear as surely as an ordinary hunter."
 culture_parameter_ven_lodge_tradition:0 "The bear lodges sustain the Kingsmoot, witnessed throne challenges and the duty to provision the winter hearths."
 ven_gather_moot:0 "Convene the Bear Kingsmoot"
 ven_gather_moot_desc:0 "Summon the landed lodges for forty-five days of testimony and campaigning. Their votes determine the crown’s elected successor. A living ruler keeps the crown; candidates must win the lodges rather than inherit their allegiance."
 ven_gather_moot_tooltip:0 "Convene the Bear Kingsmoot"
 ven_gather_moot_confirm:0 "Proceed"
 ven_stand_moot:0 "Speak Before the Bear Kingsmoot"
 ven_stand_moot_desc:0 "Present your deeds, service or devotion before the lodge witnesses. Reputation influences the election; speak again only after your earlier campaign has run its course."
 ven_stand_moot_tooltip:0 "Speak Before the Bear Kingsmoot"
 ven_stand_moot_confirm:0 "Proceed"
 ven_winter_service:0 "Provision the Winter Hearths"
 ven_winter_service_desc:0 "Send food, timber and guides to the northern lodges. Their gratitude strengthens your standing in the Kingsmoot and helps the people living in your domain."
 ven_winter_service_tooltip:0 "Provision the Winter Hearths"
 ven_winter_service_confirm:0 "Proceed"
 ven_review_moot:0 "Review the Bear Kingsmoot"
 ven_review_moot_desc:0 "Review Enderal’s elective crown, lodge fellowship, royal duties and the right of challenge. Open the title’s succession panel to nominate a candidate and inspect individual votes."
 ven_review_moot_tooltip:0 "Review the Bear Kingsmoot"
 ven_review_moot_confirm:0 "Proceed"
 ven.1.t:0 "The Lodges Gather"
 ven.1.desc:0 "The horns sound through Enderal. Elders, landholders and bear-blooded families come to name the qualities they expect in a king. Birth opens a door; courage, generosity and sworn service decide whose name the lodges will remember."
 ven.1.0:0 "Let every lodge speak."
 ven.2.t:0 "A Voice at the Kingsmoot"
 ven.2.desc:0 "The crown has summoned the bear lodges. The northern hearths need a protector, and every representative may name the person best suited to the burden. Will I seek their attention, speak for a companion, or simply listen?"
 ven.2.0:0 "I will speak of my deeds."
 ven.2.1:0 "The people need stores, not boasts."
 ven.2.2:0 "I will listen before choosing."
 ven.3.t:0 "Before the Witness Stones"
 ven.3.desc:0 "The lodge fire illuminates faces I have known for years. The witnesses ask what I have done for Enderal, and what I would do with its crown. A tale told here can outlive the teller."
 ven.3.0:0 "Speak of courage in the mountain passes."
 ven.3.1:0 "Promise shelter for every northern hearth."
 ven.3.2:0 "Honor the Creed and the ancestral witnesses."
 ven.3.3:0 "Let my bear-blood be seen, under control."
 ven.3.4:0 "I have more to learn before I claim their trust."
 ven.4.t:0 "The Embers of the Moot"
 ven.4.desc:0 "The last delegations return home. No oath at this gathering has made the crown hereditary: the lodges may change their votes as deeds and promises change. The chosen successor remains visible in Enderal’s succession panel."
 ven.4.0:0 "Their judgment is a duty I must earn."
 ven.5.t:0 "The Crown Before the Lodges"
 ven.5.desc:0 "Enderal has a new crown-holder. Before the witnesses accept my rule, they ask what I will safeguard. The bear lodges remember promises across generations, and a king’s ancestry cannot excuse a broken oath."
 ven.5.0:0 "I will fill the winter hearths."
 ven.5.1:0 "I will uphold the ring and the lodges’ judgment."
 ven.5.2:0 "No assembly will bind my crown."
 ven.6.t:0 "The First Winter of My Oath"
 ven.6.desc:0 "The lodge keepers have counted their stores. I promised that the crown would help the hearths through winter; now they ask for the timber and grain that were pledged before the witnesses."
 ven.6.0:0 "Send the promised stores."
 ven.6.1:0 "The crown cannot spare them."
 ven.8.t:0 "Smoke Above the Winter Hearths"
 ven.8.desc:0 "The supply trains reach the lodges before the passes close. Guides open their doors to travelers, families share the stored grain, and the elders speak my name beside the fire."
 ven.8.0:0 "A ruler should be remembered for this."
 ven.9.t:0 "The Bear Kingsmoot"
 ven.9.desc:0 "The crown of Enderal is elective. Northern adult kin, claimants and landed vassals can stand; landed lodge representatives cast their votes in the crown’s succession panel. Bear-blood, the Northern Creed, service and sworn fellowship carry weight. A werebear who has joined the lodges may challenge a fit ruler, but victory must be witnessed and political promises still bind the winner."
 ven.9.0:0 "I understand the law of the lodges."
 ven.10.t:0 "A Challenge Before the Bear Ring"
 ven.10.desc:0 "[scope:ven_challenger.GetTitledFirstName] has named me before the lodge witnesses. Under the old law, a sworn werebear may demand that a fit ruler defend the crown in the ring. The fight ends at submission; the victor takes Enderal, while the defeated keeps a life to reckon with."
 ven.10.0:0 "I will defend my crown."
 ven.10.1:0 "The lodges shall witness my abdication."
 ven.10.2:0 "I refuse this challenge."
 ven.11.t:0 "The Witnessed Ring"
 ven.11.desc:0 "The weapons are inspected and the lodge keepers repeat the terms. Neither an assassin nor a foreign army will choose Enderal’s ruler today. The witnesses will stop the contest at submission, and the crown follows their judgment."
 ven.11.0:0 "Let the trial begin."
 ven.13.t:0 "Judgment of the Bear Ring"
 ven.13.desc:0 "The witnesses have upheld my cause. The crown’s authority now rests upon a public judgment, but courage in the ring does not fill a hungry hearth or settle every quarrel. I must still govern."
 ven.13.0:0 "Let my rule honor the judgment."
 ven.14.t:0 "A Crown Beyond My Reach"
 ven.14.desc:0 "The witnessed contest has ended against me. I leave the ring alive, and the lodges will remember that I submitted to their judgment. My family, lands and ambitions remain; the crown is another matter."
 ven.14.0:0 "I will live with the judgment."
 ven.15.t:0 "The Ring Falls Silent"
 ven.15.desc:0 "The lawful conditions for the challenge have changed. A death, imprisonment, war or change of ruler has made the contest impossible. No crown changes hands through an invalid challenge."
 ven.15.0:0 "Let the witnesses disperse."
 ven.16.t:0 "A Crown That Would Not Answer"
 ven.16.desc:0 "The ruler has refused my challenge before the witnesses. I gain no crown by refusal alone, but the lodges will weigh the dishonor when they judge the next ruler."
 ven.16.0:0 "They heard my challenge and the answer."
 ven_challenge_crown_interaction:0 "Challenge for Enderal’s Crown"
 ven_challenge_crown_interaction_desc:0 "Invoke a sworn werebear’s right to challenge the ruler before the bear lodges. Costs 250 Prestige. A witnessed, nonlethal duel can transfer the crown; refusal harms the ruler’s standing. A challenger must wait five years between challenges, and the crown faces at most one challenge per year."
 ven_seek_lodge_support_interaction:0 "Seek a Lodge Pledge"
 ven_seek_lodge_support_interaction_desc:0 "Ask this lodge representative to support your candidacy for five years. Acceptance costs 50 Prestige and strongly influences their elective vote, but does not override the player’s nomination or every other political consideration."
