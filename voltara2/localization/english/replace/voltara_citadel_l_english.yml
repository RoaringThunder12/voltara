 artifact_grandmaester_chain_desc:0 "This ceremonial necklace is worn by the High Luminary of the Severosi Throne. Unlike a traditional high priest's chain, gems are woven into its links in addition to the typical metals."
 agot_must_be_archmaester_desc:0 "You must be an archpriest to wear this. If you are seeing this, shame on you."
 agot_must_be_grandmaester_desc:0 "You must be the High Luminary to wear this. If you are seeing this, shame on you."
