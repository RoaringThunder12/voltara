 vt_send_child_to_citadel:0 "Educate at the Citadel"
 vt_send_child_to_citadel_desc:0 "Send your child to study under the Archpriests in Casavina until adulthood. This grants the benefits of university education without taking priestly vows or surrendering inheritance."
 vt_citadel_student_modifier:0 "Studying at the Citadel"
 vt_citadel_student_modifier_desc:0 "Receiving an education from the learned clergy of the Citadel of Order."
 vt_citadel.0001.t:0 "Home from the Citadel"
 vt_citadel.0001.desc:0 "[vt_citadel_graduate.GetFirstName] has completed [vt_citadel_graduate.GetHerHis] studies in Casavina and returned to my court. The Citadel has provided an education; the path ahead remains [vt_citadel_graduate.GetHerHis] to choose."
 vt_citadel.0001.a:0 "Welcome home."
 maester_court_position:0 "High Priest"
 maester_court_position_desc:0 "A scholar trained at the Citadel of Order, serving the court as a learned adviser."
 vt_destroy_citadel_decision:0 "Destroy the Citadel"
 vt_destroy_citadel_decision_desc:0 "Casavina is mine. The Citadel has long trained servants of Aeliun and bound knowledge to Order. I can tear down its halls and scatter its scholars."
 vt_destroy_citadel_decision_tooltip:0 "Close and devastate the conquered Citadel."
 vt_destroy_citadel_decision_confirm:0 "Tear down their halls."
 vt_destroy_citadel_consequences:0 "The Citadel closes. Students return home and its clergy disperse. Admissions, training and recruitment stop until an Aeliunist ruler recovers Casavina and rebuilds it."
 vt_restore_citadel_decision:0 "Rebuild the Citadel"
 vt_restore_citadel_decision_desc:0 "Casavina has returned to Aeliunist hands. Restore the Citadel, gather its scholars and reopen its halls to students."
 vt_restore_citadel_decision_tooltip:0 "Restore Citadel education and priestly training."
 vt_restore_citadel_decision_confirm:0 "Restore the halls of learning."
 vt_citadel_ruins_modifier:0 "Ruins of the Citadel"
 vt_citadel_ruins_modifier_desc:0 "The Citadel has been devastated and its scholars scattered."
 game_concept_maester:0 "High Priest"
 game_concept_maesters:0 "High Priests"
 game_concept_maester_desc:0 "A scholar of the Citadel of Order. Novices study under Archpriests and earn chain links before qualifying for service at Aeliunist courts."
 artifact_maester_link:0 "Scholarly Link"
 vt_citadel_open:0 "The Citadel of Order is open"
 vt_controls_citadel_county:0 "Casavina is part of your realm"
 agot_send_to_citadel_interaction_desc:0 "Ask this man to join the Citadel of Order as a novice and train to become a High Priest. This is a lifelong vocation: he will forgo marriage and inheritance. For temporary schooling, use Educate at the Citadel."
 send_to_silent_sisterhood_interaction_desc:0 "Ask this Aeliunist woman to take vows as a Priestess of Order. She will leave court for the Sisterhood, forgoing marriage and inheritance."

 vt_citadel.0003.t:0 "The Citadel Falls"
 vt_citadel.0003.desc:0 "The Citadel of Order has been destroyed. Its scholars have scattered and [vt_citadel_graduate.GetFirstName] has returned home, studies abruptly ended."
 vt_citadel.0003.a:0 "At least you are safe."
