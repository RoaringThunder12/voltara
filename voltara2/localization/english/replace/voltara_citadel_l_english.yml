 rum: "rum"
 decision_employ_maester:0 "Send for a High Priest"
 decision_employ_maester_tooltip:0 "You will call for a [maester|E]"
 decision_employ_maester_desc:0 "Renowned throughout the known world as the center of Voltarai knowledge, the Citadel of [GetTitleByKey('c_oldtown').GetNameNoTier] provides every keep in Voltara with a trained man of learning. Perhaps I should send for one."
 decision_employ_maester_effect:0 "A capable high priest will be selected to attend you and arrive at your court shortly."
 decision_employ_maester_confirm:0 "Send a raven to Casavina"
 tooltip_employ_maester:0 "Must not have any capable high priests at court."
 tooltip_recently_employed_maester:0 "Must not have recently tried to employ a high priest."
 agot_maester.0001.t:0 "The New High Priest of [capital.GetNameNoTooltip]"
 agot_maester.0001.t_alt:0 "A New High Priest"
 agot_maester.0001.desc:0 "The high priest I sent for from the Citadel has arrived in [capital.GetNameNoTooltip], a [new_maester.GetCulture.GetName] by the name of [new_maester.GetFirstName]. Let us hope [new_maester.GetSheHe] will be loyal and wise."
 agot_maester.0001.a:0 "Good."
 agot_maester.0001.b:0 "I'm afraid we no longer have space in the accounts for your service."
 agot_maester.0002.t:0 "High Luminary of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 agot_maester.0002.desc:0 "In your capacity as [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTier], you will now be assisted by the High Luminary."
 agot_maester.0002.a:0 "Good."
 agot_maester.0002.a.tt:0 "The high priest will serve as both a councillor and your court physician."
 agot_maester.0005.t:0 "The New "High Priest" of [capital.GetNameNoTooltip]"
 agot_maester.0005.desc:0 "[new_maester.GetFirstName] is a dubious physician at best. [new_maester.GetSheHe|U] claims to have been a former high priest until the Conclave stripped [new_maester.GetHerHim] of [new_maester.GetHersHis] chain. It's not too late to send [new_maester.GetHerHim] away."
 agot_maester.0005.a:0 "I have no qualms with this."
 agot_maester.0005.b:0 "I will not stoop this low."
 agot_maester.0006.desc:0 "Supposedly, High Priest [new_maester.GetFirstName] happened to be in the area when [new_maester.GetSheHe] heard of my call for a new high priest. Let us hope [new_maester.GetSheHe] will be loyal and wise."
 agot_maester.0007.t:0 "High Priestless"
 agot_maester.0007.desc:0 "My search for a new high priest hasn't borne any fruit. It seems [capital.GetNameNoTooltip] will go without a high priest for the foreseeable future."
 agot_maester.0007.a:0 "How disappointing."
 agot_maester.0008.t:0 "The Wandering Acolyte"
 agot_maester.0008.desc:0 "[acolyte.GetFirstName] claims to have spent time studying at the Citadel, but without a high priest's chain, it's impossible to be certain. [acolyte.GetSheHe|U] apparently did not progress far in [acolyte.GetHerHis] studies. Although [acolyte.GetFirstNameNoTooltip] is not exactly who I had in mind, [acolyte.GetSheHe] is better than nothing."
 agot_maester.0008.a:0 "[acolyte.GetSheHe|U] will have to do."
 agot_maester.0008.b:0 "I demand better."
 agot_maester.1000.t:0 "Links in a Chain"
 agot_maester.1000.desc:0 "[child.GetFirstName] is a quiet child. [child.GetSheHe|U] prefers the company of bookkeepers and the high priest to that of squires and knights. [child.GetSheHe|U] would rather spend the evenings in [child.GetHerHis] room, surrounded by books and scrolls, than in the yard practicing [child.GetHerHis] swordplay.\n\nThe day finally comes when [child.GetSheHe] approaches me, [child.Custom('quirk_pos_present')], and speaks of [child.GetHerHis] wish to leave [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] and journey to the Citadel. There, [child.GetSheHe] may begin [child.GetHerHis] studies and work towards forging a chain, that [child.GetSheHe] may one day serve the realm as a high priest."
 agot_maester.1000.a:0 "You may take your leave to the Citadel on the morrow."
 agot_maester.1000.b:0 "You are a [ROOT.Char.GetDynastyNameNoTooltip], not a Grey Rat!"
 agot_maester.1001.t:0 "A New Archpriest"
 agot_maester.1001.desc:0 "High Priest [archmaester_candidate.GetFirstName] has come to me with great excitement. He claims that since the passing of Archpriest [dead_archmaester.GetFirstName], there has been a vote at the Citadel for his replacement. The members of the Conclave have determined High Priest [archmaester_candidate.GetFirstNameNoTooltip] shall be raised to the office of Archpriest and has been summoned back to the Citadel."
 agot_maester.1001.a:0 "This is great news!"
 agot_maester.1001.a.tt:0 "High Priest [archmaester_candidate.GetFirstNameNoTooltip] will be raised to the title of Archpriest and will depart for the Citadel."
 agot_maester.1002.t:0 "A New High Luminary"
 agot_maester.1002.desc_death:0 "With the passing of High Luminary [old_grandmaester.GetFirstName], "
 agot_maester.1002.desc_disgraced:0 "With the dismissal of former High Luminary [disgraced_maester.GetFirstName], "
 agot_maester.1002.desc:0 "the Conclave at the Citadel has chosen High Luminary [grandmaester_candidate.GetFirstName] to be their new voice at the Royal Court. It seems he is on his way."
 agot_maester.1002.a:0 "I can't wait."
 agot_maester.1002.b:0 "He better be competent."
 agot_maester.1003.t:0 "New High Luminary Arrives"
 agot_maester.1003.desc:0 "High Luminary [grandmaester_candidate.GetFirstName] has arrived at court at last. Let us hope he serves the realm faithfully."
 agot_maester.1003.a:0 "Watch your step."
 agot_maester.1004.t:0 "A Grand Disappointment"
 agot_maester.1004.desc:0 "High Luminary [old_grandmaester.GetFirstName] has reportedly died en route to accepting his position. The Conclave has begun deliberations for selecting a new High Luminary."
 agot_maester.1004.a:0 "I hope this next one lasts."
 agot_maester.1005.t:0 "A Questioning Mind"
 agot_maester.1005.desc:0 "High Priest [maester.GetFirstName] has come to me about one of my children. [maester.GetSheHe|U] claims [child.GetFirstName] shows great promise in [child.GetHerHis] studies and may make a fine candidate for the Citadel. There, [maester.GetSheHe] says, [child.GetFirstNameNoTooltip] could find [child.GetHerHis] own path and work towards forging a chain, that [child.GetSheHe] may one day serve the realm as a high priest."
 agot_maester.1005.a:0 "[child.GetFirstName] leaves for the Citadel on the morrow."
 agot_maester.1005.b:0 "My child is a [ROOT.Char.GetDynastyNameNoTooltip], not a Grey Rat!"
 agot_maester.1006.t:0 "Your High Priest, Disgraced"
 agot_maester.1006.desc:0 "Word has come from the Citadel; in light of [disgraced_maester.GetFirstNamePossessive] [secret.GetName] secret, the Conclave has revoked [disgraced_maester.GetHerHis] title as high priest. As [disgraced_maester.GetHerHis] liege and [ROOT.Char.GetLadyLord], the Conclave has bid me to send [disgraced_maester.GetHerHim] into exile. In exchange, they have offered to send a new high priest to my court."
 agot_maester.1006.a:0 "I want nothing to do with you, grey rat."
 agot_maester.1006.a.tt:0 "[disgraced_maester.GetName] will be exiled from Voltara"
 agot_maester.1006.b:0 "A cold cell is where you belong."
 agot_maester.1006.b.tt:0 "[disgraced_maester.GetName] will be imprisoned by you"
 agot_maester.1006.c:0 "This has changed nothing."
 agot_maester.1006.c.tt:0 "[disgraced_maester.GetName] will stay on as your high priest"
 agot_silent_sisters.sent_to_silent_sisters:0 "[sister_candidate.GetFirstNameOrMe|U] will be sent to join the Sisterhood of Order."
 agot_silent_sisters.0003.t:0 "A Silent Child?"
 agot_silent_sisters.0003.desc.volunteering:0 "[sister_candidate.GetName] has never been a difficult or particularly loud child. For this reason I am jolted when I hear a quiet rapping on my study door. Her face appears through the door crack as she slowly steps inside. "I....have a request." she says in a quiet voice, fiddling with her hands. Rarely one to speak up, this is a surprise. "What is it child?" I ask, gently prompting her.\n\n"I wish to join the Priestesses of Order." she says, meeting my gaze with an uncharacteristic determination. "I wish to swear the vows and to dedicate my life in quiet service to Aeliun". I am taken aback by this request. The Sisterhood of Order? For [sister_candidate.GetFirstName], my own daughter? A noble cause perhaps, but to live so extremely...even if it is what she wants, is this the life I want for her?"
 agot_silent_sisters.0003.desc.suggesting:0 "[sister_candidate.GetName] has never been a difficult or particularly loud child, and it has been evidently on display today. Apparently today she was praying in the sept when a horse that was let loose from the stables galloped in! Whether afraid to speak up or simply out of piety, [sister_candidate.GetFirstName] was the only one to not react at all!\n\nSuch a...different child she is. I wonder if the life of a noble lady is really the best thing for her. Will she be able to hold court, to keep a house organized, to raise children? Though I am surprised by the thought, I wonder if she should perhaps join the Sisterhood of Order? She seems the perfect candidate, and perhaps would lead a better life there. Yet, could I send my own daughter? They live so extremely...is this the life I want for her?"
 agot_silent_sisters.0003.a:0 "Yes, the Sisterhood will serve [sister_candidate.GetFirstName] well."
 agot_silent_sisters.0003.b:0 "Nonsense, no child of mine will marry the Stranger!"
 agot_silent_sisters.0004.t:0 "A Haven For Widows"
 agot_silent_sisters.0004.desc:0 "In the quietude of my chamber, I sit by the flickering candlelight, pondering the path that lies ahead. My husband, no more. The castle feels empty, its stone walls colder than ever, echoing the hollowness within me.\n\nI've heard whispers among the women in the court, subtle suggestions that perhaps it's time for me to consider a life among the Priestesses of Order. To be sworn to the service of the Stranger, the god of death. Forever cloaked in grey, face veiled except for my eyes, I would be taking a vow of silence and chastity, dedicating my life to preparing the dead for the afterlife.\n\nMy succession is secured, and perhaps my duty is done? I cannot deny the appeal such a detachment from the political day-to-day has. Yet, can I really renounce all worldly attachments and embrace silence?"
 agot_silent_sisters.0004.a:0 "I shall write to [silent_sisterhood_holder.GetTitledFirstName] stating my intent."
 agot_silent_sisters.0004.b:0 "No, I will move past this."
 agot_silent_sisters.0005.t:0 "Coveting the Stranger's Wife"
 agot_silent_sisters.0005.desc:0 "I am milling about before the funeral of [dead_relative.GetFirstName] when I see some servants carting a box into the sept where it is to be prepared for the funeral. Following it, a small group of Priestesses of Order walking, heads bowed in prayer. Something about the way one of them moves...draws my eye in a most unholy manner. Without consciously choosing to, I find myself following them inside.\n\nWhen they lay [dead_relative.GetFirstNamePossessive] body on the slab and begin their morbid work I am shocked out of my stupor, the site of the blood of my blood running over the table enough to pull any man out of such thoughts. Yet, just in that moment, her eyes meet mine from across the corpse. Is that...the same spark back? Impossible though it is, I'm sure of it. She is #S interested#!!\n\nBefore I can do anything I am ushered out by one of the more attentive and significantly less attractive sisters through a series of gestures. To my shame, I cannot get her out of my mind for the rest of the funeral. They will be leaving on the morrow...yet, I know where she is staying...do I dare?"
 agot_silent_sisters.0005.a:0 "Oh yes, I dare. I definitely dare."
 agot_silent_sisters.0005.a.flavor:0 "You will visit [attractive_silent_sister.GetFirstNamePossessive] room before she leaves..."
 agot_silent_sisters.0005.b:0 "I could never stain Aeliun such!"
 agot_silent_sisters.0005.b.flavor:0 "On second thought, cuckolding the Stranger seems like a bad idea."
 agot_silent_sisters.0006.t:0 "Unwrapping Pleasure"
 agot_silent_sisters.0006.desc:0 "[attractive_silent_sister.GetFirstName], as I later found her name was, opened the door quickly, and not a single word was exchanged before I was pulled into the room, then her bed, then her embrace. After unwrapping her body from its bonds, I found myself thinking that the Stranger is quite the lucky man. Clearly she was not thinking such though, and the silent carnal pleasure we enjoyed was anything but holy.\n\nAs we finished with a final silent gasp, I lay next to the most exposed woman I'd ever seen. We talked, her voice sweet to my ears, and she clearly had much to say after swearing silence for so long. While the pleasure this brought is undeniable, this is a sacrilege of the highest degree. What, then, shall I do now?"
 agot_silent_sisters.0006.a:0 "We're meant to be together! Somehow..."
 agot_silent_sisters.0006.b:0 "Who better to keep this secret with after all?"
 agot_silent_sisters.0006.c:0 "This was clearly a mistake."
 agot_silent_sisters.0006.c.flavor:0 "[attractive_silent_sister.GetFirstName] will not be pleased after breaking her vows for you."
 agot_silent_sisters.0007.t:0 "A Truly Dark Sister"
 agot_silent_sisters.0007.desc.deviant:0 "It was a beautiful service commemorating [dead_relative.GetNamePossessive] and all [dead_relative.GetHerHis] deeds. Lost in thought as to the meaning of life and death, I find myself in the sept long after the service is over. Such stillness I must have presented that Priestess of Order [defiler.GetFirstName] was not aware of my presence as she stepped towards the body.\n\nAt first I think she is doing the final preparations of the body, but as she starts to undress herself I realize that...oh...oh Gods!"
 agot_silent_sisters.0007.desc.cannibal:0 "It was a beautiful service commemorating [dead_relative.GetNamePossessive] and all [dead_relative.GetHerHis] deeds. Lost in thought as to the meaning of life and death, I find myself in the sept long after the service is over. Such stillness I must have presented that Priestess of Order [defiler.GetFirstName] was not aware of my presence as she stepped towards the body.\n\nAt first I think she is doing the final preparations of the body, but instead she leans down and takes a bloody bite out of [dead_relative.GetFirstNamePossessiveNoTooltip] fresh corpse!"
 agot_silent_sisters.0007.a:0 ""Guards! Arrest this disgusting woman!""
 agot_silent_sisters.0007.b:0 "Perhaps I can use this information..."
 agot_silent_sisters.0007.c:0 "Actually, that does look rather fun!"
 agot_silent_sisters.0007.d:0 ""Me first, me first!""
