l_english:
 spn_wound_incubation.0040.t:0 "A Inquisitor Grows Suspicious"
 spn_wound_incubation.0040.desc:0 "One of your own has the eyes of a monster-inquisitor, and they have been watching you. They corner you quietly: they have seen a sickness like this before, in those touched by the beast. 'Who did this to you?' they ask."
 spn_wound_incubation.0040.a.tt:0 "Give up the one who turned you. The inquisitor will mark them as prey - and if you are loyal or trusting, the betrayal will weigh on you."
 spn_turn_into_hunter:0 "Train as a Inquisitor"
 spn_turn_into_hunter_interaction_desc:0 "You will offer your expertise of being a Inquisitor and the recipient will undergo trials that could result in becoming a inquisitor, getting wounded or even death."
 spn_ask_to_turn_into_hunter:0 "Ask to be trained as a Inquisitor"
 spn_train_hunter_not_yet_toast:0 "Not Yet a Inquisitor"
 spn_hunter_resistance:0 "I am a supernatural inquisitor: $VALUE|=+0$"
 spn_confrontation.0002.desc:0 "After a well-fought battle, you've slain your attacker. [spn_new_created_hunter.GetSheHe|U] lays dead on the floor at your feet. You find notes on his person about the immortal beings of this world. Will you have to deal with more of these Inquisitors?"
 spn_confrontation.0012.desc:0 "After a struggle, you obtain victory. Coated in blood, you look down at the attacker. This [spn_new_created_hunter.GetWomanMan] is carrying weapons meant for immortals. Will more of these Inquisitors come for you?"
 spn_confrontation.0022.desc:0 "With the battle won, you light a candle to get a look at your attacker. [spn_new_created_hunter.GetSheHe|U] had prepared for this encounter. Just not as much as she should have. Hopefully, you'll see no more of these Inquisitors."
 spn_confrontation.0004.a.tt:0 "The inquisitor lives, and remembers nothing. That took something out of you."
 spn_confrontation.0014.a.tt:0 "The inquisitor lives, and remembers nothing. That took something out of you."
 spn_confrontation.0024.a.tt:0 "The inquisitor lives, and remembers nothing. That took something out of you."
 spn_debug_events.0200.desc:0 "#high What the hunting layer is actually running on.#!\n\n#high Trails#! (counties carrying Something Stalks Here): #P [spn_census.MakeScope.Var('spn_dbg_trails').GetValue|0]#!\n#high Warm#! (culprit still alive: the only ones a hunt can use): #P [spn_census.MakeScope.Var('spn_dbg_warm').GetValue|0]#!\n#high Witch trails#! (what a Witch Hunt can be pointed at): #P [spn_census.MakeScope.Var('spn_dbg_witch').GetValue|0]#!\n\n#high Inquisitors in the world#!: #P [spn_census.MakeScope.Var('spn_dbg_hunters').GetValue|0]#!\n#high Creatures#! (vampire, werewolf, hybrid, demon): #P [spn_census.MakeScope.Var('spn_dbg_creature').GetValue|0]#!\n#high Witches#! (the trait, on a ruler): #P [spn_census.MakeScope.Var('spn_dbg_witches').GetValue|0]#!\n\n#high You yourself#! -- the on_death writer's door opens for a creature, or a witch by trait OR by secret. 1 means yes.\n#high  ... a creature#!: #P [spn_census.MakeScope.Var('spn_dbg_self_creature').GetValue|0]#!\n#high  ... a witch, openly or in secret#!: #P [spn_census.MakeScope.Var('spn_dbg_self_witch').GetValue|0]#!\n\n#high Hunts running right now#! (world cap is 6): #P [spn_census.MakeScope.Var('spn_dbg_running').GetValue|0]#!\n\nTrails at 0 after years of play means nothing is writing marks, and no roll anywhere will help. Warm well below Trails means the culprits are dying of other things. Witch trails at 0 with Witches above 0 means witches are not killing anyone the county can find."
 spn_embrace_hunter_decision:0 "Become an Inquisitor"
 spn_embrace_hunter_decision_desc:0 "Take up the sacred work of defending Order against vampires, werebears, necromancers, and Threadbinders. A mortal adult of an Aeliunist rite with at least 12 Learning or the Zealous trait may join the Inquisition."
 spn_embrace_hunter_decision_tooltip:0 "Become an Inquisitor and unlock supernatural hunting skills."
 spn_msg_tooltip_embrace_hunter_desc:0 "You will be prompted to choose which Inquisitor traits you want, or fire a random Inquisitor embrace event, depending on which settings you are using."
 spn_abandon_hunter_decision:0 "Abandon Being a Inquisitor"
 spn_abandon_hunter_decision_desc:0 "Do you wish to stop being a Inquisitor?"
 spn_abandon_hunter_decision_tooltip:0 "Abandon being a Inquisitor"
 spn_msg_tooltip_abandon_hunter_desc:0 "All Inquisitor traits will be removed."
 spn_doctrine_hunter_name:0 "Inquisitor"
 spn_doctrine_hunter_crime_descriptive_name:0 "Criminal Inquisitors"
 spn_doctrine_hunter_crime_desc:0 "These inquisitors are an abomination!"
 spn_doctrine_hunter_shunned_descriptive_name:0 "Shunned Inquisitors"
 spn_doctrine_hunter_accepted_descriptive_name:0 "Accepted Inquisitors"
 spn_doctrine_hunter_accepted_desc:0 "Inquisitors are a necessity to have in this world of monsters."
 spn_doctrine_hunter_virtuous_descriptive_name:0 "Virtuous Inquisitors"
 spn_embrace.2001.t:0 "The Inquisitor"
 spn_embrace.2005.desc.a:0 "You are frozen in place and witnessing this giant beast devour what moments ago was a majestic animal. It resembles that of a wolf but it towers over you as it stands on its hindlegs. It pauses and sniffs towards my direction. The realization that you are discovered strikes your entire being like an enormous wave.\n\nIt slowly approaches as you make no attempt to flee. The dread grows as it gets closer. By some miracle, your fellow inquisitors find you and fire arrows at the beast, it manages to kill some of them and you get injured in the melee and lose consciousness.\n\nYou awake in your bed in bandages. You feel no pain and seem to have fully healed. Your chancellor enters and explains you were attacked by a large wolf and that your retinue saved you. No one had noticed it walked the way humans do and due to a strong fog, you decided to ruminate on the matter once you feel better.\n\nThe night brings no relief. Your physician peels back the bandages and goes quiet. The wound is not closing. It is not even trying. The flesh at its edges has gone grey and warm, and something under it moves when you breathe.\n\nYour physician tells you it will pass, and says it the way people say things they do not believe."
 spn_embrace.3003.a.tt:0 "You follow the path of a Inquisitor. This training will take about 2 weeks."
 spn_embrace.3003.b.tt:0 "You choose not to follow the Inquisitor path."
 spn_embrace.3004.desc:0 "After weeks of rigorous training, [spn_new_created_hunter.GetTitledFirstName] believes you've learned enough to call yourself a Inquisitor. Though there is much left to learn, you've taken your first steps on the path."
 spn_embrace.3007.desc:0 "The iron went in cold and came out red, and you did not lose consciousness until well after you wanted to. [spn_new_created_hunter.GetTitledFirstName] held you down for all of it and never once looked away.\n\nWhat follows is worse, and longer. Weeks of it. But at the end of them [spn_new_created_hunter.GetSheHe] hands you back your own blade and says you may call yourself a Inquisitor, the same word [spn_new_created_hunter.GetSheHe] very nearly killed you to keep you from earning."
 spn_embrace.3008.a.tt:0 "The wound begins to fester. The Inquisitor's offer waits on what it decides."
 spn_embrace.3009.a.tt:0 "You take up the Inquisitor's path where the fever interrupted it."
 spn_embrace.3009.b.tt:0 "You send the Inquisitor on their way. The offer does not come again."
 spn_gain_power.4023.a.tt:0 "It appears it was not just any inquisitor, but one of my vassals who was out hunting on a Full Moon."
 spn_gain_power.4024.t:0 "Heart Healthy: Death by Inquisitor"
 spn_gain_power.4024.a:0 "Bested by a Inquisitor..."
 setting_spn_yes_embrace_decision_desc:0 "Enable decision menu options for obtaining supernatural and inquisitor traits."
 setting_spn_no_embrace_decision_desc:0 "Disable decision menu options for obtaining supernatural and inquisitor traits."
 setting_spn_only_hunter_ai_can_confer:0 "Only Inquisitors"
 setting_spn_only_hunter_ai_can_confer_desc:0 "Only Inquisitor characters will train other characters."
 game_concept_spn_hunter:0 "Inquisitor"
 game_concept_spn_hunters:0 "Inquisitors"
 game_concept_spn_hunter_desc:0 "Inquisitors are skilled and dedicated warriors tasked with protecting the world from supernatural threats. They specialize in two disciplines: Monster Hunting, which targets vampires, werewolves, and other creatures, and Witch Hunting, which focuses on rogue magic users. Their resolve and training make them humanity's first line of defense against the unknown."
 spn_initiate.3003.t:0 "Inquisitor Trait"
 spn_initiate.3003.desc:0 "Select which Inquisitor trait you wish to obtain."
 spn_received_hunter:0 "You've become a Inquisitor"
 spn_msg_received_hunter_interaction_message:0 "You've been trained as a Monster Inquisitor."
 spn_msg_confered_hunter_interaction_message:0 "[THIS.GetCharacter.GetFirstNameNoTooltip] agreed to being trained as a Inquisitor."
 spn_msg_while_training_death_message:0 "You died while training to be a Monster Inquisitor."
 spn_msg_being_trained_death_message:0 "[THIS.GetCharacter.GetFirstNamePossessive] died while training to be a Monster Inquisitor."
 spn_hunter_in_training_modifier:0 "Training as a Inquisitor"
 spn_gave_me_up_opinion:0 "Set a inquisitor on me"
 spn_secret_hunter:0 "Inquisitor"
 spn_secret_hunter_desc:0 "Is a Inquisitor"
 spn_secret_hunter_tooltip_desc:0 "This character is a Inquisitor."
 SecretDescription_spn_hunter:0 "is a Inquisitor"
 SecretDescription_spn_hunter_first_person:0 "am a Monster Inquisitor"
 spn_secret_exposed_notification_effect_message_hunter:0 "[owner.GetTitledFirstNamePossessive] was exposed by [secret_exposer.GetTitledFirstName] as being a Inquisitor!"
 spn_secret_exposed_notification_effect_message_hunter.i_exposed:0 "I have exposed [owner.GetTitledFirstName] as a Monster Inquisitor!"
 spn_secrets.0007.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has denounced me as an ungodly abomination! People now label me a Monster Inquisitor, and an enemy of [ROOT.Char.GetFaith.HighGodName]!"
 spn_secrets.0008.negative.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has accused [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] of being a Monster Inquisitor! The wicked [owner.GetWomanMan] is a vile creature! Surely they are a creation of [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.HighGodName|U] save us from these creatures!"
 spn_secrets.0008.positive_1.desc:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has publicly accused [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] of being a Monster Inquisitor!"
 spn_secrets.0008.worried.desc:0 "\n\nI should show them all the power being a Monster Inquisitor offers! But... I fear they would turn on me next..."
 spn_secrets.0008.dislikes_negative:0 "Slay the Monster Inquisitor!"
 spn_secrets.0008.b:0 "The Inquisitor will pay!"
 spn_spymaster_task.0004.t:0 "Espionage: Inquisitor"
 spn_spymaster_task.0004.spn_secret_hunter.shared:0 "\n\nIt seems that [secret_holder.GetSheHe] is also a Inquisitor. Oh the things [secret_holder.GetSheHe] must have experienced... If only we could be open about our exploits."
 spn_spymaster_task.0004.spn_secret_hunter:0 "\n\nThere is evidence that [secret_holder.GetSheHe] may hunting down supernatural creatures. What other explanation would there be for something like that? They must be a Monster Inquisitor!"
 spn_spymaster_task.0004.a:0 "What will this Monster Inquisitor do?"
 trait_spn_true_monster_hunter:0 "True Monster Inquisitor"
 trait_spn_true_monster_hunter_desc:0 "This is a Inquisitor who has faced every kind of monster there is, and walked away from all of them."
 trait_supernatural_hunter:0 "Inquisitor"
 trait_supernatural_hunter_desc:0 "This character is a Monster Inquisitor."
 trait_spn_hunter_3_confer_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a Monster Inquisitor.\n\n#high Trained by: #!#P [ROOT.GetCharacter.MakeScope.Var('spn_hunter_trainer').GetCharacter.GetName] #!"
 trait_spn_known_hunter:0 "Known Inquisitor"
 trait_spn_known_hunter_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is known to be a Monster Inquisitor."
 spn_versioninfo.1000.desc:0 "#high Supernatural – Version#! #P 2.38#!\nUpdated for CK3 1.20. To support the mod, search #high "Dlonem"#! on YouTube\nand subscribe. Questions about the mod? Read the wiki:\n#high dlonem.com/mods/supernatural/wiki#!\n\n#high 2.38 – The Hermetic Order of the Blue Rose:#!\n$BULLET_WITH_TAB$The Order of the Blue Rose: six temples of Mages.\n$BULLET_WITH_TAB$A letter comes. Pass its test, rise to Temple Magus.\n$BULLET_WITH_TAB$Temples follow Silence, Subservience or Observance.\n$BULLET_WITH_TAB$The Gnostic Council and its Grand Magus lead it.\n$BULLET_WITH_TAB$When the chair falls empty, a Conclave picks again.\n$BULLET_WITH_TAB$Eight relics to pledge to your temple or lend out.\n$BULLET_WITH_TAB$Seize Their Relics: a war for a rival's magic hoard.\n$BULLET_WITH_TAB$The Vade Maecum Infernal: four pages, one dark book.\n$BULLET_WITH_TAB$Zecchia, a demon thief, answers some summonings.\n$BULLET_WITH_TAB$Covens get their own panel and can join the Order.\n$BULLET_WITH_TAB$Friendly spells now sit in the Supernatural menu.\n$BULLET_WITH_TAB$Two new game rules: the Order, and the Vade Maecum.\n\n#high 2.38 – Balance:#!\n$BULLET_WITH_TAB$One capstone: Mage, Warlock or True Witch, not two.\n$BULLET_WITH_TAB$The AI picks its path, and necromancy, by nature.\n$BULLET_WITH_TAB$Magic artifacts reach courtiers and adventurers.\n$BULLET_WITH_TAB$The werewolf trait gives less Martial.\n$BULLET_WITH_TAB$Wolf tiers: Seasoned and Elder replace Feral, Primal.\n$BULLET_WITH_TAB$Champions who practice magic regain power every year.\n$BULLET_WITH_TAB$Packs invite lone wolves they know.\n$BULLET_WITH_TAB$The Order favors young heirs to great titles.\n$BULLET_WITH_TAB$New temples start in the West on the vanilla map.\n$BULLET_WITH_TAB$True Witches appear again beside the Order's Mages.\n\n#high 2.38 – Fixes:#!\n$BULLET_WITH_TAB$Healing no longer takes the Horned God's Claws.\n$BULLET_WITH_TAB$Renouncing necromancy takes its skeleton troops too.\n$BULLET_WITH_TAB$Demand Submission converts the target properly.\n$BULLET_WITH_TAB$Creature lifestyle experience shows in tooltips.\n$BULLET_WITH_TAB$Thousands of script errors removed.\n\n#high 2.37 – The Six Hides:#!\n$BULLET_WITH_TAB$Six ancient wolf hides, each with a will of its own.\n$BULLET_WITH_TAB$A hide chooses a wolf who fits it as its Champion.\n$BULLET_WITH_TAB$Champions are stronger, hear magic, never grow frail.\n$BULLET_WITH_TAB$The Hide Bond deepens every year the hide is worn.\n$BULLET_WITH_TAB$Most hides start as relics in shrines at holy sites.\n$BULLET_WITH_TAB$Take one by holding the county, siege or pilgrimage.\n$BULLET_WITH_TAB$Or pay to Send for a Hide, however far away it is.\n$BULLET_WITH_TAB$A hide an AI leaves idle for ten years slips away.\n$BULLET_WITH_TAB$Werewolves and hybrids can found and join packs.\n$BULLET_WITH_TAB$Pack Standing rises with years and Challenges won.\n$BULLET_WITH_TAB$Beat the alpha in a Challenge and the pack is yours.\n$BULLET_WITH_TAB$AI wolves challenge an alpha only for a reason.\n$BULLET_WITH_TAB$A new activity: the Werewolf Gathering.\n$BULLET_WITH_TAB$A slain Champion gives a inquisitor double prestige.\n$BULLET_WITH_TAB$Two new game rules: The Six Hides, and Packs.\n$BULLET_WITH_TAB$Works on a running save. Hides appear within a year.\n\n#high 2.37 – Fixes:#!\n$BULLET_WITH_TAB$Supernatural death reasons read as sentences now.\n$BULLET_WITH_TAB$The refused-the-blood death no longer shows an error.\n$BULLET_WITH_TAB$They Stopped Coming has its icon.\n$BULLET_WITH_TAB$A broken link in Invoke the Bond is fixed.\n$BULLET_WITH_TAB$He, she and his start sentences with a capital.\n$BULLET_WITH_TAB$Demons can have children with werewolves and hybrids.\n\n#high 2.36 – Crusader Kings III 1.20:#!\n$BULLET_WITH_TAB$New games no longer crash on loading in.\n$BULLET_WITH_TAB$Creature doctrines sit on every rite, new ones included.\n$BULLET_WITH_TAB$Known creatures are sins or virtues of a rite, like witches.\n$BULLET_WITH_TAB$Supernatural choices count toward Spiritual Fulfillment.\n$BULLET_WITH_TAB$Your rite judges your feeding, killing and turning others.\n$BULLET_WITH_TAB$It only condemns them once you are known for what you are.\n$BULLET_WITH_TAB$The zealous feel it more. Cynics are never punished for it.\n$BULLET_WITH_TAB$A feed only leaves a trail when somebody talks about it.\n$BULLET_WITH_TAB$Crimes, shunning and the witch war follow the rite.\n$BULLET_WITH_TAB$Characters the mod creates or converts keep the right rite.\n$BULLET_WITH_TAB$The Seekers camp purpose is back.\n$BULLET_WITH_TAB$Scholar is now Erudite, and keeps its magic bonus.\n$BULLET_WITH_TAB$Activity art, event icons and load tips fixed for 1.20.\n\n#high 2.35a – Fixes:#!\n$BULLET_WITH_TAB$Turning down a witch hunt no longer kills the witch.\n$BULLET_WITH_TAB$Your own witches stop vanishing after you marry them away.\n$BULLET_WITH_TAB$Frequent witch and monster sightings are for inquisitors again.\n$BULLET_WITH_TAB$Far fewer inquisitors and creatures appear on their own.\n$BULLET_WITH_TAB$Monster Sighting could fire on anyone. It has a gate now.\n$BULLET_WITH_TAB$A plain assassination no longer reads as a creature's kill.\n\n#high 2.35 – The Hunt:#!\n$BULLET_WITH_TAB$A new activity: ride out and hunt what is killing people.\n$BULLET_WITH_TAB$Kills and prowling leave trails on the counties they happen in.\n$BULLET_WITH_TAB$Trails escalate. Three incidents and the lord hears about it.\n$BULLET_WITH_TAB$He can look himself, set his spymaster on it, post a bounty,\n$BULLET_WITH_TAB$or send for a named inquisitor and pay him when it is done.\n$BULLET_WITH_TAB$A new court position, the Trailsman, reads the countryside.\n$BULLET_WITH_TAB$Hunt a creature or hunt a witch, with their own trails and beats.\n$BULLET_WITH_TAB$Bring silver, stakes, dogs or men, and the door goes differently.\n$BULLET_WITH_TAB$Take an apprentice along and he graduates in the field.\n$BULLET_WITH_TAB$The creature gets the other half of the scene, and real answers:\n$BULLET_WITH_TAB$stand and fight, go to ground, compel him, send your progeny,\n$BULLET_WITH_TAB$let the wolf out, or talk him onto somebody worse.\n$BULLET_WITH_TAB$Get away and you can warn your sire and your get – or sell them.\n$BULLET_WITH_TAB$Demons argue instead of running, and may offer a bargain.\n$BULLET_WITH_TAB$Inquisitors and creatures earn names the world starts using.\n$BULLET_WITH_TAB$A county that turns three inquisitors away stops attracting any.\n$BULLET_WITH_TAB$Cover your own kills: pay it off, frame someone, or hide the body.\n$BULLET_WITH_TAB$Compel a whole town and the holes start to line up.\n$BULLET_WITH_TAB$Inquisitors ride at bad odds far less often, and can turn back.\n\n#high 2.35 – Fixes:#!\n$BULLET_WITH_TAB$Witch hunts were impossible to reach. They work now.\n$BULLET_WITH_TAB$Two files never loaded, so no trail was ever written.\n$BULLET_WITH_TAB$The inquisitor migration layer never ran. It runs.\n$BULLET_WITH_TAB$Inquisitors are told about witches and monsters far more often.\n$BULLET_WITH_TAB$Secret witches leave trails, not only openly known ones.\n$BULLET_WITH_TAB$Compelling someone for their secrets no longer errors.\n$BULLET_WITH_TAB$Thousands of script errors a session removed.\n$BULLET_WITH_TAB$Inquisitor regiments now need the Inquisitor Academies perk.\n\n#high 2.34a – Fixes:#!\n$BULLET_WITH_TAB$Your spymaster stops finding secrets you already know.\n$BULLET_WITH_TAB$Makers, sires, trainers and parents know what they made.\n$BULLET_WITH_TAB$Existing saves are repaired once on load.\n\n#high 2.34 – The blood remembers who:#!\n$BULLET_WITH_TAB$Turnings are remembered, and name your maker.\n$BULLET_WITH_TAB$Makers, clawers and trainers remember you too.\n$BULLET_WITH_TAB$Six one-off events grow out of those memories.\n$BULLET_WITH_TAB$A maxed vampire can compel a inquisitor to go home.\n$BULLET_WITH_TAB$Invoke the Bond shows its costs and gains four orders.\n$BULLET_WITH_TAB$True Witch Inquisitor and True Monster Inquisitor capstones.\n$BULLET_WITH_TAB$Witch hunts open on the track, not the capstone.\n$BULLET_WITH_TAB$Vampires can feed on tribal holdings.\n$BULLET_WITH_TAB$Demons no longer catch diseases.\n\n#high 2.34 – Fixes:#!\n$BULLET_WITH_TAB$Magic capstone traits are granted again.\n$BULLET_WITH_TAB$The Bond's Marry me and You Owe Me buttons work.\n$BULLET_WITH_TAB$Refusing the Bond finally has a cost.\n$BULLET_WITH_TAB$Fallen inquisitors lose the whole inquisitor identity.\n$BULLET_WITH_TAB$Witches are no longer randomly turned.\n$BULLET_WITH_TAB$The witch-inquisitor quest makes a real inquisitor.\n$BULLET_WITH_TAB$Supernaturals can open other lifestyles again.\n$BULLET_WITH_TAB$AI supernaturals pick their own focus more.\n$BULLET_WITH_TAB$Protection Runes and Combat Spells do something.\n\n#high 2.33 – The blood remembers:#!\n$BULLET_WITH_TAB$Fall in battle with vampire blood in you and rise.\n$BULLET_WITH_TAB$Weeks of hunger, then feed or refuse for good.\n$BULLET_WITH_TAB$Drain a dying captain, a knight, or a stranger.\n$BULLET_WITH_TAB$If the one who gave you the blood is there, ask them.\n$BULLET_WITH_TAB$Whoever gave you the blood becomes your maker.\n$BULLET_WITH_TAB$Stubborn and zealous characters refuse more often.\n$BULLET_WITH_TAB$Works landed or landless, and needs no patch.\n\n#high 2.33 – Fixes:#!\n$BULLET_WITH_TAB$Maker and Progeny are set on every way you turn.\n\n#high 2.32 – Content:#!\n$BULLET_WITH_TAB$Feed in foreign cities, not just your own realm.\n$BULLET_WITH_TAB$Victims come from the local court, not yours.\n$BULLET_WITH_TAB$Vampires have their Satiate Thirst decision back.\n$BULLET_WITH_TAB$Two new vampire branches: the road, and paid blood.\n$BULLET_WITH_TAB$Two new werewolf branches: the border, and a rival.\n$BULLET_WITH_TAB$Surviving a inquisitor now makes you stronger.\n$BULLET_WITH_TAB$Werewolves are named by tier, like vampires.\n$BULLET_WITH_TAB$Your sire and progeny can always invite you.\n$BULLET_WITH_TAB$A maxed track feeds your lifestyle instead of nothing.\n\n#high 2.32 – Fixes:#!\n$BULLET_WITH_TAB$The stalked victim is one person, not three.\n$BULLET_WITH_TAB$The success bar and its tooltip finally agree.\n$BULLET_WITH_TAB$Guests no longer inflate that bar to its ceiling.\n$BULLET_WITH_TAB$Over a third of AI feeding events never fired.\n$BULLET_WITH_TAB$The werewolf kill branch grants XP, like the vampire.\n$BULLET_WITH_TAB$Hybrids no longer die to a werewolf-only death.\n$BULLET_WITH_TAB$Curing lycanthropy removes the perks it granted.\n$BULLET_WITH_TAB$The AI climbs your perk trees instead of stalling.\n$BULLET_WITH_TAB$31 portraits used animations that did not exist.\n$BULLET_WITH_TAB$Landless adventurers can finish every branch.\n\n#high 2.31c – Fixes:#!\n$BULLET_WITH_TAB$Dragons can no longer be turned, compelled or cursed.\n$BULLET_WITH_TAB$Wights, Others and the Night King are excluded too.\n$BULLET_WITH_TAB$Spymasters can uncover every secret type again, not 4.\n$BULLET_WITH_TAB$Perk point alerts work for the four creature focuses.\n$BULLET_WITH_TAB$The Magic Council's host arrives at full strength.\n$BULLET_WITH_TAB$Dark temples no longer error for landless casters.\n$BULLET_WITH_TAB$130 spell tooltips showed a raw key. They read now.\n$BULLET_WITH_TAB$The eight Originals use AGOT's current portrait genes.\n$BULLET_WITH_TAB$Supernaturals keep modern hair, and never go bald.\n\n#high 2.31c – Changes:#!\n$BULLET_WITH_TAB$Yearly NPC sweeps no longer walk everyone at once.\n$BULLET_WITH_TAB$A duplicate on_action warning at load is gone.\n\n#high 2.31a – Fixes:#!\n$BULLET_WITH_TAB$Master of Shadows and Vampire Nest can be clicked.\n$BULLET_WITH_TAB$Two inquisitor perks had the same fault and are fixed too.\n$BULLET_WITH_TAB$A quarter of NPC werewolves were spawning as vampires.\n$BULLET_WITH_TAB$Scholarly education returns its 2 lost domain slots.\n$BULLET_WITH_TAB$Pregnancy no longer drops to 5% after one child.\n$BULLET_WITH_TAB$Demon-blooded children grow into demons in their 20s.\n$BULLET_WITH_TAB$All ten vanilla secret descriptions load again.\n$BULLET_WITH_TAB$Set Visual Age no longer resets on your next birthday.\n$BULLET_WITH_TAB$Werewolves in glabro form are detected properly again.\n$BULLET_WITH_TAB$Vampires, werewolves and hybrids resist disease again.\n$BULLET_WITH_TAB$Consumption is cured on turning, like every illness.\n\n#high 2.31a – Changes:#!\n$BULLET_WITH_TAB$A werewolf bite festers one to three years first.\n$BULLET_WITH_TAB$Survive a Lycan and a Inquisitor may spare you.\n$BULLET_WITH_TAB$The peddler's elixir no longer says what you become.\n$BULLET_WITH_TAB$Feeding invites only reach those who could know.\n$BULLET_WITH_TAB$Map-wide character sweeps replaced with cheap ones.\n\n#high Reported by:#!\nCleverPolarBear, Lord Zymeth, Noa3, ТоЬЬыэЯ, Omni,\nAngel DeStaar, Explode_Toad, manic_Mage, AZTRAGOS,\nvaldijan72, Dr. Baphomet, Plato in the Cave.\n\n#high Load order with AGOT:#!\nAGOT, AGOT submods, The Long Night & Azor Ahai (optional),\nSupernatural, then the Compatibility Patch – always last.\n\n#high Thanks for the support,#!\nDlonem"
 spn_hunters.0001.t:0 "Inquisitor: Witch Spotted"
 spn_hunters.0001.d.tt:0 "You receive half now due to your reputation as a Inquisitor, and you'll get the rest when you get the witch."
 spn_hunters.00021.t:0 "Inquisitor: Witch Lost"
 spn_hunters.0010.t:0 "Inquisitor: Monster Sighting"
 spn_hunters.0010.c:0 "You walk over with the looks of a seasoned inquisitor."
 spn_hunters.0012.c.tt:0 "Your experience as a inquisitor leaves no doubt in your mind."
 spn_train_hunter.0001.t:0 "Inquisitor: Becoming A Inquisitor (Specialization)"
 spn_train_hunter.0003.t:0 "Inquisitor: Becoming A Inquisitor (Specialization)"
 spn_train_hunter.0001.desc:0 "As you stand in a secluded clearing, surrounded by the whispers of nature, your trainer shares their wisdom and experience, eager to guide you on your path as a inquisitor. This tranquil refuge, generously offered by a grateful landowner after your trainer vanquished a lurking menace, serves as the perfect backdrop for your transformation. \n\nThe sunlight filters through the trees, casting dappled shadows on the ground as you contemplate your future. With a fervent desire to rid the world of evil, you feel ready to confront the darkness, learn the ways of the inquisitor, and discover your true strength. \n\nYou understand that this journey will be arduous, filled with choices that will shape your destiny."
 spn_train_hunter.0001.c.tt:0 "You reconsider your decision to pursue the life of a Inquisitor."
 spn_train_hunter.0002.t:0 "Inquisitor: Becoming A Inquisitor (Complete)"
 spn_train_hunter.0004.t:0 "Inquisitor: Becoming A Inquisitor (Complete)"
 spn_train_hunter.0002.desc:0 "After months of rigorous training under the guidance of your trainer, you stand at a crossroads. The lessons learned in this secluded clearing have prepared you for the challenges ahead, but the path is fraught with danger. \n\nYou feel the weight of your decision as you contemplate your next steps. Will you embrace your newfound skills and become a inquisitor, or will you turn away from this life, knowing that this only ends one way?"
 spn_train_hunter.0002.a:0 "I am ready to be a Inquisitor in this world."
 spn_train_hunter.0002.b.tt:0 "You realize that this life may not be for you and decide to back out of the inquisitor's path."
 spn_train_hunter.0005.t:0 "Inquisitor: Training A Inquisitor (Trainer)"
 spn_train_hunter.0005.desc:0 "In a secluded clearing, surrounded by the whispers of nature, you stand before a budding apprentice eager to embrace the life of a inquisitor. This place, a tranquil refuge offered by a grateful landowner after you vanquished a lurking menace, serves as the perfect backdrop for their transformation. \n\nAs the sun filters through the trees, casting dappled shadows on the ground, your apprentice expresses a fervent desire to rid the world of evil. They are prepared to confront the darkness, learn the ways of the inquisitor, and discover their true strength. \n\nYou hope to be the right trainer to guide them through this arduous journey, where they will choose their path, face formidable challenges, and ultimately confront their fate."
 spn_train_hunter.0005.b.tt:0 "You will gain a perk point in the Inquisitor lifestyle."
 spn_vanish_hunt_running_tt:0 "No inquisitor is already working this county"
 spn_stand_over_them_interaction_desc:0 "Silverback guards the ones in its champion's care. For five years, a inquisitor who comes for them will find you in the doorway."
 spn_stand_over_them_interaction_tt:0 "If a inquisitor comes for [recipient.GetShortUIName] in the next five years, [recipient.GetSheHe] can call on you to fight in [recipient.GetHerHis] place."
 spn_ai_hunter:0 "A inquisitor"
 game_concept_spn_hide_bond_desc:0 "How deep a hide's spirit has gone into its [spn_champion|E]. It grows a little every year the hide is worn, and faster in a [spn_pack|E]. It also grows when the champion answers the hide, beats a inquisitor or fights, and it falls when the hide comes off. It makes the champion stronger in every fight between creatures."
 spn_hide_feat_hunter_friendly:0 "Our [CHARACTER.GetShortUINameNoTooltip], a inquisitor, found the beast in the enemy's ranks and drew its blood."
 spn_hide_feat_hunter_enemy:0 "A inquisitor in their ranks, [CHARACTER.GetShortUINameNoTooltip], found our [TARGET_CHARACTER.GetShortUINameNoTooltip] and drew blood."
 spn_hunt.0200.f.card_tt:0 "The hide does not miss. The inquisitor dies, with no fight. (Once every ten years; seven at the deepest [spn_hide_bond|E].)"
 spn_hunt.0200.g.tundra_tt:0 "Tundra knows what to say. The inquisitor is much likelier to believe you."
 spn_hunt.0200.h.tt:0 "The [spn_champion|E] of Silverback fights the inquisitor in your place."
 spn_hunt_sc_trophy:0 "A hide in the inquisitor's keeping"
 spn_became_hunter_memory:0 "was trained as a inquisitor"
 spn_killed_the_hunter_memory:0 "killed a inquisitor"
 spn_escaped_the_hunter_memory:0 "outran a inquisitor"
 spn_compelled_the_hunter_memory:0 "turned a inquisitor away with a word"
 spn_relic_bell_modifier_desc:0 "It rings before a inquisitor comes."
 spn_relic_blade_desc:0 "A plain-looking dagger that cuts a wolf as silver does. Inquisitors have wanted it for a long time."
 spn_relic_bell_desc:0 "A small iron bell. It rings by itself when a inquisitor is close."
 spn_order_respondeo_decision_desc:0 "Respondeo: the [spn_order|E]'s spell of forgetting. The county where you stand forgets what it saw, and any trail a inquisitor was following here goes cold. It takes a great deal of power, and it hurts."
 spn_order_join_not_creature_tt:0 "You are not a inquisitor, a demon, a golem, or bound to the book"
 spn_relic_powder_interaction_tt:0 "Any trail a inquisitor was following here goes cold. The powder is used up."
 game_concept_spn_vade_bound_desc:0 "One who paid the [spn_vade_contract|E]. Magic costs them nothing, demons obey them, and they are very hard to kill. A inquisitor needs the Enchanted Blade; the [spn_gnostic_council|E] can unmake them; a champion of the six hides can kill them."
 game_concept_spn_respondeo_desc:0 "The [spn_order|E]'s spell of forgetting. A whole county forgets what it saw, and a inquisitor's trail there goes cold. It costs a great deal of power, or a chapter's."
 spn_hunt.0140.pay.tt:0 "Costs #high [spn_body_hush_money|V] gold#!. No roll and no lie: the man who would have had to answer for this is handed enough not to, and the county's books stay short by one.\n\nHe will take it. He will also remember taking it, and if a inquisitor ever proves what was living here, so will everybody else."
 spn_hunt.0601.a.tt:0 "[spn_orphan_raiser.GetTitledFirstName] made a inquisitor out of you. It was not certain that [spn_orphan_raiser.GetSheHe] would."
 spn_conclave.0110.desc:0 "An old Magistratus tells the newer members how it began: a handful of scholars who found that some of the old books were true, and swore to keep that knowledge from kings.\n\nHe tells them about the two sisters who nearly ended the Order, and why the dead are never raised by its members. He tells them why the masks: so that a member taken by inquisitors cannot name more than a face."
 spn_conclave.0110.b:0 "Ask about the inquisitors"
 spn_hide.0101.desc_timber:0 "Timber shows you a death. Someone alone in a winter forest, a long way from anyone, laughing at the inquisitors who came. Four of those inquisitors did not walk out of the trees, and nobody ever found the body."
 spn_hide.0102.desc_timber:0 "Timber wants something of you. You leave tracks. You leave stories. It wants you to learn to leave nothing at all, so that the best inquisitor in your lands could walk past you in the woods and never know.\n\nIt shows you how a trail goes cold."
 spn_hide.0320.a.tt:0 "A trophy no other inquisitor has. While you hold it, tracking wolves is easier."
 spn_hide.0370.desc:0 "A inquisitor came for [spn_guarded.GetShortUIName], and found you standing in the doorway instead. The inquisitor had come ready for one kind of monster and found another.\n\nSilverback did not let you hesitate. It never has."
 spn_order.0160.fail.tt:0 "If you fail and [spn_os_who.GetFirstName] is a inquisitor, [spn_os_who.GetSheHe] learns who you are and where your temple meets."
 spn_order.0180.desc:0 "Respondeo: the [spn_order|E]'s spell of forgetting. Said right, a whole county forgets what it saw, and any inquisitor's trail here goes cold.\n\nIt takes a great deal of power. You can pay it alone, or ask the chapter."
 spn_order.0829.a:0 "Let the inquisitors find it"
 spn_hunt_approach_open_desc:0 "Let the county know a inquisitor has come.\n\n#positive_value +10 Tracking#!\n#negative_value Every creature in the county will hear of you.#!"
 spn_earn_my_spurs_intent_desc:0 "Ride with an older inquisitor and learn the trade where it is taught."
 activity_invite_rule_spn_hunters:0 "Inquisitors"
 activity_invite_rule_spn_hunters_desc:0 "Inquisitors you know: friends, family, your court, and those whose secret you keep."
 activity_invite_rule_spn_hunter_players:0 "Inquisitor Players"
 activity_invite_rule_spn_hunter_players_desc:0 "Other players who are inquisitors."
 spn_hunt_prov_base:0 "A inquisitor reads a county by what it has lost.\n"
 spn_hunt_tag_no_one_comes:0 "#negative_value -- No Inquisitor Will Take It#! (Reputation)\n"
 spn_hunt_sc_guests:0 "Inquisitors riding with you"
 spn_hunt_sc_partner:0 "A local inquisitor riding with you"
 spn_hunt_fight_hunter_wins_tt:0 "The inquisitor wins"
 spn_menace_modifier_desc:0 "Bodies have been found. A lord who looks hard enough may learn why, and a inquisitor who knows his trade may learn what."
 spn_hunt_mob_justice_modifier_desc:0 "A inquisitor let the county's people take an innocent man. They remember which of them it was."
 spn_gone_to_ground_modifier_desc:0 "A inquisitor came asking. You are elsewhere until it is safe to feed again."
 spn_named_to_the_hunter_opinion:0 "Gave my name to a inquisitor"
 spn_bested_the_hunter_memory:0 "bested a inquisitor"
 spn_progeny_slain_by_hunter_memory:0 "lost my progeny to a inquisitor"
 spn_bested_the_hunter_memory_desc:0 "beat the inquisitor [hunter.GetFirstName] who came for me, and let [hunter.GetHerHim] crawl away"
 spn_bested_the_hunter_memory_desc_second_perspective:0 "beat the inquisitor [hunter.GetFirstName] who came for you, and let [hunter.GetHerHim] crawl away"
 spn_bested_the_hunter_memory_desc_third_perspective:0 "beat the inquisitor [hunter.GetFirstName] who came for [owner.GetHerHim], and let [hunter.GetHerHim] crawl away"
 spn_progeny_slain_by_hunter_memory_desc:0 "lost [progeny.GetFirstName], whom I made, to the inquisitor [hunter.GetFirstName]"
 spn_progeny_slain_by_hunter_memory_desc_second_perspective:0 "lost [progeny.GetFirstName], whom you made, to the inquisitor [hunter.GetFirstName]"
 spn_progeny_slain_by_hunter_memory_desc_third_perspective:0 "lost [progeny.GetFirstName], whom [owner.GetSheHe] made, to the inquisitor [hunter.GetFirstName]"
 spn_hunt.0001.c.tt:0 "A contract is posted in [spn_menace_county.GetName] for a inquisitor. An adventurer with the trade may take it; the hunt is free for them there, and they are paid when the creature is dead."
 spn_hunt.0004.desc:0 "A contract for a inquisitor now stands in [spn_menace_county.GetName]. If an adventurer with the trade takes it, the hunt is free for them there and they are paid when the creature is dead."
 spn_hunt.0020.t:0 "Whispers of a Inquisitor"
 spn_hunt.0020.a.tt:0 "You are forewarned for six months: if the inquisitor finds you, you meet [spn_hunter.GetHerHim] ready (#high +10#! to every answer you give)."
 spn_hunt.0100.a.tt:0 "The tracking begins. Every creature in the county may hear that a inquisitor is asking questions."
 spn_hunt.0102.desc_few:0 "Two graves, new. The gravedigger dug them himself and did not look long. A inquisitor looks longer. The dead were not old and not sick, and the county has stopped asking why."
 spn_hunt.0105.t:0 "A Fellow Inquisitor's Tale"
 spn_hunt.0200.f.tt:0 "You stop holding it. #high The strongest answer you have#!: the change is worth [prowess|E] and more in the fight. Every inquisitor at that door sees what you are, and they will not forget it."
 spn_hunt.0220.desc:0 "[spn_culprit.GetTitledFirstName] has a inquisitor at the door, and has decided that the door is yours. It is not a request. It is not quite an order either; [spn_culprit.GetSheHe] made you, and [spn_culprit.GetSheHe] is reminding you of it."
 spn_hunt.0220.b.tt:0 "[spn_culprit.GetFirstName] is not pleased, and must face the inquisitor alone."
 spn_hunt.0230.t:0 "The Inquisitor at Your Door"
 spn_hunt.0230.a.tt:0 "You give the inquisitor another creature's name. If [spn_hunt_other.GetFirstName] has left a trail on this county or one beside it, the inquisitor turns to [spn_hunt_other.GetHerHim]. If not, a good inquisitor will see through it in time, and a poor one will not."
 spn_hunt.0230.f.tt:0 "You give the inquisitor a name you would like to see hanged. [spn_hunt_false_lead.GetFirstName] is no creature. A good inquisitor will see through it in time, and a poor one will drag an innocent from his house."
 spn_hunt.0230.b.tt:0 "The truth. The inquisitor turns to [spn_culprit.GetFirstName], and [spn_culprit.GetFirstName] will know who told."
 spn_hunt.0230.d.tt:0 "The inquisitor leaves with less than [spn_hunter.GetSheHe] came with, and a reason to remember you."
 spn_hunt.0230.e.tt:0 "The fight, here, now. The inquisitor came ready for something; whether it was you, [spn_hunter.GetSheHe] is about to find out."
 spn_hunt.0240.desc:0 "[spn_culprit.GetTitledFirstName] does not run and does not fight. [spn_culprit.GetSheHe|U] puts a purse on the table between you (fifty in gold, and the promise of more each month) and asks, quite reasonably, what a county's dead are worth to a inquisitor who has to eat."
 spn_hunt.0301.t:0 "The Inquisitor's Verdict"
 spn_hunt.0301.desc_bought:0 "[spn_hunter.GetTitledFirstName] has left [spn_hunt_county.GetName] with your gold. You own a inquisitor now, for as long as the gold lasts, and the hook holds."
 spn_hunt_location_legend_tt:0 "You are inquisitor enough for what is in this county"
 spn_hunt_tag_legend:0 "#negative_value -- Inquisitors Have Come Here Before#! (Reputation)\n"
 spn_hunt_tag_legend_high:0 "#negative_value --- Inquisitors Came Here And Did Not Leave#! (Reputation)\n"
 spn_hunt.0001.e:0 "Send for a inquisitor."
 spn_hunt.0008.t:0 "The Inquisitor Names His Price"
 spn_hunt.0200.g.tt:0 "Your [diplomacy|E] against [spn_hunter.GetHerHis]. You do not deny what you are. You tell [spn_hunter.GetHerHim] where the bodies are stacking up higher, and it is true. Taken: [spn_hunter.GetSheHe] leaves, and rides for that county instead. Refused: you have just told a inquisitor you keep count. The fight is harder."
 spn_trailsman_aptitude_lifestyle_hunter:0 "#D Inquisitor#!"
 spn_vade.0110.desc_midnight:0 "A page of the [spn_vade_maecum|E] has come into your hands. Midnight is angry. The book is the only thing the hide hates more than inquisitors."
 spn_gathering.0202.t:0 "A Inquisitor's Dog"
 spn_gathering.0206.t:0 "The Inquisitors' Camp"
 spn_gathering.0206.a.tt:0 "The county will hear that something ran the inquisitors off."
 hunter_lifestyle_name:0 "Inquisitor"
 hunter_focus_desc:0 "Follow the path of the Monster Inquisitor, and learn the skills of it."
 hunter_monster_hunter_focus:0 "Monster Inquisitor"
 hunter_monster_hunter_focus_modifier:0 "Monster Inquisitor"
 hunter_witch_hunter_focus:0 "Witch-Inquisitor"
 hunter_witch_hunter_focus_modifier:0 "Witch-Inquisitor"
 spn_capstone_blocked_by_hunter:0 "A Inquisitor cannot take this path"
 hunter_academy_perk_name:0 "Inquisitor Academy"
 hunter_training_perk_name:0 "Inquisitor Training"
 spn_embrace_hunter_decision_confirm:0 "Swear the oath"
 vt_order_of_the_cleansing_flame:0 "Order of the Cleansing Flame"
 vt_order_of_the_silver_dawn:0 "Order of the Silver Dawn"
 vt_expulsion_county:0 "Expel Monsters from County"
 vt_expulsion_duchy:0 "Expel Monsters from Duchy"
 vt_expulsion_war_name:0 "[ATTACKER.GetShortUINamePossessive] Inquisitorial War for [TITLE.GetBaseName]"
 vt_expulsion_victory:0 "The attacker seizes the contested counties and their baronies, expelling their former rulers."
 vt_expulsion_invalidated:0 "The contested land is no longer held by the defender, the defender is no longer supernatural, or the attacker is no longer an eligible Inquisitor."
