l_english:
 trait_vt_magic_atrophy:0 "Weave Atrophy"
 trait_track_vt_magic_atrophy:0 "Fraying Connection"
 trait_track_vt_magic_atrophy_desc:0 "Drawing too much power from the Weave erodes the mind and its magical connection."
 trait_vt_magic_atrophy_desc:0 "Drawing too much from the Weave has begun to fray this character's connection to it. Memory, judgement, and magical control deteriorate together, regardless of natural or magically extended lifespan.\n\nChecked every 30 days: net magical-resource income above 10 advances atrophy by 1 + (income - 10)/10, capped at 4 progress. Income of 10 or less halts deterioration but does not reverse it.\n\nThreadcraft penalties progress from -2 to -4, -8, and -10; reserve recovery falls by 10%, 20%, 30%, and 50%. Cognitive penalties follow Withering Mind. At maximum progress, this character becomes Incapable."
