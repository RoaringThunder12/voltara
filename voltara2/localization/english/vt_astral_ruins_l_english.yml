 vt_explore_elven_ruins:0 "Explore Elven Ruins"
 vt_explore_elven_ruins_desc:0 "Beneath the old stones of Severos lie the remnants of an elven age. I can fund an expedition into these forgotten halls, seeking whatever time has spared."
 vt_explore_elven_ruins_tooltip:0 "Search ancient elven ruins for relics, dragon eggs, or Astral Steel."
 vt_explore_elven_ruins_confirm:0 "Prepare the expedition"
 vt_ruins_outcomes_tt:0 "The expedition may find nothing (45%), an elven relic (40%), illustrious Astral Steel (12%), or a dragon egg (3%)."
 vt_forge_astral_steel:0 "Forge an Astral Steel Weapon"
 vt_forge_astral_steel_desc:0 "Astral Steel holds a cold, enduring light. With a skilled smith and 150 gold, one piece can become an illustrious weapon of my choosing. Payment and the material are consumed only when I confirm the design."
 vt_forge_astral_steel_tooltip:0 "Choose and name an illustrious Astral Steel sword."
 vt_forge_astral_steel_confirm:0 "Choose a weapon design"
 vt_astral_forge_tt:0 "Spend 150 gold and consume one Astral Steel artifact to create and equip your chosen illustrious sword."
 vt_astral_steel_name:0 "Astral Steel"
 vt_astral_steel_desc:0 "A dense fragment of ancient elven star-metal. Pale veins gleam beneath its dark surface. A smith can forge this material into an illustrious weapon."
 vt_astral_weapon_name:0 "Astral Steel Sword"
 vt_astral_weapon_desc:0 "Forged from star-metal recovered from an elven ruin, this blade carries an edge that ordinary steel cannot match."
 vt_astral_weapon_modifier:0 "Astral Steel"
 vt_astral_steel_modifier:0 "Star-metal Fragment"
 vt_ruins_brooch_name:0 "Elven Moonleaf Brooch"
 vt_ruins_brooch_desc:0 "A silver leaf clasp recovered from an elven ruin, its delicate veins still bright."
 vt_ruins_ring_name:0 "Ring of the Forgotten Court"
 vt_ruins_ring_desc:0 "An old elven signet whose winding inscription has outlasted the court it once served."
 vt_ruins_tablet_name:0 "Elven Star Charts"
 vt_ruins_tablet_desc:0 "A preserved scroll tracing the stars as they were known to the ancient elves."
 vt_ruins_brooch_modifier:0 "Elven Craftsmanship"
 vt_ruins_ring_modifier:0 "Ancient Prestige"
 vt_ruins_tablet_modifier:0 "Elven Star Lore"
 vt_astral_ruins.10.t:0 "Only Dust Remains"
 vt_astral_ruins.10.desc:0 "We pass beneath broken arches and descend through silent chambers. Every promising niche has already been emptied. The ruins keep their secrets, and we return with only dust on our boots."
 vt_astral_ruins.10.a:0 "Perhaps another ruin will reward us."
 vt_astral_ruins.11.t:0 "A Relic of the Elves"
 vt_astral_ruins.11.desc:0 "A sealed alcove yields an object untouched by the scavengers who stripped the outer halls. Its workmanship speaks of patience and a skill almost lost to the world. My expedition has brought home a relic of the elven age."
 vt_astral_ruins.11.a:0 "Preserve it carefully."
 vt_astral_ruins.12.t:0 "Steel Beneath the Stars"
 vt_astral_ruins.12.desc:0 "Deep beneath a collapsed observatory, we uncover a fragment of dark metal threaded with silver light. It is Astral Steel: enough for a weapon, if I can secure a smith capable of working it."
 vt_astral_ruins.12.a:0 "This will make an extraordinary blade."
 vt_astral_ruins.13.t:0 "An Egg in the Dark"
 vt_astral_ruins.13.desc:0 "Within a chamber sealed against centuries, a scaled egg rests in a cradle of blackened stone. It is unmistakably a dragon egg. We wrap it carefully and carry it into the daylight."
 vt_astral_ruins.13.a:0 "Bring it home."
 vt_astral_ruins.200.t:0 "The Astral Forge"
 vt_astral_ruins.200.desc:0 "The smith lays out fourteen patterns, from ancient arming swords to long, elegant blades. Choose a design below and give the weapon its name. Forging costs 150 gold and consumes one piece of Astral Steel."
 vt_astral_ruins.200.a:0 "Forge my chosen weapon."
 vt_astral_ruins.200.b:0 "Keep the steel for another day."
