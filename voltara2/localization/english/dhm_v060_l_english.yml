 dhm_saga.9000.t:0 "What Our Name Has Become"
 dhm_saga.9000.opening:0 "[dhm_legacy_critic.GetShortUIName] asks for a quiet word.\n\n'I am proud of our house. That does not mean every custom still serves us well.'"
 dhm_saga.9000.scholarly:0 "\n\n'We praise learning, but sometimes people need help more urgently than another discussion.'"
 dhm_saga.9000.honorable:0 "\n\n'Keeping our word matters. So does admitting when a promise has become unfair.'"
 dhm_saga.9000.protective:0 "\n\n'We protect our kin. Sometimes we must also let them manage without us.'"
 dhm_saga.9000.ambitious:0 "\n\n'We are always seeking greater honors. The family is tired. Must there always be another demand?'"
 dhm_saga.9000.traditional:0 "\n\n'The old ways give us comfort, but some are harder on newcomers than they need to be.'"
 dhm_saga.9000.severe:0 "\n\n'People obey us. I worry they are too afraid to tell us when we are wrong.'"
 dhm_saga.9000.uphold:0 "The Old Way Stands"
 dhm_saga.9000.reform:0 "We Can Change How We Treat Our Kin"
 dhm_saga.9000.listen:0 "I Will Hear You, but Keep the Custom"
 dhm_saga.9001.t:0 "The Name After the Question"
 dhm_saga.9001.upheld:0 "When [dhm_legacy_critic.GetFirstName] questioned our customs, I chose to uphold them. The household knows where I stand, but those who disagreed have not changed their minds."
 dhm_saga.9001.reformed:0 "I agreed to reconsider the customs [dhm_legacy_critic.GetFirstName] challenged. Some relatives welcome the changes. Others worry that I have yielded too much."
 dhm_saga.9001.listened:0 "[dhm_legacy_critic.GetFirstName] is willing to speak with me again. There has been no great proclamation, only small changes in how we treat one another."
 dhm_saga.9001.a:0 "Our Choices Will Show What We Stand For"

