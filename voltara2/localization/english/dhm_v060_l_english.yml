l_english:
 dhm_manager.0007.loyalty_ledger:0 "@skill_stewardship_icon! Officer Loyalty Ledger"
 dhm_v060_legacy_echo_tt:0 "#P Your house identity strengthens this outcome#!, but #N its old burden follows#!."

 dhm_legacy.0200.children:0 "\n\n'I want children at my hearth, if grace and time will allow it.'"
 dhm_legacy.0200.reconciliation:0 "\n\n'I want one old quarrel ended before pride buries us all.'"
 dhm_saga.heir_status.command:0 "\n\n#bold Next Chapter:#! The heir's first command."
 dhm_saga.heir_status.marriage:0 "\n\n#bold Next Chapter:#! Preparing the heir for marriage and household rule."
 dhm_saga.heir_status.assessment:0 "\n\n#bold Next Chapter:#! The final readiness judgment."
 dhm_saga.heir_status.complete:0 "\n\n#P The journey is complete.#! Its lessons remain with the heir."

 dhm_saga.0100.t:0 "The Officers' Ledger"
 dhm_saga.0100.desc:0 "The household rolls list the officers in your service. Skill matters, but so does trust: praise, quarrels and the way you treat each officer affect their loyalty."
 dhm_saga.0100.steward:0 "\n@skill_stewardship_icon! #bold Steward:#! [ROOT.Char.MakeScope.Var('dhm_officer_steward').Char.GetShortUIName] — Loyalty #V [ROOT.Char.MakeScope.Var('dhm_officer_steward').Char.MakeScope.Var('dhm_officer_loyalty').GetValue|0]#!, service #V [ROOT.Char.MakeScope.Var('dhm_officer_steward').Char.MakeScope.Var('dhm_v080_officer_service_years').GetValue|0]#! years"
 dhm_saga.0100.steward.empty:0 "\n@skill_stewardship_icon! #weak Steward: vacant#!"
 dhm_saga.0100.matchmaker:0 "\n@arrange_marriage_icon! #bold Matchmaker:#! [ROOT.Char.MakeScope.Var('dhm_officer_matchmaker').Char.GetShortUIName] — Loyalty #V [ROOT.Char.MakeScope.Var('dhm_officer_matchmaker').Char.MakeScope.Var('dhm_officer_loyalty').GetValue|0]#!, service #V [ROOT.Char.MakeScope.Var('dhm_officer_matchmaker').Char.MakeScope.Var('dhm_v080_officer_service_years').GetValue|0]#! years"
 dhm_saga.0100.matchmaker.empty:0 "\n@arrange_marriage_icon! #weak Matchmaker: vacant#!"
 dhm_saga.0100.tutor:0 "\n@skill_learning_icon! #bold Chief Tutor:#! [ROOT.Char.MakeScope.Var('dhm_officer_tutor').Char.GetShortUIName] — Loyalty #V [ROOT.Char.MakeScope.Var('dhm_officer_tutor').Char.MakeScope.Var('dhm_officer_loyalty').GetValue|0]#!, service #V [ROOT.Char.MakeScope.Var('dhm_officer_tutor').Char.MakeScope.Var('dhm_v080_officer_service_years').GetValue|0]#! years"
 dhm_saga.0100.tutor.empty:0 "\n@skill_learning_icon! #weak Chief Tutor: vacant#!"
 dhm_saga.0100.chronicler:0 "\n@skill_learning_icon! #bold Chronicler:#! [ROOT.Char.MakeScope.Var('dhm_officer_chronicler').Char.GetShortUIName] — Loyalty #V [ROOT.Char.MakeScope.Var('dhm_officer_chronicler').Char.MakeScope.Var('dhm_officer_loyalty').GetValue|0]#!, service #V [ROOT.Char.MakeScope.Var('dhm_officer_chronicler').Char.MakeScope.Var('dhm_v080_officer_service_years').GetValue|0]#! years"
 dhm_saga.0100.chronicler.empty:0 "\n@skill_learning_icon! #weak Chronicler: vacant#!"

 dhm_saga.0110.success.t:0 "A Duty Well Done"
 dhm_saga.0110.setback.t:0 "Work Left Unfinished"
 dhm_saga.0110.success.desc:0 "[dhm_story_officer.GetShortUIName] brings the finished work.\n\n'All is in order, my liege.' The officer has clearly taken care over it. A few words of thanks would not go amiss."
 dhm_saga.0110.setback.desc:0 "[dhm_story_officer.GetShortUIName] returns with work still unfinished.\n\n'I am sorry, my liege. I thought I could manage it, but I need more time.'"
 dhm_saga.0110.a:0 "Enter the Result in the Ledger"

 dhm_saga.0120.t:0 "A Quarrel Between Officers"
 dhm_saga.0120.desc:0 "[dhm_officer_first.GetShortUIName] and [dhm_officer_second.GetShortUIName] disagree over a shared household duty. Each has given different instructions, and the servants do not know whose orders to follow."
 dhm_saga.0120.rivals:0 "\n\nTheir old rivalry has made the dispute personal. Neither wants to be seen giving way."
 dhm_saga.0120.ambitious:0 "\n\n[dhm_officer_first.GetFirstName] insists on taking charge and receiving the credit."
 dhm_saga.0120.ordinary:0 "\n\n'I was only trying to help,' one says. The other gives a disbelieving look."
 dhm_saga.0120.reconcile:0 "Let Them Both Speak"
 dhm_saga.0120.favor:0 "Put [dhm_officer_first.GetFirstName] in Charge"
 dhm_saga.0120.divide:0 "Divide the Work"
 dhm_saga.0121.t:0 "The Officers' Next Report"
 dhm_saga.0121.reconcile:0 "I asked [dhm_officer_first.GetFirstName] and [dhm_officer_second.GetFirstName] to settle their quarrel. Their latest report bears both seals.\n\n'We still disagree, my liege. But the work is being done.'"
 dhm_saga.0121.favor:0 "I backed [dhm_officer_first.GetFirstName] in the quarrel with [dhm_officer_second.GetFirstName]. The work now moves quickly, but the two rarely speak. Each shared task arrives with another complaint."
 dhm_saga.0121.divide:0 "[dhm_officer_first.GetFirstName] and [dhm_officer_second.GetFirstName] keep separate accounts now. There are fewer arguments at the table, but work that needs them both takes longer."
 dhm_saga.0121.a:0 "Keep Me Informed"

 dhm_saga.2000.t:0 "An Old Hope"
 dhm_saga.2000.opening:0 "[dhm_ambition_target.GetShortUIName] asks to speak about the wish brought before you years ago."
 dhm_saga.2000.children:0 "\n\n'I still hope for children. I know you cannot promise me that. I ask only for your support.'"
 dhm_saga.2000.reconciliation:0 "\n\n'I would like to make peace with the family. Help me begin the conversation.'"
 dhm_saga.2000.learning:0 "\n\n'I still want to study, but books and teachers cost more than I can spare.'"
 dhm_saga.2000.faith:0 "\n\n'I would like more time for the duties of my faith. The household always seems to need me elsewhere.'"
 dhm_saga.2000.love:0 "\n\n'I still wish for a little kindness in my life. Please do not treat that as a foolish request.'"
 dhm_saga.2000.status:0 "\n\n'I am ready for more responsibility. Give me a chance to prove it.'"
 dhm_saga.2000.security:0 "\n\n'I have managed so far, but I still worry about the years ahead. Will the family stand by me?'"
 dhm_saga.2000.freedom:0 "\n\n'I have kept up with my duties. May I have more say in what comes next?'"
 dhm_saga.2000.keep:0 "Help [dhm_ambition_target.GetFirstName] Pursue It"
 dhm_saga.2000.close:0 "The House Cannot Grant This"

 dhm_saga.3000.t:0 "A Shared Duty"
 dhm_saga.3000.desc:0 "The old quarrel between [dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] has not been forgotten. There is household work that they could share. It might help them trust one another—or give them something new to argue about."
 dhm_saga.3000.duty:0 "Give Them One Duty to Share"
 dhm_saga.3000.apart:0 "Keep Their Duties Separate"
 dhm_saga.3010.t:0 "The Last Lesson"
 dhm_saga.3010.desc:0 "[dhm_arc_first.GetFirstName] still turns to [dhm_arc_second.GetFirstName] for advice. Their lessons have given them much to discuss. You could honor the tutor's efforts, or leave the pupil more room to find an independent way."
 dhm_saga.3010.honor:0 "Honor the Tutor Before the House"
 dhm_saga.3010.release:0 "Let the Pupil Find Their Own Way"
 dhm_saga.3020.t:0 "A Place at the Family Table"
 dhm_saga.3020.desc:0 "[dhm_arc_second.GetFirstName] again questions the arrangements for family suppers. [dhm_arc_first.GetFirstName] wants the old custom kept. It would take little to make room for the newcomer's wishes, but the elders may object."
 dhm_saga.3020.amend:0 "Change the Custom"
 dhm_saga.3020.uphold:0 "The Old Way Stands"
 dhm_saga.3030.t:0 "An Invitation to Supper"
 dhm_saga.3030.desc:0 "[dhm_arc_first.GetFirstName] and [dhm_arc_second.GetFirstName] have spent too long avoiding one another. Both might accept an invitation to your table. Whether they can speak without quarreling is another matter."
 dhm_saga.3030.open:0 "Invite Them to My Table"
 dhm_saga.3030.close:0 "Leave Them to Themselves"

 dhm_saga.3040.t:0 "The Heir Asks to Be Heard"
 dhm_saga.3040.desc:0 "[dhm_arc_first.GetShortUIName] waits until you are alone.\n\n'I have done what you asked. But you never ask what I think of it.'\n\nThe heir is not refusing to serve. It is the lack of a say that troubles the heir."
 dhm_saga.3040.listen:0 "Tell Me What Troubles You"
 dhm_saga.3040.duty:0 "An Heir Must Put Duty First"
 dhm_saga.3040.test:0 "Let Me See What You Can Manage"
 dhm_saga.3041.t:0 "Words After the Duty"
 dhm_saga.3041.listen:0 "When [dhm_arc_first.GetFirstName] questioned a household duty, I heard the concerns before giving my answer.\n\n'I thought you would call me ungrateful,' [dhm_arc_first.GetFirstName] says. 'I am glad I spoke.'"
 dhm_saga.3041.duty:0 "I told [dhm_arc_first.GetFirstName] to put duty first. The work was finished, but our conversations have grown brief.\n\n'I did as you asked. Did you ever consider what I wanted?'"
 dhm_saga.3041.test:0 "[dhm_arc_first.GetFirstName] has finished the task set before the household. Some parts went well; others needed help. There is much we could discuss, if I make the time."
 dhm_saga.3041.speak:0 "Speak. I Am Listening."
 dhm_saga.3041.silence:0 "Your Duty Has Not Changed"
 dhm_saga.3042.t:0 "The Chair Beside Yours"
 dhm_saga.3042.desc:0 "[dhm_arc_first.GetFirstName] takes the nearby chair without waiting to be summoned. The old fear has not vanished, but it no longer rules the room."
 dhm_saga.3042.a:0 "So This Is Where We Stand"

 dhm_saga.2200.t:0 "The Heir's First Command"
 dhm_saga.2200.desc:0 "The household guards are preparing a patrol. [dhm_heir.GetFirstName] stands beside the map, eager to help.\n\n'Let me give the orders this time.'\n\nIt is a modest duty, not a battle. You must decide how much responsibility to entrust to the heir."
 dhm_saga.2200.lead:0 "Let the Heir Command"
 dhm_saga.2200.plan:0 "Plan Every Step Together"
 dhm_saga.2200.delegate:0 "Choose Trusted Captains"
 dhm_saga.2210.t:0 "Before the Marriage Seal"
 dhm_saga.2210.desc:0 "You sit with [dhm_heir.GetFirstName] to discuss what marriage asks of a ruler: promises to another family, shared duties and a spouse with wishes of their own.\n\n'Which matters most when they disagree?' the heir asks."
 dhm_saga.2210.heart:0 "Ask What the Heir Wants"
 dhm_saga.2210.contract:0 "Put the House First"
 dhm_saga.2210.custom:0 "Protect Faith and Custom"
 dhm_saga.2220.t:0 "The Measure of an Heir"
 dhm_saga.2220.desc:0 "[dhm_heir.GetFirstName] has heard petitioners, observed the council and taken on a first command. We have also spoken about marriage and the duties ahead.\n\n'Have I done enough?' the heir asks. It is time to give an honest answer."
 dhm_saga.2220.scholarly:0 "\n\nYour house values learning. The heir knows to seek advice, though too much deliberation can delay a needed decision."
 dhm_saga.2220.honorable:0 "\n\nYour house keeps its word. The heir understands that an easy promise may become a difficult duty."
 dhm_saga.2220.protective:0 "\n\nYour house shelters its own. The heir knows protection has a cost."
 dhm_saga.2220.ambitious:0 "\n\nYour house expects success. The heir knows how tiring it can be to meet those expectations."
 dhm_saga.2220.traditional:0 "\n\nYour house guards old ways. The heir knows which customs comfort and which constrain."
 dhm_saga.2220.severe:0 "\n\nYour house is feared for discipline. The heir knows order can silence truth."
 dhm_saga.2220.unformed:0 "\n\nThe house is still deciding what example it will leave."
 dhm_saga.2220.ready:0 "The Heir Is Ready"
 dhm_saga.2220.more_time:0 "The Heir Needs More Time"
 dhm_saga.2220.house:0 "Let the Household Judge"

 dhm_saga.4000.t:0 "A Child in Trouble"
 dhm_saga.4000.desc:0 "[dhm_protected_child.GetFirstName] has been struggling, and [dhm_partner_spouse.GetFirstName] asks you to hear the child before demanding more.\n\n'We still have duties to teach. But we shall get further if the child can bear them.'"
 dhm_saga.4000.stand_together:0 "We Will Correct the Child Together"
 dhm_saga.4000.discipline:0 "The Punishment Stands"
 dhm_saga.4000.private:0 "We Will Settle This in Private"
 dhm_saga.4001.t:0 "What the Child Remembered"
 dhm_saga.4001.united:0 "[dhm_protected_child.GetFirstName] remembers that you and [dhm_partner_spouse.GetFirstName] heard the explanation together. The child still had to make amends, but did not feel abandoned before the household."
 dhm_saga.4001.overruled:0 "You upheld the punishment despite [dhm_partner_spouse.GetFirstName]'s objection. The household obeyed, but your spouse has become less willing to offer advice."
 dhm_saga.4001.private:0 "Speaking in private spared the household another argument. You and [dhm_partner_spouse.GetFirstName] have found it easier to discuss the child's care since then."
 dhm_saga.4001.a:0 "The Child Will Remember This"
 dhm_saga.4100.t:0 "A Dispute Over Household Duties"
 dhm_saga.4100.desc:0 "[dhm_partner_spouse.GetShortUIName] sets down the new list of household duties.\n\n'The same people are asked to help every time. Others can take a turn.'\n\nChanging the arrangements would spread the work, but those who have been spared until now will complain."
 dhm_saga.4100.compromise:0 "We Will Divide the Duties Together"
 dhm_saga.4100.yield:0 "Your Counsel Has Convinced Me"
 dhm_saga.4100.command:0 "My Order Stands"
 dhm_saga.4101.t:0 "The Order in Practice"
 dhm_saga.4101.compromise:0 "You and [dhm_partner_spouse.GetFirstName] divided the duties together. There were complaints at first, but the household has accepted the arrangement."
 dhm_saga.4101.yield:0 "You let [dhm_partner_spouse.GetFirstName] settle the household duties. The work is being done, though answering everyone's complaints has been tiring."
 dhm_saga.4101.command:0 "You kept the duties as they were. The household obeyed, but [dhm_partner_spouse.GetFirstName] still thinks the work is unfairly shared."
 dhm_saga.4101.a:0 "I Will Keep an Eye on It"

 dhm_saga.5000.t:0 "Letters Before the Betrothal"
 dhm_saga.5000.desc:0 "Marriage talks have begun for [dhm_marriage_subject.GetFirstName] and [dhm_marriage_candidate.GetFirstName]. Before the families agree, the pair could exchange letters or meet with company. Or you could press ahead with the terms."
 dhm_saga.5000.letters:0 "Let Them Write to Each Other"
 dhm_saga.5000.meeting:0 "Let Them Meet Under Watch"
 dhm_saga.5000.seal:0 "Press for an Agreement"
 dhm_saga.5010.t:0 "Objections at the Marriage Table"
 dhm_saga.5010.desc:0 "The families of [dhm_marriage_subject.GetFirstName] and [dhm_marriage_candidate.GetFirstName] are close to an agreement. One dispute remains."
 dhm_saga.5010.faith:0 "\n\nPrayer, children, and burial customs have all been named. Neither side calls them small matters."
 dhm_saga.5010.culture:0 "\n\nTwo households expect different words, feasts, and duties from the same marriage."
 dhm_saga.5010.family:0 "\n\nThey disagree about gifts and which household should bear the expense. Both look to me to settle the terms."
 dhm_saga.5010.gifts:0 "Send Gifts and Soften the Dispute"
 dhm_saga.5010.promise:0 "Give Both Families My Word"
 dhm_saga.5010.terms:0 "These Are the Terms"
 dhm_saga.5020.t:0 "A Wedding for Two Families"
 dhm_saga.5020.desc:0 "[dhm_union_subject.GetFirstName] and [dhm_union_spouse.GetFirstName] are married. Both families now have opinions about the celebration: the food, the guests and whose customs should be honored."
 dhm_saga.5020.faith:0 "\n\nThey follow different faiths. A little care over the observances could spare an argument."
 dhm_saga.5020.culture:0 "\n\nEach family has brought its own wedding customs. Neither wants to feel unwelcome."
 dhm_saga.5020.same:0 "\n\nTheir customs are familiar, but the families still disagree about how much should be spent."
 dhm_saga.5020.feast:0 "Give Them a Worthy Wedding"
 dhm_saga.5020.customs:0 "Honor Both Families' Customs"
 dhm_saga.5020.modest:0 "Keep the Wedding Small"
 dhm_saga.5030.t:0 "One Year Beneath One Roof"
 dhm_saga.5030.desc:0 "A year has passed since [dhm_union_subject.GetFirstName] and [dhm_union_spouse.GetFirstName] began their married life. Their latest visit gives me a clearer sense of how they are getting on."
 dhm_saga.5030.warm:0 "\n\nThey listen to one another, and a small joke passes between them. They seem at ease together."
 dhm_saga.5030.cold:0 "\n\nThey answer politely, but neither looks at the other. Whatever has passed between them is still unresolved."
 dhm_saga.5030.steady:0 "\n\nThey are managing well enough. There are disagreements, as in most households, but neither asks me to intervene."
 dhm_saga.5030.honor:0 "Mark Their First Year with a Feast"
 dhm_saga.5030.independence:0 "Leave the Marriage to Them"

 dhm_saga.6000.t:0 "A Rumor Reaches the Hall"
 dhm_saga.6000.desc:0 "A complaint has reached the hall: [dhm_crisis_relative.GetShortUIName] spoke harshly to a household guest, and the quarrel has become common gossip.\n\n'I lost my temper,' [dhm_crisis_relative.GetFirstName] admits. 'But they are telling it worse than it was.'\n\nYou could defend your kin, demand a public apology, or offer gifts to settle the insult."
 dhm_saga.6000.shelter:0 "Stand Beside My Kin"
 dhm_saga.6000.rebuke:0 "Rebuke Them Before the Hall"
 dhm_saga.6000.restitution:0 "Send Gifts and an Apology"
 dhm_saga.6001.t:0 "When the Rumor Faded"
 dhm_saga.6001.shelter:0 "When the rumors spread, I sheltered [dhm_crisis_relative.GetFirstName]. The talk has died down.\n\n'You did not turn me out,' [dhm_crisis_relative.GetFirstName] says. 'I have not forgotten.'"
 dhm_saga.6001.rebuke:0 "I rebuked [dhm_crisis_relative.GetFirstName] before the household. The rumors have faded, but the public shame has not. We speak less freely now."
 dhm_saga.6001.restitution:0 "The apology has been accepted and the dispute has quieted. [dhm_crisis_relative.GetFirstName] can return to ordinary duties, though trust will take longer to mend."
 dhm_saga.6001.a:0 "Let This Be the End of the Scandal"
 dhm_saga.6100.t:0 "The Lesson That Fell Short"
 dhm_saga.6100.desc:0 "[dhm_former_student.GetShortUIName]'s education has ended poorly. The young adult is embarrassed to discuss it.\n\n'I tried. I know it was not enough.'\n\nFurther lessons may help, though useful service could teach what the schoolroom did not."
 dhm_saga.6100.study:0 "Pay for Further Study"
 dhm_saga.6100.duty:0 "Let Service Teach Them"
 dhm_saga.6100.accept:0 "Their Worth Is More Than One Lesson"
 dhm_saga.6101.t:0 "A Different Kind of Learning"
 dhm_saga.6101.study:0 "I paid for [dhm_former_student.GetFirstName] to study again after a poor education. The new lessons have helped.\n\n'I understand more now,' [dhm_former_student.GetFirstName] says. 'I wish I had asked for help sooner.'"
 dhm_saga.6101.duty:0 "I gave [dhm_former_student.GetFirstName] practical work after the disappointment in the schoolroom. It has brought confidence, though there is little time left for study."
 dhm_saga.6101.accept:0 "[dhm_former_student.GetFirstName] has found useful work suited to existing strengths. One poor education need not decide a whole life."
 dhm_saga.6101.a:0 "There Is Still Much to Learn"
 dhm_saga.6210.t:0 "An Empty Place at Supper"
 dhm_saga.6210.desc:0 "Since [dhm_deceased_relative.GetShortUIName] died, [dhm_mourner.GetFirstName] has been quiet at meals. Tonight the grief is hard to hide.\n\n'I keep thinking of things I meant to say.'"
 dhm_saga.6210.funeral:0 "Give Them a Proper Funeral"
 dhm_saga.6210.vigil:0 "Sit the Night Vigil Together"
 dhm_saga.6210.duty:0 "The Household Must Go On"
 dhm_saga.6211.t:0 "After the Mourning"
 dhm_saga.6211.funeral:0 "The household gathered to mourn, and I made sure [dhm_mourner.GetFirstName] was not left alone. The loss still hurts, but familiar company has helped.\n\n'Thank you for bringing everyone together.'"
 dhm_saga.6211.vigil:0 "I sat with [dhm_mourner.GetFirstName] through a difficult night. Since then, it has become easier for us to speak of the loss.\n\n'I did not need an answer. I needed someone to stay.'"
 dhm_saga.6211.duty:0 "[dhm_mourner.GetFirstName] has returned to household duties. The work is done, but grief still makes some days difficult. I should not mistake silence for recovery."
 dhm_saga.6211.a:0 "We Have Not Forgotten"
 dhm_saga.6300.t:0 "A Marriage in Trouble"
 dhm_saga.6300.desc:0 "[dhm_crisis_relative.GetFirstName] and [dhm_crisis_spouse.GetFirstName] have begun sending messages through servants rather than speaking.\n\n'Every conversation becomes an argument,' one tells you. The other looks away.\n\nThey are still married, but neither seems happy with the life they share."
 dhm_saga.6300.mediate:0 "Bring Them to the Same Table"
 dhm_saga.6300.distance:0 "Give Them Time Apart"
 dhm_saga.6300.duty:0 "Remind Them of Their Vows"
 dhm_saga.6301.t:0 "What Remained of the Vow"
 dhm_saga.6301.mediate:0 "I asked [dhm_crisis_relative.GetFirstName] and [dhm_crisis_spouse.GetFirstName] to speak honestly after their quarrel. They visit me together now.\n\n'We still argue,' one admits. 'But we hear each other out.'"
 dhm_saga.6301.distance:0 "I gave [dhm_crisis_relative.GetFirstName] and [dhm_crisis_spouse.GetFirstName] time apart. The quarrel has cooled, though they are less close than before."
 dhm_saga.6301.duty:0 "[dhm_crisis_relative.GetFirstName] and [dhm_crisis_spouse.GetFirstName] remain married and meet their duties. That is not the same as being happy together."
 dhm_saga.6301.a:0 "I Hope They Find Their Peace"

 dhm_saga.7000.t:0 "An Unhappy Household"
 dhm_saga.7000.desc:0 "Another family supper ends in silence. [dhm_mood_relative.GetFirstName] finally speaks.\n\n'We cannot keep pretending all is well. Let us say what troubles us, without being punished for it.'"
 dhm_saga.7000.truth:0 "Then Let Every Grievance Be Heard"
 dhm_saga.7000.order:0 "Enough. This Ends Now."
 dhm_saga.7010.t:0 "The Family Asks for Help"
 dhm_saga.7010.desc:0 "The household has been close of late. [dhm_mood_relative.GetFirstName] comes to you with a bundle of family requests.\n\n'They trust you to help. But you need not hear every matter yourself. Let some of us share the work.'"
 dhm_saga.7010.promise:0 "Bring Me Their Requests"
 dhm_saga.7010.rest:0 "Then Share the Work Among You"

 dhm_saga.8000.t:0 "Chapters Written by Choice"
 dhm_saga.8000.desc:0 "These chapters record the important decisions and outcomes your household has lived through."
 dhm_saga.chapter.first_command:0 "\n@skill_martial_icon! #bold The Heir's First Command#!"
 dhm_saga.chapter.heir_ready:0 "\n@child_icon! #bold The Measure of an Heir#!"
 dhm_saga.chapter.siblings_reconciled:0 "\n@friend_icon! #bold The Winter the Siblings Reconciled#!"
 dhm_saga.chapter.siblings_divided:0 "\n@rival_icon! #bold The Duties Kept Apart#!"
 dhm_saga.chapter.reconciliation:0 "\n@friend_icon! #bold The Door That Opened Again#!"
 dhm_saga.chapter.parent_heir:0 "\n@child_icon! #bold The Chair Beside the Ruler#!"
 dhm_saga.chapter.spouses_together:0 "\n@marriage_icon! #bold When We Stood Together for the Child#!"
 dhm_saga.chapter.marriage_saved:0 "\n@marriage_icon! #bold The Marriage That Saved Its Hearth#!"
 dhm_saga.chapter.marriage_freed:0 "\n@marriage_icon! #bold The Marriage Given Its Freedom#!"
 dhm_saga.chapter.officers_feud:0 "\n@skill_stewardship_icon! #bold The Quarrel of Two Officers#!"
 dhm_saga.chapter.officer_triumph:0 "\n@skill_stewardship_icon! #bold The Seal Well Earned#!"
