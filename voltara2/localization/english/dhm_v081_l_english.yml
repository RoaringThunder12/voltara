l_english:
 dhm081_school_diplomacy_a:0 "Let the Child Hear Both Guests."
 dhm081_school_diplomacy_b:0 "Have the Child Practise a Proper Welcome."
 dhm081_school_diplomacy_c:0 "Tutor, Show How Courtesy Can End a Quarrel."
 dhm081_school_martial_a:0 "Let the Child Send Scouts First."
 dhm081_school_martial_b:0 "Have the Child Defend the Crossing."
 dhm081_school_martial_c:0 "Tutor, Play the Enemy and Test the Plan."
 dhm081_school_stewardship_a:0 "Pay the Wages. Let the Child Find Savings Elsewhere."
 dhm081_school_stewardship_b:0 "Make the Child Balance the Accounts First."
 dhm081_school_stewardship_c:0 "Tutor, Explain Which Expenses Can Wait."
 dhm081_school_intrigue_a:0 "Let the Child Question the Messenger."
 dhm081_school_intrigue_b:0 "Have the Child Examine the Seal."
 dhm081_school_intrigue_c:0 "Tutor, Show How to Check the Letter's Story."
 dhm081_school_restore_trust:0 "I Spoke Too Harshly. Teach as You Think Best."
 dhm081_tutor_overruled_tt:0 "#N The tutor resents being overruled.#! For four years, this tutor will not accept another delegated schoolroom dilemma from you unless you first make amends. This does not dismiss the tutor or stop ordinary lessons."
 dhm081_trust_restored_tt:0 "#P The tutor will accept responsibility again.#! No skill bonus or delayed reward is awarded for the apology."
 dhm081_school_credit_tt:0 "The credit belongs to the child and tutor. Their rewards are listed below; #P no extra ruler skill bonus is claimed#!."
 dhm081_school_recovery_tt:0 "The help goes to the pupil. No ruler skill bonus is awarded for repairing the lesson."
 dhm081_callback_title:0 "The Child Remembered"
 dhm081_callback_desc:0 "[dhm_story_tutor.GetFirstName] sends a short note. 'Another disagreement, my liege—but this time [dhm_story_child.GetFirstName] asked to hear the explanation before answering. I thought you should know.'\n\nYour earlier patience was remembered. #P The child loses a little Stress; child and tutor gain Opinion of each other.#! No skill bonus is added."
 dhm081_officers_written_duties:0 "Enough. Put Each Officer's Duties in Writing."
 dhm081_officers_written_duties_tt:0 "#P Both officers stop feuding and leave this matter alone for five years.#! #N Each loses 5 Loyalty; you pay for the arrangement and lose Prestige.#! Their earlier rivalry is not erased. The report returns in 18 months."
 dhm081_marriage_remember_agreement:0 "Keep Your Earlier Agreement. I Will Step Back."
 dhm081_marriage_agreement_tt:0 "#P Both spouses gain Opinion of each other and lose a little Stress.#! #N Your public standing and household unity suffer slightly as you withdraw.#! Their next report comes in two years; privacy does not guarantee affection."
 dhm081_couple_settled_title:0 "No Summons Needed"
 dhm081_couple_settled_desc:0 "[dhm_crisis_relative.GetFirstName] sends word: 'We remembered what helped us before. We spoke privately, and there is no need to trouble you.'\n\n#P Both spouses lose Stress and gain +1 Opinion of each other for ten years.#! No gold is spent, no skill is awarded, and the settled marriage is left alone unless serious strain returns."
 dhm081_officer_result_title:0 "A Duty Well Kept"
 dhm081_steward_result_desc:0 "[dhm_story_officer.GetFirstName] lays the household accounts before you. 'Every entry in its place, my liege.'\n\n#P The Steward gains or renews Orderly Accounts (+1 Stewardship for two years).#! $dhm081_officer_receipt$"
 dhm081_matchmaker_result_desc:0 "[dhm_story_officer.GetFirstName] has put the household's marriage correspondence in order. 'The letters are ready, my liege. A willing match is another matter.'\n\n#P The Matchmaker gains or renews Careful Correspondence (+1 Diplomacy for two years).#! This report does not create a marriage. $dhm081_officer_receipt$"
 dhm081_tutor_result_desc:0 "[dhm_story_officer.GetFirstName] brings the lesson notes. 'The next lessons are prepared, my liege. Now we must see what the pupils make of them.'\n\n#P The Chief Tutor gains or renews Prepared Lessons (+1 Learning for two years).#! No child's education trait changes. $dhm081_officer_receipt$"
 dhm081_chronicler_result_desc:0 "[dhm_story_officer.GetFirstName] returns the household rolls, ordered and copied. 'No new deeds invented, my liege. Merely the old ones made easier to find.'\n\n#P The Chronicler gains or renews Ordered Records (+1 Learning for two years).#! This report adds no invented Chronicle chapter. $dhm081_officer_receipt$"
 dhm081_officer_receipt:0 "#P You gain Prestige and receive or renew Proven Household Service for three years; the officer gains up to 8 Loyalty.#! #N Proven Household Service increases your Stress gains by 10% while active. A Shy ruler also gains a little immediate Stress from the attention.#! Existing temporary bonuses do not stack; a later expiry is kept. An older bonus without a recorded expiry is preserved."
